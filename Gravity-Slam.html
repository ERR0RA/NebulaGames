<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON OVERDRIVE</title>
    <style>
        :root { --p1-color: #00d4ff; --p2-color: #ff0055; --ball-color: #fff; }
        body {
            margin: 0; background: #050505; color: white;
            font-family: 'Arial Black', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        #menu {
            position: absolute; z-index: 10; text-align: center;
            background: rgba(0,0,0,0.9); padding: 40px; border-radius: 20px;
            border: 4px solid #333; box-shadow: 0 0 40px rgba(0,0,0,1);
        }
        .scoreboard {
            position: absolute; top: 10px; display: none; font-size: 3rem; gap: 60px;
            z-index: 5; pointer-events: none; opacity: 0.8;
        }
        button {
            display: block; width: 250px; margin: 12px auto; padding: 15px;
            background: #111; color: #fff; border: 2px solid #444;
            cursor: pointer; font-size: 1rem; border-radius: 10px; transition: 0.2s;
        }
        button:hover { background: #fff; color: #000; transform: scale(1.05); }
        canvas { 
            background: #000; border: 6px solid #222; 
            display: none; touch-action: none; cursor: none;
        }
    </style>
</head>
<body>

    <div id="score-bar" class="scoreboard">
        <span style="color: var(--p2-color)" id="s2">0</span>
        <span style="color: var(--p1-color)" id="s1">0</span>
    </div>

    <div id="menu">
        <h1 style="margin-top:0; letter-spacing: 4px;">NEON OVERDRIVE</h1>
        <button onclick="boot('P_VS_B')">PLAYER VS BOT</button>
        <button onclick="boot('P_VS_P')">PLAYER VS PLAYER</button>
        <button onclick="boot('2P_VS_B')">2 PLAYERS VS BOT</button>
        <button onclick="boot('B_VS_B')">BOT VS BOT</button>
        <p style="font-size: 0.8rem; color: #666;">PC: Mouse/WASD | Mobile: Touch</p>
    </div>

    <canvas id="stage"></canvas>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const scoreBar = document.getElementById('score-bar');

    let mode = '';
    let p1Score = 0, p2Score = 0;
    let shake = 0;
    const players = [];
    const ball = { x: 400, y: 300, r: 14, vx: 0, vy: 0, trail: [] };
    const keys = {};

    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function boot(m) {
        mode = m;
        menu.style.display = 'none';
        canvas.style.display = 'block';
        scoreBar.style.display = 'flex';
        resize();
        spawn();
        loop();
    }

    function resize() {
        canvas.width = Math.min(window.innerWidth * 0.95, 600);
        canvas.height = Math.min(window.innerHeight * 0.85, 800);
    }

    class Striker {
        constructor(x, y, color, control, pos) {
            this.x = x; this.y = y; this.r = 30;
            this.vx = 0; this.vy = 0;
            this.color = color; this.control = control; this.pos = pos;
            this.targetX = x; this.targetY = y;
        }

        update() {
            let prevX = this.x, prevY = this.y;

            if (this.control === 'mouse') {
                this.x += (this.targetX - this.x) * 0.25;
                this.y += (this.targetY - this.y) * 0.25;
            } else if (this.control === 'keys') {
                const spd = 10;
                if (keys['KeyA'] || keys['ArrowLeft']) this.x -= spd;
                if (keys['KeyD'] || keys['ArrowRight']) this.x += spd;
                if (keys['KeyW'] || keys['ArrowUp']) this.y -= spd;
                if (keys['KeyS'] || keys['ArrowDown']) this.y += spd;
            } else if (this.control === 'bot') {
                this.x += (ball.x - this.x) * 0.12;
                let homeY = (this.pos === 'top') ? 100 : canvas.height - 100;
                this.y += (homeY - this.y) * 0.1;
            }

            // Calculate instantaneous velocity for collision physics
            this.vx = this.x - prevX;
            this.vy = this.y - prevY;

            // Constrain to Half-Court
            this.x = Math.max(this.r, Math.min(canvas.width - this.r, this.x));
            if (this.pos === 'top') {
                this.y = Math.max(this.r, Math.min(canvas.height/2 - this.r - 5, this.y));
            } else {
                this.y = Math.max(canvas.height/2 + this.r + 5, Math.min(canvas.height - this.r, this.y));
            }
        }

        draw() {
            ctx.shadowBlur = 20; ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    function spawn() {
        players.length = 0;
        ball.x = canvas.width/2; ball.y = canvas.height/2;
        ball.vx = (Math.random()-0.5)*10; ball.vy = 5;
        ball.trail = [];

        if (mode === 'P_VS_B') {
            players.push(new Striker(canvas.width/2, 600, '#00d4ff', 'mouse', 'bottom'));
            players.push(new Striker(canvas.width/2, 100, '#ff0055', 'bot', 'top'));
        } else if (mode === 'P_VS_P') {
            players.push(new Striker(canvas.width/2, 600, '#00d4ff', 'mouse', 'bottom'));
            players.push(new Striker(canvas.width/2, 100, '#ff0055', 'keys', 'top'));
        } else if (mode === '2P_VS_B') {
            players.push(new Striker(canvas.width/3, 600, '#00d4ff', 'mouse', 'bottom'));
            players.push(new Striker(2*canvas.width/3, 600, '#00ff88', 'keys', 'bottom'));
            players.push(new Striker(canvas.width/2, 100, '#ff0055', 'bot', 'top'));
        } else {
            players.push(new Striker(canvas.width/2, 600, '#00d4ff', 'bot', 'bottom'));
            players.push(new Striker(canvas.width/2, 100, '#ff0055', 'bot', 'top'));
        }
    }

    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        players.forEach(p => { if(p.control === 'mouse') { 
            p.targetX = e.clientX - rect.left; p.targetY = e.clientY - rect.top; 
        }});
    });

    canvas.addEventListener('touchmove', e => {
        const rect = canvas.getBoundingClientRect();
        const t = e.touches[0];
        players.forEach(p => { if(p.control === 'mouse') { 
            p.targetX = t.clientX - rect.left; p.targetY = t.clientY - rect.top; 
        }});
        e.preventDefault();
    }, {passive: false});

    function solveCollision(p, b) {
        let dx = b.x - p.x;
        let dy = b.y - p.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < p.r + b.r) {
            // Fix overlapping (Anti-phase)
            let overlap = (p.r + b.r) - dist;
            let nx = dx / dist; // Normal X
            let ny = dy / dist; // Normal Y
            b.x += nx * overlap;
            b.y += ny * overlap;

            // Transfer velocity
            let dot = b.vx * nx + b.vy * ny;
            b.vx = (b.vx - 2 * dot * nx) + p.vx * 0.8;
            b.vy = (b.vy - 2 * dot * ny) + p.vy * 0.8;
            
            // Limit speed for playability but keep it fast
            let speed = Math.sqrt(b.vx**2 + b.vy**2);
            if (speed > 25) { b.vx *= 0.8; b.vy *= 0.8; }
            
            shake = speed * 0.5;
        }
    }

    function loop() {
        // Screenshake effect
        let sx = (Math.random()-0.5) * shake;
        let sy = (Math.random()-0.5) * shake;
        ctx.setTransform(1,0,0,1,sx,sy);
        shake *= 0.9;

        ctx.fillStyle = 'rgba(5,5,5,0.2)';
        ctx.fillRect(0,0,canvas.width, canvas.height);

        // Center Line
        ctx.strokeStyle = '#222'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2); ctx.stroke();

        players.forEach(p => { p.update(); p.draw(); solveCollision(p, ball); });

        // Ball Physics + NO-PHASE CLAMPING
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vx *= 0.995; ball.vy *= 0.995; // Air resistance

        // Wall Bounces with strict clamping to prevent phasing
        if (ball.x <= ball.r) { ball.x = ball.r; ball.vx *= -1; }
        if (ball.x >= canvas.width - ball.r) { ball.x = canvas.width - ball.r; ball.vx *= -1; }

        // Goals
        if (ball.y < -50) { p1Score++; reset(); }
        else if (ball.y > canvas.height + 50) { p2Score++; reset(); }

        // Top/Bottom bounce if not in goal area
        if (ball.x < canvas.width/4 || ball.x > 3*canvas.width/4) {
            if (ball.y <= ball.r) { ball.y = ball.r; ball.vy *= -1; }
            if (ball.y >= canvas.height - ball.r) { ball.y = canvas.height - ball.r; ball.vy *= -1; }
        }

        // Draw Ball Trail
        ball.trail.push({x: ball.x, y: ball.y});
        if(ball.trail.length > 10) ball.trail.shift();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ball.trail.forEach(t => ctx.lineTo(t.x, t.y));
        ctx.stroke();

        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

        requestAnimationFrame(loop);
    }

    function reset() {
        document.getElementById('s1').innerText = p1Score;
        document.getElementById('s2').innerText = p2Score;
        spawn();
    }
</script>
</body>
</html>
