<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON OVERDRIVE: KINETIC</title>
    <style>
        :root { --p1-color: #00d4ff; --p2-color: #ff0055; --accent: #ffaa00; }
        body {
            margin: 0; background: #020202; color: white;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
            display: flex; align-items: center; justify-content: center; height: 100vh;
        }
        #ui-layer {
            position: absolute; width: 100%; height: 100%; 
            pointer-events: none; display: flex; flex-direction: column; align-items: center;
        }
        #menu {
            position: absolute; z-index: 100; text-align: center; pointer-events: all;
            background: rgba(5, 5, 10, 0.95); padding: 50px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
        }
        .scoreboard {
            margin-top: 20px; display: none; font-size: 4rem; gap: 100px;
            font-weight: 900; letter-spacing: -2px; italic;
        }
        button {
            display: block; width: 300px; margin: 15px auto; padding: 15px;
            background: linear-gradient(45deg, #111, #222); color: #fff; border: 1px solid #444;
            cursor: pointer; font-size: 1rem; border-radius: 5px; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 2px;
        }
        button:hover { background: #fff; color: #000; box-shadow: 0 0 30px var(--p1-color); }
        canvas { border-radius: 10px; cursor: none; box-shadow: 0 0 60px rgba(0,0,0,0.5); }
        #flash {
            position: absolute; width: 100%; height: 100%; background: white;
            opacity: 0; pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="flash"></div>
    <div id="ui-layer">
        <div id="score-bar" class="scoreboard">
            <span style="color: var(--p2-color)" id="s2">0</span>
            <span style="color: var(--p1-color)" id="s1">0</span>
        </div>
        <div id="menu">
            <h1 style="margin:0; font-size: 3rem; color: var(--p1-color);">NEON<br>OVERDRIVE</h1>
            <p style="color: #666; font-size: 0.8rem; margin-bottom: 30px;">PRO-PHYSICS EDITION</p>
            <button onclick="boot('P_VS_B')">1 Player (Mouse)</button>
            <button onclick="boot('P_VS_P')">2 Player (Local)</button>
            <button onclick="boot('B_VS_B')">Spectate AI</button>
        </div>
    </div>

    <canvas id="stage"></canvas>

<script>
    /** @type {HTMLCanvasElement} */
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const flash = document.getElementById('flash');
    
    // Configuration
    const CONFIG = {
        friction: 0.985,
        maxBallSpeed: 35,
        hitStopDuration: 0,
        goalWidth: 0, // Calculated later
        wallBounciness: 0.8
    };

    let p1Score = 0, p2Score = 0, shake = 0, gameTime = 0;
    let players = [], particles = [], trail = [];
    let ball = { x: 0, y: 0, r: 12, vx: 0, vy: 0 };
    const keys = {};

    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function boot(m) {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('score-bar').style.display = 'flex';
        resize();
        initGame(m);
        requestAnimationFrame(loop);
    }

    function resize() {
        canvas.width = 600;
        canvas.height = 850;
        CONFIG.goalWidth = canvas.width * 0.45;
    }

    class Striker {
        constructor(x, y, color, type, side) {
            this.x = x; this.y = y; this.r = 35;
            this.vx = 0; this.vy = 0;
            this.color = color; this.type = type; this.side = side;
            this.target = { x, y };
        }

        update() {
            let px = this.x, py = this.y;

            if (this.type === 'mouse') {
                this.x += (this.target.x - this.x) * 0.4;
                this.y += (this.target.y - this.y) * 0.4;
            } else if (this.type === 'keys') {
                const s = 15;
                if (keys['ArrowLeft']) this.x -= s;
                if (keys['ArrowRight']) this.x += s;
                if (keys['ArrowUp']) this.y -= s;
                if (keys['ArrowDown']) this.y += s;
            } else if (this.type === 'bot') {
                // Predictive AI
                let distToBall = Math.abs(ball.y - this.y);
                let aimX = ball.x + (ball.vx * (distToBall / 20));
                
                this.x += (aimX - this.x) * 0.12;
                
                let homeY = (this.side === 'top') ? 100 : canvas.height - 100;
                let activeRange = (this.side === 'top') ? ball.y < canvas.height * 0.5 : ball.y > canvas.height * 0.5;
                
                if (activeRange) {
                    this.y += (ball.y - this.y) * 0.2;
                } else {
                    this.y += (homeY - this.y) * 0.05;
                }
            }

            // Constrain
            this.x = Math.max(this.r, Math.min(canvas.width - this.r, this.x));
            if (this.side === 'top') {
                this.y = Math.max(this.r, Math.min(canvas.height / 2 - this.r - 5, this.y));
            } else {
                this.y = Math.max(canvas.height / 2 + this.r + 5, Math.min(canvas.height - this.r, this.y));
            }

            this.vx = this.x - px;
            this.vy = this.y - py;
        }

        draw() {
            ctx.save();
            ctx.shadowBlur = 20; ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.fill();
            // Inner ring
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.7, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    }

    function initGame(mode) {
        players = [];
        ball.x = canvas.width / 2; ball.y = canvas.height / 2;
        ball.vx = 0; ball.vy = 0;
        
        if (mode === 'P_VS_B') {
            players.push(new Striker(canvas.width/2, 700, '#00d4ff', 'mouse', 'bottom'));
            players.push(new Striker(canvas.width/2, 150, '#ff0055', 'bot', 'top'));
        } else if (mode === 'P_VS_P') {
            players.push(new Striker(canvas.width/2, 700, '#00d4ff', 'mouse', 'bottom'));
            players.push(new Striker(canvas.width/2, 150, '#ff0055', 'keys', 'top'));
        } else {
            players.push(new Striker(canvas.width/2, 700, '#00d4ff', 'bot', 'bottom'));
            players.push(new Striker(canvas.width/2, 150, '#ff0055', 'bot', 'top'));
        }
        
        // Initial kickoff
        setTimeout(() => { ball.vy = Math.random() > 0.5 ? 10 : -10; }, 1000);
    }

    function checkCollisions() {
        players.forEach(p => {
            let dx = ball.x - p.x;
            let dy = ball.y - p.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            let minRange = ball.r + p.r;

            if (distance < minRange) {
                // Resolution
                let angle = Math.atan2(dy, dx);
                ball.x = p.x + Math.cos(angle) * minRange;
                ball.y = p.y + Math.sin(angle) * minRange;

                // Physics Transfer
                let normalX = dx / distance;
                let normalY = dy / distance;
                let relativeVX = ball.vx - p.vx;
                let relativeVY = ball.vy - p.vy;
                let velAlongNormal = relativeVX * normalX + relativeVY * normalY;

                if (velAlongNormal < 0) {
                    let force = -1.5 * velAlongNormal;
                    ball.vx += force * normalX + (p.vx * 0.5);
                    ball.vy += force * normalY + (p.vy * 0.5);
                }

                // Effects
                let impact = Math.abs(ball.vx) + Math.abs(ball.vy);
                if (impact > 10) {
                    shake = impact * 0.5;
                    spawnParticles(ball.x, ball.y, p.color, impact);
                    if (impact > 25) hitStop(40);
                }
            }
        });

        // Walls
        if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -CONFIG.wallBounciness; }
        if (ball.x > canvas.width - ball.r) { ball.x = canvas.width - ball.r; ball.vx *= -CONFIG.wallBounciness; }

        // Goal logic
        let isGoalX = ball.x > (canvas.width - CONFIG.goalWidth)/2 && ball.x < (canvas.width + CONFIG.goalWidth)/2;
        
        if (ball.y < -ball.r) {
            if (isGoalX) score(1);
            else { ball.y = ball.r; ball.vy *= -1; }
        }
        if (ball.y > canvas.height + ball.r) {
            if (isGoalX) score(2);
            else { ball.y = canvas.height - ball.r; ball.vy *= -1; }
        }
    }

    function hitStop(ms) {
        CONFIG.hitStopDuration = ms;
    }

    function score(p) {
        if (p === 1) p1Score++; else p2Score++;
        document.getElementById('s1').innerText = p1Score;
        document.getElementById('s2').innerText = p2Score;
        
        flash.style.opacity = 1;
        shake = 40;
        initGame(players[0].type === 'bot' && players[1].type === 'bot' ? 'B_VS_B' : (players[1].type === 'keys' ? 'P_VS_P' : 'P_VS_B'));
    }

    function spawnParticles(x, y, color, count) {
        for(let i=0; i<count; i++) {
            particles.push({
                x, y,
                vx: (Math.random()-0.5) * count * 0.5,
                vy: (Math.random()-0.5) * count * 0.5,
                life: 1,
                color
            });
        }
    }

    function drawField() {
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 5;
        // Center Line
        ctx.beginPath(); ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2); ctx.stroke();
        // Circle
        ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 80, 0, Math.PI*2); ctx.stroke();
        // Goals
        ctx.strokeStyle = 'var(--p2-color)';
        ctx.strokeRect((canvas.width - CONFIG.goalWidth)/2, -5, CONFIG.goalWidth, 10);
        ctx.strokeStyle = 'var(--p1-color)';
        ctx.strokeRect((canvas.width - CONFIG.goalWidth)/2, canvas.height-5, CONFIG.goalWidth, 10);
    }

    function loop() {
        gameTime++;
        if (CONFIG.hitStopDuration > 0) {
            CONFIG.hitStopDuration -= 16;
            requestAnimationFrame(loop);
            return;
        }

        flash.opacity *= 0.8;
        flash.style.opacity = flash.opacity;

        // Physics
        players.forEach(p => p.update());
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vx *= CONFIG.friction;
        ball.vy *= CONFIG.friction;

        // Speed Cap
        let currSpeed = Math.sqrt(ball.vx**2 + ball.vy**2);
        if (currSpeed > CONFIG.maxBallSpeed) {
            ball.vx = (ball.vx / currSpeed) * CONFIG.maxBallSpeed;
            ball.vy = (ball.vy / currSpeed) * CONFIG.maxBallSpeed;
        }

        checkCollisions();

        // Rendering
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        if (shake > 0) {
            ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            shake *= 0.9;
        }

        drawField();

        // Particle System
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fillRect(p.x, p.y, 3, 3);
            if (p.life <= 0) particles.splice(i, 1);
        });
        ctx.globalAlpha = 1;

        // Trail Visual
        trail.push({x: ball.x, y: ball.y});
        if (trail.length > 10) trail.shift();
        ctx.beginPath();
        trail.forEach((pos, i) => {
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = `rgba(255,255,255,${i/10})`;
            ctx.lineWidth = i;
        });
        ctx.stroke();

        ballDraw();
        players.forEach(p => p.draw());

        requestAnimationFrame(loop);
    }

    function ballDraw() {
        ctx.save();
        ctx.shadowBlur = 15; ctx.shadowColor = '#fff';
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    }

    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        players.forEach(p => {
            if (p.type === 'mouse') {
                p.target.x = e.clientX - rect.left;
                p.target.y = e.clientY - rect.top;
            }
        });
    });

    resize();
</script>
</body>
</html>
