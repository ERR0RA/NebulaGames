<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON OVERDRIVE: FIXED</title>
    <style>
        :root { --p1-color: #00d4ff; --p2-color: #ff0055; }
        body {
            margin: 0; background: #050505; color: white;
            font-family: 'Arial Black', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        #menu {
            position: absolute; z-index: 10; text-align: center;
            background: rgba(0,0,0,0.9); padding: 40px; border-radius: 20px;
            border: 2px solid #333;
        }
        .scoreboard {
            position: absolute; top: 15px; display: none; font-size: 3rem; gap: 80px;
            z-index: 5; pointer-events: none; text-shadow: 0 0 20px currentColor;
        }
        button {
            display: block; width: 280px; margin: 15px auto; padding: 15px;
            background: #111; color: #fff; border: 2px solid #444;
            cursor: pointer; font-size: 1rem; border-radius: 10px;
        }
        canvas { background: #000; border: 4px solid #222; display: none; touch-action: none; }
        #msg { position: absolute; font-size: 4rem; display: none; z-index: 15; }
    </style>
</head>
<body>

    <div id="score-bar" class="scoreboard">
        <span style="color: var(--p2-color)" id="s2">0</span>
        <span style="color: var(--p1-color)" id="s1">0</span>
    </div>

    <div id="msg">GOAL!</div>

    <div id="menu">
        <h1 style="color: var(--p1-color);">NEON OVERDRIVE</h1>
        <button onclick="boot('P_VS_B')">PLAYER VS BOT</button>
        <button onclick="boot('B_VS_B')">BOT VS BOT</button>
    </div>

    <canvas id="stage"></canvas>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const scoreBar = document.getElementById('score-bar');

    let p1Score = 0, p2Score = 0;
    const players = [];
    const ball = { x: 0, y: 0, r: 14, vx: 0, vy: 0 };

    function boot(m) {
        menu.style.display = 'none';
        canvas.style.display = 'block';
        scoreBar.style.display = 'flex';
        canvas.width = 500;
        canvas.height = 700;
        spawn(m);
        loop();
    }

    class Striker {
        constructor(x, y, color, type, side) {
            this.x = x; this.y = y; this.r = 30;
            this.color = color; this.type = type; this.side = side;
            this.targetX = x; this.targetY = y;
        }

        update() {
            let prevX = this.x, prevY = this.y;

            if (this.type === 'mouse') {
                this.x += (this.targetX - this.x) * 0.3;
                this.y += (this.targetY - this.y) * 0.3;
            } else {
                // FIXED BOT LOGIC: Don't hold the ball infinite against walls
                let targetX = ball.x;
                let targetY = ball.y;

                // If ball is behind the bot, or too close to wall, bot repositions
                if (this.side === 'top' && ball.y < this.y) targetY = ball.y - 50;
                
                this.x += (targetX - this.x) * 0.15;
                
                let homeY = (this.side === 'top') ? 100 : 600;
                if ((this.side === 'top' && ball.y < 350) || (this.side === 'bottom' && ball.y > 350)) {
                    this.y += (targetY - this.y) * 0.2;
                } else {
                    this.y += (homeY - this.y) * 0.1;
                }
            }

            // Constraints
            this.x = Math.max(this.r, Math.min(canvas.width - this.r, this.x));
            if (this.side === 'top') this.y = Math.max(this.r, Math.min(340, this.y));
            else this.y = Math.max(360, Math.min(canvas.height - this.r, this.y));

            this.vx = this.x - prevX;
            this.vy = this.y - prevY;
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 15; ctx.shadowColor = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    function spawn(mode) {
        players.length = 0;
        ball.x = canvas.width/2; ball.y = canvas.height/2;
        ball.vx = (Math.random()-0.5)*10; ball.vy = 5;
        
        if (mode === 'P_VS_B') {
            players.push(new Striker(250, 600, '#00d4ff', 'mouse', 'bottom'));
            players.push(new Striker(250, 100, '#ff0055', 'bot', 'top'));
        } else {
            players.push(new Striker(250, 600, '#00d4ff', 'bot', 'bottom'));
            players.push(new Striker(250, 100, '#ff0055', 'bot', 'top'));
        }
    }

    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        players.forEach(p => { if(p.type === 'mouse') { p.targetX = e.clientX - rect.left; p.targetY = e.clientY - rect.top; }});
    });

    function loop() {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(0,0,canvas.width, canvas.height);

        // Center Line
        ctx.strokeStyle = '#333';
        ctx.beginPath(); ctx.moveTo(0, 350); ctx.lineTo(500, 350); ctx.stroke();

        players.forEach(p => {
            p.update(); p.draw();
            // Collision
            let dx = ball.x - p.x;
            let dy = ball.y - p.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < p.r + ball.r) {
                let angle = Math.atan2(dy, dx);
                ball.vx = Math.cos(angle) * 10 + p.vx;
                ball.vy = Math.sin(angle) * 10 + p.vy;
            }
        });

        ball.x += ball.vx; ball.y += ball.vy;
        ball.vx *= 0.99; ball.vy *= 0.99;

        // Wall Bounce
        if (ball.x < ball.r || ball.x > canvas.width - ball.r) {
            ball.vx *= -1;
            ball.x = ball.x < ball.r ? ball.r : canvas.width - ball.r;
        }

        // ANTI-CORNER STUCK LOGIC
        if (Math.abs(ball.vx) < 1 && Math.abs(ball.vy) < 1) {
            if (ball.x < 50 || ball.x > 450) ball.vx = (ball.x < 250 ? 3 : -3);
        }

        // Goals
        if (ball.y < 0) { p1Score++; spawn(); }
        if (ball.y > canvas.height) { p2Score++; spawn(); }
        
        document.getElementById('s1').innerText = p1Score;
        document.getElementById('s2').innerText = p2Score;

        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
