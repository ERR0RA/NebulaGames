<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRAVITY SLAM</title>
    <style>
        body {
            margin: 0; background: #050505; color: #fff;
            font-family: 'Arial Black', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        #ui {
            position: absolute; z-index: 5; text-align: center;
            background: rgba(0,0,0,0.8); padding: 30px; border-radius: 20px;
            border: 3px solid #444; box-shadow: 0 0 30px rgba(0,0,0,1);
        }
        .score-bar {
            position: absolute; top: 20px; display: none; font-size: 2.5rem; gap: 40px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        button {
            display: block; width: 100%; margin: 10px 0; padding: 15px;
            background: #222; color: #eee; border: 2px solid #555;
            cursor: pointer; font-weight: bold; border-radius: 8px; transition: 0.2s;
        }
        button:hover { background: #ff3e3e; transform: scale(1.05); }
        canvas { 
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            border: 5px solid #333; display: none; touch-action: none;
        }
        #goal-msg {
            position: absolute; font-size: 5rem; color: yellow; display: none;
            pointer-events: none; text-shadow: 0 0 20px orange;
        }
    </style>
</head>
<body>

    <div id="score-bar" class="score-bar">
        <span style="color: #ff3e3e" id="s2">0</span>
        <span style="color: #3e93ff" id="s1">0</span>
    </div>

    <div id="ui">
        <h1 style="letter-spacing: 5px; margin-top:0;">GRAVITY SLAM</h1>
        <button onclick="init('P_VS_B')">PLAYER VS BOT</button>
        <button onclick="init('P_VS_P')">PLAYER VS PLAYER</button>
        <button onclick="init('2P_VS_B')">CO-OP (2P) VS BOT</button>
        <button onclick="init('B_VS_B')">BOT VS BOT</button>
    </div>

    <div id="goal-msg">GOAL!</div>
    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const ui = document.getElementById('ui');
    const scoreBar = document.getElementById('score-bar');
    const goalMsg = document.getElementById('goal-msg');

    let mode = '';
    let p1Score = 0, p2Score = 0;
    const players = [];
    const ball = { x: 0, y: 0, r: 18, vx: 0, vy: 0, mass: 1.5 };
    const keys = {};

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function init(m) {
        mode = m;
        ui.style.display = 'none';
        canvas.style.display = 'block';
        scoreBar.style.display = 'flex';
        resize();
        resetGame();
        requestAnimationFrame(update);
    }

    function resize() {
        canvas.width = Math.min(window.innerWidth * 0.9, 800);
        canvas.height = Math.min(window.innerHeight * 0.7, 500);
    }

    class Player {
        constructor(x, y, color, type, id) {
            this.x = x; this.y = y; this.r = 25;
            this.vx = 0; this.vy = 0;
            this.color = color; this.type = type; this.id = id;
            this.accel = 0.8; this.fric = 0.92;
        }

        draw() {
            ctx.shadowBlur = 15; ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }

        update() {
            if (this.type === 'mouse') {
                let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                this.vx += dx * 0.05; this.vy += dy * 0.05;
            } else if (this.type === 'keys') {
                if (keys['KeyW']) this.vy -= this.accel;
                if (keys['KeyS']) this.vy += this.accel;
                if (keys['KeyA']) this.vx -= this.accel;
                if (keys['KeyD']) this.vx += this.accel;
            } else if (this.type === 'bot') {
                let tx = ball.x;
                let ty = (this.id === 'top') ? Math.min(ball.y, canvas.height/3) : Math.max(ball.y, 2*canvas.height/3);
                this.vx += (tx - this.x) * 0.03; this.vy += (ty - this.y) * 0.03;
            }

            this.vx *= this.fric; this.vy *= this.fric;
            this.x += this.vx; this.y += this.vy;

            // Bounds
            this.x = Math.max(this.r, Math.min(canvas.width - this.r, this.x));
            if (this.id === 'bottom') this.y = Math.max(canvas.height/2 + this.r, Math.min(canvas.height - this.r, this.y));
            else this.y = Math.max(this.r, Math.min(canvas.height/2 - this.r, this.y));
        }
    }

    const mouse = { x: 0, y: 0 };
    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
    });
    canvas.addEventListener('touchmove', e => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.touches[0].clientX - rect.left; mouse.y = e.touches[0].clientY - rect.top;
        e.preventDefault();
    }, {passive: false});

    function resetGame() {
        players.length = 0;
        ball.x = canvas.width/2; ball.y = canvas.height/2;
        ball.vx = 0; ball.vy = 0;

        if (mode === 'P_VS_B') {
            players.push(new Player(canvas.width/2, 400, '#3e93ff', 'mouse', 'bottom'));
            players.push(new Player(canvas.width/2, 100, '#ff3e3e', 'bot', 'top'));
        } else if (mode === 'P_VS_P') {
            players.push(new Player(canvas.width/2, 400, '#3e93ff', 'mouse', 'bottom'));
            players.push(new Player(canvas.width/2, 100, '#ff3e3e', 'keys', 'top'));
        } else if (mode === '2P_VS_B') {
            players.push(new Player(canvas.width/3, 400, '#3e93ff', 'mouse', 'bottom'));
            players.push(new Player(2*canvas.width/3, 400, '#00ff88', 'keys', 'bottom'));
            players.push(new Player(canvas.width/2, 100, '#ff3e3e', 'bot', 'top'));
        } else {
            players.push(new Player(canvas.width/2, 400, '#3e93ff', 'bot', 'bottom'));
            players.push(new Player(canvas.width/2, 100, '#ff3e3e', 'bot', 'top'));
        }
    }

    function checkCollision(p, b) {
        let dx = b.x - p.x; let dy = b.y - p.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < p.r + b.r) {
            let angle = Math.atan2(dy, dx);
            let force = (Math.abs(p.vx) + Math.abs(p.vy) + 5) * 0.7;
            b.vx = Math.cos(angle) * force;
            b.vy = Math.sin(angle) * force;
        }
    }

    function update() {
        ctx.clearRect(0,0,canvas.width, canvas.height);

        // Field markings
        ctx.strokeStyle = '#333'; ctx.lineWidth = 5;
        ctx.strokeRect(canvas.width/4, -10, canvas.width/2, 40); // Top Goal
        ctx.strokeRect(canvas.width/4, canvas.height-30, canvas.width/2, 40); // Bottom Goal

        players.forEach(p => {
            p.update(); p.draw();
            checkCollision(p, ball);
        });

        // Ball Physics
        ball.vx *= 0.99; ball.vy *= 0.99;
        ball.x += ball.vx; ball.y += ball.vy;

        if (ball.x < ball.r || ball.x > canvas.width - ball.r) ball.vx *= -1;
        
        // Scored?
        if (ball.y < 0 && ball.x > canvas.width/4 && ball.x < 3*canvas.width/4) score('p1');
        else if (ball.y > canvas.height && ball.x > canvas.width/4 && ball.x < 3*canvas.width/4) score('p2');
        else if (ball.y < ball.r || ball.y > canvas.height - ball.r) ball.vy *= -1;

        // Draw Ball
        ctx.fillStyle = '#fff'; ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;

        requestAnimationFrame(update);
    }

    function score(who) {
        if (who === 'p1') p1Score++; else p2Score++;
        document.getElementById('s1').innerText = p1Score;
        document.getElementById('s2').innerText = p2Score;
        goalMsg.style.display = 'block';
        setTimeout(() => { goalMsg.style.display = 'none'; resetGame(); }, 1000);
    }
</script>
</body>
</html>
