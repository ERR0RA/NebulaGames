<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURBO HORIZON | APEX DRIVE</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; cursor: none; }
        #game-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; color: white; display: flex; flex-direction: column; justify-content: space-between; padding: 30px;
        }
        .speedometer { font-size: 80px; font-style: italic; color: #00f2ff; text-shadow: 0 0 20px #00f2ff; line-height: 1; }
        .label { font-size: 14px; letter-spacing: 5px; opacity: 0.7; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; cursor: pointer;
        }
        h1 { color: #00f2ff; font-size: 50px; text-shadow: 0 0 30px #00f2ff; margin-bottom: 10px; }
        p { color: white; letter-spacing: 2px; }
        #nitro-container { width: 250px; height: 10px; background: rgba(255,255,255,0.1); border: 1px solid #00f2ff; margin-top: 10px; }
        #nitro-bar { width: 100%; height: 100%; background: #00f2ff; transition: width 0.1s; }
    </style>
</head>
<body>

    <div id="overlay" onclick="startGame()">
        <h1>TURBO HORIZON</h1>
        <p>CLICK TO START ENGINE</p>
        <p style="font-size: 12px; margin-top: 20px; opacity: 0.5;">WASD / ARROWS TO DRIVE | SHIFT FOR NITRO</p>
    </div>

    <div id="game-ui">
        <div>
            <div class="speedometer" id="spd">000</div>
            <div class="label">KM/H // LONDON SECTOR</div>
        </div>
        <div>
            <div class="label">NITROUS OXIDE</div>
            <div id="nitro-container"><div id="nitro-bar"></div></div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, car, carModel, road;
        let speed = 0, steer = 0, gameActive = false;
        let buildings = [];
        const keys = {};

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a001a, 0.004);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 4000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const sun = new THREE.DirectionalLight(0xffaa00, 2.5);
            sun.position.set(-100, 40, -50);
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0x4400ff, 0.3));

            // --- THE CAR (Website Quality) ---
            car = new THREE.Group();
            carModel = new THREE.Group();
            
            const paint = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: 0.05, clearcoat: 1 });
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.4, 4.6), paint);
            const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.75, 24, 24), new THREE.MeshBasicMaterial({color: 0x00f2ff}));
            cockpit.scale.set(1, 0.5, 1.3);
            cockpit.position.y = 0.35;
            
            const neon = new THREE.LineSegments(
                new THREE.EdgesGeometry(new THREE.BoxGeometry(2.15, 0.45, 4.65)),
                new THREE.LineBasicMaterial({ color: 0x00f2ff })
            );

            carModel.add(body, cockpit, neon);
            car.add(carModel);
            scene.add(car);

            // CAMERA ANCHOR (Locked to car)
            camera.position.set(0, 3, 9);
            car.add(camera);

            // --- THE ENVIRONMENT ---
            const roadGeo = new THREE.PlaneGeometry(50, 4000);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1 });
            road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            scene.add(road);

            const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, transmission: 0.8, transparent: true });
            for(let i=0; i<80; i++) {
                const h = 40 + Math.random() * 150;
                const b = new THREE.Mesh(new THREE.BoxGeometry(20, h, 20), glassMat);
                b.position.set(i % 2 === 0 ? 40 : -40, h/2, -i * 60);
                scene.add(b);
                buildings.push(b);
            }

            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
            window.addEventListener('resize', onWindowResize);
            
            animate();
        }

        window.startGame = function() {
            document.getElementById('overlay').style.display = 'none';
            gameActive = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if(!gameActive) return;

            // 1. INPUT HANDLING
            const drive = keys['KeyW'] || keys['ArrowUp'];
            const brake = keys['KeyS'] || keys['ArrowDown'];
            const nitro = keys['ShiftLeft'] || keys['ShiftRight'];
            const left = keys['KeyA'] || keys['ArrowLeft'];
            const right = keys['KeyD'] || keys['ArrowRight'];

            // 2. PHYSICS (Locked Steering & Gradual Accel)
            const accel = drive ? (nitro ? 0.04 : 0.02) : -0.05;
            const brakePower = brake ? -0.1 : 0;
            speed = Math.max(0, Math.min(speed + accel + brakePower, nitro ? 4.5 : 3.0));

            if (left) steer = THREE.MathUtils.lerp(steer, -0.05, 0.1);
            else if (right) steer = THREE.MathUtils.lerp(steer, 0.05, 0.1);
            else steer = THREE.MathUtils.lerp(steer, 0, 0.15);

            car.position.z -= speed * 10;
            car.position.x += steer * speed * 20;
            car.position.x = Math.max(-20, Math.min(20, car.position.x));

            // Body FX
            carModel.rotation.z = -steer * 4;
            carModel.rotation.y = steer * 0.4;
            
            // Camera Speed FX
            camera.fov = 65 + (speed * 4);
            camera.updateProjectionMatrix();

            // 3. INFINITE LOOP
            buildings.forEach(b => {
                if(b.position.z > car.position.z + 50) b.position.z -= 4800;
            });
            road.position.z = car.position.z - 1000; // Road follows car

            // 4. UI UPDATE
            document.getElementById('spd').innerText = Math.floor(speed * 90).toString().padStart(3, '0');
            document.getElementById('nitro-bar').style.width = nitro ? (Math.random()*10 + 20) + '%' : '100%';

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
