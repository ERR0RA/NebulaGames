<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Games | Core Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&family=Fira+Code:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.4);
            --bg: #030303;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --updating: #ffcc00;
            --error: #ff3366;
            --info: #00d9ff;
        }

        [data-theme="cyber"] { --primary: #ff00ff; --primary-glow: rgba(255, 0, 255, 0.4); }
        [data-theme="ocean"] { --primary: #00d9ff; --primary-glow: rgba(0, 217, 255, 0.4); }
        [data-theme="amber"] { --primary: #ffaa00; --primary-glow: rgba(255, 170, 0, 0.4); }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: crosshair;
        }

        /* --- BOOT SEQUENCE OVERLAY --- */
        #boot-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            font-family: 'Fira+Code', monospace;
            color: var(--primary);
            font-size: 0.8rem;
            overflow: hidden;
            transition: opacity 1s ease;
        }

        /* --- MATRIX CANVAS --- */
        #canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        /* --- CRT SCANLINES --- */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 9998;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        header { text-align: center; padding: 60px 20px 30px; perspective: 1000px; }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 900; margin: 0;
            letter-spacing: 12px;
            background: linear-gradient(to bottom, #fff 30%, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px var(--primary-glow));
            animation: glitch 5s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            1% { transform: translate(-2px, 2px); }
            2% { transform: translate(2px, -2px); }
            3% { transform: translate(0); }
        }

        .subtitle { color: var(--primary); opacity: 0.8; margin-top: 10px; font-size: 0.75rem; letter-spacing: 5px; text-transform: uppercase; font-family: 'Orbitron'; }

        .status-panel {
            width: 95%; max-width: 1100px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--card-border);
            border-radius: 4px; padding: 25px;
            margin-bottom: 30px; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px;
            backdrop-filter: blur(15px); box-sizing: border-box;
            box-shadow: inset 0 0 20px rgba(0,255,136, 0.05);
        }

        .status-item { display: flex; flex-direction: column; gap: 5px; border-left: 2px solid var(--primary); padding-left: 15px; }
        .status-label { font-family: 'Orbitron'; font-size: 0.55rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 2px; }
        .status-value { font-family: 'Fira Code', monospace; font-size: 0.9rem; font-weight: 500; text-shadow: 0 0 8px currentColor; }
        
        .theme-grid { display: flex; gap: 8px; margin-top: 5px; }
        .theme-btn { width: 18px; height: 18px; border: 1px solid #fff; cursor: pointer; transition: 0.3s; }
        .theme-btn:hover { transform: scale(1.3); box-shadow: 0 0 10px #fff; }

        .search-container { width: 95%; max-width: 1100px; margin-bottom: 25px; }
        #moduleSearch {
            width: 100%; background: #000; border: 1px solid var(--card-border);
            padding: 15px 20px; border-radius: 0; color: var(--primary); font-family: 'Fira Code';
            outline: none; transition: 0.3s; box-sizing: border-box;
            border-bottom: 2px solid var(--primary);
        }

        .link-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px; width: 95%; max-width: 1100px; margin-bottom: 50px;
            perspective: 1000px;
        }

        .game-link {
            position: relative; background: var(--card-bg);
            text-decoration: none; height: 100px;
            border: 1px solid var(--card-border);
            transition: transform 0.1s ease, box-shadow 0.3s ease; 
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .game-link:hover {
            border-color: var(--primary);
            box-shadow: 0 0 25px var(--primary-glow);
            z-index: 10;
        }

        .game-title { 
            font-family: 'Orbitron'; font-weight: 700; font-size: 0.85rem; 
            color: #fff; transform: translateZ(20px);
        }

        .badge { position: absolute; top: 0; left: 0; font-size: 0.5rem; padding: 4px 10px; font-weight: 900; background: var(--primary); color: #000; font-family: 'Orbitron'; }
        
        footer { padding: 50px; text-align: center; color: var(--primary); opacity: 0.3; font-size: 0.6rem; font-family: 'Fira Code'; }

    </style>
</head>
<body>

    <div id="boot-screen">
        <div id="boot-logs"></div>
    </div>

    <canvas id="canvas"></canvas>

    <header>
        <h1 id="main-title">Nebula Games</h1>
        <div class="subtitle">Neural Link Status: <span style="color:var(--primary)">ACTIVE</span></div>
    </header>

    <div class="status-panel">
        <div class="status-item" style="border:none">
            <span class="status-label">Local Time</span>
            <span id="system-clock" class="status-value">00:00:00</span>
        </div>
        <div class="status-item">
            <span class="status-label">Interface Skins</span>
            <div class="theme-grid">
                <div class="theme-btn" style="background:#00ff88" onclick="setTheme('default')"></div>
                <div class="theme-btn" style="background:#ff00ff" onclick="setTheme('cyber')"></div>
                <div class="theme-btn" style="background:#00d9ff" onclick="setTheme('ocean')"></div>
                <div class="theme-btn" style="background:#ffaa00" onclick="setTheme('amber')"></div>
            </div>
        </div>
        <div class="status-item">
            <span class="status-label">Packet Flow</span>
            <span id="packet-flow" class="status-value" style="color:var(--info)">0.00 kb/s</span>
        </div>
        <div class="status-item">
            <span class="status-label">Sub-Systems</span>
            <span id="active-count" class="status-value">-- READY</span>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="moduleSearch" placeholder="> QUERY SYSTEM MODULES..." onkeyup="filterGames()">
    </div>

    <div id="stable-container" class="link-container"></div>

    <script>
        // --- BOOT LOGIC ---
        const logData = [
            "Initializing Nebula BIOS v3.6.0...",
            "Loading Neural Core...",
            "Verifying Grid Certificates...",
            "Establishing Secure Tunnel...",
            "Decrypting Game Modules...",
            "Syncing with Operator DC...",
            "SYSTEM READY."
        ];
        
        const bootLogs = document.getElementById('boot-logs');
        let logIndex = 0;

        function runBoot() {
            if(logIndex < logData.length) {
                const p = document.createElement('p');
                p.textContent = `> ${logData[logIndex]}`;
                bootLogs.appendChild(p);
                logIndex++;
                setTimeout(runBoot, Math.random() * 400);
            } else {
                setTimeout(() => {
                    document.getElementById('boot-screen').style.opacity = '0';
                    setTimeout(() => document.getElementById('boot-screen').style.display = 'none', 1000);
                }, 500);
            }
        }
        runBoot();

        // --- GAME DATABASE ---
        const games = [
            { name: "Neon Cyber Strike", url: "Cyber-Strike.html", tag: "best" },
            { name: "Blockcraft", url: "blockcraft.html", tag: "upd" },
            { name: "Minesweeper", url: "minesweeper.html", tag: "best" },
            { name: "Neon Snake", url: "snake.html", tag: "best" },
            { name: "Master Armory", url: "masterarmory.html", tag: "best" },
            { name: "Neon Pong", url: "Neon-Pong.html", tag: "best" },
            { name: "Neon Slash", url: "Neon-Slash.html", tag: "" },
            { name: "Block Breaker", url: "blockbreaker.html", tag: "" },
            { name: "Neon Golf", url: "Neon-Golf.html", tag: "" },
            { name: "Neon Slamz", url: "Neon-Slams.html", tag: "" },
            { name: "Neon Trail", url: "neon-trail.html", tag: "" },
            { name: "Block Blast", url: "blockblast.html", tag: "" },
            { name: "Basketball", url: "basketball.html", tag: "" },
            { name: "Football", url: "football.html", tag: "" },
            { name: "Cricket", url: "cricket.html", tag: "" },
            { name: "Crossy Roads", url: "crossyroads.html", tag: "" },
            { name: "Drift", url: "drift.html", tag: "" },
            { name: "Eggshell (EGGVP)", url: "eggshell.html", tag: "upd" },
            { name: "Pacman", url: "pacman.html", tag: "" },
            { name: "Space Adventure", url: "spaceadventure.html", tag: "" },
            { name: "Tic Tac Toe", url: "tictactoe.html", tag: "" },
            { name: "Turbo Horizon", url: "turbohorizon.html", tag: "" },
            { name: "Neon Hex", url: "Neon-Hex.html", tag: "" }
        ];

        // --- MATRIX CORE ---
        let matrixColor = '#00ff88';
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        const fontSize = 12;
        const columns = width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = matrixColor;
            ctx.font = fontSize + "px 'Fira Code'";
            for (let i = 0; i < drops.length; i++) {
                const text = String.fromCharCode(0x30A0 + Math.random() * 96);
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);

        // --- THEME SELECTOR ---
        function setTheme(theme) {
            const root = document.documentElement;
            if(theme === 'default') {
                root.removeAttribute('data-theme');
                matrixColor = '#00ff88';
            } else {
                root.setAttribute('data-theme', theme);
                matrixColor = theme === 'cyber' ? '#ff00ff' : theme === 'ocean' ? '#00d9ff' : '#ffaa00';
            }
        }

        // --- 3D TILT EFFECT ---
        function handleTilt(e) {
            const link = e.currentTarget;
            const rect = link.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = (y - centerY) / 5;
            const rotateY = (centerX - x) / 5;

            link.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
        }

        function resetTilt(e) {
            e.currentTarget.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
        }

        // --- INITIALIZE INTERFACE ---
        function buildArcade() {
            const container = document.getElementById('stable-container');
            container.innerHTML = games.map(game => `
                <a href="${game.url}" class="game-link" data-name="${game.name.toLowerCase()}">
                    ${game.tag ? `<span class="badge">${game.tag.toUpperCase()}</span>` : ''}
                    <span class="game-title">${game.name}</span>
                </a>
            `).join('');
            
            document.querySelectorAll('.game-link').forEach(link => {
                link.addEventListener('mousemove', handleTilt);
                link.addEventListener('mouseleave', resetTilt);
            });
            
            document.getElementById('active-count').innerText = `${games.length} READY`;
        }

        // --- SYSTEM CLOCK & TRAFFIC ---
        setInterval(() => {
            const now = new Date();
            document.getElementById('system-clock').innerText = now.toTimeString().split(' ')[0];
            
            const flow = (Math.random() * 50).toFixed(2);
            document.getElementById('packet-flow').innerText = `${flow} kb/s`;
        }, 1000);

        function filterGames() {
            const input = document.getElementById('moduleSearch').value.toLowerCase();
            document.querySelectorAll('.game-link').forEach(link => {
                link.style.display = link.dataset.name.includes(input) ? "flex" : "none";
            });
        }

        window.onresize = () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        };

        buildArcade();
    </script>
</body>
</html>
