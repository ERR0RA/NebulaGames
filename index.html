<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula | The Future of Play</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.25);
            --bg: #020305;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.07);
            --text-main: #ffffff;
            --text-dim: #8e9196;
            --easing: cubic-bezier(0.2, 0, 0, 1);
        }

        [data-theme="cyber"] { --primary: #ff00ff; --primary-glow: rgba(255, 0, 255, 0.25); }
        [data-theme="ocean"] { --primary: #00d9ff; --primary-glow: rgba(0, 217, 255, 0.25); }
        [data-theme="amber"] { --primary: #ffaa00; --primary-glow: rgba(255, 170, 0, 0.25); }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 255, 136, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 217, 255, 0.05) 0px, transparent 50%);
        }

        /* --- NAVIGATION --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 25px 50px; position: sticky; top: 0; z-index: 1000;
            background: rgba(2, 3, 5, 0.7); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .brand { display: flex; align-items: center; gap: 15px; }
        .brand-logo { 
            width: 35px; height: 35px; background: var(--primary); 
            border-radius: 8px; box-shadow: 0 0 20px var(--primary-glow);
            transform: rotate(-15deg);
        }
        .brand h1 { font-size: 1.4rem; letter-spacing: 2px; font-weight: 800; }

        .user-pill {
            display: flex; align-items: center; gap: 12px;
            background: var(--glass); padding: 6px 18px;
            border-radius: 100px; border: 1px solid var(--glass-border);
            cursor: pointer; transition: 0.3s;
        }
        .user-pill:hover { background: var(--glass-hover); border-color: var(--primary); }

        /* --- HERO & SEARCH --- */
        header { padding: 80px 50px 40px; text-align: left; max-width: 1400px; margin: 0 auto; }
        header h2 { font-size: 3rem; font-weight: 800; margin-bottom: 10px; }
        header p { color: var(--text-dim); font-size: 1.1rem; }

        .search-container {
            position: relative; margin-top: 40px; max-width: 500px;
        }
        #moduleSearch {
            width: 100%; padding: 20px 60px;
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 16px; color: #fff; font-size: 1rem;
            outline: none; transition: 0.4s var(--easing);
        }
        #moduleSearch:focus { 
            border-color: var(--primary); background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        /* --- GAME GRID --- */
        .link-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px; padding: 40px 50px 150px;
            max-width: 1400px; margin: 0 auto;
        }

        .game-card {
            position: relative; text-decoration: none;
            background: var(--glass); border-radius: 24px;
            border: 1px solid var(--glass-border);
            aspect-ratio: 16 / 10; overflow: hidden;
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 25px; transition: 0.5s var(--easing);
        }

        /* The Realistic "Thumbnail" Background */
        .game-card::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(2,3,5,0.9) 0%, transparent 60%);
            z-index: 1;
        }
        
        /* Realistic Blur Reflection */
        .game-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        .game-info { position: relative; z-index: 2; }
        .game-title { font-weight: 800; font-size: 1.4rem; color: #fff; display: block; }
        .game-meta { 
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 10px; opacity: 0.6; font-size: 0.8rem; 
        }

        .score-pill {
            background: rgba(0,0,0,0.4); padding: 4px 12px;
            border-radius: 8px; font-family: 'Fira Code', monospace;
            color: var(--primary); border: 1px solid var(--primary-glow);
        }

        /* --- MODAL --- */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center;
            z-index: 2000; backdrop-filter: blur(20px);
        }
        .modal-card {
            background: #0a0c10; padding: 40px; border-radius: 32px;
            width: 90%; max-width: 420px; text-align: center;
            border: 1px solid var(--glass-border);
        }

        /* --- THEME CONTROLS --- */
        .dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(20px);
            padding: 12px 25px; border-radius: 100px;
            border: 1px solid var(--glass-border); display: flex; gap: 20px;
            z-index: 1000;
        }
        .theme-node {
            width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
            border: 3px solid transparent; transition: 0.3s;
        }
        .theme-node:hover { transform: scale(1.2); }
        .theme-node.active { border-color: #fff; }

    </style>
</head>
<body>

    <nav>
        <div class="brand">
            <div class="brand-logo"></div>
            <h1>NEBULA</h1>
        </div>
        <div class="user-pill" id="userAccount" onclick="toggleModal()">
            <span id="userName">GUEST_USER</span>
        </div>
    </nav>

    <header>
        <h2 id="greeting">Welcome Back</h2>
        <p>Ready to continue your session?</p>
        <div class="search-container">
            <input type="text" id="moduleSearch" placeholder="Filter library..." onkeyup="filterGames()">
        </div>
    </header>

    <div id="gameGrid" class="link-container">
        </div>

    <div class="dock">
        <div class="theme-node" style="background:#00ff88" onclick="setTheme('default', this)"></div>
        <div class="theme-node" style="background:#ff00ff" onclick="setTheme('cyber', this)"></div>
        <div class="theme-node" style="background:#00d9ff" onclick="setTheme('ocean', this)"></div>
        <div class="theme-node" style="background:#ffaa00" onclick="setTheme('amber', this)"></div>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-card">
            <h2>System Login</h2>
            <p style="color:var(--text-dim); margin-top:10px">Enter a callsign to save local metadata.</p>
            <input type="text" id="usernameInput" placeholder="Enter Username..." style="width:100%; padding:15px; margin:25px 0; border-radius:12px; border:1px solid #333; background:#000; color:#fff;">
            <button onclick="saveUser()" style="width:100%; padding:15px; border-radius:12px; border:none; background:var(--primary); font-weight:800; cursor:pointer;">INITIALIZE</button>
            <p style="margin-top:20px; font-size:0.8rem; cursor:pointer" onclick="logout()">LOGOUT / RESET</p>
        </div>
    </div>

    <script>
        const games = [
            { name: "Cyber Strike", cat: "Action", url: "Cyber-Strike.html" },
            { name: "Neon Snake", cat: "Arcade", url: "snake.html" },
            { name: "Minesweeper", cat: "Puzzle", url: "minesweeper.html" },
            { name: "Blockcraft", cat: "Creative", url: "blockcraft.html" },
            { name: "Master Armory", cat: "Shooter", url: "masterarmory.html" },
            { name: "Neon Pong", cat: "Sport", url: "Neon-Pong.html" },
            { name: "Neon Hex", cat: "Strategy", url: "Neon-Hex.html" }
        ];

        function buildGrid() {
            const grid = document.getElementById('gameGrid');
            const scores = JSON.parse(localStorage.getItem('nebula_scores')) || {};
            
            grid.innerHTML = games.map(game => {
                const best = scores[game.name] || 0;
                return `
                    <a href="${game.url}" class="game-card" data-name="${game.name.toLowerCase()}">
                        <div class="game-info">
                            <span class="game-title">${game.name}</span>
                            <div class="game-meta">
                                <span>${game.cat.toUpperCase()}</span>
                                <div class="score-pill">HIGH: ${best}</div>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function setTheme(t, el) {
            document.documentElement.setAttribute('data-theme', t);
            document.querySelectorAll('.theme-node').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if(t === 'default') document.documentElement.removeAttribute('data-theme');
        }

        function toggleModal() {
            const m = document.getElementById('loginModal');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        function saveUser() {
            const name = document.getElementById('usernameInput').value;
            if(name) {
                localStorage.setItem('nebula_user', name);
                location.reload();
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function init() {
            const user = localStorage.getItem('nebula_user');
            if(user) {
                document.getElementById('userName').innerText = user.toUpperCase();
                document.getElementById('greeting').innerText = `Welcome Back, ${user}`;
            }
            buildGrid();
        }

        function filterGames() {
            const q = document.getElementById('moduleSearch').value.toLowerCase();
            document.querySelectorAll('.game-card').forEach(card => {
                card.style.display = card.dataset.name.includes(q) ? 'flex' : 'none';
            });
        }

        init();
    </script>
</body>
</html>
