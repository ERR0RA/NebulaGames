<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA OS | v5.2 Quantum</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #00ff88;
            --primary-rgb: 0, 255, 136;
            --bg: #020305;
            --glass: rgba(15, 18, 24, 0.8);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        /* Dynamic Theme Classes */
        body.theme-green { --primary: #00ff88; --primary-rgb: 0, 255, 136; }
        body.theme-cyan { --primary: #00f2ff; --primary-rgb: 0, 242, 255; }
        body.theme-purple { --primary: #bf00ff; --primary-rgb: 191, 0, 255; }
        body.theme-red { --primary: #ff3333; --primary-rgb: 255, 51, 51; }
        body.theme-gold { --primary: #ffcc00; --primary-rgb: 255, 204, 0; }
        body.theme-pink { --primary: #ff0077; --primary-rgb: 255, 0, 119; }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: default; }
        
        body {
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            /* FIXED SCROLLING: Changed from hidden to allow layout to breathe */
            overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
        }

        .desktop-bg {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at bottom right, rgba(var(--primary-rgb), 0.07), transparent 60%);
        }

        /* --- TASKBAR --- */
        nav {
            height: 60px; padding: 0 25px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px); background: var(--glass); z-index: 100;
            flex-shrink: 0;
        }
        
        .sys-status { display: flex; align-items: center; gap: 15px; font-size: 0.85rem; }
        .support-link { color: var(--primary); text-decoration: none; font-size: 0.7rem; font-weight: 800; letter-spacing: 1px; }

        /* --- MAIN SCROLLABLE AREA --- */
        .main-stage {
            flex: 1; 
            overflow-y: auto; /* ENABLED SCROLLING */
            padding: 20px;
            scroll-behavior: smooth;
        }

        .search-container {
            width: 100%; max-width: 500px; margin: 40px auto; position: sticky; top: 0; z-index: 10;
        }

        .os-input {
            width: 100%; padding: 16px 25px; border-radius: 12px;
            background: #0f1218; border: 1px solid var(--border);
            color: white; font-size: 0.9rem; outline: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* --- GRID ENGINE --- */
        .grid-engine {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 25px; max-width: 1100px; margin: 0 auto 100px;
        }

        .app-icon {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            padding: 20px; border-radius: 20px; transition: 0.3s;
            text-decoration: none; color: inherit;
        }

        .app-icon:hover {
            background: rgba(var(--primary-rgb), 0.1);
            transform: translateY(-5px);
        }

        .icon-visual {
            width: 64px; height: 64px; border-radius: 18px;
            background: #161b22; display: flex; align-items: center; justify-content: center;
            color: var(--primary); border: 1px solid var(--border);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .app-label { font-size: 0.75rem; font-weight: 600; text-align: center; }

        /* --- SYSTEM DRAWER --- */
        .sys-drawer {
            position: fixed; right: -400px; top: 0; width: 350px; height: 100%;
            background: #05070a; border-left: 1px solid var(--border); transition: 0.4s ease;
            padding: 40px; z-index: 200; box-shadow: -20px 0 40px rgba(0,0,0,0.5);
        }
        .sys-drawer.open { right: 0; }

        .color-palette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .color-opt { height: 40px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .color-opt:hover { transform: scale(1.05); }

        .btn-prime {
            width: 100%; padding: 15px; border-radius: 10px; border: none;
            background: var(--primary); color: #000; font-weight: 800; cursor: pointer; margin-top: 10px;
        }

        /* Scrollbar Styling */
        .main-stage::-webkit-scrollbar { width: 8px; }
        .main-stage::-webkit-scrollbar-track { background: transparent; }
        .main-stage::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .main-stage::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    </style>
</head>
<body class="theme-green">
    <div class="desktop-bg"></div>

    <nav>
        <div class="sys-status">
            <div style="font-weight: 800;">NEBULA<span style="color:var(--primary)">.OS</span></div>
            <a href="https://forms.cloud.microsoft/Pages/DesignPageV2.aspx?prevorigin=Marketing&origin=NeoPortalPage&subpage=design&id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAN__4XhIPhUOE9XTUQ5QVIxT05ZVEZONUhXREZTVjgxRC4u" target="_blank" class="support-link">SUPPORT_PORTAL</a>
        </div>
        <div class="sys-status">
            <div id="sysTime" style="font-family: 'Fira Code';">00:00:00</div>
            <button onclick="Kernel.ui.toggleSys()" style="background:transparent; border:none; color:white; cursor:pointer;">
                <i data-lucide="menu"></i>
            </button>
        </div>
    </nav>

    <main class="main-stage">
        <div class="search-container">
            <input type="text" id="appSearch" class="os-input" placeholder="Search modules..." onkeyup="Kernel.ui.search()">
        </div>

        <div id="grid" class="grid-engine"></div>
    </main>

    <div id="drawer" class="sys-drawer">
        <h2 style="margin-bottom: 10px;">Settings</h2>
        <p style="font-size: 0.7rem; color: var(--text-dim); margin-bottom: 30px;">SYSTEM CONFIGURATION v5.2</p>
        
        <div style="margin-bottom: 30px;">
            <p style="font-size: 0.65rem; font-weight: 800; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase;">Accent Color</p>
            <div class="color-palette">
                <div class="color-opt" onclick="Kernel.ui.setTheme('green')" style="background:#00ff88;"></div>
                <div class="color-opt" onclick="Kernel.ui.setTheme('cyan')" style="background:#00f2ff;"></div>
                <div class="color-opt" onclick="Kernel.ui.setTheme('purple')" style="background:#bf00ff;"></div>
                <div class="color-opt" onclick="Kernel.ui.setTheme('red')" style="background:#ff3333;"></div>
                <div class="color-opt" onclick="Kernel.ui.setTheme('gold')" style="background:#ffcc00;"></div>
                <div class="color-opt" onclick="Kernel.ui.setTheme('pink')" style="background:#ff0077;"></div>
            </div>
        </div>

        <p style="font-size: 0.65rem; font-weight: 800; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase;">External</p>
        <button class="btn-prime" onclick="window.open('https://forms.cloud.microsoft/Pages/DesignPageV2.aspx?prevorigin=Marketing&origin=NeoPortalPage&subpage=design&id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAN__4XhIPhUOE9XTUQ5QVIxT05ZVEZONUhXREZTVjgxRC4u')">OPEN SUPPORT</button>
        <button class="btn-prime" style="background: #222; color: #fff;" onclick="Kernel.ui.toggleSys()">CLOSE</button>
    </div>

    <script>
        const Kernel = {
            apps: [
                { n: "Cyber Strike", f: "Cyber-Strike.html", i: "zap" },
                { n: "Neon Golf", f: "Neon-Golf.html", i: "target" },
                { n: "Neon Hex", f: "Neon-Hex.html", i: "hexagon" },
                { n: "Neon Pong", f: "Neon-Pong.html", i: "activity" },
                { n: "Neon Slams", f: "Neon-Slams.html", i: "dribbble" },
                { n: "Neon Slash", f: "Neon-Slash.html", i: "sword" },
                { n: "AI Core", f: "ai.html", i: "bot" },
                { n: "Basketball", f: "basketball.html", i: "circle" },
                { n: "Block Blast", f: "blockblast.html", i: "grid" },
                { n: "Block Breaker", f: "blockbreaker.html", i: "layers" },
                { n: "Block Craft", f: "blockcraft.html", i: "box" },
                { n: "Cricket", f: "cricket.html", i: "trophy" },
                { n: "Drift King", f: "drift.html", i: "navigation-2" },
                { n: "Football", f: "football.html", i: "award" },
                { n: "Master Armory", f: "masterarmory.html", i: "shield" },
                { n: "Minesweeper", f: "minesweeper.html", i: "bomb" },
                { n: "Neon Trail", f: "neon-trail.html", i: "wind" },
                { n: "Overdrive", f: "overdrive.html", i: "gauge" },
                { n: "Reader", f: "reader.html", i: "book-open" },
                { n: "Snake Pro", f: "snake.html", i: "trending-up" },
                { n: "AI 2", f: "Ai2.html", i: "cpu" },
                { n: "Space Adventure", f: "spaceadventure.html", i: "rocket" },
                { n: "Sparks Maths", f: "sparksmaths.html", i: "divide" },
                { n: "Tic Tac Toe", f: "tictactoe.html", i: "x" }
            ],

            ui: {
                init() {
                    this.render();
                    this.startClock();
                    lucide.createIcons();
                    const savedTheme = localStorage.getItem('neb_theme') || 'green';
                    this.setTheme(savedTheme);
                },
                render() {
                    const grid = document.getElementById('grid');
                    grid.innerHTML = Kernel.apps.map(app => `
                        <a href="${app.f}" class="app-icon" data-name="${app.n.toLowerCase()}">
                            <div class="icon-visual"><i data-lucide="${app.i}"></i></div>
                            <div class="app-label">${app.n}</div>
                        </a>
                    `).join('');
                },
                startClock() {
                    setInterval(() => {
                        document.getElementById('sysTime').innerText = new Date().toLocaleTimeString();
                    }, 1000);
                },
                search() {
                    const q = document.getElementById('appSearch').value.toLowerCase();
                    document.querySelectorAll('.app-icon').forEach(icon => {
                        icon.style.display = icon.dataset.name.includes(q) ? 'flex' : 'none';
                    });
                },
                toggleSys() { document.getElementById('drawer').classList.toggle('open'); },
                setTheme(t) {
                    document.body.className = `theme-${t}`;
                    localStorage.setItem('neb_theme', t);
                }
            }
        };

        window.onload = () => Kernel.ui.init();
    </script>
</body>
</html>
