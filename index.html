<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula | Ultra Cloud Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.3);
            --bg: #030406;
            --card-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        [data-theme="cyber"] { --primary: #ff00ff; --primary-glow: rgba(255, 0, 255, 0.3); }
        [data-theme="ocean"] { --primary: #00d9ff; --primary-glow: rgba(0, 217, 255, 0.3); }
        [data-theme="amber"] { --primary: #ffaa00; --primary-glow: rgba(255, 170, 0, 0.3); }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background Elements */
        .bg-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0a0c10 0%, #030406 100%);
        }

        .orb {
            position: absolute;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: var(--primary);
            filter: blur(120px);
            opacity: 0.15;
            animation: float 20s infinite alternate ease-in-out;
            transition: background 0.8s ease;
        }
        .orb-1 { top: -100px; left: -100px; }
        .orb-2 { bottom: -100px; right: -100px; animation-delay: -5s; opacity: 0.1; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.1); }
        }

        /* Navigation */
        nav {
            width: 100%; padding: 30px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-area h1 {
            font-size: 1.8rem; font-weight: 800; margin: 0;
            letter-spacing: -1px; background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Search Bar Improvements */
        .search-container {
            width: 90%; max-width: 500px; margin: 40px 0 60px;
            position: relative;
        }

        #moduleSearch {
            width: 100%; padding: 22px 35px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            color: #fff; font-size: 1rem;
            outline: none; backdrop-filter: blur(20px);
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        #moduleSearch:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--primary);
            box-shadow: 0 0 40px var(--primary-glow);
            transform: scale(1.02);
        }

        /* Professional Grid */
        .link-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px; width: 90%; max-width: 1200px;
            padding-bottom: 100px;
        }

        .game-link {
            position: relative; text-decoration: none;
            background: var(--card-bg);
            height: 160px; border-radius: 28px;
            border: 1px solid var(--glass-border);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden; transition: var(--transition);
        }

        .game-link::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0.5s;
        }

        .game-link:hover {
            transform: translateY(-12px) scale(1.02);
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px var(--primary-glow);
        }

        .game-link:hover::before { left: 150%; }

        .game-title {
            font-weight: 700; font-size: 1.2rem; color: #fff;
            margin-bottom: 8px; transition: var(--transition);
        }

        .high-score-tag {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem; color: var(--primary);
            opacity: 0.8; letter-spacing: 1px;
        }

        .badge {
            position: absolute; top: 15px; right: 15px;
            font-size: 0.65rem; font-weight: 800;
            padding: 5px 12px; border-radius: 50px;
            background: var(--primary); color: #000;
            box-shadow: 0 4px 10px var(--primary-glow);
        }

        /* Account Buttons */
        .acc-group { display: flex; gap: 12px; }
        .btn-base {
            padding: 12px 24px; border-radius: 100px; border: 1px solid var(--glass-border);
            font-weight: 600; cursor: pointer; transition: var(--transition);
            backdrop-filter: blur(10px); font-size: 0.85rem;
        }
        
        .btn-join { background: var(--primary); color: #000; border: none; }
        .btn-join:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--primary-glow); }
        
        .btn-logout { background: rgba(255, 50, 50, 0.1); color: #ff5555; display: none; }
        .btn-logout:hover { background: #ff5555; color: #fff; }

        /* Bottom Controls */
        .controls-bar {
            position: fixed; bottom: 30px;
            display: flex; gap: 15px; align-items: center;
            background: rgba(0,0,0,0.5); padding: 10px;
            border-radius: 100px; border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
        }

        .theme-dot {
            width: 24px; height: 24px; border-radius: 50%;
            cursor: pointer; border: 2px solid transparent;
            transition: 0.3s;
        }
        .theme-dot:hover { transform: scale(1.2); border-color: #fff; }

        /* Modal Overhaul */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(15px);
        }

        .modal-card {
            background: #0a0c10; padding: 40px; border-radius: 32px;
            width: 90%; max-width: 400px; border: 1px solid var(--glass-border);
            text-align: center; animation: modalIn 0.4s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        input[type="text"] {
            width: 100%; padding: 15px 20px; margin: 20px 0;
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            border-radius: 15px; color: #fff; outline: none;
        }
    </style>
</head>
<body>

    <div class="bg-wrapper">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <nav>
        <div class="logo-area">
            <h1>NEBULA</h1>
        </div>
        <div class="acc-group">
            <button id="userBtn" class="btn-base btn-join" onclick="toggleModal()">JOIN NETWORK</button>
            <button id="logoutBtn" class="btn-base btn-logout" onclick="logout()">EXIT</button>
        </div>
    </nav>

    <div class="search-container">
        <input type="text" id="moduleSearch" placeholder="Search the library..." onkeyup="filterGames()">
    </div>

    <div id="gameGrid" class="link-container">
        </div>

    <div id="loginModal" class="modal">
        <div class="modal-card">
            <h2 style="margin-top:0">Initialize Profile</h2>
            <p style="color: var(--text-dim)">Your scores will be synced to this browser's local cache.</p>
            <input type="text" id="usernameInput" placeholder="Enter Pilot Name...">
            <button class="btn-base btn-join" style="width:100%" onclick="saveUser()">SYNC DATA</button>
            <p style="margin-top: 20px; font-size: 0.8rem; cursor: pointer; opacity: 0.5" onclick="toggleModal()">Cancel</p>
        </div>
    </div>

    <div class="controls-bar">
        <div class="theme-dot" style="background:#00ff88" onclick="setTheme('default')"></div>
        <div class="theme-dot" style="background:#ff00ff" onclick="setTheme('cyber')"></div>
        <div class="theme-dot" style="background:#00d9ff" onclick="setTheme('ocean')"></div>
        <div class="theme-dot" style="background:#ffaa00" onclick="setTheme('amber')"></div>
    </div>

    <script>
        const games = [
            { name: "Neon Cyber Strike", url: "Cyber-Strike.html", tag: "best" },
            { name: "Blockcraft", url: "blockcraft.html", tag: "upd" },
            { name: "Minesweeper", url: "minesweeper.html", tag: "best" },
            { name: "Neon Snake", url: "snake.html", tag: "best" },
            { name: "Master Armory", url: "masterarmory.html", tag: "best" },
            { name: "Neon Pong", url: "Neon-Pong.html", tag: "best" },
            { name: "Neon Slash", url: "Neon-Slash.html", tag: "" },
            { name: "Block Breaker", url: "blockbreaker.html", tag: "" },
            { name: "Neon Golf", url: "Neon-Golf.html", tag: "" },
            { name: "Neon Slamz", url: "Neon-Slams.html", tag: "" },
            { name: "Neon Trail", url: "neon-trail.html", tag: "" },
            { name: "Block Blast", url: "blockblast.html", tag: "" },
            { name: "Neon Run", url: "ai.html", tag: "" },
            { name: "Basketball", url: "basketball.html", tag: "" },
            { name: "Football", url: "football.html", tag: "" },
            { name: "Cricket", url: "cricket.html", tag: "" },
            { name: "Crossy Roads", url: "crossyroads.html", tag: "" },
            { name: "Drift", url: "drift.html", tag: "" },
            { name: "Eggshell (EGGVP)", url: "eggshell.html", tag: "upd" },
            { name: "Overdrive", url: "overdrive.html", tag: "" },
            { name: "Pacman", url: "pacman.html", tag: "" },
            { name: "Space Adventure", url: "spaceadventure.html", tag: "" },
            { name: "Tic Tac Toe", url: "tictactoe.html", tag: "" },
            { name: "Turbo Horizon", url: "turbohorizon.html", tag: "" },
            { name: "Neon Hex", url: "Neon-Hex.html", tag: "" }
        ];

        function buildArcade() {
            const grid = document.getElementById('gameGrid');
            const scores = JSON.parse(localStorage.getItem('nebula_scores')) || {};
            
            grid.innerHTML = games.map(game => {
                const highScore = scores[game.name] || '0';
                return `
                    <a href="${game.url}" class="game-link" data-name="${game.name.toLowerCase()}">
                        ${game.tag ? `<span class="badge">${game.tag}</span>` : ''}
                        <span class="game-title">${game.name}</span>
                        <span class="high-score-tag">MAX_SCORE: ${highScore}</span>
                    </a>
                `;
            }).join('');
        }

        function toggleModal() {
            const m = document.getElementById('loginModal');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        function saveUser() {
            const val = document.getElementById('usernameInput').value.trim();
            if(val) {
                localStorage.setItem('nebula_user', val);
                location.reload();
            }
        }

        function checkUser() {
            const user = localStorage.getItem('nebula_user');
            if(user) {
                document.getElementById('userBtn').innerText = user.toUpperCase();
                document.getElementById('userBtn').style.background = "rgba(255,255,255,0.05)";
                document.getElementById('userBtn').style.color = "#fff";
                document.getElementById('logoutBtn').style.display = "block";
            }
        }

        function logout() {
            localStorage.removeItem('nebula_user');
            location.reload();
        }

        function setTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            if(t === 'default') document.documentElement.removeAttribute('data-theme');
        }

        function filterGames() {
            const query = document.getElementById('moduleSearch').value.toLowerCase();
            document.querySelectorAll('.game-link').forEach(card => {
                const isMatch = card.dataset.name.includes(query);
                card.style.display = isMatch ? 'flex' : 'none';
                if(isMatch) {
                    card.style.animation = 'modalIn 0.3s ease-out';
                }
            });
        }

        // Init
        buildArcade();
        checkUser();
    </script>
</body>
</html>
