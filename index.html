<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA | Gaming OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --bg: #050608;
            --surface: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --danger: #ff4444;
            --warning: #ffaa00;
        }

        /* Themes */
        body.theme-red { --primary: #ff4444; }
        body.theme-blue { --primary: #00d9ff; }
        body.theme-yellow { --primary: #ffcc00; }
        body.theme-green { --primary: #00ff88; }
        body.theme-orange { --primary: #ff8800; }
        body.theme-pink { --primary: #ff00bb; }
        body.theme-purple { --primary: #a855f7; }
        body.theme-teal { --primary: #14b8a6; }
        body.theme-white { --primary: #ffffff; }
        body.theme-lime { --primary: #bef264; }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, var(--primary), transparent 50%), radial-gradient(circle at 100% 100%, var(--primary), transparent 30%);
            opacity: 0.15; filter: blur(80px); z-index: -1; animation: pulse 10s infinite alternate;
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.1; } 100% { transform: scale(1.1); opacity: 0.2; } }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(5, 6, 8, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .nav-link { font-size: 0.7rem; color: var(--text-dim); cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; padding: 10px 15px; text-decoration: none; }
        
        .theme-selector { display: flex; gap: 6px; align-items: center; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 30px; border: 1px solid var(--border); flex-wrap: wrap; max-width: 280px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,0.3); transition: 0.2s; }
        .dot:hover { transform: scale(1.2); }

        #devPanel { position: fixed; top: 0; left: -100%; width: 100%; max-width: 850px; height: 100vh; background: #0a0c10; border-right: 1px solid var(--border); z-index: 4000; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); padding: 30px; overflow-y: auto; }
        #devPanel.active { left: 0; box-shadow: 20px 0 50px #000; }
        .admin-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
        .admin-table th { text-align: left; color: var(--text-dim); padding: 10px; border-bottom: 1px solid var(--border); }
        .admin-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.02); }
        
        .ban-btn { padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: #fff; font-size: 0.6rem; font-weight: 800; cursor: pointer; margin: 2px; transition: 0.2s; }
        .ban-btn.danger { border-color: var(--danger); color: var(--danger); }
        .ban-btn.success { border-color: var(--primary); color: var(--primary); }
        .ban-btn:hover { background: rgba(255,255,255,0.1); }

        .search-container { padding: 60px 5% 20px; text-align: center; }
        #moduleSearch { width: 100%; max-width: 600px; padding: 20px; border-radius: 20px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: #fff; text-align: center; font-size: 1rem; }
        #moduleSearch:focus { outline: none; border-color: var(--primary); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; padding: 40px 5% 100px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 30px; text-decoration: none; color: white; text-align: center; font-weight: 800; transition: 0.3s; }
        .card:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        .modal { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 90%; max-width: 400px; padding: 50px; background: #0d1117; border-radius: 40px; text-align: center; border: 1px solid var(--border); }
        .auth-field { width: 100%; padding: 18px; margin-top: 15px; border-radius: 15px; border: 1px solid #222; background: #050608; color: #fff; text-align: center; }
    </style>
</head>
<body class="theme-green">

    <div class="bg-mesh"></div>

    <div id="devPanel">
        <h2 style="color: var(--primary); margin-bottom: 5px;">SYSTEM OVERSEER</h2>
        <p style="font-size: 0.7rem; color: var(--text-dim); margin-bottom: 25px;">Full Access Terminal</p>
        
        <div class="admin-card">
            <h3>USER DATABASE</h3>
            <table class="admin-table">
                <thead><tr><th>USER</th><th>IP ADDRESS</th><th>DEVICE ID</th><th>ACTIONS</th></tr></thead>
                <tbody id="userRows"></tbody>
            </table>
        </div>

        <div class="admin-card">
            <h3 style="color:var(--danger)">ACTIVE BLACKLIST (ACC/IP/DEV)</h3>
            <div id="blacklistLog" style="margin-top: 15px;"></div>
        </div>
        
        <button class="nav-link" onclick="toggleDev()" style="width:100%; border:1px solid var(--border); border-radius:8px; margin-top:10px;">EXIT TERMINAL</button>
    </div>

    <div id="authOverlay" class="modal">
        <div class="auth-box">
            <h1 style="letter-spacing: 10px; color: var(--primary); margin-bottom: 20px;">NEBULA</h1>
            <input type="text" id="userInput" class="auth-field" placeholder="CALLSIGN">
            <input type="password" id="passInput" class="auth-field" placeholder="KEY">
            <button style="width:100%; padding:18px; margin-top:30px; border-radius:15px; background:var(--primary); font-weight: 800; border:none; cursor:pointer;" onclick="processAuth()">INITIALIZE</button>
            <p style="margin-top: 25px; font-size: 0.7rem; color: var(--text-dim); cursor: pointer;" onclick="toggleAuthMode()" id="toggleTxt">REGISTER NEW ID</p>
        </div>
    </div>

    <nav>
        <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:15px; height:15px; background:var(--primary); border-radius:3px;"></div>
            <h1 style="font-size:0.9rem; letter-spacing:4px;">NEBULA</h1>
        </div>
        <div class="theme-selector">
            <div class="dot" style="background:#ff4444" onclick="changeTheme('red')"></div>
            <div class="dot" style="background:#00d9ff" onclick="changeTheme('blue')"></div>
            <div class="dot" style="background:#ffcc00" onclick="changeTheme('yellow')"></div>
            <div class="dot" style="background:#00ff88" onclick="changeTheme('green')"></div>
            <div class="dot" style="background:#ff8800" onclick="changeTheme('orange')"></div>
            <div class="dot" style="background:#ff00bb" onclick="changeTheme('pink')"></div>
            <div class="dot" style="background:#a855f7" onclick="changeTheme('purple')"></div>
            <div class="dot" style="background:#14b8a6" onclick="changeTheme('teal')"></div>
            <div class="dot" style="background:#ffffff" onclick="changeTheme('white')"></div>
            <div class="dot" style="background:#bef264" onclick="changeTheme('lime')"></div>
        </div>
        <div>
            <a href="https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAN__4XhIPhUOE9XTUQ5QVIxT05ZVEZONUhXREZTVjgxRC4u" target="_blank" class="nav-link" style="color:var(--primary)">Support</a>
            <span id="devTrigger" class="nav-link" onclick="toggleDev()" style="display:none; color:var(--warning)">[ADMIN]</span>
            <span class="nav-link" onclick="doLogout()">Logout</span>
        </div>
    </nav>

    <div class="search-container"><input type="text" id="moduleSearch" placeholder="Search modules..." onkeyup="filterModules()"></div>
    <div id="gameGrid" class="grid"></div>

    <script>
        const _0xADMIN_USER = "ADMIN", _0xADMIN_PASS = "12345678!";
        const DEVICE_ID = btoa(navigator.userAgent).substring(10, 22);
        const MOCK_IP = "172.16." + Math.floor(Math.random()*254) + "." + Math.floor(Math.random()*254);
        let isLoginMode = true;

        const gameList = [
            { name: "Neon-Golf", url: "Neon-Golf.html" }, { name: "Neon-Hex", url: "Neon-Hex.html" },
            { name: "Neon-Pong", url: "Neon-Pong.html" }, { name: "Neon-Slams", url: "Neon-Slams.html" },
            { name: "Neon-Slash", url: "Neon-Slash.html" }, { name: "AI Run", url: "ai.html" },
            { name: "Basketball", url: "basketball.html" }, { name: "Blockblast", url: "blockblast.html" },
            { name: "Blockbreaker", url: "blockbreaker.html" }, { name: "Blockcraft", url: "blockcraft.html" },
            { name: "Cricket", url: "cricket.html" }, { name: "Crossy Roads", url: "crossyroads.html" },
            { name: "Drift", url: "drift.html" }, { name: "Eggshell", url: "eggshell.html" },
            { name: "Football", url: "football.html" }, { name: "Master Armory", url: "masterarmory.html" },
            { name: "Minesweeper", url: "minesweeper.html" }, { name: "Neon Trail", url: "neon-trail.html" },
            { name: "Overdrive", url: "overdrive.html" }, { name: "Pacman", url: "pacman.html" },
            { name: "Reader", url: "reader.html" }, { name: "Snake", url: "snake.html" },
            { name: "Space Adventure", url: "spaceadventure.html" }, { name: "Sparks Maths", url: "sparksmaths.html" },
            { name: "Sparks Logs", url: "sparxsmaths-log.html" }, { name: "Tic Tac Toe", url: "tictactoe.html" }
        ];

        function processAuth() {
            const u = document.getElementById('userInput').value.trim();
            const p = document.getElementById('passInput').value.trim();
            const bans = JSON.parse(localStorage.getItem('neb_blacklist')) || {};

            // Admin Immunity Bypass
            if(u.toUpperCase() === _0xADMIN_USER && p === _0xADMIN_PASS) {
                localStorage.setItem('neb_active', 'ADMIN'); location.reload(); return;
            }

            // Check if Account, IP, or Device is banned
            const activeBan = bans[u.toLowerCase()] || bans[MOCK_IP] || bans[DEVICE_ID];
            if (activeBan) {
                if (!activeBan.expiry || Date.now() < activeBan.expiry) {
                    alert(`ACCESS RESTRICTED: ${activeBan.type}\nExpires: ${activeBan.expiry ? new Date(activeBan.expiry).toLocaleString() : 'PERMANENT'}`);
                    return;
                }
            }

            let db = JSON.parse(localStorage.getItem('neb_db')) || {};
            if(isLoginMode) {
                if(db[u] && db[u].pw === p) {
                    db[u].lastIP = MOCK_IP; db[u].lastDev = DEVICE_ID;
                    localStorage.setItem('neb_db', JSON.stringify(db));
                    localStorage.setItem('neb_active', u); location.reload();
                } else alert("INVALID ACCESS KEY");
            } else {
                if(db[u]) return alert("ID ALREADY EXISTS");
                db[u] = { pw: p, lastIP: MOCK_IP, lastDev: DEVICE_ID };
                localStorage.setItem('neb_db', JSON.stringify(db));
                localStorage.setItem('neb_active', u); location.reload();
            }
        }

        function applyBan(target, type) {
            const dur = document.getElementById(`dur-${target}`).value;
            let blacklist = JSON.parse(localStorage.getItem('neb_blacklist')) || {};
            // Correct expiry calculation in MS
            let expiry = dur === "0" ? null : Date.now() + (parseInt(dur) * 1000);
            
            blacklist[target.toLowerCase()] = { type, expiry, date: new Date().toLocaleString() };
            localStorage.setItem('neb_blacklist', JSON.stringify(blacklist));
            refreshAdminUI();
            alert(`Locked ${type}: ${target}`);
        }

        function revertBan(target) {
            let blacklist = JSON.parse(localStorage.getItem('neb_blacklist')) || {};
            // Using toLowerCase to ensure match
            delete blacklist[target.toLowerCase()];
            localStorage.setItem('neb_blacklist', JSON.stringify(blacklist));
            refreshAdminUI();
            alert(`Restriction Lifted for: ${target}`);
        }

        function refreshAdminUI() {
            const db = JSON.parse(localStorage.getItem('neb_db')) || {};
            const blacklist = JSON.parse(localStorage.getItem('neb_blacklist')) || {};
            
            document.getElementById('userRows').innerHTML = Object.keys(db).map(u => `
                <tr>
                    <td style="color:var(--primary); font-weight:800">${u}</td>
                    <td>${db[u].lastIP}</td>
                    <td style="font-family:monospace">${db[u].lastDev}</td>
                    <td>
                        <select id="dur-${u}" style="background:#000;color:#fff;font-size:0.6rem;padding:2px;border:1px solid #333">
                            <option value="86400">1D</option><option value="604800">1W</option>
                            <option value="2592000">1M</option><option value="0">PERM</option>
                        </select>
                        <button class="ban-btn danger" onclick="applyBan('${u}','Account')">ACC</button>
                        <button class="ban-btn danger" onclick="applyBan('${db[u].lastIP}','IP')">IP</button>
                        <button class="ban-btn danger" onclick="applyBan('${db[u].lastDev}','Device')">DEV</button>
                    </td>
                </tr>`).join('');

            document.getElementById('blacklistLog').innerHTML = Object.keys(blacklist).map(k => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid rgba(255,255,255,0.05); background:rgba(255,0,0,0.02)">
                    <span>
                        <b style="color:var(--danger)">[${blacklist[k].type}]</b> ${k}<br>
                        <small style="color:var(--text-dim)">Exp: ${blacklist[k].expiry ? new Date(blacklist[k].expiry).toLocaleString() : 'NEVER'}</small>
                    </span>
                    <button class="ban-btn success" onclick="revertBan('${k}')">REVERT ACCESS</button>
                </div>`).join('') || '<p style="color:var(--text-dim); padding:10px;">Security status: Clear.</p>';
        }

        function changeTheme(color) { document.body.className = `theme-${color}`; localStorage.setItem('neb_theme', color); }
        function toggleDev() { document.getElementById('devPanel').classList.toggle('active'); refreshAdminUI(); }
        function doLogout() { localStorage.removeItem('neb_active'); location.reload(); }
        function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('toggleTxt').innerText = isLoginMode ? "REGISTER NEW ID" : "BACK TO LOGIN"; }
        function filterModules() {
            const q = document.getElementById('moduleSearch').value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => c.style.display = c.innerText.toLowerCase().includes(q) ? 'flex' : 'none');
        }

        function renderUI() {
            const u = localStorage.getItem('neb_active'); if(!u) return;
            document.getElementById('authOverlay').style.display = 'none';
            if(u === 'ADMIN') document.getElementById('devTrigger').style.display = 'inline-block';
            changeTheme(localStorage.getItem('neb_theme') || 'green');
            document.getElementById('gameGrid').innerHTML = gameList.map(g => `<a href="${g.url}" target="_blank" class="card"><span>${g.name.toUpperCase()}</span></a>`).join('');
        }
        if(localStorage.getItem('neb_active')) renderUI();
    </script>
</body>
</html>
