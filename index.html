<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA | Unified Gaming OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.2);
            --bg: #030406;
            --surface: rgba(255, 255, 255, 0.02);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.07);
            --text: #ffffff;
            --text-dim: #64748b;
            --easing: cubic-bezier(0.2, 0, 0, 1);
        }

        [data-theme="cyber"] { --primary: #ff00ff; --primary-glow: rgba(255, 0, 255, 0.2); }
        [data-theme="ocean"] { --primary: #00d9ff; --primary-glow: rgba(0, 217, 255, 0.2); }
        [data-theme="amber"] { --primary: #ffaa00; --primary-glow: rgba(255, 170, 0, 0.2); }
        [data-theme="crimson"] { --primary: #ff4d4d; --primary-glow: rgba(255, 77, 77, 0.2); }
        [data-theme="amethyst"] { --primary: #a855f7; --primary-glow: rgba(168, 85, 247, 0.2); }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% -20%, var(--primary-glow), transparent 70%),
                linear-gradient(to bottom, transparent, var(--bg));
        }

        /* --- NAVIGATION --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 5%; position: sticky; top: 0; z-index: 1000;
            background: rgba(3, 4, 6, 0.7); backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .logo-sq { 
            width: 30px; height: 30px; background: var(--primary); 
            border-radius: 8px; box-shadow: 0 0 30px var(--primary-glow);
            transform: rotate(-10deg); transition: 0.6s var(--easing);
        }
        .brand:hover .logo-sq { transform: rotate(0deg) scale(1.15); box-shadow: 0 0 50px var(--primary); }
        .brand h1 { font-size: 1.2rem; letter-spacing: 6px; font-weight: 800; }
        
        .user-controls { display: flex; align-items: center; gap: 20px; }
        .nav-link { 
            font-size: 0.7rem; color: var(--text-dim); cursor: pointer; 
            text-transform: uppercase; letter-spacing: 2px; font-weight: 800;
            transition: 0.3s; padding: 10px 15px; border-radius: 8px;
        }
        .nav-link:hover { color: var(--primary); background: var(--surface); transform: translateY(-2px); }

        /* --- SUPPORT PANEL --- */
        #supportPanel {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 650px; height: 100vh;
            background: rgba(5, 6, 8, 0.98); backdrop-filter: blur(50px);
            border-left: 1px solid var(--border);
            z-index: 3000; transition: 0.8s var(--easing); padding: 50px;
        }
        #supportPanel.active { right: 0; box-shadow: -50px 0 150px rgba(0,0,0,0.9); }

        /* --- HERO SECTION --- */
        header { padding: 120px 5% 60px; max-width: 1400px; margin: 0 auto; text-align: center; }
        header h2 { 
            font-size: 5rem; font-weight: 800; letter-spacing: -4px; line-height: 0.85; 
            margin-bottom: 40px; background: linear-gradient(to bottom, #fff, #444);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .search-container { position: relative; max-width: 550px; margin: 0 auto; }
        #gameSearch {
            width: 100%; padding: 25px 35px; border-radius: 20px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            color: #fff; font-size: 1.1rem; transition: 0.5s var(--easing);
            text-align: center; font-weight: 500;
        }
        #gameSearch:focus { border-color: var(--primary); background: rgba(255,255,255,0.07); outline: none; transform: scale(1.02); }

        /* --- GRID & CARDS --- */
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px; padding: 20px 5% 180px; max-width: 1400px; margin: 0 auto;
        }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 35px; padding: 45px; text-decoration: none;
            display: flex; flex-direction: column; justify-content: flex-end;
            min-height: 240px; transition: 0.6s var(--easing);
            position: relative; overflow: hidden;
        }
        .card::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.05));
            opacity: 0; transition: 0.5s;
        }
        .card:hover { transform: translateY(-15px); border-color: var(--primary); background: var(--surface-hover); }
        .card:hover::after { opacity: 1; }
        
        .card-title { font-size: 1.8rem; font-weight: 800; display: block; margin-bottom: 15px; letter-spacing: -1px; }
        .card-meta { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 20px; }

        /* --- AUTH --- */
        .modal { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 90%; max-width: 440px; padding: 60px; background: #07080a; border: 1px solid var(--border); border-radius: 45px; text-align: center; }
        .auth-field { width: 100%; padding: 20px; margin-top: 15px; border-radius: 18px; border: 1px solid #1a1a1a; background: #000; color: #fff; text-align: center; font-size: 1rem; }
        .auth-btn { width: 100%; padding: 20px; margin-top: 35px; border-radius: 18px; border: none; background: var(--primary); color: #000; font-weight: 800; letter-spacing: 3px; cursor: pointer; }

        /* --- THEME DOCK --- */
        .dock {
            position: fixed; bottom: 45px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 11, 13, 0.8); backdrop-filter: blur(30px);
            padding: 18px 35px; border-radius: 100px; border: 1px solid var(--border);
            display: flex; gap: 25px; z-index: 1000; box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        .node { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: 0.4s var(--easing); position: relative; }
        .node:hover { transform: scale(1.4) translateY(-10px); }
        .node.active::before {
            content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--primary); opacity: 0.5;
        }
        .node.active { border-color: #fff; transform: scale(1.2); }
    </style>
</head>
<body>

    <div id="authOverlay" class="modal">
        <div class="auth-box">
            <div class="logo-sq" style="margin: 0 auto 30px; transform: rotate(0); width: 50px; height: 50px; border-radius: 12px;"></div>
            <h2 id="authTitle" style="letter-spacing: 8px; margin-bottom: 10px;">NEBULA OS</h2>
            <p style="color: var(--text-dim); font-size: 0.8rem; margin-bottom: 20px;">BIO-SCAN REQUIRED</p>
            <input type="text" id="userInput" class="auth-field" placeholder="USER ID">
            <input type="password" id="passInput" class="auth-field" placeholder="ACCESS KEY">
            <button class="auth-btn" onclick="processAuth()" id="mainAuthBtn">INITIALIZE</button>
            <p style="margin-top: 30px; font-size: 0.7rem; color: var(--text-dim); cursor: pointer; letter-spacing: 2px;" onclick="toggleMode()" id="toggleTxt">CREATE NEW IDENTITY</p>
        </div>
    </div>

    <div id="supportPanel">
        <div class="nav-link" onclick="toggleSupport()" style="margin-bottom: 40px; display: inline-block;">[ BACK TO INTERFACE ]</div>
        <h2 style="font-size: 3rem; margin-bottom: 40px; font-weight: 800; letter-spacing: -3px;">SYSTEM ASSISTANCE</h2>
        <iframe width="100%" height="80%" src="https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAN__4XhIPhUOE9XTUQ5QVIxT05ZVEZONUhXREZTVjgxRC4u&embed=true" frameborder="0" style="border: none; border-radius: 30px; background: #fff; box-shadow: 0 50px 100px rgba(0,0,0,0.5);"></iframe>
    </div>

    <nav>
        <div class="brand"><div class="logo-sq"></div><h1>NEBULA</h1></div>
        <div class="user-controls">
            <span class="nav-link" onclick="toggleSupport()">Support</span>
            <span id="navUser" style="font-weight: 800; font-size: 0.75rem; color: var(--primary); letter-spacing: 3px;">GUEST</span>
            <span class="nav-link" onclick="doLogout()">Terminate</span>
        </div>
    </nav>

    <header>
        <h2 id="welcomeTxt">Welcome</h2>
        <div class="search-container">
            <input type="text" id="gameSearch" placeholder="Filter Neural Modules..." onkeyup="doSearch()">
        </div>
    </header>

    <div id="gameGrid" class="grid"></div>

    <div class="dock">
        <div class="node active" style="background:#00ff88" onclick="updateTheme('default', this)"></div>
        <div class="node" style="background:#ff00ff" onclick="updateTheme('cyber', this)"></div>
        <div class="node" style="background:#00d9ff" onclick="updateTheme('ocean', this)"></div>
        <div class="node" style="background:#ffaa00" onclick="updateTheme('amber', this)"></div>
        <div class="node" style="background:#ff4d4d" onclick="updateTheme('crimson', this)"></div>
        <div class="node" style="background:#a855f7" onclick="updateTheme('amethyst', this)"></div>
    </div>

    <script>
        let isLogin = true;
        const gameList = [
            { name: "Eggshell", cat: "Shooter", url: "eggshell.html" },
            { name: "Cyber-Strike", cat: "Action", url: "Cyber-Strike.html" },
            { name: "Neon-Golf", cat: "Sports", url: "Neon-Golf.html" },
            { name: "Neon-Hex", cat: "Strategy", url: "Neon-Hex.html" },
            { name: "Neon-Pong", cat: "Arcade", url: "Neon-Pong.html" },
            { name: "Neon-Slams", cat: "Sports", url: "Neon-Slams.html" },
            { name: "Neon-Slash", cat: "Action", url: "Neon-Slash.html" },
            { name: "AI run", cat: "System", url: "ai.html" },
            { name: "Basketball", cat: "Sports", url: "basketball.html" },
            { name: "Blockblast", cat: "Puzzle", url: "blockblast.html" },
            { name: "Blockbreaker", cat: "Arcade", url: "blockbreaker.html" },
            { name: "Blockcraft", cat: "Creative", url: "blockcraft.html" },
            { name: "Cricket", cat: "Sports", url: "cricket.html" },
            { name: "Crossy Roads", cat: "Arcade", url: "crossyroads.html" },
            { name: "Drift", cat: "Racing", url: "drift.html" },
            { name: "Football", cat: "Sports", url: "football.html" },
            { name: "Master Armory", cat: "Shooter", url: "masterarmory.html" },
            { name: "Minesweeper", cat: "Puzzle", url: "minesweeper.html" },
            { name: "Neon Trail", cat: "Adventure", url: "neon-trail.html" },
            { name: "Overdrive", cat: "Racing", url: "overdrive.html" },
            { name: "Pacman", cat: "Arcade", url: "pacman.html" },
            { name: "Snake", cat: "Arcade", url: "snake.html" },
            { name: "Space Adventure", cat: "Sci-Fi", url: "spaceadventure.html" },
            { name: "Sparks Maths", cat: "Edu", url: "sparksmaths.html" },
            { name: "Tic Tac Toe", cat: "Board", url: "tictactoe.html" },
            { name: "Turbo Horizon", cat: "Racing", url: "turbohorizon.html" }
        ];

        function toggleSupport() { document.getElementById('supportPanel').classList.toggle('active'); }
        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('authTitle').innerText = isLogin ? "NEBULA OS" : "NEW SESSION";
            document.getElementById('mainAuthBtn').innerText = isLogin ? "INITIALIZE" : "REGISTER";
        }

        function processAuth() {
            const u = document.getElementById('userInput').value.trim();
            const p = document.getElementById('passInput').value.trim();
            if(!u || !p) return;
            let db = JSON.parse(localStorage.getItem('neb_db')) || {};
            if(isLogin) {
                if(db[u] && db[u].pw === p) { localStorage.setItem('neb_active', u); location.reload(); }
                else { alert("ERROR: IDENTITY NOT RECOGNIZED"); }
            } else {
                if(db[u]) return alert("ERROR: CALLSIGN TAKEN");
                db[u] = { pw: p, scores: {} };
                localStorage.setItem('neb_db', JSON.stringify(db));
                localStorage.setItem('neb_active', u);
                location.reload();
            }
        }

        function doLogout() { localStorage.removeItem('neb_active'); location.reload(); }

        function renderUI() {
            const user = localStorage.getItem('neb_active');
            if(!user) return;
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('navUser').innerText = user.toUpperCase();
            document.getElementById('welcomeTxt').innerText = `Welcome, ${user}`;
            const db = JSON.parse(localStorage.getItem('neb_db'));
            const scores = db[user].scores || {};
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = gameList.map(g => {
                const s = scores[g.name] || 0;
                return `
                    <a href="${g.url}" target="_blank" class="card" data-name="${g.name.toLowerCase()}">
                        <div style="position:relative; z-index:2;">
                            <span class="card-title">${g.name}</span>
                            <div class="card-meta">
                                <span style="font-size:0.7rem; color:var(--text-dim); font-weight:800; letter-spacing:2px;">${g.cat.toUpperCase()}</span>
                                <span style="font-family:'Fira Code'; color:var(--primary); font-size:0.85rem; font-weight:800;">${s} PTS</span>
                            </div>
                        </div>
                    </a>`;
            }).join('');
        }

        function updateTheme(t, el) {
            document.documentElement.setAttribute('data-theme', t);
            if(t === 'default') document.documentElement.removeAttribute('data-theme');
            document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }

        function doSearch() {
            const q = document.getElementById('gameSearch').value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => {
                c.style.display = (c.dataset.name.includes(q)) ? 'flex' : 'none';
            });
        }

        if(localStorage.getItem('neb_active')) renderUI();
    </script>
</body>
</html>
