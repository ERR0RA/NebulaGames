<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Games | Core Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Default Theme: Emerald */
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.4);
            --bg: #030303;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --updating: #ffcc00;
            --error: #ff3366;
            --info: #00d9ff;
        }

        /* Theme Overrides */
        [data-theme="cyber"] {
            --primary: #ff00ff;
            --primary-glow: rgba(255, 0, 255, 0.4);
        }
        [data-theme="ocean"] {
            --primary: #00d9ff;
            --primary-glow: rgba(0, 217, 255, 0.4);
        }
        [data-theme="amber"] {
            --primary: #ffaa00;
            --primary-glow: rgba(255, 170, 0, 0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background: radial-gradient(circle at 50% 0%, #0a1a14 0%, #030303 70%);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 9999;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        header { text-align: center; padding: 80px 20px 40px; }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900; margin: 0;
            letter-spacing: 15px; text-transform: uppercase;
            background: linear-gradient(to bottom, #fff 30%, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px var(--primary-glow));
            animation: titlePulse 4s infinite alternate;
            transition: 0.5s;
        }

        @keyframes titlePulse {
            from { filter: drop-shadow(0 0 10px var(--primary-glow)); }
            to { filter: drop-shadow(0 0 30px var(--primary-glow)); }
        }

        .subtitle { color: var(--primary); opacity: 0.8; margin-top: 15px; font-size: 0.85rem; letter-spacing: 6px; text-transform: uppercase; font-family: 'Orbitron'; transition: 0.5s; }

        .report-link {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 30px;
            border: 1px solid var(--error);
            color: var(--error);
            text-decoration: none;
            font-family: 'Orbitron';
            font-size: 0.7rem;
            letter-spacing: 2px;
            border-radius: 4px;
            transition: 0.3s;
            background: rgba(255, 51, 102, 0.08);
            text-transform: uppercase;
            font-weight: 700;
        }
        .report-link:hover {
            background: var(--error);
            color: #fff;
            box-shadow: 0 0 25px var(--error);
            transform: scale(1.05);
        }

        .status-panel {
            width: 90%; max-width: 1100px;
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 16px; padding: 30px;
            margin-bottom: 40px; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;
            backdrop-filter: blur(20px); box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .status-item { display: flex; flex-direction: column; gap: 8px; border-left: 1px solid rgba(255,255,255,0.05); padding-left: 15px; }
        .status-label { font-family: 'Orbitron', sans-serif; font-size: 0.6rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 2px; }
        .status-value { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700; text-shadow: 0 0 10px currentColor; transition: 0.5s; }
        
        /* Theme Toggles */
        .theme-grid { display: flex; gap: 10px; margin-top: 5px; }
        .theme-btn { 
            width: 20px; height: 20px; border-radius: 4px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s;
        }
        .theme-btn:hover { transform: scale(1.2); border-color: #fff; }

        .online { color: var(--primary); }
        .offline { color: var(--error); }
        .traffic-accent { color: var(--info); }

        .search-container { width: 90%; max-width: 1100px; margin-bottom: 30px; position: relative; }
        #moduleSearch {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--card-border);
            padding: 18px 25px; border-radius: 12px; color: #fff; font-family: 'Orbitron';
            font-size: 0.9rem; outline: none; transition: 0.4s; box-sizing: border-box;
            letter-spacing: 1px;
        }
        #moduleSearch:focus { 
            border-color: var(--primary); 
            background: rgba(255,255,255,0.07);
            box-shadow: 0 0 30px rgba(var(--primary), 0.15); 
        }

        h5 {
            font-family: 'Orbitron', sans-serif; color: rgba(255,255,255,0.9);
            text-transform: uppercase; letter-spacing: 4px;
            margin: 30px 0 20px; width: 90%; max-width: 1100px;
            font-size: 1rem; border-left: 3px solid var(--primary); padding-left: 15px;
            transition: 0.5s;
        }

        .link-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px; width: 90%; max-width: 1100px; margin-bottom: 60px;
        }

        .game-link {
            position: relative; background: var(--card-bg);
            text-decoration: none; height: 110px;
            border-radius: 14px; border: 1px solid var(--card-border);
            transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .game-link:hover:not(.is-down) {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--primary);
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 15px var(--primary-glow);
        }

        .game-title { 
            font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 0.95rem; 
            color: #fff; text-align: center; z-index: 2; padding: 0 15px;
            letter-spacing: 1px; transition: 0.3s;
        }

        .game-link:hover .game-title { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }

        .badge { 
            position: absolute; top: 0; right: 0; font-size: 0.6rem; 
            padding: 5px 12px; font-weight: 900; text-transform: uppercase; 
            border-bottom-left-radius: 10px; z-index: 3; font-family: 'Orbitron';
        }
        .best { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); transition: 0.5s; }
        .upd { background: var(--updating); color: #000; }
        .down { background: var(--error); color: #fff; }

        footer { 
            padding: 100px; text-align: center; color: rgba(255,255,255,0.2); 
            font-size: 0.75rem; font-family: 'Orbitron'; letter-spacing: 5px; 
        }
    </style>
</head>
<body>

    <header>
        <h1>Nebula Games</h1>
        <div class="subtitle">System Operator: DC</div>
        <a href="https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAN__4XhIPhUOE9XTUQ5QVIxT05ZVEZONUhXREZTVjgxRC4u" class="report-link" target="_blank">⚠ REPORT SYSTEM FAULT</a>
    </header>

    <div class="status-panel">
        <div class="status-item" style="border:none">
            <span class="status-label">Archive Status</span>
            <span id="global-status" class="status-value online">● SYSTEM READY</span>
        </div>
        <div class="status-item">
            <span class="status-label">Visual Interface</span>
            <div class="theme-grid">
                <div class="theme-btn" style="background:#00ff88" onclick="setTheme('default')"></div>
                <div class="theme-btn" style="background:#ff00ff" onclick="setTheme('cyber')"></div>
                <div class="theme-btn" style="background:#00d9ff" onclick="setTheme('ocean')"></div>
                <div class="theme-btn" style="background:#ffaa00" onclick="setTheme('amber')"></div>
            </div>
        </div>
        <div class="status-item">
            <span class="status-label">Global Traffic</span>
            <span id="traffic-value" class="status-value traffic-accent">ANALYZING...</span>
        </div>
        <div class="status-item">
            <span class="status-label">Live Modules</span>
            <span id="active-count" class="status-value">--</span>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="moduleSearch" placeholder="SEARCH SYSTEM MODULES..." onkeyup="filterGames()">
    </div>

    <h5>🕹️ Available Modules</h5>
    <div id="stable-container" class="link-container"></div>

    <div id="error-section" style="display:none">
        <h5>⚠️ Signal Loss (Offline)</h5>
        <div id="error-container" class="link-container"></div>
    </div>

    <script>
        const games = [
            { name: "Neon Cyber Strike", url: "Cyber-Strike.html", tag: "best" },
            { name: "Blockcraft", url: "blockcraft.html", tag: "upd" },
            { name: "Minesweeper", url: "minesweeper.html", tag: "best" },
            { name: "Neon Snake", url: "snake.html", tag: "best" },
            { name: "Master Armory", url: "masterarmory.html", tag: "best" },
            { name: "Neon Pong", url: "Neon-Pong.html", tag: "best" },
            { name: "Neon Slash", url: "Neon-Slash.html", tag: "" },
            { name: "Block Breaker", url: "blockbreaker.html", tag: "" },
            { name: "Neon Golf", url: "Neon-Golf.html", tag: "" },
            { name: "Neon Slamz", url: "Neon-Slams.html", tag: "" },
            { name: "Neon Trail", url: "neon-trail.html", tag: "" },
            { name: "Block Blast", url: "blockblast.html", tag: "" },
            { name: "Neon Run", url: "ai.html", tag: "" },
            { name: "Basketball", url: "basketball.html", tag: "" },
            { name: "Football", url: "football.html", tag: "" },
            { name: "Cricket", url: "cricket.html", tag: "" },
            { name: "Crossy Roads", url: "crossyroads.html", tag: "" },
            { name: "Drift", url: "drift.html", tag: "" },
            { name: "Eggshell (EGGVP)", url: "eggshell.html", tag: "upd" },
            { name: "Overdrive", url: "overdrive.html", tag: "" },
            { name: "Pacman", url: "pacman.html", tag: "" },
            { name: "Space Adventure", url: "spaceadventure.html", tag: "" },
            { name: "Tic Tac Toe", url: "tictactoe.html", tag: "" },
            { name: "Turbo Horizon", url: "turbohorizon.html", tag: "" },
            { name: "Sparx Reader", url: "reader.html", tag: "" },
            { name: "Neon Hex", url: "Neon-Hex.html", tag: "" }
        ];

        function setTheme(theme) {
            if(theme === 'default') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
        }

        async function buildArcade() {
            const stableBox = document.getElementById('stable-container');
            const errorBox = document.getElementById('error-container');
            const errorSection = document.getElementById('error-section');
            let stableCount = 0;
            let errorCount = 0;

            stableBox.innerHTML = '';
            errorBox.innerHTML = '';

            const isLocal = window.location.protocol === 'file:';

            const statusChecks = await Promise.all(games.map(async (game) => {
                if(isLocal) return { ...game, isDown: false };
                try {
                    const resp = await fetch(game.url, { method: 'HEAD' });
                    return { ...game, isDown: !resp.ok };
                } catch (e) {
                    return { ...game, isDown: true };
                }
            }));

            statusChecks.forEach(game => {
                if (game.isDown) {
                    errorBox.innerHTML += `
                        <div class="game-link is-down" data-name="${game.name.toLowerCase()}">
                            <span class="badge down">FAULT</span>
                            <span class="game-title">${game.name}</span>
                        </div>`;
                    errorCount++;
                } else {
                    const tagHTML = game.tag ? `<span class="badge ${game.tag}">${game.tag === 'upd' ? 'Updating' : (game.tag === 'best' ? 'Best' : '')}</span>` : '';
                    stableBox.innerHTML += `
                        <a href="${game.url}" class="game-link" target="_blank" rel="noopener noreferrer" data-name="${game.name.toLowerCase()}">
                            ${tagHTML}
                            <span class="game-title">${game.name}</span>
                        </a>`;
                    stableCount++;
                }
            });

            document.getElementById('active-count').innerText = `${stableCount}`;
            if(errorCount > 0) errorSection.style.display = 'block';
        }

        function filterGames() {
            const input = document.getElementById('moduleSearch').value.toLowerCase();
            const links = document.querySelectorAll('.game-link');
            links.forEach(link => {
                const name = link.getAttribute('data-name');
                link.style.display = name.includes(input) ? "flex" : "none";
            });
        }

        buildArcade();
        setInterval(() => {
            const trafficStates = ["MINIMAL", "NOMINAL", "STABLE", "MODERATE", "PEAK"];
            document.getElementById('traffic-value').innerText = trafficStates[Math.floor(Math.random() * trafficStates.length)];
        }, 5000);
    </script>

    <footer>
        DC × AK × NEBULA SYSTEMS // GRID V3.6.0-CUSTOM
    </footer>
</body>
</html>
