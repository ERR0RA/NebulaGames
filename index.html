<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA OS | v7.0 Secure</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #00ff88;
            --primary-rgb: 0, 255, 136;
            --bg: #020305;
            --glass: rgba(15, 18, 24, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        body.theme-green { --primary: #00ff88; --primary-rgb: 0, 255, 136; }
        body.theme-cyan { --primary: #00f2ff; --primary-rgb: 0, 242, 255; }
        body.theme-purple { --primary: #bf00ff; --primary-rgb: 191, 0, 255; }
        body.theme-red { --primary: #ff3333; --primary-rgb: 255, 51, 51; }
        body.theme-gold { --primary: #ffcc00; --primary-rgb: 255, 204, 0; }
        body.theme-pink { --primary: #ff0077; --primary-rgb: 255, 0, 119; }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            background-color: var(--bg); color: var(--text-main);
            height: 100vh; overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex; flex-direction: column;
        }

        .desktop-bg {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at top right, rgba(var(--primary-rgb), 0.08), transparent 60%),
                        radial-gradient(circle at bottom left, rgba(var(--primary-rgb), 0.05), transparent 60%);
        }

        /* --- AUTH & LOCK SCREEN --- */
        #auth-screen {
            position: fixed; inset: 0; background: rgba(2, 3, 5, 0.95); backdrop-filter: blur(20px);
            z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .auth-box {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
            padding: 40px; border-radius: 24px; text-align: center; width: 340px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .auth-avatar {
            width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #1a1f26, #0f1218);
            margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
            color: var(--primary); border: 2px solid var(--primary); box-shadow: 0 0 20px rgba(var(--primary-rgb), 0.3);
        }
        .auth-input {
            width: 100%; padding: 15px; border-radius: 12px; background: rgba(0,0,0,0.5);
            border: 1px solid var(--border); color: white; font-size: 1rem; text-align: center;
            margin-bottom: 15px; outline: none; transition: 0.3s; font-family: 'Fira Code', monospace;
        }
        .auth-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(var(--primary-rgb), 0.2); }
        .auth-btn {
            width: 100%; padding: 15px; border-radius: 12px; background: var(--primary);
            color: #000; font-weight: 800; border: none; cursor: pointer; transition: 0.2s;
        }
        .auth-btn:active { transform: scale(0.98); }
        .auth-error { color: #ff3333; font-size: 0.8rem; margin-top: 10px; height: 15px; }
        
        #setup-form, #login-form { display: none; }

        /* --- BOOT SCREEN --- */
        #boot-screen {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease;
        }
        .boot-logo {
            font-size: 3rem; font-weight: 800; letter-spacing: 5px; color: #fff;
            text-shadow: 0 0 20px var(--primary); animation: pulse 2s infinite;
        }
        .boot-log { margin-top: 30px; font-family: 'Fira Code', monospace; color: var(--primary); font-size: 0.8rem; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* --- TOP NAV --- */
        nav {
            height: 45px; padding: 0 20px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--border);
            backdrop-filter: blur(25px); background: rgba(5, 7, 10, 0.6); z-index: 100;
        }
        .sys-info { display: flex; align-items: center; gap: 15px; font-size: 0.75rem; }
        .user-badge { background: rgba(var(--primary-rgb), 0.1); color: var(--primary); padding: 4px 10px; border-radius: 20px; font-weight: 600; display: flex; align-items: center; gap: 6px;}
        .hw-stats { display: flex; gap: 10px; color: var(--text-dim); }
        .hw-stats i { width: 14px; height: 14px; }

        /* --- MAIN DESKTOP --- */
        .main-stage { flex: 1; overflow-y: auto; padding: 20px; position: relative; }
        .search-container { width: 100%; max-width: 500px; margin: 10px auto 30px; position: relative; z-index: 10; }
        .os-input {
            width: 100%; padding: 14px 20px; border-radius: 12px;
            background: rgba(15, 18, 24, 0.8); border: 1px solid var(--border);
            color: white; font-size: 0.9rem; outline: none; backdrop-filter: blur(10px); transition: 0.3s;
        }
        .os-input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(var(--primary-rgb), 0.2); }

        /* --- APP GRID --- */
        .grid-engine { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; }
        .app-icon { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 15px 10px; border-radius: 16px; transition: 0.2s; cursor: pointer; }
        .app-icon:hover { background: rgba(255,255,255,0.05); transform: translateY(-3px); }
        .icon-visual {
            width: 55px; height: 55px; border-radius: 16px; background: linear-gradient(145deg, #1a1f26, #0f1218);
            display: flex; align-items: center; justify-content: center; color: var(--primary);
            border: 1px solid var(--border); box-shadow: 0 8px 16px rgba(0,0,0,0.4); pointer-events: none;
        }
        .app-label { font-size: 0.75rem; font-weight: 600; text-align: center; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* --- WINDOW MANAGER --- */
        #window-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
        .os-window {
            position: absolute; width: 600px; height: 400px; background: var(--bg); border: 1px solid var(--border);
            border-radius: 12px; display: flex; flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(var(--primary-rgb), 0.2);
            pointer-events: auto; overflow: hidden; animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .window-header { height: 35px; background: #0f1218; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; cursor: grab; }
        .window-header:active { cursor: grabbing; }
        .window-title { font-size: 0.75rem; font-weight: 600; color: var(--text-dim); display: flex; align-items: center; gap: 8px;}
        .window-controls { display: flex; gap: 8px; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
        .btn-close { background: #ff3333; } .btn-min { background: #ffcc00; }
        .window-content { flex: 1; background: #000; position: relative; }
        .window-content iframe { width: 100%; height: 100%; border: none; }
        body.dragging iframe { pointer-events: none; }

        /* --- BOTTOM DOCK --- */
        .dock {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            height: 60px; background: rgba(10, 12, 16, 0.8); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 20px; padding: 0 15px;
            display: flex; align-items: center; gap: 15px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .dock-item {
            width: 45px; height: 45px; border-radius: 12px; background: #1a1f26; display: flex; align-items: center; justify-content: center;
            color: var(--primary); cursor: pointer; transition: 0.2s; border: 1px solid transparent; position: relative;
        }
        .dock-item:hover { transform: translateY(-5px); border-color: var(--primary); }
        .dock-item.active::after { content: ''; position: absolute; bottom: -6px; width: 4px; height: 4px; background: var(--primary); border-radius: 50%; }

        /* --- SYSTEM DRAWER --- */
        .sys-drawer {
            position: fixed; right: -350px; top: 0; width: 320px; height: 100%; background: rgba(5, 7, 10, 0.98); backdrop-filter: blur(40px);
            border-left: 1px solid var(--border); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); padding: 30px; z-index: 200;
        }
        .sys-drawer.open { right: 0; }
        .color-dot { height: 40px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .color-dot:hover { transform: translateY(-3px); border: 2px solid white; }
        .btn-outline { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: #fff; cursor: pointer; transition: 0.2s; font-weight: bold; margin-top: 10px;}
        .btn-outline:hover { background: rgba(255,255,255,0.05); }
        .btn-danger { border-color: #ff3333; color: #ff3333; }
        .btn-danger:hover { background: rgba(255, 51, 51, 0.1); }
    </style>
</head>
<body class="theme-green">

    <div id="auth-screen">
        <div class="auth-box">
            <div class="auth-avatar"><i data-lucide="user" style="width: 40px; height: 40px;"></i></div>
            
            <div id="setup-form">
                <h2 style="margin-bottom: 5px;">Welcome to Nebula</h2>
                <p style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 20px;">Create your local profile</p>
                <input type="text" id="setup-user" class="auth-input" placeholder="Enter Username" autocomplete="off">
                <input type="password" id="setup-pin" class="auth-input" placeholder="Create 4-Digit PIN" maxlength="4" autocomplete="off">
                <button class="auth-btn" onclick="Auth.createAccount()">INITIALIZE SYSTEM</button>
                <div id="setup-error" class="auth-error"></div>
            </div>

            <div id="login-form">
                <h2 id="login-greeting" style="margin-bottom: 5px;">Welcome Back</h2>
                <p style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 20px;">System Locked</p>
                <input type="password" id="login-pin" class="auth-input" placeholder="Enter PIN" maxlength="4" autocomplete="off" onkeyup="if(event.key === 'Enter') Auth.login()">
                <button class="auth-btn" onclick="Auth.login()">UNLOCK</button>
                <div id="login-error" class="auth-error"></div>
                <button style="background:transparent; border:none; color:var(--text-dim); font-size:0.7rem; margin-top:20px; cursor:pointer; text-decoration:underline;" onclick="Auth.resetSystem()">Wipe System & Factory Reset</button>
            </div>
        </div>
    </div>

    <div id="boot-screen">
        <div class="boot-logo">NEBULA<span style="color:var(--primary)">.OS</span></div>
        <div class="boot-log" id="boot-text">DECRYPTING PROFILE...</div>
    </div>

    <div class="desktop-bg"></div>

    <nav>
        <div class="sys-info">
            <div style="font-weight: 800; letter-spacing: 1px;">NEBULA</div>
            <div class="user-badge"><i data-lucide="user" style="width:12px;"></i> <span id="nav-username">User</span></div>
        </div>
        <div class="sys-info">
            <div class="hw-stats">
                <i data-lucide="wifi"></i>
                <i data-lucide="battery-charging"></i>
                <span id="bat-level">100%</span>
            </div>
            <div style="height: 15px; width: 1px; background: var(--border); margin: 0 5px;"></div>
            <div id="sysTime" style="font-family: 'Fira Code'; font-weight: bold; color: var(--primary);">00:00</div>
            <i data-lucide="settings-2" style="cursor:pointer; width:16px; margin-left: 10px;" onclick="Kernel.ui.toggleSys()"></i>
        </div>
    </nav>

    <main class="main-stage">
        <div class="search-container">
            <input type="text" id="appSearch" class="os-input" placeholder="Search System Modules..." onkeyup="Kernel.ui.search()">
        </div>
        <div id="grid" class="grid-engine"></div>
        <div id="window-layer"></div>
    </main>

    <div id="dock" class="dock" style="display: none;"></div>

    <div id="drawer" class="sys-drawer">
        <h3 style="margin-bottom: 5px;">Control Panel</h3>
        <p style="font-size: 0.7rem; color: var(--text-dim); margin-bottom: 30px;">System Configuration</p>
        
        <div style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px;">
            <p style="font-size: 0.65rem; font-weight: 800; color: var(--text-dim); margin-bottom: 12px; text-transform: uppercase;">Accent Color</p>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
                <div class="color-dot" onclick="Kernel.ui.setTheme('green')" style="background:#00ff88;"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('cyan')" style="background:#00f2ff;"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('purple')" style="background:#bf00ff;"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('red')" style="background:#ff3333;"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('gold')" style="background:#ffcc00;"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('pink')" style="background:#ff0077;"></div>
            </div>
        </div>

        <div style="margin-top: auto;">
            <p style="font-size: 0.65rem; font-weight: 800; color: var(--text-dim); margin-bottom: 12px; text-transform: uppercase;">Security</p>
            <button class="btn-outline" onclick="Auth.lockSystem()"><i data-lucide="lock" style="width:14px; display:inline; vertical-align:middle;"></i> Lock Desktop</button>
            <button class="btn-outline btn-danger" onclick="Auth.resetSystem()"><i data-lucide="trash-2" style="width:14px; display:inline; vertical-align:middle;"></i> Factory Reset</button>
        </div>
    </div>

    <script>
        // --- AUTHENTICATION MODULE ---
        const Auth = {
            user: null,
            pin: null,

            init() {
                lucide.createIcons();
                const savedUser = localStorage.getItem('nebula_user');
                const savedPin = localStorage.getItem('nebula_pin');

                if (savedUser && savedPin) {
                    // Returning user
                    this.user = savedUser;
                    this.pin = savedPin;
                    document.getElementById('setup-form').style.display = 'none';
                    document.getElementById('login-form').style.display = 'block';
                    document.getElementById('login-greeting').innerText = `Welcome, ${this.user}`;
                    document.getElementById('login-pin').focus();
                } else {
                    // New user setup
                    document.getElementById('setup-form').style.display = 'block';
                    document.getElementById('login-form').style.display = 'none';
                    document.getElementById('setup-user').focus();
                }
            },

            createAccount() {
                const username = document.getElementById('setup-user').value.trim();
                const pin = document.getElementById('setup-pin').value.trim();
                const errorEl = document.getElementById('setup-error');

                if (username.length < 2) { errorEl.innerText = "Username too short."; return; }
                if (!/^\d{4}$/.test(pin)) { errorEl.innerText = "PIN must be 4 digits."; return; }

                localStorage.setItem('nebula_user', username);
                localStorage.setItem('nebula_pin', pin);
                this.user = username;
                
                document.getElementById('auth-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-screen').style.display = 'none';
                    Kernel.initSystem(this.user);
                }, 500);
            },

            login() {
                const inputPin = document.getElementById('login-pin').value;
                const errorEl = document.getElementById('login-error');

                if (inputPin === this.pin) {
                    document.getElementById('login-pin').value = '';
                    errorEl.innerText = '';
                    document.getElementById('auth-screen').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('auth-screen').style.display = 'none';
                        Kernel.initSystem(this.user);
                    }, 500);
                } else {
                    errorEl.innerText = "ACCESS DENIED. INVALID PIN.";
                    document.getElementById('login-pin').value = '';
                }
            },

            lockSystem() {
                Kernel.ui.toggleSys(); // Close drawer
                document.getElementById('auth-screen').style.display = 'flex';
                setTimeout(() => document.getElementById('auth-screen').style.opacity = '1', 50);
                document.getElementById('login-pin').focus();
            },

            resetSystem() {
                if(confirm("WARNING: This will delete your profile and system settings. Continue?")) {
                    localStorage.removeItem('nebula_user');
                    localStorage.removeItem('nebula_pin');
                    localStorage.removeItem('neb_theme');
                    location.reload();
                }
            }
        };

        // --- KERNEL & OS MODULE ---
        const Kernel = {
            apps: [
                { id: "ai_core", n: "AI Core", f: "ai.html", i: "bot" },
                { id: "cyber_strike", n: "Cyber Strike", f: "Cyber-Strike.html", i: "zap" },
                { id: "neon_golf", n: "Neon Golf", f: "Neon-Golf.html", i: "target" },
                { id: "block_breaker", n: "Block Breaker", f: "blockbreaker.html", i: "layers" },
                { id: "terminal", n: "Terminal", f: "about:blank", i: "terminal" },
                { id: "files", n: "File System", f: "about:blank", i: "folder" }
            ],
            openWindows: {},
            highestZ: 100,

            initSystem(username) {
                document.getElementById('nav-username').innerText = username;
                this.ui.runBootSequence();
                this.ui.renderDesktop();
                this.ui.startClock();
                this.ui.getHardwareStats();
                lucide.createIcons();
                this.ui.setTheme(localStorage.getItem('neb_theme') || 'green');
            },

            ui: {
                runBootSequence() {
                    const boot = document.getElementById('boot-screen');
                    boot.style.display = 'flex';
                    setTimeout(() => boot.style.opacity = '1', 10);

                    const logs = ["VERIFYING CREDENTIALS...", "MOUNTING VFS...", "STARTING GUI...", "WELCOME TO NEBULA"];
                    let step = 0;
                    const logEl = document.getElementById('boot-text');
                    const interval = setInterval(() => {
                        if(step < logs.length) { logEl.innerText = logs[step]; step++; } 
                        else {
                            clearInterval(interval);
                            boot.style.opacity = '0';
                            setTimeout(() => boot.style.display = 'none', 800);
                        }
                    }, 400);
                },

                renderDesktop() {
                    const grid = document.getElementById('grid');
                    grid.innerHTML = Kernel.apps.map(app => `
                        <div class="app-icon" data-name="${app.n.toLowerCase()}" onclick="Kernel.wm.launch('${app.id}')">
                            <div class="icon-visual"><i data-lucide="${app.i}"></i></div>
                            <div class="app-label">${app.n}</div>
                        </div>
                    `).join('');
                },

                startClock() {
                    const update = () => {
                        const now = new Date();
                        document.getElementById('sysTime').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    };
                    update(); setInterval(update, 1000);
                },

                async getHardwareStats() {
                    if ('getBattery' in navigator) {
                        try {
                            const battery = await navigator.getBattery();
                            const updateBat = () => { document.getElementById('bat-level').innerText = Math.round(battery.level * 100) + '%'; };
                            updateBat(); battery.addEventListener('levelchange', updateBat);
                        } catch(e) {}
                    }
                },

                search() {
                    const q = document.getElementById('appSearch').value.toLowerCase();
                    document.querySelectorAll('.app-icon').forEach(icon => {
                        icon.style.display = icon.dataset.name.includes(q) ? 'flex' : 'none';
                    });
                },

                toggleSys() { document.getElementById('drawer').classList.toggle('open'); },
                setTheme(t) { document.body.className = `theme-${t}`; localStorage.setItem('neb_theme', t); }
            },

            wm: {
                launch(appId) {
                    if(Kernel.openWindows[appId]) { this.focus(appId); return; }
                    const app = Kernel.apps.find(a => a.id === appId);
                    if(!app) return;

                    Kernel.highestZ++;
                    const winId = `win-${appId}`;
                    const offset = Object.keys(Kernel.openWindows).length * 30;

                    const winHtml = `
                        <div class="os-window" id="${winId}" style="left: ${100 + offset}px; top: ${100 + offset}px; z-index: ${Kernel.highestZ};" onmousedown="Kernel.wm.focus('${appId}')">
                            <div class="window-header" onmousedown="Kernel.wm.startDrag(event, '${winId}')">
                                <div class="window-title"><i data-lucide="${app.i}" style="width:14px; height:14px;"></i> ${app.n}</div>
                                <div class="window-controls">
                                    <button class="win-btn btn-min" onclick="Kernel.wm.minimize('${appId}')"></button>
                                    <button class="win-btn btn-close" onclick="Kernel.wm.close('${appId}')"></button>
                                </div>
                            </div>
                            <div class="window-content"><iframe src="${app.f}"></iframe></div>
                        </div>
                    `;
                    document.getElementById('window-layer').insertAdjacentHTML('beforeend', winHtml);
                    lucide.createIcons();
                    
                    Kernel.openWindows[appId] = { el: document.getElementById(winId), minimized: false };
                    this.updateDock();
                },
                close(appId) {
                    const win = Kernel.openWindows[appId];
                    if(win) { win.el.remove(); delete Kernel.openWindows[appId]; this.updateDock(); }
                },
                minimize(appId) {
                    const win = Kernel.openWindows[appId];
                    if(win) { win.el.style.display = win.minimized ? 'flex' : 'none'; win.minimized = !win.minimized; }
                },
                focus(appId) {
                    const win = Kernel.openWindows[appId];
                    if(win) { Kernel.highestZ++; win.el.style.zIndex = Kernel.highestZ; if(win.minimized) this.minimize(appId); }
                },
                updateDock() {
                    const dock = document.getElementById('dock');
                    const apps = Object.keys(Kernel.openWindows);
                    if(apps.length === 0) { dock.style.display = 'none'; return; }
                    
                    dock.style.display = 'flex';
                    dock.innerHTML = apps.map(id => {
                        const app = Kernel.apps.find(a => a.id === id);
                        return `<div class="dock-item active" onclick="Kernel.wm.focus('${id}')" title="${app.n}"><i data-lucide="${app.i}"></i></div>`;
                    }).join('');
                    lucide.createIcons();
                },
                dragState: null,
                startDrag(e, winId) {
                    if(e.target.tagName === 'BUTTON') return; 
                    const win = document.getElementById(winId);
                    const rect = win.getBoundingClientRect();
                    this.dragState = { win: win, offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top };
                    document.body.classList.add('dragging');
                }
            }
        };

        // Drag Listeners
        document.addEventListener('mousemove', e => {
            if(!Kernel.wm.dragState) return;
            const state = Kernel.wm.dragState;
            state.win.style.left = (e.clientX - state.offsetX) + 'px';
            state.win.style.top = (e.clientY - state.offsetY) + 'px';
        });
        document.addEventListener('mouseup', () => { Kernel.wm.dragState = null; document.body.classList.remove('dragging'); });

        // Initialize App
        window.onload = () => Auth.init();
    </script>
</body>
</html>
