
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal | Simple</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #00ff88;
            margin-bottom: 30px;
        }

        .link-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game-link {
            background: #1e1e1e;
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid #333;
            transition: all 0.2s ease;
        }

        .game-link:hover {
            background: #00ff88;
            color: black;
            border-color: #00ff88;
            transform: scale(1.02);
        }

        .footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>MY GAME HUB</h1>

    <div class="link-container">
        <a href="masterarmory.html" target="_blank" class="game-link">Master Armory (Fighting Game)</a>
        <a href="turbohorizon.html" target="_blank" class="game-link">Turbo Horizon (Racing Game)</a>
        <a href="https://www.google.com" target="_blank" class="game-link">🏎️ Racing Games</a>
        <a href="https://www.google.com" target="_blank" class="game-link">🚀 Space Adventures</a>
        <a href="https://www.google.com" target="_blank" class="game-link">⚔️ RPG Quests</a>
        <a href="https://www.google.com" target="_blank" class="game-link">🏀 Sports Games</a>
        <a href="https://www.google.com" target="_blank" class="game-link">👻 Horror Games</a>
        <a href="https://www.google.com" target="_blank" class="game-link">🔫 Multiplayer Battle</a>
        <a href="https://www.google.com" target="_blank" class="game-link">💎 Sandbox World</a>
        <a href="https://www.google.com" target="_blank" class="game-link">🕹️ Retro Classics</a>
    </div>

    <div class="footer">
        Click any link to visit the destination.
    </div>

   
</body>
</html>
