<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA OS | NextGen Enterprise</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #00ff88;
            --primary-rgb: 0, 255, 136;
            --bg: #020305;
            --glass: rgba(15, 18, 24, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        /* --- THEME PROFILES --- */
        body.theme-green { --primary: #00ff88; --primary-rgb: 0, 255, 136; }
        body.theme-cyan { --primary: #00f2ff; --primary-rgb: 0, 242, 255; }
        body.theme-purple { --primary: #bf00ff; --primary-rgb: 191, 0, 255; }
        body.theme-red { --primary: #ff3333; --primary-rgb: 255, 51, 51; }
        body.theme-gold { --primary: #ffcc00; --primary-rgb: 255, 204, 0; }
        body.theme-pink { --primary: #ff0077; --primary-rgb: 255, 0, 119; }
        body.theme-orange { --primary: #ff6600; --primary-rgb: 255, 102, 0; }
        body.theme-blue { --primary: #0066ff; --primary-rgb: 0, 102, 255; }
        body.theme-crimson { --primary: #dc143c; --primary-rgb: 220, 20, 60; }
        body.theme-matrix { --primary: #00ff00; --primary-rgb: 0, 255, 0; }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            background-color: var(--bg); color: var(--text-main);
            height: 100vh; overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex; flex-direction: column;
        }

        /* --- BOOT SCREEN --- */
        #boot-screen {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease;
        }
        .boot-logo {
            font-size: 3.5rem; font-weight: 800; letter-spacing: 6px; color: #fff;
            text-shadow: 0 0 25px rgba(var(--primary-rgb), 0.5); 
            animation: pulse 2s infinite;
        }
        .boot-log {
            margin-top: 30px; font-family: 'Fira Code', monospace; color: var(--primary); font-size: 0.85rem;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(0.98); } }

        /* --- BACKGROUND --- */
        .desktop-bg {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(var(--primary-rgb), 0.05), transparent 40%),
                        radial-gradient(circle at 85% 30%, rgba(var(--primary-rgb), 0.04), transparent 50%);
        }

        /* --- TOP NAV --- */
        nav {
            height: 55px; padding: 0 25px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--border);
            backdrop-filter: blur(30px); background: var(--glass); z-index: 100;
        }
        .sys-info { display: flex; align-items: center; gap: 20px; font-size: 0.8rem; }
        .stat-badge { font-family: 'Fira Code'; color: var(--primary); background: rgba(var(--primary-rgb), 0.1); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;}
        .hw-stats { display: flex; gap: 12px; color: var(--text-dim); align-items: center; }
        .hw-stats i { width: 16px; height: 16px; }

        /* --- MAIN DESKTOP --- */
        .main-stage {
            flex: 1; overflow-y: auto; padding: 30px 20px; position: relative; scroll-behavior: smooth;
        }

        .search-container {
            width: 100%; max-width: 650px; margin: 0 auto 40px; position: sticky; top: 0; z-index: 10;
        }
        .os-input {
            width: 100%; padding: 18px 25px; border-radius: 16px;
            background: rgba(10, 12, 16, 0.9); border: 1px solid var(--border);
            color: white; font-size: 1rem; outline: none; backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.2, 1, 0.3, 1);
            font-family: inherit;
        }
        .os-input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 10px 30px rgba(var(--primary-rgb), 0.25), 0 0 0 1px var(--primary); 
            transform: translateY(-2px);
        }

        /* --- APP GRID --- */
        .grid-engine {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 25px; max-width: 1200px; margin: 0 auto 100px;
        }
        .app-icon {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            padding: 20px 10px; border-radius: 20px; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer; text-decoration: none; color: inherit; border: 1px solid transparent;
        }
        .app-icon:hover { 
            background: rgba(255,255,255,0.03); 
            border-color: rgba(var(--primary-rgb), 0.3);
            transform: translateY(-8px) scale(1.02); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        .icon-visual {
            width: 65px; height: 65px; border-radius: 18px;
            background: linear-gradient(135deg, #1e242c, #0f1218);
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); border: 1px solid var(--border);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); pointer-events: none;
            transition: 0.3s;
        }
        .app-icon:hover .icon-visual {
            box-shadow: 0 0 25px rgba(var(--primary-rgb), 0.4);
            color: #fff;
            background: var(--primary);
            border-color: transparent;
        }
        .app-label { 
            font-size: 0.8rem; font-weight: 700; text-align: center; pointer-events: none; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); letter-spacing: 0.5px;
        }

        /* --- SYSTEM DRAWER (Settings) --- */
        .sys-drawer {
            position: fixed; right: -400px; top: 0; width: 380px; height: 100%;
            background: rgba(5, 7, 10, 0.95); backdrop-filter: blur(50px);
            border-left: 1px solid var(--border); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 40px; z-index: 200; display: flex; flex-direction: column;
        }
        .sys-drawer.open { right: 0; box-shadow: -20px 0 50px rgba(0,0,0,0.5); }
        
        .drawer-header { margin-bottom: 30px; }
        .drawer-header h2 { font-weight: 800; letter-spacing: 1px; }

        .config-card {
            background: rgba(255,255,255,0.02); padding: 25px; border-radius: 20px; 
            border: 1px solid var(--border); margin-bottom: 25px;
        }
        .config-label {
            font-size: 0.65rem; font-weight: 800; color: var(--text-dim); 
            margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1.5px;
        }

        .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .color-dot { 
            height: 40px; border-radius: 12px; cursor: pointer; transition: 0.2s; 
            border: 2px solid transparent; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .color-dot:hover { transform: translateY(-4px) scale(1.1); border-color: #fff; }

        .btn-prime {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            background: var(--primary); color: #000; font-weight: 800; letter-spacing: 1px;
            cursor: pointer; margin-top: 10px; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-prime:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(var(--primary-rgb), 0.3); }
        .btn-prime:active { transform: scale(0.98); }
        .btn-outline {
            background: transparent; border: 1px solid var(--border); color: #fff;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.05); box-shadow: none; border-color: #fff; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body class="theme-green">
    
    <div id="boot-screen">
        <div class="boot-logo">NEBULA<span style="color:var(--primary)">.OS</span></div>
        <div class="boot-log" id="boot-text">INITIALIZING KERNEL...</div>
    </div>

    <div class="desktop-bg"></div>

    <nav>
        <div class="sys-info">
            <div style="font-weight: 800; letter-spacing: 2px; font-size: 1.1rem;">NEBULA<span style="color:var(--primary)">.OS</span></div>
            <div class="stat-badge" id="nodeCount">24_NODES</div>
        </div>
        <div class="sys-info">
            <div class="hw-stats">
                <i data-lucide="wifi"></i>
                <i data-lucide="battery-charging"></i>
                <span id="bat-level" style="font-family: 'Fira Code'; font-size: 0.75rem;">100%</span>
            </div>
            <div style="height: 20px; width: 1px; background: var(--border); margin: 0 10px;"></div>
            <div id="sysTime" style="font-family: 'Fira Code'; font-weight: bold; color: var(--text-main); font-size: 0.9rem;">00:00:00</div>
            <button onclick="Kernel.ui.toggleSys()" style="background:transparent; border:none; color:white; cursor:pointer; margin-left: 10px; transition: 0.2s;">
                <i data-lucide="settings-2" style="width: 20px; height: 20px;"></i>
            </button>
        </div>
    </nav>

    <main class="main-stage">
        <div class="search-container">
            <input type="text" id="appSearch" class="os-input" placeholder="Search Quantum Modules..." onkeyup="Kernel.ui.search()">
        </div>
        <div id="grid" class="grid-engine"></div>
    </main>

    <div id="drawer" class="sys-drawer">
        <div class="drawer-header">
            <h2>System Console</h2>
            <p style="font-size: 0.8rem; color: var(--text-dim); margin-top: 5px;">Configuration & Support</p>
        </div>
        
        <div class="config-card">
            <p class="config-label">Interface Color Profile</p>
            <div class="color-grid">
                <div class="color-dot" onclick="Kernel.ui.setTheme('green')" style="background:#00ff88;" title="Neon Green"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('cyan')" style="background:#00f2ff;" title="Cyan"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('purple')" style="background:#bf00ff;" title="Deep Purple"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('pink')" style="background:#ff0077;" title="Hot Pink"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('red')" style="background:#ff3333;" title="Laser Red"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('orange')" style="background:#ff6600;" title="Orange"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('gold')" style="background:#ffcc00;" title="Gold"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('blue')" style="background:#0066ff;" title="Electric Blue"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('crimson')" style="background:#dc143c;" title="Crimson"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('matrix')" style="background:#00ff00;" title="Matrix"></div>
            </div>
        </div>

        <div style="margin-top: auto; padding-bottom: 20px;">
            <p class="config-label">Assistance</p>
            <button class="btn-prime" onclick="window.open('https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAN__4XhIPhUOE9XTUQ5QVIxT05ZVEZONUhXREZTVjgxRC4u', '_blank')">
                <i data-lucide="help-circle"></i>
                SUPPORT REQUEST
            </button>
            <button class="btn-prime btn-outline" onclick="Kernel.ui.toggleSys()">
                EXIT SETTINGS
            </button>
        </div>
    </div>

    <script>
        const Kernel = {
            apps: [
                { n: "Cyber Strike", f: "Cyber-Strike.html", i: "zap" },
                { n: "Neon Golf", f: "Neon-Golf.html", i: "target" },
                { n: "Neon Hex", f: "Neon-Hex.html", i: "hexagon" },
                { n: "Neon Pong", f: "Neon-Pong.html", i: "activity" },
                { n: "Neon Slams", f: "Neon-Slams.html", i: "dribbble" },
                { n: "Neon Slash", f: "Neon-Slash.html", i: "sword" },
                { n: "AI Core", f: "ai.html", i: "bot" },
                { n: "Basketball", f: "basketball.html", i: "circle" },
                { n: "Block Blast", f: "blockblast.html", i: "grid" },
                { n: "Block Breaker", f: "blockbreaker.html", i: "layers" },
                { n: "Block Craft", f: "blockcraft.html", i: "box" },
                { n: "Cricket", f: "cricket.html", i: "trophy" },
                { n: "Drift King", f: "drift.html", i: "navigation-2" },
                { n: "Football", f: "football.html", i: "award" },
                { n: "Master Armory", f: "masterarmory.html", i: "shield" },
                { n: "Minesweeper", f: "minesweeper.html", i: "bomb" },
                { n: "Neon Trail", f: "neon-trail.html", i: "wind" },
                { n: "Overdrive", f: "overdrive.html", i: "gauge" },
                { n: "Reader", f: "reader.html", i: "book-open" },
                { n: "Snake Pro", f: "snake.html", i: "trending-up" },
                { n: "AI 2", f: "Ai2.html", i: "cpu" },
                { n: "Space Adventure", f: "spaceadventure.html", i: "rocket" },
                { n: "Sparks Maths", f: "sparksmaths.html", i: "divide" },
                { n: "Tic Tac Toe", f: "tictactoe.html", i: "x" }
            ],

            ui: {
                init() {
                    this.runBootSequence();
                    this.renderDesktop();
                    this.startClock();
                    this.getHardwareStats();
                    lucide.createIcons();
                    this.setTheme(localStorage.getItem('neb_theme') || 'green');
                },
                
                runBootSequence() {
                    const logs = ["MOUNTING VFS...", "LOADING DRIVERS...", "STARTING GUI...", "SYSTEM READY"];
                    let step = 0;
                    const logEl = document.getElementById('boot-text');
                    const interval = setInterval(() => {
                        if(step < logs.length) { logEl.innerText = logs[step]; step++; } 
                        else {
                            clearInterval(interval);
                            document.getElementById('boot-screen').style.opacity = '0';
                            setTimeout(() => document.getElementById('boot-screen').style.display = 'none', 800);
                        }
                    }, 350);
                },

                renderDesktop() {
                    const grid = document.getElementById('grid');
                    // Render anchor tags with target="_blank" to open in a new tab
                    grid.innerHTML = Kernel.apps.map(app => `
                        <a href="${app.f}" target="_blank" class="app-icon" data-name="${app.n.toLowerCase()}">
                            <div class="icon-visual"><i data-lucide="${app.i}"></i></div>
                            <div class="app-label">${app.n}</div>
                        </a>
                    `).join('');
                },

                startClock() {
                    const update = () => {
                        const now = new Date();
                        document.getElementById('sysTime').innerText = now.toLocaleTimeString([], {hour12: false});
                    };
                    update(); setInterval(update, 1000);
                },

                async getHardwareStats() {
                    // Try to get actual battery API if supported by the browser
                    if ('getBattery' in navigator) {
                        try {
                            const battery = await navigator.getBattery();
                            const updateBat = () => { 
                                document.getElementById('bat-level').innerText = Math.round(battery.level * 100) + '%'; 
                            };
                            updateBat();
                            battery.addEventListener('levelchange', updateBat);
                        } catch(e) {
                            document.getElementById('bat-level').innerText = 'PWR';
                        }
                    } else {
                        document.getElementById('bat-level').innerText = 'PWR';
                    }
                },

                search() {
                    const q = document.getElementById('appSearch').value.toLowerCase();
                    let count = 0;
                    document.querySelectorAll('.app-icon').forEach(icon => {
                        const match = icon.dataset.name.includes(q);
                        icon.style.display = match ? 'flex' : 'none';
                        if(match) count++;
                    });
                    document.getElementById('nodeCount').innerText = `${count}_NODES`;
                },

                toggleSys() { 
                    document.getElementById('drawer').classList.toggle('open'); 
                },
                
                setTheme(t) {
                    document.body.className = `theme-${t}`;
                    localStorage.setItem('neb_theme', t);
                }
            }
        };

        window.onload = () => Kernel.ui.init();
    </script>
</body>
</html>
