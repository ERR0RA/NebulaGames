<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula | Beyond Gaming</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00ff88;
      --primary-glow: rgba(0, 255, 136, 0.3);
      --secondary: #00d9ff;
      --secondary-glow: rgba(0, 217, 255, 0.2);
      --bg: #050608;
      --card-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.5);
    }

    /* Theme Definitions */
    [data-theme="cyber"] { --primary:#ff2bd6; --primary-glow:rgba(255,43,214,0.3); --secondary:#00f5ff; }
    [data-theme="ocean"] { --primary:#00d9ff; --primary-glow:rgba(0,217,255,0.3); --secondary:#38ffb5; }
    [data-theme="violet"] { --primary:#8b5cf6; --primary-glow:rgba(139,92,246,0.3); --secondary:#00f5ff; }
    [data-theme="amber"] { --primary:#ffaa00; --primary-glow:rgba(255,170,0,0.3); --secondary:#ff4d6d; }
    [data-theme="ice"] { --primary:#7dd3fc; --primary-glow:rgba(125,211,252,0.3); --secondary:#c4b5fd; }
    [data-theme="crimson"] { --primary:#ff3b3b; --primary-glow:rgba(255,59,59,0.3); --secondary:#ffd166; }

    * { box-sizing: border-box; cursor: none !important; }
    
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Noise & Scanline Overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('https://grainy-gradients.vercel.app/noise.svg');
      opacity: 0.05;
      pointer-events: none;
      z-index: 10;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      z-index: 11;
      opacity: 0.3;
    }

    /* Dynamic Backgrounds */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-bg="neon"] .bg-layer {
      background: radial-gradient(circle at 20% 30%, var(--primary-glow) 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, var(--secondary-glow) 0%, transparent 40%);
    }

    /* Custom Cursor */
    .cursor-dot {
      width: 6px; height: 6px; background: var(--primary);
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 10000;
      box-shadow: 0 0 15px var(--primary); transition: transform 0.1s;
    }
    .cursor-ring {
      width: 38px; height: 38px; border: 1.5px solid var(--primary);
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 9999;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(255,255,255,0.02);
    }

    /* Header Styling */
    header {
      padding: 100px 20px 40px;
      text-align: center;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 800;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: -2px;
      background: linear-gradient(to bottom, #fff 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px var(--primary-glow));
    }

    .sub-header {
      font-family: "Fira Code", monospace;
      color: var(--primary);
      font-size: 0.8rem;
      letter-spacing: 5px;
      margin-top: 10px;
      opacity: 0.8;
    }

    /* Search Bar */
    .search-container {
      width: min(90%, 500px);
      margin: 20px auto 60px;
      position: relative;
    }

    #moduleSearch {
      width: 100%;
      padding: 16px 24px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      color: white;
      font-size: 1rem;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      text-align: center;
    }

    #moduleSearch:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
    }

    /* Game Grid & Cards */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      width: min(95%, 1300px);
      margin: 0 auto 150px;
      padding: 20px;
    }

    .game-card {
      position: relative;
      height: 180px;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      overflow: hidden;
      backdrop-filter: blur(5px);
    }

    .game-card:hover {
      border-color: var(--primary);
      background: rgba(255,255,255,0.06);
      transform: translateY(-5px);
    }

    .game-card .shine {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--x) var(--y), rgba(255,255,255,0.1) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .game-card:hover .shine { opacity: 1; }

    .game-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      z-index: 2;
      text-align: center;
      padding: 0 20px;
    }

    .game-status {
      font-family: "Fira Code", monospace;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 10px;
      z-index: 2;
    }

    .badge {
      position: absolute;
      top: 15px; right: 15px;
      font-size: 0.6rem;
      padding: 4px 10px;
      background: var(--primary);
      color: #000;
      border-radius: 5px;
      font-weight: 800;
      text-transform: uppercase;
    }

    /* Command Deck (Bottom Controls) */
    .command-deck {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 100;
      background: rgba(10, 10, 10, 0.7);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
    }

    .control-group:not(:last-child) {
      border-right: 1px solid var(--glass-border);
    }

    .theme-dot {
      width: 18px; height: 18px;
      border-radius: 4px;
      border: 2px solid transparent;
      transition: 0.2s;
    }

    .theme-dot:hover { transform: scale(1.2); border-color: white; }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--glass-border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      transition: 0.3s;
    }

    .nav-btn:hover, .nav-btn.active {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--primary-glow);
    }

  </style>
</head>
<body data-bg="neon">
  <div class="bg-layer"></div>
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <header>
    <h1>Nebula</h1>
    <div class="sub-header">// CLOUD_INTERFACE_v2.0</div>
  </header>

  <div class="search-container">
    <input type="text" id="moduleSearch" placeholder="SEARCH DATABANKS..." onkeyup="filterGames()">
  </div>

  <div id="gameGrid" class="game-grid"></div>

  <div class="command-deck">
    <div class="control-group">
      <div class="theme-dot" style="background:#00ff88" onclick="setTheme('default')"></div>
      <div class="theme-dot" style="background:#ff2bd6" onclick="setTheme('cyber')"></div>
      <div class="theme-dot" style="background:#00d9ff" onclick="setTheme('ocean')"></div>
      <div class="theme-dot" style="background:#8b5cf6" onclick="setTheme('violet')"></div>
      <div class="theme-dot" style="background:#ffaa00" onclick="setTheme('amber')"></div>
    </div>
    <div class="control-group">
      <button class="nav-btn active" onclick="setBg('neon', this)">NEON</button>
      <button class="nav-btn" onclick="setBg('minimal', this)">MINIMAL</button>
    </div>
  </div>

  <script>
    const games = [
      { name: "Sparx AUTO SOLVER", url: "Solver.html", tag: "Utility" },
      { name: "Maths Revision", url: "Revise.html", tag: "Study" },
      { name: "Bot Arena", url: "Bot-Arena.html", tag: "Action" },
      { name: "Neon Defense", url: "Neon-Defense.html", tag: "Defense" },
      { name: "Neon Reactor", url: "Neon-Reactor.html", tag: "Puzzle" },
      { name: "Blockcraft", url: "blockcraft.html", tag: "Creative" },
      { name: "Neon Snake", url: "snake.html", tag: "Classic" },
      { name: "Master Armory", url: "masterarmory.html", tag: "RPG" },
      { name: "Turbo Horizon", url: "turbohorizon.html", tag: "Racing" }
    ];

    function buildGrid() {
      const grid = document.getElementById("gameGrid");
      grid.innerHTML = games.map(game => `
        <a href="${game.url}" class="game-card" target="_blank">
          <div class="shine"></div>
          ${game.tag ? `<span class="badge">${game.tag}</span>` : ""}
          <span class="game-title">${game.name}</span>
          <span class="game-status">SYSTEM_READY</span>
        </a>
      `).join("");

      // Re-init interactions
      initCardInteractions();
    }

    function initCardInteractions() {
      document.querySelectorAll('.game-card').forEach(card => {
        card.addEventListener('mousemove', e => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          card.style.setProperty('--x', `${x}px`);
          card.style.setProperty('--y', `${y}px`);
          
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const rotateX = (y - centerY) / 10;
          const rotateY = (centerX - x) / 10;
          
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-5px)`;
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0)`;
        });
      });
    }

    function initCursor() {
      const dot = document.querySelector(".cursor-dot");
      const ring = document.querySelector(".cursor-ring");
      
      document.addEventListener("mousemove", e => {
        dot.style.transform = `translate3d(${e.clientX - 3}px, ${e.clientY - 3}px, 0)`;
        ring.style.transform = `translate3d(${e.clientX - 19}px, ${e.clientY - 19}px, 0)`;
      });

      document.querySelectorAll('a, button, .theme-dot').forEach(el => {
        el.onmouseenter = () => ring.style.transform += " scale(1.5)";
        el.onmouseleave = () => ring.style.transform = ring.style.transform.replace(" scale(1.5)", "");
      });
    }

    function setTheme(t) {
      if (t === "default") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", t);
    }

    function setBg(bg, btn) {
      document.body.setAttribute("data-bg", bg);
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function filterGames() {
      const val = document.getElementById("moduleSearch").value.toLowerCase();
      document.querySelectorAll(".game-card").forEach(el => {
        const name = el.querySelector(".game-title").innerText.toLowerCase();
        el.style.display = name.includes(val) ? "flex" : "none";
      });
    }

    // Initialize
    buildGrid();
    initCursor();
  </script>
</body>
</html>
