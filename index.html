<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Games | Official Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.3);
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --updating: #ffcc00;
            --error: #ff3333;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% -20%, #11221a 0%, #050505 80%);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header { text-align: center; padding: 60px 20px 40px; }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 900; margin: 0;
            letter-spacing: 10px; text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }

        .subtitle { color: var(--primary); opacity: 0.6; margin-top: 10px; font-size: 0.8rem; letter-spacing: 4px; text-transform: uppercase; }

        /* --- Status Panel --- */
        .status-panel {
            width: 90%; max-width: 1100px;
            background: rgba(0, 255, 136, 0.03);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 12px; padding: 20px;
            margin-bottom: 40px; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;
        }
        .status-item { display: flex; flex-direction: column; gap: 5px; }
        .status-label { font-family: 'Orbitron', sans-serif; font-size: 0.65rem; color: rgba(255,255,255,0.5); text-transform: uppercase; }
        .status-value { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 700; }
        .online { color: var(--primary); }
        .offline { color: var(--error); }

        /* --- Grid --- */
        h5 {
            font-family: 'Orbitron', sans-serif; color: #fff;
            text-transform: uppercase; letter-spacing: 2px;
            margin: 20px 0; width: 90%; max-width: 1100px;
            font-size: 0.9rem; border-left: 3px solid var(--primary); padding-left: 15px;
        }

        .link-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px; width: 90%; max-width: 1100px; margin-bottom: 40px;
        }

        .game-link {
            position: relative; background: var(--card-bg);
            text-decoration: none; height: 85px;
            border-radius: 8px; border: 1px solid var(--card-border);
            transition: all 0.3s ease; display: flex;
            align-items: center; justify-content: center;
        }

        .game-link:hover:not(.is-down) {
            background: rgba(0, 255, 136, 0.08);
            border-color: var(--primary); transform: translateY(-3px);
        }

        .game-title { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 0.85rem; color: #fff; text-align: center; padding: 0 10px; }

        /* --- Badges --- */
        .badge { position: absolute; top: 0; right: 0; font-size: 0.5rem; padding: 3px 8px; font-weight: 900; text-transform: uppercase; border-bottom-left-radius: 6px; }
        .best { background: var(--primary); color: #000; }
        .upd { background: var(--updating); color: #000; }
        .down { background: var(--error); color: #fff; }

        /* --- Down State --- */
        .game-link.is-down { opacity: 0.5; cursor: not-allowed; border-color: var(--error) !important; }
        .game-link.is-down .game-title { color: var(--error); }

        footer { padding: 60px; text-align: center; color: #444; font-size: 0.75rem; font-family: 'Orbitron'; letter-spacing: 2px; }
    </style>
</head>
<body>

    <header>
        <h1>Nebula Games</h1>
        <div class="subtitle">System Operator: DC</div>
    </header>

    <div class="status-panel">
        <div class="status-item">
            <span class="status-label">Global Status</span>
            <span id="global-status" class="status-value online">● CHECKING...</span>
        </div>
        <div class="status-item">
            <span class="status-label">Active Modules</span>
            <span id="active-count" class="status-value">-- Stable</span>
        </div>
        <div class="status-item">
            <span class="status-label">Offline / Errors</span>
            <span id="error-count" class="status-value offline">-- Down</span>
        </div>
    </div>

    <h5>🕹️ Stable Links</h5>
    <div id="stable-container" class="link-container">
        </div>

    <h5>⚠️ Core Errors / Maintenance</h5>
    <div id="error-container" class="link-container">
        </div>

    <script>
        // ADD NEW GAMES HERE
        // Format: { name: "Name", url: "file.html", tag: "best" or "upd" or "" }
        const games = [
            { name: "Blockcraft", url: "blockcraft.html", tag: "upd" },
            { name: "Minesweeper", url: "minesweeper.html", tag: "best" },
            { name: "Block Breaker", url: "blockbreaker.html", tag: "best" },
            { name: "Neon Snake", url: "snake.html", tag: "best" },
            { name: "Master Armory", url: "masterarmory.html", tag: "best" },
            { name: "Neon Pong", url: "Neon-Pong.html", tag: "best" },
            { name: "Basketball", url: "basketball.html", tag: "" },
            { name: "Football", url: "football.html", tag: "" },
            { name: "Turbo Horizon", url: "turbohorizon.html", tag: "" }, // Will go to error if file missing
            { name: "Space Adventure", url: "spaceadventure.html", tag: "" },
            { name: "Sparx Solver", url: "sparxmaths.html", tag: "" },
            { name: "Sparx Reader", url: "reader.html", tag: "" }
        ];

        async function checkGames() {
            const stableBox = document.getElementById('stable-container');
            const errorBox = document.getElementById('error-container');
            let stableCount = 0;
            let errorCount = 0;

            for (const game of games) {
                const card = document.createElement('a');
                card.href = game.url;
                card.className = 'game-link';
                
                let isDown = false;

                try {
                    // This "Pings" the file to see if it exists
                    const response = await fetch(game.url, { method: 'HEAD' });
                    if (!response.ok) isDown = true;
                } catch (e) {
                    isDown = true;
                }

                if (isDown) {
                    card.classList.add('is-down');
                    card.href = "#";
                    card.innerHTML = `<span class="badge down">Error</span><span class="game-title">${game.name}</span>`;
                    errorBox.appendChild(card);
                    errorCount++;
                } else {
                    const tagHTML = game.tag ? `<span class="badge ${game.tag}">${game.tag === 'upd' ? 'Updating' : 'Best'}</span>` : '';
                    card.innerHTML = `${tagHTML}<span class="game-title">${game.name}</span>`;
                    stableBox.appendChild(card);
                    stableCount++;
                }
            }

            // Update Status Panel
            document.getElementById('active-count').innerText = `${stableCount} Stable`;
            document.getElementById('error-count').innerText = `${errorCount} Down`;
            document.getElementById('global-status').innerText = errorCount > 0 ? "● SYSTEM ISSUES" : "● OPERATIONAL";
            document.getElementById('global-status').className = `status-value ${errorCount > 0 ? 'offline' : 'online'}`;
        }

        checkGames();
    </script>

    <footer>
        DC × AK × AI // AUTO-DIAGNOSTIC ENABLED
    </footer>
</body>
</html>
