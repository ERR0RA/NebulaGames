<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA | Gaming OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88; --bg: #050608; --surface: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1); --text: #ffffff; --text-dim: #94a3b8;
            --danger: #ff4444; --warning: #ffaa00;
        }
        /* Expanded Themes */
        body.theme-green { --primary: #00ff88; }
        body.theme-red { --primary: #ff4444; }
        body.theme-blue { --primary: #00d9ff; }
        body.theme-purple { --primary: #a855f7; }
        body.theme-gold { --primary: #ffcc00; }
        body.theme-rose { --primary: #ff0077; }
        body.theme-midnight { --primary: #3344ff; }
        body.theme-aqua { --primary: #00fff2; }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: 0.3s; }

        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, var(--primary), transparent 50%), radial-gradient(circle at 100% 100%, var(--primary), transparent 30%);
            opacity: 0.12; filter: blur(80px); z-index: -1;
        }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(5, 6, 8, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        
        .theme-swatch { display: flex; gap: 5px; margin-right: 15px; }
        .swatch { width: 15px; height: 15px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }

        #devPanel { position: fixed; top: 0; right: -100%; width: 100%; max-width: 800px; height: 100vh; background: #0a0c10; border-left: 2px solid var(--primary); z-index: 4000; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); padding: 30px; overflow-y: auto; }
        #devPanel.active { right: 0; box-shadow: -30px 0 60px #000; }
        
        .admin-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .admin-table th { text-align: left; color: var(--text-dim); padding: 12px; border-bottom: 1px solid var(--border); }
        .admin-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.02); }
        
        .btn { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: #fff; font-size: 0.65rem; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-primary { border-color: var(--primary); color: var(--primary); }
        .btn-danger { border-color: var(--danger); color: var(--danger); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 40px 5%; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 35px 15px; text-decoration: none; color: white; text-align: center; font-weight: 800; transition: 0.3s; }
        .card:hover { border-color: var(--primary); transform: translateY(-5px); }

        .modal { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 90%; max-width: 400px; padding: 50px; background: #0d1117; border-radius: 40px; text-align: center; border: 1px solid var(--border); }
        .auth-field { width: 100%; padding: 18px; margin-top: 15px; border-radius: 15px; border: 1px solid #222; background: #050608; color: #fff; text-align: center; }
    </style>
</head>
<body class="theme-green">

    <div class="bg-mesh"></div>

    <div id="devPanel">
        <h2 style="color: var(--primary); margin-bottom: 20px;">OS OVERSEER</h2>
        
        <div class="admin-card">
            <h3>SYNC BRIDGE (Cross-Device)</h3>
            <p style="font-size: 0.6rem; color: var(--text-dim); margin-bottom: 10px;">Copy this string to another device to sync users:</p>
            <textarea id="syncData" style="width:100%; height:60px; background:#000; color:var(--primary); font-size:0.5rem; border:1px solid var(--border); padding:5px;"></textarea>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn btn-primary" onclick="exportData()">COPY LOCAL DATA</button>
                <button class="btn btn-primary" onclick="importData()">IMPORT CLOUD DATA</button>
            </div>
        </div>

        <div class="admin-card">
            <h3 id="nodeCount">NODES: 0</h3>
            <table class="admin-table">
                <thead><tr><th>USER</th><th>IP</th><th>HWID</th><th>ACTION</th></tr></thead>
                <tbody id="userRows"></tbody>
            </table>
        </div>

        <div class="admin-card">
            <h3 style="color:var(--danger)">BLACKLIST</h3>
            <div id="blacklistLog"></div>
        </div>
        <button class="btn btn-primary" onclick="toggleDev()" style="width:100%; padding:15px;">EXIT</button>
    </div>

    <div id="authOverlay" class="modal">
        <div class="auth-box">
            <h1 style="letter-spacing: 12px; color: var(--primary);">NEBULA</h1>
            <input type="text" id="userInput" class="auth-field" placeholder="ID">
            <input type="password" id="passInput" class="auth-field" placeholder="PASS">
            <button style="width:100%; padding:18px; margin-top:30px; border-radius:15px; background:var(--primary); color:#000; font-weight:800; border:none;" onclick="processAuth()">ENTER</button>
            <p onclick="toggleAuthMode()" id="toggleTxt" style="font-size:0.7rem; margin-top:25px; cursor:pointer; color:var(--text-dim);">REGISTER</p>
        </div>
    </div>

    <nav>
        <div style="display:flex; align-items:center;">
            <div class="theme-swatch">
                <div class="swatch" style="background:#00ff88" onclick="setTheme('green')"></div>
                <div class="swatch" style="background:#ff4444" onclick="setTheme('red')"></div>
                <div class="swatch" style="background:#00d9ff" onclick="setTheme('blue')"></div>
                <div class="swatch" style="background:#a855f7" onclick="setTheme('purple')"></div>
                <div class="swatch" style="background:#ffcc00" onclick="setTheme('gold')"></div>
                <div class="swatch" style="background:#ff0077" onclick="setTheme('rose')"></div>
            </div>
            <h1 style="font-size:1rem; letter-spacing:3px;">NEBULA<span style="color:var(--primary)">.OS</span></h1>
        </div>
        <div>
            <span id="devTrigger" class="btn btn-primary" onclick="toggleDev()" style="display:none; margin-right:15px;">ADMIN</span>
            <span class="btn" onclick="doLogout()">Logout</span>
        </div>
    </nav>

    <div id="gameGrid" class="grid"></div>

    <script>
        const _0xADMIN_USER = "ADMIN", _0xADMIN_PASS = "12345678!";
        const DEVICE_ID = btoa(navigator.userAgent).substring(15, 30).replace(/[^a-zA-Z]/g, '');
        let currentMockIP = "172.16.100." + Math.floor(Math.random()*255);
        let isLoginMode = true;

        const repoFiles = ["Cyber-Strike.html", "Neon-Golf.html", "Neon-Hex.html", "Neon-Pong.html", "Neon-Slams.html", "Neon-Slash.html", "ai.html", "basketball.html", "blockblast.html", "blockbreaker.html", "blockcraft.html", "cricket.html", "crossyroads.html", "drift.html", "eggshell.html", "football.html", "masterarmory.html", "minesweeper.html", "neon-trail.html", "overdrive.html", "pacman.html", "reader.html", "snake.html", "spaceadventure.html", "sparksmaths.html", "tictactoe.html"];

        // --- IP REFRESHER ---
        setInterval(() => {
            const active = localStorage.getItem('neb_active');
            if (active && active !== 'ADMIN') {
                currentMockIP = "172.16.100." + Math.floor(Math.random()*255);
                let db = JSON.parse(localStorage.getItem('neb_db')) || {};
                if (db[active]) {
                    db[active].lastIP = currentMockIP;
                    localStorage.setItem('neb_db', JSON.stringify(db));
                }
            }
        }, 5000);

        // --- BAN KICKER ---
        setInterval(() => {
            const active = localStorage.getItem('neb_active');
            if (!active || active === 'ADMIN') return;
            const bans = JSON.parse(localStorage.getItem('neb_blacklist')) || {};
            if (bans[active.toLowerCase()] || bans[currentMockIP] || bans[DEVICE_ID]) {
                localStorage.removeItem('neb_active');
                location.reload();
            }
        }, 1000);

        function processAuth() {
            const u = document.getElementById('userInput').value.trim();
            const p = document.getElementById('passInput').value.trim();
            if(u.toUpperCase() === _0xADMIN_USER && p === _0xADMIN_PASS) {
                localStorage.setItem('neb_active', 'ADMIN'); location.reload(); return;
            }
            let db = JSON.parse(localStorage.getItem('neb_db')) || {};
            if(isLoginMode) {
                if(db[u] && db[u].pw === p) {
                    db[u].lastIP = currentMockIP; db[u].lastDev = DEVICE_ID;
                    localStorage.setItem('neb_db', JSON.stringify(db));
                    localStorage.setItem('neb_active', u); location.reload();
                } else alert("INVALID");
            } else {
                db[u] = { pw: p, lastIP: currentMockIP, lastDev: DEVICE_ID };
                localStorage.setItem('neb_db', JSON.stringify(db));
                localStorage.setItem('neb_active', u); location.reload();
            }
        }

        // --- SYNC ENGINE ---
        function exportData() {
            const db = localStorage.getItem('neb_db');
            document.getElementById('syncData').value = btoa(db);
            alert("Data Exported to textarea. Copy it!");
        }
        function importData() {
            try {
                const data = atob(document.getElementById('syncData').value);
                localStorage.setItem('neb_db', data);
                refreshAdminUI();
                alert("Cloud Sync Complete!");
            } catch(e) { alert("Invalid Sync String"); }
        }

        function applyBan(target, type, username) {
            let bans = JSON.parse(localStorage.getItem('neb_blacklist')) || {};
            bans[target.toString()] = { type, expiry: null };
            localStorage.setItem('neb_blacklist', JSON.stringify(bans));
            refreshAdminUI();
        }

        function revertBan(key) {
            let bans = JSON.parse(localStorage.getItem('neb_blacklist')) || {};
            delete bans[key];
            localStorage.setItem('neb_blacklist', JSON.stringify(bans));
            refreshAdminUI();
        }

        function refreshAdminUI() {
            const db = JSON.parse(localStorage.getItem('neb_db')) || {};
            const bans = JSON.parse(localStorage.getItem('neb_blacklist')) || {};
            const keys = Object.keys(db);
            document.getElementById('nodeCount').innerText = `NODES: ${keys.length}`;
            document.getElementById('userRows').innerHTML = keys.map(u => `
                <tr>
                    <td style="color:var(--primary)">${u}</td>
                    <td>${db[u].lastIP || '---'}</td>
                    <td style="font-size:0.5rem">${db[u].lastDev || '---'}</td>
                    <td>
                        <button class="btn btn-danger" onclick="applyBan('${u.toLowerCase()}','ACC','${u}')">ACC</button>
                        <button class="btn btn-danger" onclick="applyBan('${db[u].lastIP}','IP','${u}')">IP</button>
                    </td>
                </tr>`).join('');
            document.getElementById('blacklistLog').innerHTML = Object.keys(bans).map(k => `
                <div style="background:rgba(255,0,0,0.1); padding:5px; margin-top:5px; display:flex; justify-content:space-between;">
                    <span>${k}</span><button class="btn btn-primary" onclick="revertBan('${k}')">REV</button>
                </div>`).join('');
        }

        function setTheme(c) { document.body.className = `theme-${c}`; localStorage.setItem('neb_theme', c); }
        function toggleDev() { document.getElementById('devPanel').classList.toggle('active'); refreshAdminUI(); }
        function doLogout() { localStorage.removeItem('neb_active'); location.reload(); }
        function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('toggleTxt').innerText = isLoginMode ? "REGISTER" : "LOGIN"; }

        function renderUI() {
            const u = localStorage.getItem('neb_active'); if(!u) return;
            document.getElementById('authOverlay').style.display = 'none';
            if(u === 'ADMIN') document.getElementById('devTrigger').style.display = 'inline-block';
            setTheme(localStorage.getItem('neb_theme') || 'green');
            document.getElementById('gameGrid').innerHTML = repoFiles.map(f => {
                let label = f.replace('.html', '').replace('-', ' ').toUpperCase();
                return `<a href="${f}" target="_blank" class="card">${label}</a>`;
            }).join('');
        }
        renderUI();
    </script>
</body>
</html>
