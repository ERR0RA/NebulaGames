<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA OS | v18.0 OMNI-REACH</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #00ff88; --primary-rgb: 0, 255, 136;
            --bg: #010204; --glass: rgba(15, 20, 28, 0.9);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc; --text-dim: #94a3b8;
        }

        body.theme-cyber { --primary: #00f2ff; --primary-rgb: 0, 242, 255; }
        body.theme-lava { --primary: #ff4e00; --primary-rgb: 255, 78, 0; }
        body.theme-amethyst { --primary: #bf00ff; --primary-rgb: 191, 0, 255; }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; cursor: default; }
        body { background-color: var(--bg); color: var(--text-main); height: 100vh; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; }

        /* --- DESKTOP GRID --- */
        .desktop { height: calc(100vh - 140px); padding: 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); grid-auto-rows: 105px; gap: 15px; overflow-y: auto; }
        .app-node { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; padding: 10px; border-radius: 15px; text-align: center; }
        .app-node:hover { background: rgba(255,255,255,0.05); transform: scale(1.05); }
        .icon-box { width: 55px; height: 55px; border-radius: 16px; background: #0a0c10; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--primary); transition: 0.3s; }
        .app-node:hover .icon-box { border-color: var(--primary); box-shadow: 0 0 20px rgba(var(--primary-rgb), 0.4); }

        /* --- WINDOWS --- */
        .os-window { position: absolute; background: var(--glass); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 40px 100px rgba(0,0,0,0.8); backdrop-filter: blur(40px); display: flex; flex-direction: column; overflow: hidden; }
        .win-bar { height: 45px; background: rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; cursor: move; }
        .win-body { flex: 1; background: #000; position: relative; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; margin-left: 8px; }

        /* --- INTERNAL APPS UI --- */
        .cmd-ui { padding: 20px; font-family: 'Fira Code'; font-size: 0.85rem; color: var(--primary); height: 100%; display: flex; flex-direction: column; }
        .cmd-log { flex: 1; overflow-y: auto; margin-bottom: 10px; }
        .cmd-input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-family: 'Fira Code'; }

        /* --- TASKBAR --- */
        #footer { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); height: 65px; background: rgba(10, 15, 20, 0.9); border: 1px solid var(--border); border-radius: 20px; backdrop-filter: blur(30px); display: flex; align-items: center; padding: 0 15px; gap: 8px; z-index: 10000; }
        .task-btn { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--primary); transition: 0.2s; cursor: pointer; }
        .task-btn:hover { background: rgba(var(--primary-rgb), 0.1); transform: translateY(-5px); }
    </style>
</head>
<body class="theme-cyber">

    <nav style="height: 55px; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; border-bottom: 1px solid var(--border); z-index: 20000;">
        <div style="display:flex; align-items:center; gap:10px;">
            <i data-lucide="layout" style="color:var(--primary)"></i>
            <span style="font-weight:900; letter-spacing:1px; font-size:0.8rem;">NEBULA <span style="color:var(--primary)">v18</span></span>
        </div>
        <div style="display:flex; gap:15px; align-items:center;">
            <input type="text" id="desktop-search" placeholder="Search Apps..." oninput="Kernel.searchDesktop(this.value)" style="background:rgba(255,255,255,0.05); border:1px solid var(--border); color:white; padding:5px 12px; border-radius:8px; outline:none; font-size:0.7rem;">
            <div id="clock" style="font-family:'Fira Code'; font-size:0.75rem;">00:00:00</div>
        </div>
    </nav>

    <main class="desktop" id="desktop-view"></main>

    <div id="window-layer"></div>

    <div id="footer">
        <div class="task-btn" onclick="Kernel.launch('cmd')"><i data-lucide="terminal"></i></div>
        <div class="task-btn" onclick="location.reload()"><i data-lucide="refresh-cw"></i></div>
        <div style="width:1px; height:30px; background:var(--border); margin:0 5px;"></div>
        <div id="running-apps" style="display:flex; gap:8px;"></div>
    </div>

    <script>
        const Kernel = {
            zIndex: 100,
            apps: [
                { id: "strike", n: "Cyber Strike", f: "Cyber-Strike.html", i: "zap" },
                { id: "pong", n: "Neon Pong", f: "Neon-Pong.html", i: "activity" },
                { id: "ai", n: "AI Core", f: "ai.html", i: "bot" },
                { id: "drift", n: "Drift King", f: "drift.html", i: "navigation-2" },
                { id: "snake", n: "Snake Pro", f: "snake.html", i: "trending-up" },
                { id: "golf", n: "Neon Golf", f: "Neon-Golf.html", i: "target" },
                { id: "hex", n: "Neon Hex", f: "Neon-Hex.html", i: "hexagon" },
                { id: "slams", n: "Neon Slams", f: "Neon-Slams.html", i: "dribbble" },
                { id: "slash", n: "Neon Slash", f: "Neon-Slash.html", i: "sword" },
                { id: "blast", n: "Block Blast", f: "blockblast.html", i: "grid" },
                { id: "breaker", n: "Block Breaker", f: "blockbreaker.html", i: "layers" },
                { id: "craft", n: "Block Craft", f: "blockcraft.html", i: "box" },
                { id: "cricket", n: "Cricket Pro", f: "cricket.html", i: "trophy" },
                { id: "footy", n: "Football", f: "football.html", i: "award" },
                { id: "mines", n: "Minesweeper", f: "minesweeper.html", i: "bomb" },
                { id: "space", n: "Space Quest", f: "spaceadventure.html", i: "rocket" },
                { id: "math", n: "Sparks Math", f: "sparksmaths.html", i: "divide" },
                { id: "ttt", n: "Tic Tac Toe", f: "tictactoe.html", i: "x" },
                { id: "drive", n: "Overdrive", f: "overdrive.html", i: "gauge" },
                { id: "trail", n: "Neon Trail", f: "neon-trail.html", i: "wind" },
                { id: "basket", n: "Basket Ball", f: "basketball.html", i: "circle" },
                { id: "cmd", n: "Command Line", f: "internal_cmd", i: "terminal" },
                { id: "sys", n: "Sys Monitor", f: "monitor.html", i: "cpu" },
                { id: "files", n: "Explorer", f: "files.html", i: "folder" },
                { id: "note", n: "Notepad", f: "notes.html", i: "edit-3" },
                { id: "calc", n: "Calculator", f: "calc.html", i: "plus-square" }
            ],

            boot() {
                this.renderDesktop(this.apps);
                lucide.createIcons();
                setInterval(() => {
                    document.getElementById('clock').innerText = new Date().toLocaleTimeString();
                }, 1000);
            },

            renderDesktop(appArray) {
                const dv = document.getElementById('desktop-view');
                dv.innerHTML = appArray.map(app => `
                    <div class="app-node" onclick="Kernel.launch('${app.id}')" data-name="${app.n.toLowerCase()}">
                        <div class="icon-box"><i data-lucide="${app.i}"></i></div>
                        <div style="font-size:0.6rem; font-weight:700;">${app.n}</div>
                    </div>
                `).join('');
                lucide.createIcons();
            },

            searchDesktop(query) {
                const nodes = document.querySelectorAll('.app-node');
                nodes.forEach(node => {
                    const match = node.getAttribute('data-name').includes(query.toLowerCase());
                    node.style.display = match ? 'flex' : 'none';
                });
            },

            launch(id) {
                if(document.getElementById(`win-${id}`)) return this.focus(`win-${id}`);
                const app = this.apps.find(a => a.id === id);
                
                const winHtml = `
                    <div class="os-window" id="win-${id}" style="width:750px; height:480px; left:120px; top:80px; z-index:${++this.zIndex}" onmousedown="Kernel.focus('win-${id}')">
                        <div class="win-bar" onmousedown="Kernel.drag(event, 'win-${id}')">
                            <span style="font-size:0.7rem; font-weight:800; color:var(--primary);">${app.n.toUpperCase()}</span>
                            <div style="display:flex;">
                                <div class="win-btn" style="background:#ffbc2e" onclick="Kernel.minimize('win-${id}')"></div>
                                <div class="win-btn" style="background:#ff5f57" onclick="Kernel.close('win-${id}')"></div>
                            </div>
                        </div>
                        <div class="win-body">${this.getAppUI(app)}</div>
                    </div>`;
                document.getElementById('window-layer').insertAdjacentHTML('beforeend', winHtml);
                this.updateTaskbar();
            },

            getAppUI(app) {
                if(app.f === 'internal_cmd') {
                    return `<div class="cmd-ui">
                        <div class="cmd-log" id="cmd-log">NEBULA_OS READY. Type 'help' to start.</div>
                        <div style="display:flex; gap:5px;"><span>></span><input class="cmd-input" onkeydown="Kernel.runCmd(event, this)"></div>
                    </div>`;
                }
                return `<iframe src="${app.f}" style="width:100%; height:100%; border:none;"></iframe>`;
            },

            runCmd(e, input) {
                if(e.key === 'Enter') {
                    const cmd = input.value.toLowerCase().trim();
                    const log = document.getElementById('cmd-log');
                    const line = document.createElement('div');
                    
                    if(cmd === 'help') line.innerText = "COMMANDS: theme [lava/cyber/amethyst], cls, alert [msg], exit";
                    else if(cmd.startsWith('theme ')) {
                        const t = 'theme-' + cmd.split(' ')[1];
                        document.body.className = t;
                        line.innerText = "Applying theme: " + t;
                    }
                    else if(cmd === 'cls') { log.innerHTML = "SYSTEM CLEARED."; input.value = ""; return; }
                    else if(cmd.startsWith('alert ')) { alert(cmd.replace('alert ', '')); line.innerText = "Alert sent."; }
                    else line.innerText = "Unknown command: " + cmd;

                    log.appendChild(line);
                    input.value = "";
                    log.scrollTop = log.scrollHeight;
                }
            },

            drag(e, id) {
                const el = document.getElementById(id);
                let ox = e.clientX - el.offsetLeft, oy = e.clientY - el.offsetTop;
                const move = (ev) => { el.style.left = ev.clientX - ox + 'px'; el.style.top = ev.clientY - oy + 'px'; };
                document.addEventListener('mousemove', move);
                document.addEventListener('mouseup', () => document.removeEventListener('mousemove', move), {once:true});
            },

            focus(id) { document.getElementById(id).style.zIndex = ++this.zIndex; },
            close(id) { document.getElementById(id).remove(); this.updateTaskbar(); },
            minimize(id) { document.getElementById(id).style.display = 'none'; },

            updateTaskbar() {
                const taskArea = document.getElementById('running-apps');
                const wins = document.querySelectorAll('.os-window');
                taskArea.innerHTML = Array.from(wins).map(w => {
                    const app = this.apps.find(a => a.id === w.id.replace('win-', ''));
                    return `<div class="task-btn" onclick="document.getElementById('${w.id}').style.display='flex'; Kernel.focus('${w.id}')"><i data-lucide="${app.i}"></i></div>`;
                }).join('');
                lucide.createIcons();
            }
        };

        window.onload = () => Kernel.boot();
    </script>
</body>
</html>
