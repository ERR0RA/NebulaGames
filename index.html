<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA | Liquid Glass</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #00ff88;
            --glass: rgba(255, 255, 255, 0.03);
            --liquid-bg: #030406;
            --techno-black: #0a0c10;
            --border: rgba(255, 255, 255, 0.12);
            --text: #ffffff;
            --radius-lg: 28px;
            --radius-md: 18px;
            --blur: 25px;
        }

        body.theme-blue { --primary: #00a2ff; }
        body.theme-purple { --primary: #bf00ff; }
        body.theme-gold { --primary: #ffcc00; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--liquid-bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* The "Liquid" Dynamic Background */
        .liquid-container {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% -10%, #111, #000);
            z-index: -1;
        }

        .orb {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: var(--primary);
            filter: blur(140px);
            opacity: 0.12;
            animation: float 20s infinite alternate;
        }

        @keyframes float {
            0% { transform: translate(-10%, -10%); }
            100% { transform: translate(20%, 20%); }
        }

        /* Glassmorphism Components */
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        nav {
            position: sticky;
            top: 15px;
            margin: 0 20px;
            height: 70px;
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            z-index: 100;
        }

        .logo { font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; }
        .logo span { color: var(--primary); filter: drop-shadow(0 0 8px var(--primary)); }

        /* App Grid Styling */
        .content { padding: 40px 20px; max-width: 1200px; margin: 0 auto; width: 100%; }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 20px;
        }

        .app-card {
            aspect-ratio: 1/1;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: 0.3s;
        }

        .app-card:hover {
            transform: scale(1.05) translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        .app-card:hover::before { opacity: 1; }

        .app-icon {
            width: 50px;
            height: 50px;
            margin-bottom: 12px;
            color: var(--primary);
            filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.2));
        }

        .app-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.7); }

        /* Auth Screen */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-box {
            width: 350px;
            padding: 40px;
            border-radius: 35px;
            text-align: center;
        }

        .auth-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 15px;
            color: white;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            background: var(--primary);
            color: black;
            font-weight: 800;
            border: none;
            cursor: pointer;
        }

        /* Admin Controls */
        #adminPanel {
            position: fixed;
            right: -350px;
            top: 0;
            width: 350px;
            height: 100%;
            z-index: 500;
            transition: 0.5s cubic-bezier(0.1, 0.9, 0.1, 1);
            padding: 30px;
        }

        #adminPanel.active { right: 0; }
    </style>
</head>
<body class="theme-green">
    <div class="liquid-container"><div class="orb"></div></div>

    <div id="authLayer" class="auth-overlay">
        <div class="auth-box glass-panel">
            <h1 class="logo" style="margin-bottom:30px">NEBULA<span>.OS</span></h1>
            <input type="text" id="uID" class="auth-input" placeholder="ACCESS ID">
            <input type="password" id="uKey" class="auth-input" placeholder="PASSKEY">
            <button class="auth-btn" onclick="Engine.auth.login()">INITIALIZE</button>
            <p id="switchBtn" style="font-size: 0.7rem; margin-top: 20px; cursor: pointer; opacity: 0.5;" onclick="Engine.auth.toggle()">NEW NODE? REGISTER</p>
        </div>
    </div>

    <nav class="glass-panel">
        <div class="logo">NEBULA<span>.OS</span></div>
        <div style="display: flex; gap: 10px;">
            <button class="glass-panel" id="admBtn" style="display:none; padding:8px 15px; border-radius:12px; cursor:pointer; color:var(--primary)" onclick="Engine.ui.toggleAdmin()">ADM</button>
            <button class="glass-panel" style="padding:8px 15px; border-radius:12px; cursor:pointer; color:white" onclick="Engine.auth.logout()">OFF</button>
        </div>
    </nav>

    <main class="content">
        <div id="appGrid" class="app-grid"></div>
    </main>

    <div id="adminPanel" class="glass-panel">
        <h2 style="margin-bottom:20px; color:var(--primary)">System Control</h2>
        <div style="margin-bottom:30px">
            <p style="font-size:0.7rem; margin-bottom:10px">COLOR SCHEME</p>
            <button onclick="Engine.ui.setTheme('green')" style="background:#00ff88; width:30px; height:30px; border-radius:50%; border:none; margin-right:5px;"></button>
            <button onclick="Engine.ui.setTheme('blue')" style="background:#00a2ff; width:30px; height:30px; border-radius:50%; border:none; margin-right:5px;"></button>
            <button onclick="Engine.ui.setTheme('purple')" style="background:#bf00ff; width:30px; height:30px; border-radius:50%; border:none; margin-right:5px;"></button>
            <button onclick="Engine.ui.setTheme('gold')" style="background:#ffcc00; width:30px; height:30px; border-radius:50%; border:none; margin-right:5px;"></button>
        </div>
        <button class="auth-btn" style="background:transparent; color:white; border:1px solid var(--border)" onclick="Engine.ui.toggleAdmin()">CLOSE</button>
    </div>

    <script>
        const Engine = {
            state: {
                isLogin: true,
                apps: ["Cyber-Strike", "Neon-Golf", "Neon-Hex", "Neon-Pong", "Neon-Slams", "Neon-Slash", "AI-Core", "Basketball", "Block-Blast", "Block-Breaker", "Block-Craft", "Cricket", "Crossy-Roads", "Drift-King", "Eggshell", "Football", "Master-Armory", "Minesweeper", "Neon-Trail", "Overdrive", "Pacman", "Reader", "Snake-Pro", "Space-Adventure", "Sparks-Maths", "Tic-Tac-Toe"],
                db: JSON.parse(localStorage.getItem('neb_v3_db')) || {}
            },

            auth: {
                login() {
                    const u = document.getElementById('uID').value.trim();
                    const p = document.getElementById('uKey').value;
                    if(!u || !p) return;

                    if(u === 'ADMIN' && p === '1234') {
                        this.saveSession('ADMIN');
                        return;
                    }

                    if(Engine.state.isLogin) {
                        if(Engine.state.db[u] && Engine.state.db[u] === p) this.saveSession(u);
                        else alert("DENIED");
                    } else {
                        Engine.state.db[u] = p;
                        localStorage.setItem('neb_v3_db', JSON.stringify(Engine.state.db));
                        this.saveSession(u);
                    }
                },
                saveSession(u) {
                    localStorage.setItem('neb_v3_session', u);
                    localStorage.removeItem('neb_active'); // Kill old versions
                    location.reload();
                },
                logout() {
                    localStorage.removeItem('neb_v3_session');
                    location.reload();
                },
                toggle() {
                    Engine.state.isLogin = !Engine.state.isLogin;
                    document.getElementById('switchBtn').innerText = Engine.state.isLogin ? "NEW NODE? REGISTER" : "BACK TO LOGIN";
                }
            },

            ui: {
                init() {
                    lucide.createIcons();
                    const session = localStorage.getItem('neb_v3_session');
                    if(session) {
                        document.getElementById('authLayer').style.display = 'none';
                        if(session === 'ADMIN') document.getElementById('admBtn').style.display = 'block';
                        this.renderGrid();
                    }
                    this.setTheme(localStorage.getItem('neb_theme') || 'green');
                },
                setTheme(t) {
                    document.body.className = `theme-${t}`;
                    localStorage.setItem('neb_theme', t);
                },
                toggleAdmin() {
                    document.getElementById('adminPanel').classList.toggle('active');
                },
                renderGrid() {
                    document.getElementById('appGrid').innerHTML = Engine.state.apps.map(app => `
                        <a href="${app.toLowerCase()}.html" class="app-card glass-panel">
                            <div class="app-icon"><i data-lucide="component"></i></div>
                            <span class="app-label">${app.replace(/-/g, ' ')}</span>
                        </a>
                    `).join('');
                    lucide.createIcons();
                }
            }
        };

        window.onload = () => Engine.ui.init();
    </script>
</body>
</html>
