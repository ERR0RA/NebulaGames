<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA | Gaming OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88; --bg: #050608; --surface: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08); --text: #ffffff; --text-dim: #94a3b8;
            --danger: #ff4444; --warning: #ffaa00;
        }

        /* Expanded Themes */
        body.theme-red { --primary: #ff4444; } body.theme-blue { --primary: #00d9ff; }
        body.theme-green { --primary: #00ff88; } body.theme-purple { --primary: #a855f7; }
        body.theme-teal { --primary: #14b8a6; } body.theme-white { --primary: #ffffff; }
        body.theme-lime { --primary: #bef264; }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, var(--primary), transparent 50%), radial-gradient(circle at 100% 100%, var(--primary), transparent 30%);
            opacity: 0.15; filter: blur(80px); z-index: -1;
        }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(5, 6, 8, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .nav-link { font-size: 0.7rem; color: var(--text-dim); cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; padding: 10px 15px; }
        
        #devPanel { position: fixed; top: 0; right: -100%; width: 100%; max-width: 800px; height: 100vh; background: #0a0c10; border-left: 1px solid var(--border); z-index: 4000; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); padding: 30px; overflow-y: auto; }
        #devPanel.active { right: 0; box-shadow: -20px 0 50px #000; }
        
        .admin-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
        .admin-table th { text-align: left; color: var(--text-dim); padding: 10px; border-bottom: 1px solid var(--border); }
        .admin-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.02); }
        
        .ban-btn { padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: #fff; font-size: 0.6rem; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .ban-btn.danger { border-color: var(--danger); color: var(--danger); }
        .ban-btn.success { border-color: var(--primary); color: var(--primary); }
        .ban-btn:hover { background: rgba(255,255,255,0.1); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 40px 5%; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 30px 15px; text-decoration: none; color: white; text-align: center; font-weight: 800; transition: 0.3s; }
        .card:hover { border-color: var(--primary); transform: translateY(-3px); }

        .modal { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 90%; max-width: 400px; padding: 50px; background: #0d1117; border-radius: 40px; text-align: center; border: 1px solid var(--border); }
        .auth-field { width: 100%; padding: 18px; margin-top: 15px; border-radius: 15px; border: 1px solid #222; background: #050608; color: #fff; text-align: center; }

        .theme-dots { display: flex; gap: 8px; margin-right: 15px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body class="theme-green">

    <div class="bg-mesh"></div>

    <div id="devPanel">
        <h2 style="color: var(--primary); margin-bottom: 20px;">SECURITY OVERRIDE</h2>
        <div class="admin-card">
            <h3>USER TRACKER</h3>
            <table class="admin-table">
                <thead><tr><th>USER</th><th>IP</th><th>DEVICE</th><th>ACTIONS</th></tr></thead>
                <tbody id="userRows"></tbody>
            </table>
        </div>
        <div class="admin-card">
            <h3 style="color:var(--danger)">ACTIVE BLACKLIST</h3>
            <div id="blacklistLog" style="margin-top: 15px;"></div>
        </div>
        <button class="ban-btn" onclick="toggleDev()" style="width:100%; padding:15px;">CLOSE TERMINAL</button>
    </div>

    <div id="authOverlay" class="modal">
        <div class="auth-box">
            <h1 style="letter-spacing: 10px; color: var(--primary); margin-bottom: 20px;">NEBULA</h1>
            <input type="text" id="userInput" class="auth-field" placeholder="USERNAME">
            <input type="password" id="passInput" class="auth-field" placeholder="PASSWORD">
            <button style="width:100%; padding:18px; margin-top:20px; border-radius:15px; background:var(--primary); font-weight:800; border:none;" onclick="processAuth()">LOGIN</button>
            <p onclick="toggleAuthMode()" id="toggleTxt" style="font-size:0.7rem; margin-top:20px; cursor:pointer; color:var(--text-dim);">REGISTER</p>
        </div>
    </div>

    <nav>
        <div style="display:flex; align-items:center;">
            <div class="theme-dots">
                <div class="dot" style="background:#00ff88" onclick="setTheme('green')"></div>
                <div class="dot" style="background:#ff4444" onclick="setTheme('red')"></div>
                <div class="dot" style="background:#00d9ff" onclick="setTheme('blue')"></div>
                <div class="dot" style="background:#a855f7" onclick="setTheme('purple')"></div>
                <div class="dot" style="background:#14b8a6" onclick="setTheme('teal')"></div>
                <div class="dot" style="background:#ffffff" onclick="setTheme('white')"></div>
                <div class="dot" style="background:#bef264" onclick="setTheme('lime')"></div>
            </div>
            <h1 style="font-size:1.1rem; letter-spacing:3px;">NEBULA<span style="color:var(--primary)">.OS</span></h1>
        </div>
        <div>
            <span id="devTrigger" class="nav-link" onclick="toggleDev()" style="display:none; color:var(--warning)">[ADMIN]</span>
            <span class="nav-link" onclick="doLogout()">Logout</span>
        </div>
    </nav>

    <div id="gameGrid" class="grid"></div>

    <script>
        const _0xADMIN_USER = "ADMIN", _0xADMIN_PASS = "12345678!";
        const DEVICE_ID = btoa(navigator.userAgent).substring(15, 35);
        const MOCK_IP = "172.16.100." + Math.floor(Math.random()*255);
        let isLoginMode = true;

        const fullGameList = [
            "Cyber-Strike.html", "Neon-Golf.html", "Neon-Hex.html", "Neon-Pong.html", 
            "Neon-Slams.html", "Neon-Slash.html", "ai.html", "basketball.html", 
            "blockblast.html", "blockbreaker.html", "blockcraft.html", "cricket.html", 
            "crossyroads.html", "drift.html", "eggshell.html", "football.html", 
            "masterarmory.html", "minesweeper.html", "neon-trail.html", "overdrive.html", 
            "pacman.html", "reader.html", "snake.html", "spaceadventure.html", 
            "sparksmaths.html", "tictactoe.html"
        ];

        // Security Kick Pulse (Checks every 500ms)
        setInterval(() => {
            const active = localStorage.getItem('neb_active');
            if (!active || active === 'ADMIN') return;
            const bans = JSON.parse(localStorage.getItem('neb_blacklist')) || {};
            if (bans[active.toLowerCase()] || bans[MOCK_IP] || bans[DEVICE_ID]) {
                localStorage.removeItem('neb_active');
                location.reload();
            }
        }, 500);

        function processAuth() {
            const u = document.getElementById('userInput').value.trim();
            const p = document.getElementById('passInput').value.trim();
            const bans = JSON.parse(localStorage.getItem('neb_blacklist')) || {};

            if(u.toUpperCase() === _0xADMIN_USER && p === _0xADMIN_PASS) {
                localStorage.setItem('neb_active', 'ADMIN'); location.reload(); return;
            }

            if (bans[u.toLowerCase()] || bans[MOCK_IP] || bans[DEVICE_ID]) {
                alert("ACCESS DENIED: RED FLAG ON ACCOUNT/IP/DEVICE"); return;
            }

            let db = JSON.parse(localStorage.getItem('neb_db')) || {};
            if(isLoginMode) {
                if(db[u] && db[u].pw === p) {
                    db[u].lastIP = MOCK_IP; db[u].lastDev = DEVICE_ID;
                    localStorage.setItem('neb_db', JSON.stringify(db));
                    localStorage.setItem('neb_active', u); location.reload();
                } else alert("INVALID");
            } else {
                db[u] = { pw: p, lastIP: MOCK_IP, lastDev: DEVICE_ID };
                localStorage.setItem('neb_db', JSON.stringify(db));
                localStorage.setItem('neb_active', u); location.reload();
            }
        }

        function applyBan(target, type) {
            const duration = document.getElementById(`dur-${target}`).value;
            let bans = JSON.parse(localStorage.getItem('neb_blacklist')) || {};
            let expiry = (duration === "0") ? null : Date.now() + (parseInt(duration) * 1000);
            
            // Fixed: Standardized keys for IP and Device
            bans[target] = { type, expiry };
            localStorage.setItem('neb_blacklist', JSON.stringify(bans));
            refreshAdminUI();
        }

        function revertBan(key) {
            let bans = JSON.parse(localStorage.getItem('neb_blacklist')) || {};
            delete bans[key];
            localStorage.setItem('neb_blacklist', JSON.stringify(bans));
            refreshAdminUI();
        }

        function refreshAdminUI() {
            const db = JSON.parse(localStorage.getItem('neb_db')) || {};
            const bans = JSON.parse(localStorage.getItem('neb_blacklist')) || {};
            
            document.getElementById('userRows').innerHTML = Object.keys(db).map(u => `
                <tr>
                    <td style="color:var(--primary)">${u}</td><td>${db[u].lastIP}</td><td style="font-size:0.5rem">${db[u].lastDev}</td>
                    <td>
                        <select id="dur-${u}" style="background:#000;color:#fff;font-size:0.6rem">
                            <option value="86400">1 Day</option><option value="604800">1 Week</option><option value="0">Permanent</option>
                        </select>
                        <button class="ban-btn danger" onclick="applyBan('${u.toLowerCase()}','ACC')">ACC</button>
                        <button class="ban-btn danger" onclick="applyBan('${db[u].lastIP}','IP')">IP</button>
                        <button class="ban-btn danger" onclick="applyBan('${db[u].lastDev}','DEV')">DEV</button>
                    </td>
                </tr>`).join('');

            document.getElementById('blacklistLog').innerHTML = Object.keys(bans).map(k => `
                <div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #222;background:rgba(255,0,0,0.03)">
                    <span><b>[${bans[k].type}]</b> ${k}</span>
                    <button class="ban-btn success" onclick="revertBan('${k}')">REVERT</button>
                </div>`).join('') || 'Clear.';
        }

        function setTheme(c) { document.body.className = `theme-${c}`; localStorage.setItem('neb_theme', c); }
        function toggleDev() { document.getElementById('devPanel').classList.toggle('active'); refreshAdminUI(); }
        function doLogout() { localStorage.removeItem('neb_active'); location.reload(); }
        function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('toggleTxt').innerText = isLoginMode ? "REGISTER" : "LOGIN"; }

        function renderUI() {
            const u = localStorage.getItem('neb_active'); if(!u) return;
            document.getElementById('authOverlay').style.display = 'none';
            if(u === 'ADMIN') document.getElementById('devTrigger').style.display = 'inline-block';
            setTheme(localStorage.getItem('neb_theme') || 'green');

            document.getElementById('gameGrid').innerHTML = fullGameList.map(file => {
                let name = file.replace('.html', '').replace('-', ' ').toUpperCase();
                return `<a href="${file}" target="_blank" class="card">${name}</a>`;
            }).join('');
        }
        renderUI();
    </script>
</body>
</html>
