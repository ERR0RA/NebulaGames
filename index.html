<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula | Glass Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.3);
            --bg: #080a0c;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
        }

        [data-theme="cyber"] { --primary: #ff00ff; --primary-glow: rgba(255, 0, 255, 0.3); }
        [data-theme="ocean"] { --primary: #00d9ff; --primary-glow: rgba(0, 217, 255, 0.3); }
        [data-theme="amber"] { --primary: #ffaa00; --primary-glow: rgba(255, 170, 0, 0.3); }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient Background Glows */
        .bg-glow {
            position: fixed;
            width: 50vw; height: 50vw;
            background: var(--primary-glow);
            filter: blur(150px);
            border-radius: 50%;
            z-index: -1;
            top: -25vw; right: -10vw;
            opacity: 0.5;
        }

        header { padding: 80px 20px 40px; text-align: center; }
        
        h1 {
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 800; margin: 0;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.4) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- MODERN SEARCH --- */
        .search-wrap { width: 90%; max-width: 600px; margin-bottom: 50px; position: relative; }
        #moduleSearch {
            width: 100%; 
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 20px 30px;
            border-radius: 100px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            backdrop-filter: blur(20px);
            transition: 0.4s cubic-bezier(0.2, 0, 0, 1);
            text-align: center;
        }
        #moduleSearch:focus {
            border-color: var(--primary);
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 30px var(--primary-glow);
            width: 110%;
            margin-left: -5%;
        }

        /* --- ROUNDED GLASS GRID --- */
        .link-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px; width: 90%; max-width: 1200px;
            margin-bottom: 100px;
        }

        .game-link {
            position: relative;
            text-decoration: none;
            background: var(--glass);
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .game-link:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px var(--primary-glow);
        }

        .game-title {
            font-weight: 500;
            font-size: 1rem;
            color: rgba(255,255,255,0.9);
            letter-spacing: 0.5px;
        }

        /* Badge Styling */
        .badge {
            position: absolute;
            top: 12px; right: 12px;
            font-size: 0.6rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 50px;
            background: var(--primary);
            color: #000;
            text-transform: uppercase;
        }

        .theme-panel {
            position: fixed; bottom: 30px; 
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 10px 20px;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            display: flex; gap: 15px;
        }

        .t-btn { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); }

    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <header>
        <h1>Nebula</h1>
        <p style="opacity: 0.4; font-size: 0.8rem; letter-spacing: 4px; text-transform: uppercase;">Cloud Gaming Interface</p>
    </header>

    <div class="search-wrap">
        <input type="text" id="moduleSearch" placeholder="Search your library..." onkeyup="filterGames()">
    </div>

    <div id="stable-container" class="link-container"></div>

    <div class="theme-panel">
        <div class="t-btn" style="background:#00ff88" onclick="setTheme('default')"></div>
        <div class="t-btn" style="background:#ff00ff" onclick="setTheme('cyber')"></div>
        <div class="t-btn" style="background:#00d9ff" onclick="setTheme('ocean')"></div>
        <div class="t-btn" style="background:#ffaa00" onclick="setTheme('amber')"></div>
    </div>

    <script>
        const games = [
            { name: "Neon Cyber Strike", url: "Cyber-Strike.html", tag: "best" },
            { name: "Blockcraft", url: "blockcraft.html", tag: "upd" },
            { name: "Minesweeper", url: "minesweeper.html", tag: "best" },
            { name: "Neon Snake", url: "snake.html", tag: "best" },
            { name: "Master Armory", url: "masterarmory.html", tag: "best" },
            { name: "Neon Pong", url: "Neon-Pong.html", tag: "best" },
            { name: "Neon Slash", url: "Neon-Slash.html", tag: "" },
            { name: "Block Breaker", url: "blockbreaker.html", tag: "" },
            { name: "Neon Golf", url: "Neon-Golf.html", tag: "" },
            { name: "Neon Slamz", url: "Neon-Slams.html", tag: "" },
            { name: "Neon Trail", url: "neon-trail.html", tag: "" },
            { name: "Block Blast", url: "blockblast.html", tag: "" },
            { name: "Neon Run", url: "ai.html", tag: "" },
            { name: "Basketball", url: "basketball.html", tag: "" },
            { name: "Football", url: "football.html", tag: "" },
            { name: "Cricket", url: "cricket.html", tag: "" },
            { name: "Crossy Roads", url: "crossyroads.html", tag: "" },
            { name: "Drift", url: "drift.html", tag: "" },
            { name: "Eggshell (EGGVP)", url: "eggshell.html", tag: "upd" },
            { name: "Overdrive", url: "overdrive.html", tag: "" },
            { name: "Pacman", url: "pacman.html", tag: "" },
            { name: "Space Adventure", url: "spaceadventure.html", tag: "" },
            { name: "Tic Tac Toe", url: "tictactoe.html", tag: "" },
            { name: "Turbo Horizon", url: "turbohorizon.html", tag: "" },
            { name: "Neon Hex", url: "Neon-Hex.html", tag: "" }
        ];

        function buildArcade() {
            const container = document.getElementById('stable-container');
            container.innerHTML = games.map(game => `
                <a href="${game.url}" target="_blank" rel="noopener noreferrer" class="game-link" data-name="${game.name.toLowerCase()}">
                    ${game.tag ? `<span class="badge">${game.tag}</span>` : ''}
                    <span class="game-title">${game.name}</span>
                </a>
            `).join('');
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if(theme === 'default') document.documentElement.removeAttribute('data-theme');
        }

        function filterGames() {
            const val = document.getElementById('moduleSearch').value.toLowerCase();
            document.querySelectorAll('.game-link').forEach(el => {
                el.style.display = el.dataset.name.includes(val) ? 'flex' : 'none';
            });
        }

        buildArcade();
    </script>
</body>
</html>
