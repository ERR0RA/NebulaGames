<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula | Ultimate Cloud Gaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.45);
            --bg: #050608;
            --glass-border: rgba(255, 255, 255, 0.12);
            --text: #ffffff;
        }

        /* EXISTING THEMES */
        [data-theme="cyber"]   { --primary: #ff00ff; --primary-glow: rgba(255, 0, 255, 0.45); }
        [data-theme="ocean"]   { --primary: #00d9ff; --primary-glow: rgba(0, 217, 255, 0.45); }
        [data-theme="amber"]   { --primary: #ffaa00; --primary-glow: rgba(255, 170, 0, 0.45); }
        [data-theme="crimson"] { --primary: #ff3b3b; --primary-glow: rgba(255, 59, 59, 0.45); }
        [data-theme="violet"]  { --primary: #8b5cf6; --primary-glow: rgba(139, 92, 246, 0.45); }
        [data-theme="lime"]    { --primary: #a3ff12; --primary-glow: rgba(163, 255, 18, 0.45); }
        [data-theme="ice"]     { --primary: #7dd3fc; --primary-glow: rgba(125, 211, 252, 0.45); }

        /* NEW THEMES */
        [data-theme="gold"]     { --primary: #ffd700; --primary-glow: rgba(255, 215, 0, 0.45); }
        [data-theme="rose"]     { --primary: #ff4d94; --primary-glow: rgba(255, 77, 148, 0.45); }
        [data-theme="emerald"]  { --primary: #2ecc71; --primary-glow: rgba(46, 204, 113, 0.45); }
        [data-theme="toxic"]    { --primary: #ccff00; --primary-glow: rgba(204, 255, 0, 0.45); }
        [data-theme="midnight"] { --primary: #706fd3; --primary-glow: rgba(112, 111, 211, 0.45); }

        body {
            margin: 0;
            font-family: "Plus Jakarta Sans", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            cursor: none;
            transition: background 0.35s ease;
        }

        body[data-bg="neon"] {
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.05), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 217, 255, 0.05), transparent 40%);
        }

        body[data-bg="gradient"] {
            background: linear-gradient(135deg, #050608 0%, #0d1320 50%, #170f2b 100%);
        }

        .cursor-dot {
            width: 8px; height: 8px; background: var(--primary);
            border-radius: 50%; position: fixed; pointer-events: none;
            z-index: 99999; transform: translate(-50%, -50%);
            box-shadow: 0 0 12px var(--primary);
        }

        .cursor-ring {
            width: 34px; height: 34px; border: 2px solid var(--primary);
            border-radius: 50%; position: fixed; pointer-events: none;
            z-index: 99998; transform: translate(-50%, -50%);
            transition: width .2s, height .2s, border .2s;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .orb {
            position: fixed; width: 40vw; height: 40vw; border-radius: 50%;
            background: var(--primary); filter: blur(120px);
            opacity: 0.1; z-index: -1; pointer-events: none;
        }
        .orb-1 { top: -10%; left: -10%; }
        .orb-2 { bottom: -10%; right: -10%; opacity: 0.05; }

        .top-right-nav {
            position: absolute; top: 20px; right: 20px;
            display: flex; gap: 10px; z-index: 100;
        }

        header { padding: 80px 20px 20px; text-align: center; }
        h1 { font-size: clamp(3rem, 10vw, 5rem); margin: 0; font-weight: 800; }
        .sub { opacity: 0.6; letter-spacing: 4px; text-transform: uppercase; font-size: 0.8rem; }

        .search-wrap { width: min(90%, 600px); margin: 30px auto; }
        #moduleSearch {
            width: 100%; box-sizing: border-box; padding: 16px 24px;
            border-radius: 999px; border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.04); color: white;
            outline: none; font-size: 1rem; backdrop-filter: blur(20px);
            text-align: center; transition: 0.3s;
        }
        #moduleSearch:focus { border-color: var(--primary); box-shadow: 0 0 24px var(--primary-glow); }

        .link-container {
            width: min(92%, 1200px); margin: 0 auto 120px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px;
        }

        .game-link {
            position: relative; min-height: 140px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; color: white; border-radius: 18px;
            border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(18px); transition: transform 0.1s ease-out, border 0.3s;
            overflow: hidden; padding: 15px;
        }

        .game-link:hover { border-color: var(--primary); }

        .game-title { font-weight: 700; font-size: 1.1rem; text-align: center; z-index: 2; }
        
        .high-score-tag {
            font-size: 0.7rem; opacity: 0.6; margin-top: 8px;
            font-family: "Fira Code", monospace; color: var(--primary);
        }

        .badge {
            position: absolute; top: 12px; right: 12px; font-size: 0.6rem;
            font-weight: 800; padding: 4px 10px; border-radius: 999px;
            text-transform: uppercase; background: var(--primary); color: #000;
        }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px); display: none;
            justify-content: center; align-items: center; z-index: 10000;
        }
        .login-card {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            padding: 40px; border-radius: 24px; width: min(90%, 400px); text-align: center;
        }
        .login-card input {
            width: 100%; padding: 14px; margin: 20px 0; border-radius: 12px;
            border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: #fff;
        }

        .bottom-controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
            z-index: 1000; width: 90%;
        }

        .panel {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 999px;
            padding: 8px 12px; display: flex; align-items: center; gap: 10px;
        }

        .acc-btn, .bg-btn, .support-btn {
            background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border);
            color: white; padding: 8px 16px; border-radius: 999px;
            font-weight: 700; font-size: 12px; cursor: none; transition: 0.2s;
        }
        .acc-btn:hover, .bg-btn.active { background: var(--primary); color: #000; }

        .t-btn { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); cursor: none; }

        @media (max-width: 600px) {
            .top-right-nav { position: relative; justify-content: center; margin-bottom: -40px; }
            .bottom-controls { bottom: 10px; scale: 0.9; }
        }
    </style>
</head>
<body data-bg="neon">

<div class="cursor-dot"></div>
<div class="cursor-ring"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="top-right-nav">
    <button id="userBtn" class="acc-btn" onclick="toggleModal()">JOIN NEBULA</button>
    <button id="logoutBtn" class="acc-btn" style="display:none" onclick="logout()">LOGOUT</button>
</div>

<header>
    <h1>Nebula</h1>
    <p class="sub">Cloud Gaming Interface</p>
</header>

<div class="search-wrap">
    <input type="text" id="moduleSearch" placeholder="Search Game Library..." onkeyup="filterGames()">
</div>

<div id="gameGrid" class="link-container"></div>

<div id="loginModal" class="modal-overlay">
    <div class="login-card">
        <h2>Welcome Pilot</h2>
        <p style="opacity:0.6">Enter a callsign to track your progress.</p>
        <input type="text" id="usernameInput" placeholder="Username...">
        <button class="acc-btn" style="width:100%; padding:15px;" onclick="saveUser()">INITIALIZE</button>
    </div>
</div>

<div class="bottom-controls">
    <div class="panel">
        <div class="t-btn" style="background:#00ff88" onclick="setTheme('default')" title="Nebula Green"></div>
        <div class="t-btn" style="background:#ff00ff" onclick="setTheme('cyber')" title="Cyber Pink"></div>
        <div class="t-btn" style="background:#00d9ff" onclick="setTheme('ocean')" title="Ocean Blue"></div>
        <div class="t-btn" style="background:#ffaa00" onclick="setTheme('amber')" title="Amber Gold"></div>
        <div class="t-btn" style="background:#ff3b3b" onclick="setTheme('crimson')" title="Crimson Red"></div>
        <div class="t-btn" style="background:#ffd700" onclick="setTheme('gold')" title="Lux Gold"></div>
        <div class="t-btn" style="background:#ff4d94" onclick="setTheme('rose')" title="Neon Rose"></div>
        <div class="t-btn" style="background:#2ecc71" onclick="setTheme('emerald')" title="Emerald"></div>
        <div class="t-btn" style="background:#ccff00" onclick="setTheme('toxic')" title="Toxic Lime"></div>
        <div class="t-btn" style="background:#706fd3" onclick="setTheme('midnight')" title="Midnight Indigo"></div>
    </div>

    <div class="panel">
        <button id="bgNeon" class="bg-btn" onclick="setBg('neon')">NEON</button>
        <button id="bgGradient" class="bg-btn" onclick="setBg('gradient')">GRADIENT</button>
    </div>

    <div class="panel">
        <a href="#" class="support-btn" style="text-decoration:none">SUPPORT</a>
    </div>
</div>

<script>
    const games = [
        { name: "Sparx AUTO SOLVER Readme", url: "Solver.html", tag: "best-updating" },
        { name: "Maths revision", url: "Revise.html", tag: "best-updating" },
        { name: "Neon Reactor", url: "Neon-Reactor.html", tag: "best-updating" },
        { name: "Blockcraft", url: "blockcraft.html", tag: "upd" },
        { name: "Minesweeper", url: "minesweeper.html", tag: "best" },
        { name: "Neon Snake", url: "snake.html", tag: "best" },
        { name: "Neon Battle", url: "Neon-Battle.html", tag: "best" },
        { name: "Master Armory", url: "masterarmory.html", tag: "best" },
        { name: "Neon Pong", url: "Neon-Pong.html", tag: "best" },
        { name: "Neon Slash", url: "Neon-Slash.html", tag: "" },
        { name: "Block Breaker", url: "blockbreaker.html", tag: "" },
        { name: "Neon Golf", url: "Neon-Golf.html", tag: "" },
        { name: "Neon Slamz", url: "Neon-Slams.html", tag: "" },
        { name: "Neon Trail", url: "neon-trail.html", tag: "" },
        { name: "Neon Run", url: "ai.html", tag: "" },
        { name: "Basketball", url: "basketball.html", tag: "" },
        { name: "Football", url: "football.html", tag: "" },
        { name: "Space Adventure", url: "spaceadventure.html", tag: "" },
        { name: "Tic Tac Toe", url: "tictactoe.html", tag: "" },
        { name: "Turbo Horizon", url: "turbohorizon.html", tag: "" },
        { name: "Neon Hex", url: "Neon-Hex.html", tag: "" }, 
    ];
        
    function init() {
        buildGrid();
        loadSettings();
        checkUser();
        initCursor();
    }

    function buildGrid() {
        const container = document.getElementById("gameGrid");
        const scores = JSON.parse(localStorage.getItem("nebula_scores")) || {};
        
        container.innerHTML = games.map(game => {
            const best = scores[game.name] ? `BEST: ${scores[game.name]}` : "NO RECORD";
            return `
                <a href="${game.url}" class="game-link" target="_blank">
                    ${game.tag ? `<span class="badge">${game.tag}</span>` : ""}
                    <span class="game-title">${game.name}</span>
                    <span class="high-score-tag">${best}</span>
                </a>
            `;
        }).join("");
        
        initTilt();
    }

    function initCursor() {
        const dot = document.querySelector(".cursor-dot");
        const ring = document.querySelector(".cursor-ring");

        document.addEventListener("mousemove", e => {
            dot.style.left = ring.style.left = e.clientX + "px";
            dot.style.top = ring.style.top = e.clientY + "px";
        });

        document.querySelectorAll("a, button, .t-btn").forEach(el => {
            el.addEventListener("mouseenter", () => {
                ring.style.width = "50px";
                ring.style.height = "50px";
                ring.style.borderColor = "#fff";
            });
            el.addEventListener("mouseleave", () => {
                ring.style.width = "34px";
                ring.style.height = "34px";
                ring.style.borderColor = "var(--primary)";
            });
        });
    }

    function initTilt() {
        document.querySelectorAll(".game-link").forEach(card => {
            card.addEventListener("mousemove", e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const rY = ((x / rect.width) - 0.5) * 15;
                const rX = ((y / rect.height) - 0.5) * -15;
                card.style.transform = `perspective(1000px) rotateX(${rX}deg) rotateY(${rY}deg) translateY(-5px)`;
            });
            card.addEventListener("mouseleave", () => card.style.transform = "");
        });
    }

    function filterGames() {
        const val = document.getElementById("moduleSearch").value.toLowerCase();
        document.querySelectorAll(".game-link").forEach(el => {
            const name = el.querySelector(".game-title").innerText.toLowerCase();
            el.style.display = name.includes(val) ? "flex" : "none";
        });
    }

    function toggleModal() {
        const m = document.getElementById("loginModal");
        m.style.display = (m.style.display === "flex") ? "none" : "flex";
    }

    function saveUser() {
        const user = document.getElementById("usernameInput").value.trim();
        if (user) {
            localStorage.setItem("nebula_user", user);
            location.reload();
        }
    }

    function logout() {
        localStorage.removeItem("nebula_user");
        location.reload();
    }

    function checkUser() {
        const user = localStorage.getItem("nebula_user");
        if (user) {
            document.getElementById("userBtn").innerText = user.toUpperCase();
            document.getElementById("logoutBtn").style.display = "block";
        }
    }

    function setTheme(t) {
        t === "default" ? document.documentElement.removeAttribute("data-theme") : document.documentElement.setAttribute("data-theme", t);
        localStorage.setItem("nebula_theme", t);
    }

    function setBg(m) {
        document.body.setAttribute("data-bg", m);
        localStorage.setItem("nebula_bg", m);
        document.getElementById("bgNeon").classList.toggle("active", m === "neon");
        document.getElementById("bgGradient").classList.toggle("active", m === "gradient");
    }

    function loadSettings() {
        setTheme(localStorage.getItem("nebula_theme") || "default");
        setBg(localStorage.getItem("nebula_bg") || "neon");
    }

    init();
</script>

</body>
</html>
