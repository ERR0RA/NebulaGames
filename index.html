<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Games | Official Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.3);
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --updating: #ffcc00;
            --error: #ff3333;
            --info: #00ccff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% -20%, #11221a 0%, #050505 80%);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header { text-align: center; padding: 60px 20px 30px; }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 900; margin: 0;
            letter-spacing: 12px; text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px var(--primary-glow));
        }

        .subtitle { color: var(--primary); opacity: 0.6; margin-top: 10px; font-size: 0.8rem; letter-spacing: 5px; text-transform: uppercase; }

        /* --- Search Bar --- */
        .search-container {
            width: 90%; max-width: 1100px; margin-bottom: 20px;
        }
        #moduleSearch {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border);
            padding: 12px 20px; border-radius: 8px; color: #fff; font-family: 'Orbitron';
            outline: none; transition: 0.3s; box-sizing: border-box;
        }
        #moduleSearch:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        /* --- Dashboard Panel --- */
        .status-panel {
            width: 90%; max-width: 1100px;
            background: rgba(0, 255, 136, 0.03);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 12px; padding: 25px;
            margin-bottom: 40px; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px;
            backdrop-filter: blur(10px); box-sizing: border-box;
        }
        .status-item { display: flex; flex-direction: column; gap: 5px; }
        .status-label { font-family: 'Orbitron', sans-serif; font-size: 0.65rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }
        .status-value { font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 700; transition: all 0.3s ease; text-shadow: 0 0 8px currentColor; }
        
        .online { color: var(--primary); }
        .offline { color: var(--error); }
        .traffic-accent { color: var(--info); }

        h5 {
            font-family: 'Orbitron', sans-serif; color: #fff;
            text-transform: uppercase; letter-spacing: 3px;
            margin: 20px 0; width: 90%; max-width: 1100px;
            font-size: 0.95rem; border-left: 4px solid var(--primary); padding-left: 15px;
        }

        /* --- Grid & Links --- */
        .link-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px; width: 90%; max-width: 1100px; margin-bottom: 50px;
        }

        .game-link {
            position: relative; background: var(--card-bg);
            text-decoration: none; height: 90px;
            border-radius: 10px; border: 1px solid var(--card-border);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .game-link:hover:not(.is-down) {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--primary);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), 0 0 15px var(--primary-glow);
        }

        .game-title { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 0.9rem; color: #fff; text-align: center; z-index: 2; padding: 0 10px; }

        /* --- Badges --- */
        .badge { position: absolute; top: 0; right: 0; font-size: 0.55rem; padding: 4px 10px; font-weight: 900; text-transform: uppercase; border-bottom-left-radius: 8px; z-index: 3; }
        .best { background: var(--primary); color: #000; box-shadow: 0 0 10px var(--primary); }
        .upd { background: var(--updating); color: #000; }
        .down { background: var(--error); color: #fff; }

        .game-link.is-down { opacity: 0.3; cursor: not-allowed; border-color: var(--error) !important; filter: grayscale(1); }
        .game-link.is-down .game-title { color: var(--error); }

        footer { padding: 60px; text-align: center; color: #333; font-size: 0.8rem; font-family: 'Orbitron'; letter-spacing: 3px; }
    </style>
</head>
<body>

    <header>
        <h1>Nebula Games</h1>
        <div class="subtitle">System Operator: DC</div>
    </header>

    <div class="status-panel">
        <div class="status-item">
            <span class="status-label">Archive Status</span>
            <span id="global-status" class="status-value online">● SYSTEM READY</span>
        </div>
        <div class="status-item">
            <span class="status-label">Live Ping</span>
            <span id="ping-value" class="status-value online">-- ms</span>
        </div>
        <div class="status-item">
            <span class="status-label">Global Traffic</span>
            <span id="traffic-value" class="status-value traffic-accent">Initializing...</span>
        </div>
        <div class="status-item">
            <span class="status-label">Active Modules</span>
            <span id="active-count" class="status-value">--</span>
        </div>
        <div class="status-item">
            <span class="status-label">System Faults</span>
            <span id="error-count" class="status-value offline">--</span>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="moduleSearch" placeholder="SEARCH SYSTEM MODULES..." onkeyup="filterGames()">
    </div>

    <h5>🕹️ Available Modules</h5>
    <div id="stable-container" class="link-container"></div>

    <h5>⚠️ Signal Loss (Offline)</h5>
    <div id="error-container" class="link-container"></div>

    <script>
        const games = [
            { name: "Neon Cyber Strike", url: "Cyber-Strike.html", tag: "best" },
            { name: "Blockcraft", url: "blockcraft.html", tag: "upd" },
            { name: "Minesweeper", url: "minesweeper.html", tag: "best" },
            { name: "Neon Snake", url: "snake.html", tag: "best" },
            { name: "Master Armory", url: "masterarmory.html", tag: "best" },
            { name: "Neon Pong", url: "Neon-Pong.html", tag: "best" },
            { name: "Neon Slash", url: "Neon-Slash.html", tag: "" },
            { name: "Block Breaker", url: "blockbreaker.html", tag: "" },
            { name: "Neon Golf", url: "Neon-Golf.html", tag: "" },
            { name: "Neon Slamz", url: "Neon-Slams.html", tag: "" },
            { name: "Neon Trail", url: "neon-trail.html", tag: "" },
            { name: "Block Blast", url: "blockblast.html", tag: "" },
            { name: "Neon Run", url: "ai.html", tag: "" },
            { name: "Basketball", url: "basketball.html", tag: "" },
            { name: "Football", url: "football.html", tag: "" },
            { name: "Cricket", url: "cricket.html", tag: "" },
            { name: "Crossy Roads", url: "crossyroads.html", tag: "" },
            { name: "Drift", url: "drift.html", tag: "" },
            { name: "Eggshell (EGGVP)", url: "eggshell.html", tag: "upd" },
            { name: "Overdrive", url: "overdrive.html", tag: "" },
            { name: "Pacman", url: "pacman.html", tag: "" },
            { name: "Space Adventure", url: "spaceadventure.html", tag: "" },
            { name: "Tic Tac Toe", url: "tictactoe.html", tag: "" },
            { name: "Turbo Horizon", url: "turbohorizon.html", tag: "" },
            { name: "Sparx Reader", url: "reader.html", tag: "" },
            { name: "Neon Hex", url: "Neon-Hex.html", tag: "" },
        ];

        // --- Live Refresh Logic ---
        async function updateLiveStats() {
            const startTime = performance.now();
            try {
                await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
                const endTime = performance.now();
                const ping = Math.round(endTime - startTime);
                const pingEl = document.getElementById('ping-value');
                pingEl.innerText = `${ping} ms`;
                
                if (ping < 100) pingEl.style.color = "var(--primary)";
                else if (ping < 250) pingEl.style.color = "var(--updating)";
                else pingEl.style.color = "var(--error)";
            } catch (err) {
                document.getElementById('ping-value').innerText = "TIMEOUT";
            }

            const trafficStates = ["Minimal", "Low", "Steady", "Moderate", "Nominal", "Peak"];
            document.getElementById('traffic-value').innerText = trafficStates[Math.floor(Math.random() * trafficStates.length)];
        }

        // --- Build Arcade Modules ---
        async function buildArcade() {
            const stableBox = document.getElementById('stable-container');
            const errorBox = document.getElementById('error-container');
            let stableCount = 0;
            let errorCount = 0;

            stableBox.innerHTML = '';
            errorBox.innerHTML = '';

            // Using Promise.all for faster diagnostic checks
            const statusChecks = await Promise.all(games.map(async (game) => {
                try {
                    const resp = await fetch(game.url, { method: 'HEAD' });
                    return { ...game, isDown: !resp.ok };
                } catch (e) {
                    return { ...game, isDown: true };
                }
            }));

            statusChecks.forEach(game => {
                if (game.isDown) {
                    errorBox.innerHTML += `
                        <div class="game-link is-down" data-name="${game.name.toLowerCase()}">
                            <span class="badge down">Fault</span>
                            <span class="game-title">${game.name}</span>
                        </div>`;
                    errorCount++;
                } else {
                    const tagHTML = game.tag ? `<span class="badge ${game.tag}">${game.tag === 'upd' ? 'Updating' : 'Best'}</span>` : '';
                    stableBox.innerHTML += `
                        <a href="${game.url}" class="game-link" target="_blank" rel="noopener noreferrer" data-name="${game.name.toLowerCase()}">
                            ${tagHTML}
                            <span class="game-title">${game.name}</span>
                        </a>`;
                    stableCount++;
                }
            });

            document.getElementById('active-count').innerText = `${stableCount} Modules`;
            document.getElementById('error-count').innerText = `${errorCount} Issues`;
            const globalStatus = document.getElementById('global-status');
            globalStatus.innerText = errorCount > 0 ? "● ISSUES DETECTED" : "● OPERATIONAL";
            globalStatus.className = `status-value ${errorCount > 0 ? 'offline' : 'online'}`;
        }

        // --- Search Filter ---
        function filterGames() {
            const input = document.getElementById('moduleSearch').value.toLowerCase();
            const links = document.querySelectorAll('.game-link');
            
            links.forEach(link => {
                const name = link.getAttribute('data-name');
                link.style.display = name.includes(input) ? "flex" : "none";
            });
        }

        // --- Init ---
        buildArcade();
        updateLiveStats();
        setInterval(updateLiveStats, 3000);
    </script>

    <footer>
        DC × AK × NEBULA SYSTEMS // GRID V3.4.0
    </footer>
</body>
</html>
