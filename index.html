<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA | Gaming OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --bg: #030406;
            --surface: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.07);
            --text: #ffffff;
            --text-dim: #64748b;
            --danger: #ff4444;
            --warning: #ffaa00;
            --info: #00d9ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; background-image: radial-gradient(circle at 50% -20%, rgba(0,255,136,0.1), transparent 70%); }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(3, 4, 6, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .nav-link { font-size: 0.7rem; color: var(--text-dim); cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; padding: 10px 15px; }

        /* --- DEV PANEL --- */
        #devPanel { position: fixed; top: 0; left: -100%; width: 100%; max-width: 550px; height: 100vh; background: #07080a; border-right: 1px solid var(--border); z-index: 4000; transition: 0.5s; padding: 40px; overflow-y: auto; }
        #devPanel.active { left: 0; box-shadow: 50px 0 100px #000; }
        .dev-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 15px; margin-bottom: 15px; }
        
        .ban-timer-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 10px 0; }
        .timer-opt { background: #111; border: 1px solid #333; color: #666; padding: 6px; border-radius: 4px; font-size: 0.55rem; cursor: pointer; font-weight: 800; text-align: center; transition: 0.2s; }
        .timer-opt.active { border-color: var(--primary); color: var(--primary); background: rgba(0,255,136,0.05); }

        .dev-btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .dev-btn { padding: 10px; border-radius: 6px; border: none; font-size: 0.6rem; font-weight: 800; cursor: pointer; color: white; text-transform: uppercase; }

        /* --- AUTH --- */
        .modal { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 90%; max-width: 400px; padding: 40px; background: #0a0b0d; border-radius: 30px; text-align: center; border: 1px solid var(--border); }
        .auth-field { width: 100%; padding: 15px; margin-top: 12px; border-radius: 10px; border: 1px solid #222; background: #000; color: #fff; text-align: center; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 40px 5%; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 30px; text-decoration: none; height: 120px; display: flex; align-items: center; justify-content: center; font-weight: 800; transition: 0.3s; }
        .card:hover { border-color: var(--primary); background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div id="devPanel">
        <h2 style="color: var(--primary); font-weight: 800;">ROOT ACCESS</h2>
        <div class="dev-card">
            <p style="font-size: 0.6rem; font-weight: 800; color: var(--text-dim); margin-bottom: 10px;">NETWORK & HARDWARE FILTERS</p>
            <div id="filterList" style="font-family: 'Fira Code'; font-size: 0.7rem; color: var(--danger); margin-bottom: 15px;"></div>
            <input type="text" id="manualInput" style="width:100%; background:#000; border:1px solid #222; color:#fff; padding:10px; border-radius:5px; font-size:0.8rem;" placeholder="Manual Entry (IP/Device ID)">
            <div class="dev-btn-group">
                <button class="dev-btn" style="background:var(--danger)" onclick="manualAction('ip')">Ban IP</button>
                <button class="dev-btn" style="background:var(--info)" onclick="manualAction('dev')">Ban Device</button>
            </div>
        </div>
        <div id="devUserList"></div>
        <button class="nav-link" onclick="toggleDev()" style="width:100%; border:1px solid var(--border); margin-top:20px; border-radius:8px;">Exit Terminal</button>
    </div>

    <div id="authOverlay" class="modal">
        <div class="auth-box">
            <h1 style="letter-spacing: 5px;">NEBULA</h1>
            <input type="text" id="userInput" class="auth-field" placeholder="CALLSIGN">
            <input type="password" id="passInput" class="auth-field" placeholder="ACCESS KEY">
            <button class="auth-btn" style="width:100%; padding:15px; margin-top:20px; border-radius:10px; border:none; background:var(--primary); font-weight:800; cursor:pointer;" onclick="processAuth()">INITIALIZE</button>
            <p style="margin-top: 20px; font-size: 0.7rem; color: var(--text-dim); cursor: pointer;" onclick="toggleAuthMode()" id="toggleTxt">NEW USER? REGISTER</p>
        </div>
    </div>

    <nav>
        <div style="display:flex; align-items:center; gap:10px;"><div style="width:15px; height:15px; background:var(--primary); border-radius:3px;"></div><h1 style="font-size:0.9rem; letter-spacing:3px;">NEBULA</h1></div>
        <div>
            <span id="devTrigger" class="nav-link" onclick="toggleDev()" style="display:none; color: var(--warning);">[ CMD ]</span>
            <span id="navUser" style="margin-left:15px; font-weight:800; color:var(--primary); font-size: 0.8rem;">GUEST</span>
            <span class="nav-link" onclick="doLogout()">Logout</span>
        </div>
    </nav>

    <div id="gameGrid" class="grid"></div>

    <script>
        const _0xADMIN = "MTIzNDU2Nzgh"; 
        const MOCK_IP = "127.0.0.1";
        const DEVICE_ID = btoa(navigator.userAgent + screen.width).substring(0, 10);
        let isLoginMode = true;
        let activeDuration = {};

        const gameList = ["Eggshell", "Neon-Golf", "Neon-Hex", "Neon-Pong", "Neon-Slams", "Neon-Slash"];

        function processAuth() {
            const u = document.getElementById('userInput').value.trim();
            const p = document.getElementById('passInput').value.trim();
            const ipB = JSON.parse(localStorage.getItem('neb_ipbans')) || {};
            const dvB = JSON.parse(localStorage.getItem('neb_devbans')) || {};
            const acB = JSON.parse(localStorage.getItem('neb_bans')) || {};

            const isAdmin = (u.toUpperCase() === 'ADMIN' && p === atob(_0xADMIN));

            if (!isAdmin) {
                if (validateBan(ipB[MOCK_IP], 'ip', MOCK_IP)) return alert("NETWORK BLACKLISTED");
                if (validateBan(dvB[DEVICE_ID], 'dev', DEVICE_ID)) return alert("HARDWARE RESTRICTED");
                if (validateBan(acB[u.toLowerCase()], 'acc', u.toLowerCase())) return alert("ACCOUNT SUSPENDED");
            }

            if(isAdmin) { localStorage.setItem('neb_active', 'ADMIN'); location.reload(); return; }

            let db = JSON.parse(localStorage.getItem('neb_db')) || {};
            if(isLoginMode) {
                if(db[u] && db[u].pw === p) {
                    db[u].lastIP = MOCK_IP; db[u].lastDev = DEVICE_ID;
                    localStorage.setItem('neb_db', JSON.stringify(db));
                    localStorage.setItem('neb_active', u); location.reload();
                } else alert("DENIED");
            } else {
                if(db[u]) return alert("EXISTS");
                db[u] = { pw: p, lastIP: MOCK_IP, lastDev: DEVICE_ID };
                localStorage.setItem('neb_db', JSON.stringify(db));
                localStorage.setItem('neb_active', u); location.reload();
            }
        }

        function validateBan(obj, type, key) {
            if (!obj) return false;
            if (obj.expiry && Date.now() > obj.expiry) {
                let s = type === 'ip' ? 'neb_ipbans' : (type === 'dev' ? 'neb_devbans' : 'neb_bans');
                let d = JSON.parse(localStorage.getItem(s)); delete d[key];
                localStorage.setItem(s, JSON.stringify(d)); return false;
            }
            return true;
        }

        function setDuration(ref, days, el) {
            activeDuration[ref] = days;
            document.querySelectorAll(`.opt-${ref}`).forEach(o => o.classList.remove('active'));
            el.classList.add('active');
        }

        function toggleBan(type, key, ref) {
            let s = type === 'ip' ? 'neb_ipbans' : (type === 'dev' ? 'neb_devbans' : 'neb_bans');
            let d = JSON.parse(localStorage.getItem(s)) || {};
            if (d[key]) { delete d[key]; } else {
                const days = activeDuration[ref] || 0;
                d[key] = { expiry: days > 0 ? Date.now() + (days * 86400000) : null };
            }
            localStorage.setItem(s, JSON.stringify(d)); refreshDevList();
        }

        function manualAction(type) {
            const val = document.getElementById('manualInput').value.trim();
            if(val) toggleBan(type, val, 'manual');
        }

        function refreshDevList() {
            const db = JSON.parse(localStorage.getItem('neb_db')) || {};
            const ipB = JSON.parse(localStorage.getItem('neb_ipbans')) || {};
            const dvB = JSON.parse(localStorage.getItem('neb_devbans')) || {};
            const acB = JSON.parse(localStorage.getItem('neb_bans')) || {};

            let filters = "";
            for(let k in ipB) filters += `<div>IP: ${k} <span onclick="toggleBan('ip','${k}')">[LIFT]</span></div>`;
            for(let k in dvB) filters += `<div>DEV: ${k} <span onclick="toggleBan('dev','${k}')">[LIFT]</span></div>`;
            document.getElementById('filterList').innerHTML = filters || 'SYSTEMS CLEAR';

            document.getElementById('devUserList').innerHTML = Object.keys(db).map(u => {
                const isB = !!acB[u.toLowerCase()];
                return `
                <div class="dev-card">
                    <p style="font-weight:800; color:var(--primary); font-size:0.8rem;">${u.toUpperCase()}</p>
                    <div class="ban-timer-row">
                        <div class="timer-opt opt-${u}" onclick="setDuration('${u}', 1, this)">1D</div>
                        <div class="timer-opt opt-${u}" onclick="setDuration('${u}', 3, this)">3D</div>
                        <div class="timer-opt opt-${u}" onclick="setDuration('${u}', 7, this)">1W</div>
                        <div class="timer-opt opt-${u}" onclick="setDuration('${u}', 30, this)">1M</div>
                        <div class="timer-opt opt-${u}" onclick="setDuration('${u}', 365, this)">1Y</div>
                        <div class="timer-opt opt-${u}" onclick="setDuration('${u}', 0, this)">∞</div>
                    </div>
                    <div class="dev-btn-group">
                        <button class="dev-btn" style="background:var(--danger)" onclick="toggleBan('acc','${u.toLowerCase()}','${u}')">${isB ? 'Lift Account' : 'Ban Account'}</button>
                        <button class="dev-btn" style="background:var(--warning)" onclick="toggleBan('ip','${db[u].lastIP}','${u}')">Ban IP</button>
                        <button class="dev-btn" style="background:var(--info); grid-column: span 2;" onclick="toggleBan('dev','${db[u].lastDev}','${u}')">Ban Device (${db[u].lastDev})</button>
                    </div>
                </div>`;
            }).join('');
        }

        function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('toggleTxt').innerText = isLoginMode ? "NEW USER? REGISTER" : "BACK TO LOGIN"; }
        function toggleDev() { document.getElementById('devPanel').classList.toggle('active'); refreshDevList(); }
        function doLogout() { localStorage.removeItem('neb_active'); location.reload(); }

        function renderUI() {
            const u = localStorage.getItem('neb_active'); if(!u) return;
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('navUser').innerText = u.toUpperCase();
            if(u === 'ADMIN') document.getElementById('devTrigger').style.display = 'inline-block';
            document.getElementById('gameGrid').innerHTML = gameList.map(g => `<div class="card">${g}</div>`).join('');
        }

        if(localStorage.getItem('neb_active')) renderUI();
    </script>
</body>
</html>
