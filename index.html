<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula | The Future of Play</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.3);
            --bg: #050608;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --easing: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Themes */
        [data-theme="cyber"] { --primary: #ff00ff; --primary-glow: rgba(255, 0, 255, 0.3); }
        [data-theme="ocean"] { --primary: #00d9ff; --primary-glow: rgba(0, 217, 255, 0.3); }
        [data-theme="amber"] { --primary: #ffaa00; --primary-glow: rgba(255, 170, 0, 0.3); }
        [data-theme="crimson"] { --primary: #ff4d4d; --primary-glow: rgba(255, 77, 77, 0.3); }
        [data-theme="amethyst"] { --primary: #a855f7; --primary-glow: rgba(168, 85, 247, 0.3); }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 0% 0%, var(--primary-glow) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(0,0,0,1) 0%, transparent 40%);
            background-attachment: fixed;
        }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 5%; position: sticky; top: 0; z-index: 1000;
            background: rgba(5, 6, 8, 0.8); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo { 
            width: 30px; height: 30px; background: var(--primary); 
            border-radius: 6px; box-shadow: 0 0 20px var(--primary);
            transform: rotate(-15deg); transition: 0.5s var(--easing);
        }
        .brand:hover .brand-logo { transform: rotate(0deg) scale(1.1); }
        .brand h1 { font-size: 1.2rem; letter-spacing: 4px; font-weight: 800; color: #fff; }

        header { padding: 60px 5%; max-width: 1400px; margin: 0 auto; }
        header h2 { font-size: 3.5rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -1px; }
        header p { color: var(--text-dim); font-size: 1.1rem; }

        .search-container { position: relative; margin-top: 30px; max-width: 600px; }
        #moduleSearch {
            width: 100%; padding: 18px 25px;
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 12px; color: #fff; font-size: 1rem;
            transition: 0.3s;
        }
        #moduleSearch:focus { border-color: var(--primary); outline: none; background: rgba(255,255,255,0.07); }

        .link-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px; padding: 20px 5% 120px; max-width: 1400px; margin: 0 auto;
        }

        .game-card {
            position: relative; text-decoration: none;
            background: var(--glass); border-radius: 20px;
            border: 1px solid var(--glass-border);
            padding: 24px; display: flex; flex-direction: column; justify-content: flex-end;
            min-height: 180px; transition: 0.4s var(--easing);
            overflow: hidden;
        }

        .game-card::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(45deg, var(--primary), transparent);
            opacity: 0; transition: 0.4s; z-index: 0;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        
        .game-card:hover::before { opacity: 0.05; }

        .game-info { position: relative; z-index: 2; }
        .game-title { font-weight: 800; font-size: 1.3rem; color: #fff; display: block; margin-bottom: 8px; }
        .game-meta { display: flex; justify-content: space-between; align-items: center; }
        .category { font-size: 0.7rem; font-weight: 800; letter-spacing: 1px; color: var(--text-dim); }
        .score-pill {
            background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 6px;
            font-family: 'Fira Code', monospace; color: var(--primary);
            font-size: 0.75rem; border: 1px solid var(--primary-glow);
        }

        /* Footer Dock */
        .dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 17, 23, 0.8); backdrop-filter: blur(20px);
            padding: 12px 20px; border-radius: 100px;
            border: 1px solid var(--glass-border); display: flex; gap: 15px; z-index: 1000;
        }
        .theme-node {
            width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
            border: 2px solid rgba(255,255,255,0.1); transition: 0.3s;
        }
        .theme-node:hover { transform: scale(1.3); border-color: #fff; }
    </style>
</head>
<body>

    <nav>
        <div class="brand">
            <div class="brand-logo"></div>
            <h1>NEBULA</h1>
        </div>
    </nav>

    <header>
        <h2 id="greeting">System Online</h2>
        <p>Accessing localized game modules...</p>
        <div class="search-container">
            <input type="text" id="moduleSearch" placeholder="Search library..." onkeyup="filterGames()">
        </div>
    </header>

    <div id="gameGrid" class="link-container"></div>

    <div class="dock">
        <div class="theme-node" style="background:#00ff88" onclick="setTheme('default')"></div>
        <div class="theme-node" style="background:#ff00ff" onclick="setTheme('cyber')"></div>
        <div class="theme-node" style="background:#00d9ff" onclick="setTheme('ocean')"></div>
        <div class="theme-node" style="background:#ffaa00" onclick="setTheme('amber')"></div>
        <div class="theme-node" style="background:#ff4d4d" onclick="setTheme('crimson')"></div>
        <div class="theme-node" style="background:#a855f7" onclick="setTheme('amethyst')"></div>
    </div>

    <script>
        const games = [
            { name: "Eggshell", cat: "Shooter", url: "eggshell.html" },
            { name: "Cyber Strike", cat: "Action", url: "Cyber-Strike.html" },
            { name: "Neon Slash", cat: "Action", url: "Neon-Slash.html" },
            { name: "Neon Slams", cat: "Sports", url: "Neon-Slams.html" },
            { name: "Neon Hex", cat: "Strategy", url: "Neon-Hex.html" },
            { name: "Neon Pong", cat: "Arcade", url: "Neon-Pong.html" },
            { name: "Neon Golf", cat: "Sports", url: "Neon-Golf.html" },
            { name: "Overdrive", cat: "Racing", url: "overdrive.html" },
            { name: "Blockcraft", cat: "Creative", url: "blockcraft.html" },
            { name: "Master Armory", cat: "Shooter", url: "masterarmory.html" },
            { name: "Snake", cat: "Arcade", url: "snake.html" },
            { name: "Minesweeper", cat: "Puzzle", url: "minesweeper.html" }
        ];

        function buildGrid() {
            const grid = document.getElementById('gameGrid');
            const scores = JSON.parse(localStorage.getItem('nebula_scores')) || {};
            
            grid.innerHTML = games.map(game => {
                const best = scores[game.name] || 0;
                return `
                    <a href="${game.url}" target="_blank" class="game-card" data-name="${game.name.toLowerCase()}">
                        <div class="game-info">
                            <span class="game-title">${game.name}</span>
                            <div class="game-meta">
                                <span class="category">${game.cat.toUpperCase()}</span>
                                <div class="score-pill">PTS: ${best}</div>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function setTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            if(t === 'default') document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('nebula_theme', t);
        }

        function filterGames() {
            const q = document.getElementById('moduleSearch').value.toLowerCase();
            document.querySelectorAll('.game-card').forEach(card => {
                card.style.display = card.dataset.name.includes(q) ? 'flex' : 'none';
            });
        }

        // Initialize
        const savedTheme = localStorage.getItem('nebula_theme');
        if(savedTheme) setTheme(savedTheme);
        buildGrid();
    </script>
</body>
</html>
