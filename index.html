<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA OS | v9.0 ULTRA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.4);
            --bg: #050608;
            --glass: rgba(10, 12, 16, 0.8);
            --glass-bright: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-dim: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
            flex-direction: column; 
        }

        /* --- DYNAMIC BACKGROUND --- */
        .desktop-bg { 
            position: fixed; inset: 0; z-index: -1; 
            background: 
                radial-gradient(circle at 0% 0%, rgba(var(--primary-rgb, 0, 255, 136), 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(191, 0, 255, 0.1) 0%, transparent 40%),
                #020305;
        }

        /* --- LOGIN --- */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-box { 
            background: var(--glass); border: 1px solid var(--border); 
            padding: 40px; border-radius: 32px; text-align: center; width: 380px;
            backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .auth-input { 
            width: 100%; padding: 16px; border-radius: 14px; background: rgba(0,0,0,0.4); 
            border: 1px solid var(--border); color: white; margin-bottom: 12px; 
            text-align: center; font-family: 'Fira Code'; transition: 0.3s;
        }
        .auth-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 15px var(--primary-glow); }
        .auth-btn { 
            width: 100%; padding: 16px; border-radius: 14px; background: var(--primary); 
            color: #000; font-weight: 800; border: none; cursor: pointer; transition: 0.3s;
        }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px var(--primary-glow); }

        /* --- NAVBAR --- */
        nav { 
            height: 55px; padding: 0 25px; display: flex; justify-content: space-between; 
            align-items: center; background: rgba(0, 0, 0, 0.7); 
            backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); z-index: 1000; 
        }

        /* --- APP GRID --- */
        .main-stage { flex: 1; padding: 30px; position: relative; }
        .grid-engine { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
            gap: 25px; max-width: 1200px; margin: 0 auto; 
        }
        .app-icon { 
            display: flex; flex-direction: column; align-items: center; gap: 10px; 
            padding: 15px; cursor: pointer; border-radius: 20px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .app-icon:hover { background: var(--glass-bright); transform: translateY(-5px); }
        .icon-visual { 
            width: 64px; height: 64px; border-radius: 18px; 
            background: linear-gradient(145deg, #1e293b, #0f172a); 
            display: flex; align-items: center; justify-content: center; 
            color: var(--primary); border: 1px solid var(--border);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .app-label { font-size: 0.8rem; font-weight: 500; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* --- WINDOWS --- */
        .os-window { 
            position: absolute; min-width: 300px; min-height: 200px; 
            background: var(--glass); border: 1px solid var(--border); 
            border-radius: 16px; display: flex; flex-direction: column; 
            pointer-events: auto; backdrop-filter: blur(25px);
            box-shadow: 0 30px 100px rgba(0,0,0,0.8); overflow: hidden;
        }
        .win-head { 
            height: 45px; background: var(--glass-bright); 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 18px; cursor: grab; border-bottom: 1px solid var(--border);
        }
        .win-body { flex: 1; position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        /* --- RESIZE HANDLE --- */
        .resizer {
            position: absolute; width: 15px; height: 15px;
            bottom: 0; right: 0; cursor: nwse-resize;
            background: linear-gradient(135deg, transparent 50%, var(--primary) 50%);
            border-radius: 0 0 16px 0; opacity: 0.5;
        }

        .win-controls { display: flex; gap: 8px; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
        .btn-close { background: #ff5f57; }
        .btn-max { background: #febc2e; }

    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <i data-lucide="aperture" style="width: 60px; height: 60px; color: var(--primary); margin-bottom: 20px;"></i>
            <h2 style="margin-bottom: 5px; font-weight: 800; letter-spacing: -1px;">NEBULA LOGIN</h2>
            <p style="font-size: 0.75rem; color: var(--text-dim); margin-bottom: 25px;">Enter credentials to unlock core</p>
            <input type="text" id="user-input" class="auth-input" placeholder="Username">
            <input type="password" id="pin-input" class="auth-input" placeholder="4-Digit PIN">
            <button class="auth-btn" onclick="Auth.attemptLogin()">UNLOCK SYSTEM</button>
            <div id="auth-msg" style="color: #ff3333; font-size: 0.7rem; margin-top: 15px; font-weight: 600;"></div>
        </div>
    </div>

    <div class="desktop-bg"></div>

    <nav>
        <div style="display:flex; align-items:center; gap:12px;">
            <div style="width:30px; height:30px; background:var(--primary); border-radius:8px; display:flex; align-items:center; justify-content:center; color:#000;">
                <i data-lucide="layers" style="width:18px;"></i>
            </div>
            <span style="font-weight:800; letter-spacing:1px; font-size: 0.9rem;">NEBULA<span style="color:var(--primary)">OS</span></span>
        </div>
        <div style="display:flex; gap:20px; align-items:center; font-family:'Fira Code'; font-size:0.85rem;">
            <span id="user-display" style="color:var(--text-dim)"></span>
            <span id="clock" style="font-weight: 600;">00:00</span>
            <i data-lucide="log-out" style="width:18px; cursor:pointer; color:var(--text-dim);" onclick="location.reload()"></i>
        </div>
    </nav>

    <main class="main-stage">
        <div id="grid" class="grid-engine"></div>
        <div id="window-layer"></div>
    </main>

    <script>
        const Auth = {
            currentUser: null,
            init() {
                lucide.createIcons();
                let registry = JSON.parse(localStorage.getItem('nebula_registry') || '{}');
                if(!registry['admin']) {
                    registry['admin'] = { pin: "1234", role: 'admin', banned: false };
                    localStorage.setItem('nebula_registry', JSON.stringify(registry));
                }
            },
            attemptLogin() {
                const u = document.getElementById('user-input').value.toLowerCase().trim();
                const p = document.getElementById('pin-input').value.trim();
                const registry = JSON.parse(localStorage.getItem('nebula_registry') || '{}');

                if (registry[u] && registry[u].pin === p) {
                    if (registry[u].banned) return alert("ACCOUNT BANNED");
                    this.currentUser = { username: u, role: registry[u].role };
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('user-display').innerText = u.toUpperCase();
                    Kernel.boot();
                } else {
                    document.getElementById('auth-msg').innerText = "INVALID ACCESS KEY";
                }
            }
        };

        const Kernel = {
            apps: [
                { id: "strike", n: "Cyber Strike", f: "Cyber-Strike.html", i: "zap" },
                { id: "pong", n: "Neon Pong", f: "Neon-Pong.html", i: "activity" },
                { id: "ai", n: "AI Core", f: "ai.html", i: "bot" },
                { id: "drift", n: "Drift King", f: "drift.html", i: "navigation-2" },
                { id: "snake", n: "Snake Pro", f: "snake.html", i: "trending-up" },
                { id: "math", n: "Maths Core", f: "sparksmaths.html", i: "divide" }
            ],
            zIndex: 100,

            boot() {
                const grid = document.getElementById('grid');
                grid.innerHTML = this.apps.map(app => `
                    <div class="app-icon" onclick="Kernel.launch('${app.id}')">
                        <div class="icon-visual"><i data-lucide="${app.i}"></i></div>
                        <div class="app-label">${app.n}</div>
                    </div>
                `).join('');
                lucide.createIcons();
                setInterval(() => {
                    document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                }, 1000);
            },

            launch(id) {
                const app = this.apps.find(a => a.id === id);
                const winId = `win-${id}`;
                if(document.getElementById(winId)) return this.focus(winId);

                const html = `
                    <div class="os-window" id="${winId}" style="left:150px; top:100px; width:700px; height:450px; z-index:${++this.zIndex}" onmousedown="Kernel.focus('${winId}')">
                        <div class="win-head" onmousedown="Kernel.drag(event, '${winId}')">
                            <span style="font-size:0.75rem; font-weight:700; letter-spacing:1px; color:var(--primary)">${app.n.toUpperCase()}</span>
                            <div class="win-controls">
                                <button class="win-btn btn-max"></button>
                                <button class="win-btn btn-close" onclick="document.getElementById('${winId}').remove()"></button>
                            </div>
                        </div>
                        <div class="win-body">
                            <iframe src="${app.f}"></iframe>
                        </div>
                        <div class="resizer" onmousedown="Kernel.resize(event, '${winId}')"></div>
                    </div>`;
                document.getElementById('window-layer').insertAdjacentHTML('beforeend', html);
            },

            focus(id) {
                document.getElementById(id).style.zIndex = ++this.zIndex;
            },

            drag(e, id) {
                const el = document.getElementById(id);
                let ox = e.clientX - el.offsetLeft;
                let oy = e.clientY - el.offsetTop;
                
                const move = (ev) => {
                    el.style.left = (ev.clientX - ox) + 'px';
                    el.style.top = (ev.clientY - oy) + 'px';
                };
                
                document.addEventListener('mousemove', move);
                document.addEventListener('mouseup', () => document.removeEventListener('mousemove', move), {once:true});
            },

            resize(e, id) {
                e.preventDefault();
                e.stopPropagation();
                const el = document.getElementById(id);
                const startW = el.offsetWidth;
                const startH = el.offsetHeight;
                const startX = e.clientX;
                const startY = e.clientY;

                const doResize = (ev) => {
                    el.style.width = (startW + ev.clientX - startX) + 'px';
                    el.style.height = (startH + ev.clientY - startY) + 'px';
                };

                document.addEventListener('mousemove', doResize);
                document.addEventListener('mouseup', () => document.removeEventListener('mousemove', doResize), {once:true});
            }
        };

        window.onload = () => Auth.init();
    </script>
</body>
</html>
