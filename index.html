<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Games | Core Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Fira+Code:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.4);
            --bg: #030303;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --error: #ff3366;
        }

        [data-theme="cyber"] { --primary: #ff00ff; --primary-glow: rgba(255, 0, 255, 0.4); }
        [data-theme="ocean"] { --primary: #00d9ff; --primary-glow: rgba(0, 217, 255, 0.4); }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- CRITICAL ERROR OVERLAY --- */
        #error-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 50, 0.2);
            backdrop-filter: blur(8px);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .error-box {
            background: #ff0033;
            color: #fff;
            padding: 30px;
            border: 4px solid #fff;
            font-family: 'Orbitron';
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 0, 50, 0.8);
            max-width: 400px;
            animation: pulse-red 0.5s infinite alternate;
        }

        @keyframes pulse-red {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }

        /* --- UI ELEMENTS --- */
        #canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.15; }

        header { text-align: center; padding: 50px 20px; }
        h1 { font-family: 'Orbitron'; font-size: 3rem; letter-spacing: 10px; color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); }

        .status-panel {
            width: 90%; max-width: 1000px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; background: rgba(255,255,255,0.05);
            padding: 20px; border: 1px solid var(--card-border); margin-bottom: 20px;
        }

        .status-item { border-left: 3px solid var(--primary); padding-left: 15px; }
        .label { font-size: 0.6rem; text-transform: uppercase; opacity: 0.5; font-family: 'Orbitron'; }
        .value { font-family: 'Fira Code'; font-size: 1rem; display: block; }

        .link-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px; width: 90%; max-width: 1000px;
        }

        .game-link {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 30px;
            text-decoration: none;
            color: #fff;
            text-align: center;
            font-family: 'Orbitron';
            transition: 0.3s;
            position: relative;
            cursor: pointer;
        }

        .game-link:hover { border-color: var(--primary); background: rgba(0, 255, 136, 0.05); }

        /* Console log at bottom */
        #console {
            width: 90%; max-width: 1000px;
            background: #000; height: 100px;
            margin-top: 30px; padding: 10px;
            font-family: 'Fira Code'; font-size: 0.7rem;
            color: #00ff88; overflow-y: auto;
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <div id="error-overlay">
        <div class="error-box">
            <h2>LINK_VAL_FAILURE</h2>
            <p id="error-details">ERROR: Target module is unreachable or corrupted.</p>
            <button onclick="closeError()" style="padding: 10px 20px; cursor: pointer; font-family: 'Orbitron';">RETRY CONNECTION</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <header>
        <h1>NEBULA OS</h1>
        <div style="font-family:'Orbitron'; font-size: 0.7rem; letter-spacing: 4px; opacity: 0.6;">MODULE COMMAND CENTER</div>
    </header>

    <div class="status-panel">
        <div class="status-item">
            <span class="label">Net Latency</span>
            <span id="ping" class="value">--ms</span>
        </div>
        <div class="status-item" id="node-status">
            <span class="label">Node Integrity</span>
            <span class="value" style="color:var(--primary)">STABLE</span>
        </div>
    </div>

    <div id="stable-container" class="link-container"></div>

    <div id="console">> Initializing system log...</div>

    <script>
        // List of games. "broken: true" will trigger the system error.
        const games = [
            { name: "Cyber Strike", url: "strike.html", broken: false },
            { name: "Neural Link", url: "neural.html", broken: true },
            { name: "Void Runner", url: "void.html", broken: false },
            { name: "Data Siphon", url: "siphon.html", broken: true }
        ];

        function buildArcade() {
            const container = document.getElementById('stable-container');
            container.innerHTML = games.map(game => `
                <div class="game-link" onclick="handleLinkClick('${game.name}', ${game.broken})">
                    ${game.name}
                </div>
            `).join('');
        }

        function handleLinkClick(name, isBroken) {
            addToConsole(`Requesting access to module: ${name}...`);
            
            if(isBroken) {
                setTimeout(() => {
                    document.getElementById('error-details').innerText = `CRITICAL: Module [${name}] returned 404_NOT_FOUND. Visual uplink severed.`;
                    document.getElementById('error-overlay').style.display = 'flex';
                    document.getElementById('node-status').children[1].innerText = "UNSTABLE";
                    document.getElementById('node-status').children[1].style.color = "#ff3366";
                    addToConsole(`ERROR: Handshake failed for ${name}.`, true);
                }, 500);
            } else {
                addToConsole(`Access Granted. Redirecting to ${name}...`);
                // window.location.href = url; // Real redirect would go here
            }
        }

        function closeError() {
            document.getElementById('error-overlay').style.display = 'none';
            document.getElementById('node-status').children[1].innerText = "STABLE";
            document.getElementById('node-status').children[1].style.color = "#00ff88";
            addToConsole("System rebooted. Buffer cleared.");
        }

        function addToConsole(msg, isError = false) {
            const con = document.getElementById('console');
            const time = new Date().toLocaleTimeString();
            con.innerHTML += `<div style="color:${isError ? '#ff3366' : '#00ff88'}">[${time}] ${msg}</div>`;
            con.scrollTop = con.scrollHeight;
        }

        // Simulating Ping
        setInterval(() => {
            const p = Math.floor(Math.random() * 40) + 10;
            document.getElementById('ping').innerText = `${p}ms`;
        }, 2000);

        // Matrix Effect
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "010101NEBULA";
        const drops = Array(Math.floor(canvas.width / 10)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff88";
            drops.forEach((y, i) => {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * 10, y * 10);
                if (y * 10 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 50);

        buildArcade();
    </script>
</body>
</html>
