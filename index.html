<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA OS | v8.0 ADMIN</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #00ff88;
            --primary-rgb: 0, 255, 136;
            --bg: #020305;
            --glass: rgba(15, 18, 24, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        body.theme-green { --primary: #00ff88; --primary-rgb: 0, 255, 136; }
        body.theme-cyan { --primary: #00f2ff; --primary-rgb: 0, 242, 255; }
        body.theme-purple { --primary: #bf00ff; --primary-rgb: 191, 0, 255; }
        body.theme-red { --primary: #ff3333; --primary-rgb: 255, 51, 51; }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg); color: var(--text-main); height: 100vh; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; }
        .desktop-bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at top right, rgba(var(--primary-rgb), 0.08), transparent 60%); }

        /* --- AUTH SCREEN --- */
        #auth-screen { position: fixed; inset: 0; background: rgba(2, 3, 5, 0.98); backdrop-filter: blur(25px); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-box { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); padding: 40px; border-radius: 24px; text-align: center; width: 350px; }
        .auth-input { width: 100%; padding: 15px; border-radius: 12px; background: #000; border: 1px solid var(--border); color: white; margin-bottom: 15px; text-align: center; font-family: 'Fira Code'; }
        .auth-btn { width: 100%; padding: 15px; border-radius: 12px; background: var(--primary); color: #000; font-weight: 800; border: none; cursor: pointer; }
        .auth-error { color: #ff3333; font-size: 0.75rem; margin-top: 10px; min-height: 1.2em; font-weight: bold; }

        /* --- ADMIN PANEL STYLE --- */
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.8rem; }
        .admin-table th { text-align: left; color: var(--text-dim); padding: 10px; border-bottom: 1px solid var(--border); }
        .admin-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .status-tag { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .status-active { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .status-banned { background: rgba(255, 51, 51, 0.2); color: #ff3333; }
        .ban-btn { background: transparent; border: 1px solid var(--border); color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        .ban-btn:hover { border-color: #ff3333; color: #ff3333; }

        /* --- COMMON UI --- */
        nav { height: 45px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(5, 7, 10, 0.6); z-index: 100; }
        .main-stage { flex: 1; padding: 20px; position: relative; overflow-y: auto; }
        .grid-engine { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; max-width: 1100px; margin: 0 auto; }
        .app-icon { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 15px; cursor: pointer; transition: 0.2s; }
        .app-icon:hover { background: rgba(255,255,255,0.05); border-radius: 16px; }
        .icon-visual { width: 50px; height: 50px; border-radius: 12px; background: #1a1f26; display: flex; align-items: center; justify-content: center; color: var(--primary); border: 1px solid var(--border); }

        /* --- WINDOWS --- */
        #window-layer { position: absolute; inset: 0; pointer-events: none; }
        .os-window { position: absolute; width: 700px; height: 450px; background: #05070a; border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; pointer-events: auto; box-shadow: 0 30px 60px rgba(0,0,0,0.7); }
        .win-head { height: 35px; background: #0f1218; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; cursor: grab; }
        .win-body { flex: 1; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body class="theme-green">

    <div id="auth-screen">
        <div class="auth-box">
            <div id="auth-header">
                <i data-lucide="shield-check" style="width: 50px; height: 50px; color: var(--primary); margin-bottom: 20px;"></i>
                <h2 id="auth-title">System Login</h2>
                <p style="font-size: 0.75rem; color: var(--text-dim); margin-bottom: 20px;">Nebula Security Gateway</p>
            </div>

            <div id="login-fields">
                <input type="text" id="user-input" class="auth-input" placeholder="Username">
                <input type="password" id="pin-input" class="auth-input" placeholder="4-Digit PIN">
                <button class="auth-btn" onclick="Auth.attemptLogin()">ACCESS SYSTEM</button>
                <div id="auth-msg" class="auth-error"></div>
                
                <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
                    <button style="background:none; border:none; color:var(--primary); font-size:0.7rem; cursor:pointer;" onclick="Auth.showRegister()">+ Create Standard Account</button>
                </div>
            </div>
        </div>
    </div>

    <div class="desktop-bg"></div>

    <nav>
        <div style="display:flex; align-items:center; gap:15px;">
            <span style="font-weight:800; letter-spacing:1px;">NEBULA OS</span>
            <span id="user-display" style="font-size:0.7rem; background:rgba(var(--primary-rgb), 0.1); padding:3px 8px; border-radius:10px; color:var(--primary);"></span>
        </div>
        <div style="display:flex; gap:15px; align-items:center; font-family:'Fira Code'; font-size:0.8rem;">
            <span id="clock">00:00</span>
            <i data-lucide="power" style="width:16px; cursor:pointer; color:#ff3333;" onclick="location.reload()"></i>
        </div>
    </nav>

    <main class="main-stage">
        <div id="grid" class="grid-engine"></div>
        <div id="window-layer"></div>
    </main>

    <script>
        // --- SECURITY & ADMIN DATABASE ---
        // Hidden hash for "1234". This prevents the plain password from being searchable.
        const _K = "MTIzNA=="; 
        
        const Auth = {
            currentUser: null,
            
            init() {
                lucide.createIcons();
                // Ensure Admin exists in registry
                let registry = JSON.parse(localStorage.getItem('nebula_registry') || '{}');
                if(!registry['admin']) {
                    registry['admin'] = { pin: atob(_K), role: 'admin', banned: false };
                    localStorage.setItem('nebula_registry', JSON.stringify(registry));
                }
            },

            attemptLogin() {
                const u = document.getElementById('user-input').value.toLowerCase().trim();
                const p = document.getElementById('pin-input').value.trim();
                const msg = document.getElementById('auth-msg');
                let registry = JSON.parse(localStorage.getItem('nebula_registry') || '{}');

                if (registry[u]) {
                    if (registry[u].banned) {
                        msg.innerText = "CRITICAL: YOUR ACCOUNT IS SUSPENDED.";
                        return;
                    }
                    if (registry[u].pin === p) {
                        this.success(u, registry[u].role);
                    } else {
                        msg.innerText = "ACCESS DENIED: INVALID PIN";
                    }
                } else {
                    msg.innerText = "USER NOT FOUND";
                }
            },

            showRegister() {
                const u = prompt("Enter New Username:");
                const p = prompt("Enter 4-Digit PIN:");
                if(!u || !/^\d{4}$/.test(p)) return alert("Invalid inputs.");
                
                let registry = JSON.parse(localStorage.getItem('nebula_registry') || '{}');
                if(registry[u]) return alert("User already exists.");
                
                registry[u] = { pin: p, role: 'user', banned: false };
                localStorage.setItem('nebula_registry', JSON.stringify(registry));
                alert("Account Created. Please Login.");
            },

            success(username, role) {
                this.currentUser = { username, role };
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('user-display').innerText = `${username.toUpperCase()} (${role.toUpperCase()})`;
                Kernel.boot();
            }
        };

        const Kernel = {
            apps: [
                { id: "strike", n: "Cyber Strike", f: "Cyber-Strike.html", i: "zap" },
                { id: "golf", n: "Neon Golf", f: "Neon-Golf.html", i: "target" },
                { id: "hex", n: "Neon Hex", f: "Neon-Hex.html", i: "hexagon" },
                { id: "pong", n: "Neon Pong", f: "Neon-Pong.html", i: "activity" },
                { id: "slams", n: "Neon Slams", f: "Neon-Slams.html", i: "dribbble" },
                { id: "slash", n: "Neon Slash", f: "Neon-Slash.html", i: "sword" },
                { id: "ai", n: "AI Core", f: "ai.html", i: "bot" },
                { id: "basket", n: "Basketball", f: "basketball.html", i: "circle" },
                { id: "blast", n: "Block Blast", f: "blockblast.html", i: "grid" },
                { id: "breaker", n: "Block Breaker", f: "blockbreaker.html", i: "layers" },
                { id: "craft", n: "Block Craft", f: "blockcraft.html", i: "box" },
                { id: "cricket", n: "Cricket", f: "cricket.html", i: "trophy" },
                { id: "drift", n: "Drift King", f: "drift.html", i: "navigation-2" },
                { id: "footy", n: "Football", f: "football.html", i: "award" },
                { id: "armory", n: "Master Armory", f: "masterarmory.html", i: "shield" },
                { id: "mines", n: "Minesweeper", f: "minesweeper.html", i: "bomb" },
                { id: "trail", n: "Neon Trail", f: "neon-trail.html", i: "wind" },
                { id: "drive", n: "Overdrive", f: "overdrive.html", i: "gauge" },
                { id: "read", n: "Reader", f: "reader.html", i: "book-open" },
                { id: "snake", n: "Snake Pro", f: "snake.html", i: "trending-up" },
                { id: "ai2", n: "AI 2", f: "Ai2.html", i: "cpu" },
                { id: "space", n: "Space Adventure", f: "spaceadventure.html", i: "rocket" },
                { id: "math", n: "Sparks Maths", f: "sparksmaths.html", i: "divide" },
                { id: "ttt", n: "Tic Tac Toe", f: "tictactoe.html", i: "x" }
            ],

            boot() {
                const grid = document.getElementById('grid');
                let appList = [...this.apps];
                
                // Add Admin Tool if user is admin
                if(Auth.currentUser.role === 'admin') {
                    appList.unshift({ id: "admin_mgr", n: "Admin Panel", f: "internal_admin", i: "shield-alert" });
                }

                grid.innerHTML = appList.map(app => `
                    <div class="app-icon" onclick="Kernel.launch('${app.id}')">
                        <div class="icon-visual"><i data-lucide="${app.i}"></i></div>
                        <div class="app-label">${app.n}</div>
                    </div>
                `).join('');
                
                lucide.createIcons();
                setInterval(() => {
                    document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                }, 1000);
            },

            launch(id) {
                if(id === 'admin_mgr') return this.openAdminPanel();
                const app = this.apps.find(a => a.id === id);
                const winId = `win-${id}`;
                if(document.getElementById(winId)) return;

                const html = `
                    <div class="os-window" id="${winId}" style="left:100px; top:100px;">
                        <div class="win-head" onmousedown="Kernel.drag(event, '${winId}')">
                            <span>${app.n}</span>
                            <button onclick="document.getElementById('${winId}').remove()" style="background:red; border:none; width:12px; height:12px; border-radius:50%; cursor:pointer;"></button>
                        </div>
                        <div class="win-body"><iframe src="${app.f}"></iframe></div>
                    </div>`;
                document.getElementById('window-layer').insertAdjacentHTML('beforeend', html);
            },

            openAdminPanel() {
                const winId = 'win-admin';
                if(document.getElementById(winId)) return;

                const html = `
                    <div class="os-window" id="${winId}" style="left:50px; top:50px; width:800px; height:500px;">
                        <div class="win-head" onmousedown="Kernel.drag(event, '${winId}')">
                            <span>SYSTEM ADMINISTRATION - MASTER REGISTRY</span>
                            <button onclick="document.getElementById('${winId}').remove()" style="background:red; border:none; width:12px; height:12px; border-radius:50%; cursor:pointer;"></button>
                        </div>
                        <div class="win-body" style="padding:20px; background:#0a0c10; overflow-y:auto;">
                            <h3 style="color:var(--primary)">User Management</h3>
                            <table class="admin-table" id="admin-table-body">
                                </table>
                        </div>
                    </div>`;
                document.getElementById('window-layer').insertAdjacentHTML('beforeend', html);
                this.refreshAdminTable();
            },

            refreshAdminTable() {
                const registry = JSON.parse(localStorage.getItem('nebula_registry') || '{}');
                const table = document.getElementById('admin-table-body');
                table.innerHTML = `
                    <tr><th>USERNAME</th><th>PIN</th><th>ROLE</th><th>STATUS</th><th>ACTIONS</th></tr>
                    ${Object.keys(registry).map(u => `
                        <tr>
                            <td>${u}</td>
                            <td style="font-family:monospace; color:var(--primary)">${registry[u].pin}</td>
                            <td>${registry[u].role}</td>
                            <td><span class="status-tag ${registry[u].banned ? 'status-banned' : 'status-active'}">${registry[u].banned ? 'BANNED' : 'ACTIVE'}</span></td>
                            <td>
                                ${u !== 'admin' ? `<button class="ban-btn" onclick="Kernel.toggleBan('${u}')">${registry[u].banned ? 'UNBAN' : 'BAN'}</button>` : '--'}
                            </td>
                        </tr>
                    `).join('')}
                `;
            },

            toggleBan(username) {
                let registry = JSON.parse(localStorage.getItem('nebula_registry') || '{}');
                registry[username].banned = !registry[username].banned;
                localStorage.setItem('nebula_registry', JSON.stringify(registry));
                this.refreshAdminTable();
            },

            drag(e, id) {
                const el = document.getElementById(id);
                const r = el.getBoundingClientRect();
                const ox = e.clientX - r.left, oy = e.clientY - r.top;
                const move = (ev) => {
                    el.style.left = (ev.clientX - ox) + 'px';
                    el.style.top = (ev.clientY - oy) + 'px';
                };
                document.addEventListener('mousemove', move);
                document.addEventListener('mouseup', () => document.removeEventListener('mousemove', move), {once:true});
            }
        };

        window.onload = () => Auth.init();
    </script>
</body>
</html>
