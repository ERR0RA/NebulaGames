<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA | Gaming OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --bg: #030406;
            --surface: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.07);
            --text: #ffffff;
            --text-dim: #64748b;
            --danger: #ff4444;
            --warning: #ffaa00;
            --info: #00d9ff;
        }

        /* Theme Variants */
        body.theme-red { --primary: #ff4444; }
        body.theme-blue { --primary: #00d9ff; }
        body.theme-yellow { --primary: #ffcc00; }
        body.theme-green { --primary: #00ff88; }
        body.theme-orange { --primary: #ff8800; }
        body.theme-pink { --primary: #ff00bb; }
        body.theme-grey { --primary: #94a3b8; }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; background-image: radial-gradient(circle at 50% -20%, var(--primary), transparent 70%); transition: background-image 0.5s ease; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(3, 4, 6, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .nav-link { font-size: 0.7rem; color: var(--text-dim); cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; padding: 10px 15px; text-decoration: none; }
        
        .theme-selector { display: flex; gap: 8px; align-items: center; background: var(--surface); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--border); }
        .dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); transition: transform 0.2s; }
        .dot:hover { transform: scale(1.3); }

        /* --- SEARCH --- */
        .search-container { padding: 40px 5% 0; text-align: center; }
        #moduleSearch { width: 100%; max-width: 600px; padding: 18px 25px; border-radius: 15px; background: var(--surface); border: 1px solid var(--border); color: #fff; font-size: 1rem; text-align: center; transition: 0.3s; }
        #moduleSearch:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 20px rgba(0,255,136,0.1); }

        /* --- DEV PANEL --- */
        #devPanel { position: fixed; top: 0; left: -100%; width: 100%; max-width: 550px; height: 100vh; background: #07080a; border-right: 1px solid var(--border); z-index: 4000; transition: 0.5s; padding: 40px; overflow-y: auto; }
        #devPanel.active { left: 0; box-shadow: 50px 0 100px #000; }
        .dev-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 15px; margin-bottom: 15px; }
        .dev-input { width: 100%; background: #000; border: 1px solid #222; color: #fff; padding: 10px; border-radius: 5px; font-size: 0.8rem; margin-bottom: 10px; }
        
        /* --- GRID --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; padding: 40px 5%; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 20px; text-decoration: none; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.3s; text-align: center; color: white; }
        .card:hover { border-color: var(--primary); background: rgba(255,255,255,0.05); transform: translateY(-3px); }
        .card span { font-size: 0.85rem; font-weight: 800; }

        .modal { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 90%; max-width: 400px; padding: 40px; background: #0a0b0d; border-radius: 30px; text-align: center; border: 1px solid var(--border); }
        .auth-field { width: 100%; padding: 15px; margin-top: 12px; border-radius: 10px; border: 1px solid #222; background: #000; color: #fff; text-align: center; }
    </style>
</head>
<body class="theme-green">

    <div id="devPanel">
        <h2 style="color: var(--primary); font-weight: 800; margin-bottom: 20px;">SYSTEM OVERSEER</h2>
        <div class="dev-card">
            <p style="font-size: 0.6rem; font-weight: 800; color: var(--text-dim); margin-bottom: 10px;">ACTIVE FILTERS</p>
            <div id="filterList" style="font-family: 'Fira Code'; font-size: 0.7rem; color: var(--danger); margin-bottom: 15px;"></div>
            <input type="text" id="manualInput" class="dev-input" placeholder="IP or Device ID">
            <input type="text" id="manualReason" class="dev-input" placeholder="Ban Message">
            <button class="nav-link" style="width:100%; background:var(--danger); color:white; border-radius:5px;" onclick="manualAction('ip')">Apply Ban</button>
        </div>
        <div id="devUserList"></div>
        <button class="nav-link" onclick="toggleDev()" style="width:100%; border:1px solid var(--border); margin-top:20px; border-radius:8px;">Exit Terminal</button>
    </div>

    <div id="authOverlay" class="modal">
        <div class="auth-box">
            <h1 style="letter-spacing: 5px; color: var(--primary);">NEBULA</h1>
            <input type="text" id="userInput" class="auth-field" placeholder="CALLSIGN">
            <input type="password" id="passInput" class="auth-field" placeholder="ACCESS KEY">
            <button style="width:100%; padding:15px; margin-top:20px; border-radius:10px; border:none; background:var(--primary); font-weight:800; cursor:pointer;" onclick="processAuth()">INITIALIZE</button>
            <p style="margin-top: 20px; font-size: 0.7rem; color: var(--text-dim); cursor: pointer;" onclick="toggleAuthMode()" id="toggleTxt">NEW USER? REGISTER</p>
        </div>
    </div>

    <nav>
        <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:15px; height:15px; background:var(--primary); border-radius:3px;"></div>
            <h1 style="font-size:0.9rem; letter-spacing:3px;">NEBULA</h1>
        </div>

        <div class="theme-selector">
            <div class="dot" style="background:#ff4444" onclick="changeTheme('red')"></div>
            <div class="dot" style="background:#00d9ff" onclick="changeTheme('blue')"></div>
            <div class="dot" style="background:#ffcc00" onclick="changeTheme('yellow')"></div>
            <div class="dot" style="background:#00ff88" onclick="changeTheme('green')"></div>
            <div class="dot" style="background:#ff8800" onclick="changeTheme('orange')"></div>
            <div class="dot" style="background:#ff00bb" onclick="changeTheme('pink')"></div>
            <div class="dot" style="background:#94a3b8" onclick="changeTheme('grey')"></div>
        </div>

        <div>
            <span id="devTrigger" class="nav-link" onclick="toggleDev()" style="display:none; color: var(--warning);">[ CMD ]</span>
            <span id="navUser" style="margin-left:15px; font-weight:800; color:var(--primary); font-size: 0.8rem;">GUEST</span>
            <span class="nav-link" onclick="doLogout()">Logout</span>
        </div>
    </nav>

    <div class="search-container">
        <input type="text" id="moduleSearch" placeholder="Search for modules..." onkeyup="filterModules()">
    </div>

    <div id="gameGrid" class="grid"></div>

    <script>
        const _0xADMIN = "MTIzNDU2Nzgh"; 
        const MOCK_IP = "127.0.0.1";
        const DEVICE_ID = btoa(navigator.userAgent + screen.width).substring(0, 10);
        let isLoginMode = true;

        const gameList = [
            { name: "Cyber-Strike", url: "Cyber-Strike.html" }, { name: "Neon-Golf", url: "Neon-Golf.html" },
            { name: "Neon-Hex", url: "Neon-Hex.html" }, { name: "Neon-Pong", url: "Neon-Pong.html" },
            { name: "Neon-Slams", url: "Neon-Slams.html" }, { name: "Neon-Slash", url: "Neon-Slash.html" },
            { name: "Three.js", url: "Three.js" }, { name: "AI Run", url: "ai.html" },
            { name: "Basketball", url: "basketball.html" }, { name: "Blockblast", url: "blockblast.html" },
            { name: "Blockbreaker", url: "blockbreaker.html" }, { name: "Blockcraft", url: "blockcraft.html" },
            { name: "Cricket", url: "cricket.html" }, { name: "Crossy Roads", url: "crossyroads.html" },
            { name: "Drift", url: "drift.html" }, { name: "Eggshell", url: "eggshell.html" },
            { name: "Football", url: "football.html" }, { name: "Master Armory", url: "masterarmory.html" },
            { name: "Minesweeper", url: "minesweeper.html" }, { name: "Neon Trail", url: "neon-trail.html" },
            { name: "Overdrive", url: "overdrive.html" }, { name: "Pacman", url: "pacman.html" },
            { name: "Reader", url: "reader.html" }, { name: "Snake", url: "snake.html" },
            { name: "Space Adventure", url: "spaceadventure.html" }, { name: "Sparks Maths", url: "sparksmaths.html" },
            { name: "Sparks Logs", url: "sparxsmaths-log.html" }, { name: "Tic Tac Toe", url: "tictactoe.html" }
        ];

        // --- THEME CONTROL ---
        function changeTheme(color) {
            document.body.className = `theme-${color}`;
            localStorage.setItem('neb_theme', color);
        }

        function filterModules() {
            const query = document.getElementById('moduleSearch').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const name = card.querySelector('span').innerText.toLowerCase();
                card.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        function processAuth() {
            const u = document.getElementById('userInput').value.trim();
            const p = document.getElementById('passInput').value.trim();
            const ipB = JSON.parse(localStorage.getItem('neb_ipbans')) || {};
            const dvB = JSON.parse(localStorage.getItem('neb_devbans')) || {};
            const acB = JSON.parse(localStorage.getItem('neb_bans')) || {};

            if (u.toUpperCase() !== 'ADMIN') {
                if (validateBan(ipB[MOCK_IP])) return;
                if (validateBan(dvB[DEVICE_ID])) return;
                if (validateBan(acB[u.toLowerCase()])) return;
            }

            if(u.toUpperCase() === 'ADMIN' && p === atob(_0xADMIN)) {
                localStorage.setItem('neb_active', 'ADMIN'); location.reload(); return;
            }

            let db = JSON.parse(localStorage.getItem('neb_db')) || {};
            if(isLoginMode) {
                if(db[u] && db[u].pw === p) {
                    db[u].lastIP = MOCK_IP; db[u].lastDev = DEVICE_ID;
                    localStorage.setItem('neb_db', JSON.stringify(db));
                    localStorage.setItem('neb_active', u); location.reload();
                } else alert("ACCESS DENIED");
            } else {
                if(db[u]) return alert("EXISTS");
                db[u] = { pw: p, lastIP: MOCK_IP, lastDev: DEVICE_ID };
                localStorage.setItem('neb_db', JSON.stringify(db));
                localStorage.setItem('neb_active', u); location.reload();
            }
        }

        function validateBan(obj) {
            if (!obj) return false;
            alert(`RESTRICTED\nReason: ${obj.reason || "Policy Violation"}`);
            return true;
        }

        function toggleDev() { document.getElementById('devPanel').classList.toggle('active'); refreshDevList(); }
        function doLogout() { localStorage.removeItem('neb_active'); location.reload(); }
        function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('toggleTxt').innerText = isLoginMode ? "NEW USER? REGISTER" : "BACK TO LOGIN"; }

        function renderUI() {
            const u = localStorage.getItem('neb_active'); if(!u) return;
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('navUser').innerText = u.toUpperCase();
            if(u === 'ADMIN') document.getElementById('devTrigger').style.display = 'inline-block';
            
            // Apply saved theme
            const savedTheme = localStorage.getItem('neb_theme') || 'green';
            changeTheme(savedTheme);

            document.getElementById('gameGrid').innerHTML = gameList.map(g => `
                <a href="${g.url}" class="card">
                    <span>${g.name}</span>
                </a>`).join('');
        }

        if(localStorage.getItem('neb_active')) renderUI();
    </script>
</body>
</html>
