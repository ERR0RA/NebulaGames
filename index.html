<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Games | Core Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.4);
            --bg: #030303;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --updating: #ffcc00;
            --error: #ff3366;
            --info: #00d9ff;
        }

        [data-theme="cyber"] { --primary: #ff00ff; --primary-glow: rgba(255, 0, 255, 0.4); }
        [data-theme="ocean"] { --primary: #00d9ff; --primary-glow: rgba(0, 217, 255, 0.4); }
        [data-theme="amber"] { --primary: #ffaa00; --primary-glow: rgba(255, 170, 0, 0.4); }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Matrix Background */
        #canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        /* Scanline CRT Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 9999;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        header { text-align: center; padding: 60px 20px 30px; }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 900; margin: 0;
            letter-spacing: 12px;
            background: linear-gradient(to bottom, #fff 30%, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px var(--primary-glow));
            transition: 0.5s;
        }

        .subtitle { color: var(--primary); opacity: 0.8; margin-top: 10px; font-size: 0.75rem; letter-spacing: 5px; text-transform: uppercase; font-family: 'Orbitron'; }

        .status-panel {
            width: 90%; max-width: 1100px;
            background: rgba(10, 10, 10, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 12px; padding: 25px;
            margin-bottom: 30px; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px;
            backdrop-filter: blur(10px); box-sizing: border-box;
        }

        .status-item { display: flex; flex-direction: column; gap: 5px; border-left: 1px solid var(--card-border); padding-left: 15px; }
        .status-label { font-family: 'Orbitron'; font-size: 0.55rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 2px; }
        .status-value { font-family: 'Orbitron'; font-size: 1rem; font-weight: 700; text-shadow: 0 0 8px currentColor; }
        
        .theme-grid { display: flex; gap: 8px; margin-top: 5px; }
        .theme-btn { width: 18px; height: 18px; border-radius: 3px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }

        .search-container { width: 90%; max-width: 1100px; margin-bottom: 25px; }
        #moduleSearch {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--card-border);
            padding: 15px 20px; border-radius: 8px; color: #fff; font-family: 'Orbitron';
            outline: none; transition: 0.3s; box-sizing: border-box;
        }
        #moduleSearch:focus { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }

        .link-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px; width: 90%; max-width: 1100px; margin-bottom: 50px;
        }

        .game-link {
            position: relative; background: var(--card-bg);
            text-decoration: none; height: 90px;
            border-radius: 10px; border: 1px solid var(--card-border);
            transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }

        .game-link:hover:not(.is-down) {
            border-color: var(--primary);
            transform: scale(1.02);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .game-title { font-family: 'Orbitron'; font-weight: 700; font-size: 0.85rem; color: #fff; }
        .badge { position: absolute; top: 0; right: 0; font-size: 0.55rem; padding: 4px 10px; font-weight: 900; border-bottom-left-radius: 8px; font-family: 'Orbitron'; }
        .best { background: var(--primary); color: #000; }
        .upd { background: var(--updating); color: #000; }

        footer { padding: 50px; text-align: center; color: rgba(255,255,255,0.2); font-size: 0.65rem; font-family: 'Orbitron'; letter-spacing: 3px; }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <header>
        <h1 id="main-title">Nebula Games</h1>
        <div class="subtitle">Grid Operator: DC</div>
    </header>

    <div class="status-panel">
        <div class="status-item" style="border:none">
            <span class="status-label">System Clock</span>
            <span id="system-clock" class="status-value online">00:00:00</span>
        </div>
        <div class="status-item">
            <span class="status-label">Visual Theme</span>
            <div class="theme-grid">
                <div class="theme-btn" style="background:#00ff88" onclick="setTheme('default')"></div>
                <div class="theme-btn" style="background:#ff00ff" onclick="setTheme('cyber')"></div>
                <div class="theme-btn" style="background:#00d9ff" onclick="setTheme('ocean')"></div>
                <div class="theme-btn" style="background:#ffaa00" onclick="setTheme('amber')"></div>
            </div>
        </div>
        <div class="status-item">
            <span class="status-label">Grid Load</span>
            <span id="traffic-value" class="status-value" style="color:var(--info)">STABLE</span>
        </div>
        <div class="status-item">
            <span class="status-label">Modules Live</span>
            <span id="active-count" class="status-value online">--</span>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="moduleSearch" placeholder="ACCESS MODULE DATABASE..." onkeyup="filterGames()">
    </div>

    <div id="stable-container" class="link-container"></div>

    <script>
        const games = [
            { name: "Neon Cyber Strike", url: "Cyber-Strike.html", tag: "best" },
            { name: "Blockcraft", url: "blockcraft.html", tag: "upd" },
            { name: "Minesweeper", url: "minesweeper.html", tag: "best" },
            { name: "Neon Snake", url: "snake.html", tag: "best" },
            { name: "Master Armory", url: "masterarmory.html", tag: "best" },
            { name: "Neon Pong", url: "Neon-Pong.html", tag: "best" },
            { name: "Neon Slash", url: "Neon-Slash.html", tag: "" },
            { name: "Block Breaker", url: "blockbreaker.html", tag: "" },
            { name: "Neon Golf", url: "Neon-Golf.html", tag: "" },
            { name: "Neon Slamz", url: "Neon-Slams.html", tag: "" },
            { name: "Neon Trail", url: "neon-trail.html", tag: "" },
            { name: "Block Blast", url: "blockblast.html", tag: "" },
            { name: "Neon Run", url: "ai.html", tag: "" },
            { name: "Basketball", url: "basketball.html", tag: "" },
            { name: "Football", url: "football.html", tag: "" },
            { name: "Cricket", url: "cricket.html", tag: "" },
            { name: "Crossy Roads", url: "crossyroads.html", tag: "" },
            { name: "Drift", url: "drift.html", tag: "" },
            { name: "Eggshell (EGGVP)", url: "eggshell.html", tag: "upd" },
            { name: "Overdrive", url: "overdrive.html", tag: "" },
            { name: "Pacman", url: "pacman.html", tag: "" },
            { name: "Space Adventure", url: "spaceadventure.html", tag: "" },
            { name: "Tic Tac Toe", url: "tictactoe.html", tag: "" },
            { name: "Turbo Horizon", url: "turbohorizon.html", tag: "" },
            { name: "Sparx Reader", url: "reader.html", tag: "" },
            { name: "Neon Hex", url: "Neon-Hex.html", tag: "" }
        ];

        // Theme & Matrix Logic
        let matrixColor = '#00ff88';
        function setTheme(theme) {
            const root = document.documentElement;
            if(theme === 'default') {
                root.removeAttribute('data-theme');
                matrixColor = '#00ff88';
            } else {
                root.setAttribute('data-theme', theme);
                matrixColor = theme === 'cyber' ? '#ff00ff' : theme === 'ocean' ? '#00d9ff' : '#ffaa00';
            }
        }

        // Clock logic
        setInterval(() => {
            const now = new Date();
            document.getElementById('system-clock').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        // Matrix Effect
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%";
        const fontSize = 10;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = matrixColor;
            ctx.font = fontSize + "px Orbitron";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Build Arcade
        function buildArcade() {
            const container = document.getElementById('stable-container');
            container.innerHTML = games.map(game => `
                <a href="${game.url}" class="game-link" data-name="${game.name.toLowerCase()}">
                    ${game.tag ? `<span class="badge ${game.tag}">${game.tag.toUpperCase()}</span>` : ''}
                    <span class="game-title">${game.name}</span>
                </a>
            `).join('');
            document.getElementById('active-count').innerText = games.length;
        }

        function filterGames() {
            const input = document.getElementById('moduleSearch').value.toLowerCase();
            document.querySelectorAll('.game-link').forEach(link => {
                link.style.display = link.dataset.name.includes(input) ? "flex" : "none";
            });
        }

        buildArcade();
    </script>
</body>
</html>
