<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula | Ultimate Cloud Gaming Hub<</title>
  <style>
    :root {
      --bg: #020305;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #00ff66;
      --secondary: #00f0ff;
      --text: #ffffff;
      --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    [data-theme="cyber"] {
      --primary: #ff0055;
      --secondary: #ffcc00;
    }

    [data-theme="abyss"] {
      --primary: #7000ff;
      --secondary: #00d4ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    #splashOverlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .splash-title {
      font-size: 3rem;
      letter-spacing: 5px;
      color: var(--primary);
      text-shadow: 0 0 20px var(--primary);
    }

    #mainAppContent {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 20px;
    }

    .brand h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button, select, input {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      outline: none;
      backdrop-filter: blur(10px);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    button:hover, select:hover, input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
    }

    .search-bar {
      width: 100%;
      margin-bottom: 30px;
    }

    .search-bar input {
      width: 100%;
      font-size: 1.1rem;
    }

    #gameGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }

    .game-link {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 30px 20px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      backdrop-filter: blur(8px);
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out, border-color 0.2s;
    }

    .game-link:hover {
      border-color: var(--primary);
    }

    .game-title {
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      pointer-events: none;
    }

    .tag-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--primary);
      color: #000;
      font-weight: bold;
      pointer-events: none;
    }

    .leaderboard-section {
      margin-top: 40px;
    }

    .leaderboard-section h2 {
      margin-bottom: 20px;
      color: var(--secondary);
    }

    .leaderboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .leaderboard-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(8px);
    }

    .leaderboard-box h4 {
      margin-bottom: 15px;
      color: var(--primary);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .leaderboard-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .rank-num {
      color: var(--secondary);
      margin-right: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body data-bg="void">

  <canvas id="bgCanvas"></canvas>

  <div id="splashOverlay">
    <div class="splash-title">NEBULA</div>
  </div>

  <div id="mainAppContent">
    <header>
      <div class="brand">
        <h1>NEBULA HUB</h1>
      </div>
      <div class="controls">
        <select onchange="setBg(this.value)">
          <option value="void" selected>Void Engine</option>
          <option value="matrix">Matrix</option>
          <option value="aurora">Aurora</option>
          <option value="supernova">Supernova</option>
        </select>
        <select onchange="setTheme(this.value)">
          <option value="neon">Neon Theme</option>
          <option value="cyber">Cyber Theme</option>
          <option value="abyss">Abyss Theme</option>
        </select>
      </div>
    </header>

    <div class="search-bar">
      <input type="text" id="moduleSearch" placeholder="Search modules..." aria-label="Search modules">
    </div>

    <div id="gameGrid"></div>

    <div class="leaderboard-section">
      <h2>Global Records</h2>
      <div class="leaderboard-grid"></div>
    </div>
  </div>

  <script>
    // --- DATA STRUCTURES ---
    const games = [
      { id: "minesweeper", name: "Minesweeper", url: "minesweeper.html", tag: "best" },
      { id: "snake", name: "Neon Snake", url: "snake.html", tag: "Ultimate" },
      { id: "pong", name: "Neon Pong", url: "Neon-Pong.html", tag: "best" },
      { id: "slash", name: "Neon Slash", url: "Neon-Slash.html", tag: "" },
      { id: "elemental", name: "Elemental", url: "elemental.html", tag: "" },
      { id: "king", name: "Neon King", url: "Neon-King.html", tag: "" },
      { id: "blockbreaker", name: "Block Breaker", url: "blockbreaker.html", tag: "" },
      { id: "golf", name: "Neon Golf", url: "Neon-Golf.html", tag: "" },
      { id: "slamz", name: "Neon Slamz", url: "Neon-Slams.html", tag: "" },
      { id: "trail", name: "Neon Trail", url: "neon-trail.html", tag: "Ultimate" },
      { id: "run", name: "Neon Run", url: "ai.html", tag: "" },
      { id: "tictactoe", name: "Tic Tac Toe", url: "tictactoe.html", tag: "" },
      { id: "hex", name: "Neon Hex", url: "Neon-Hex.html", tag: "" },
      { id: "shadow", name: "Shadow Shift", url: "Shadow.html", tag: "" }
    ];

    const leaderboardsData = {
      "BLOCK BREAKER": [
        { rank: "01", name: "Ayden K", score: 5235 },
        { rank: "02", name: "—", score: 0 },
        { rank: "03", name: "—", score: 0 }
      ],
      "NEON SLASH": [
        { rank: "01", name: "—", score: 0 },
        { rank: "02", name: "—", score: 0 },
        { rank: "03", name: "—", score: 0 }
      ],
      "NEON HEX": [
        { rank: "01", name: "—", score: 0 },
        { rank: "02", name: "—", score: 0 },
        { rank: "03", name: "—", score: 0 }
      ]
    };

    // --- GLOBAL STATE & UTILITIES ---
    const mousePos = { x: -1000, y: -1000 };

    window.addEventListener('mousemove', (e) => {
      mousePos.x = e.clientX;
      mousePos.y = e.clientY;
    });

    function setBg(type) {
      document.body.setAttribute('data-bg', type);
      localStorage.setItem('nebula-bg', type);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('nebula-theme', theme);
    }

    const FavoritesManager = {
      get: () => JSON.parse(localStorage.getItem('nebula_favorites') || '[]'),
      toggle: (id) => {
        const favs = FavoritesManager.get();
        const index = favs.indexOf(id);
        if (index > -1) favs.splice(index, 1);
        else favs.push(id);
        localStorage.setItem('nebula_favorites', JSON.stringify(favs));
      }
    };

    // --- RENDER FUNCTIONS ---
    function renderGames(list) {
      const container = document.getElementById('gameGrid');
      if (!container) return;
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; opacity: 0.6; padding: 40px;">No modules matching your query.</div>`;
        return;
      }

      const favs = FavoritesManager.get();
      const sortedList = [...list].sort((a, b) => favs.includes(b.id) - favs.includes(a.id));

      const fragment = document.createDocumentFragment();
      sortedList.forEach(game => {
        const isFav = favs.includes(game.id);
        const card = document.createElement('a');
        card.className = 'game-link';
        card.href = game.url;
        card.dataset.id = game.id;
        card.innerHTML = `
          <button class="fav-star" aria-label="Favorite ${game.name}" style="position:absolute; top:10px; left:10px; background:none; border:none; color:${isFav ? '#ffcc00' : 'rgba(255,255,255,0.2)'}; cursor:pointer; font-size:16px; z-index:2;">★</button>
          ${game.tag ? `<div class="tag-badge">${game.tag}</div>` : ''}
          <div class="game-title">${game.name}</div>
        `;
        fragment.appendChild(card);
      });
      container.appendChild(fragment);
    }

    function renderLeaderboards() {
      const grid = document.querySelector('.leaderboard-grid');
      if (!grid) return;
      grid.innerHTML = '';

      Object.entries(leaderboardsData).forEach(([title, rows]) => {
        const box = document.createElement('div');
        box.className = 'leaderboard-box';
        box.innerHTML = `
          <h4>${title}</h4>
          ${rows.map(row => `
            <div class="leaderboard-row">
              <div><span class="rank-num">${row.rank}</span><span class="player-name">${row.name}</span></div>
              <span class="player-score">${row.score}</span>
            </div>
          `).join('')}
        `;
        grid.appendChild(box);
      });
    }

    // --- DEBOUNCED SEARCH ---
    function debounce(fn, wait = 150) {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn.apply(this, args), wait);
      };
    }

    const filterGames = debounce(() => {
      const searchInput = document.getElementById('moduleSearch');
      if (!searchInput) return;
      const term = searchInput.value.trim().toLowerCase();
      const filtered = games.filter(g => g.name.toLowerCase().includes(term));
      renderGames(filtered);
    }, 150);

    // --- EVENT DELEGATION FOR GAME GRID ---
    const gameGrid = document.getElementById('gameGrid');
    let cachedRect = null;

    if (gameGrid) {
      gameGrid.addEventListener('click', (e) => {
        if (e.target.classList.contains('fav-star')) {
          e.preventDefault();
          const card = e.target.closest('.game-link');
          const id = card.dataset.id;
          FavoritesManager.toggle(id);
          filterGames();
        }
      });

      gameGrid.addEventListener('pointerenter', (e) => {
        const card = e.target.closest('.game-link');
        if (card) cachedRect = card.getBoundingClientRect();
      }, true);

      gameGrid.addEventListener('mousemove', (e) => {
        const card = e.target.closest('.game-link');
        if (!card || !cachedRect) return;

        const x = e.clientX - cachedRect.left;
        const y = e.clientY - cachedRect.top;
        card.style.setProperty('--x', `${x}px`);
        card.style.setProperty('--y', `${y}px`);

        const centerX = cachedRect.width / 2;
        const centerY = cachedRect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -10;
        const rotateY = ((x - centerX) / centerX) * 10;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(8px)`;
      });

      gameGrid.addEventListener('mouseleave', (e) => {
        const card = e.target.closest('.game-link');
        if (card) {
          card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
          cachedRect = null;
        }
      }, true);
    }

    // --- CANVAS ENGINE STATE & VOID BLACKHOLE GAME ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas ? canvas.getContext('2d') : null;
    let width, height, columns, drops;
    let auroraWaves = [], novaAngle = 0;
    let animationFrameId = null;

    const voidState = {
      blackHole: { x: 0, y: 0, radius: 35, targetRadius: 35, mass: 0, maxRadius: 180, pulse: 0 },
      orbs: [],
      maxOrbs: 120,
      spawnTimer: 0
    };

    function createVoidOrb(w, h) {
      const edge = Math.floor(Math.random() * 4);
      let x, y;

      if (edge === 0) { x = Math.random() * w; y = -20; }
      else if (edge === 1) { x = w + 20; y = Math.random() * h; }
      else if (edge === 2) { x = Math.random() * w; y = h + 20; }
      else { x = -20; y = Math.random() * h; }

      return {
        x, y,
        size: Math.random() * 3 + 1.5,
        vx: (Math.random() - 0.5) * 0.8,
        vy: (Math.random() - 0.5) * 0.8,
        alpha: Math.random() * 0.5 + 0.3
      };
    }

    function resize() {
      if (!canvas) return;
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / 20) + 1;
      drops = Array(columns).fill(1);

      auroraWaves = [
        { yBase: height * 0.25, amplitude: 60, speed: 0.008, phase: 0, length: 0.002, color: '#00ffcc' },
        { yBase: height * 0.45, amplitude: 85, speed: 0.005, phase: 1.5, length: 0.0012, color: '#00ff66' },
        { yBase: height * 0.60, amplitude: 70, speed: 0.007, phase: 3.0, length: 0.0015, color: '#ff00ff' },
        { yBase: height * 0.75, amplitude: 90, speed: 0.004, phase: 4.5, length: 0.001, color: '#9900ff' }
      ];
    }

    function draw() {
      if (!ctx || document.visibilityState === 'hidden') return;

      const mode = document.body.getAttribute('data-bg');
      if (mode !== 'matrix') ctx.clearRect(0, 0, width, height);

      const style = getComputedStyle(document.documentElement);
      const primaryColor = style.getPropertyValue('--primary').trim() || '#00ff66';
      const secondaryColor = style.getPropertyValue('--secondary').trim() || '#00f0ff';

      if (mode === 'matrix') {
        ctx.fillStyle = 'rgba(2, 3, 5, 0.08)';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = primaryColor;
        ctx.shadowColor = primaryColor;
        ctx.shadowBlur = 12;
        ctx.font = '700 14px monospace';
        drops.forEach((y, i) => {
          ctx.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), i * 20, y * 20);
          if (y * 20 > height && Math.random() > 0.98) drops[i] = 0;
          drops[i]++;
        });
      } 
      else if (mode === 'void') {
        const bh = voidState.blackHole;
        bh.x = width / 2;
        bh.y = height / 2;

        ctx.fillStyle = '#010204';
        ctx.fillRect(0, 0, width, height);

        voidState.spawnTimer++;
        if (voidState.spawnTimer % 6 === 0 && voidState.orbs.length < voidState.maxOrbs) {
          voidState.orbs.push(createVoidOrb(width, height));
        }

        for (let i = voidState.orbs.length - 1; i >= 0; i--) {
          const p = voidState.orbs[i];
          let dx = bh.x - p.x;
          let dy = bh.y - p.y;
          let dist = Math.hypot(dx, dy);

          let gravityForce = Math.min(12, (bh.radius * 2.5) / Math.max(dist, 10));
          let angle = Math.atan2(dy, dx);

          p.vx += Math.cos(angle) * gravityForce * 0.08;
          p.vy += Math.sin(angle) * gravityForce * 0.08;

          let mDx = mousePos.x - p.x;
          let mDy = mousePos.y - p.y;
          let mDist = Math.hypot(mDx, mDy);
          if (mDist < 120) {
            let mAngle = Math.atan2(mDy, mDx);
            p.vx -= Math.cos(mAngle) * 0.4;
            p.vy -= Math.sin(mAngle) * 0.4;
          }

          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.96;
          p.vy *= 0.96;

          if (dist < bh.radius) {
            bh.targetRadius = Math.min(bh.maxRadius, bh.targetRadius + 0.45);
            bh.mass += 1;
            voidState.orbs.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = primaryColor;
          ctx.globalAlpha = p.alpha;
          ctx.shadowColor = primaryColor;
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.restore();
        }

        bh.radius += (bh.targetRadius - bh.radius) * 0.05;
        bh.pulse += 0.03;
        const currentPulse = Math.sin(bh.pulse) * 3;

        ctx.save();
        ctx.beginPath();
        ctx.arc(bh.x, bh.y, bh.radius + 12 + currentPulse, 0, Math.PI * 2);
        ctx.fillStyle = secondaryColor;
        ctx.globalAlpha = 0.15;
        ctx.shadowColor = secondaryColor;
        ctx.shadowBlur = 30;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(bh.x, bh.y, bh.radius + 4, 0, Math.PI * 2);
        ctx.strokeStyle = primaryColor;
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.8;
        ctx.shadowColor = primaryColor;
        ctx.shadowBlur = 20;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(bh.x, bh.y, bh.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#000000';
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;
        ctx.fill();
        ctx.restore();
      }
      else if (mode === 'supernova') {
        novaAngle += 0.005;
        ctx.fillStyle = '#010204';
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.translate(width / 2, height / 2);
        ctx.rotate(novaAngle);

        for (let i = 1; i <= 6; i++) {
          ctx.beginPath();
          ctx.arc(0, 0, i * (Math.min(width, height) / 10.8), 0, Math.PI * 2);
          ctx.strokeStyle = i % 2 === 0 ? primaryColor : secondaryColor;
          ctx.lineWidth = 1.5; ctx.globalAlpha = 0.4;
          ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 20;
          ctx.stroke();
        }
        ctx.restore();
      }
      else if (mode === 'aurora') {
        ctx.fillStyle = '#020305';
        ctx.fillRect(0, 0, width, height);
        auroraWaves.forEach((wave) => {
          wave.phase += wave.speed;
          ctx.save();
          ctx.globalCompositeOperation = 'screen';
          let gradient = ctx.createLinearGradient(0, wave.yBase - 150, 0, wave.yBase + 250);
          gradient.addColorStop(0, 'transparent');
          gradient.addColorStop(0.4, wave.color);
          gradient.addColorStop(1, 'transparent');
          ctx.fillStyle = gradient; ctx.globalAlpha = 0.55;

          ctx.beginPath();
          ctx.moveTo(0, height);
          for (let x = 0; x <= width; x += 15) {
            let y = wave.yBase + Math.sin(x * wave.length + wave.phase) * wave.amplitude;
            ctx.lineTo(x, y);
          }
          ctx.lineTo(width, height);
          ctx.fill();
          ctx.restore();
        });
      }

      animationFrameId = requestAnimationFrame(draw);
    }

    // FREEZE ANIMATION ON INACTIVE TAB
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        cancelAnimationFrame(animationFrameId);
      } else {
        animationFrameId = requestAnimationFrame(draw);
      }
    });

    // INITIALIZATION
    window.addEventListener('resize', resize);
    window.addEventListener('DOMContentLoaded', () => {
      resize();
      renderGames(games);
      renderLeaderboards();

      const searchInput = document.getElementById('moduleSearch');
      if (searchInput) searchInput.addEventListener('input', filterGames);

      setBg(localStorage.getItem('nebula-bg') || 'void');
      if (localStorage.getItem('nebula-theme')) setTheme(localStorage.getItem('nebula-theme'));

      animationFrameId = requestAnimationFrame(draw);

      const splash = document.getElementById('splashOverlay');
      const mainApp = document.getElementById('mainAppContent');
      if (splash && mainApp) {
        setTimeout(() => {
          splash.style.opacity = '0';
          splash.style.visibility = 'hidden';
          mainApp.style.opacity = '1';
        }, 1000);
      }
    });
  </script>
</body>
</html>
