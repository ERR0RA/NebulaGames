<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA | Unified Gaming OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.15);
            --bg: #030406;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.07);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --easing: cubic-bezier(0.16, 1, 0.3, 1);
        }

        [data-theme="cyber"] { --primary: #ff00ff; --primary-glow: rgba(255, 0, 255, 0.15); }
        [data-theme="ocean"] { --primary: #00d9ff; --primary-glow: rgba(0, 217, 255, 0.15); }
        [data-theme="amber"] { --primary: #ffaa00; --primary-glow: rgba(255, 170, 0, 0.15); }
        [data-theme="crimson"] { --primary: #ff4d4d; --primary-glow: rgba(255, 77, 77, 0.15); }
        [data-theme="amethyst"] { --primary: #a855f7; --primary-glow: rgba(168, 85, 247, 0.15); }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            /* Animated Ambient Background */
            background-image: 
                radial-gradient(circle at 50% -20%, var(--primary-glow), transparent 70%),
                radial-gradient(circle at 0% 100%, rgba(0,0,0,1) 0%, transparent 50%);
        }

        /* --- NAVIGATION --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; position: sticky; top: 0; z-index: 1000;
            background: rgba(3, 4, 6, 0.6); backdrop-filter: blur(30px) saturate(150%);
            border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 15px; }
        .logo-sq { 
            width: 32px; height: 32px; background: var(--primary); 
            border-radius: 8px; box-shadow: 0 0 25px var(--primary-glow);
            transform: rotate(-10deg); transition: 0.5s var(--easing);
        }
        .brand:hover .logo-sq { transform: rotate(0deg) scale(1.1); }
        .brand h1 { font-size: 1.1rem; letter-spacing: 5px; font-weight: 800; text-shadow: 0 0 20px var(--primary-glow); }
        
        .user-controls { display: flex; align-items: center; gap: 25px; }
        .nav-link { 
            font-size: 0.65rem; color: var(--text-dim); cursor: pointer; 
            text-transform: uppercase; letter-spacing: 2px; font-weight: 800;
            transition: 0.3s; padding: 8px 12px; border-radius: 6px;
        }
        .nav-link:hover { color: var(--primary); background: var(--surface); }

        /* --- SUPPORT PANEL --- */
        #supportPanel {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 600px; height: 100vh;
            background: rgba(10, 11, 13, 0.95); backdrop-filter: blur(40px);
            border-left: 1px solid var(--border);
            z-index: 3000; transition: 0.7s var(--easing); padding: 40px;
        }
        #supportPanel.active { right: 0; box-shadow: -50px 0 100px rgba(0,0,0,0.8); }

        /* --- SEARCH --- */
        header { padding: 100px 5% 50px; max-width: 1400px; margin: 0 auto; text-align: center; }
        header h2 { font-size: 4.5rem; font-weight: 800; letter-spacing: -3px; line-height: 0.9; margin-bottom: 30px; }
        .search-container { position: relative; max-width: 600px; margin: 0 auto; }
        #gameSearch {
            width: 100%; padding: 22px 30px; border-radius: 100px;
            background: var(--surface); border: 1px solid var(--border);
            color: #fff; font-size: 1.1rem; transition: 0.4s var(--easing);
            text-align: center;
        }
        #gameSearch:focus { border-color: var(--primary); background: rgba(255,255,255,0.06); outline: none; box-shadow: 0 0 40px rgba(0,0,0,0.5); }

        /* --- GRID & CARDS --- */
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px; padding: 20px 5% 150px; max-width: 1400px; margin: 0 auto;
        }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 30px; padding: 40px; text-decoration: none;
            display: flex; flex-direction: column; justify-content: flex-end;
            min-height: 220px; transition: 0.5s var(--easing);
            position: relative; overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            opacity: 0; transition: 0.5s;
        }
        .card:hover { transform: translateY(-12px) scale(1.02); border-color: var(--primary); background: var(--surface-hover); }
        .card:hover::before { opacity: 1; }
        
        .card-title { font-size: 1.5rem; font-weight: 800; display: block; margin-bottom: 12px; letter-spacing: -1px; }
        .card-meta { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }

        /* --- AUTH SYSTEM --- */
        .modal { position: fixed; inset: 0; background: radial-gradient(circle at center, #0a0b0d, #000); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 90%; max-width: 420px; padding: 50px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 40px; text-align: center; backdrop-filter: blur(20px); }
        .auth-field { width: 100%; padding: 18px; margin-top: 15px; border-radius: 15px; border: 1px solid #222; background: #000; color: #fff; text-align: center; font-weight: 600; }
        .auth-btn { width: 100%; padding: 18px; margin-top: 30px; border-radius: 15px; border: none; background: var(--primary); color: #000; font-weight: 800; letter-spacing: 2px; transition: 0.4s; }
        .auth-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px var(--primary-glow); }

        /* --- THEME DOCK --- */
        .dock {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 11, 13, 0.7); backdrop-filter: blur(25px);
            padding: 15px 30px; border-radius: 100px; border: 1px solid var(--border);
            display: flex; gap: 20px; z-index: 1000; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .node { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: 0.3s var(--easing); }
        .node:hover { transform: scale(1.4) translateY(-5px); }
        .node.active { border-color: #fff; box-shadow: 0 0 20px var(--primary); }
    </style>
</head>
<body>

    <div id="authOverlay" class="modal">
        <div class="auth-box">
            <div class="logo-sq" style="margin: 0 auto 20px; transform: rotate(0);"></div>
            <h2 id="authTitle" style="letter-spacing: 5px;">NEBULA OS</h2>
            <input type="text" id="userInput" class="auth-field" placeholder="CALLSIGN">
            <input type="password" id="passInput" class="auth-field" placeholder="PASSWORD">
            <button class="auth-btn" onclick="processAuth()" id="mainAuthBtn">INITIALIZE</button>
            <p style="margin-top: 25px; font-size: 0.7rem; color: var(--text-dim); cursor: pointer; letter-spacing: 1px;" onclick="toggleMode()" id="toggleTxt">NEW USER? CREATE ACCOUNT</p>
        </div>
    </div>

    <div id="supportPanel">
        <div class="nav-link" onclick="toggleSupport()" style="margin-bottom: 30px; display: inline-block;">← CLOSE TERMINAL</div>
        <h2 style="font-size: 2.5rem; margin-bottom: 30px; font-weight: 800; letter-spacing: -2px;">SYSTEM SUPPORT</h2>
        <iframe width="100%" height="80%" src="https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAN__4XhIPhUOE9XTUQ5QVIxT05ZVEZONUhXREZTVjgxRC4u&embed=true" frameborder="0" style="border: none; border-radius: 24px; background: #fff;"></iframe>
    </div>

    <nav>
        <div class="brand"><div class="logo-sq"></div><h1>NEBULA</h1></div>
        <div class="user-controls">
            <span class="nav-link" onclick="toggleSupport()">Support</span>
            <span id="navUser" style="font-weight: 800; font-size: 0.75rem; color: var(--primary); letter-spacing: 2px;">GUEST</span>
            <span class="nav-link" onclick="doLogout()">[ Terminate ]</span>
        </div>
    </nav>

    <header>
        <h2 id="welcomeTxt">Welcome</h2>
        <div class="search-container">
            <input type="text" id="gameSearch" placeholder="Filter Neural Modules..." onkeyup="doSearch()">
        </div>
    </header>

    <div id="gameGrid" class="grid"></div>

    <div class="dock">
        <div class="node active" style="background:#00ff88" onclick="updateTheme('default', this)"></div>
        <div class="node" style="background:#ff00ff" onclick="updateTheme('cyber', this)"></div>
        <div class="node" style="background:#00d9ff" onclick="updateTheme('ocean', this)"></div>
        <div class="node" style="background:#ffaa00" onclick="updateTheme('amber', this)"></div>
        <div class="node" style="background:#ff4d4d" onclick="updateTheme('crimson', this)"></div>
        <div class="node" style="background:#a855f7" onclick="updateTheme('amethyst', this)"></div>
    </div>

    <script>
        let isLogin = true;
        const gameList = [
            { name: "Eggshell", cat: "Shooter", url: "eggshell.html" },
            { name: "Cyber-Strike", cat: "Action", url: "Cyber-Strike.html" },
            { name: "Neon-Golf", cat: "Sports", url: "Neon-Golf.html" },
            { name: "Neon-Hex", cat: "Strategy", url: "Neon-Hex.html" },
            { name: "Neon-Pong", cat: "Arcade", url: "Neon-Pong.html" },
            { name: "Neon-Slams", cat: "Sports", url: "Neon-Slams.html" },
            { name: "Neon-Slash", cat: "Action", url: "Neon-Slash.html" },
            { name: "AI run", cat: "System", url: "ai.html" },
            { name: "Basketball", cat: "Sports", url: "basketball.html" },
            { name: "Blockblast", cat: "Puzzle", url: "blockblast.html" },
            { name: "Blockbreaker", cat: "Arcade", url: "blockbreaker.html" },
            { name: "Blockcraft", cat: "Creative", url: "blockcraft.html" },
            { name: "Cricket", cat: "Sports", url: "cricket.html" },
            { name: "Crossy Roads", cat: "Arcade", url: "crossyroads.html" },
            { name: "Drift", cat: "Racing", url: "drift.html" },
            { name: "Football", cat: "Sports", url: "football.html" },
            { name: "Master Armory", cat: "Shooter", url: "masterarmory.html" },
            { name: "Minesweeper", cat: "Puzzle", url: "minesweeper.html" },
            { name: "Neon Trail", cat: "Adventure", url: "neon-trail.html" },
            { name: "Overdrive", cat: "Racing", url: "overdrive.html" },
            { name: "Pacman", cat: "Arcade", url: "pacman.html" },
            { name: "Snake", cat: "Arcade", url: "snake.html" },
            { name: "Space Adventure", cat: "Sci-Fi", url: "spaceadventure.html" },
            { name: "Sparks Maths", cat: "Edu", url: "sparksmaths.html" },
            { name: "Tic Tac Toe", cat: "Board", url: "tictactoe.html" },
            { name: "Turbo Horizon", cat: "Racing", url: "turbohorizon.html" }
        ];

        function toggleSupport() { document.getElementById('supportPanel').classList.toggle('active'); }
        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('authTitle').innerText = isLogin ? "NEBULA OS" : "NEW SESSION";
            document.getElementById('mainAuthBtn').innerText = isLogin ? "INITIALIZE" : "REGISTER";
        }

        function processAuth() {
            const u = document.getElementById('userInput').value.trim();
            const p = document.getElementById('passInput').value.trim();
            if(!u || !p) return;
            let db = JSON.parse(localStorage.getItem('neb_db')) || {};
            if(isLogin) {
                if(db[u] && db[u].pw === p) { localStorage.setItem('neb_active', u); location.reload(); }
                else { alert("ERROR: INVALID CREDENTIALS"); }
            } else {
                if(db[u]) return alert("ERROR: CALLSIGN TAKEN");
                db[u] = { pw: p, scores: {} };
                localStorage.setItem('neb_db', JSON.stringify(db));
                localStorage.setItem('neb_active', u);
                location.reload();
            }
        }

        function doLogout() { localStorage.removeItem('neb_active'); location.reload(); }

        function renderUI() {
            const user = localStorage.getItem('neb_active');
            if(!user) return;
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('navUser').innerText = user.toUpperCase();
            document.getElementById('welcomeTxt').innerText = `Welcome, ${user}`;
            const db = JSON.parse(localStorage.getItem('neb_db'));
            const scores = db[user].scores || {};
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = gameList.map(g => {
                const s = scores[g.name] || 0;
                return `
                    <a href="${g.url}" target="_blank" class="card" data-name="${g.name.toLowerCase()}">
                        <div style="position:relative; z-index:2;">
                            <span class="card-title">${g.name}</span>
                            <div class="card-meta">
                                <span style="font-size:0.65rem; color:var(--text-dim); font-weight:800; letter-spacing:1px;">${g.cat.toUpperCase()}</span>
                                <span style="font-family:'Fira Code'; color:var(--primary); font-size:0.8rem;">${s} PTS</span>
                            </div>
                        </div>
                    </a>`;
            }).join('');
        }

        function updateTheme(t, el) {
            document.documentElement.setAttribute('data-theme', t);
            if(t === 'default') document.documentElement.removeAttribute('data-theme');
            document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }

        function doSearch() {
            const q = document.getElementById('gameSearch').value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => {
                c.style.display = (c.dataset.name.includes(q)) ? 'flex' : 'none';
            });
        }

        if(localStorage.getItem('neb_active')) renderUI();
    </script>
</body>
</html>
