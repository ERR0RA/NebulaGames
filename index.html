<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA | Quantum Arcade</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #00ff88;
            --primary-rgb: 0, 255, 136;
            --bg: #020305;
            --glass: rgba(15, 18, 24, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --radius: 24px;
        }

        /* Theme Variants */
        body.theme-green { --primary: #00ff88; --primary-rgb: 0, 255, 136; }
        body.theme-cyan { --primary: #00f2ff; --primary-rgb: 0, 242, 255; }
        body.theme-purple { --primary: #bf00ff; --primary-rgb: 191, 0, 255; }
        body.theme-gold { --primary: #ffcc00; --primary-rgb: 255, 204, 0; }
        body.theme-red { --primary: #ff3333; --primary-rgb: 255, 51, 51; }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            transition: 0.3s ease;
        }

        /* Animated Background */
        .nebula-canvas {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0a0c12 0%, #020305 100%);
        }

        .liquid-orb {
            position: absolute; width: 70vw; height: 70vw;
            background: radial-gradient(circle, rgba(var(--primary-rgb), 0.12) 0%, transparent 70%);
            border-radius: 50%; filter: blur(100px);
            animation: move 20s infinite alternate ease-in-out;
        }

        @keyframes move {
            0% { transform: translate(-10%, -10%) rotate(0deg); }
            100% { transform: translate(20%, 15%) rotate(90deg); }
        }

        /* Auth Gate */
        .auth-gate {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(20px);
        }

        .auth-panel {
            width: 90%; max-width: 400px; padding: 40px; border-radius: 40px;
            text-align: center; border: 1px solid var(--border);
            background: linear-gradient(145deg, rgba(255,255,255,0.03), transparent);
        }

        /* Navigation */
        nav {
            padding: 15px 25px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--border);
            backdrop-filter: blur(40px); background: var(--glass);
            margin: 15px; border-radius: 20px; z-index: 100;
        }

        .logo { font-weight: 800; font-size: 1.1rem; letter-spacing: 2px; }
        .logo span { color: var(--primary); text-shadow: 0 0 15px rgba(var(--primary-rgb), 0.5); }

        /* Search Section */
        .search-container {
            width: 90%; max-width: 600px; margin: 20px auto;
        }

        .search-field {
            width: 100%; padding: 18px 30px; border-radius: 100px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            color: white; font-size: 1rem; outline: none; transition: 0.3s;
            text-align: center; backdrop-filter: blur(10px);
        }

        .search-field:focus { border-color: var(--primary); box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.2); }

        /* Game Grid */
        .container { flex: 1; padding: 20px; overflow-y: auto; }
        
        .module-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px; max-width: 1200px; margin: 0 auto;
        }

        .module-card {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 30px 20px;
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none; color: white; transition: 0.4s;
            position: relative; overflow: hidden;
        }

        .module-card:hover {
            transform: translateY(-8px);
            background: rgba(var(--primary-rgb), 0.05);
            border-color: var(--primary);
        }

        .app-name { font-weight: 700; font-size: 1rem; margin-bottom: 8px; text-align: center; }
        
        .score-tag {
            font-family: 'Fira Code', monospace;
            font-size: 0.7rem; color: var(--primary); opacity: 0.8;
        }

        .badge {
            position: absolute; top: 12px; right: 12px;
            background: var(--primary); color: #000;
            font-size: 0.6rem; font-weight: 800; padding: 3px 8px; border-radius: 50px;
        }

        /* Generic Inputs & Buttons */
        .input-field {
            width: 100%; padding: 16px; border-radius: 16px;
            background: rgba(0,0,0,0.4); border: 1px solid var(--border);
            color: white; margin-bottom: 12px; text-align: center; outline: none;
        }

        .btn-action {
            width: 100%; padding: 16px; border-radius: 16px;
            background: var(--primary); color: #000; font-weight: 800;
            border: none; cursor: pointer; transition: 0.3s;
        }

        .btn-nav {
            background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border);
            padding: 8px 16px; border-radius: 12px; font-size: 0.75rem; cursor: pointer;
        }

        /* Drawer */
        .drawer {
            position: fixed; right: -400px; top: 0; width: 400px; height: 100%;
            background: rgba(5, 7, 10, 0.98); backdrop-filter: blur(50px);
            border-left: 1px solid var(--border); z-index: 500;
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); padding: 40px;
        }
        .drawer.active { right: 0; }

        .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .color-dot { width: 100%; aspect-ratio: 1; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }

        @media (max-width: 600px) {
            .drawer { width: 100%; right: -100%; }
            .module-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body class="theme-green">
    <div class="nebula-canvas"><div class="liquid-orb"></div></div>

    <div id="authGate" class="auth-gate">
        <div class="auth-panel">
            <h1 class="logo">NEBULA<span>.OS</span></h1>
            <p style="color: var(--text-dim); font-size: 0.65rem; margin: 10px 0 30px; letter-spacing: 3px;">QUANTUM INTERFACE v4.5</p>
            <input type="text" id="nodeID" class="input-field" placeholder="NODE ID">
            <input type="password" id="nodePass" class="input-field" placeholder="ACCESS KEY">
            <button class="btn-action" onclick="Kernel.auth.login()">INITIALIZE SESSION</button>
            <p id="modeSwitch" style="margin-top: 20px; font-size: 0.7rem; color: var(--text-dim); cursor: pointer;" onclick="Kernel.auth.toggleMode()">REGISTER NEW NODE</p>
        </div>
    </div>

    <nav>
        <div class="logo">NEBULA<span>.OS</span></div>
        <div class="nav-controls">
            <button class="btn-nav" id="admBtn" style="display:none;" onclick="Kernel.ui.toggleAdmin()">System</button>
            <button class="btn-nav" onclick="Kernel.auth.logout()">Sign Out</button>
        </div>
    </nav>

    <div class="search-container">
        <input type="text" id="gameSearch" class="search-field" placeholder="Search Quantum Modules..." onkeyup="Kernel.ui.filter()">
    </div>

    <div class="container">
        <div id="moduleGrid" class="module-grid"></div>
    </div>

    <div id="sysDrawer" class="drawer">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h2 style="letter-spacing: 2px; font-size:1rem;">SYSTEM_CONTROL</h2>
            <button class="btn-nav" onclick="Kernel.ui.toggleAdmin()">CLOSE</button>
        </div>
        
        <div style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 15px; border: 1px solid var(--border);">
            <p style="font-size: 0.6rem; color: var(--text-dim); margin-bottom: 10px;">UI CHROMATICS</p>
            <div class="color-grid">
                <div class="color-dot" onclick="Kernel.ui.setTheme('green')" style="background:#00ff88;"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('cyan')" style="background:#00f2ff;"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('purple')" style="background:#bf00ff;"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('gold')" style="background:#ffcc00;"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('red')" style="background:#ff3333;"></div>
            </div>
        </div>
    </div>

    <script>
        const Kernel = {
            state: {
                isLoginMode: true,
                db: JSON.parse(localStorage.getItem('neb_v4_db')) || {},
                repo: [
                    { n: "Cyber Strike", f: "Cyber-Strike.html", t: "HOT" },
                    { n: "Neon Golf", f: "Neon-Golf.html", t: "" },
                    { n: "Neon Hex", f: "Neon-Hex.html", t: "" },
                    { n: "Neon Pong", f: "Neon-Pong.html", t: "BEST" },
                    { n: "Blockcraft", f: "blockcraft.html", t: "UPD" },
                    { n: "Minesweeper", f: "minesweeper.html", t: "" },
                    { n: "Snake Pro", f: "snake.html", t: "BEST" },
                    { n: "Master Armory", f: "masterarmory.html", t: "" },
                    { n: "Drift King", f: "drift.html", t: "" },
                    { n: "Space Adventure", f: "spaceadventure.html", t: "" },
                    { n: "Tic Tac Toe", f: "tictactoe.html", t: "" }
                ]
            },

            auth: {
                login() {
                    const u = document.getElementById('nodeID').value.trim();
                    const p = document.getElementById('nodePass').value;
                    if(!u || !p) return;

                    if(Kernel.state.isLoginMode) {
                        if((u === 'ADMIN' && p === '2013') || Kernel.state.db[u] === p) {
                            this.establish(u);
                        } else alert("Invalid Credentials");
                    } else {
                        if(Kernel.state.db[u]) return alert("Node ID Taken");
                        Kernel.state.db[u] = p;
                        localStorage.setItem('neb_v4_db', JSON.stringify(Kernel.state.db));
                        this.establish(u);
                    }
                },
                establish(user) {
                    localStorage.setItem('neb_v4_active', user);
                    location.reload();
                },
                logout() {
                    localStorage.removeItem('neb_v4_active');
                    location.reload();
                },
                toggleMode() {
                    Kernel.state.isLoginMode = !Kernel.state.isLoginMode;
                    document.getElementById('modeSwitch').innerText = Kernel.state.isLoginMode ? "REGISTER NEW NODE" : "BACK TO LOGIN";
                }
            },

            ui: {
                init() {
                    const session = localStorage.getItem('neb_v4_active');
                    const gate = document.getElementById('authGate');
                    
                    if(session) {
                        gate.style.display = 'none';
                        if(session === 'ADMIN') document.getElementById('admBtn').style.display = 'block';
                        this.render();
                    } else {
                        gate.style.display = 'flex';
                    }

                    this.setTheme(localStorage.getItem('neb_theme') || 'green');
                },
                setTheme(t) {
                    document.body.className = `theme-${t}`;
                    localStorage.setItem('neb_theme', t);
                },
                toggleAdmin() {
                    document.getElementById('sysDrawer').classList.toggle('active');
                },
                filter() {
                    const val = document.getElementById('gameSearch').value.toLowerCase();
                    document.querySelectorAll('.module-card').forEach(card => {
                        const name = card.querySelector('.app-name').innerText.toLowerCase();
                        card.style.display = name.includes(val) ? 'flex' : 'none';
                    });
                },
                render() {
                    const grid = document.getElementById('moduleGrid');
                    const scores = JSON.parse(localStorage.getItem('nebula_scores')) || {};
                    
                    grid.innerHTML = Kernel.state.repo.map(item => {
                        const best = scores[item.n] ? `BEST: ${scores[item.n]}` : '---';
                        return `
                            <a href="${item.f}" class="module-card">
                                ${item.t ? `<div class="badge">${item.t}</div>` : ''}
                                <div style="color:var(--primary); margin-bottom:15px;"><i data-lucide="cpu"></i></div>
                                <span class="app-name">${item.n}</span>
                                <span class="score-tag">${best}</span>
                            </a>
                        `;
                    }).join('');
                    lucide.createIcons();
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => Kernel.ui.init());
    </script>
</body>
</html>
