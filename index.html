<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA OS | v5.5 Enterprise</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #00ff88;
            --primary-rgb: 0, 255, 136;
            --bg: #020305;
            --glass: rgba(15, 18, 24, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        body.theme-green { --primary: #00ff88; --primary-rgb: 0, 255, 136; }
        body.theme-cyan { --primary: #00f2ff; --primary-rgb: 0, 242, 255; }
        body.theme-purple { --primary: #bf00ff; --primary-rgb: 191, 0, 255; }
        body.theme-red { --primary: #ff3333; --primary-rgb: 255, 51, 51; }
        body.theme-gold { --primary: #ffcc00; --primary-rgb: 255, 204, 0; }
        body.theme-pink { --primary: #ff0077; --primary-rgb: 255, 0, 119; }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: default; }
        
        body {
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
        }

        .desktop-bg {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at top right, rgba(var(--primary-rgb), 0.05), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(var(--primary-rgb), 0.03), transparent 50%);
        }

        /* --- TASKBAR --- */
        nav {
            height: 65px; padding: 0 25px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--border);
            backdrop-filter: blur(25px); background: var(--glass); z-index: 100;
            flex-shrink: 0;
        }
        
        .sys-info { display: flex; align-items: center; gap: 20px; font-size: 0.8rem; }
        .stat-badge { font-family: 'Fira Code'; color: var(--primary); background: rgba(var(--primary-rgb), 0.1); padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; }

        /* --- MAIN SCROLLABLE --- */
        .main-stage {
            flex: 1; 
            overflow-y: auto; 
            padding: 20px;
            scroll-behavior: smooth;
        }

        .search-container {
            width: 100%; max-width: 600px; margin: 30px auto; position: sticky; top: 0; z-index: 10;
        }

        .os-input {
            width: 100%; padding: 18px 25px; border-radius: 16px;
            background: #0f1218; border: 1px solid var(--border);
            color: white; font-size: 1rem; outline: none; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        .os-input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(var(--primary-rgb), 0.2); }

        /* --- APP GRID --- */
        .grid-engine {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px; max-width: 1200px; margin: 0 auto 100px;
        }

        .app-icon {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            padding: 25px 15px; border-radius: 24px; transition: 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            text-decoration: none; color: inherit; border: 1px solid transparent;
        }

        .app-icon:hover {
            background: rgba(255,255,255,0.03);
            border-color: var(--border);
            transform: scale(1.05);
        }

        .icon-visual {
            width: 70px; height: 70px; border-radius: 20px;
            background: linear-gradient(145deg, #1a1f26, #0f1218);
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); border: 1px solid var(--border);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .app-label { font-size: 0.8rem; font-weight: 700; text-align: center; }

        /* --- SYSTEM DRAWER --- */
        .sys-drawer {
            position: fixed; right: -400px; top: 0; width: 380px; height: 100%;
            background: rgba(5, 7, 10, 0.98); backdrop-filter: blur(40px);
            border-left: 1px solid var(--border); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 40px; z-index: 200;
        }
        .sys-drawer.open { right: 0; }

        .btn-prime {
            width: 100%; padding: 16px; border-radius: 12px; border: none;
            background: var(--primary); color: #000; font-weight: 800; 
            cursor: pointer; margin-top: 15px; transition: 0.2s;
        }
        .btn-prime:active { transform: scale(0.98); }

        .color-dot { height: 45px; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .color-dot:hover { transform: translateY(-3px); border: 2px solid white; }

        /* Custom Scrollbar */
        .main-stage::-webkit-scrollbar { width: 6px; }
        .main-stage::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body class="theme-green">
    <div class="desktop-bg"></div>

    <nav>
        <div class="sys-info">
            <div style="font-weight: 800; letter-spacing: 1px;">NEBULA<span style="color:var(--primary)">.OS</span></div>
            <div class="stat-badge" id="nodeCount">24_NODES_ACTIVE</div>
        </div>
        <div class="sys-info">
            <div id="sysTime" style="font-family: 'Fira Code'; font-weight: bold;">00:00:00</div>
            <div style="height: 20px; width: 1px; background: var(--border);"></div>
            <button onclick="Kernel.ui.toggleSys()" style="background:transparent; border:none; color:white; cursor:pointer;">
                <i data-lucide="settings-2"></i>
            </button>
        </div>
    </nav>

    <main class="main-stage">
        <div class="search-container">
            <input type="text" id="appSearch" class="os-input" placeholder="Search Quantum Modules..." onkeyup="Kernel.ui.search()">
        </div>

        <div id="grid" class="grid-engine"></div>
    </main>

    <div id="drawer" class="sys-drawer">
        <h2 style="margin-bottom: 5px;">System Console</h2>
        <p style="font-size: 0.7rem; color: var(--text-dim); margin-bottom: 35px;">Configuration & Support Interface</p>
        
        <div style="background: rgba(255,255,255,0.03); padding: 25px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px;">
            <p style="font-size: 0.65rem; font-weight: 800; color: var(--text-dim); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;">Interface Color</p>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
                <div class="color-dot" onclick="Kernel.ui.setTheme('green')" style="background:#00ff88;"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('cyan')" style="background:#00f2ff;"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('purple')" style="background:#bf00ff;"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('red')" style="background:#ff3333;"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('gold')" style="background:#ffcc00;"></div>
                <div class="color-dot" onclick="Kernel.ui.setTheme('pink')" style="background:#ff0077;"></div>
            </div>
        </div>

        <div style="padding: 10px;">
            <p style="font-size: 0.65rem; font-weight: 800; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase;">Assistance</p>
            <button class="btn-prime" onclick="window.open('https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAN__4XhIPhUOE9XTUQ5QVIxT05ZVEZONUhXREZTVjgxRC4u')">
                <i data-lucide="help-circle" style="width: 16px; display: inline; vertical-align: middle; margin-right: 8px;"></i>
                SUPPORT REQUEST
            </button>
            <button class="btn-prime" style="background: transparent; border: 1px solid var(--border); color: #fff;" onclick="Kernel.ui.toggleSys()">EXIT SETTINGS</button>
        </div>
    </div>

    <script>
        const Kernel = {
            apps: [
                { n: "Cyber Strike", f: "Cyber-Strike.html", i: "zap" },
                { n: "Neon Golf", f: "Neon-Golf.html", i: "target" },
                { n: "Neon Hex", f: "Neon-Hex.html", i: "hexagon" },
                { n: "Neon Pong", f: "Neon-Pong.html", i: "activity" },
                { n: "Neon Slams", f: "Neon-Slams.html", i: "dribbble" },
                { n: "Neon Slash", f: "Neon-Slash.html", i: "sword" },
                { n: "AI Core", f: "ai.html", i: "bot" },
                { n: "Basketball", f: "basketball.html", i: "circle" },
                { n: "Block Blast", f: "blockblast.html", i: "grid" },
                { n: "Block Breaker", f: "blockbreaker.html", i: "layers" },
                { n: "Block Craft", f: "blockcraft.html", i: "box" },
                { n: "Cricket", f: "cricket.html", i: "trophy" },
                { n: "Drift King", f: "drift.html", i: "navigation-2" },
                { n: "Football", f: "football.html", i: "award" },
                { n: "Master Armory", f: "masterarmory.html", i: "shield" },
                { n: "Minesweeper", f: "minesweeper.html", i: "bomb" },
                { n: "Neon Trail", f: "neon-trail.html", i: "wind" },
                { n: "Overdrive", f: "overdrive.html", i: "gauge" },
                { n: "Reader", f: "reader.html", i: "book-open" },
                { n: "Snake Pro", f: "snake.html", i: "trending-up" },
                { n: "AI 2", f: "Ai2.html", i: "cpu" },
                { n: "Space Adventure", f: "spaceadventure.html", i: "rocket" },
                { n: "Sparks Maths", f: "sparksmaths.html", i: "divide" },
                { n: "Tic Tac Toe", f: "tictactoe.html", i: "x" }
            ],

            ui: {
                init() {
                    this.render();
                    this.startClock();
                    lucide.createIcons();
                    this.setTheme(localStorage.getItem('neb_theme') || 'green');
                },
                render() {
                    const grid = document.getElementById('grid');
                    grid.innerHTML = Kernel.apps.map(app => `
                        <a href="${app.f}" class="app-icon" data-name="${app.n.toLowerCase()}">
                            <div class="icon-visual"><i data-lucide="${app.i}"></i></div>
                            <div class="app-label">${app.n}</div>
                        </a>
                    `).join('');
                },
                startClock() {
                    const update = () => {
                        const now = new Date();
                        document.getElementById('sysTime').innerText = now.toLocaleTimeString([], {hour12: false});
                    };
                    update(); setInterval(update, 1000);
                },
                search() {
                    const q = document.getElementById('appSearch').value.toLowerCase();
                    let count = 0;
                    document.querySelectorAll('.app-icon').forEach(icon => {
                        const match = icon.dataset.name.includes(q);
                        icon.style.display = match ? 'flex' : 'none';
                        if(match) count++;
                    });
                    document.getElementById('nodeCount').innerText = `${count}_NODES_ACTIVE`;
                },
                toggleSys() { document.getElementById('drawer').classList.toggle('open'); },
                setTheme(t) {
                    document.body.className = `theme-${t}`;
                    localStorage.setItem('neb_theme', t);
                }
            }
        };

        window.onload = () => Kernel.ui.init();
    </script>
</body>
</html>
