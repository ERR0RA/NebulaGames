<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA v2 | Quantum OS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.3);
            --bg: #030406;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --error: #ff4757;
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Themes */
        body.theme-cyan { --primary: #00d9ff; --primary-glow: rgba(0, 217, 255, 0.3); }
        body.theme-purple { --primary: #a855f7; --primary-glow: rgba(168, 85, 247, 0.3); }
        body.theme-amber { --primary: #fbbf24; --primary-glow: rgba(251, 191, 36, 0.3); }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Animated Background Mesh */
        .nebula-bg {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, var(--primary-glow), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(79, 70, 229, 0.15), transparent 40%);
            filter: blur(80px);
            z-index: -1;
            animation: pulse 10s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }

        /* Layout Structure */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: rgba(3, 4, 6, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            letter-spacing: -0.02em;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span { color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); }

        /* Auth System */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: var(--transition);
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.5rem; color: var(--text-dim); font-weight: 600; }
        
        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            transition: var(--transition);
        }

        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }

        /* App Grid */
        .content-area { padding: 2rem; max-width: 1400px; margin: 0 auto; }

        .grid-header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.5rem;
        }

        .app-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
            text-decoration: none;
            color: var(--text);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .app-card:hover {
            background: var(--surface-hover);
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px -10px var(--primary-glow);
        }

        .app-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: var(--primary); color: #000; }
        .btn-primary:hover { opacity: 0.9; transform: scale(1.02); }

        .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--surface); }

        /* Admin Panel Drawer */
        .drawer {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100%;
            background: #0a0c10;
            border-left: 1px solid var(--border);
            z-index: 2000;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 2rem;
        }

        .drawer.active { right: 0; box-shadow: -20px 0 50px rgba(0,0,0,0.5); }

        @media (max-width: 480px) {
            .drawer { width: 100%; right: -100%; }
            .auth-card { padding: 1.5rem; border: none; background: transparent; }
        }
    </style>
</head>
<body class="theme-green">
    <div class="nebula-bg"></div>

    <div id="authLayer" class="overlay">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 class="logo" style="justify-content: center; font-size: 2rem;">NEBULA<span>.OS</span></h1>
                <p style="color: var(--text-dim); font-size: 0.9rem;">Quantum Interface v2.0</p>
            </div>
            
            <div class="input-group">
                <label>Terminal ID</label>
                <input type="text" id="uID" placeholder="Enter username...">
            </div>
            
            <div class="input-group">
                <label>Access Key</label>
                <input type="password" id="uKey" placeholder="••••••••">
            </div>

            <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="App.auth.login()">
                INITIALIZE SESSION
            </button>
            
            <p id="authSwitch" style="text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-dim); cursor: pointer;" onclick="App.auth.toggleMode()">
                New Operator? Register Terminal
            </p>
        </div>
    </div>

    <nav>
        <div class="logo">NEBULA<span>.OS</span></div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <div id="adminBadge" style="display:none; color: var(--primary); font-size: 0.7rem; font-weight: 800; border: 1px solid var(--primary); padding: 4px 8px; border-radius: 4px;">ADM</div>
            <button class="btn btn-ghost" onclick="App.ui.toggleAdmin()" id="admBtn" style="display:none;"><i data-lucide="shield"></i></button>
            <button class="btn btn-ghost" onclick="App.auth.logout()"><i data-lucide="power"></i></button>
        </div>
    </nav>

    <main class="content-area">
        <div class="grid-header">
            <div>
                <h2 id="welcomeMsg">Welcome, Operator</h2>
                <p style="color: var(--text-dim); font-size: 0.8rem;" id="sysDate"></p>
            </div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="searchApps" placeholder="Search Modules..." style="padding: 8px 15px; width: 200px;" oninput="App.ui.filterGrid()">
            </div>
        </div>

        <div id="appGrid" class="app-grid">
            </div>
    </main>

    <div id="adminPanel" class="drawer">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
            <h3>System Control</h3>
            <button class="btn btn-ghost" onclick="App.ui.toggleAdmin()"><i data-lucide="x"></i></button>
        </div>

        <div class="input-group">
            <label>Interface Theme</label>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="App.ui.setTheme('green')" style="width: 30px; height: 30px; border-radius: 50%; background: #00ff88; border: none; cursor: pointer;"></button>
                <button onclick="App.ui.setTheme('cyan')" style="width: 30px; height: 30px; border-radius: 50%; background: #00d9ff; border: none; cursor: pointer;"></button>
                <button onclick="App.ui.setTheme('purple')" style="width: 30px; height: 30px; border-radius: 50%; background: #a855f7; border: none; cursor: pointer;"></button>
                <button onclick="App.ui.setTheme('amber')" style="width: 30px; height: 30px; border-radius: 50%; background: #fbbf24; border: none; cursor: pointer;"></button>
            </div>
        </div>

        <div class="input-group">
            <label>Node Management</label>
            <div id="userList" style="max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 10px;">
                </div>
        </div>

        <div style="margin-top: 2rem;">
            <button class="btn btn-ghost" style="width: 100%; margin-bottom: 10px;" onclick="App.data.exportJSON()">Export Database</button>
            <button class="btn btn-ghost" style="width: 100%;" onclick="document.getElementById('importFile').click()">Import Database</button>
            <input type="file" id="importFile" style="display:none" onchange="App.data.importJSON(event)">
        </div>
    </div>

    <script>
        /**
         * NEBULA.OS CORE ENGINE
         * Organized via Modular Pattern
         */
        const App = {
            state: {
                user: null,
                isLoginMode: true,
                apps: ["Cyber-Strike", "Neon-Golf", "Neon-Hex", "Neon-Pong", "Neon-Slams", "Neon-Slash", "AI-Core", "Basketball", "Block-Blast", "Block-Breaker", "Block-Craft", "Cricket", "Crossy-Roads", "Drift-King", "Eggshell", "Football", "Master-Armory", "Minesweeper", "Neon-Trail", "Overdrive", "Pacman", "Reader", "Snake-Pro", "Space-Adventure", "Sparks-Maths", "Tic-Tac-Toe"],
                db: JSON.parse(localStorage.getItem('nebula_v2_db')) || {}
            },

            auth: {
                login() {
                    const u = document.getElementById('uID').value.trim();
                    const p = document.getElementById('uKey').value;
                    
                    if (!u || !p) return alert("Credentials Required");

                    // Simple Admin Simulation (In real apps, use proper backend auth)
                    if (u.toLowerCase() === 'admin' && p === 'admin123') {
                        this.success('ADMIN');
                        return;
                    }

                    if (App.state.isLoginMode) {
                        const user = App.state.db[u];
                        if (user && user.p === p) {
                            this.success(u);
                        } else {
                            alert("Access Denied: Invalid Hash");
                        }
                    } else {
                        if (App.state.db[u]) return alert("Node already exists");
                        App.state.db[u] = { p: p, created: new Date().toISOString() };
                        App.data.save();
                        this.success(u);
                    }
                },

                success(user) {
                    App.state.user = user;
                    localStorage.setItem('nebula_active_session', user);
                    location.reload();
                },

                logout() {
                    localStorage.removeItem('nebula_active_session');
                    location.reload();
                },

                toggleMode() {
                    App.state.isLoginMode = !App.state.isLoginMode;
                    document.getElementById('authSwitch').innerText = App.state.isLoginMode 
                        ? "New Operator? Register Terminal" 
                        : "Existing Operator? Terminal Login";
                }
            },

            data: {
                save() {
                    localStorage.setItem('nebula_v2_db', JSON.stringify(App.state.db));
                },
                exportJSON() {
                    const dataStr = JSON.stringify(App.state.db, null, 2);
                    const blob = new Blob([dataStr], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `nebula_backup_${new Date().getTime()}.json`;
                    link.click();
                },
                importJSON(event) {
                    const file = event.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const imported = JSON.parse(e.target.result);
                            App.state.db = { ...App.state.db, ...imported };
                            App.data.save();
                            alert("Database Synchronized");
                            App.ui.renderUserList();
                        } catch (err) { alert("Invalid Backup Format"); }
                    };
                    reader.readAsText(file);
                }
            },

            ui: {
                init() {
                    lucide.createIcons();
                    const active = localStorage.getItem('nebula_active_session');
                    if (active) {
                        document.getElementById('authLayer').style.opacity = '0';
                        setTimeout(() => document.getElementById('authLayer').style.display = 'none', 300);
                        App.state.user = active;
                        this.renderDashboard();
                    }
                    document.getElementById('sysDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                    this.setTheme(localStorage.getItem('neb_theme') || 'green');
                },

                setTheme(t) {
                    document.body.className = `theme-${t}`;
                    localStorage.setItem('neb_theme', t);
                },

                toggleAdmin() {
                    document.getElementById('adminPanel').classList.toggle('active');
                    this.renderUserList();
                },

                renderDashboard() {
                    document.getElementById('welcomeMsg').innerText = `Welcome, ${App.state.user}`;
                    if (App.state.user === 'ADMIN') {
                        document.getElementById('admBtn').style.display = 'flex';
                        document.getElementById('adminBadge').style.display = 'block';
                    }
                    this.renderGrid(App.state.apps);
                },

                renderGrid(list) {
                    const container = document.getElementById('appGrid');
                    container.innerHTML = list.map(app => `
                        <a href="${app.toLowerCase()}.html" class="app-card">
                            <div class="app-icon"><i data-lucide="layout-grid"></i></div>
                            <span style="font-weight:600; font-size:0.8rem;">${app.replace(/-/g, ' ')}</span>
                        </a>
                    `).join('');
                    lucide.createIcons();
                },

                filterGrid() {
                    const term = document.getElementById('searchApps').value.toLowerCase();
                    const filtered = App.state.apps.filter(a => a.toLowerCase().includes(term));
                    this.renderGrid(filtered);
                },

                renderUserList() {
                    const container = document.getElementById('userList');
                    const keys = Object.keys(App.state.db);
                    container.innerHTML = keys.length ? keys.map(k => `
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:0.8rem;">
                            <span>${k}</span>
                            <span style="color:var(--error); cursor:pointer;" onclick="App.ui.deleteUser('${k}')">Remove</span>
                        </div>
                    `).join('') : '<p style="font-size:0.7rem; color:var(--text-dim);">No remote nodes found.</p>';
                },

                deleteUser(k) {
                    if(confirm(`Purge data for ${k}?`)) {
                        delete App.state.db[k];
                        App.data.save();
                        this.renderUserList();
                    }
                }
            }
        };

        // Launch Engine
        window.onload = () => App.ui.init();
    </script>
</body>
</html>
