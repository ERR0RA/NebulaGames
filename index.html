<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula | Glass-Blade Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.4);
            --bg: #050505;
            --blade-bg: rgba(255, 255, 255, 0.03);
            --text: #ffffff;
        }

        [data-theme="cyber"] { --primary: #ff00ff; --primary-glow: rgba(255, 0, 255, 0.4); }
        [data-theme="ocean"] { --primary: #00d9ff; --primary-glow: rgba(0, 217, 255, 0.4); }
        [data-theme="amber"] { --primary: #ffaa00; --primary-glow: rgba(255, 170, 0, 0.4); }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.1; }

        header { padding: 60px 0 20px; text-align: center; }
        h1 { font-size: 3.5rem; letter-spacing: 20px; margin: 0; color: #fff; text-shadow: 0 0 15px var(--primary-glow); }

        .status-row {
            display: flex; gap: 40px; margin-bottom: 40px; 
            font-size: 0.7rem; color: var(--primary); letter-spacing: 2px;
        }

        .search-wrap { width: 90%; max-width: 800px; margin-bottom: 50px; }
        #moduleSearch {
            width: 100%; background: none; border: none; border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 15px; color: #fff; font-family: 'Fira Code'; font-size: 1.2rem; outline: none;
            transition: 0.3s; text-align: center;
        }
        #moduleSearch:focus { border-bottom-color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }

        /* --- THE GLASS BLADE DESIGN --- */
        .link-container {
            width: 90%; max-width: 900px;
            display: flex; flex-direction: column; gap: 10px;
            margin-bottom: 100px;
        }

        .game-link {
            position: relative;
            text-decoration: none;
            background: var(--blade-bg);
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            transition: 0.2s ease-in-out;
            border-left: 4px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            overflow: hidden;
        }

        /* The Neon Power bar on the left */
        .game-link::before {
            content: "";
            position: absolute;
            left: -4px; top: 0; bottom: 0; width: 4px;
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
            transform: scaleY(0);
            transition: 0.3s;
        }

        .game-link:hover {
            background: rgba(255, 255, 255, 0.07);
            transform: translateX(10px);
            border-left-color: transparent;
        }

        .game-link:hover::before { transform: scaleY(1); }

        .game-title {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            letter-spacing: 3px;
            transition: 0.3s;
        }

        .game-link:hover .game-title {
            color: #fff;
            text-shadow: 0 0 10px #fff;
        }

        .tag {
            margin-left: auto;
            font-size: 0.6rem;
            padding: 2px 10px;
            border: 1px solid var(--primary);
            color: var(--primary);
            opacity: 0.5;
        }

        .theme-switcher {
            position: fixed; bottom: 30px; left: 30px;
            display: flex; gap: 15px; background: rgba(0,0,0,0.5);
            padding: 15px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
        }

        .t-btn { width: 15px; height: 15px; border-radius: 50%; cursor: pointer; border: 1px solid #fff; }

    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <header>
        <h1>NEBULA</h1>
        <div class="status-row">
            <span>CORE_OS: STABLE</span>
            <span id="clock">00:00:00</span>
            <span>PING: <span id="ping">12</span>MS</span>
        </div>
    </header>

    <div class="search-wrap">
        <input type="text" id="moduleSearch" placeholder="[ ENTER_QUERY ]" onkeyup="filterGames()">
    </div>

    <div id="stable-container" class="link-container"></div>

    <div class="theme-switcher">
        <div class="t-btn" style="background:#00ff88" onclick="setTheme('default')"></div>
        <div class="t-btn" style="background:#ff00ff" onclick="setTheme('cyber')"></div>
        <div class="t-btn" style="background:#00d9ff" onclick="setTheme('ocean')"></div>
        <div class="t-btn" style="background:#ffaa00" onclick="setTheme('amber')"></div>
    </div>

    <script>
        const games = [
            { name: "Neon Cyber Strike", url: "Cyber-Strike.html", tag: "BEST" },
            { name: "Blockcraft", url: "blockcraft.html", tag: "UPD" },
            { name: "Minesweeper", url: "minesweeper.html", tag: "BEST" },
            { name: "Neon Snake", url: "snake.html", tag: "BEST" },
            { name: "Master Armory", url: "masterarmory.html", tag: "BEST" },
            { name: "Neon Pong", url: "Neon-Pong.html", tag: "BEST" },
            { name: "Neon Slash", url: "Neon-Slash.html", tag: "" },
            { name: "Block Breaker", url: "blockbreaker.html", tag: "" },
            { name: "Neon Golf", url: "Neon-Golf.html", tag: "" },
            { name: "Neon Slamz", url: "Neon-Slams.html", tag: "" },
            { name: "Neon Trail", url: "neon-trail.html", tag: "" },
            { name: "Block Blast", url: "blockblast.html", tag: "" },
            { name: "Neon Run", url: "ai.html", tag: "" },
            { name: "Basketball", url: "basketball.html", tag: "" },
            { name: "Football", url: "football.html", tag: "" },
            { name: "Cricket", url: "cricket.html", tag: "" },
            { name: "Crossy Roads", url: "crossyroads.html", tag: "" },
            { name: "Drift", url: "drift.html", tag: "" },
            { name: "Eggshell (EGGVP)", url: "eggshell.html", tag: "UPD" },
            { name: "Overdrive", url: "overdrive.html", tag: "" },
            { name: "Pacman", url: "pacman.html", tag: "" },
            { name: "Space Adventure", url: "spaceadventure.html", tag: "" },
            { name: "Tic Tac Toe", url: "tictactoe.html", tag: "" },
            { name: "Turbo Horizon", url: "turbohorizon.html", tag: "" },
            { name: "Neon Hex", url: "Neon-Hex.html", tag: "" }
        ];

        function buildArcade() {
            const container = document.getElementById('stable-container');
            container.innerHTML = games.map(game => `
                <a href="${game.url}" class="game-link" data-name="${game.name.toLowerCase()}">
                    <span class="game-title">${game.name}</span>
                    ${game.tag ? `<span class="tag">${game.tag}</span>` : ''}
                </a>
            `).join('');
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if(theme === 'default') document.documentElement.removeAttribute('data-theme');
        }

        function filterGames() {
            const val = document.getElementById('moduleSearch').value.toLowerCase();
            document.querySelectorAll('.game-link').forEach(el => {
                el.style.display = el.dataset.name.includes(val) ? 'flex' : 'none';
            });
        }

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
            document.getElementById('ping').innerText = Math.floor(Math.random() * 10 + 10);
        }, 1000);

        // Minimalist Matrix
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        const drops = Array(Math.floor(width/20)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(5, 5, 5, 0.15)";
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary');
            ctx.font = "12px monospace";
            drops.forEach((y, i) => {
                const char = Math.random() > 0.5 ? "0" : "1";
                ctx.fillText(char, i * 20, y * 20);
                if (y * 20 > height && Math.random() > 0.98) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 60);

        buildArcade();
    </script>
</body>
</html>
