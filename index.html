<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA | Gaming OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --bg: #050608;
            --surface: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --danger: #ff4444;
            --warning: #ffaa00;
        }

        body.theme-red { --primary: #ff4444; }
        body.theme-blue { --primary: #00d9ff; }
        body.theme-yellow { --primary: #ffcc00; }
        body.theme-green { --primary: #00ff88; }
        body.theme-orange { --primary: #ff8800; }
        body.theme-pink { --primary: #ff00bb; }
        body.theme-grey { --primary: #cbd5e1; }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: 0.5s ease; }

        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% -20%, var(--primary), transparent 50%),
                radial-gradient(circle at 100% 100%, var(--primary), transparent 30%);
            opacity: 0.15; filter: blur(80px); z-index: -1; animation: pulse 10s infinite alternate;
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.1; } 100% { transform: scale(1.1); opacity: 0.2; } }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(5, 6, 8, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .nav-link { font-size: 0.7rem; color: var(--text-dim); cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; padding: 10px 15px; text-decoration: none; transition: 0.3s; }
        .nav-link:hover { color: var(--primary); }
        
        .theme-selector { display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 30px; border: 1px solid var(--border); }
        .dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(0,0,0,0.3); transition: 0.2s; }

        .search-container { padding: 60px 5% 20px; text-align: center; }
        #moduleSearch { width: 100%; max-width: 600px; padding: 20px 30px; border-radius: 20px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: #fff; font-size: 1.1rem; text-align: center; transition: 0.3s; }
        #moduleSearch:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; padding: 40px 5% 100px; }
        .card { 
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 30px; text-decoration: none; 
            height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; color: white; position: relative; overflow: hidden;
        }
        .card:hover { border-color: var(--primary); background: rgba(255,255,255,0.07); transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        .card span { font-size: 0.9rem; font-weight: 800; letter-spacing: 1px; }

        #devPanel { position: fixed; top: 0; left: -100%; width: 100%; max-width: 500px; height: 100vh; background: #0a0c10; border-right: 1px solid var(--border); z-index: 4000; transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1); padding: 40px; overflow-y: auto; }
        #devPanel.active { left: 0; box-shadow: 50px 0 100px #000; }
        .modal { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 90%; max-width: 400px; padding: 50px; background: #0d1117; border-radius: 40px; text-align: center; border: 1px solid var(--border); }
        .auth-field { width: 100%; padding: 18px; margin-top: 15px; border-radius: 15px; border: 1px solid #222; background: #050608; color: #fff; text-align: center; }
    </style>
</head>
<body class="theme-green">

    <div class="bg-mesh"></div>

    <div id="devPanel">
        <h2 style="color: var(--primary); font-weight: 800; margin-bottom: 25px;">OS TERMINAL</h2>
        <div id="devUserList"></div>
        <button class="nav-link" onclick="toggleDev()" style="width:100%; border:1px solid var(--border); margin-top:20px; border-radius:12px;">Close Terminal</button>
    </div>

    <div id="authOverlay" class="modal">
        <div class="auth-box">
            <h1 style="letter-spacing: 10px; color: var(--primary); margin-bottom: 20px;">NEBULA</h1>
            <input type="text" id="userInput" class="auth-field" placeholder="OPERATIVE ID">
            <input type="password" id="passInput" class="auth-field" placeholder="SECURITY KEY">
            <button style="width:100%; padding:18px; margin-top:30px; border-radius:15px; border:none; background:var(--primary); font-weight: 800; cursor:pointer;" onclick="processAuth()">LOGIN</button>
            <p style="margin-top: 25px; font-size: 0.7rem; color: var(--text-dim); cursor: pointer;" onclick="toggleAuthMode()" id="toggleTxt">SIGN UP FOR ACCESS</p>
        </div>
    </div>

    <nav>
        <div style="display:flex; align-items:center; gap:12px;">
            <div style="width:18px; height:18px; background:var(--primary); border-radius:4px; box-shadow: 0 0 10px var(--primary);"></div>
            <h1 style="font-size:1rem; letter-spacing:4px; font-weight: 800;">NEBULA</h1>
        </div>
        <div class="theme-selector">
            <div class="dot" style="background:#ff4444" onclick="changeTheme('red')"></div>
            <div class="dot" style="background:#00d9ff" onclick="changeTheme('blue')"></div>
            <div class="dot" style="background:#ffcc00" onclick="changeTheme('yellow')"></div>
            <div class="dot" style="background:#00ff88" onclick="changeTheme('green')"></div>
            <div class="dot" style="background:#ff8800" onclick="changeTheme('orange')"></div>
            <div class="dot" style="background:#ff00bb" onclick="changeTheme('pink')"></div>
            <div class="dot" style="background:#94a3b8" onclick="changeTheme('grey')"></div>
        </div>
        <div style="display: flex; align-items: center;">
            <a href="https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAN__4XhIPhUOE9XTUQ5QVIxT05ZVEZONUhXREZTVjgxRC4u" target="_blank" class="nav-link" style="color: var(--primary); border: 1px solid var(--primary); border-radius: 8px; margin-right: 10px;">Support</a>
            <span id="devTrigger" class="nav-link" onclick="toggleDev()" style="display:none; color: var(--warning);">[ADMIN]</span>
            <span class="nav-link" onclick="doLogout()">Logout</span>
        </div>
    </nav>

    <div class="search-container">
        <input type="text" id="moduleSearch" placeholder="Search modules..." onkeyup="filterModules()">
    </div>

    <div id="gameGrid" class="grid"></div>

    <script>
        const _0xADMIN = "MTIzNDU2Nzgh"; 
        const gameList = [
            { name: "Neon-Golf", url: "Neon-Golf.html" }, { name: "Neon-Hex", url: "Neon-Hex.html" },
            { name: "Neon-Pong", url: "Neon-Pong.html" }, { name: "Neon-Slams", url: "Neon-Slams.html" },
            { name: "Neon-Slash", url: "Neon-Slash.html" }, { name: "AI Run", url: "ai.html" },
            { name: "Basketball", url: "basketball.html" }, { name: "Blockblast", url: "blockblast.html" },
            { name: "Blockbreaker", url: "blockbreaker.html" }, { name: "Blockcraft", url: "blockcraft.html" },
            { name: "Cricket", url: "cricket.html" }, { name: "Crossy Roads", url: "crossyroads.html" },
            { name: "Drift", url: "drift.html" }, { name: "Eggshell", url: "eggshell.html" },
            { name: "Football", url: "football.html" }, { name: "Master Armory", url: "masterarmory.html" },
            { name: "Minesweeper", url: "minesweeper.html" }, { name: "Neon Trail", url: "neon-trail.html" },
            { name: "Overdrive", url: "overdrive.html" }, { name: "Pacman", url: "pacman.html" },
            { name: "Reader", url: "reader.html" }, { name: "Snake", url: "snake.html" },
            { name: "Space Adventure", url: "spaceadventure.html" }, { name: "Sparks Maths", url: "sparksmaths.html" },
            { name: "Sparks Logs", url: "sparxsmaths-log.html" }, { name: "Tic Tac Toe", url: "tictactoe.html" }
        ];

        function changeTheme(color) { document.body.className = `theme-${color}`; localStorage.setItem('neb_theme', color); }
        function filterModules() {
            const query = document.getElementById('moduleSearch').value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        }
        function processAuth() {
            const u = document.getElementById('userInput').value.trim();
            const p = document.getElementById('passInput').value.trim();
            if(u.toUpperCase() === 'ADMIN' && p === atob(_0xADMIN)) { localStorage.setItem('neb_active', 'ADMIN'); location.reload(); return; }
            let db = JSON.parse(localStorage.getItem('neb_db')) || {};
            if(isLoginMode) {
                if(db[u] && db[u].pw === p) { localStorage.setItem('neb_active', u); location.reload(); } else alert("ACCESS DENIED");
            } else {
                if(db[u]) return alert("ID TAKEN");
                db[u] = { pw: p }; localStorage.setItem('neb_db', JSON.stringify(db)); localStorage.setItem('neb_active', u); location.reload();
            }
        }
        function toggleDev() { document.getElementById('devPanel').classList.toggle('active'); }
        function doLogout() { localStorage.removeItem('neb_active'); location.reload(); }
        function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('toggleTxt').innerText = isLoginMode ? "SIGN UP FOR ACCESS" : "BACK TO LOGIN"; }
        let isLoginMode = true;

        function renderUI() {
            const u = localStorage.getItem('neb_active'); if(!u) return;
            document.getElementById('authOverlay').style.display = 'none';
            if(u === 'ADMIN') document.getElementById('devTrigger').style.display = 'inline-block';
            changeTheme(localStorage.getItem('neb_theme') || 'green');
            document.getElementById('gameGrid').innerHTML = gameList.map(g => `
                <a href="${g.url}" target="_blank" class="card">
                    <span>${g.name.toUpperCase()}</span>
                </a>`).join('');
        }
        if(localStorage.getItem('neb_active')) renderUI();
    </script>
</body>
</html>
