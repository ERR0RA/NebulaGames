<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA OS | v10.0 MULTI-THEME</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #00ff88;
            --primary-rgb: 0, 255, 136;
            --bg: #020305;
            --glass: rgba(10, 12, 16, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        /* --- THEME PRESETS --- */
        body.theme-cyber { --primary: #00f2ff; --primary-rgb: 0, 242, 255; }
        body.theme-amethyst { --primary: #bf00ff; --primary-rgb: 191, 0, 255; }
        body.theme-crimson { --primary: #ff3333; --primary-rgb: 255, 51, 51; }
        body.theme-gold { --primary: #ffcc00; --primary-rgb: 255, 204, 0; }
        body.theme-mono { --primary: #ffffff; --primary-rgb: 255, 255, 255; }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg); color: var(--text-main); height: 100vh; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; transition: 0.3s; }

        .desktop-bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at center, rgba(var(--primary-rgb), 0.05), transparent 70%); }

        /* --- AUTH --- */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-box { background: var(--glass); border: 1px solid var(--border); padding: 40px; border-radius: 30px; text-align: center; width: 350px; backdrop-filter: blur(20px); }
        .auth-input { width: 100%; padding: 15px; border-radius: 12px; background: #000; border: 1px solid var(--border); color: white; margin-bottom: 12px; text-align: center; font-family: 'Fira Code'; }
        .auth-btn { width: 100%; padding: 15px; border-radius: 12px; background: var(--primary); color: #000; font-weight: 800; border: none; cursor: pointer; }

        /* --- NAV --- */
        nav { height: 50px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 1000; }
        .theme-sel { background: transparent; color: var(--primary); border: 1px solid var(--primary); padding: 5px; border-radius: 5px; font-size: 0.7rem; cursor: pointer; outline: none; }
        .theme-sel option { background: #000; color: #fff; }

        /* --- GRID --- */
        .main-stage { flex: 1; padding: 25px; position: relative; overflow-y: auto; }
        .grid-engine { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .app-icon { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; cursor: pointer; transition: 0.2s; border-radius: 15px; }
        .app-icon:hover { background: rgba(255,255,255,0.05); transform: scale(1.05); }
        .icon-visual { width: 55px; height: 55px; border-radius: 14px; background: #111; display: flex; align-items: center; justify-content: center; color: var(--primary); border: 1px solid var(--border); box-shadow: 0 0 15px rgba(var(--primary-rgb), 0.1); }
        .app-label { font-size: 0.75rem; text-align: center; }

        /* --- WINDOWS --- */
        .os-window { position: absolute; min-width: 400px; min-height: 300px; background: var(--glass); border: 1px solid var(--border); border-radius: 15px; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.6); backdrop-filter: blur(20px); overflow: hidden; }
        .win-head { height: 40px; background: rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; cursor: grab; }
        .win-body { flex: 1; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .resizer { position: absolute; width: 15px; height: 15px; bottom: 0; right: 0; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, var(--primary) 50%); border-radius: 0 0 15px 0; }
    </style>
</head>
<body class="theme-emerald">

    <div id="auth-screen">
        <div class="auth-box">
            <h2 style="letter-spacing: 2px; margin-bottom: 20px;">NEBULA_v10</h2>
            <input type="text" id="user-input" class="auth-input" placeholder="USERNAME">
            <input type="password" id="pin-input" class="auth-input" placeholder="PIN">
            <button class="auth-btn" onclick="Auth.attemptLogin()">ACCESS</button>
        </div>
    </div>

    <div class="desktop-bg"></div>

    <nav>
        <div style="display:flex; align-items:center; gap:15px;">
            <span style="font-weight:800; font-size:0.8rem; letter-spacing:1px;">NEBULA OS</span>
            <select class="theme-sel" onchange="System.setTheme(this.value)">
                <option value="theme-emerald">Emerald</option>
                <option value="theme-cyber">Cyber</option>
                <option value="theme-amethyst">Amethyst</option>
                <option value="theme-crimson">Crimson</option>
                <option value="theme-gold">Gold</option>
                <option value="theme-mono">Monochrome</option>
            </select>
        </div>
        <div style="display:flex; gap:15px; align-items:center; font-family:'Fira Code'; font-size:0.75rem;">
            <span id="user-display" style="color:var(--primary)"></span>
            <span id="clock">00:00</span>
        </div>
    </nav>

    <main class="main-stage">
        <div id="grid" class="grid-engine"></div>
        <div id="window-layer"></div>
    </main>

    <script>
        const Auth = {
            attemptLogin() {
                const u = document.getElementById('user-input').value.toLowerCase().trim();
                const p = document.getElementById('pin-input').value.trim();
                if(u && p === "1234") {
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('user-display').innerText = u.toUpperCase();
                    Kernel.boot();
                }
            }
        };

        const System = {
            setTheme(cls) {
                document.body.className = cls;
            }
        };

        const Kernel = {
            zIndex: 100,
            apps: [
                { id: "strike", n: "Cyber Strike", f: "Cyber-Strike.html", i: "zap" },
                { id: "golf", n: "Neon Golf", f: "Neon-Golf.html", i: "target" },
                { id: "hex", n: "Neon Hex", f: "Neon-Hex.html", i: "hexagon" },
                { id: "pong", n: "Neon Pong", f: "Neon-Pong.html", i: "activity" },
                { id: "slams", n: "Neon Slams", f: "Neon-Slams.html", i: "dribbble" },
                { id: "slash", n: "Neon Slash", f: "Neon-Slash.html", i: "sword" },
                { id: "ai", n: "AI Core", f: "ai.html", i: "bot" },
                { id: "blast", n: "Block Blast", f: "blockblast.html", i: "grid" },
                { id: "breaker", n: "Block Breaker", f: "blockbreaker.html", i: "layers" },
                { id: "craft", n: "Block Craft", f: "blockcraft.html", i: "box" },
                { id: "drift", n: "Drift King", f: "drift.html", i: "navigation-2" },
                { id: "snake", n: "Snake Pro", f: "snake.html", i: "trending-up" },
                { id: "space", n: "Space Quest", f: "spaceadventure.html", i: "rocket" },
                { id: "math", n: "Sparks Math", f: "sparksmaths.html", i: "divide" },
                { id: "ttt", n: "Tic Tac Toe", f: "tictactoe.html", i: "x" }
            ],

            boot() {
                const grid = document.getElementById('grid');
                grid.innerHTML = this.apps.map(app => `
                    <div class="app-icon" onclick="Kernel.launch('${app.id}')">
                        <div class="icon-visual"><i data-lucide="${app.i}"></i></div>
                        <div class="app-label">${app.n}</div>
                    </div>
                `).join('');
                lucide.createIcons();
                setInterval(() => {
                    document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                }, 1000);
            },

            launch(id) {
                const app = this.apps.find(a => a.id === id);
                const winId = `win-${id}`;
                if(document.getElementById(winId)) return;

                const html = `
                    <div class="os-window" id="${winId}" style="left:100px; top:100px; width:700px; height:450px; z-index:${++this.zIndex}" onmousedown="Kernel.focus('${winId}')">
                        <div class="win-head" onmousedown="Kernel.drag(event, '${winId}')">
                            <span style="font-size:0.7rem; font-weight:800; color:var(--primary)">${app.n.toUpperCase()}</span>
                            <button onclick="document.getElementById('${winId}').remove()" style="background:#ff3333; border:none; width:10px; height:10px; border-radius:50%; cursor:pointer;"></button>
                        </div>
                        <div class="win-body"><iframe src="${app.f}"></iframe></div>
                        <div class="resizer" onmousedown="Kernel.resize(event, '${winId}')"></div>
                    </div>`;
                document.getElementById('window-layer').insertAdjacentHTML('beforeend', html);
            },

            focus(id) { document.getElementById(id).style.zIndex = ++this.zIndex; },

            drag(e, id) {
                const el = document.getElementById(id);
                let ox = e.clientX - el.offsetLeft, oy = e.clientY - el.offsetTop;
                const move = (ev) => { el.style.left = (ev.clientX - ox) + 'px'; el.style.top = (ev.clientY - oy) + 'px'; };
                document.addEventListener('mousemove', move);
                document.addEventListener('mouseup', () => document.removeEventListener('mousemove', move), {once:true});
            },

            resize(e, id) {
                e.preventDefault(); e.stopPropagation();
                const el = document.getElementById(id);
                const sW = el.offsetWidth, sH = el.offsetHeight, sX = e.clientX, sY = e.clientY;
                const doResize = (ev) => {
                    el.style.width = (sW + ev.clientX - sX) + 'px';
                    el.style.height = (sH + ev.clientY - sY) + 'px';
                };
                document.addEventListener('mousemove', doResize);
                document.addEventListener('mouseup', () => document.removeEventListener('mousemove', doResize), {once:true});
            }
        };

        window.onload = () => lucide.createIcons();
    </script>
</body>
</html>
