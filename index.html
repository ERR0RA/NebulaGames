<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA | Quantum Arcade v4.7</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #00ff88;
            --primary-rgb: 0, 255, 136;
            --bg: #020305;
            --glass: rgba(15, 18, 24, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --radius: 20px;
        }

        body.theme-green { --primary: #00ff88; --primary-rgb: 0, 255, 136; }
        body.theme-cyan { --primary: #00f2ff; --primary-rgb: 0, 242, 255; }
        body.theme-purple { --primary: #bf00ff; --primary-rgb: 191, 0, 255; }
        body.theme-gold { --primary: #ffcc00; --primary-rgb: 255, 204, 0; }
        body.theme-red { --primary: #ff3333; --primary-rgb: 255, 51, 51; }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* --- BACKGROUND --- */
        .nebula-canvas {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0a0c12 0%, #020305 100%);
        }
        .liquid-orb {
            position: absolute; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(var(--primary-rgb), 0.12) 0%, transparent 70%);
            border-radius: 50%; filter: blur(100px);
            animation: move 20s infinite alternate ease-in-out;
        }
        @keyframes move { from { transform: translate(-10%, -10%); } to { transform: translate(20%, 20%); } }

        /* --- NAV --- */
        nav {
            padding: 15px 25px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--border);
            backdrop-filter: blur(30px); background: var(--glass);
            z-index: 100;
        }
        .sys-info { display: flex; align-items: center; gap: 15px; }
        #sysClock { font-family: 'Fira Code'; font-size: 0.85rem; color: var(--primary); font-weight: bold; }

        /* --- TOOLBAR --- */
        .toolbar {
            padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .search-field {
            width: 100%; max-width: 600px; padding: 15px 25px; border-radius: 50px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            color: white; font-size: 1rem; text-align: center; outline: none;
        }
        .search-field:focus { border-color: var(--primary); }
        .node-stats { font-size: 0.65rem; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; }

        /* --- GRID --- */
        .container { flex: 1; padding: 0 20px 40px; overflow-y: auto; scrollbar-width: none; }
        .container::-webkit-scrollbar { display: none; }
        
        .module-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px; max-width: 1200px; margin: 0 auto;
        }

        .module-card {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 25px 15px;
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none; color: white; transition: 0.3s ease;
        }
        .module-card:hover { transform: translateY(-5px); border-color: var(--primary); background: rgba(var(--primary-rgb), 0.05); }

        .icon-box { color: var(--primary); margin-bottom: 12px; }

        /* --- AUTH --- */
        .auth-gate {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: none; align-items: center; justify-content: center;
        }
        .auth-panel {
            width: 320px; padding: 40px; border-radius: 30px; text-align: center;
            border: 1px solid var(--border); background: var(--glass);
        }

        /* --- DRAWER --- */
        .drawer {
            position: fixed; right: -350px; top: 0; width: 350px; height: 100%;
            background: #05070a; border-left: 1px solid var(--border); z-index: 500;
            transition: 0.4s ease; padding: 40px;
        }
        .drawer.active { right: 0; }

        .btn-nav {
            background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border);
            padding: 8px 15px; border-radius: 10px; cursor: pointer; font-size: 0.7rem;
        }
        .btn-action {
            width: 100%; padding: 15px; border-radius: 12px; background: var(--primary);
            color: #000; font-weight: 800; border: none; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body class="theme-green">
    <div class="nebula-canvas"><div class="liquid-orb"></div></div>

    <div id="authGate" class="auth-gate">
        <div class="auth-panel">
            <h2 style="margin-bottom: 20px; letter-spacing: 2px;">NEBULA<span style="color:var(--primary)">.OS</span></h2>
            <input type="text" id="nodeID" style="width:100%; padding:12px; margin-bottom:10px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:8px; text-align:center;" placeholder="NODE ID">
            <input type="password" id="nodePass" style="width:100%; padding:12px; margin-bottom:20px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:8px; text-align:center;" placeholder="ACCESS KEY">
            <button class="btn-action" onclick="Kernel.auth.login()">INITIALIZE</button>
        </div>
    </div>

    <nav>
        <div class="sys-info">
            <div style="font-weight: 800;">NEBULA<span style="color:var(--primary)">.OS</span></div>
            <div id="sysClock">00:00:00</div>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn-nav" id="admBtn" style="display:none;" onclick="Kernel.ui.toggleAdmin()">SETTINGS</button>
            <button class="btn-nav" onclick="Kernel.auth.logout()">LOGOUT</button>
        </div>
    </nav>

    <div class="toolbar">
        <input type="text" id="gameSearch" class="search-field" placeholder="Search Data Modules..." onkeyup="Kernel.ui.filter()">
        <div class="node-stats" id="nodeStats">Nodes Active: --</div>
    </div>

    <div class="container">
        <div id="moduleGrid" class="module-grid"></div>
    </div>

    <div id="sysDrawer" class="drawer">
        <h3 style="margin-bottom:20px;">SYSTEM_THEME</h3>
        <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;">
            <div onclick="Kernel.ui.setTheme('green')" style="background:#00ff88; aspect-ratio:1; border-radius:50%; cursor:pointer;"></div>
            <div onclick="Kernel.ui.setTheme('cyan')" style="background:#00f2ff; aspect-ratio:1; border-radius:50%; cursor:pointer;"></div>
            <div onclick="Kernel.ui.setTheme('purple')" style="background:#bf00ff; aspect-ratio:1; border-radius:50%; cursor:pointer;"></div>
            <div onclick="Kernel.ui.setTheme('gold')" style="background:#ffcc00; aspect-ratio:1; border-radius:50%; cursor:pointer;"></div>
            <div onclick="Kernel.ui.setTheme('red')" style="background:#ff3333; aspect-ratio:1; border-radius:50%; cursor:pointer;"></div>
        </div>
        <button class="btn-nav" style="margin-top:40px; width:100%;" onclick="Kernel.ui.toggleAdmin()">CLOSE</button>
    </div>

    <script>
        const Kernel = {
            repo: [
                { n: "Cyber Strike", f: "Cyber-Strike.html" },
                { n: "Neon Golf", f: "Neon-Golf.html" },
                { n: "Neon Hex", f: "Neon-Hex.html" },
                { n: "Neon Pong", f: "Neon-Pong.html" },
                { n: "Neon Slams", f: "Neon-Slams.html" },
                { n: "Neon Slash", f: "Neon-Slash.html" },
                { n: "AI Core", f: "ai.html" },
                { n: "Basketball", f: "basketball.html" },
                { n: "Block Blast", f: "blockblast.html" },
                { n: "Block Breaker", f: "blockbreaker.html" },
                { n: "Block Craft", f: "blockcraft.html" },
                { n: "Cricket", f: "cricket.html" },
                { n: "Drift King", f: "drift.html" },
                { n: "Football", f: "football.html" },
                { n: "Master Armory", f: "masterarmory.html" },
                { n: "Minesweeper", f: "minesweeper.html" },
                { n: "Neon Trail", f: "neon-trail.html" },
                { n: "Overdrive", f: "overdrive.html" },
                { n: "Reader", f: "reader.html" },
                { n: "Snake Pro", f: "snake.html" },
                { n: "AI 2", f: "Ai2.html" },
                { n: "Space Adventure", f: "spaceadventure.html" },
                { n: "Sparks Maths", f: "sparksmaths.html" },
                { n: "Tic Tac Toe", f: "tictactoe.html" }
            ],

            auth: {
                login() {
                    const u = document.getElementById('nodeID').value.toUpperCase();
                    const p = document.getElementById('nodePass').value;
                    if(u && p === '2013' || (u && p)) {
                        localStorage.setItem('neb_session', u);
                        location.reload();
                    }
                },
                logout() {
                    localStorage.removeItem('neb_session');
                    location.reload();
                }
            },

            ui: {
                init() {
                    const user = localStorage.getItem('neb_session');
                    if(user) {
                        document.getElementById('authGate').style.display = 'none';
                        if(user === 'ADMIN') document.getElementById('admBtn').style.display = 'block';
                        this.render();
                        this.startClock();
                        this.setTheme(localStorage.getItem('neb_theme') || 'green');
                    } else {
                        document.getElementById('authGate').style.display = 'flex';
                    }
                },
                startClock() {
                    const update = () => {
                        const d = new Date();
                        document.getElementById('sysClock').innerText = d.toLocaleTimeString([], {hour12: false});
                    };
                    update();
                    setInterval(update, 1000);
                },
                setTheme(t) {
                    document.body.className = `theme-${t}`;
                    localStorage.setItem('neb_theme', t);
                },
                toggleAdmin() {
                    document.getElementById('sysDrawer').classList.toggle('active');
                },
                filter() {
                    const q = document.getElementById('gameSearch').value.toLowerCase();
                    let visible = 0;
                    document.querySelectorAll('.module-card').forEach(card => {
                        const isMatch = card.dataset.name.includes(q);
                        card.style.display = isMatch ? 'flex' : 'none';
                        if(isMatch) visible++;
                    });
                    document.getElementById('nodeStats').innerText = `Nodes Active: ${visible}`;
                },
                render() {
                    const grid = document.getElementById('moduleGrid');
                    grid.innerHTML = Kernel.repo.map(item => `
                        <a href="${item.f}" class="module-card" data-name="${item.n.toLowerCase()}">
                            <div class="icon-box"><i data-lucide="cpu"></i></div>
                            <div style="font-size:0.8rem; font-weight:700;">${item.n}</div>
                            <div style="font-size:0.6rem; color:var(--text-dim); margin-top:4px;">OS_STABLE</div>
                        </a>
                    `).join('');
                    document.getElementById('nodeStats').innerText = `Nodes Active: ${Kernel.repo.length}`;
                    lucide.createIcons();
                }
            }
        };

        window.onload = () => Kernel.ui.init();
    </script>
</body>
</html>
