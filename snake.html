<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON SNAKE: STABLE</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #hud { position: absolute; top: 10px; width: 100%; text-align: center; color: #00f2ff; font-weight: bold; pointer-events: none; font-size: 20px; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff0055; text-align: center; display: none; background: rgba(0,0,0,0.8); padding: 20px; border: 2px solid #ff0055; }
        button { background: #00f2ff; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div id="hud">SCORE: <span id="score">0</span></div>
<div id="msg">
    <h1>GAME OVER</h1>
    <button onclick="location.reload()">TRY AGAIN</button>
</div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>

<script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer, food, snake = [];
    let dir = { x: 1, z: 0 }, nextDir = { x: 1, z: 0 };
    let size = 20, lastTick = 0, interval = 150; 
    let gameOver = false;

    init();

    function init() {
        // 1. Scene Setup
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        // 2. Camera - High angle to ensure visibility
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 25, 15);
        camera.lookAt(0, 0, 0);

        // 3. Renderer - Use basic settings for maximum compatibility
        renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. Lights - Bright ambient so nothing stays black
        scene.add(new THREE.AmbientLight(0xffffff, 1));
        const pLight = new THREE.PointLight(0x00f2ff, 2, 100);
        pLight.position.set(0, 10, 0);
        scene.add(pLight);

        // 5. Grid
        const grid = new THREE.GridHelper(size, size, 0x222222, 0x444444);
        grid.position.y = -0.5;
        scene.add(grid);

        // 6. Create Snake Head
        addSegment(0, 0);
        
        // 7. Create Food
        const fGeo = new THREE.SphereGeometry(0.4);
        const fMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
        food = new THREE.Mesh(fGeo, fMat);
        scene.add(food);
        resetFood();

        // 8. Controls
        window.addEventListener('keydown', e => {
            if ((e.key === 'ArrowUp' || e.key === 'w') && dir.z !== 1) nextDir = { x: 0, z: -1 };
            if ((e.key === 'ArrowDown' || e.key === 's') && dir.z !== -1) nextDir = { x: 0, z: 1 };
            if ((e.key === 'ArrowLeft' || e.key === 'a') && dir.x !== 1) nextDir = { x: -1, z: 0 };
            if ((e.key === 'ArrowRight' || e.key === 'd') && dir.x !== -1) nextDir = { x: 1, z: 0 };
        });

        // Mobile Tap Zones
        window.addEventListener('touchstart', e => {
            const x = e.touches[0].clientX / window.innerWidth;
            const y = e.touches[0].clientY / window.innerHeight;
            if (y < 0.3 && dir.z !== 1) nextDir = { x: 0, z: -1 };
            else if (y > 0.7 && dir.z !== -1) nextDir = { x: 0, z: 1 };
            else if (x < 0.3 && dir.x !== 1) nextDir = { x: -1, z: 0 };
            else if (x > 0.7 && dir.x !== -1) nextDir = { x: 1, z: 0 };
        });

        requestAnimationFrame(loop);
    }

    function addSegment(x, z) {
        const sGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const sMat = new THREE.MeshStandardMaterial({ color: 0x00f2ff, emissive: 0x00f2ff, emissiveIntensity: 0.5 });
        const seg = new THREE.Mesh(sGeo, sMat);
        seg.position.set(x, 0, z);
        scene.add(seg);
        snake.unshift(seg);
    }

    function resetFood() {
        food.position.set(
            Math.floor(Math.random() * (size - 1)) - (size/2 - 0.5),
            0,
            Math.floor(Math.random() * (size - 1)) - (size/2 - 0.5)
        );
    }

    function loop(now) {
        if (gameOver) return;
        requestAnimationFrame(loop);

        if (now - lastTick > interval) {
            lastTick = now;
            dir = nextDir;

            const head = snake[0].position.clone();
            head.x += dir.x;
            head.z += dir.z;

            // Collisions
            if (Math.abs(head.x) > size/2 || Math.abs(head.z) > size/2) return endGame();
            for (let s of snake) if (s.position.distanceTo(head) < 0.1) return endGame();

            // Eat
            if (head.distanceTo(food.position) < 0.5) {
                addSegment(head.x, head.z);
                resetFood();
                document.getElementById('score').innerText = snake.length - 1;
                interval = Math.max(80, interval - 2);
            } else {
                // Move
                for (let i = snake.length - 1; i > 0; i--) {
                    snake[i].position.copy(snake[i-1].position);
                }
                snake[0].position.copy(head);
            }
        }
        renderer.render(scene, camera);
    }

    function endGame() {
        gameOver = true;
        document.getElementById('msg').style.display = 'block';
    }

    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>
