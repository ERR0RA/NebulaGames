<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON SNAKE: 2D OVERDRIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background: #050508; 
            color: #00f2ff; 
            font-family: 'Orbitron', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            touch-action: none;
        }
        canvas { 
            border: 2px solid #00f2ff; 
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); 
            background: #000;
            max-width: 95vw;
            max-height: 70vh;
        }
        #hud { margin-bottom: 10px; text-align: center; }
        .score-val { font-size: 24px; font-weight: 900; text-shadow: 0 0 10px #00f2ff; }
        #game-over { 
            position: absolute; 
            background: rgba(0,0,0,0.9); 
            inset: 0; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 10;
        }
        button { 
            background: #00f2ff; 
            border: none; 
            padding: 15px 30px; 
            font-family: 'Orbitron'; 
            font-weight: 900; 
            cursor: pointer; 
            margin-top: 20px; 
            box-shadow: 0 0 15px #00f2ff;
        }
    </style>
</head>
<body>

<div id="hud">
    SCORE: <span id="score" class="score-val">0</span><br>
    <small>[WASD] OR [ARROWS] TO NAVIGATE</small>
</div>

<canvas id="gameCanvas"></canvas>

<div id="game-over">
    <h1 style="color: #ff0055; font-size: 40px;">CRITICAL FAILURE</h1>
    <button onclick="location.reload()">RE-INITIALIZE</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const gameOverEl = document.getElementById('game-over');

    // Game Constants
    const gridSize = 20; 
    const tileCount = 30; 
    canvas.width = gridSize * tileCount;
    canvas.height = gridSize * tileCount;

    let snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    let food = {x: 15, y: 15};
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let gameSpeed = 100;
    let lastTime = 0;

    // Controls
    window.addEventListener('keydown', e => {
        const key = e.key.toLowerCase();
        if ((key === 'arrowup' || key === 'w') && dy === 0) { nextDx = 0; nextDy = -1; }
        if ((key === 'arrowdown' || key === 's') && dy === 0) { nextDx = 0; nextDy = 1; }
        if ((key === 'arrowleft' || key === 'a') && dx === 0) { nextDx = -1; nextDy = 0; }
        if ((key === 'arrowright' || key === 'd') && dx === 0) { nextDx = 1; nextDy = 0; }
    });

    // Mobile Swipes
    let touchX, touchY;
    window.addEventListener('touchstart', e => {
        touchX = e.touches[0].clientX;
        touchY = e.touches[0].clientY;
    });
    window.addEventListener('touchmove', e => {
        if (!touchX || !touchY) return;
        let diffX = touchX - e.touches[0].clientX;
        let diffY = touchY - e.touches[0].clientY;
        
        if (Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX > 0 && dx === 0) { nextDx = -1; nextDy = 0; }
            else if (dx === 0) { nextDx = 1; nextDy = 0; }
        } else {
            if (diffY > 0 && dy === 0) { nextDx = 0; nextDy = -1; }
            else if (dy === 0) { nextDx = 0; nextDy = 1; }
        }
        touchX = null; touchY = null;
    });

    function draw() {
        // Clear Background with a slight fade for motion trail
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Grid Lines (Subtle)
        ctx.strokeStyle = '#001122';
        for(let i=0; i<canvas.width; i+=gridSize) {
            ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        // Draw Food (Pulsing Glow)
        const pulse = Math.sin(Date.now() / 100) * 5;
        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 15 + pulse;
        ctx.shadowColor = '#ff0055';
        ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

        // Draw Snake
        snake.forEach((part, index) => {
            const isHead = index === 0;
            ctx.fillStyle = isHead ? '#00f2ff' : '#006677';
            ctx.shadowBlur = isHead ? 20 : 5;
            ctx.shadowColor = '#00f2ff';
            
            // Draw Block
            ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            
            // Draw Block Highlight (makes it seeable/3D look)
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.strokeRect(part.x * gridSize + 3, part.y * gridSize + 3, gridSize - 8, gridSize - 8);
        });
        ctx.shadowBlur = 0; // Reset shadow for performance
    }

    function move() {
        dx = nextDx;
        dy = nextDy;
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // Wall Collision
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return end();

        // Self Collision
        for (let i = 0; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) return end();
        }

        snake.unshift(head);

        // Food Collection
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.innerText = score;
            spawnFood();
            if (gameSpeed > 50) gameSpeed -= 2;
        } else {
            snake.pop();
        }
    }

    function spawnFood() {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
        // Don't spawn food on snake body
        snake.forEach(part => {
            if (part.x === food.x && part.y === food.y) spawnFood();
        });
    }

    function main(currentTime) {
        window.requestAnimationFrame(main);
        const delta = currentTime - lastTime;
        if (delta < gameSpeed) return;
        
        lastTime = currentTime;
        move();
        draw();
    }

    function end() {
        gameOverEl.style.display = 'flex';
        dx = 0; dy = 0;
    }

    spawnFood();
    window.requestAnimationFrame(main);
</script>
</body>
</html>
