<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON SNAKE: SINGULARITY (VERSUS)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --pink: #ff0055; --lime: #22ff00; }
        body { 
            margin: 0; background: #000; color: var(--neon); 
            font-family: 'Orbitron', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; touch-action: none;
        }
        #game-container { position: relative; border: 3px solid var(--neon); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
        canvas { display: block; background: #050508; }
        #hud { width: 600px; display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 900; align-items: center; }
        #options-trigger { cursor: pointer; font-size: 1.5rem; transition: 0.3s; z-index: 100; }
        #options-trigger:hover { transform: rotate(90deg); color: #fff; }
        #menu-overlay, #over {
            position: absolute; inset: 0; background: rgba(0,0,0,0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50;
            border: 1px solid var(--neon);
        }
        .setting-row { margin: 15px 0; display: flex; align-items: center; gap: 20px; width: 80%; justify-content: space-between; }
        button { background: transparent; border: 2px solid var(--neon); color: var(--neon); padding: 10px 20px; font-family: 'Orbitron'; cursor: pointer; font-weight: 900; transition: 0.2s; }
        button:hover { background: var(--neon); color: #000; }
        select { background:#000; color:var(--neon); border:1px solid var(--neon); padding:5px; font-family: 'Orbitron'; }
    </style>
</head>
<body>

<div id="hud">
    <div id="p1-score">P1: 0</div>
    <div id="status" style="color:#ffaa00">STABLE</div>
    <div id="p2-score" style="color:var(--pink); display:none">P2: 0</div>
    <div id="options-trigger" onclick="toggleMenu()">⚙️</div>
</div>

<div id="game-container">
    <canvas id="c"></canvas>
    
    <div id="menu-overlay">
        <h2>SYSTEM CONFIG</h2>
        <div class="setting-row">
            <span>GAME MODE</span>
            <select id="gameMode">
                <option value="solo">SOLO</option>
                <option value="versus">VERSUS (WASD vs ARROWS)</option>
            </select>
        </div>
        <div class="setting-row">
            <span>DIFFICULTY</span>
            <select id="speedBase">
                <option value="130">NOVICE</option>
                <option value="100" selected>ELITE</option>
                <option value="70">SINGULARITY</option>
            </select>
        </div>
        <button onclick="toggleMenu(); resetGame();">SAVE & RESTART</button>
    </div>

    <div id="over">
        <h1 id="win-msg" style="color:var(--pink)">CORE DESYNC</h1>
        <button onclick="resetGame()">RE-SYNC</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const statusEl = document.getElementById('status');
    const speedSelect = document.getElementById('speedBase');
    const modeSelect = document.getElementById('gameMode');
    
    const GS = 24; const TC = 25; 
    canvas.width = canvas.height = GS * TC;

    let players = [];
    let food = {x: 5, y: 5, type: 'pink', spawnTime: Date.now()};
    let particles = [];
    let isPaused = false;
    let speed = 100;
    let lastTime = 0;
    const foodLife = 5000;
    const zone = { x1: 7, y1: 7, x2: 17, y2: 17 };

    const FOOD_TYPES = {
        pink: { color: '#ff0055', score: 10, grow: 1 },
        lime: { color: '#22ff00', score: 25, grow: 1 },
        gold: { color: '#ffaa00', score: 50, grow: 3 }
    };

    function resetGame() {
        const mode = modeSelect.value;
        p2ScoreEl.style.display = (mode === 'versus') ? 'block' : 'none';
        
        players = [
            {
                id: 1, snake: [{x:5, y:12}, {x:4, y:12}], dx: 1, dy: 0, 
                score: 0, color: '#00f2ff', keys: {up:'w', down:'s', left:'a', right:'d'}, 
                inputQueue: [], alive: true
            }
        ];

        if(mode === 'versus') {
            players.push({
                id: 2, snake: [{x:19, y:12}, {x:20, y:12}], dx: -1, dy: 0, 
                score: 0, color: '#ff0055', keys: {up:'arrowup', down:'arrowdown', left:'arrowleft', right:'arrowright'}, 
                inputQueue: [], alive: true
            });
        }

        speed = parseInt(speedSelect.value);
        document.getElementById('over').style.display = 'none';
        isPaused = false;
        spawnFood();
    }

    function toggleMenu() {
        isPaused = !isPaused;
        document.getElementById('menu-overlay').style.display = isPaused ? 'flex' : 'none';
    }

    function createExplosion(x, y, color) {
        for(let i=0; i<12; i++) {
            particles.push({
                x: x * GS + GS/2, y: y * GS + GS/2,
                vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
                life: 1.0, c: color
            });
        }
    }

    window.onkeydown = e => {
        if (isPaused) return;
        const k = e.key.toLowerCase();
        
        players.forEach(p => {
            let next = null;
            if(k === p.keys.up) next = {x:0, y:-1};
            else if(k === p.keys.down) next = {x:0, y:1};
            else if(k === p.keys.left) next = {x:-1, y:0};
            else if(k === p.keys.right) next = {x:1, y:0};
            
            if(next) {
                const last = p.inputQueue.length ? p.inputQueue[p.inputQueue.length-1] : {dx: p.dx, dy: p.dy};
                if(next.x !== -last.dx || next.y !== -last.dy) p.inputQueue.push({dx: next.x, dy: next.y});
            }
        });
    };

    function spawnFood() {
        const rand = Math.random();
        let type = rand > 0.9 ? 'gold' : (rand > 0.7 ? 'lime' : 'pink');
        food = {
            x: Math.floor(Math.random()*TC),
            y: Math.floor(Math.random()*TC),
            type: type,
            spawnTime: Date.now()
        };
        // Check collision with all snakes
        if(players.some(p => p.snake.some(s => s.x === food.x && s.y === food.y))) spawnFood();
    }

    function update(t) {
        requestAnimationFrame(update);
        if (isPaused) return;
        
        if(Date.now() - food.spawnTime > foodLife) {
            createExplosion(food.x, food.y, '#ffffff');
            spawnFood();
        }

        if(t - lastTime < speed) return;
        lastTime = t;

        players.forEach(p => {
            if(!p.alive) return;

            if(p.inputQueue.length) {
                const move = p.inputQueue.shift();
                p.dx = move.dx; p.dy = move.dy;
            }

            let head = {x: p.snake[0].x + p.dx, y: p.snake[0].y + p.dy};

            // Wall Collision
            if(head.x<0 || head.x>=TC || head.y<0 || head.y>=TC) p.alive = false;
            
            // Snake Body Collision (Self and Others)
            players.forEach(other => {
                if(other.snake.some(s => s.x === head.x && s.y === head.y)) p.alive = false;
            });

            if(!p.alive) return;

            p.snake.unshift(head);

            // Food Check
            if(head.x === food.x && head.y === food.y) {
                const fData = FOOD_TYPES[food.type];
                let points = fData.score;
                if(head.x >= zone.x1 && head.x <= zone.x2 && head.y >= zone.y1 && head.y <= zone.y2) points *= 2;
                
                p.score += points;
                p1ScoreEl.innerText = `P1: ${players[0].score}`;
                if(players[1]) p2ScoreEl.innerText = `P2: ${players[1].score}`;
                
                createExplosion(food.x, food.y, fData.color);
                for(let i=0; i<fData.grow-1; i++) p.snake.push({...p.snake[p.snake.length-1]});
                spawnFood();
            } else {
                p.snake.pop();
            }
        });

        // Game Over Logic
        if(players.every(p => !p.alive)) {
            isPaused = true;
            document.getElementById('over').style.display = 'flex';
            const msg = players.length > 1 ? (players[0].score > players[1].score ? "P1 DOMINATES" : "P2 DOMINATES") : "CORE DESYNC";
            document.getElementById('win-msg').innerText = msg;
        }

        draw();
    }

    function draw() {
        ctx.fillStyle = '#050508';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // Speed Zone
        ctx.strokeStyle = 'rgba(0, 242, 255, 0.1)';
        ctx.strokeRect(zone.x1*GS, zone.y1*GS, (zone.x2
