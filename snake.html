<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VANGUARD SNAKE: RTX ON</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; touch-action: none; }
        #hud { position: absolute; top: 20px; width: 100%; text-align: center; color: #00f2ff; pointer-events: none; text-shadow: 0 0 10px #00f2ff; font-size: 24px; z-index: 10; }
        #game-over { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; color: #ff0055; z-index: 100; }
        button { background: #00f2ff; border: none; padding: 15px 30px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; border-radius: 4px; box-shadow: 0 0 20px #00f2ff; }
    </style>
</head>
<body>

<div id="hud">SYSTEM STABILITY: <span id="score">0</span></div>
<div id="game-over">
    <h1>SEQUENCE TERMINATED</h1>
    <button onclick="location.reload()">RE-INITIALIZE</button>
</div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>

<script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer, food, snake = [];
    let dir = { x: 1, z: 0 }, nextDir = { x: 1, z: 0 };
    let size = 20, lastTick = 0, interval = 130;
    let isDead = false;

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.Fog(0x020205, 10, 50);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 18);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- Realistic Lighting ---
        const amb = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(amb);
        
        const spot = new THREE.SpotLight(0x00f2ff, 500);
        spot.position.set(0, 15, 0);
        spot.angle = 1;
        scene.add(spot);

        // --- Reflective Floor ---
        const grid = new THREE.GridHelper(size, size, 0x00f2ff, 0x051520);
        grid.position.y = -0.51;
        scene.add(grid);

        // --- Create Food (Glow Orb) ---
        const fGeo = new THREE.SphereGeometry(0.5, 32, 32);
        const fMat = new THREE.MeshStandardMaterial({ 
            color: 0xff0055, 
            emissive: 0xff0055, 
            emissiveIntensity: 5,
            metalness: 1,
            roughness: 0
        });
        food = new THREE.Mesh(fGeo, fMat);
        scene.add(food);
        spawnFood();

        // --- Initial Snake ---
        for(let i=0; i<3; i++) addSegment(-i, 0);

        // Controls
        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if ((k === 'arrowup' || k === 'w') && dir.z !== 1) nextDir = { x: 0, z: -1 };
            if ((k === 'arrowdown' || k === 's') && dir.z !== -1) nextDir = { x: 0, z: 1 };
            if ((k === 'arrowleft' || k === 'a') && dir.x !== 1) nextDir = { x: -1, z: 0 };
            if ((k === 'arrowright' || k === 'd') && dir.x !== -1) nextDir = { x: 1, z: 0 };
        });

        // Mobile Tap Zones
        window.addEventListener('touchstart', e => {
            const x = e.touches[0].clientX / window.innerWidth;
            const y = e.touches[0].clientY / window.innerHeight;
            if (y < 0.3 && dir.z !== 1) nextDir = { x: 0, z: -1 };
            else if (y > 0.7 && dir.z !== -1) nextDir = { x: 0, z: 1 };
            else if (x < 0.3 && dir.x !== 1) nextDir = { x: -1, z: 0 };
            else if (x > 0.7 && dir.x !== -1) nextDir = { x: 1, z: 0 };
        });

        update();
    }

    function addSegment(x, z) {
        const geo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
        const mat = new THREE.MeshStandardMaterial({ 
            color: 0x00f2ff, 
            emissive: 0x00f2ff, 
            emissiveIntensity: 0.8,
            metalness: 0.8,
            roughness: 0.1 
        });
        const seg = new THREE.Mesh(geo, mat);
        seg.position.set(x, 0, z);
        scene.add(seg);
        snake.push(seg);
    }

    function spawnFood() {
        food.position.set(
            Math.floor(Math.random() * (size - 2)) - (size/2 - 1),
            0,
            Math.floor(Math.random() * (size - 2)) - (size/2 - 1)
        );
    }

    function update(time) {
        if (isDead) return;
        requestAnimationFrame(update);

        // Bobbing animation for food
        food.position.y = Math.sin(time * 0.005) * 0.2;
        food.rotation.y += 0.05;

        if (time - lastTick > interval) {
            lastTick = time;
            dir = nextDir;

            const headPos = snake[0].position.clone();
            headPos.x += dir.x;
            headPos.z += dir.z;

            // --- FIXED COLLECTION LOGIC ---
            // Using a 1.0 unit threshold for easier collection
            if (headPos.distanceTo(food.position) < 1.0) {
                const tail = snake[snake.length-1].position.clone();
                addSegment(tail.x, tail.z);
                spawnFood();
                document.getElementById('score').innerText = snake.length - 3;
                interval = Math.max(70, interval - 1);
            }

            // Wall Death
            if (Math.abs(headPos.x) > size/2 || Math.abs(headPos.z) > size/2) return endGame();
            
            // Self Death
            for (let i = 1; i < snake.length; i++) {
                if (headPos.distanceTo(snake[i].position) < 0.5) return endGame();
            }

            // Move body
            for (let i = snake.length - 1; i > 0; i--) {
                snake[i].position.copy(snake[i-1].position);
            }
            snake[0].position.copy(headPos);
        }

        renderer.render(scene, camera);
    }

    function endGame() {
        isDead = true;
        document.getElementById('game-over').style.display = 'flex';
    }

    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>
