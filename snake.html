<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON SNAKE: SINGULARITY</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; background: #000; color: #00f2ff; 
            font-family: 'Orbitron', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; touch-action: none;
        }
        #game-container { position: relative; border: 3px solid #00f2ff; }
        canvas { display: block; background: #000; }
        #hud { width: 600px; display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 900; }
        #over { 
            position: absolute; inset: 0; background: rgba(0,0,0,0.9); 
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; 
        }
        button { background: transparent; border: 2px solid #00f2ff; color: #00f2ff; padding: 12px 25px; font-family: 'Orbitron'; cursor: pointer; font-weight: 900; }
    </style>
</head>
<body>

<div id="hud">
    <span>SCORE: <span id="sc">0</span></span>
    <span id="status" style="color:#ffaa00">STABLE</span>
</div>

<div id="game-container">
    <canvas id="c"></canvas>
    <div id="over">
        <h1 style="color:#ff0055">CORE DESYNC</h1>
        <button onclick="location.reload()">RE-SYNC</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('sc');
    const statusEl = document.getElementById('status');
    
    const GS = 24; const TC = 25; 
    canvas.width = canvas.height = GS * TC;

    let snake = [{x:12, y:12}, {x:11, y:12}, {x:10, y:12}];
    let food = {x: 5, y: 5, type: 'pink', spawnTime: 0};
    let dx = 1, dy = 0;
    let inputQueue = [];
    let score = 0;
    let lastTime = 0;
    let speed = 110;
    let particles = [];
    let foodLife = 5000; // Food moves every 5 seconds

    const FOOD_TYPES = {
        pink: { color: '#ff0055', score: 10, grow: 1 },
        lime: { color: '#22ff00', score: 25, grow: 1 },
        gold: { color: '#ffaa00', score: 50, grow: 3 }
    };

    // Speed Zone (Center area)
    const zone = { x1: 7, y1: 7, x2: 17, y2: 17 };

    function createExplosion(x, y, color) {
        for(let i=0; i<15; i++) {
            particles.push({
                x: x * GS + GS/2, y: y * GS + GS/2,
                vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                life: 1.0, c: color
            });
        }
    }

    window.onkeydown = e => {
        const k = e.key.toLowerCase();
        let next = null;
        if(k === 'w' || k === 'arrowup') next = {x:0, y:-1};
        if(k === 's' || k === 'arrowdown') next = {x:0, y:1};
        if(k === 'a' || k === 'arrowleft') next = {x:-1, y:0};
        if(k === 'd' || k === 'arrowright') next = {x:1, y:0};
        if(next) {
            const last = inputQueue.length ? inputQueue[inputQueue.length-1] : {dx, dy};
            if(next.x !== -last.dx || next.y !== -last.dy) inputQueue.push({dx: next.x, dy: next.y});
        }
    };

    function spawnFood() {
        const rand = Math.random();
        let type = 'pink';
        if (rand > 0.9) type = 'gold';
        else if (rand > 0.7) type = 'lime';

        food = {
            x: Math.floor(Math.random()*TC),
            y: Math.floor(Math.random()*TC),
            type: type,
            spawnTime: Date.now()
        };
        if(snake.some(s => s.x === food.x && s.y === food.y)) spawnFood();
    }

    function update(t) {
        requestAnimationFrame(update);
        
        // Random Food Movement (Singularity)
        if(Date.now() - food.spawnTime > foodLife) {
            createExplosion(food.x, food.y, '#ffffff');
            spawnFood();
        }

        if(t - lastTime < speed) return;
        lastTime = t;

        if(inputQueue.length) {
            const move = inputQueue.shift();
            dx = move.dx; dy = move.dy;
        }

        let head = {x: snake[0].x + dx, y: snake[0].y + dy};

        if(head.x<0 || head.x>=TC || head.y<0 || head.y>=TC || snake.some(s=>s.x===head.x && s.y===head.y)) {
            document.getElementById('over').style.display = 'flex';
            return;
        }

        snake.unshift(head);

        if(head.x === food.x && head.y === food.y) {
            const fData = FOOD_TYPES[food.type];
            let points = fData.score;
            
            // Speed Zone Check (Multiplier)
            if(head.x >= zone.x1 && head.x <= zone.x2 && head.y >= zone.y1 && head.y <= zone.y2) {
                points *= 2;
                statusEl.innerText = "OVERLOAD x2!";
                statusEl.style.color = "#00f2ff";
            } else {
                statusEl.innerText = "STABLE";
                statusEl.style.color = "#ffaa00";
            }

            score += points;
            scoreEl.innerText = score;
            speed = Math.max(50, speed - 1);
            createExplosion(food.x, food.y, fData.color);
            for(let i=0; i<fData.grow-1; i++) snake.push({...snake[snake.length-1]});
            spawnFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        ctx.fillStyle = '#050508';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // Draw Speed Zone
        ctx.strokeStyle = 'rgba(0, 242, 255, 0.15)';
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(zone.x1*GS, zone.y1*GS, (zone.x2-zone.x1+1)*GS, (zone.y2-zone.y1+1)*GS);
        ctx.setLineDash([]);

        // Draw Food (Cores)
        const timeLeft = foodLife - (Date.now() - food.spawnTime);
        const fData = FOOD_TYPES[food.type];
        // Food pulses faster when it's about to move
        const pulseSpeed = timeLeft < 1500 ? 50 : 150;
        const pulse = Math.sin(Date.now() / pulseSpeed) * 8;
        
        ctx.shadowBlur = 15 + pulse;
        ctx.shadowColor = fData.color;
        ctx.fillStyle = fData.color;
        ctx.beginPath();
        ctx.arc(food.x*GS + GS/2, food.y*GS + GS/2, GS/2 - 4 + (pulse/4), 0, Math.PI*2);
        ctx.fill();

        // Draw Snake
        snake.forEach((s, i) => {
            const hue = (Date.now() / 25 + i * 8) % 360;
            ctx.shadowBlur = i === 0 ? 15 : 0;
            ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
            ctx.fillStyle = i === 0 ? '#fff' : `hsl(${hue}, 70%, 50%)`;
            ctx.beginPath();
            ctx.roundRect(s.x*GS+2, s.y*GS+2, GS-4, GS-4, 5);
            ctx.fill();
        });

        // Particles
        ctx.shadowBlur = 0;
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.03;
            ctx.fillStyle = p.c;
            ctx.globalAlpha = p.life;
            ctx.fillRect(p.x, p.y, 3, 3);
            if(p.life <= 0) particles.splice(i, 1);
        });
        ctx.globalAlpha = 1;
    }

    spawnFood();
    requestAnimationFrame(update);
</script>
</body>
</html>
