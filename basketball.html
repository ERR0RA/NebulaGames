<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEBULA B-BALL: PRO PHYSICS</title>
    <style>
        body { margin: 0; background: #020205; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; color: white; font-family: 'Segoe UI', sans-serif; }
        canvas { background: radial-gradient(circle, #0a0a20 0%, #050510 100%); border: 3px solid #1a1a3a; border-radius: 8px; box-shadow: 0 0 50px rgba(0, 210, 255, 0.1); }
        #ui { position: absolute; top: 30px; display: flex; justify-content: space-between; width: 800px; pointer-events: none; }
        .score { font-size: 60px; font-weight: bold; font-family: monospace; text-shadow: 0 0 20px currentColor; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="s1" class="score" style="color: #ff3e3e">0</div>
        <div id="s2" class="score" style="color: #00d2ff">0</div>
    </div>
    <canvas id="court"></canvas>

<script>
    const canvas = document.getElementById('court');
    const ctx = canvas.getContext('2d');
    canvas.width = 1000; canvas.height = 600;

    const gravity = 0.45;
    const friction = 0.99;
    const bounciness = 0.75;
    const FLOOR_Y = 560;

    let score1 = 0, score2 = 0;
    const ball = { 
        x: 500, y: 100, vx: 0, vy: 0, r: 15, 
        reset(dir) {
            this.x = 500; this.y = 150; this.vx = dir * 5; this.vy = 0;
        }
    };

    class Human {
        constructor(x, color, team, isPlayer) {
            this.x = x; this.y = 400; this.vx = 0; this.vy = 0;
            this.w = 35; this.h = 85; this.color = color; this.team = team;
            this.isPlayer = isPlayer;
            this.grounded = false;
            this.moveSpeed = 0.8;
            this.maxSpeed = 8;
            this.jumpForce = -14;
        }

        update() {
            // --- MOVEMENT LOGIC ---
            if (this.isPlayer) {
                const left = keys['KeyA'] || keys['ArrowLeft'];
                const right = keys['KeyD'] || keys['ArrowRight'];
                const jump = keys['KeyW'] || keys['ArrowUp'] || keys['Space'];

                if (left) this.vx -= this.moveSpeed;
                else if (right) this.vx += this.moveSpeed;
                else this.vx *= 0.85; // Faster deceleration

                if (jump && this.grounded) {
                    this.vy = this.jumpForce;
                    this.grounded = false;
                }
            } else {
                // AI Logic: Chase ball and jump if ball is overhead
                let targetX = ball.x - this.w / 2;
                let diff = targetX - this.x;
                this.vx += Math.sign(diff) * 0.6;
                if (Math.abs(ball.x - this.x) < 60 && ball.y < this.y - 50 && this.grounded) {
                    this.vy = this.jumpForce;
                }
            }

            // Apply Physics
            this.vx = Math.max(-this.maxSpeed, Math.min(this.maxSpeed, this.vx));
            this.vy += gravity;
            this.x += this.vx;
            this.y += this.vy;

            // Bounds & Floor
            if (this.y + this.h > FLOOR_Y) {
                this.y = FLOOR_Y - this.h;
                this.vy = 0;
                this.grounded = true;
            }
            if (this.x < 0) this.x = 0;
            if (this.x + this.w > canvas.width) this.x = canvas.width - this.w;

            // --- IMPROVED BALL INTERACTION ---
            let cx = Math.max(this.x, Math.min(ball.x, this.x + this.w));
            let cy = Math.max(this.y, Math.min(ball.y, this.y + this.h));
            let dx = ball.x - cx, dy = ball.y - cy;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < ball.r) {
                // Direction of hit
                let nx = dx / (dist || 1);
                let ny = dy / (dist || 1);
                
                // Reposition ball outside player
                ball.x = cx + nx * ball.r;
                ball.y = cy + ny * ball.r;

                // Transfer momentum + a "kick" factor
                ball.vx = nx * 10 + this.vx;
                ball.vy = ny * 10 + (this.vy < 0 ? this.vy : -2); // Upward boost on hit
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 15; ctx.shadowColor = this.color;
            ctx.fillRect(this.x, this.y, this.w, this.h);
            ctx.shadowBlur = 0;
            // Draw "Eyes" to show direction
            ctx.fillStyle = "white";
            let eyeX = this.vx >= 0 ? this.x + this.w - 10 : this.x + 5;
            ctx.fillRect(eyeX, this.y + 15, 5, 5);
        }
    }

    const t1 = new Human(150, '#ff3e3e', 1, true);
    const t2 = new Human(800, '#00d2ff', 2, false); // Change to 'true' for local PvP
    
    const keys = {};
    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Court Elements
        ctx.fillStyle = "#1a1a3a";
        ctx.fillRect(400, 320, 200, 15); // Floating platform

        t1.update();
        t2.update();

        // --- BALL PHYSICS ---
        ball.vy += gravity;
        ball.vx *= friction;
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Bounce Walls
        if (ball.x < ball.r || ball.x > canvas.width - ball.r) {
            ball.vx *= -bounciness;
            ball.x = ball.x < ball.r ? ball.r : canvas.width - ball.r;
        }
        // Ceiling
        if (ball.y < ball.r) {
            ball.vy *= -bounciness;
            ball.y = ball.r;
        }
        // Floor
        if (ball.y + ball.r > FLOOR_Y) {
            ball.y = FLOOR_Y - ball.r;
            ball.vy *= -bounciness;
            if (Math.abs(ball.vy) < 1) ball.vy = 0; // Stop jitter
        }

        // Platform Collision
        if (ball.x > 400 && ball.x < 600 && ball.y + ball.r > 320 && ball.y - ball.r < 335) {
            if (ball.vy > 0) { ball.y = 320 - ball.r; ball.vy *= -bounciness; }
            else { ball.y = 335 + ball.r; ball.vy *= -bounciness; }
        }

        // --- SCORING HOOPS ---
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#ff3e3e"; ctx.strokeRect(0, 250, 40, 5); // Goal 1
        ctx.strokeStyle = "#00d2ff"; ctx.strokeRect(960, 250, 40, 5); // Goal 2

        if (ball.y > 240 && ball.y < 260) {
            if (ball.x < 40) { 
                score2++; document.getElementById('s2').innerText = score2;
                ball.reset(1);
            }
            if (ball.x > 960) { 
                score1++; document.getElementById('s1').innerText = score1;
                ball.reset(-1);
            }
        }

        // Draw Floor
        ctx.fillStyle = "#0a0a1a";
        ctx.fillRect(0, FLOOR_Y, canvas.width, 40);
        ctx.strokeStyle = "#333355";
        ctx.strokeRect(0, FLOOR_Y, canvas.width, 1);

        // Draw Entities
        t1.draw();
        t2.draw();
        
        // Draw Ball (Glow effect)
        ctx.shadowBlur = 20; ctx.shadowColor = "#ff8800";
        ctx.fillStyle = "#ff8800";
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;

        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
