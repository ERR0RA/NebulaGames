<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>NEBULA B-BALL: SOLID FLOOR</title>
    <style>
        body { margin: 0; background: #020205; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; color: white; font-family: sans-serif; }
        canvas { background: #050510; border: 3px solid #333; box-shadow: 0 0 40px #000; }
        #ui { position: absolute; top: 20px; display: flex; justify-content: space-between; width: 900px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui"><div id="s1" style="font-size: 40px; color: #ff3e3e">0</div><div id="s2" style="font-size: 40px; color: #00d2ff">0</div></div>
    <canvas id="court"></canvas>

<script>
    const canvas = document.getElementById('court');
    const ctx = canvas.getContext('2d');
    canvas.width = 1000; canvas.height = 600;

    const gravity = 0.5;
    const friction = 0.98;
    const FLOOR_Y = 560; // Fixed floor level

    let score1 = 0, score2 = 0;
    const ball = { x: 500, y: 100, vx: 5, vy: 0, r: 15 };

    class Human {
        constructor(x, color, team) {
            this.x = x; this.y = 400; this.vx = 0; this.vy = 0;
            this.w = 30; this.h = 80; this.color = color; this.team = team;
            this.grounded = false;
        }
        update(isCtrl) {
            if (isCtrl) {
                const left = (this.team === 1) ? keys['KeyA'] : keys['ArrowLeft'];
                const right = (this.team === 1) ? keys['KeyD'] : keys['ArrowRight'];
                const jump = (this.team === 1) ? keys['KeyW'] : keys['ArrowUp'];
                if (left) this.vx = -8; else if (right) this.vx = 8; else this.vx *= 0.8;
                if (jump && this.grounded) { this.vy = -15; this.grounded = false; }
            } else {
                this.vx += Math.sign(ball.x - this.x) * 0.5;
                this.vx = Math.max(-6, Math.min(6, this.vx));
                if (ball.y < this.y && Math.abs(this.x - ball.x) < 50 && this.grounded) this.vy = -12;
            }

            this.vy += gravity; this.x += this.vx; this.y += this.vy;

            // --- PLAYER FLOOR CLAMP ---
            if (this.y + this.h > FLOOR_Y) {
                this.y = FLOOR_Y - this.h;
                this.vy = 0;
                this.grounded = true;
            }

            // Body-Ball Collision
            let cx = Math.max(this.x, Math.min(ball.x, this.x + this.w));
            let cy = Math.max(this.y, Math.min(ball.y, this.y + this.h));
            let dx = ball.x - cx, dy = ball.y - cy, dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < ball.r) {
                let nx = dx/(dist||1), ny = dy/(dist||1);
                ball.x += nx * (ball.r - dist); ball.y += ny * (ball.r - dist);
                ball.vx = nx * 12 + this.vx; ball.vy = ny * 10 + this.vy;
            }
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    }

    const t1 = [new Human(200, '#ff3e3e', 1)];
    const t2 = [new Human(800, '#00d2ff', 2)];
    const keys = {};
    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Background Islands
        ctx.fillStyle = "#222";
        ctx.fillRect(400, 300, 200, 20); // Center Island
        
        // Update Players
        t1.forEach(p => p.update(true));
        t2.forEach(p => p.update(false));

        // --- THE BALL PHYSICS & FLOOR FIX ---
        ball.vy += gravity;
        ball.x += ball.vx;
        ball.y += ball.vy;

        // 1. FLOOR CLAMP (Prevent falling through)
        if (ball.y + ball.r > FLOOR_Y) {
            ball.y = FLOOR_Y - ball.r; // Reset position to top of floor
            ball.vy *= -0.7;           // Bounce
            ball.vx *= friction;       // Roll friction
        }

        // 2. WALL/CEILING BOUNDS
        if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -0.7; }
        if (ball.x > canvas.width - ball.r) { ball.x = canvas.width - ball.r; ball.vx *= -0.7; }
        if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -0.7; }

        // 3. ISLAND COLLISION
        if (ball.x > 400 && ball.x < 600 && ball.y + ball.r > 300 && ball.y - ball.r < 320) {
            ball.vy *= -0.8;
            ball.y = (ball.vy > 0) ? 300 - ball.r : 320 + ball.r;
        }

        // Draw Score Hoops
        ctx.strokeStyle = "white"; ctx.strokeRect(0, 200, 50, 10); ctx.strokeRect(950, 200, 50, 10);
        if (ball.y > 190 && ball.y < 210) {
            if (ball.x < 50) { score2++; ball.x = 500; ball.y = 100; ball.vx = 5; }
            if (ball.x > 950) { score1++; ball.x = 500; ball.y = 100; ball.vx = -5; }
            document.getElementById('s1').innerText = score1;
            document.getElementById('s2').innerText = score2;
        }

        // Draw Floor
        ctx.fillStyle = "#111";
        ctx.fillRect(0, FLOOR_Y, canvas.width, 40);

        // Draw Entities
        t1.forEach(p => p.draw());
        t2.forEach(p => p.draw());
        ctx.fillStyle = "#ff8800";
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
