<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA B-BALL: MULTIVERSE</title>
    <style>
        body { margin: 0; background: #020205; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; color: white; font-family: 'Arial Black', sans-serif; }
        canvas { border: 4px solid #1a1a3a; border-radius: 12px; box-shadow: 0 0 100px rgba(0, 210, 255, 0.2); display: none; }
        #ui { position: absolute; top: 30px; display: none; justify-content: space-between; width: 800px; pointer-events: none; z-index: 10; }
        .score { font-size: 80px; font-weight: 900; text-shadow: 0 0 30px currentColor; font-style: italic; }
        #msg { position: absolute; top: 40%; width: 100%; text-align: center; font-size: 100px; color: #fff; text-shadow: 0 0 50px #0ff; display: none; pointer-events: none; z-index: 20; }
        #menu { position: absolute; text-align: center; background: rgba(10, 10, 30, 0.9); padding: 40px; border: 2px solid #00d2ff; border-radius: 20px; box-shadow: 0 0 50px #00d2ff55; z-index: 30; }
        h1 { margin-top: 0; color: #00d2ff; letter-spacing: 5px; }
        .btn { display: block; width: 300px; padding: 15px; margin: 10px auto; background: transparent; border: 2px solid #fff; color: #fff; font-family: 'Arial Black'; cursor: pointer; transition: 0.3s; border-radius: 5px; }
        .btn:hover { background: #fff; color: #000; transform: scale(1.05); }
        .controls { font-size: 12px; color: #888; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="menu">
        <h1>NEBULA B-BALL</h1>
        <button class="btn" onclick="startGame('P1_VS_BOT')">1 PLAYER (VS BOT)</button>
        <button class="btn" onclick="startGame('P1_VS_P2')">2 PLAYERS (LOCAL)</button>
        <button class="btn" onclick="startGame('BOT_VS_BOT')">BOT VS BOT (SPECTATE)</button>
        <div class="controls">P1: WASD / ARROWS | P2: IJKL</div>
    </div>

    <div id="ui">
        <div id="s1" class="score" style="color: #ff3e3e">0</div>
        <div id="s2" class="score" style="color: #00d2ff">0</div>
    </div>
    <div id="msg">GOAL!</div>
    <canvas id="court"></canvas>

<script>
    const canvas = document.getElementById('court');
    const ctx = canvas.getContext('2d');
    canvas.width = 1000; canvas.height = 600;

    let gameActive = false;
    let scoringCooldown = false;
    let screenShake = 0;
    const particles = [];
    const stars = Array.from({length: 100}, () => ({x: Math.random()*1000, y: Math.random()*600, s: Math.random()*2}));
    
    const gravity = 0.45;
    const friction = 0.98;
    const bounciness = 0.8;
    const FLOOR_Y = 540;

    let score1 = 0, score2 = 0;
    const keys = {};

    const ball = { 
        x: 500, y: 150, vx: 5, vy: 0, r: 14, trail: [],
        holder: null, 
        reset(dir) {
            this.x = 500; this.y = 150; this.vx = dir * 7; this.vy = -5;
            this.trail = [];
            this.holder = null;
            scoringCooldown = false;
        }
    };

    class Player {
        constructor(x, color, team, controlType) {
            this.x = x; this.y = 400; this.vx = 0; this.vy = 0;
            this.w = 45; this.h = 90; this.color = color; this.team = team;
            this.controlType = controlType;
            this.grounded = false;
            this.moveSpeed = 1.3;
            this.maxSpeed = 9;
            this.jumpForce = -15;
        }

        update() {
            let left = false, right = false, jump = false;

            if (this.controlType === 'p1') {
                left = keys['KeyA'] || keys['ArrowLeft'];
                right = keys['KeyD'] || keys['ArrowRight'];
                jump = keys['KeyW'] || keys['ArrowUp'] || keys['Space'];
            } else if (this.controlType === 'p2') {
                left = keys['KeyJ'];
                right = keys['KeyL'];
                jump = keys['KeyI'];
            } else if (this.controlType === 'bot') {
                let targetX = ball.x - (this.team === 1 ? -60 : 60); 
                this.vx += Math.sign(targetX - this.x) * 0.7;
                if (Math.abs(ball.x - this.x) < 150 && ball.y < this.y && this.grounded) jump = true;
            }

            if (this.controlType !== 'bot') {
                if (left) this.vx -= this.moveSpeed;
                else if (right) this.vx += this.moveSpeed;
                else this.vx *= 0.82;
            }
            if (jump && this.grounded) { this.vy = this.jumpForce; this.grounded = false; }

            this.vx = Math.max(-this.maxSpeed, Math.min(this.maxSpeed, this.vx));
            this.vy += gravity;
            this.x += this.vx; this.y += this.vy;

            if (this.y + this.h > FLOOR_Y) { this.y = FLOOR_Y - this.h; this.vy = 0; this.grounded = true; }
            if (this.x < 0) this.x = 0; if (this.x + this.w > canvas.width) this.x = canvas.width - this.w;

            // Ball Interaction
            if (!scoringCooldown) {
                if (ball.holder === null) {
                    let cx = Math.max(this.x, Math.min(ball.x, this.x + this.w));
                    let cy = Math.max(this.y, Math.min(ball.y, this.y + this.h));
                    let dx = ball.x - cx, dy = ball.y - cy;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < ball.r + 5) {
                        if (!this.grounded && this.vy < 0) ball.holder = this;
                        else {
                            let nx = dx / (dist || 1), ny = dy / (dist || 1);
                            ball.vx = nx * 14 + this.vx;
                            ball.vy = ny * 12 + (this.vy < 0 ? this.vy : -4);
                            spawnParticles(ball.x, ball.y, "#fff", 5);
                        }
                    }
                } else if (ball.holder === this) {
                    ball.x = this.x + this.w/2 + (this.team === 1 ? 25 : -25);
                    ball.y = this.y - 15;
                    let nearHoop = (this.team === 1 && ball.x > 930 && ball.y < 300) || 
                                   (this.team === 2 && ball.x < 70 && ball.y < 300);
                    if (nearHoop) this.performDunk();
                    if (this.grounded) ball.holder = null;
                }
            }
        }

        performDunk() {
            if (scoringCooldown) return;
            scoringCooldown = true;
            if (this.team === 1) { score1++; resetRound('s1', score1, -1, "SLAM DUNK!!"); }
            else { score2++; resetRound('s2', score2, 1, "SLAM DUNK!!"); }
            screenShake = 40;
            spawnParticles(ball.x, ball.y, this.color, 50);
            ball.holder = null;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x + this.w/2, this.y + this.h/2);
            ctx.rotate(ball.holder === this ? (this.team === 1 ? 0.4 : -0.4) : this.vx * 0.04);
            ctx.shadowBlur = 15; ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.fillRect(-this.w/2, -15, this.w, 40); 
            ctx.fillStyle = "#ffdbac";
            ctx.beginPath(); ctx.arc(0, -35, 18, 0, Math.PI*2); ctx.fill(); 
            ctx.restore();
        }
    }

    let t1, t2;

    function startGame(mode) {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('ui').style.display = 'flex';
        canvas.style.display = 'block';
        if (mode === 'P1_VS_BOT') { t1 = new Player(150, '#ff3e3e', 1, 'p1'); t2 = new Player(800, '#00d2ff', 2, 'bot'); }
        else if (mode === 'P1_VS_P2') { t1 = new Player(150, '#ff3e3e', 1, 'p1'); t2 = new Player(800, '#00d2ff', 2, 'p2'); }
        else { t1 = new Player(150, '#ff3e3e', 1, 'bot'); t2 = new Player(800, '#00d2ff', 2, 'bot'); }
        gameActive = true;
        loop();
    }

    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({ x, y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, alpha: 1, color, r: Math.random()*3+1 });
        }
    }

    function loop() {
        if (!gameActive) return;
        ctx.setTransform(1, 0, 0, 1, (Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
        screenShake *= 0.9;

        // Background
        let grad = ctx.createRadialGradient(500, 300, 50, 500, 300, 600);
        grad.addColorStop(0, "#0a0a25"); grad.addColorStop(1, "#020205");
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white"; stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
        ctx.fillStyle = "#050510"; ctx.fillRect(0, FLOOR_Y, canvas.width, 60);

        t1.update(); t2.update();

        if (!ball.holder) {
            ball.vy += gravity; ball.vx *= friction;
            ball.x += ball.vx; ball.y += ball.vy;
            if (ball.x < ball.r || ball.x > canvas.width - ball.r) { ball.vx *= -bounciness; ball.x = ball.x < ball.r ? ball.r : canvas.width - ball.r; }
            if (ball.y < ball.r || ball.y + ball.r > FLOOR_Y) { ball.vy *= -bounciness; ball.y = ball.y < ball.r ? ball.r : FLOOR_Y - ball.r; }
            
            if (ball.x > 400 && ball.x < 600 && ball.y + ball.r > 320 && ball.y - ball.r < 335) {
                ball.y = ball.vy > 0 ? 320 - ball.r : 335 + ball.r;
                ball.vy *= -bounciness;
            }

            if (!scoringCooldown && ball.y > 240 && ball.y < 265) {
                if (ball.x < 50) { scoringCooldown = true; score2++; resetRound('s2', score2, 1, "GOAL!"); }
                if (ball.x > 950) { scoringCooldown = true; score1++; resetRound('s1', score1, -1, "GOAL!"); }
            }
        }

        // Visuals
        ball.trail.push({x: ball.x, y: ball.y}); if (ball.trail.length > 15) ball.trail.shift();
        ball.trail.forEach((p, i) => {
            ctx.beginPath(); ctx.arc(p.x, p.y, ball.r * (i/15), 0, Math.PI*2);
            ctx.fillStyle = ball.holder ? `rgba(0, 255, 255, ${i/30})` : `rgba(255, 165, 0, ${i/30})`; ctx.fill();
        });

        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
            ctx.globalAlpha = Math.max(0, p.alpha); ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            if (p.alpha <= 0) particles.splice(i, 1);
        });
        ctx.globalAlpha = 1;

        // Hoops
        ctx.strokeStyle = "#ff3e3e"; ctx.strokeRect(0, 250, 45, 8);
        ctx.strokeStyle = "#00d2ff"; ctx.strokeRect(955, 250, 45, 8);

        t1.draw(); t2.draw();
        ctx.fillStyle = ball.holder ? "#00ffff" : "#ffaa00";
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

        requestAnimationFrame(loop);
    }

    function resetRound(id, val, dir, text) {
        document.getElementById(id).innerText = val;
        const msg = document.getElementById('msg');
        msg.innerText = text;
        msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; ball.reset(dir); }, 1200);
    }
</script>
</body>
</html>
