<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2P BASKETBALL</title>
    <style>
        body { margin: 0; background: #222; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: 'Arial Black', sans-serif; overflow: hidden; }
        canvas { background: #333; border: 5px solid #555; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #scoreboard { display: flex; justify-content: space-around; width: 800px; font-size: 40px; margin-bottom: 10px; }
        .p1 { color: #ff4444; } .p2 { color: #4444ff; }
        #controls { margin-top: 10px; font-size: 14px; opacity: 0.7; }
    </style>
</head>
<body>

<div id="scoreboard">
    <div class="p1">RED: <span id="s1">0</span></div>
    <div style="color: #ffaa00;">BASKETBALL</div>
    <div class="p2">BLUE: <span id="s2">0</span></div>
</div>

<canvas id="court"></canvas>

<div id="controls">P1: WAD | P2: ARROWS</div>

<script>
    const canvas = document.getElementById('court');
    const ctx = canvas.getContext('2d');
    const s1El = document.getElementById('s1');
    const s2El = document.getElementById('s2');

    canvas.width = 800;
    canvas.height = 400;

    const gravity = 0.5;
    const friction = 0.98;

    let score1 = 0;
    let score2 = 0;

    const ball = {
        x: 400, y: 100, vx: 0, vy: 0, radius: 12, color: '#ff8800'
    };

    class Player {
        constructor(x, color, controls) {
            this.x = x; this.y = 350;
            this.vx = 0; this.vy = 0;
            this.w = 30; this.h = 50;
            this.color = color;
            this.controls = controls;
            this.grounded = false;
        }

        update() {
            // Controls
            if (keys[this.controls.left]) this.vx = -5;
            else if (keys[this.controls.right]) this.vx = 5;
            else this.vx *= 0.8;

            if (keys[this.controls.up] && this.grounded) {
                this.vy = -12;
                this.grounded = false;
            }

            this.vy += gravity;
            this.x += this.vx;
            this.y += this.vy;

            // Floor collision
            if (this.y + this.h > canvas.height) {
                this.y = canvas.height - this.h;
                this.vy = 0;
                this.grounded = true;
            }

            // Wall collision
            if (this.x < 0) this.x = 0;
            if (this.x + this.w > canvas.width) this.x = canvas.width - this.w;

            // Ball collision
            let dx = (this.x + this.w / 2) - ball.x;
            let dy = (this.y + this.h / 2) - ball.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 35) {
                ball.vx = -dx * 0.5;
                ball.vy = -dy * 0.5;
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.w, this.h);
            // Head
            ctx.fillRect(this.x + 5, this.y - 20, 20, 20);
        }
    }

    const p1 = new Player(100, '#ff4444', { up: 'KeyW', left: 'KeyA', right: 'KeyD' });
    const p2 = new Player(670, '#4444ff', { up: 'ArrowUp', left: 'ArrowLeft', right: 'ArrowRight' });

    const keys = {};
    window.onkeydown = (e) => keys[e.code] = true;
    window.onkeyup = (e) => keys[e.code] = false;

    function resetBall() {
        ball.x = 400; ball.y = 100;
        ball.vx = 0; ball.vy = 0;
    }

    function update() {
        p1.update();
        p2.update();

        // Ball Physics
        ball.vy += gravity * 0.6;
        ball.vx *= friction;
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Ball Walls
        if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) ball.vx *= -0.8;
        if (ball.y + ball.radius > canvas.height) {
            ball.y = canvas.height - ball.radius;
            ball.vy *= -0.7;
        }

        // Hoops Logic
        // P1 Hoop (Left) - P2 scores here
        if (ball.x < 40 && ball.y > 150 && ball.y < 170 && ball.vy > 0) {
            score2++;
            s2El.innerText = score2;
            resetBall();
        }
        // P2 Hoop (Right) - P1 scores here
        if (ball.x > 760 && ball.y > 150 && ball.y < 170 && ball.vy > 0) {
            score1++;
            s1El.innerText = score1;
            resetBall();
        }

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Court Lines
        ctx.strokeStyle = "rgba(255,255,255,0.1)";
        ctx.lineWidth = 5;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath(); ctx.moveTo(400,0); ctx.lineTo(400,400); ctx.stroke();

        // Draw Hoops
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 160, 40, 10); // Left
        ctx.fillRect(760, 160, 40, 10); // Right

        p1.draw();
        p2.draw();

        // Draw Ball
        ctx.fillStyle = ball.color;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        // Ball details
        ctx.strokeStyle = "#000"; ctx.lineWidth = 1; ctx.stroke();
    }

    update();
</script>
</body>
</html>
