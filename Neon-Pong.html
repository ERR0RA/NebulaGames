<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON_PONG | SYSTEM_OVERLOAD_v2</title>
    <style>
        :root { --neon: #0f0; --alpha: #0ff; --beta: #0a6; --neon-p: #f0f; --bg: #020502; }
        body { background: #000; color: var(--neon); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        /* CRT Overlay Effect */
        body::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255,0,0,0.02), rgba(0,255,0,0.01), rgba(0,0,255,0.02)); z-index: 10; background-size: 100% 3px, 3px 100%; pointer-events: none; }
        
        canvas { border: 4px solid #003300; background: var(--bg); box-shadow: 0 0 50px #001100; display: none; max-width: 98vw; max-height: 80vh; }
        
        .menu { text-align: center; border: 2px solid var(--neon); padding: 25px; background: #000; box-shadow: 0 0 30px #004400; width: 95%; max-width: 900px; z-index: 20; max-height: 90vh; overflow-y: auto; }
        
        .config-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .team-panel { border: 1px solid #040; padding: 10px; background: #050505; border-radius: 4px; }
        
        select, button { background: #000; color: var(--neon); border: 1px solid #030; width: 100%; padding: 8px; font-family: monospace; margin-top: 5px; cursor: pointer; }
        .btn-start { background: var(--neon); color: #000; font-weight: bold; padding: 15px; letter-spacing: 3px; border: none; margin-top: 10px; transition: 0.3s; }
        .btn-start:hover { background: #fff; box-shadow: 0 0 20px var(--neon); transform: scale(1.02); }

        #ui { position: absolute; top: 10px; font-size: 1.2rem; background: rgba(0,0,0,0.9); padding: 10px 30px; border: 1px solid #020; display: none; z-index: 5; letter-spacing: 2px; }
        .stat-line { font-size: 0.7rem; color: #444; margin-top: 5px; text-align: center; }
    </style>
</head>
<body>

    <div id="ui">
        [<span id="modeDisp">STD</span>] <span id="s1" style="color:var(--alpha)">0</span> : <span id="s2" style="color:var(--neon-p)">0</span>
        <div id="match-log" style="font-size: 0.6rem; color: #666; text-align: center; margin-top: 5px;">SYSTEM_STABLE</div>
    </div>

    <div id="menu" class="menu">
        <h1 style="letter-spacing: 8px; margin-bottom: 5px;">NEON_PONG.EXE <span style="font-size: 0.8rem; vertical-align: middle;">v2.0_OVERLOAD</span></h1>
        <p style="font-size: 0.7rem; color: #555; margin-bottom: 20px;">STRESS_TESTING_QUANTUM_AI_CORES</p>
        
        <div class="config-grid">
            <div class="team-panel">
                <h3 style="color:var(--neon)">SIM_TYPE</h3>
                <select id="gameMode">
                    <option value="STD">STANDARD_DUAL</option>
                    <option value="SURVIVAL">HELL_MODE (RAMP)</option>
                    <option value="BOSS">CORE_FIGHT (1vs4)</option>
                </select>
                <div class="stat-line">P1:W/S | P2:R/F | P3:UP/DN</div>
            </div>

            <div class="team-panel">
                <h3 style="color:var(--alpha)">ALPHA_SECTOR</h3>
                <select id="L1">
                    <option value="ALPHA">ALPHA_BOT (ELITE)</option>
                    <option value="PLAYER">HUMAN_CORE</option>
                    <option value="OMNI">OMNI_BOT</option>
                    <option value="BETA">BETA_BOT</option>
                </select>
                <select id="L2">
                    <option value="NONE">-- EMPTY --</option>
                    <option value="NEON">NEON_BOT</option>
                    <option value="PLAYER">HUMAN_CORE</option>
                </select>
            </div>

            <div class="team-panel">
                <h3 style="color:var(--neon-p)">BETA_SECTOR</h3>
                <select id="R1">
                    <option value="OMNI">OMNI_BOT</option>
                    <option value="ALPHA">ALPHA_BOT (ELITE)</option>
                    <option value="PLAYER">HUMAN_CORE</option>
                    <option value="NEON">NEON_BOT</option>
                </select>
                <select id="R2">
                    <option value="NONE">-- EMPTY --</option>
                    <option value="BETA">BETA_BOT</option>
                    <option value="TANK">TANK_BOT</option>
                </select>
            </div>
        </div>

        <button class="btn-start" onclick="initGame()">INITIALIZE BOOT SEQUENCE</button>
    </div>

    <canvas id="pong" width="1200" height="500"></canvas>

<script>
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');
    let score = { p1: 0, p2: 0 }, keys = {};
    let gameActive = false, units = [], particles = [], balls = [], powerups = [];
    let curMode = "STD", frameCount = 0;

    const TYPES = {
        ALPHA:  { speed: 11, jitter: 0, color: '#00ffff', h: 80, predict: true, aura: true },
        BETA:   { speed: 6.5, jitter: 12, color: '#00aa66', h: 85, predict: true, aura: false },
        NEON:   { speed: 16, jitter: 6, color: '#ff00ff', h: 65, predict: true, trail: true },
        OMNI:   { speed: 7.5, jitter: 2, color: '#0f0', h: 80, predict: true, aura: false },
        TANK:   { speed: 4, jitter: 0, color: '#0cf', h: 180, predict: false, aura: false },
        PLAYER: { speed: 10, jitter: 0, color: '#fff', h: 80, predict: false, aura: false }
    };

    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function initGame() {
        units = []; balls = []; powerups = []; particles = [];
        curMode = document.getElementById('gameMode').value;
        
        const config = {
            L: [document.getElementById('L1').value, document.getElementById('L2').value],
            R: [document.getElementById('R1').value, document.getElementById('R2').value]
        };

        if(curMode === "BOSS") {
            units.push({ x: 1150, y: 100, side: 'R', type: 'ALPHA', h: 320, w: 25, speed: 3.5, color: '#f33', id: 'BOSS', targetY: 250 });
            config.L.forEach((type, i) => {
                if(type === 'NONE') return;
                let t = TYPES[type];
                units.push({ x: i === 0 ? 30 : 250, y: 200, side: 'L', type, h: t.h, w: 12, speed: t.speed, color: t.color, targetY: 250, id: 'L'+(i+1) });
            });
        } else {
            ['L', 'R'].forEach(side => {
                config[side].forEach((type, i) => {
                    if (type === 'NONE') return;
                    let t = TYPES[type];
                    let x = (side === 'L') ? (i === 0 ? 30 : 250) : (i === 0 ? 1158 : 938);
                    units.push({ x, y: 200, side, type, h: t.h, w: 12, speed: t.speed, color: t.color, targetY: 250, id: side + (i + 1) });
                });
            });
        }

        document.getElementById('menu').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
        document.getElementById('modeDisp').innerText = curMode;
        canvas.style.display = 'block';
        gameActive = true;
        spawnBall();
        loop();
    }

    function spawnBall() {
        let speed = curMode === "SURVIVAL" ? 9 + (score.p1 + score.p2)*0.5 : 9;
        balls.push({
            x: 600, y: 250, size: 10, speed,
            vx: (Math.random() > 0.5 ? speed : -speed),
            vy: (Math.random() - 0.5) * 8
        });
    }

    function predict(u, b) {
        if (!TYPES[u.type]?.predict) return b.y;
        if ((u.side === 'L' && b.vx > 0) || (u.side === 'R' && b.vx < 0)) return 250;
        
        let tx = b.x, ty = b.y, tvy = b.vy;
        let iter = 0;
        while (u.side === 'L' ? tx > u.x : tx < u.x) {
            tx += b.vx; ty += tvy;
            if (ty <= 0 || ty >= 490) tvy *= -1;
            if (iter++ > 100) break;
        }
        return ty;
    }

    function update() {
        frameCount++;
        if (frameCount % 400 === 0) {
            powerups.push({ x: 300 + Math.random()*600, y: 100 + Math.random()*300, type: ['MULTI', 'EMP', 'GLITCH'][Math.floor(Math.random()*3)], life: 400 });
        }

        units.forEach(u => {
            if (u.freeze > 0) { u.freeze--; return; }
            
            if (u.type === 'PLAYER') {
                if (u.id === 'L1' && keys['KeyW']) u.y -= u.speed;
                if (u.id === 'L1' && keys['KeyS']) u.y += u.speed;
                if (u.id === 'R1' && keys['ArrowUp']) u.y -= u.speed;
                if (u.id === 'R1' && keys['ArrowDown']) u.y += u.speed;
            } else {
                let targetBall = balls[0]; 
                u.targetY = predict(u, targetBall);
                let drift = (Math.random() - 0.5) * (TYPES[u.type]?.jitter || 0);
                
                let center = u.y + u.h/2;
                if (center < u.targetY + drift - 5) u.y += u.speed;
                else if (center > u.targetY + drift + 5) u.y -= u.speed;
            }
            u.y = Math.max(0, Math.min(500 - u.h, u.y));
        });

        balls.forEach((b, bi) => {
            b.x += b.vx; b.y += b.vy;
            if (b.y <= 0 || b.y >= 490) b.vy *= -1;

            powerups.forEach((p, pi) => {
                if (Math.hypot(b.x - p.x, b.y - p.y) < 35) {
                    if (p.type === 'MULTI') spawnBall();
                    if (p.type === 'EMP') units.filter(u => u.side !== (b.vx > 0 ? 'L' : 'R')).forEach(u => u.freeze = 120);
                    powerups.splice(pi, 1);
                }
            });

            units.forEach(u => {
                if (b.x < u.x + u.w && b.x + b.size > u.x && b.y < u.y + u.h && b.y + b.size > u.y) {
                    b.vx = (u.side === 'L' ? 1 : -1) * Math.abs(b.speed);
                    b.vy = (b.y - (u.y + u.h/2)) * 0.35;
                    b.speed = Math.min(b.speed + 0.3, 22);
                    // Hit particles
                    for(let i=0; i<5; i++) particles.push({x:b.x, y:b.y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:1, color:u.color});
                }
            });

            if (b.x < 0) { score.p2++; reset(); }
            else if (b.x > 1200) { score.p1++; reset(); }
        });

        particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; if(p.life <= 0) particles.splice(i, 1); });
    }

    function reset() {
        document.getElementById('s1').innerText = score.p1;
        document.getElementById('s2').innerText = score.p2;
        balls = []; spawnBall();
    }

    function draw() {
        ctx.fillStyle = 'rgba(0, 8, 0, 0.3)';
        ctx.fillRect(0, 0, 1200, 500);

        // Grid lines
        ctx.strokeStyle = '#010'; ctx.lineWidth = 1;
        for(let i=0; i<1200; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,500); ctx.stroke(); }

        powerups.forEach(p => {
            ctx.shadowBlur = 15; ctx.shadowColor = '#fff';
            ctx.fillStyle = '#fff'; ctx.fillRect(p.x, p.y, 20, 20);
            ctx.shadowBlur = 0;
        });

        units.forEach(u => {
            ctx.shadowBlur = TYPES[u.type].aura ? 30 : 10;
            ctx.shadowColor = u.color;
            ctx.fillStyle = u.freeze > 0 ? '#444' : u.color;
            
            if(TYPES[u.type].trail) {
                ctx.strokeStyle = u.color;
                ctx.strokeRect(u.x - 4, u.y - 4, u.w + 8, u.h + 8);
            }

            ctx.fillRect(u.x, u.y, u.w, u.h);
        });

        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fillRect(p.x, p.y, 3, 3);
        });
        ctx.globalAlpha = 1;

        balls.forEach(b => {
            ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
            ctx.fillStyle = '#fff';
            ctx.fillRect(b.x, b.y, b.size, b.size);
        });
        ctx.shadowBlur = 0;
    }

    function loop() {
        if (!gameActive) return;
        update(); draw();
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
