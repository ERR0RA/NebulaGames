<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON_PONG | HYBRID_COMMAND</title>
    <style>
        body { 
            background: #000; color: #0f0; font-family: 'Courier New', monospace; 
            margin: 0; overflow: hidden; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh;
        }
        canvas { 
            border: 2px solid #004400; background: #050505; 
            box-shadow: 0 0 20px #002200; display: none;
            max-width: 95vw; max-height: 70vh; 
        }
        .menu { 
            text-align: center; border: 2px solid #0f0; padding: 20px; 
            background: #050505; box-shadow: 0 0 15px #004400; width: 90%; max-width: 600px;
        }
        .config-box { display: flex; gap: 20px; justify-content: center; margin-bottom: 20px; }
        .team-panel { border: 1px solid #030; padding: 10px; flex: 1; }
        .btn-start { 
            background: #0f0; color: #000; border: none; padding: 15px; 
            cursor: pointer; font-family: monospace; font-weight: bold; width: 100%;
        }
        select { background: #000; color: #0f0; border: 1px solid #0f0; margin: 5px 0; width: 100%; }
        .hint { font-size: 0.7rem; color: #444; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="menu" class="menu">
        <h1>NEON_PONG_MODULAR</h1>
        
        <div class="config-box">
            <div class="team-panel">
                <h3 style="color:#0f0">LEFT TEAM</h3>
                <label>Unit 1:</label>
                <select id="L1">
                    <option value="PLAYER">HUMAN (W/S)</option>
                    <option value="OMNI">OMNI_BOT</option>
                    <option value="GLITCH">GLITCH_BOT</option>
                    <option value="TANK">TANK_BOT</option>
                    <option value="NONE">- EMPTY -</option>
                </select>
                <label>Unit 2:</label>
                <select id="L2">
                    <option value="NONE">- EMPTY -</option>
                    <option value="PLAYER">HUMAN (R/F)</option>
                    <option value="OMNI">OMNI_BOT</option>
                    <option value="GLITCH">GLITCH_BOT</option>
                    <option value="TANK">TANK_BOT</option>
                </select>
            </div>

            <div class="team-panel">
                <h3 style="color:#0f0">RIGHT TEAM</h3>
                <label>Unit 1:</label>
                <select id="R1">
                    <option value="PLAYER">HUMAN (UP/DN)</option>
                    <option value="OMNI">OMNI_BOT</option>
                    <option value="GLITCH">GLITCH_BOT</option>
                    <option value="TANK">TANK_BOT</option>
                    <option value="NONE">- EMPTY -</option>
                </select>
                <label>Unit 2:</label>
                <select id="R2">
                    <option value="NONE">- EMPTY -</option>
                    <option value="PLAYER">HUMAN (PgUp/Dn)</option>
                    <option value="OMNI">OMNI_BOT</option>
                    <option value="GLITCH">GLITCH_BOT</option>
                    <option value="TANK">TANK_BOT</option>
                </select>
            </div>
        </div>

        <button class="btn-start" onclick="initGame()">ENGAGE COMBAT</button>
        <div class="hint">
            P1: W/S | P2: R/F | P3: ArrowKeys | P4: PgUp/PgDn
        </div>
    </div>

    <div id="ui" style="display:none; text-align:center; margin-bottom:10px;">
        <span id="labelL"></span> [<span id="s1">0</span>] - [<span id="s2">0</span>] <span id="labelR"></span>
    </div>
    <canvas id="pong" width="700" height="400"></canvas>

<script>
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');
    let score = { p1: 0, p2: 0 }, keys = {};
    let gameActive = false, units = [];

    const TYPES = {
        OMNI:   { speed: 8, jitter: 2,  color: '#0f0', h: 80,  predict: true },
        GLITCH: { speed: 12, jitter: 35, color: '#f0f', h: 60,  predict: true },
        TANK:   { speed: 4, jitter: 0,  color: '#0cf', h: 140, predict: false },
        PLAYER: { speed: 9, jitter: 0,  color: '#fff', h: 80,  predict: false }
    };

    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function initGame() {
        units = [];
        const config = {
            L: [document.getElementById('L1').value, document.getElementById('L2').value],
            R: [document.getElementById('R1').value, document.getElementById('R2').value]
        };

        ['L', 'R'].forEach(side => {
            config[side].forEach((type, i) => {
                if (type === 'NONE') return;
                let x = (side === 'L') ? (i === 0 ? 15 : 40) : (i === 0 ? 673 : 648);
                units.push({
                    x, y: 150, side, type, 
                    h: TYPES[type].h, w: 12, 
                    speed: TYPES[type].speed, 
                    color: TYPES[type].color,
                    targetY: 200,
                    id: side + (i + 1)
                });
            });
        });

        document.getElementById('menu').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
        document.getElementById('labelL').innerText = config.L.filter(t=>t!=='NONE').join('+');
        document.getElementById('labelR').innerText = config.R.filter(t=>t!=='NONE').join('+');
        canvas.style.display = 'block';
        gameActive = true;
        resetBall();
        loop();
    }

    let ball = { x: 350, y: 200, vx: 5, vy: 3, size: 10, speed: 7 };

    function predict(u) {
        if (!TYPES[u.type].predict) return ball.y;
        if ((u.side === 'L' && ball.vx > 0) || (u.side === 'R' && ball.vx < 0)) return 200;
        let tx = ball.x, ty = ball.y, tvy = ball.vy;
        while (u.side === 'L' ? tx > u.x : tx < u.x) {
            tx += ball.vx; ty += tvy;
            if (ty <= 0 || ty >= 400) tvy *= -1;
            if (tx < 0 || tx > 700) break;
        }
        return ty;
    }

    function resetBall() {
        ball.x = 350; ball.y = 200; ball.speed = 7;
        ball.vx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
        ball.vy = (Math.random() - 0.5) * 8;
        units.forEach(u => u.targetY = predict(u));
    }

    function update() {
        units.forEach(u => {
            if (u.type === 'PLAYER') {
                if (u.id === 'L1' && keys['KeyW']) u.y -= u.speed;
                if (u.id === 'L1' && keys['KeyS']) u.y += u.speed;
                if (u.id === 'L2' && keys['KeyR']) u.y -= u.speed;
                if (u.id === 'L2' && keys['KeyF']) u.y += u.speed;
                if (u.id === 'R1' && keys['ArrowUp']) u.y -= u.speed;
                if (u.id === 'R1' && keys['ArrowDown']) u.y += u.speed;
                if (u.id === 'R2' && keys['PageUp']) u.y -= u.speed;
                if (u.id === 'R2' && keys['PageDown']) u.y += u.speed;
            } else {
                let drift = (Math.random() - 0.5) * TYPES[u.type].jitter;
                if (u.y + u.h/2 < u.targetY + drift) u.y += u.speed;
                else if (u.y + u.h/2 > u.targetY + drift) u.y -= u.speed;
            }
            u.y = Math.max(0, Math.min(400 - u.h, u.y));
        });

        ball.x += ball.vx; ball.y += ball.vy;
        if (ball.y <= 0 || ball.y >= 390) { 
            ball.vy *= -1; 
            units.forEach(u => u.targetY = predict(u));
        }

        units.forEach(u => {
            if (ball.x < u.x + u.w && ball.x + ball.size > u.x && ball.y < u.y + u.h && ball.y + ball.size > u.y) {
                ball.speed += 0.4;
                ball.vx = (u.side === 'L' ? 1 : -1) * ball.speed;
                ball.vy = (ball.y - (u.y + u.h/2)) * 0.35;
                units.forEach(unit => unit.targetY = predict(unit));
            }
        });

        if (ball.x < 0) { score.p2++; document.getElementById('s2').innerText = score.p2; resetBall(); }
        if (ball.x > 700) { score.p1++; document.getElementById('s1').innerText = score.p1; resetBall(); }
    }

    function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(0, 0, 700, 400);
        units.forEach(u => {
            ctx.shadowBlur = 10; ctx.shadowColor = u.color;
            ctx.fillStyle = u.color;
            ctx.fillRect(u.x, u.y, u.w, u.h);
        });
        ctx.fillStyle = '#fff'; ctx.fillRect(ball.x, ball.y, ball.size, ball.size);
    }

    function loop() {
        if (!gameActive) return;
        update(); draw();
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
