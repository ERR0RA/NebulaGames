<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON_PONG | MOBILE_OVERLOAD</title>
    <style>
        :root { 
            --neon: #0f0; --alpha: #0ff; --neon-p: #f0f; --king: #ff3333;
            --bg: #050508; 
        }
        * { box-sizing: border-box; touch-action: none; }
        body { 
            background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; 
            margin: 0; overflow: hidden; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh;
        }
        
        canvas { 
            background: #000; 
            box-shadow: 0 0 50px rgba(0,0,0,1);
            display: none; width: 100%; height: auto; max-height: 70vh;
        }
        
        .menu { 
            text-align: center; border: 1px solid rgba(0,255,136,0.3); padding: 20px; 
            background: rgba(5, 5, 10, 0.95); backdrop-filter: blur(10px);
            width: 95%; max-width: 800px; z-index: 20; max-height: 95vh; overflow-y: auto;
        }
        
        .config-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 20px; }
        @media (min-width: 600px) { .config-grid { grid-template-columns: repeat(3, 1fr); } }

        .team-panel { border: 1px solid rgba(255,255,255,0.05); padding: 10px; background: rgba(255,255,255,0.02); }
        
        h1 { font-size: 1.5rem; letter-spacing: 5px; text-shadow: 0 0 15px var(--neon); }
        
        select, button { 
            background: #111; color: #fff; border: 1px solid #333; 
            width: 100%; padding: 12px; font-family: monospace; margin-top: 5px; font-size: 14px;
        }
        
        .btn-start { 
            background: var(--neon); color: #000; font-weight: 800; 
            padding: 15px; letter-spacing: 3px; border: none; cursor: pointer;
        }

        #ui { 
            position: absolute; top: 10px; font-size: 1.2rem;
            background: rgba(0,0,0,0.8); padding: 5px 20px; border-radius: 20px;
            display: none; z-index: 15; border: 1px solid rgba(0,255,136,0.2);
        }

        .mobile-hint { font-size: 0.6rem; color: #444; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="ui">
        <span id="s1" style="color:var(--alpha)">0</span> 
        <span style="color:#444;"> : </span> 
        <span id="s2" style="color:var(--neon-p)">0</span>
    </div>

    <div id="menu" class="menu">
        <h1>NEON_PONG</h1>
        <div class="config-grid">
            <div class="team-panel">
                <h3 style="color:var(--neon); font-size: 0.7rem;">MODE</h3>
                <select id="gameMode">
                    <option value="STD">DUAL_SIM</option>
                    <option value="SURVIVAL">HELL_MODE</option>
                    <option value="BOSS">KING_1v4</option>
                </select>
            </div>
            <div class="team-panel">
                <h3 style="color:var(--alpha); font-size: 0.7rem;">LEFT_CORES</h3>
                <select id="L1" class="bot-sel"></select>
                <select id="L2" class="bot-sel"></select>
            </div>
            <div class="team-panel">
                <h3 style="color:var(--neon-p); font-size: 0.7rem;">RIGHT_CORES</h3>
                <select id="R1" class="bot-sel"></select>
                <select id="R2" class="bot-sel"></select>
            </div>
        </div>
        <button class="btn-start" onclick="initGame()">BOOT_CORE</button>
        <div class="mobile-hint">PC: WASD/Arrows | MOBILE: Touch Sides</div>
    </div>

    <canvas id="pong" width="1200" height="600"></canvas>

<script>
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');
    let score = { p1: 0, p2: 0 }, keys = {};
    let touchPos = { L: null, R: null };
    let gameActive = false, units = [], particles = [], balls = [], frameCount = 0;

    const TYPES = {
        ALPHA:  { speed: 12, jitter: 0, color: '#00ffff', h: 80, predict: true },
        NEON:   { speed: 18, jitter: 4, color: '#ff00ff', h: 60, predict: true },
        BETA:   { speed: 7, jitter: 12, color: '#00aa66', h: 85, predict: true },
        OMNI:   { speed: 8.5, jitter: 1, color: '#0f0', h: 80, predict: true },
        TANK:   { speed: 5, jitter: 0, color: '#0cf', h: 180, predict: false },
        KING:   { speed: 14, jitter: 0, color: '#f33', h: 350, predict: true },
        PLAYER: { speed: 12, jitter: 0, color: '#fff', h: 80, predict: false }
    };

    // Populate Menus
    document.querySelectorAll('.bot-sel').forEach(sel => {
        Object.keys(TYPES).forEach(k => { if(k!=='KING') sel.add(new Option(k+(k==='PLAYER'?'_USER':'_BOT'), k)); });
        if(sel.id.includes('2')) { sel.prepend(new Option("--EMPTY--", "NONE")); sel.value = "NONE"; }
    });

    // Inputs
    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;
    
    canvas.addEventListener('touchstart', handleTouch, {passive: false});
    canvas.addEventListener('touchmove', handleTouch, {passive: false});
    canvas.addEventListener('touchend', e => { touchPos = { L: null, R: null }; });

    function handleTouch(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        for(let t of e.touches) {
            let x = (t.clientX - rect.left) / rect.width * 1200;
            let y = (t.clientY - rect.top) / rect.height * 600;
            if(x < 600) touchPos.L = y; else touchPos.R = y;
        }
    }

    function initGame() {
        units = []; balls = []; particles = [];
        let mode = document.getElementById('gameMode').value;
        const config = { L: [document.getElementById('L1').value, document.getElementById('L2').value], R: [document.getElementById('R1').value, document.getElementById('R2').value] };

        if(mode === "BOSS") {
            units.push({ x: 1150, y: 125, side: 'R', type: 'KING', h: 350, w: 25, speed: 5, color: '#f33', id: 'BOSS' });
            config.L.forEach((t, i) => { if(t!=='NONE') units.push({ x: i===0?30:250, y: 250, side:'L', type:t, h:TYPES[t].h, w:12, speed:TYPES[t].speed, color:TYPES[t].color, id:'L'+i }); });
        } else {
            ['L','R'].forEach(s => config[s].forEach((t,i) => { 
                if(t!=='NONE') units.push({ x: s==='L'?(i===0?30:250):(i===0?1158:938), y: 250, side: s, type: t, h: TYPES[t].h, w: 12, speed: TYPES[t].speed, color: TYPES[t].color, id: s+i });
            }));
        }

        document.getElementById('menu').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
        canvas.style.display = 'block';
        gameActive = true;
        spawnBall();
        loop();
    }

    function spawnBall() {
        let s = 10 + (score.p1 + score.p2)*0.2;
        balls.push({ x: 600, y: 300, vx: Math.random()>0.5?s:-s, vy: (Math.random()-0.5)*10, size: 10, speed: s });
    }

    function update() {
        frameCount++;
        units.forEach(u => {
            if(u.type === 'PLAYER') {
                if(u.side === 'L') {
                    if(keys['KeyW'] || (touchPos.L && touchPos.L < u.y + u.h/2)) u.y -= u.speed;
                    if(keys['KeyS'] || (touchPos.L && touchPos.L > u.y + u.h/2)) u.y += u.speed;
                } else {
                    if(keys['ArrowUp'] || (touchPos.R && touchPos.R < u.y + u.h/2)) u.y -= u.speed;
                    if(keys['ArrowDown'] || (touchPos.R && touchPos.R > u.y + u.h/2)) u.y += u.speed;
                }
            } else {
                let b = balls[0];
                let ty = (u.side==='L'&&b.vx>0) || (u.side==='R'&&b.vx<0) ? 300 : b.y;
                let drift = (Math.random()-0.5) * (TYPES[u.type].jitter || 0);
                if(u.y+u.h/2 < ty + drift) u.y += u.speed;
                else if(u.y+u.h/2 > ty + drift) u.y -= u.speed;
            }
            u.y = Math.max(0, Math.min(600-u.h, u.y));
        });

        balls.forEach(b => {
            b.x += b.vx; b.y += b.vy;
            if(b.y<=0 || b.y>=590) b.vy *= -1;
            units.forEach(u => {
                if(b.x < u.x+u.w && b.x+b.size > u.x && b.y < u.y+u.h && b.y+b.size > u.y) {
                    b.vx = (u.side==='L'?1:-1) * Math.abs(b.speed);
                    b.vy = (b.y - (u.y+u.h/2)) * 0.4;
                    b.speed += 0.2;
                }
            });
            if(b.x < 0) { score.p2++; reset(); }
            if(b.x > 1200) { score.p1++; reset(); }
        });
    }

    function reset() { balls = []; spawnBall(); document.getElementById('s1').innerText = score.p1; document.getElementById('s2').innerText = score.p2; }

    function draw() {
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,1200,600);
        ctx.strokeStyle = 'rgba(0,255,0,0.1)'; ctx.strokeRect(600,0,1,600);
        units.forEach(u => {
            ctx.shadowBlur = 15; ctx.shadowColor = u.color; ctx.fillStyle = u.color;
            ctx.fillRect(u.x, u.y, u.w, u.h);
        });
        balls.forEach(b => {
            ctx.shadowBlur = 10; ctx.shadowColor = '#fff'; ctx.fillStyle = '#fff';
            ctx.fillRect(b.x, b.y, b.size, b.size);
        });
    }

    function loop() { if(!gameActive) return; update(); draw(); requestAnimationFrame(loop); }
</script>
</body>
</html>
