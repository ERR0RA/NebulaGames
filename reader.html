<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA | Sparx Reader Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff88; --bg: #050608; --surface: #0d1117; --border: #30363d; --danger: #ff4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: #fff; padding: 20px; transition: 0.1s; }
        
        /* Panic Mode Style */
        body.panic { filter: brightness(0); background: #000; }

        .app-wrapper { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
        
        .main-engine { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 30px; border-top: 4px solid var(--primary); }
        
        h1 { font-size: 1.2rem; letter-spacing: 6px; color: var(--primary); margin-bottom: 25px; display: flex; justify-content: space-between; }
        
        .input-group { margin-bottom: 20px; }
        label { font-size: 0.65rem; color: #666; text-transform: uppercase; margin-bottom: 8px; display: block; letter-spacing: 1px; }
        
        input, textarea { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 12px; padding: 15px; font-size: 0.85rem; transition: 0.3s; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }

        .mode-row { display: flex; gap: 8px; margin-bottom: 20px; }
        .mode-btn { flex: 1; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: #555; border-radius: 10px; font-size: 0.65rem; font-weight: 800; cursor: pointer; }
        .mode-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(0, 255, 136, 0.05); }

        .btn-solve { width: 100%; padding: 18px; background: var(--primary); color: #000; border: none; border-radius: 14px; font-weight: 900; letter-spacing: 2px; cursor: pointer; margin-top: 10px; }
        
        .output-panel { margin-top: 25px; padding: 20px; background: #000; border-radius: 15px; border-left: 4px solid var(--primary); display: none; }
        
        .side-panel { display: flex; flex-direction: column; gap: 15px; }
        .info-card { background: var(--surface); border: 1px solid var(--border); padding: 15px; border-radius: 15px; font-size: 0.75rem; }
        .info-card h4 { color: var(--primary); margin-bottom: 8px; font-size: 0.7rem; }
        
        .panic-btn { background: var(--danger); color: white; padding: 10px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; margin-top: auto; width: 100%; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="main-engine">
        <h1>NEBULA.SOLVER <span>v9.2</span></h1>

        <div class="mode-row">
            <button class="mode-btn active" onclick="setMode('Inference', this)">INFERENCE</button>
            <button class="mode-btn" onclick="setMode('Literal', this)">LITERAL</button>
            <button class="mode-btn" onclick="setMode('Vocab', this)">VOCAB</button>
        </div>

        <div class="input-group">
            <label>Keyword from Extract (Anchor)</label>
            <input type="text" id="anchorInput" placeholder="Type the main subject/name you see...">
        </div>

        <div class="input-group">
            <label>The Question (Fragment)</label>
            <textarea id="questionInput" style="height: 60px;" placeholder="What is being asked?"></textarea>
        </div>

        <button class="btn-solve" onclick="runSolver()">EXECUTE HEURISTICS</button>

        <div id="solverOutput" class="output-panel">
            <h4 style="color: var(--primary); margin-bottom: 10px;">ANALYSIS COMPLETE:</h4>
            <p id="resultText" style="line-height: 1.6; font-size: 0.9rem;"></p>
        </div>
    </div>

    <div class="side-panel">
        <div class="info-card">
            <h4>QUICK BYPASS TIPS</h4>
            <p>1. If copy-paste is blocked, focus on the <b>first word</b> of the 3rd paragraph.</p>
            <p style="margin-top:8px;">2. Answers are 80% likely to be in the <b>same tense</b> as the question.</p>
        </div>

        <div class="info-card" id="historyCard">
            <h4>DATA NODES</h4>
            <div id="recentNodes" style="color: #666;">No recent logs...</div>
        </div>

        <button class="panic-btn" onclick="triggerPanic()">PANIC MODE (ESC)</button>
        <p style="font-size: 0.6rem; color: #444; text-align: center;">Press ESC to blackout screen</p>
    </div>
</div>

<script>
    let currentMode = 'Inference';

    function setMode(mode, btn) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function triggerPanic() {
        document.body.classList.toggle('panic');
    }

    // Shortcut for Panic Mode
    window.addEventListener('keydown', (e) => {
        if (e.key === "Escape") triggerPanic();
    });

    function runSolver() {
        const anchor = document.getElementById('anchorInput').value.trim();
        const question = document.getElementById('questionInput').value.trim();
        const out = document.getElementById('solverOutput');
        const res = document.getElementById('resultText');

        if(!anchor) return;

        out.style.display = 'block';
        
        const logic = {
            'Inference': `Scan for <b>"${anchor}"</b>. Look for the sentence containing a feeling (sad, happy, angry). If the question asks 'why', the answer is usually in the sentence <i>before</i> "${anchor}".`,
            'Literal': `Scan for <b>"${anchor}"</b>. Look for a date, color, or specific object name within 10 words of it. This is a direct fact-check question.`,
            'Vocab': `Find <b>"${anchor}"</b>. Replace it with each option. The correct option will not change the overall 'vibe' of the sentence.`
        };

        res.innerHTML = logic[currentMode];

        // Save to Data Nodes
        let nodes = JSON.parse(localStorage.getItem('neb_nodes') || '[]');
        nodes.unshift(anchor.toUpperCase());
        if(nodes.length > 5) nodes.pop();
        localStorage.setItem('neb_nodes', JSON.stringify(nodes));
        updateNodes();
    }

    function updateNodes() {
        const nodes = JSON.parse(localStorage.getItem('neb_nodes') || '[]');
        document.getElementById('recentNodes').innerHTML = nodes.map(n => `<div>> ${n}</div>`).join('');
    }

    window.onload = updateNodes;
</script>
</body>
</html>
