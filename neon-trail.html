<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON-GRID | Bot Empire</title>
    <style>
        body { 
            background: #000; color: #0f0; font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; overflow: hidden; touch-action: none;
        }
        canvas { border: 4px solid #004400; box-shadow: 0 0 20px #004400; background: #050505; max-width: 90vw; height: auto; }
        #ui { text-align: center; width: 600px; margin-bottom: 10px; }
        .setup-panel { background: rgba(0,20,0,0.9); padding: 10px; border: 1px solid #0f0; margin-top: 10px; border-radius: 5px; }
        .meters { display: flex; justify-content: space-between; width: 100%; margin: 5px 0; }
        .meter-container { width: 45%; background: #111; border: 1px solid #333; height: 8px; }
        .fill { height: 100%; width: 100%; transition: width 0.1s; }
        #p1-fill { background: #0f0; } #p2-fill { background: #f00; }
        #msg { position: absolute; font-size: 3rem; font-weight: bold; pointer-events: none; z-index: 10; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        select, button { 
            background: #000; color: #0f0; border: 1px solid #0f0; padding: 5px; 
            cursor: pointer; font-family: 'Courier New'; font-weight: bold; outline: none;
        }
        button:hover { background: #0f0; color: #000; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="score">P1: 0 | P2: 0</div>
        <div class="meters">
            <div class="meter-container"><div id="p1-fill" class="fill"></div></div>
            <div class="meter-container"><div id="p2-fill" class="fill"></div></div>
        </div>
        
        <div class="setup-panel">
            <label>MODE:</label>
            <select id="gameMode">
                <option value="pvp">HUMAN vs HUMAN</option>
                <option value="pve" selected>HUMAN vs BOT</option>
            </select>
            
            <label>BOT TYPE:</label>
            <select id="botType">
                <option value="king">KING (Impossible)</option>
                <option value="alpha">ALPHA (Hard)</option>
                <option value="glitch">GLITCH (Random)</option>
                <option value="noob">NOOB (Easy)</option>
            </select>
            <button id="startBtn">NEW GAME</button>
        </div>
    </div>

    <div id="msg"></div>
    <canvas id="game" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const msg = document.getElementById('msg');
        const scoreUI = document.getElementById('score');
        const startBtn = document.getElementById('startBtn');

        const UNIT = 4;
        let score = { p1: 0, p2: 0 };
        let grid, p1, p2, gameActive = false;

        startBtn.onclick = () => { startBtn.blur(); reset(); };

        function reset() {
            p1 = { x: 100, y: 200, dx: UNIT, dy: 0, color: '#0f0', trail: [], boost: 100, isBoosting: false };
            p2 = { x: 500, y: 200, dx: -UNIT, dy: 0, color: '#f00', trail: [], boost: 100, isBoosting: false };
            grid = Array(canvas.width).fill().map(() => Array(canvas.height).fill(false));
            msg.innerText = "";
            gameActive = true;
        }

        window.addEventListener('keydown', e => {
            if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter"].includes(e.code)) e.preventDefault();
            
            // P1 Controls
            if (e.key === 'w' && p1.dy === 0) { p1.dx = 0; p1.dy = -UNIT; }
            if (e.key === 's' && p1.dy === 0) { p1.dx = 0; p1.dy = UNIT; }
            if (e.key === 'a' && p1.dx === 0) { p1.dx = -UNIT; p1.dy = 0; }
            if (e.key === 'd' && p1.dx === 0) { p1.dx = UNIT; p1.dy = 0; }
            if (e.code === 'Space') p1.isBoosting = true;

            // P2 Controls (Only if PvP)
            if (document.getElementById('gameMode').value === 'pvp') {
                if (e.key === 'ArrowUp' && p2.dy === 0) { p2.dx = 0; p2.dy = -UNIT; }
                if (e.key === 'ArrowDown' && p2.dy === 0) { p2.dx = 0; p2.dy = UNIT; }
                if (e.key === 'ArrowLeft' && p2.dx === 0) { p2.dx = -UNIT; p2.dy = 0; }
                if (e.key === 'ArrowRight' && p2.dx === 0) { p2.dx = UNIT; p2.dy = 0; }
                if (e.key === 'Enter') p2.isBoosting = true;
            }
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'Space') p1.isBoosting = false;
            if (e.key === 'Enter') p2.isBoosting = false;
        });

        function isHazard(x, y) {
            if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return true;
            return grid[x][y];
        }

        // --- BOT BRAINS ---
        function runBot() {
            const type = document.getElementById('botType').value;
            const dirs = [{dx:0,dy:-UNIT}, {dx:0,dy:UNIT}, {dx:-UNIT,dy:0}, {dx:UNIT,dy:0}];
            const valid = dirs.filter(d => !(d.dx === -p2.dx && d.dy === -p2.dy));
            
            if (type === 'noob' && Math.random() < 0.95) return; // Moves very rarely

            let best = null, maxSpace = -1;

            valid.forEach(d => {
                const nx = p2.x + d.dx, ny = p2.y + d.dy;
                if (!isHazard(nx, ny)) {
                    let lookDist = (type === 'king') ? 12 : (type === 'alpha') ? 6 : 2;
                    let s = 0;
                    // AI Scans area around potential move
                    for(let i=-lookDist; i<=lookDist; i+=UNIT) 
                        for(let j=-lookDist; j<=lookDist; j+=UNIT) 
                            if(!isHazard(nx+i, ny+j)) s++;
                    
                    if (s > maxSpace) { maxSpace = s; best = d; }
                }
            });

            if (best) {
                p2.dx = best.dx; p2.dy = best.dy;
                // King Bot uses boost to cut you off
                if (type === 'king' && Math.random() > 0.8) p2.isBoosting = true;
            }
            
            if (type === 'glitch' && Math.random() > 0.9) { // Random direction change
                let r = valid[Math.floor(Math.random()*valid.length)];
                p2.dx = r.dx; p2.dy = r.dy;
            }
        }

        function updatePlayer(p) {
            // SPEED BOOST NERF: Drains fast (3.0), Recharges slow (0.15)
            let speed = (p.isBoosting && p.boost > 5) ? 2 : 1;
            if (p.isBoosting) p.boost -= 3.0; 
            else if (p.boost < 100) p.boost += 0.15; 

            for (let i = 0; i < speed; i++) {
                p.x += p.dx; p.y += p.dy;
                if (isHazard(p.x, p.y)) return true;
                grid[p.x][p.y] = true;
                p.trail.push({x: p.x, y: p.y});
            }
            return false;
        }

        function loop() {
            if (gameActive) {
                if (document.getElementById('gameMode').value === 'pve') runBot();
                if (updatePlayer(p1)) endGame("P2 WINS!", '#f00', 'p2');
                else if (updatePlayer(p2)) endGame("P1 WINS!", '#0f0', 'p1');
                
                document.getElementById('p1-fill').style.width = p1.boost + "%";
                document.getElementById('p2-fill').style.width = p2.boost + "%";
            }
            
            ctx.fillStyle = "rgba(0,0,0,0.15)";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            [p1, p2].forEach(p => {
                ctx.fillStyle = p.color;
                p.trail.forEach(t => ctx.fillRect(t.x, t.y, UNIT, UNIT));
            });
            requestAnimationFrame(loop);
        }

        function endGame(t, c, winner) {
            gameActive = false;
            msg.innerText = t; msg.style.color = c;
            score[winner]++;
            scoreUI.innerText = `P1: ${score.p1} | P2: ${score.p2}`;
            setTimeout(reset, 2000);
        }

        reset();
        loop();
    </script>
</body>
</html>
