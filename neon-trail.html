<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON-GRID | Power-Up Evolution</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        canvas { border: 4px solid #0f0; background: #000; max-width: 95vw; max-height: 75vh; box-shadow: 0 0 20px #0f0; }
        #ui { text-align: center; width: 800px; margin-bottom: 10px; }
        .setup-panel { background: #111; padding: 15px; border: 2px solid #0f0; display: flex; gap: 15px; justify-content: center; align-items: center; }
        .meters { display: flex; justify-content: space-around; width: 100%; margin: 10px 0; }
        .meter-container { width: 30%; background: #000; border: 1px solid #333; height: 12px; }
        .fill { height: 100%; width: 100%; transition: width 0.1s; }
        #p1-fill { background: #0f0; } #p2-fill { background: #00f; } #p3-fill { background: #f00; }
        #msg { position: absolute; font-size: 3rem; font-weight: bold; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; text-shadow: 3px 3px #000; z-index: 100; }
        button, select { background: #000; color: #0f0; border: 1px solid #0f0; padding: 10px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0f0; color: #000; }
        .toggle-label { font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

<div id="ui">
    <div id="score">P1: 0 | P2: 0 | BOT: 0</div>
    <div class="meters">
        <div class="meter-container" id="p1-ui"><div id="p1-fill" class="fill"></div></div>
        <div class="meter-container" id="p2-ui"><div id="p2-fill" class="fill"></div></div>
        <div class="meter-container" id="bot-ui"><div id="p3-fill" class="fill"></div></div>
    </div>
    <div class="setup-panel">
        <select id="gameMode">
            <option value="pvpve">2 Humans vs Bot</option>
            <option value="pve">1 Human vs Bot</option>
            <option value="pvp">Human vs Human</option>
            <option value="bvb">Bot vs Bot (Spectate)</option>
        </select>
        <label class="toggle-label">
            <input type="checkbox" id="usePowerUps" checked> ENABLE POWER-UPS
        </label>
        <button id="startBtn">START MATCH</button>
    </div>
</div>

<div id="msg"></div>
<canvas id="game" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const UNIT = 5;
let grid, players, powerups = [], gameActive = false, score = {p1:0, p2:0, bot:0};
let powerupTimer = 0;

function reset() {
    const mode = document.getElementById('gameMode').value;
    grid = Array(canvas.width).fill().map(() => Array(canvas.height).fill(null));
    powerups = [];
    powerupTimer = 0;
    
    players = [
        { id: 0, x: 100, y: 200, dx: UNIT, dy: 0, color: '#0f0', trail: [], boost: 100, isBoosting: false, alive: true, active: (mode !== 'bvb'), team: 'human', ghost: 0, speedMult: 1, isBot: false },
        { id: 1, x: 100, y: 400, dx: UNIT, dy: 0, color: '#00f', trail: [], boost: 100, isBoosting: false, alive: true, active: (mode === 'pvpve' || mode === 'pvp'), team: 'human', ghost: 0, speedMult: 1, isBot: false },
        { id: 2, x: 700, y: 300, dx: -UNIT, dy: 0, color: '#f00', trail: [], boost: 100, isBoosting: false, alive: true, active: (mode !== 'pvp'), team: 'bot', ghost: 0, speedMult: 1, isBot: true }
    ];

    // Special setup for Bot vs Bot
    if (mode === 'bvb') {
        players[0].active = true;
        players[0].isBot = true; // Turn P1 into a bot
        players[0].team = 'green_bot';
        players[1].active = false;
        players[2].active = true;
    }

    if (mode === 'pvp') players[1].team = 'red';
    
    document.getElementById('p1-ui').style.visibility = players[0].active ? "visible" : "hidden";
    document.getElementById('p2-ui').style.visibility = players[1].active ? "visible" : "hidden";
    document.getElementById('bot-ui').style.visibility = players[2].active ? "visible" : "hidden";
    
    document.getElementById('msg').innerText = "READY...";
    gameActive = false;
    setTimeout(() => { document.getElementById('msg').innerText = ""; gameActive = true; }, 1000);
}

document.getElementById('startBtn').onclick = (e) => { e.target.blur(); reset(); };

window.onkeydown = e => {
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter"].includes(e.code)) e.preventDefault();
    const mode = document.getElementById('gameMode').value;
    
    // P1 Controls (Only if not a bot)
    if (players[0].active && !players[0].isBot) {
        if ((e.key === 'w' || (mode === 'pve' && e.key === 'ArrowUp')) && players[0].dy === 0) { players[0].dx = 0; players[0].dy = -UNIT; }
        if ((e.key === 's' || (mode === 'pve' && e.key === 'ArrowDown')) && players[0].dy === 0) { players[0].dx = 0; players[0].dy = UNIT; }
        if ((e.key === 'a' || (mode === 'pve' && e.key === 'ArrowLeft')) && players[0].dx === 0) { players[0].dx = -UNIT; players[0].dy = 0; }
        if ((e.key === 'd' || (mode === 'pve' && e.key === 'ArrowRight')) && players[0].dx === 0) { players[0].dx = UNIT; players[0].dy = 0; }
        if (e.code === 'Space') players[0].isBoosting = true;
    }

    // P2 Controls
    if (players[1].active) {
        if (e.key === 'ArrowUp' && players[1].dy === 0) { players[1].dx = 0; players[1].dy = -UNIT; }
        if (e.key === 'ArrowDown' && players[1].dy === 0) { players[1].dx = 0; players[1].dy = UNIT; }
        if (e.key === 'ArrowLeft' && players[1].dx === 0) { players[1].dx = -UNIT; players[1].dy = 0; }
        if (e.key === 'ArrowRight' && players[1].dx === 0) { players[1].dx = UNIT; players[1].dy = 0; }
        if (e.key === 'Enter') players[1].isBoosting = true;
    }
};

window.onkeyup = e => {
    if (e.code === 'Space') players[0].isBoosting = false;
    if (e.key === 'Enter') players[1].isBoosting = false;
};

function checkCollision(x, y, self) {
    if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return true;
    
    for (let i = powerups.length - 1; i >= 0; i--) {
        const pu = powerups[i];
        if (Math.abs(x - pu.x) < 15 && Math.abs(y - pu.y) < 15) {
            applyPowerUp(self, pu.type);
            powerups.splice(i, 1);
        }
    }

    const hitId = grid[Math.floor(x)][Math.floor(y)];
    if (hitId === null) return false;
    if (self.ghost > 0) return false;

    const owner = players[hitId];
    if (self.id === owner.id) return true;
    if (self.team === 'human' && owner.team === 'human') return false;
    return true;
}

function applyPowerUp(player, type) {
    if (type === 'ghost') player.ghost = 180;
    if (type === 'speed') {
        player.speedMult = 2;
        setTimeout(() => { player.speedMult = 1; }, 4000);
    }
    if (type === 'clear') {
        grid = Array(canvas.width).fill().map(() => Array(canvas.height).fill(null));
        players.forEach(p => p.trail = []);
    }
}

function spawnPowerUp() {
    const types = ['ghost', 'speed', 'clear'];
    const type = types[Math.floor(Math.random() * types.length)];
    powerups.push({
        x: Math.random() * (canvas.width - 60) + 30,
        y: Math.random() * (canvas.height - 60) + 30,
        type: type
    });
}

function update() {
    if (!gameActive) return;

    if (document.getElementById('usePowerUps').checked) {
        powerupTimer++;
        if (powerupTimer > 250) { spawnPowerUp(); powerupTimer = 0; }
    }

    // SHARED AI LOGIC
    players.forEach(p => {
        if (p.active && p.alive && p.isBot) {
            const checkAhead = (dx, dy, dist) => {
                for(let i=1; i<=dist; i++) {
                    let nx = p.x + dx*i, ny = p.y + dy*i;
                    if (checkCollision(nx, ny, p)) return true;
                }
                return false;
            };

            if (checkAhead(p.dx, p.dy, 8)) {
                const dirs = [{dx:0,dy:-UNIT}, {dx:0,dy:UNIT}, {dx:-UNIT,dy:0}, {dx:UNIT,dy:0}].filter(d => !(d.dx === -p.dx && d.dy === -p.dy));
                let bestDir = null, maxDist = -1;
                dirs.forEach(d => {
                    let dCount = 0;
                    while(dCount < 25 && !checkCollision(p.x + d.dx*(dCount+1), p.y + d.dy*(dCount+1), p)) { dCount++; }
                    if (dCount > maxDist) { maxDist = dCount; bestDir = d; }
                });
                if (bestDir) { p.dx = bestDir.dx; p.dy = bestDir.dy; }
            }
        }
    });

    players.forEach(p => {
        if (!p.active || !p.alive) return;
        
        if (p.ghost > 0) p.ghost--;
        let spd = (p.isBoosting && p.boost > 10) ? 2 : 1;
        spd *= p.speedMult;

        if (p.isBoosting) p.boost -= 2.5; else if (p.boost < 100) p.boost += 0.15;
        
        for (let i = 0; i < spd; i++) {
            p.x += p.dx; p.y += p.dy;
            if (checkCollision(p.x, p.y, p)) { p.alive = false; checkWinner(); return; }
            grid[Math.floor(p.x)][Math.floor(p.y)] = p.id;
            p.trail.push({x: p.x, y: p.y, isGhost: p.ghost > 0});
        }
    });

    document.getElementById('p1-fill').style.width = players[0].boost + "%";
    document.getElementById('p2-fill').style.width = players[1].boost + "%";
    document.getElementById('p3-fill').style.width = players[2].boost + "%";
}

function checkWinner() {
    const mode = document.getElementById('gameMode').value;
    const p1 = players[0], p2 = players[1], bot = players[2];
    
    if (mode === 'pvp' || mode === 'bvb') {
        if (!p1.alive && !bot.alive) endGame("DRAW!");
        else if (!p1.alive) { score.bot++; endGame(mode === 'bvb' ? "RED BOT WINS!" : "PLAYER 2 WINS!"); }
        else if (!bot.alive) { score.p1++; endGame(mode === 'bvb' ? "GREEN BOT WINS!" : "PLAYER 1 WINS!"); }
    } else {
        const humansAlive = p1.alive || (p2.active && p2.alive);
        if (!humansAlive) { score.bot++; endGame("BOT WINS!"); }
        else if (bot.active && !bot.alive) { score.p1++; endGame("HUMANS WIN!"); }
    }
}

function endGame(txt) {
    gameActive = false;
    document.getElementById('msg').innerText = txt;
    document.getElementById('score').innerText = `P1: ${score.p1} | P2: ${score.p2} | BOT: ${score.bot}`;
    setTimeout(reset, 2000);
}

function draw() {
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    powerups.forEach(pu => {
        ctx.fillStyle = pu.type === 'ghost' ? '#fff' : pu.type === 'speed' ? '#ff0' : '#0ff';
        ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle;
        ctx.fillRect(pu.x, pu.y, 12, 12);
        ctx.shadowBlur = 0;
    });

    players.forEach(p => {
        if (!p.active) return;
        p.trail.forEach(t => {
            ctx.fillStyle = t.isGhost ? '#333' : p.color;
            ctx.fillRect(t.x, t.y, UNIT, UNIT);
        });
        if (p.alive) {
            ctx.fillStyle = p.ghost > 0 ? '#fff' : p.color;
            ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
            ctx.fillRect(p.x, p.y, UNIT, UNIT);
            ctx.shadowBlur = 0;
        }
    });
    update();
    requestAnimationFrame(draw);
}
reset();
draw();
</script>
</body>
</html>
