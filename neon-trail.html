<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON-GRID | Turbo Bot</title>
    <style>
        body { 
            background: #000; color: #0f0; font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; overflow: hidden; touch-action: none;
        }
        
        canvas { 
            border: 4px solid #004400; box-shadow: 0 0 20px #004400; background: #050505;
            max-width: 95vw; height: auto; touch-action: none;
        }

        #ui { margin-bottom: 10px; text-align: center; width: 600px; position: relative;}
        h1 { font-size: 1.5rem; margin: 5px 0; letter-spacing: 4px; }
        
        .meters { display: flex; justify-content: space-between; width: 100%; margin-top: 5px; }
        .meter-container { width: 45%; background: #111; border: 1px solid #333; height: 10px; position: relative; }
        .fill { height: 100%; width: 100%; transition: width 0.1s; }
        #p1-fill { background: #0f0; box-shadow: 0 0 10px #0f0; }
        #p2-fill { background: #f00; box-shadow: 0 0 10px #f00; }

        #msg { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; font-weight: bold; pointer-events: none; z-index: 10;
        }

        button.btn {
            background: #000; color: #0f0; border: 1px solid #0f0;
            padding: 5px 15px; cursor: pointer; font-family: 'Courier New';
            margin-top: 5px; font-weight: bold;
        }
        .active-bot { color: #f00 !important; border-color: #f00 !important; }

        .controls-hint { font-size: 0.7rem; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>NEON_GRID_TURBO</h1>
        <div id="score">P1: 0 | P2: 0</div>
        
        <div class="meters">
            <div class="meter-container"><div id="p1-fill" class="fill"></div></div>
            <div class="meter-container"><div id="p2-fill" class="fill"></div></div>
        </div>

        <button class="btn" id="botToggle">BOT: OFF</button>
        <div class="controls-hint">P1: WASD + SPACE (Turbo) | P2: ARROWS + ENTER (Turbo)</div>
    </div>

    <div id="msg"></div>
    <canvas id="game" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const msg = document.getElementById('msg');
        const scoreUI = document.getElementById('score');
        const botBtn = document.getElementById('botToggle');

        const UNIT = 4;
        const TURBO_SPEED = 2; // Multiplier
        let score = { p1: 0, p2: 0 };
        let grid = [];
        let p1, p2, gameActive = true;
        let botEnabled = false;

        botBtn.onclick = () => {
            botEnabled = !botEnabled;
            botBtn.innerText = botEnabled ? "BOT: HARD AI" : "BOT: OFF";
            botBtn.classList.toggle('active-bot');
            reset();
        };

        function reset() {
            p1 = { x: 100, y: 200, dx: UNIT, dy: 0, color: '#0f0', trail: [], boost: 100, isBoosting: false };
            p2 = { x: 500, y: 200, dx: -UNIT, dy: 0, color: '#f00', trail: [], boost: 100, isBoosting: false };
            grid = Array(canvas.width).fill().map(() => Array(canvas.height).fill(false));
            msg.innerText = "";
            gameActive = true;
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'w' && p1.dy === 0) { p1.dx = 0; p1.dy = -UNIT; }
            if (e.key === 's' && p1.dy === 0) { p1.dx = 0; p1.dy = UNIT; }
            if (e.key === 'a' && p1.dx === 0) { p1.dx = -UNIT; p1.dy = 0; }
            if (e.key === 'd' && p1.dx === 0) { p1.dx = UNIT; p1.dy = 0; }
            if (e.code === 'Space') p1.isBoosting = true;

            if (!botEnabled) {
                if (e.key === 'ArrowUp' && p2.dy === 0) { p2.dx = 0; p2.dy = -UNIT; }
                if (e.key === 'ArrowDown' && p2.dy === 0) { p2.dx = 0; p2.dy = UNIT; }
                if (e.key === 'ArrowLeft' && p2.dx === 0) { p2.dx = -UNIT; p2.dy = 0; }
                if (e.key === 'ArrowRight' && p2.dx === 0) { p2.dx = UNIT; p2.dy = 0; }
                if (e.key === 'Enter') p2.isBoosting = true;
            }
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'Space') p1.isBoosting = false;
            if (e.key === 'Enter') p2.isBoosting = false;
        });

        function isHazard(x, y) {
            if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return true;
            return grid[x][y];
        }

        // --- HARD AI LOGIC ---
        function runHardBot() {
            const possible = [
                {name: 'up', dx: 0, dy: -UNIT},
                {name: 'down', dx: 0, dy: UNIT},
                {name: 'left', dx: -UNIT, dy: 0},
                {name: 'right', dx: UNIT, dy: 0}
            ];

            // 1. Don't pull a 180 into yourself
            const validDirections = possible.filter(d => !(d.dx === -p2.dx && d.dy === -p2.dy));

            // 2. Flood Fill "Look-Ahead" to find biggest area
            let bestDir = null;
            let maxSpace = -1;

            validDirections.forEach(dir => {
                const nx = p2.x + dir.dx;
                const ny = p2.y + dir.dy;
                
                if (!isHazard(nx, ny)) {
                    let space = countAvailableSpace(nx, ny);
                    if (space > maxSpace) {
                        maxSpace = space;
                        bestDir = dir;
                    }
                }
            });

            if (bestDir) {
                p2.dx = bestDir.dx;
                p2.dy = bestDir.dy;
            }

            // 3. Strategic Boosting
            // Boost if Player 1 is close and in front, or if there's a huge open space
            const distToP1 = Math.abs(p2.x - p1.x) + Math.abs(p2.y - p1.y);
            p2.isBoosting = (distToP1 < 50 || maxSpace > 100) && p2.boost > 20;
        }

        // Simplified space counting (Flood fill approximation)
        function countAvailableSpace(startX, startY) {
            let count = 0;
            const step = UNIT * 2;
            // Checks a 5x5 grid around the target to see how "boxed in" it is
            for (let ox = -step; ox <= step; ox += UNIT) {
                for (let oy = -step; oy <= step; oy += UNIT) {
                    if (!isHazard(startX + ox, startY + oy)) count++;
                }
            }
            return count;
        }

        function updatePlayer(p) {
            // Handle Boost
            let currentSpeed = 1;
            if (p.isBoosting && p.boost > 0) {
                currentSpeed = TURBO_SPEED;
                p.boost -= 1.5;
            } else {
                if (p.boost < 100) p.boost += 0.3;
                p.isBoosting = false;
            }

            // Move the player based on speed iterations
            for (let i = 0; i < currentSpeed; i++) {
                p.x += p.dx;
                p.y += p.dy;

                if (isHazard(p.x, p.y)) return true; // Player died

                grid[p.x][p.y] = true;
                p.trail.push({x: p.x, y: p.y});
            }
            return false;
        }

        function update() {
            if (!gameActive) return;

            if (botEnabled) runHardBot();

            let p1Dead = updatePlayer(p1);
            let p2Dead = updatePlayer(p2);

            // Update Meters
            document.getElementById('p1-fill').style.width = p1.boost + "%";
            document.getElementById('p2-fill').style.width = p2.boost + "%";

            if (p1Dead && p2Dead) endGame("DRAW!", "#fff");
            else if (p1Dead) { score.p2++; endGame("P2 WINS!", p2.color); }
            else if (p2Dead) { score.p1++; endGame("P1 WINS!", p1.color); }
        }

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            [p1, p2].forEach(p => {
                ctx.fillStyle = p.color;
                // Draw head with glow
                ctx.shadowBlur = p.isBoosting ? 15 : 0;
                ctx.shadowColor = p.color;
                
                p.trail.forEach((t, index) => {
                    // Slight fade for older trail parts
                    if (index === p.trail.length - 1) ctx.fillRect(t.x, t.y, UNIT, UNIT);
                    else ctx.fillRect(t.x, t.y, UNIT, UNIT);
                });
                ctx.shadowBlur = 0;
            });
        }

        function endGame(text, color) {
            gameActive = false;
            msg.innerText = text;
            msg.style.color = color;
            scoreUI.innerText = `P1: ${score.p1} | P2: ${score.p2}`;
            setTimeout(reset, 2000);
        }

        function loop() {
            update();
            draw();
            // Faster loop for better boost responsiveness
            setTimeout(() => requestAnimationFrame(loop), 30);
        }

        reset();
        loop();
    </script>
</body>
</html>
