<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON-GRID | XL Co-op Fix</title>
    <style>
        body { 
            background: #000; color: #0f0; font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; overflow: hidden;
        }
        canvas { border: 4px solid #0f0; background: #000; max-width: 95vw; max-height: 75vh; box-shadow: 0 0 20px #0f0; }
        #ui { text-align: center; width: 800px; margin-bottom: 10px; }
        .setup-panel { background: #111; padding: 15px; border: 2px solid #0f0; display: flex; gap: 10px; justify-content: center; }
        .meters { display: flex; justify-content: space-around; width: 100%; margin: 10px 0; }
        .meter-container { width: 30%; background: #000; border: 1px solid #333; height: 12px; }
        .fill { height: 100%; width: 100%; transition: width 0.1s; }
        #p1-fill { background: #0f0; } #p2-fill { background: #00f; } #p3-fill { background: #f00; }
        #msg { position: absolute; font-size: 3rem; font-weight: bold; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; text-shadow: 3px 3px #000; z-index: 100; }
        button, select { background: #000; color: #0f0; border: 1px solid #0f0; padding: 10px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0f0; color: #000; }
    </style>
</head>
<body>

<div id="ui">
    <div id="score">P1: 0 | P2: 0 | BOT: 0</div>
    <div class="meters">
        <div class="meter-container"><div id="p1-fill" class="fill"></div></div>
        <div class="meter-container" id="p2-ui"><div id="p2-fill" class="fill"></div></div>
        <div class="meter-container" id="bot-ui"><div id="p3-fill" class="fill"></div></div>
    </div>
    <div class="setup-panel">
        <select id="gameMode">
            <option value="pvpve" selected>Human + Human vs Bot</option>
            <option value="pve">1 Player vs Bot</option>
            <option value="pvp">Human vs Human</option>
        </select>
        <select id="botType">
            <option value="king">KING BOT</option>
            <option value="alpha">ALPHA BOT</option>
        </select>
        <button id="startBtn">START MATCH</button>
    </div>
</div>

<div id="msg"></div>
<canvas id="game" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const UNIT = 5;
let grid, players, gameActive = false, score = {p1:0, p2:0, bot:0};

function reset() {
    const mode = document.getElementById('gameMode').value;
    // The grid now stores WHICH player owns the trail
    grid = Array(canvas.width).fill().map(() => Array(canvas.height).fill(null));
    
    players = [
        { id: 0, x: 100, y: 200, dx: UNIT, dy: 0, color: '#0f0', trail: [], boost: 100, isBoosting: false, alive: true, active: true, team: 'human' },
        { id: 1, x: 100, y: 400, dx: UNIT, dy: 0, color: '#00f', trail: [], boost: 100, isBoosting: false, alive: true, active: (mode !== 'pve'), team: 'human' },
        { id: 2, x: 700, y: 300, dx: -UNIT, dy: 0, color: '#f00', trail: [], boost: 100, isBoosting: false, alive: true, active: (mode !== 'pvp'), team: 'bot' }
    ];

    if (mode === 'pvp') players[1].team = 'red'; // In PvP, humans are enemies
    
    document.getElementById('p2-ui').style.visibility = players[1].active ? "visible" : "hidden";
    document.getElementById('bot-ui').style.visibility = players[2].active ? "visible" : "hidden";
    
    document.getElementById('msg').innerText = "READY...";
    gameActive = false;
    setTimeout(() => { document.getElementById('msg').innerText = ""; gameActive = true; }, 1000);
}

document.getElementById('startBtn').onclick = (e) => { e.target.blur(); reset(); };

window.onkeydown = e => {
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter"].includes(e.code)) e.preventDefault();
    const mode = document.getElementById('gameMode').value;
    // P1
    if ((e.key === 'w' || (mode === 'pve' && e.key === 'ArrowUp')) && players[0].dy === 0) { players[0].dx = 0; players[0].dy = -UNIT; }
    if ((e.key === 's' || (mode === 'pve' && e.key === 'ArrowDown')) && players[0].dy === 0) { players[0].dx = 0; players[0].dy = UNIT; }
    if ((e.key === 'a' || (mode === 'pve' && e.key === 'ArrowLeft')) && players[0].dx === 0) { players[0].dx = -UNIT; players[0].dy = 0; }
    if ((e.key === 'd' || (mode === 'pve' && e.key === 'ArrowRight')) && players[0].dx === 0) { players[0].dx = UNIT; players[0].dy = 0; }
    if (e.code === 'Space') players[0].isBoosting = true;
    // P2
    if (players[1].active) {
        if (e.key === 'ArrowUp' && players[1].dy === 0) { players[1].dx = 0; players[1].dy = -UNIT; }
        if (e.key === 'ArrowDown' && players[1].dy === 0) { players[1].dx = 0; players[1].dy = UNIT; }
        if (e.key === 'ArrowLeft' && players[1].dx === 0) { players[1].dx = -UNIT; players[1].dy = 0; }
        if (e.key === 'ArrowRight' && players[1].dx === 0) { players[1].dx = UNIT; players[1].dy = 0; }
        if (e.key === 'Enter') players[1].isBoosting = true;
    }
};

window.onkeyup = e => {
    if (e.code === 'Space') players[0].isBoosting = false;
    if (e.key === 'Enter') players[1].isBoosting = false;
};

function update() {
    if (!gameActive) return;

    players.forEach(p => {
        if (!p.active || !p.alive) return;
        let spd = (p.isBoosting && p.boost > 10) ? 2 : 1;
        if (p.isBoosting) p.boost -= 2.5; else if (p.boost < 100) p.boost += 0.15;

        for (let i = 0; i < spd; i++) {
            p.x += p.dx; p.y += p.dy;
            
            // Wall Collision
            if (p.x < 0 || p.x >= canvas.width || p.y < 0 || p.y >= canvas.height) { p.alive = false; checkWinner(); return; }

            const hitOwnerId = grid[p.x][p.y];
            if (hitOwnerId !== null) {
                // TEAM CHECK: In Co-op, ignore collisions with teammate's trail
                const hitOwner = players[hitOwnerId];
                if (p.team !== hitOwner.team) {
                    p.alive = false;
                    checkWinner();
                    return;
                }
            }
            grid[p.x][p.y] = p.id;
            p.trail.push({x: p.x, y: p.y});
        }
    });

    // Bot AI
    const bot = players[2];
    if (bot.active && bot.alive) {
        const hX = bot.x + bot.dx, hY = bot.y + bot.dy;
        if (hX < 0 || hX >= canvas.width || hY < 0 || hY >= canvas.height || (grid[hX][hY] !== null && players[grid[hX][hY]].team !== 'bot')) {
            const dirs = [{dx:0,dy:-UNIT}, {dx:0,dy:UNIT}, {dx:-UNIT,dy:0}, {dx:UNIT,dy:0}].filter(d => !(d.dx === -bot.dx && d.dy === -bot.dy));
            const choice = dirs.find(d => {
                const nx = bot.x + d.dx, ny = bot.y + d.dy;
                return nx >= 0 && nx < canvas.width && ny >= 0 && ny < canvas.height && grid[nx][ny] === null;
            });
            if (choice) { bot.dx = choice.dx; bot.dy = choice.dy; }
        }
    }

    document.getElementById('p1-fill').style.width = players[0].boost + "%";
    document.getElementById('p2-fill').style.width = players[1].boost + "%";
    document.getElementById('p3-fill').style.width = players[2].boost + "%";
}

function checkWinner() {
    const mode = document.getElementById('gameMode').value;
    const p1 = players[0], p2 = players[1], bot = players[2];
    if (mode === 'pvp') {
        if (!p1.alive) { score.p2++; endGame("PLAYER 2 WINS!"); }
        else if (!p2.alive) { score.p1++; endGame("PLAYER 1 WINS!"); }
    } else {
        const humansAlive = p1.alive || (p2.active && p2.alive);
        if (!humansAlive) { score.bot++; endGame("BOT WINS!"); }
        else if (bot.active && !bot.alive) { score.p1++; endGame("HUMANS WIN!"); }
    }
}

function endGame(txt) {
    gameActive = false;
    document.getElementById('msg').innerText = txt;
    document.getElementById('score').innerText = `P1: ${score.p1} | P2: ${score.p2} | BOT: ${score.bot}`;
    setTimeout(reset, 2000);
}

function draw() {
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    players.forEach(p => {
        if (!p.active) return;
        ctx.fillStyle = p.color;
        p.trail.forEach(t => ctx.fillRect(t.x, t.y, UNIT, UNIT));
        if (p.alive) {
            ctx.shadowBlur = 10; ctx.shadowColor = p.color;
            ctx.fillRect(p.x, p.y, UNIT, UNIT);
            ctx.shadowBlur = 0;
        }
    });
    update();
    requestAnimationFrame(draw);
}

reset();
draw();
</script>
</body>
</html>
