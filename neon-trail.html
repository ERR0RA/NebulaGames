<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON-GRID | Fixed Focus</title>
    <style>
        body { 
            background: #000; color: #0f0; font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; overflow: hidden; touch-action: none;
        }
        canvas { 
            border: 4px solid #004400; box-shadow: 0 0 20px #004400; background: #050505;
            max-width: 95vw; height: auto;
        }
        #ui { margin-bottom: 10px; text-align: center; width: 600px; }
        .meters { display: flex; justify-content: space-between; width: 100%; margin-top: 5px; }
        .meter-container { width: 45%; background: #111; border: 1px solid #333; height: 10px; }
        .fill { height: 100%; width: 100%; transition: width 0.1s; }
        #p1-fill { background: #0f0; box-shadow: 0 0 10px #0f0; }
        #p2-fill { background: #f00; box-shadow: 0 0 10px #f00; }
        #msg { position: absolute; font-size: 3rem; font-weight: bold; pointer-events: none; z-index: 10; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        button.btn {
            background: #000; color: #0f0; border: 1px solid #0f0;
            padding: 8px 20px; cursor: pointer; font-family: 'Courier New';
            margin-top: 10px; font-weight: bold; outline: none;
        }
        .active-bot { color: #f00 !important; border-color: #f00 !important; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="score">P1: 0 | P2: 0</div>
        <div class="meters">
            <div class="meter-container"><div id="p1-fill" class="fill"></div></div>
            <div class="meter-container"><div id="p2-fill" class="fill"></div></div>
        </div>
        <button class="btn" id="botToggle">BOT: OFF</button>
    </div>

    <div id="msg"></div>
    <canvas id="game" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const msg = document.getElementById('msg');
        const scoreUI = document.getElementById('score');
        const botBtn = document.getElementById('botToggle');

        const UNIT = 4;
        const TURBO = 2;
        let score = { p1: 0, p2: 0 };
        let grid, p1, p2, gameActive = false, botEnabled = false;

        // THE FIX: Adding .blur() ensures the button never stays "active"
        botBtn.onclick = () => {
            botEnabled = !botEnabled;
            botBtn.innerText = botEnabled ? "BOT: ACTIVE" : "BOT: OFF";
            botBtn.classList.toggle('active-bot');
            botBtn.blur(); // THIS REMOVES THE "SPACE BAR SWITCHES MODE" BUG
            reset();
        };

        function reset() {
            p1 = { x: 100, y: 200, dx: UNIT, dy: 0, color: '#0f0', trail: [], boost: 100, isBoosting: false };
            p2 = { x: 500, y: 200, dx: -UNIT, dy: 0, color: '#f00', trail: [], boost: 100, isBoosting: false };
            grid = Array(canvas.width).fill().map(() => Array(canvas.height).fill(false));
            msg.innerText = "";
            gameActive = true;
        }

        window.addEventListener('keydown', e => {
            // Block default browser actions for game keys
            if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter"].includes(e.code)) {
                e.preventDefault();
            }

            if (e.key === 'w' && p1.dy === 0) { p1.dx = 0; p1.dy = -UNIT; }
            if (e.key === 's' && p1.dy === 0) { p1.dx = 0; p1.dy = UNIT; }
            if (e.key === 'a' && p1.dx === 0) { p1.dx = -UNIT; p1.dy = 0; }
            if (e.key === 'd' && p1.dx === 0) { p1.dx = UNIT; p1.dy = 0; }
            if (e.code === 'Space') p1.isBoosting = true;

            if (!botEnabled) {
                if (e.key === 'ArrowUp' && p2.dy === 0) { p2.dx = 0; p2.dy = -UNIT; }
                if (e.key === 'ArrowDown' && p2.dy === 0) { p2.dx = 0; p2.dy = UNIT; }
                if (e.key === 'ArrowLeft' && p2.dx === 0) { p2.dx = -UNIT; p2.dy = 0; }
                if (e.key === 'ArrowRight' && p2.dx === 0) { p2.dx = UNIT; p2.dy = 0; }
                if (e.key === 'Enter') p2.isBoosting = true;
            }
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'Space') p1.isBoosting = false;
            if (e.key === 'Enter') p2.isBoosting = false;
        });

        function isHazard(x, y) {
            if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return true;
            return grid[x][y];
        }

        function runAI() {
            const dirs = [{dx:0,dy:-UNIT}, {dx:0,dy:UNIT}, {dx:-UNIT,dy:0}, {dx:UNIT,dy:0}];
            const valid = dirs.filter(d => !(d.dx === -p2.dx && d.dy === -p2.dy));
            
            let best = null, maxSpace = -1;
            valid.forEach(d => {
                const nx = p2.x + d.dx, ny = p2.y + d.dy;
                if (!isHazard(nx, ny)) {
                    let s = 0;
                    for(let i=-8; i<=8; i+=4) for(let j=-8; j<=8; j+=4) if(!isHazard(nx+i, ny+j)) s++;
                    if (s > maxSpace) { maxSpace = s; best = d; }
                }
            });
            if (best) { p2.dx = best.dx; p2.dy = best.dy; }
            p2.isBoosting = (maxSpace > 20 && p2.boost > 10);
        }

        function updatePlayer(p) {
            let speed = (p.isBoosting && p.boost > 0) ? TURBO : 1;
            if (p.isBoosting) p.boost -= 1.5; else if (p.boost < 100) p.boost += 0.4;
            
            for (let i = 0; i < speed; i++) {
                p.x += p.dx; p.y += p.dy;
                if (isHazard(p.x, p.y)) return true;
                grid[p.x][p.y] = true;
                p.trail.push({x: p.x, y: p.y});
            }
            return false;
        }

        function loop() {
            if (gameActive) {
                if (botEnabled) runAI();
                if (updatePlayer(p1)) endGame("P2 WINS!", p2.color, 'p2');
                else if (updatePlayer(p2)) endGame("P1 WINS!", p1.color, 'p1');
                
                document.getElementById('p1-fill').style.width = p1.boost + "%";
                document.getElementById('p2-fill').style.width = p2.boost + "%";
            }
            
            ctx.fillStyle = "rgba(0,0,0,0.2)";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            [p1, p2].forEach(p => {
                ctx.fillStyle = p.color;
                p.trail.forEach(t => ctx.fillRect(t.x, t.y, UNIT, UNIT));
            });
            requestAnimationFrame(loop);
        }

        function endGame(t, c, winner) {
            gameActive = false;
            msg.innerText = t;
            msg.style.color = c;
            score[winner]++;
            scoreUI.innerText = `P1: ${score.p1} | P2: ${score.p2}`;
            setTimeout(reset, 2000);
        }

        reset();
        loop();
    </script>
</body>
</html>
