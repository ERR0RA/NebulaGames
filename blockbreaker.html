<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BLOCK BREAKER ULTRA | Nebula Arcade</title>
    <style>
        :root { --neon: #00f2ff; --pink: #ff007f; --gold: #f1c40f; --bg: #050505; --red: #ff3333; }
        body {
            background: var(--bg); color: white; margin: 0;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; font-family: 'Courier New', monospace;
            overflow: hidden; touch-action: none;
            /* HIDDEN CURSOR GLOBALLY */
            cursor: none; 
        }
        #ui { width: 480px; display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1rem; text-shadow: 0 0 10px var(--neon); cursor: default; }
        #container { 
            position: relative; border: 4px solid var(--neon); 
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3); border-radius: 8px;
            overflow: hidden; background: #000;
        }
        #container::before {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(rgba(0, 242, 255, 0.1) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 242, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px; z-index: 0;
        }
        canvas { display: block; position: relative; z-index: 1; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            z-index: 10; backdrop-filter: blur(8px); cursor: default;
        }
        .btn { 
            border: 2px solid var(--neon); color: var(--neon); padding: 12px 24px; 
            background: rgba(0, 242, 255, 0.1); cursor: pointer; font: inherit; 
            margin-top: 15px; transition: 0.3s; font-weight: bold; letter-spacing: 2px;
            cursor: pointer;
        }
        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 30px var(--neon); transform: scale(1.05); }
        .stat-highlight { color: var(--pink); font-weight: bold; }
        .boss-warning { color: var(--red); animation: pulse 1s infinite; text-shadow: 0 0 15px var(--red); display: none; margin: 0; font-size: 1rem;}
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="ui">
        <div>LVL:<span id="levelDisp" class="stat-highlight">1</span> | SCR:<span id="score">0</span></div>
        <p class="boss-warning" id="bossWarning">⚠️ BOSS CORE DETECTED ⚠️</p>
        <div id="lives">❤️❤️❤️</div>
    </div>

    <div id="container">
        <canvas id="game"></canvas>
        <div id="overlay">
            <h1 id="title" style="color: var(--neon); text-shadow: 0 0 20px var(--neon); margin: 0;">BLOCK BREAKER</h1>
            <p id="sub">System optimized. Mouse cursor disabled.</p>
            <button class="btn" onclick="initGame()">BOOT SYSTEM</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score'), livesEl = document.getElementById('lives'), levelEl = document.getElementById('levelDisp');
        const bossWarning = document.getElementById('bossWarning');
        canvas.width = 480; canvas.height = 600;

        let score = 0, lives = 3, level = 1, active = false;
        let bricks = [], particles = [], balls = [], powerups = [];
        let pLasers = [], eLasers = [];
        let animId, shakeTime = 0;
        
        let boss = null;
        let shieldActive = false;
        let laserTimer = 0;
        let glitchTimer = 0;

        const paddle = { x: 200, y: 560, w: 80, h: 14, color: '#00f2ff', targetW: 80, vx: 0 };

        function createBall(x, y, isAttached) {
            const s = 6 + (level * 0.3);
            return { x, y, r: 7, vx: s, vy: -s, speed: s, attached: isAttached, trail: [] };
        }

        function initLevel() {
            bricks = []; boss = null; pLasers = []; eLasers = [];
            bossWarning.style.display = 'none';

            if (level % 3 === 0) {
                bossWarning.style.display = 'block';
                boss = { 
                    x: canvas.width/2 - 100, y: 40, w: 200, h: 80, 
                    hp: 50 + (level * 10), maxHp: 50 + (level * 10), 
                    vx: 2 + (level * 0.5), color: '#ff3333', attackTimer: 0 
                };
            } else {
                const rows = Math.min(9, 4 + level), cols = 8, padding = 8, w = 50, h = 20;
                const offsetLeft = (canvas.width - (cols * (w + padding))) / 2 + 4;
                for(let r=0; r<rows; r++) {
                    for(let c=0; c<cols; c++) {
                        bricks.push({ 
                            x: offsetLeft + c * (w + padding), y: 60 + r * (h + padding), 
                            w: w, h: h, hp: r < 2 ? 3 : r < 4 ? 2 : 1,
                            color: r < 2 ? '#ff007f' : r < 4 ? '#00f2ff' : '#f1c40f'
                        });
                    }
                }
            }
        }

        function spawnParticles(x, y, color, count=12) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x, y, color, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
                    life: 1.0, size: Math.random() * 3 + 1
                });
            }
        }

        function spawnPowerup(x, y) {
            if(Math.random() > 0.2) return; 
            const types = ['W', 'M', 'L', 'S'];
            powerups.push({ x, y, w: 24, h: 24, type: types[Math.floor(Math.random()*types.length)], vy: 3 });
        }

        function resolveCollision(ball, rect) {
            // Find closest point on rect to ball center
            let closestX = Math.max(rect.x, Math.min(ball.x, rect.x + rect.w));
            let closestY = Math.max(rect.y, Math.min(ball.y, rect.y + rect.h));
            
            let distanceX = ball.x - closestX;
            let distanceY = ball.y - closestY;
            let distanceSquared = (distanceX * distanceX) + (distanceY * distanceY);

            if (distanceSquared < (ball.r * ball.r)) {
                // Collision detected - determine side
                let overlapX = ball.r - Math.abs(distanceX);
                let overlapY = ball.r - Math.abs(distanceY);

                if (overlapX < overlapY) {
                    ball.vx *= -1;
                    ball.x += (distanceX > 0) ? overlapX : -overlapX;
                } else {
                    ball.vy *= -1;
                    ball.y += (distanceY > 0) ? overlapY : -overlapY;
                }
                return true;
            }
            return false;
        }

        function update() {
            if(!active) return;

            if (glitchTimer > 0) { glitchTimer--; paddle.targetW = 40; }
            else if (laserTimer <= 0) { paddle.targetW = 80; }
            paddle.w += (paddle.targetW - paddle.w) * 0.15;

            // Powerup Logic
            for(let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i]; p.y += p.vy;
                if(p.y + p.h > paddle.y && p.x + p.w > paddle.x && p.x < paddle.x + paddle.w) {
                    if(p.type === 'W') { paddle.targetW = 150; setTimeout(()=>paddle.targetW=80, 8000); }
                    else if(p.type === 'M' && balls.length > 0) {
                        let b = balls[0];
                        balls.push({...createBall(b.x, b.y, false), vx: -b.vx, vy: b.vy});
                    }
                    else if(p.type === 'L') { laserTimer = 400; paddle.targetW = 100; }
                    else if(p.type === 'S') { shieldActive = true; }
                    score += 100; powerups.splice(i, 1);
                } else if (p.y > canvas.height) powerups.splice(i, 1);
            }

            // Boss & Lasers
            if (boss) {
                boss.x += boss.vx;
                if (boss.x <= 0 || boss.x + boss.w >= canvas.width) boss.vx *= -1;
                boss.attackTimer++;
                if (boss.attackTimer > Math.max(15, 50 - level)) {
                    boss.attackTimer = 0;
                    eLasers.push({ x: boss.x + Math.random()*boss.w, y: boss.y + boss.h, vy: 5 });
                }
            }

            if (laserTimer > 0) {
                laserTimer--;
                if (laserTimer % 20 === 0) {
                    pLasers.push({ x: paddle.x + 5, y: paddle.y, vy: -12 });
                    pLasers.push({ x: paddle.x + paddle.w - 5, y: paddle.y, vy: -12 });
                }
            }

            // Move Lasers
            [pLasers, eLasers].forEach((list, idx) => {
                for(let i=list.length-1; i>=0; i--){
                    let l = list[i]; l.y += l.vy;
                    if (idx === 0) { // Player lasers
                        if (boss && resolveCollision({x:l.x, y:l.y, r:4}, boss)) { boss.hp--; list.splice(i,1); }
                        else {
                            bricks.forEach((b, bi) => {
                                if (l.x > b.x && l.x < b.x+b.w && l.y < b.y+b.h) {
                                    b.hp--; if(b.hp<=0) { spawnParticles(b.x+b.w/2, b.y+b.h/2, b.color); bricks.splice(bi,1); }
                                    list.splice(i,1);
                                }
                            });
                        }
                    } else { // Enemy lasers
                        if (l.y > paddle.y && l.y < paddle.y+paddle.h && l.x > paddle.x && l.x < paddle.x+paddle.w) {
                            glitchTimer = 120; shakeTime = 10; list.splice(i,1);
                        }
                    }
                    if (l && (l.y < 0 || l.y > canvas.height)) list.splice(i,1);
                }
            });

            // Ball Logic
            for(let i = balls.length - 1; i >= 0; i--) {
                let ball = balls[i];
                if(ball.attached) {
                    ball.x = paddle.x + paddle.w/2; ball.y = paddle.y - ball.r - 2;
                } else {
                    ball.trail.push({x: ball.x, y: ball.y});
                    if(ball.trail.length > 6) ball.trail.shift();
                    
                    ball.x += ball.vx; ball.y += ball.vy;

                    // Walls
                    if(ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) {
                        ball.vx *= -1; ball.x = ball.x < ball.r ? ball.r : canvas.width - ball.r;
                    }
                    if(ball.y - ball.r < 0) { ball.vy *= -1; ball.y = ball.r; }

                    // Shield
                    if (shieldActive && ball.y + ball.r > canvas.height - 15) {
                        ball.vy = -Math.abs(ball.speed); shieldActive = false;
                        spawnParticles(ball.x, ball.y, '#00f2ff', 20);
                    }

                    // Paddle Collision (Advanced Physics)
                    if (ball.y + ball.r > paddle.y && ball.y - ball.r < paddle.y + paddle.h &&
                        ball.x > paddle.x && ball.x < paddle.x + paddle.w && ball.vy > 0) {
                        
                        let intersectX = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
                        let bounceAngle = intersectX * (Math.PI / 3); // 60 degrees max
                        
                        ball.vx = ball.speed * Math.sin(bounceAngle) + (paddle.vx * 0.3);
                        ball.vy = -ball.speed * Math.cos(bounceAngle);
                        ball.y = paddle.y - ball.r;
                    }

                    if(ball.y > canvas.height) balls.splice(i, 1);
                }

                // Bricks & Boss Collision
                if (boss && resolveCollision(ball, boss)) { boss.hp--; shakeTime = 5; }
                bricks.forEach((b, bi) => {
                    if (resolveCollision(ball, b)) {
                        b.hp--; score += 20;
                        if(b.hp <= 0) {
                            spawnParticles(b.x + b.w/2, b.y + b.h/2, b.color);
                            spawnPowerup(b.x+b.w/2, b.y+b.h/2);
                            bricks.splice(bi, 1);
                        }
                    }
                });
            }

            // Win/Loss
            if (bricks.length === 0 && !boss) { level++; nextLevel(); }
            if (boss && boss.hp <= 0) { level++; nextLevel(); score += 2000; }
            if (balls.length === 0) { lives--; livesEl.innerText = "❤️".repeat(lives); if(lives<=0) gameOver(); else resetBall(); }

            particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.02; if(p.life <= 0) particles.splice(i, 1); });
            scoreEl.innerText = score;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            if(shakeTime > 0) { ctx.translate((Math.random()-0.5)*shakeTime, (Math.random()-0.5)*shakeTime); shakeTime--; }

            if(shieldActive) { ctx.fillStyle="#00f2ff33"; ctx.fillRect(0, canvas.height-10, canvas.width, 10); }

            bricks.forEach(b => {
                ctx.fillStyle = b.color; ctx.globalAlpha = b.hp * 0.3 + 0.1;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = "white"; ctx.lineWidth = 1; ctx.strokeRect(b.x, b.y, b.w, b.h);
            });
            ctx.globalAlpha = 1;

            if (boss) {
                ctx.fillStyle = "#ff3333"; ctx.shadowBlur = 20; ctx.shadowColor = "#f00";
                ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
                ctx.fillStyle = "#222"; ctx.fillRect(boss.x, boss.y-12, boss.w, 6);
                ctx.fillStyle = "#f00"; ctx.fillRect(boss.x, boss.y-12, boss.w * (boss.hp/boss.maxHp), 6);
                ctx.shadowBlur = 0;
            }

            powerups.forEach(p => {
                ctx.fillStyle = "#fff"; ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = "#000"; ctx.font = "14px Courier"; ctx.fillText(p.type, p.x+8, p.y+17);
            });

            ctx.fillStyle = "#00f2ff"; pLasers.forEach(l => ctx.fillRect(l.x, l.y, 3, 12));
            ctx.fillStyle = "#ff3333"; eLasers.forEach(l => ctx.fillRect(l.x, l.y, 4, 15));

            // Paddle
            ctx.fillStyle = glitchTimer > 0 ? "#ff3333" : "#00f2ff";
            ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle;
            ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
            ctx.shadowBlur = 0;

            // Balls
            balls.forEach(b => {
                b.trail.forEach((t, ti) => {
                    ctx.globalAlpha = ti/10; ctx.fillStyle="#fff";
                    ctx.beginPath(); ctx.arc(t.x, t.y, b.r * 0.8, 0, Math.PI*2); ctx.fill();
                });
                ctx.globalAlpha = 1; ctx.fillStyle="#fff"; ctx.shadowBlur=10; ctx.shadowColor="#fff";
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
            });

            particles.forEach(p => { ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fillRect(p.x, p.y, p.size, p.size); });
            ctx.restore();
            
            if(active) animId = requestAnimationFrame(draw);
        }

        function nextLevel() {
            active = false; resetState(); initLevel();
            setTimeout(() => { active = true; resetBall(); draw(); }, 1000);
        }

        function resetState() {
            powerups = []; pLasers = []; eLasers = []; particles = [];
            levelEl.innerText = level;
        }

        function resetBall() {
            balls = [createBall(0, 0, true)];
        }

        function gameOver() {
            active = false; document.getElementById('overlay').style.display = 'flex';
            document.getElementById('title').innerText = "SYSTEM HALTED";
            document.getElementById('sub').innerHTML = `Final Score: <span class="stat-highlight">${score}</span>`;
        }

        function initGame() {
            score = 0; lives = 3; level = 1; active = true;
            scoreEl.innerText = score; livesEl.innerText = "❤️❤️❤️";
            document.getElementById('overlay').style.display = 'none';
            resetState(); initLevel(); resetBall();
            draw();
        }

        let lastPaddleX = 0;
        function movePaddle(clientX) {
            const rect = canvas.getBoundingClientRect();
            const newX = (clientX - rect.left) - paddle.w/2;
            paddle.vx = newX - lastPaddleX;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, newX));
            lastPaddleX = paddle.x;
        }

        window.addEventListener('mousemove', e => movePaddle(e.clientX));
        window.addEventListener('touchmove', e => { e.preventDefault(); movePaddle(e.touches[0].clientX); }, {passive: false});
        window.addEventListener('mousedown', () => { if(active) balls.forEach(b => b.attached = false); });
    </script>
</body>
</html>
