<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BLOCK BREAKER ULTRA | Nebula Arcade</title>

<style>
:root { --neon: #00f2ff; --pink: #ff007f; --gold: #f1c40f; --bg: #050505; --red: #ff3333; }

body {
    background: var(--bg); color: white; margin: 0;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden; touch-action: none;

    /* ✅ FIX: hide cursor everywhere */
    cursor: none;
}

#ui {
    width: 480px; display: flex; justify-content: space-between;
    margin-bottom: 10px; font-size: 1.2rem;
    text-shadow: 0 0 10px var(--neon);
}

#container { 
    position: relative; border: 4px solid var(--neon); 
    box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
    border-radius: 8px;
    overflow: hidden; background: #000;
}

#container::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(rgba(0, 242, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.1) 1px, transparent 1px);
    background-size: 40px 40px; z-index: 0;
}

canvas { display: block; position: relative; z-index: 1; }

#overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    z-index: 10; backdrop-filter: blur(5px);
}

.btn { 
    border: 2px solid var(--neon); color: var(--neon);
    padding: 12px 24px;
    background: rgba(0, 242, 255, 0.1);
    cursor: pointer; /* keep pointer for buttons */
    font: inherit;
    margin-top: 15px;
    transition: 0.3s;
    font-weight: bold;
    letter-spacing: 2px;
}

.btn:hover {
    background: var(--neon); color: #000;
    box-shadow: 0 0 30px var(--neon);
    transform: scale(1.05);
}

.stat-highlight { color: var(--pink); font-weight: bold; }

.boss-warning {
    color: var(--red); animation: pulse 1s infinite;
    text-shadow: 0 0 15px var(--red);
    display: none; margin: 0; font-size: 1rem;
}

@keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
}
</style>
</head>

<body>

<div id="ui">
    <div>LVL: <span id="levelDisp" class="stat-highlight">1</span> | SCORE: <span id="score">0</span></div>
    <p class="boss-warning" id="bossWarning">⚠️ BOSS APPROACHING ⚠️</p>
    <div id="lives">❤️❤️❤️</div>
</div>

<div id="container">
    <canvas id="game"></canvas>

    <div id="overlay">
        <h1 id="title" style="color: var(--neon); text-shadow: 0 0 20px var(--neon);">BLOCK BREAKER</h1>
        <p id="sub">System initialized. Awaiting input.</p>
        <button class="btn" onclick="initGame()">START ENGINE</button>
    </div>
</div>

<script>
/* your JS stays EXACTLY the same */
</script>

</body>
</html>
