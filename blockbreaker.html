<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BLOCK BREAKER ULTRA</title>

<style>
body {
    margin: 0;
    background: #0b0f1a;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 10px;
    color: #00ffd5;
}

canvas {
    background: #111827;
    display: block;
    margin: 20px auto;
    border: 2px solid #00ffd5;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    background: #00ffd5;
    border: none;
    cursor: pointer;
    margin-bottom: 20px;
}
</style>
</head>

<body>

<h1>BLOCK BREAKER ULTRA</h1>
<canvas id="game" width="480" height="320"></canvas>
<br>
<button onclick="restartGame()">Restart</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let ball = {
    x: canvas.width / 2,
    y: canvas.height - 30,
    dx: 3,
    dy: -3,
    radius: 8
};

let paddle = {
    width: 80,
    height: 10,
    x: (canvas.width - 80) / 2,
    speed: 6,
    right: false,
    left: false
};

let bricks = [];
const rows = 4;
const cols = 6;
const brickW = 70;
const brickH = 20;
const padding = 10;
const offsetTop = 30;
const offsetLeft = 20;

let score = 0;

function initBricks() {
    bricks = [];
    for (let c = 0; c < cols; c++) {
        bricks[c] = [];
        for (let r = 0; r < rows; r++) {
            bricks[c][r] = { x: 0, y: 0, status: 1 };
        }
    }
}
initBricks();

document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") paddle.right = true;
    if (e.key === "ArrowLeft") paddle.left = true;
});

document.addEventListener("keyup", e => {
    if (e.key === "ArrowRight") paddle.right = false;
    if (e.key === "ArrowLeft") paddle.left = false;
});

function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#00ffd5";
    ctx.fill();
    ctx.closePath();
}

function drawPaddle() {
    ctx.fillStyle = "#ffcc00";
    ctx.fillRect(paddle.x, canvas.height - paddle.height, paddle.width, paddle.height);
}

function drawBricks() {
    for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
            if (bricks[c][r].status === 1) {
                let bx = c * (brickW + padding) + offsetLeft;
                let by = r * (brickH + padding) + offsetTop;

                bricks[c][r].x = bx;
                bricks[c][r].y = by;

                ctx.fillStyle = "#ff4d6d";
                ctx.fillRect(bx, by, brickW, brickH);
            }
        }
    }
}

function collisionDetection() {
    for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
            let b = bricks[c][r];
            if (b.status === 1) {
                if (
                    ball.x > b.x &&
                    ball.x < b.x + brickW &&
                    ball.y > b.y &&
                    ball.y < b.y + brickH
                ) {
                    ball.dy = -ball.dy;
                    b.status = 0;
                    score++;
                }
            }
        }
    }
}

function drawScore() {
    ctx.fillStyle = "white";
    ctx.font = "16px Arial";
    ctx.fillText("Score: " + score, 10, 20);
}

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBricks();
    drawBall();
    drawPaddle();
    drawScore();
    collisionDetection();

    // ball movement
    ball.x += ball.dx;
    ball.y += ball.dy;

    // wall bounce
    if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
        ball.dx = -ball.dx;
    }
    if (ball.y - ball.radius < 0) {
        ball.dy = -ball.dy;
    }

    // paddle collision
    if (
        ball.y + ball.radius > canvas.height - paddle.height &&
        ball.x > paddle.x &&
        ball.x < paddle.x + paddle.width
    ) {
        ball.dy = -ball.dy;
    }

    // lose condition
    if (ball.y > canvas.height) {
        alert("Game Over!");
        document.location.reload();
    }

    // paddle movement
    if (paddle.right && paddle.x < canvas.width - paddle.width) {
        paddle.x += paddle.speed;
    }
    if (paddle.left && paddle.x > 0) {
        paddle.x -= paddle.speed;
    }

    requestAnimationFrame(update);
}

function restartGame() {
    document.location.reload();
}

update();
</script>

</body>
</html>
