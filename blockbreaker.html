<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BLOCK BREAKER ULTRA | Nebula Arcade</title>
    <style>
        :root { --neon: #00f2ff; --pink: #ff007f; --gold: #f1c40f; --bg: #050505; --red: #ff3333; }
        
        /* HIDDEN CURSOR GLOBALLY */
        * { cursor: none !important; }

        body {
            background: var(--bg); color: white; margin: 0;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; font-family: 'Courier New', monospace;
            overflow: hidden; touch-action: none;
        }

        #ui { width: 480px; display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1rem; text-shadow: 0 0 10px var(--neon); }
        
        #container { 
            position: relative; border: 4px solid var(--neon); 
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3); border-radius: 8px;
            overflow: hidden; background: #000;
        }

        #container::before {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(rgba(0, 242, 255, 0.1) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 242, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px; z-index: 0;
        }

        canvas { display: block; position: relative; z-index: 1; }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            z-index: 10; backdrop-filter: blur(5px);
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .btn { 
            border: 2px solid var(--neon); color: var(--neon); padding: 12px 24px; 
            background: rgba(0, 242, 255, 0.1); font: inherit; 
            transition: 0.3s; font-weight: bold; letter-spacing: 2px;
        }

        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 30px var(--neon); transform: scale(1.05); }
        .stat-highlight { color: var(--pink); font-weight: bold; }
        .boss-warning { color: var(--red); animation: pulse 1s infinite; text-shadow: 0 0 15px var(--red); display: none; margin: 0; font-size: 1rem;}
        
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="ui">
        <div>LVL:<span id="levelDisp" class="stat-highlight">1</span> | SCR:<span id="score">0</span> | TOP:<span id="highScore" style="color:var(--gold)">0</span></div>
        <p class="boss-warning" id="bossWarning">⚠️ BOSS APPROACHING ⚠️</p>
        <div id="lives">❤️❤️❤️</div>
    </div>

    <div id="container">
        <canvas id="game"></canvas>
        <div id="overlay">
            <h1 id="title" style="color: var(--neon); text-shadow: 0 0 20px var(--neon);">BLOCK BREAKER</h1>
            <p id="sub">System initialized. Cursor locked.</p>
            <div class="btn-container">
                <button class="btn" onclick="initGame(1)">1 PLAYER</button>
                <button class="btn" onclick="initGame(2)">2 PLAYERS</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score'), livesEl = document.getElementById('lives'), levelEl = document.getElementById('levelDisp');
        const highDisp = document.getElementById('highScore');
        const bossWarning = document.getElementById('bossWarning');
        canvas.width = 480; canvas.height = 600;

        let score = 0, lives = 3, level = 1, active = false, gameMode = 1;
        let highScore = localStorage.getItem('blockBreakerHighScore') || 0;
        highDisp.innerText = highScore;

        let bricks = [], particles = [], balls = [], powerups = [];
        let pLasers = [], eLasers = [];
        let animId, shakeTime = 0;
        
        let boss = null;
        let shieldActive = false;
        let laserTimer = 0;
        let glitchTimer = 0;

        const baseSpeed = 6;
        
        // Setup two completely independent paddle objects
        const p1Paddle = { x: 200, y: 560, w: 80, h: 12, color: '#00f2ff', targetW: 80, prevX: 200 };
        const p2Paddle = { x: 280, y: 560, w: 80, h: 12, color: '#ff007f', targetW: 80, prevX: 280 };

        const keys = { p1Left: false, p1Right: false, p2Left: false, p2Right: false };
        const keyboardSpeed = 8;

        function createBall(x, y, vx, vy, isAttached) {
            return { x, y, r: 6, vx, vy, speed: baseSpeed + (level * 0.4), attached: isAttached, trail: [] };
        }

        function initLevel() {
            bricks = []; boss = null; pLasers = []; eLasers = [];
            bossWarning.style.display = 'none';

            if (level % 3 === 0) {
                bossWarning.style.display = 'block';
                boss = { 
                    x: canvas.width/2 - 100, y: 40, w: 200, h: 80, 
                    hp: 40 + (level * 5), maxHp: 40 + (level * 5), 
                    vx: 3 + (level * 0.5), color: '#ff3333', attackTimer: 0 
                };
            } else {
                const rows = Math.min(8, 4 + level), cols = 8, padding = 10, w = 48, h = 18;
                const offsetLeft = (canvas.width - (cols * (w + padding))) / 2 + 5;
                for(let r=0; r<rows; r++) {
                    for(let c=0; c<cols; c++) {
                        bricks.push({ 
                            x: offsetLeft + c * (w + padding), y: 50 + r * (h + padding), 
                            w: w, h: h, hp: Math.floor(3 - r/2), 
                            color: r < 2 ? '#ff007f' : r < 4 ? '#00f2ff' : '#f1c40f'
                        });
                    }
                }
            }
        }

        function spawnParticles(x, y, color, count=10) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x, y, color, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                    life: 1.0, size: Math.random() * 4 + 1
                });
            }
        }

        function spawnPowerup(x, y) {
            if(Math.random() > 0.25) return; 
            const types = ['W', 'M', 'L', 'S'];
            const type = types[Math.floor(Math.random() * types.length)];
            powerups.push({ x, y, w: 24, h: 24, type, vy: 3 });
        }

        function checkPaddlePowerup(p, pad) {
            if(p.y + p.h > pad.y && p.x + p.w > pad.x && p.x < pad.x + pad.w) {
                if(p.type === 'W') {
                    pad.targetW = 140; setTimeout(() => pad.targetW = 80, 10000);
                } else if(p.type === 'M' && balls.length > 0) {
                    let mb = balls[0];
                    balls.push(createBall(mb.x, mb.y, mb.speed, -mb.speed, false));
                    balls.push(createBall(mb.x, mb.y, -mb.speed, -mb.speed, false));
                } else if(p.type === 'L') {
                    laserTimer = 480;
                } else if(p.type === 'S') {
                    shieldActive = true;
                }
                score += 50; scoreEl.innerText = score;
                return true;
            }
            return false;
        }

        function update() {
            if(!active) return;

            // Handle Input and Boundary constraints independently
            if (gameMode === 1) {
                if (keys.p1Left || keys.p2Left) p1Paddle.x -= keyboardSpeed;
                if (keys.p1Right || keys.p2Right) p1Paddle.x += keyboardSpeed;
                
                if (p1Paddle.x < 0) p1Paddle.x = 0;
                if (p1Paddle.x + p1Paddle.w > canvas.width) p1Paddle.x = canvas.width - p1Paddle.w;
            } else {
                // Player 1 handles the Left Half
                if (keys.p1Left) p1Paddle.x -= keyboardSpeed;
                if (keys.p1Right) p1Paddle.x += keyboardSpeed;
                if (p1Paddle.x < 0) p1Paddle.x = 0;
                if (p1Paddle.x + p1Paddle.w > canvas.width / 2) p1Paddle.x = (canvas.width / 2) - p1Paddle.w;

                // Player 2 handles the Right Half
                if (keys.p2Left) p2Paddle.x -= keyboardSpeed;
                if (keys.p2Right) p2Paddle.x += keyboardSpeed;
                if (p2Paddle.x < canvas.width / 2) p2Paddle.x = canvas.width / 2;
                if (p2Paddle.x + p2Paddle.w > canvas.width) p2Paddle.x = canvas.width - p2Paddle.w;
            }

            // Powerup width animation handling
            if (glitchTimer > 0) {
                glitchTimer--;
                p1Paddle.targetW = 40; 
                p2Paddle.targetW = 40;
            }
            p1Paddle.w += (p1Paddle.targetW - p1Paddle.w) * 0.1;
            p2Paddle.w += (p2Paddle.targetW - p2Paddle.w) * 0.1;

            if (laserTimer > 0) {
                laserTimer--;
                if (laserTimer % 15 === 0) {
                    pLasers.push({ x: p1Paddle.x + 10, y: p1Paddle.y, vy: -10, color: '#00f2ff' });
                    pLasers.push({ x: p1Paddle.x + p1Paddle.w - 10, y: p1Paddle.y, vy: -10, color: '#00f2ff' });
                    if (gameMode === 2) {
                        pLasers.push({ x: p2Paddle.x + 10, y: p2Paddle.y, vy: -10, color: '#ff007f' });
                        pLasers.push({ x: p2Paddle.x + p2Paddle.w - 10, y: p2Paddle.y, vy: -10, color: '#ff007f' });
                    }
                }
            } else if (glitchTimer <= 0) {
                p1Paddle.targetW = 80;
                p2Paddle.targetW = 80;
            }

            if(bricks.length === 0 && !boss) {
                level++; lives++;
                livesEl.innerText = '❤️'.repeat(Math.min(5, lives));
                levelEl.innerText = level;
                initLevel();
                balls = [createBall(0, 0, 0, 0, true)];
            } else if (boss && boss.hp <= 0) {
                spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#ff3333', 50);
                score += 1000;
                shakeTime = 30;
                level++; lives++;
                livesEl.innerText = '❤️'.repeat(Math.min(5, lives));
                levelEl.innerText = level;
                initLevel();
                balls = [createBall(0, 0, 0, 0, true)];
            }

            // Update Powerups
            for(let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i];
                p.y += p.vy;
                
                let hit = checkPaddlePowerup(p, p1Paddle);
                if (!hit && gameMode === 2) {
                    hit = checkPaddlePowerup(p, p2Paddle);
                }
                
                if (hit || p.y > canvas.height) {
                    powerups.splice(i, 1);
                }
            }

            if (boss) {
                boss.x += boss.vx;
                if (boss.x <= 0 || boss.x + boss.w >= canvas.width) boss.vx *= -1;
                boss.attackTimer++;
                if (boss.attackTimer > 60 - (level*2)) {
                    boss.attackTimer = 0;
                    eLasers.push({ x: boss.x + Math.random()*boss.w, y: boss.y + boss.h, vy: 6, color: '#ff3333' });
                }
            }

            for (let i = pLasers.length - 1; i >= 0; i--) {
                let l = pLasers[i]; l.y += l.vy;
                let hit = false;
                if (boss && l.y < boss.y + boss.h && l.x > boss.x && l.x < boss.x + boss.w) {
                    boss.hp -= 0.5; hit = true;
                    spawnParticles(l.x, l.y, '#00f2ff', 2);
                } else {
                    for (let j = bricks.length - 1; j >= 0; j--) {
                        let b = bricks[j];
                        if (l.y < b.y + b.h && l.x > b.x && l.x < b.x + b.w) {
                            b.hp -= 1; hit = true;
                            if (b.hp <= 0) {
                                spawnParticles(b.x + b.w/2, b.y + b.h/2, b.color);
                                spawnPowerup(b.x + b.w/2, b.y + b.h/2);
                                bricks.splice(j, 1); score += 20 * level;
                            }
                            break;
                        }
                    }
                }
                if (hit || l.y < 0) pLasers.splice(i, 1);
                scoreEl.innerText = score;
            }

            for (let i = eLasers.length - 1; i >= 0; i--) {
                let l = eLasers[i]; l.y += l.vy;
                let hitP1 = (l.y + 10 > p1Paddle.y && l.x > p1Paddle.x && l.x < p1Paddle.x + p1Paddle.w);
                let hitP2 = (gameMode === 2 && l.y + 10 > p2Paddle.y && l.x > p2Paddle.x && l.x < p2Paddle.x + p2Paddle.w);
                
                if (hitP1 || hitP2) {
                    glitchTimer = 180; shakeTime = 10;
                    spawnParticles(l.x, l.y, '#ff3333', 10);
                    eLasers.splice(i, 1);
                } else if (l.y > canvas.height) { eLasers.splice(i, 1); }
            }

            for(let i = balls.length - 1; i >= 0; i--) {
                let ball = balls[i];
                if(ball.attached) {
                    ball.x = p1Paddle.x + p1Paddle.w/2; ball.y = p1Paddle.y - ball.r;
                } else {
                    ball.trail.push({x: ball.x, y: ball.y});
                    if(ball.trail.length > 5) ball.trail.shift();
                    
                    ball.x += ball.vx; 
                    ball.y += ball.vy;

                    if(ball.x + ball.r > canvas.width || ball.x - ball.r < 0) {
                        ball.vx *= -1; 
                        ball.x = ball.x < ball.r ? ball.r : canvas.width - ball.r;
                    }
                    if(ball.y - ball.r < 0) { 
                        ball.vy *= -1; 
                        ball.y = ball.r; 
                    }

                    // Check collisions against P1 Paddle
                    if(ball.y + ball.r > p1Paddle.y && ball.y - ball.r < p1Paddle.y + p1Paddle.h && ball.x > p1Paddle.x && ball.x < p1Paddle.x + p1Paddle.w) {
                        if (ball.vy > 0) {
                            let hitPos = (ball.x - (p1Paddle.x + p1Paddle.w/2)) / (p1Paddle.w/2);
                            let paddleSpeed = (p1Paddle.x - p1Paddle.prevX) * 0.5;
                            ball.vx = (hitPos * ball.speed) + paddleSpeed;
                            ball.vy = -Math.abs(ball.speed); 
                            ball.y = p1Paddle.y - ball.r; 
                        }
                    }
                    
                    // Check collisions against P2 Paddle
                    if(gameMode === 2 && ball.y + ball.r > p2Paddle.y && ball.y - ball.r < p2Paddle.y + p2Paddle.h && ball.x > p2Paddle.x && ball.x < p2Paddle.x + p2Paddle.w) {
                        if (ball.vy > 0) {
                            let hitPos = (ball.x - (p2Paddle.x + p2Paddle.w/2)) / (p2Paddle.w/2);
                            let paddleSpeed = (p2Paddle.x - p2Paddle.prevX) * 0.5;
                            ball.vx = (hitPos * ball.speed) + paddleSpeed;
                            ball.vy = -Math.abs(ball.speed); 
                            ball.y = p2Paddle.y - ball.r; 
                        }
                    }
                    
                    if (ball.y + ball.r > canvas.height - 10 && shieldActive) {
                        ball.vy = -Math.abs(ball.speed); ball.y = canvas.height - 15 - ball.r;
                        shieldActive = false; shakeTime = 5;
                        spawnParticles(ball.x, canvas.height-5, '#00f2ff', 15);
                    }
                    
                    if(ball.y > canvas.height) balls.splice(i, 1);
                }
            }

            if(balls.length === 0) {
                lives--; shakeTime = 15; laserTimer = 0; shieldActive = false;
                livesEl.innerText = '❤️'.repeat(Math.max(0, lives));
                if(lives <= 0) gameOver();
                else balls.push(createBall(0, 0, 0, 0, true));
            }

            for(let ball of balls) {
                if(ball.attached) continue;
                if (boss) {
                    let closestX = Math.max(boss.x, Math.min(ball.x, boss.x + boss.w));
                    let closestY = Math.max(boss.y, Math.min(ball.y, boss.y + boss.h));
                    if ((ball.x - closestX)**2 + (ball.y - closestY)**2 < ball.r**2) {
                        ball.vy *= -1; boss.hp -= 1; score += 10;
                        scoreEl.innerText = score;
                        spawnParticles(closestX, closestY, '#ff3333');
                        if (Math.random() < 0.1) spawnPowerup(closestX, closestY);
                        continue;
                    }
                }
                for (let i = bricks.length - 1; i >= 0; i--) {
                    let b = bricks[i];
                    let closestX = Math.max(b.x, Math.min(ball.x, b.x + b.w));
                    let closestY = Math.max(b.y, Math.min(ball.y, b.y + b.h));
                    let dX = ball.x - closestX, dY = ball.y - closestY;
                    
                    if ((dX * dX) + (dY * dY) < (ball.r * ball.r)) {
                        let oX = ball.r - Math.abs(dX), oY = ball.r - Math.abs(dY);
                        if (oX < oY) { ball.vx *= -1; ball.x += (dX > 0) ? oX : -oX; } 
                        else { ball.vy *= -1; ball.y += (dY > 0) ? oY : -oY; }
                        
                        b.hp--;
                        if(b.hp <= 0) {
                            spawnParticles(b.x + b.w/2, b.y + b.h/2, b.color);
                            spawnPowerup(b.x + b.w/2, b.y + b.h/2);
                            bricks.splice(i, 1); shakeTime = 5; score += 20 * level;
                        } else { score += 5; }
                        scoreEl.innerText = score; break;
                    }
                }
            }

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.03;
                if(p.life <= 0) particles.splice(i, 1);
            });
            
            p1Paddle.prevX = p1Paddle.x;
            p2Paddle.prevX = p2Paddle.x;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            if(shakeTime > 0) {
                ctx.translate((Math.random() - 0.5) * shakeTime, (Math.random() - 0.5) * shakeTime);
                shakeTime--;
            }

            if (shieldActive) {
                ctx.fillStyle = '#00f2ff'; ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 100) * 0.2;
                ctx.fillRect(0, canvas.height - 8, canvas.width, 8); ctx.globalAlpha = 1;
            }

            bricks.forEach(b => {
                ctx.fillStyle = b.color; ctx.globalAlpha = b.hp/3 + 0.3; ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(b.x, b.y, b.w, b.h);
            });
            ctx.globalAlpha = 1;

            if (boss) {
                ctx.fillStyle = boss.color; ctx.shadowBlur = 20; ctx.shadowColor = boss.color;
                ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
                ctx.fillStyle = '#fff'; ctx.fillRect(boss.x, boss.y - 10, boss.w * (boss.hp / boss.maxHp), 5);
                ctx.shadowBlur = 0;
            }

            powerups.forEach(p => {
                ctx.fillStyle = p.type === 'W' ? 'var(--neon)' : p.type === 'L' ? '#ff3333' : p.type === 'S' ? '#00f2ff' : 'var(--pink)';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = '#000'; ctx.font = "bold 16px Courier New"; ctx.fillText(p.type, p.x + 6, p.y + 17);
            });

            pLasers.forEach(l => { ctx.fillStyle = l.color; ctx.fillRect(l.x, l.y, 4, 15); });
            eLasers.forEach(l => { ctx.fillStyle = l.color; ctx.fillRect(l.x, l.y, 6, 20); });

            // Render Player 1 Paddle
            let p1x = p1Paddle.x + (glitchTimer > 0 ? (Math.random()-0.5)*5 : 0);
            ctx.fillStyle = glitchTimer > 0 ? '#ff3333' : p1Paddle.color;
            ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle;
            ctx.fillRect(p1x, p1Paddle.y, p1Paddle.w, p1Paddle.h);
            
            if (laserTimer > 0) {
                ctx.fillStyle = '#ff3333'; ctx.fillRect(p1x + 5, p1Paddle.y - 5, 8, 8);
                ctx.fillRect(p1x + p1Paddle.w - 13, p1Paddle.y - 5, 8, 8);
            }

            // Render Player 2 Paddle (Only in 2 Player Mode)
            if (gameMode === 2) {
                let p2x = p2Paddle.x + (glitchTimer > 0 ? (Math.random()-0.5)*5 : 0);
                ctx.fillStyle = glitchTimer > 0 ? '#ff3333' : p2Paddle.color;
                ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle;
                ctx.fillRect(p2x, p2Paddle.y, p2Paddle.w, p2Paddle.h);
                
                if (laserTimer > 0) {
                    ctx.fillStyle = '#ff3333'; ctx.fillRect(p2x + 5, p2Paddle.y - 5, 8, 8);
                    ctx.fillRect(p2x + p2Paddle.w - 13, p2Paddle.y - 5, 8, 8);
                }
            }
            ctx.shadowBlur = 0;

            balls.forEach(ball => {
                ball.trail.forEach((pos, index) => {
                    ctx.globalAlpha = (index / ball.trail.length) * 0.5;
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(pos.x, pos.y, ball.r * 0.8, 0, Math.PI * 2); ctx.fill();
                });
                ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
            });

            particles.forEach(p => {
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1; ctx.restore(); 

            update();
            animId = requestAnimationFrame(draw);
        }

        function gameOver() {
            active = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('blockBreakerHighScore', highScore);
                highDisp.innerText = highScore;
                document.getElementById('title').innerText = "NEW RECORD!";
            } else {
                document.getElementById('title').innerText = "SYSTEM FAILURE";
            }
            
            document.getElementById('sub').innerHTML = `Final Score: <span class="stat-highlight">${score}</span><br>Level Reached: <span class="stat-highlight">${level}</span>`;
            document.getElementById('overlay').style.display = 'flex';
            bossWarning.style.display = 'none';
        }

        function initGame(mode) {
            cancelAnimationFrame(animId);
            gameMode = mode;
            score = 0; lives = 3; level = 1; active = true;
            
            // Reset paddle properties
            p1Paddle.targetW = p1Paddle.w = 80;
            p2Paddle.targetW = p2Paddle.w = 80;
            p1Paddle.x = 200;
            p2Paddle.x = 280;
            
            laserTimer = 0; glitchTimer = 0; shieldActive = false;
            scoreEl.innerText = score; levelEl.innerText = level; livesEl.innerText = "❤️❤️❤️";
            document.getElementById('overlay').style.display = 'none';
            powerups = []; particles = []; pLasers = []; eLasers = [];
            
            keys.p1Left = keys.p1Right = keys.p2Left = keys.p2Right = false;
            
            initLevel();
            balls = [createBall(0, 0, 0, 0, true)];
            draw();
        }

        function movePaddle(clientX) {
            // Mouse/Touch controls only work in Single Player mode
            if (gameMode === 2) return;

            const rect = canvas.getBoundingClientRect();
            p1Paddle.x = (clientX - rect.left) - p1Paddle.w/2;
            if(p1Paddle.x < 0) p1Paddle.x = 0;
            if(p1Paddle.x + p1Paddle.w > canvas.width) p1Paddle.x = canvas.width - p1Paddle.w;
        }

        window.addEventListener('mousemove', e => movePaddle(e.clientX));
        window.addEventListener('touchmove', e => { if(gameMode !== 2) e.preventDefault(); movePaddle(e.touches[0].clientX); }, {passive: false});

        window.addEventListener('keydown', e => {
            if (e.key === 'a' || e.key === 'A') keys.p1Left = true;
            if (e.key === 'd' || e.key === 'D') keys.p1Right = true;

            if (e.key === 'ArrowLeft') keys.p2Left = true;
            if (e.key === 'ArrowRight') keys.p2Right = true;

            if (e.key === ' ') launchBall();
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'a' || e.key === 'A') keys.p1Left = false;
            if (e.key === 'd' || e.key === 'D') keys.p1Right = false;

            if (e.key === 'ArrowLeft') keys.p2Left = false;
            if (e.key === 'ArrowRight') keys.p2Right = false;
        });

        function launchBall() {
            if(!active) return;
            balls.forEach(ball => {
                if(ball.attached) {
                    ball.attached = false;
                    ball.vx = (Math.random() - 0.5) * ball.speed;
                    ball.vy = -ball.speed;
                }
            });
        }
        
        window.addEventListener('click', () => { if(gameMode !== 2) launchBall(); });
        window.addEventListener('touchstart', () => { if(gameMode !== 2) launchBall(); });
    </script>
</body>
</html>
