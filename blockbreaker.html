<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BLOCK BREAKER ULTRA | Nebula Arcade</title>
    <style>
        :root { --neon: #00f2ff; --pink: #ff007f; --gold: #f1c40f; }
        body {
            background: #050505; color: white; margin: 0;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; font-family: 'Courier New', monospace;
            overflow: hidden; touch-action: none;
        }
        #ui { width: 480px; display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1.2rem; }
        #container { position: relative; border: 4px solid var(--neon); box-shadow: 0 0 30px rgba(0, 242, 255, 0.3); border-radius: 8px; cursor: none; }
        canvas { display: block; background: #000; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            z-index: 10;
        }
        .btn { border: 2px solid var(--neon); color: var(--neon); padding: 12px 24px; background: none; cursor: pointer; font: inherit; margin-top: 15px; transition: 0.3s; }
        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon); }
    </style>
</head>
<body>

    <div id="ui">
        <div>SCORE: <span id="score">0</span></div>
        <div id="lives">❤️❤️❤️</div>
    </div>

    <div id="container">
        <canvas id="game"></canvas>
        <div id="overlay">
            <h1 id="title">BLOCK BREAKER</h1>
            <p id="sub">Precision Physics Engine Active</p>
            <button class="btn" onclick="initGame()">START ENGINE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score'), livesEl = document.getElementById('lives');
        
        canvas.width = 480; canvas.height = 600;

        let score = 0, lives = 3, active = false, ballAttached = true;
        let bricks = [], particles = [];

        const paddle = { x: 200, y: 560, w: 80, h: 12, color: '#00f2ff' };
        const ball = { x: 0, y: 0, r: 6, vx: 0, vy: 0, speed: 6 };

        function initBricks() {
            bricks = [];
            const rows = 6, cols = 8, padding = 10, w = 50, h = 20;
            const offsetLeft = (canvas.width - (cols * (w + padding))) / 2;
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    bricks.push({ 
                        x: offsetLeft + c * (w + padding), 
                        y: 50 + r * (h + padding), 
                        w: w, h: h, 
                        hp: Math.floor(3 - r/2),
                        color: r < 2 ? '#ff007f' : r < 4 ? '#00f2ff' : '#f1c40f'
                    });
                }
            }
        }

        function spawnParticles(x, y, color) {
            for(let i=0; i<8; i++) {
                particles.push({
                    x, y, color,
                    vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6,
                    life: 1.0
                });
            }
        }

        function update() {
            if(!active) return;

            if(ballAttached) {
                ball.x = paddle.x + paddle.w/2;
                ball.y = paddle.y - ball.r;
            } else {
                ball.x += ball.vx;
                ball.y += ball.vy;

                // Wall bounce
                if(ball.x + ball.r > canvas.width || ball.x - ball.r < 0) {
                    ball.vx *= -1;
                    ball.x = ball.x < ball.r ? ball.r : canvas.width - ball.r;
                }
                if(ball.y - ball.r < 0) {
                    ball.vy *= -1;
                    ball.y = ball.r;
                }

                // Paddle bounce
                if(ball.y + ball.r > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
                    let hitPos = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
                    ball.vx = hitPos * 5;
                    ball.vy = -Math.abs(ball.vy);
                    ball.y = paddle.y - ball.r; // Reset to top of paddle to prevent sticking
                }

                // Death
                if(ball.y > canvas.height) {
                    lives--;
                    livesEl.innerText = '❤️'.repeat(lives);
                    if(lives <= 0) gameOver();
                    else resetBall();
                }

                // Advanced Brick Collision (Fixes "Sticking")
                for (let i = 0; i < bricks.length; i++) {
                    let b = bricks[i];
                    if (b.hp <= 0) continue;

                    // Calculate the closest point on the brick to the ball center
                    let closestX = Math.max(b.x, Math.min(ball.x, b.x + b.w));
                    let closestY = Math.max(b.y, Math.min(ball.y, b.y + b.h));

                    let distanceX = ball.x - closestX;
                    let distanceY = ball.y - closestY;
                    let distanceSquared = (distanceX * distanceX) + (distanceY * distanceY);

                    if (distanceSquared < (ball.r * ball.r)) {
                        // Collision detected! Determine which side was hit
                        let overlapX = ball.r - Math.abs(distanceX);
                        let overlapY = ball.r - Math.abs(distanceY);

                        if (overlapX < overlapY) {
                            ball.vx *= -1;
                            ball.x += (distanceX > 0) ? overlapX : -overlapX; // Snap out horizontally
                        } else {
                            ball.vy *= -1;
                            ball.y += (distanceY > 0) ? overlapY : -overlapY; // Snap out vertically
                        }

                        b.hp--;
                        score += 20;
                        scoreEl.innerText = score;
                        spawnParticles(closestX, closestY, b.color);
                        break; // Only hit one brick per frame
                    }
                }
            }

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if(p.life <= 0) particles.splice(i, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            bricks.forEach(b => {
                if(b.hp <= 0) return;
                ctx.fillStyle = b.color;
                ctx.globalAlpha = b.hp/3 + 0.3;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.strokeRect(b.x, b.y, b.w, b.h);
            });
            ctx.globalAlpha = 1;

            ctx.fillStyle = paddle.color;
            ctx.shadowBlur = 15; ctx.shadowColor = paddle.color;
            ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();

            particles.forEach(p => {
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 3, 3);
            });
            ctx.globalAlpha = 1;

            update();
            requestAnimationFrame(draw);
        }

        function resetBall() { 
            ballAttached = true; 
            ball.vx = 0; 
            ball.vy = 0; 
        }

        function gameOver() {
            active = false;
            document.getElementById('title').innerText = "SYSTEM FAILURE";
            document.getElementById('sub').innerText = "Final Data: " + score;
            document.getElementById('overlay').style.display = 'flex';
        }

        function initGame() {
            score = 0; lives = 3; active = true;
            scoreEl.innerText = "0"; livesEl.innerText = "❤️❤️❤️";
            document.getElementById('overlay').style.display = 'none';
            initBricks();
            resetBall();
            draw();
        }

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            paddle.x = (e.clientX - rect.left) - paddle.w/2;
            if(paddle.x < 0) paddle.x = 0;
            if(paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;
        });

        canvas.addEventListener('click', () => {
            if(ballAttached && active) {
                ballAttached = false;
                ball.vx = (Math.random() - 0.5) * 6;
                ball.vy = -ball.speed;
            }
        });

    </script>
</body>
</html>
