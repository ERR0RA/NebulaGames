<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockcraft Evolution | Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Orbitron', sans-serif; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 15px; height: 15px;
            border: 2px solid rgba(255,255,255,0.8);
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #hotbar {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 10px;
            border-radius: 10px; border: 2px solid #555;
            display: flex; gap: 10px; color: white;
        }
        .slot {
            width: 50px; height: 50px; border: 2px solid transparent;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; text-align: center; background: #333;
        }
        .active { border-color: #00ff88; background: #444; }
        .info { position: absolute; top: 20px; left: 20px; color: white; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div class="info">
        <b>WASD</b>: Move | <b>SPACE</b>: Jump | <b>1-4</b>: Hotbar<br>
        <b>LEFT CLICK</b>: Break | <b>RIGHT CLICK</b>: Place
    </div>

    <div id="hotbar">
        <div id="slot1" class="slot active">1<br>GRASS</div>
        <div id="slot2" class="slot">2<br>DIRT</div>
        <div id="slot3" class="slot">3<br>STONE</div>
        <div id="slot4" class="slot">4<br>WOOD</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js';

        let scene, camera, renderer, controls, raycaster;
        let blocks = [];
        let moveFwd = false, moveBwd = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        const blockTypes = {
            1: { name: 'grass', color: 0x55ab55 },
            2: { name: 'dirt', color: 0x8B4513 },
            3: { name: 'stone', color: 0x777777 },
            4: { name: 'wood', color: 0x5D4037 }
        };
        let selectedSlot = 1;

        const highlightBox = new THREE.Mesh(
            new THREE.BoxGeometry(1.02, 1.02, 1.02),
            new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.5 })
        );

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new PointerLockControls(camera, document.body);
            document.body.addEventListener('click', () => controls.lock());

            // Better Lighting
            const ambient = new THREE.HemisphereLight(0xffffff, 0x888888, 0.7);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            scene.add(sun);

            scene.add(highlightBox);
            raycaster = new THREE.Raycaster();

            // --- Generate Map (40x40 Area) ---
            const mapSize = 20; // 20 each way = 40x40
            for(let x = -mapSize; x < mapSize; x++) {
                for(let z = -mapSize; z < mapSize; z++) {
                    // Create simple rolling hills using sine waves
                    const noise = Math.sin(x * 0.2) * Math.cos(z * 0.2) * 2;
                    const height = Math.floor(noise) + 5;

                    for(let y = 0; y <= height; y++) {
                        let type = 'stone';
                        if (y === height) type = 'grass';
                        else if (y > height - 2) type = 'dirt';
                        
                        createBlock(x, y, z, type);
                    }

                    // Random Trees
                    if (Math.random() > 0.985 && x % 2 === 0) {
                        spawnTree(x, height + 1, z);
                    }
                }
            }

            // --- Input Listeners ---
            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') moveFwd = true;
                if (e.code === 'KeyS') moveBwd = true;
                if (e.code === 'KeyA') moveL = true;
                if (e.code === 'KeyD') moveR = true;
                if (e.code === 'Space' && canJump) { velocity.y += 12; canJump = false; }
                
                // Hotbar
                if (['Digit1', 'Digit2', 'Digit3', 'Digit4'].includes(e.code)) {
                    document.getElementById(`slot${selectedSlot}`).classList.remove('active');
                    selectedSlot = parseInt(e.key);
                    document.getElementById(`slot${selectedSlot}`).classList.add('active');
                }
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveFwd = false;
                if (e.code === 'KeyS') moveBwd = false;
                if (e.code === 'KeyA') moveL = false;
                if (e.code === 'KeyD') moveR = false;
            });

            document.addEventListener('mousedown', (e) => {
                if (!controls.isLocked) return;
                
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(blocks);

                if (intersects.length > 0) {
                    const intersect = intersects[0];
                    if (e.button === 0) { // Break
                        scene.remove(intersect.object);
                        blocks = blocks.filter(b => b !== intersect.object);
                    } else if (e.button === 2) { // Place
                        const pos = intersect.object.position.clone().add(intersect.face.normal);
                        createBlock(pos.x, Math.round(pos.y), pos.z, blockTypes[selectedSlot].name);
                    }
                }
            });

            animate();
        }

        function createBlock(x, y, z, type) {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: blockTypes[getSlotByName(type)].color });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            blocks.push(mesh);
        }

        function spawnTree(x, y, z) {
            for(let i=0; i<4; i++) createBlock(x, y+i, z, 'wood'); // Trunk
            // Leaves
            for(let ix=-1; ix<=1; ix++) {
                for(let iz=-1; iz<=1; iz++) {
                    createBlock(x+ix, y+4, z+iz, 'grass');
                }
            }
        }

        function getSlotByName(name) {
            return Object.keys(blockTypes).find(key => blockTypes[key].name === name);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 30.0 * delta; // Gravity

                direction.z = Number(moveFwd) - Number(moveBwd);
                direction.x = Number(moveR) - Number(moveL);
                direction.normalize();

                if (moveFwd || moveBwd) velocity.z -= direction.z * 80.0 * delta;
                if (moveL || moveR) velocity.x -= direction.x * 80.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                camera.position.y += velocity.y * delta;

                // Simple Ground Collision
                if (camera.position.y < 4) {
                    velocity.y = 0;
                    camera.position.y = 4;
                    canJump = true;
                }

                // Interaction Highlight
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(blocks);
                if (intersects.length > 0) {
                    highlightBox.position.copy(intersects[0].object.position);
                    highlightBox.visible = true;
                } else {
                    highlightBox.visible = false;
                }
            }
            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Disable context menu for right-click placement
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
