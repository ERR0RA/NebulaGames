<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON OVERDRIVE | Lighting Updated</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ff88; font-size: 24px; z-index: 5; }
        #overlay { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); color: #00ff88; z-index: 10; }
        button { padding: 15px 40px; background: transparent; border: 2px solid #00ff88; color: #00ff88; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="ui">SCORE: <span id="score">0</span></div>
    <div id="overlay">
        <h1>NEON OVERDRIVE</h1>
        <button id="startBtn">Initiate Link</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, tunnel, obstacles = [];
        let sun, sunSphere;
        let speed = 0.6, score = 0, gameActive = false, targetX = 0;
        
        // --- 1. DEFINE PHYSICS VARIABLES (Prevents Crashes) ---
        let prevTime = performance.now();
        let dayCycle = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.Fog(0x000000, 10, 80);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // --- 2. ADDED LIGHTING FROM YOUR SNIPPET ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            sun = new THREE.DirectionalLight(0xffffff, 1.0);
            sun.position.set(0, 20, 0); 
            scene.add(sun);

            const sunGeo = new THREE.SphereGeometry(2, 16, 16);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xfff5b1 });
            sunSphere = new THREE.Mesh(sunGeo, sunMat);
            scene.add(sunSphere);

            // Tunnel Setup
            const tunnelGeo = new THREE.CylinderGeometry(6, 6, 400, 32, 1, true);
            const tunnelMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, side: THREE.BackSide, metalness: 0.9 });
            tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
            tunnel.rotation.x = Math.PI / 2;
            scene.add(tunnel);

            document.getElementById('startBtn').addEventListener('click', () => {
                document.getElementById('overlay').style.display = 'none';
                gameActive = true;
                spawnObstacle();
            });

            document.addEventListener('mousemove', (e) => {
                targetX = (e.clientX / window.innerWidth - 0.5) * 8;
            });

            animate();
        }

        function spawnObstacle() {
            if(!gameActive) return;
            const obs = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 0.5), new THREE.MeshBasicMaterial({ color: 0xff0055 }));
            obs.position.set((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8, -100);
            scene.add(obs);
            obstacles.push(obs);
            setTimeout(spawnObstacle, 400);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            // --- 3. DAY/NIGHT CALCULATIONS (Adapted) ---
            dayCycle += delta * 0.2; 
            const sunDist = 40;
            sun.position.x = Math.cos(dayCycle) * sunDist;
            sun.position.y = Math.sin(dayCycle) * sunDist;
            sunSphere.position.copy(sun.position);

            const sunHeight = Math.sin(dayCycle);
            if (sunHeight > 0) {
                // Changing HSL colors on the background
                scene.background.setHSL(0.55, 0.5, 0.2 + sunHeight * 0.2);
                scene.fog.color.copy(scene.background);
                sun.intensity = sunHeight;
            } else {
                scene.background.setHSL(0.6, 0.5, 0.05);
                scene.fog.color.copy(scene.background);
                sun.intensity = 0;
            }

            if (gameActive) {
                speed += 0.0004;
                score += 1;
                document.getElementById('score').innerText = Math.floor(score/10);
                
                camera.position.x += (targetX - camera.position.x) * 0.1;
                camera.rotation.z = -camera.position.x * 0.05;

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].position.z += speed;
                    if (obstacles[i].position.distanceTo(camera.position) < 1.3) location.reload();
                    if (obstacles[i].position.z > 10) {
                        scene.remove(obstacles[i]);
                        obstacles.splice(i, 1);
                    }
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
