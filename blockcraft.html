<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockcraft Evolution</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', sans-serif; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px;
            border: 2px solid white; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #ui {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 10px 20px;
            border-radius: 30px; color: white; display: flex; gap: 15px;
        }
        .instruction { position: absolute; top: 20px; left: 20px; color: white; text-shadow: 1px 1px 2px black; }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div class="instruction">
        <b>WASD</b> to Walk | <b>SPACE</b> to Jump | <b>LEFT CLICK</b>: Break | <b>RIGHT CLICK</b>: Place<br>
        <b>ESC</b> to unlock mouse
    </div>
    <div id="ui">
        <span>Current: <b id="blockType">GRASS</b></span>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js';

        let scene, camera, renderer, controls, raycaster;
        let blocks = [];
        let moveFwd = false, moveBwd = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        // Assets
        const textureLoader = new THREE.TextureLoader();
        const blockMaterials = {
            grass: new THREE.MeshStandardMaterial({ color: 0x55ab55 }),
            dirt: new THREE.MeshStandardMaterial({ color: 0x8B4513 }),
            stone: new THREE.MeshStandardMaterial({ color: 0x808080 })
        };

        const highlightBox = new THREE.Mesh(
            new THREE.BoxGeometry(1.01, 1.01, 1.01),
            new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true })
        );

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new PointerLockControls(camera, document.body);
            document.body.addEventListener('click', () => controls.lock());

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(10, 20, 10);
            sun.castShadow = true;
            scene.add(sun);

            scene.add(highlightBox);
            raycaster = new THREE.Raycaster();

            // Generate Terrain (Procedural-ish)
            for(let x = -10; x < 10; x++) {
                for(let z = -10; z < 10; z++) {
                    const height = Math.floor(Math.random() * 2);
                    for(let y = 0; y <= height; y++) {
                        createBlock(x, y, z, y === height ? 'grass' : 'dirt');
                    }
                }
            }

            // Controls
            const onKeyDown = (e) => {
                switch (e.code) {
                    case 'KeyW': moveFwd = true; break;
                    case 'KeyS': moveBwd = true; break;
                    case 'KeyA': moveL = true; break;
                    case 'KeyD': moveR = true; break;
                    case 'Space': if (canJump) velocity.y += 15; canJump = false; break;
                }
            };
            const onKeyUp = (e) => {
                switch (e.code) {
                    case 'KeyW': moveFwd = false; break;
                    case 'KeyS': moveBwd = false; break;
                    case 'KeyA': moveL = false; break;
                    case 'KeyD': moveR = false; break;
                }
            };
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Interaction
            document.addEventListener('mousedown', (e) => {
                if (!controls.isLocked) return;
                
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(blocks);

                if (intersects.length > 0) {
                    const intersect = intersects[0];
                    if (e.button === 0) { // Break
                        scene.remove(intersect.object);
                        blocks = blocks.filter(b => b !== intersect.object);
                    } else if (e.button === 2) { // Place
                        const pos = intersect.object.position.clone().add(intersect.face.normal);
                        createBlock(pos.x, pos.y, pos.z, 'stone');
                    }
                }
            });

            animate();
        }

        function createBlock(x, y, z, type) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), blockMaterials[type]);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);
            blocks.push(mesh);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                // Physics
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 40.0 * delta; // Gravity

                direction.z = Number(moveFwd) - Number(moveBwd);
                direction.x = Number(moveR) - Number(moveL);
                direction.normalize();

                if (moveFwd || moveBwd) velocity.z -= direction.z * 100.0 * delta;
                if (moveL || moveR) velocity.x -= direction.x * 100.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                camera.position.y += velocity.y * delta;

                if (camera.position.y < 2) {
                    velocity.y = 0;
                    camera.position.y = 2;
                    canJump = true;
                }

                // Highlight Logic
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(blocks);
                if (intersects.length > 0) {
                    highlightBox.position.copy(intersects[0].object.position);
                    highlightBox.visible = true;
                } else {
                    highlightBox.visible = false;
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
