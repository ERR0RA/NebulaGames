<!DOCTYPE html>
<html>
<head>
<title>NEXUS-3D | NEBULA EVOLUTION</title>
<style>
body { margin:0; background:#000; overflow:hidden; font-family:monospace; color:#0f0; }
canvas { width:100vw; height:100vh; display:block; }

#hud {
    position:fixed; bottom:10px; width:100%;
    display:flex; justify-content:space-around;
}
.stat { background:#000; padding:6px 12px; border:1px solid #0f0; }

#menu {
    position:fixed; top:0; left:0; width:100%; height:100%;
    display:flex; justify-content:center; align-items:center;
    background:#000;
}
button { padding:15px; background:#0f0; border:none; cursor:pointer; }

#crosshair {
    position:fixed; top:50%; left:50%;
    width:6px; height:6px;
    background:#0f0;
    transform:translate(-50%,-50%);
}
</style>
</head>
<body>

<div id="menu">
    <button onclick="start()">ENTER NEBULA</button>
</div>

<canvas id="game"></canvas>
<div id="crosshair"></div>

<div id="hud">
    <div class="stat">HP: <span id="hp">100</span></div>
    <div class="stat">SCORE: <span id="score">0</span></div>
    <div class="stat">WEAPON: <span id="weapon">PISTOL</span></div>
</div>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let SIZE=31, world=[], active=false;
let keys={};

let player, bots=[], powerups=[], particles=[];
let score=0;

let weapon="pistol";
let lastShot=0;
let dashCD=0;

window.onkeydown=e=>{
    keys[e.code]=true;
    if(e.code==="Digit1") weapon="pistol";
    if(e.code==="Digit2") weapon="rapid";
};
window.onkeyup=e=>keys[e.code]=false;

window.onclick=shoot;

function resetPlayer(){
    player={x:1.5,y:1.5,dir:0,hp:100};
}

function maze(){
    world = Array(SIZE).fill().map(()=>Array(SIZE).fill(1));
    function walk(x,y){
        world[y][x]=0;
        [[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-0.5)
        .forEach(([dx,dy])=>{
            let nx=x+dx, ny=y+dy;
            if(world[ny] && world[ny][nx]){
                world[y+dy/2][x+dx/2]=0;
                walk(nx,ny);
            }
        });
    }
    walk(1,1);
}

function canMove(x,y){
    return world[Math.floor(y)] && world[Math.floor(y)][Math.floor(x)]==0;
}

function move(){
    let speed=0.05;

    if(keys["ShiftLeft"] && dashCD<=0){
        speed=0.2;
        dashCD=50;
    }
    if(dashCD>0) dashCD--;

    if(keys["KeyA"]) player.dir-=0.05;
    if(keys["KeyD"]) player.dir+=0.05;

    let mx=0,my=0;
    if(keys["KeyW"]){ mx+=Math.cos(player.dir)*speed; my+=Math.sin(player.dir)*speed; }
    if(keys["KeyS"]){ mx-=Math.cos(player.dir)*speed; my-=Math.sin(player.dir)*speed; }

    if(canMove(player.x+mx*1.5,player.y)) player.x+=mx;
    if(canMove(player.x,player.y+my*1.5)) player.y+=my;
}

function shoot(){
    let now=Date.now();
    let cd = weapon==="rapid"?100:250;
    if(now-lastShot<cd) return;
    lastShot=now;

    bots.forEach(b=>{
        let dx=b.x-player.x, dy=b.y-player.y;
        let dist=Math.hypot(dx,dy);
        let angle=Math.atan2(dy,dx)-player.dir;

        if(Math.abs(angle)<0.2 && dist<7){
            b.hp -= weapon==="rapid"?20:50;

            for(let i=0;i<8;i++){
                particles.push({x:b.x,y:b.y,life:20});
            }

            if(b.hp<=0){
                score+=100;
                if(Math.random()<0.4) powerups.push({x:b.x,y:b.y});
                bots=bots.filter(x=>x!==b);
            }
        }
    });
}

function spawnBot(type="normal"){
    let b={x:Math.random()*SIZE,y:Math.random()*SIZE,hp:100,speed:0.02,type};

    if(type==="boss"){
        b.hp=500;
        b.speed=0.015;
    }

    bots.push(b);
}

function updateBots(){
    bots.forEach(b=>{
        let dx=player.x-b.x, dy=player.y-b.y;
        let dist=Math.hypot(dx,dy);

        if(dist<0.5){
            player.hp -= b.type==="boss"?1.5:0.5;
        } else {
            let nx=b.x+(dx/dist)*b.speed;
            let ny=b.y+(dy/dist)*b.speed;
            if(canMove(nx,ny)){ b.x=nx; b.y=ny; }
        }
    });
}

function updateParticles(){
    particles.forEach(p=>p.life--);
    particles=particles.filter(p=>p.life>0);
}

function updatePowerups(){
    powerups.forEach(p=>{
        if(Math.hypot(player.x-p.x,player.y-p.y)<0.5){
            player.hp=Math.min(100,player.hp+30);
            powerups=powerups.filter(x=>x!==p);
        }
    });
}

function render(){
    c.width=innerWidth;
    c.height=innerHeight;
    let w=c.width,h=c.height;

    ctx.fillStyle="#000";
    ctx.fillRect(0,0,w,h);

    let zBuf=new Array(w).fill(20);

    for(let i=0;i<w;i++){
        let ray=player.dir+(i/w-0.5);
        let d=0;

        while(d<20){
            d+=0.03;
            let x=player.x+Math.cos(ray)*d;
            let y=player.y+Math.sin(ray)*d;

            if(world[Math.floor(y)] && world[Math.floor(y)][Math.floor(x)]==1){
                zBuf[i]=d;
                let hgt=h/d;
                ctx.fillStyle="#00ff88";
                ctx.fillRect(i,h/2-hgt/2,1,hgt);
                break;
            }
        }
    }

    bots.forEach(b=>{
        let dx=b.x-player.x, dy=b.y-player.y;
        let dist=Math.hypot(dx,dy);
        let angle=Math.atan2(dy,dx)-player.dir;

        if(Math.abs(angle)<0.7){
            let sx=(angle/1.4+0.5)*w;
            let size=h/dist;

            if(dist<zBuf[Math.floor(sx)]){
                ctx.fillStyle=b.type==="boss"?"#ff00ff":"#ff0033";
                ctx.fillRect(sx-size/5,h/2-size/2,size/2,size);
            }
        }
    });

    particles.forEach(p=>{
        ctx.fillStyle="#ff0044";
        ctx.fillRect((p.x-player.x)*100+w/2,(p.y-player.y)*100+h/2,2,2);
    });

    powerups.forEach(p=>{
        let dx=p.x-player.x, dy=p.y-player.y;
        let dist=Math.hypot(dx,dy);
        let angle=Math.atan2(dy,dx)-player.dir;

        if(Math.abs(angle)<0.7){
            let sx=(angle/1.4+0.5)*w;
            let size=h/dist;
            ctx.fillStyle="#00ffff";
            ctx.fillRect(sx-size/6,h/2-size/2,size/3,size/2);
        }
    });
}

function loop(){
    if(!active) return;

    move();
    updateBots();
    updateParticles();
    updatePowerups();

    if(player.hp<=0){
        score=Math.max(0,score-200);
        resetPlayer();
    }

    render();

    document.getElementById("hp").innerText=Math.floor(player.hp);
    document.getElementById("score").innerText=score;
    document.getElementById("weapon").innerText=weapon.toUpperCase();

    requestAnimationFrame(loop);
}

function start(){
    document.getElementById("menu").style.display="none";
    maze();
    resetPlayer();
    active=true;

    for(let i=0;i<4;i++) spawnBot();

    setInterval(()=>spawnBot(),5000);
    setInterval(()=>spawnBot("boss"),20000);

    loop();
}
</script>

</body>
</html>
