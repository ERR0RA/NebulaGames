<!DOCTYPE html>
<html>
<head>
<title>NEXUS-3D | NEBULA CORE</title>
<style>
body { margin:0; background:#000; color:#0f0; font-family:monospace; overflow:hidden; }
canvas { width:100vw; height:100vh; display:block; }

#hud {
    position:fixed; bottom:10px; width:100%;
    display:flex; justify-content:space-around;
    font-size:14px;
}
.stat { background:#000; padding:6px 12px; border:1px solid #0f0; }

#menu {
    position:fixed; top:0; left:0; width:100%; height:100%;
    display:flex; justify-content:center; align-items:center;
    background:#000;
}
button { padding:15px; background:#0f0; border:none; cursor:pointer; }

#crosshair {
    position:fixed;
    top:50%; left:50%;
    width:6px; height:6px;
    background:#0f0;
    transform:translate(-50%,-50%);
}
</style>
</head>
<body>

<div id="menu">
    <button onclick="start()">ENTER NEBULA CORE</button>
</div>

<canvas id="game"></canvas>
<div id="crosshair"></div>

<div id="hud">
    <div class="stat">HP: <span id="hp">100</span></div>
    <div class="stat">SCORE: <span id="score">0</span></div>
    <div class="stat">WEAPON: <span id="weapon">PISTOL</span></div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let SIZE=31, world=[], keys={}, active=false;
let player={x:1.5,y:1.5,dir:0,hp:100};
let bots=[], particles=[], powerups=[];
let score=0, weapon="pistol", lastShot=0;

window.onkeydown=e=>keys[e.code]=true;
window.onkeyup=e=>keys[e.code]=false;
window.onclick=shoot;

function generateMaze(){
    world = Array(SIZE).fill().map(()=>Array(SIZE).fill(1));
    function walk(x,y){
        world[y][x]=0;
        [[0,-2],[0,2],[-2,0],[2,0]]
        .sort(()=>Math.random()-0.5)
        .forEach(([dx,dy])=>{
            let nx=x+dx, ny=y+dy;
            if(nx>0&&ny>0&&nx<SIZE&&ny<SIZE&&world[ny][nx]){
                world[y+dy/2][x+dx/2]=0;
                walk(nx,ny);
            }
        });
    }
    walk(1,1);
}

function canMove(x,y){
    return world[Math.floor(y)] && world[Math.floor(y)][Math.floor(x)]==0;
}

function move(){
    let speed = keys["ShiftLeft"] ? 0.08 : 0.05;

    if(keys["KeyA"]) player.dir-=0.05;
    if(keys["KeyD"]) player.dir+=0.05;

    let mx=0,my=0;
    if(keys["KeyW"]){ mx+=Math.cos(player.dir)*speed; my+=Math.sin(player.dir)*speed; }
    if(keys["KeyS"]){ mx-=Math.cos(player.dir)*speed; my-=Math.sin(player.dir)*speed; }

    if(canMove(player.x+mx*1.5,player.y)) player.x+=mx;
    if(canMove(player.x,player.y+my*1.5)) player.y+=my;
}

function shoot(){
    let now=Date.now();
    let cooldown = weapon==="rapid"?100:250;
    if(now-lastShot<cooldown) return;
    lastShot=now;

    bots.forEach(b=>{
        let dx=b.x-player.x, dy=b.y-player.y;
        let dist=Math.hypot(dx,dy);
        let angle=Math.atan2(dy,dx)-player.dir;

        if(Math.abs(angle)<0.2 && dist<6){
            b.hp -= weapon==="rapid"?20:50;

            for(let i=0;i<10;i++){
                particles.push({x:b.x,y:b.y,life:20});
            }

            if(b.hp<=0){
                score+=100;
                spawnPower(b.x,b.y);
                bots=bots.filter(x=>x!==b);
            }
        }
    });
}

function spawnBot(){
    let type = Math.random();
    let bot = {x:Math.random()*SIZE,y:Math.random()*SIZE,hp:100,speed:0.02,type:"normal"};

    if(type<0.3){ bot.speed=0.04; bot.type="fast"; }
    if(type>0.8){ bot.hp=200; bot.type="tank"; }

    bots.push(bot);
}

function spawnPower(x,y){
    if(Math.random()<0.4){
        powerups.push({x,y,type:["heal","rapid","speed"][Math.floor(Math.random()*3)]});
    }
}

function updateBots(){
    bots.forEach(b=>{
        let dx=player.x-b.x, dy=player.y-b.y;
        let dist=Math.hypot(dx,dy);

        if(dist<0.5){
            player.hp -= (b.type==="tank"?1:0.5);
        } else {
            b.x += (dx/dist)*b.speed;
            b.y += (dy/dist)*b.speed;
        }
    });
}

function updateParticles(){
    particles.forEach(p=>p.life--);
    particles = particles.filter(p=>p.life>0);
}

function updatePowerups(){
    powerups.forEach(p=>{
        let dist=Math.hypot(player.x-p.x, player.y-p.y);
        if(dist<0.5){
            if(p.type==="heal") player.hp=Math.min(100,player.hp+30);
            if(p.type==="rapid") weapon="rapid";
            if(p.type==="speed") player.speedBoost=200;
            powerups = powerups.filter(x=>x!==p);
        }
    });
}

function render(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;

    let w=canvas.width,h=canvas.height;
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,w,h);

    for(let i=0;i<w;i++){
        let ray = player.dir + (i/w-0.5);
        let d=0;

        while(d<20){
            d+=0.05;
            let x=player.x+Math.cos(ray)*d;
            let y=player.y+Math.sin(ray)*d;

            if(world[Math.floor(y)] && world[Math.floor(y)][Math.floor(x)]==1){
                let hgt=h/d;
                ctx.fillStyle="#00ff88";
                ctx.fillRect(i,h/2-hgt/2,1,hgt);
                break;
            }
        }
    }

    particles.forEach(p=>{
        ctx.fillStyle="#ff0044";
        ctx.fillRect((p.x-player.x)*100+w/2,(p.y-player.y)*100+h/2,2,2);
    });

    if(player.hp<30){
        ctx.fillStyle="rgba(255,0,0,0.2)";
        ctx.fillRect(0,0,w,h);
    }
}

function loop(){
    if(!active) return;

    move();
    updateBots();
    updateParticles();
    updatePowerups();

    if(player.hp<=0){
        alert("SYSTEM FAILURE\nScore: "+score);
        location.reload();
    }

    render();

    document.getElementById("hp").innerText=Math.floor(player.hp);
    document.getElementById("score").innerText=score;
    document.getElementById("weapon").innerText=weapon.toUpperCase();

    requestAnimationFrame(loop);
}

function start(){
    document.getElementById("menu").style.display="none";
    generateMaze();
    active=true;

    for(let i=0;i<4;i++) spawnBot();

    setInterval(spawnBot,5000);
    setInterval(()=>bots.forEach(b=>b.speed+=0.002),10000);

    loop();
}
</script>
</body>
</html>
