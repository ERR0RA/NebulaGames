<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS ARMS | INFINITE ARENA</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; user-select: none; touch-action: none; }
        #lobby { position: absolute; inset: 0; background: radial-gradient(circle at center, #001, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; color: white; text-align: center; }
        .setup-grid { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        .player-setup { background: rgba(0, 242, 255, 0.05); padding: 20px; border-radius: 15px; width: 260px; border: 1px solid #00f2ff44; backdrop-filter: blur(10px); }
        select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; font-family: 'Orbitron'; cursor: pointer; border: 1px solid #444; background: #111; color: white; transition: 0.3s; }
        #start-btn { background: #00f2ff; color: #000; font-size: 1.4rem; font-weight: 900; border: none; box-shadow: 0 0 20px #00f2ff; }
        
        #ui { position: absolute; top: 20px; width: 100%; padding: 0 40px; display: flex; justify-content: space-between; box-sizing: border-box; z-index: 10; visibility: hidden; }
        .bar-container { width: 35%; }
        .bar-bg { width: 100%; height: 18px; background: rgba(0,0,0,0.8); border: 2px solid #444; position: relative; }
        .hp-fill { height: 100%; width: 100%; background: #00f2ff; transition: width 0.2s ease-out; box-shadow: 0 0 10px #00f2ff; }
        .hp-fill.p2 { background: #ff0055; box-shadow: 0 0 10px #ff0055; }
        .win-counter { font-size: 1.5rem; color: #fff; margin-bottom: 5px; font-weight: 900; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

        #msg-overlay { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 60px; font-weight: 900; color: #fff; z-index: 150; pointer-events: none; text-shadow: 0 0 20px #00f2ff; display: none; text-align: center; }
    </style>
</head>
<body>

<div id="lobby">
    <h1 style="color: #00f2ff; text-shadow: 0 0 20px #00f2ff; margin-bottom: 5px;">NEXUS ARMS</h1>
    <p style="color: #666; font-size: 0.8rem;">INFINITE TACTICAL COMBAT</p>
    
    <div class="setup-grid">
        <div class="player-setup">
            <h3 style="color:#00f2ff; margin-top:0;">P1 (WASD)</h3>
            <select id="p1-wep"><option value="katana">KATANA</option><option value="executioner">EXECUTIONER</option><option value="rapier">RAPIER</option></select>
        </div>
        <div class="player-setup">
            <h3 style="color:#ff0055; margin-top:0;">FIGHTER 2</h3>
            <select id="game-mode" onchange="toggleP2Wep()"><option value="bot">AI BOT</option><option value="pvp">LOCAL PVP</option></select>
            <select id="p2-wep" style="display:none; border-color:#ff0055;"><option value="katana">KATANA</option><option value="executioner">EXECUTIONER</option><option value="rapier">RAPIER</option></select>
        </div>
    </div>
    <button id="start-btn">INITIALIZE</button>
</div>

<div id="msg-overlay">K.O.</div>

<div id="ui">
    <div class="bar-container">
        <div id="wins-p1" class="win-counter">P1: 0</div>
        <div class="bar-bg"><div id="hp1" class="hp-fill"></div></div>
    </div>
    <div class="bar-container" style="text-align:right">
        <div id="wins-p2" class="win-counter">P2: 0</div>
        <div class="bar-bg"><div id="hp2" class="hp-fill p2"></div></div>
    </div>
</div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>

<script type="module">
    import * as THREE from 'three';

    // Increased ranges and bigger hitboxes
    const WEAPONS = {
        katana:      { dmg: 15, speed: 0.18, range: 4.2, cd: 600, scale: [0.08, 2.8, 0.1], color: 0x00f2ff },
        executioner: { dmg: 35, speed: 0.07, range: 5.2, cd: 1400, scale: [0.35, 3.5, 0.15], color: 0xff0055 },
        rapier:      { dmg: 10, speed: 0.3, range: 5.5, cd: 400, scale: [0.05, 4.0, 0.05], color: 0xffffff }
    };

    let sessionWins = { p1: 0, p2: 0 };
    let roundActive = false, isBot = false, isHitStop = false;
    
    const ARENA_RADIUS = 25; 
    const ACCEL = 0.025;      
    const FRICTION = 0.82;   

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010103);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.3));
    const light = new THREE.PointLight(0x00f2ff, 2, 100); light.position.set(0, 20, 10); scene.add(light);

    const arenaGeo = new THREE.CylinderGeometry(ARENA_RADIUS, ARENA_RADIUS, 1, 64);
    const arena = new THREE.Mesh(arenaGeo, new THREE.MeshStandardMaterial({color: 0x08080a}));
    arena.position.y = -0.5; scene.add(arena);
    scene.add(new THREE.GridHelper(ARENA_RADIUS * 2, 30, 0x00f2ff, 0x111111));

    class Fighter {
        constructor(startX, startZ, id) {
            this.id = id; this.startX = startX; this.startZ = startZ;
            this.group = new THREE.Group();
            this.vel = new THREE.Vector3();
            scene.add(this.group);
            this.reset();
        }
        reset() {
            this.hp = 100; this.atkPhase = 0; this.hitMark = false;
            this.lastAtk = 0; this.stunned = 0; this.isBlocking = false;
            this.group.position.set(this.startX, 0, this.startZ);
            this.vel.set(0,0,0);
        }
        init(wepKey, color) {
            this.group.clear(); this.wep = WEAPONS[wepKey];
            // Fighter hitbox body (visual only)
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.6, 1.2), new THREE.MeshStandardMaterial({color: color}));
            body.position.y = 1; this.group.add(body);
            this.pivot = new THREE.Group(); this.pivot.position.set(0, 1.2, 0);
            const blade = new THREE.Mesh(new THREE.BoxGeometry(...this.wep.scale), new THREE.MeshStandardMaterial({color: this.wep.color, emissive: this.wep.color, emissiveIntensity: 2}));
            blade.position.y = this.wep.scale[1]/2; this.pivot.add(blade);
            this.group.add(this.pivot);
        }
        update(targetPos) {
            if (this.stunned > 0) { this.stunned -= 0.016; return; }
            const lookPos = new THREE.Vector3(targetPos.x, 0, targetPos.z);
            const targetRotation = new THREE.Matrix4().lookAt(this.group.position, lookPos, THREE.Object3D.DEFAULT_UP);
            this.group.quaternion.slerp(new THREE.Quaternion().setFromRotationMatrix(targetRotation), 0.1);

            if (this.atkPhase > 0) {
                this.atkPhase -= this.wep.speed;
                this.pivot.rotation.x = Math.sin(this.atkPhase * Math.PI) * -2.5;
            } else { this.pivot.rotation.x = this.isBlocking ? -1.2 : -0.5; }

            this.group.position.add(this.vel);
            this.vel.x *= FRICTION;
            this.vel.z *= FRICTION;

            if (this.group.position.length() > ARENA_RADIUS) {
                this.group.position.normalize().multiplyScalar(ARENA_RADIUS);
            }
        }
    }

    const p1 = new Fighter(-12, 0, 1);
    const p2 = new Fighter(12, 0, 2);
    const keys = {}; window.onkeydown = (e) => keys[e.code] = true; window.onkeyup = (e) => keys[e.code] = false;

    window.toggleP2Wep = () => {
        const mode = document.getElementById('game-mode').value;
        document.getElementById('p2-wep').style.display = (mode === 'pvp') ? 'block' : 'none';
    };

    document.getElementById('start-btn').onclick = () => {
        isBot = document.getElementById('game-mode').value === 'bot';
        p1.init(document.getElementById('p1-wep').value, 0x00f2ff);
        p2.init(isBot ? 'katana' : document.getElementById('p2-wep').value, 0xff0055);
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('ui').style.visibility = 'visible';
        roundActive = true; animate();
    };

    function handleInput() {
        if (p1.stunned <= 0) {
            if (keys['KeyW']) p1.vel.z -= ACCEL; if (keys['KeyS']) p1.vel.z += ACCEL;
            if (keys['KeyA']) p1.vel.x -= ACCEL; if (keys['KeyD']) p1.vel.x += ACCEL;
            p1.isBlocking = keys['ShiftLeft'];
            if (keys['KeyF']) (p1.atkPhase <= 0) && p1.tryAtk();
        }
        if (isBot) {
            const dist = p2.group.position.distanceTo(p1.group.position);
            if (dist > p2.wep.range - 1) { // Bot tries to get within "Big Hitbox" range
                const dir = new THREE.Vector3().subVectors(p1.group.position, p2.group.position).normalize();
                p2.vel.add(dir.multiplyScalar(ACCEL * 0.6));
            } else if (Math.random() > 0.97) p2.tryAtk();
        } else if (p2.stunned <= 0) {
            if (keys['ArrowUp']) p2.vel.z -= ACCEL; if (keys['ArrowDown']) p2.vel.z += ACCEL;
            if (keys['ArrowLeft']) p2.vel.x -= ACCEL; if (keys['ArrowRight']) p2.vel.x += ACCEL;
            p2.isBlocking = keys['ShiftRight'];
            if (keys['Enter']) (p2.atkPhase <= 0) && p2.tryAtk();
        }
    }

    Fighter.prototype.tryAtk = function() {
        const now = Date.now();
        if (now - this.lastAtk > this.wep.cd && !this.isBlocking) {
            this.atkPhase = 1; this.hitMark = false; this.lastAtk = now;
        }
    }

    function animate() {
        if (!roundActive) return;
        requestAnimationFrame(animate);
        if (!isHitStop) {
            handleInput();
            p1.update(p2.group.position); p2.update(p1.group.position);

            const dist = p1.group.position.distanceTo(p2.group.position);
            [p1, p2].forEach((atk, i) => {
                const def = i === 0 ? p2 : p1;
                // Hit detection logic with larger hitbox consideration
                if (atk.atkPhase > 0.3 && atk.atkPhase < 0.8 && !atk.hitMark && dist < atk.wep.range) {
                    if (!def.isBlocking) {
                        def.hp -= atk.wep.dmg;
                        isHitStop = true; setTimeout(() => isHitStop = false, 80);
                    } else { def.hp -= atk.wep.dmg * 0.2; }
                    atk.hitMark = true;
                }
            });
        }

        document.getElementById('hp1').style.width = Math.max(0, p1.hp) + '%';
        document.getElementById('hp2').style.width = Math.max(0, p2.hp) + '%';

        if ((p1.hp <= 0 || p2.hp <= 0) && roundActive) {
            roundActive = false;
            const winner = p1.hp <= 0 ? "p2" : "p1";
            sessionWins[winner]++;
            document.getElementById(`wins-${winner}`).innerText = `${winner.toUpperCase()}: ${sessionWins[winner]}`;
            document.getElementById('msg-overlay').style.display = 'block';
            
            // INFINITE RESET LOGIC
            setTimeout(() => {
                p1.reset(); p2.reset();
                document.getElementById('msg-overlay').style.display = 'none';
                roundActive = true;
            }, 1800);
        }

        const mid = new THREE.Vector3().addVectors(p1.group.position, p2.group.position).multiplyScalar(0.5);
        camera.position.lerp(new THREE.Vector3(mid.x, 15, mid.z + 28), 0.05);
        camera.lookAt(mid.x, 1, mid.z);
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
