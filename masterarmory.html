<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MASTER ARMORY: OVERDRIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; user-select: none; touch-action: none; }
        #lobby { position: absolute; inset: 0; background: radial-gradient(circle at center, #001, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; color: white; text-align: center; }
        .setup-grid { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        .player-setup { background: rgba(0, 242, 255, 0.05); padding: 20px; border-radius: 15px; width: 260px; border: 1px solid #00f2ff44; backdrop-filter: blur(10px); }
        select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; font-family: 'Orbitron'; cursor: pointer; border: 1px solid #444; background: #111; color: white; transition: 0.3s; }
        #start-btn { background: #00f2ff; color: #000; font-size: 1.4rem; font-weight: 900; border: none; box-shadow: 0 0 20px #00f2ff; }
        
        #ui { position: absolute; top: 20px; width: 100%; padding: 0 40px; display: flex; justify-content: space-between; box-sizing: border-box; z-index: 10; visibility: hidden; }
        .bar-container { width: 40%; }
        .bar-bg { width: 100%; height: 22px; background: rgba(0,0,0,0.8); border: 2px solid #444; position: relative; }
        .hp-fill { height: 100%; width: 100%; background: #00f2ff; transition: width 0.2s ease-out; }
        .hp-fill.p2 { background: #ff0055; }
        .status-text { font-size: 0.7rem; color: #fff; margin-top: 5px; letter-spacing: 1px; }

        #msg-overlay { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; font-weight: 900; color: #fff; z-index: 150; pointer-events: none; text-shadow: 0 0 20px #00f2ff; display: none; }
        
        #control-hint { position: absolute; bottom: 20px; width: 100%; color: rgba(255,255,255,0.4); text-align: center; font-size: 0.7rem; z-index: 5; }
    </style>
</head>
<body>

<div id="lobby">
    <h1 style="color: #00f2ff; text-shadow: 0 0 20px #00f2ff;">NEXUS ARMS</h1>
    <p style="margin-bottom: 30px; opacity: 0.7;">PARRY / JUMP / SURVIVE</p>
    <div class="setup-grid">
        <div class="player-setup">
            <h3 style="color:#00f2ff; margin-top:0;">FIGHTER 1 (WASD)</h3>
            <select id="p1-wep">
                <option value="katana">KATANA (Swift)</option>
                <option value="executioner">EXECUTIONER (Heavy)</option>
                <option value="rapier">RAPIER (Long)</option>
            </select>
        </div>
        <div class="player-setup">
            <h3 style="color:#ff0055; margin-top:0;">MODE</h3>
            <select id="game-mode">
                <option value="bot">AI CHALLENGE (WASD or Arrows)</option>
                <option value="pvp">LOCAL PVP (P2 uses Arrows)</option>
            </select>
        </div>
    </div>
    <button id="start-btn">INITIALIZE</button>
</div>

<div id="msg-overlay">K.O.</div>

<div id="ui">
    <div class="bar-container">
        <div class="bar-bg"><div id="hp1" class="hp-fill"></div></div>
        <div id="st1" class="status-text">P1: SYSTEMS NOMINAL</div>
    </div>
    <div class="bar-container" style="text-align:right">
        <div class="bar-bg"><div id="hp2" class="hp-fill p2"></div></div>
        <div id="st2" class="status-text">P2: TARGET ACQUIRED</div>
    </div>
</div>

<div id="control-hint">P1: WASD + Space | P2: Arrows + Enter</div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>

<script type="module">
    import * as THREE from 'three';

    const WEAPONS = {
        katana:      { dmg: 16, speed: 0.2, range: 2.5, cd: 550, scale: [0.06, 2.5, 0.08], color: 0x00f2ff },
        executioner: { dmg: 40, speed: 0.08, range: 3.2, cd: 1400, scale: [0.3, 3.2, 0.12], color: 0xff0055 },
        rapier:      { dmg: 12, speed: 0.35, range: 3.8, cd: 350, scale: [0.03, 3.8, 0.03], color: 0xffffff }
    };

    let roundActive = false, isBot = false, isHitStop = false, laserActive = false;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.2));
    const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(5, 10, 5); scene.add(sun);
    
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 20), new THREE.MeshStandardMaterial({color: 0x080808, roughness: 0.1, metalness: 0.5}));
    floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
    scene.add(new THREE.GridHelper(100, 40, 0x00f2ff, 0x111111));

    const laser = new THREE.Mesh(new THREE.BoxGeometry(100, 0.2, 0.2), new THREE.MeshBasicMaterial({color: 0xff0000}));
    laser.position.set(0, 0.5, 0); laser.visible = false; scene.add(laser);

    class Fighter {
        constructor(x, id) {
            this.id = id; this.hp = 100; this.atkPhase = 0; this.hitMark = false;
            this.lastAtk = 0; this.group = new THREE.Group(); this.group.position.x = x;
            this.vel = new THREE.Vector3(); this.isBlocking = false; this.stunned = 0;
            this.isJumping = false; 
            scene.add(this.group);
        }
        init(wepKey, color) {
            this.group.clear(); this.wep = WEAPONS[wepKey];
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1), new THREE.MeshStandardMaterial({color: color}));
            body.position.y = 0.9; body.castShadow = true; this.group.add(body);
            this.pivot = new THREE.Group(); this.pivot.position.set(0.4, 1.2, 0);
            const blade = new THREE.Mesh(new THREE.BoxGeometry(...this.wep.scale), new THREE.MeshStandardMaterial({color: this.wep.color, emissive: this.wep.color, emissiveIntensity: 0.5}));
            blade.position.y = this.wep.scale[1]/2; this.pivot.add(blade);
            this.group.add(this.pivot);
        }
        update() {
            if (this.stunned > 0) {
                this.stunned -= 0.016;
                this.group.children[0].material.emissive.setHex(0xffff00);
                return;
            }
            this.group.children[0].material.emissive.setHex(this.isBlocking ? 0x00f2ff : 0x000000);
            
            if (this.atkPhase > 0) {
                this.atkPhase -= this.wep.speed;
                this.pivot.rotation.z = Math.sin(this.atkPhase * Math.PI) * 3;
            } else { this.pivot.rotation.z = THREE.MathUtils.lerp(this.pivot.rotation.z, this.isBlocking ? 1.5 : 0, 0.2); }

            this.vel.y -= 0.015;
            this.group.position.add(this.vel);
            if (this.group.position.y <= 0) { this.group.position.y = 0; this.vel.y = 0; this.isJumping = false; }
            this.vel.x *= 0.85;
        }
        tryAtk() {
            const now = Date.now();
            if (now - this.lastAtk > this.wep.cd && !this.isBlocking) {
                this.atkPhase = 1; this.hitMark = false; this.lastAtk = now;
            }
        }
    }

    const p1 = new Fighter(-5, 1);
    const p2 = new Fighter(5, 2);
    const keys = {}; window.onkeydown = (e) => keys[e.code] = true; window.onkeyup = (e) => keys[e.code] = false;

    document.getElementById('start-btn').onclick = () => {
        isBot = document.getElementById('game-mode').value === 'bot';
        p1.init(document.getElementById('p1-wep').value, 0x00f2ff);
        p2.init('katana', 0xff0055);
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('ui').style.visibility = 'visible';
        roundActive = true; animate();
    };

    function handleInput() {
        if (p1.stunned <= 0) {
            // P1 Left/Right
            if (keys['KeyA'] || (isBot && keys['ArrowLeft'])) p1.vel.x = -0.15;
            if (keys['KeyD'] || (isBot && keys['ArrowRight'])) p1.vel.x = 0.15;
            // P1 Jump
            if ((keys['KeyW'] || (isBot && keys['ArrowUp'])) && !p1.isJumping) { p1.vel.y = 0.35; p1.isJumping = true; }
            // P1 Block
            p1.isBlocking = keys['KeyS'] || (isBot && keys['ArrowDown']);
            // P1 Attack
            if (keys['Space'] || keys['KeyF'] || (isBot && keys['Enter'])) p1.atkPhase <= 0 && p1.tryAtk();
        }

        if (isBot) {
            // AI Logic for P2
            if (p2.stunned <= 0) {
                const d = p2.group.position.x - p1.group.position.x;
                if (Math.abs(d) > p2.wep.range) p2.vel.x = d > 0 ? -0.1 : 0.1;
                if (Math.abs(d) < p2.wep.range) Math.random() > 0.96 ? p2.tryAtk() : (p2.isBlocking = Math.random() > 0.92);
                if (laserActive && Math.abs(laser.position.x - p2.group.position.x) < 3 && !p2.isJumping) { p2.vel.y = 0.35; p2.isJumping = true; }
            }
        } else {
            // Local PvP Logic for P2
            if (p2.stunned <= 0) {
                if (keys['ArrowLeft']) p2.vel.x = -0.15;
                if (keys['ArrowRight']) p2.vel.x = 0.15;
                if (keys['ArrowUp'] && !p2.isJumping) { p2.vel.y = 0.35; p2.isJumping = true; }
                p2.isBlocking = keys['ArrowDown'];
                if (keys['Enter'] || keys['Numpad0']) p2.atkPhase <= 0 && p2.tryAtk();
            }
        }
    }

    let shake = 0, laserTimer = 0;

    function animate() {
        if (!roundActive || isHitStop) return;
        requestAnimationFrame(animate);
        handleInput();
        p1.update(); p2.update();

        laserTimer++;
        if (laserTimer > 400) {
            laserActive = true; laser.visible = true;
            laser.position.x = 30 - (laserTimer - 400) * 0.5;
            if (Math.abs(p1.group.position.x - laser.position.x) < 0.5 && p1.group.position.y < 1) { p1.hp -= 0.5; shake = 0.2; }
            if (Math.abs(p2.group.position.x - laser.position.x) < 0.5 && p2.group.position.y < 1) { p2.hp -= 0.5; shake = 0.2; }
            if (laserTimer > 600) { laserTimer = 0; laserActive = false; laser.visible = false; }
        }

        const dist = Math.abs(p1.group.position.x - p2.group.position.x);
        [p1, p2].forEach((atk, i) => {
            const def = i === 0 ? p2 : p1;
            if (atk.atkPhase > 0.4 && atk.atkPhase < 0.6 && !atk.hitMark && dist < atk.wep.range && Math.abs(atk.group.position.y - def.group.position.y) < 1.5) {
                if (def.isBlocking) {
                    const perfect = Date.now() - def.lastAtk < 120;
                    if (perfect) { atk.stunned = 1.2; shake = 0.4; }
                    def.hp -= atk.wep.dmg * 0.15;
                    def.vel.x = (atk.group.position.x < def.group.position.x ? 1 : -1) * 0.12;
                } else {
                    def.hp -= atk.wep.dmg;
                    def.vel.x = (atk.group.position.x < def.group.position.x ? 1 : -1) * 0.4;
                    isHitStop = true; setTimeout(() => isHitStop = false, 50);
                    shake = atk.wep.dmg * 0.012;
                }
                atk.hitMark = true;
            }
        });

        document.getElementById('hp1').style.width = Math.max(0, p1.hp) + '%';
        document.getElementById('hp2').style.width = Math.max(0, p2.hp) + '%';
        document.getElementById('st1').innerText = p1.stunned > 0 ? "P1: STUNNED" : (p1.isBlocking ? "P1: BLOCKING" : "P1: NOMINAL");
        document.getElementById('st2').innerText = p2.stunned > 0 ? "P2: STUNNED" : (p2.isBlocking ? "P2: BLOCKING" : "P2: NOMINAL");

        if (p1.hp <= 0 || p2.hp <= 0) { 
            roundActive = false; 
            document.getElementById('msg-overlay').innerText = p1.hp <= 0 ? "P2 WINS" : "P1 WINS";
            document.getElementById('msg-overlay').style.display = 'block'; 
            setTimeout(() => location.reload(), 3000); 
        }

        camera.position.lerp(new THREE.Vector3((p1.group.position.x + p2.group.position.x)/2, 4, 12), 0.1);
        if(shake > 0) { camera.position.x += (Math.random()-0.5)*shake; shake *= 0.9; }
        camera.lookAt((p1.group.position.x + p2.group.position.x)/2, 1.5, 0);
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
