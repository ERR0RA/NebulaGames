<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN HYPER-ENGINE | AI QUESTIONS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root { --bio: #00ff88; --chem: #00d9ff; --phys: #ff0055; --bg: #05070a; --card: #111418; --text: #f0f6fc; --accent: #8b949e; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        header { background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); padding: 20px; text-align: center; border-bottom: 1px solid #30363d; position: sticky; top: 0; z-index: 1000; }
        .stats-bar { display: flex; justify-content: space-around; background: #161b22; padding: 15px; border-bottom: 1px solid #30363d; font-weight: 800; font-size: 0.9rem; }
        .container { max-width: 800px; margin: auto; padding: 20px; padding-bottom: 120px; }
        .subject-card { background: var(--card); border-radius: 24px; padding: 30px; margin-bottom: 20px; border: 1px solid #30363d; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
        .subject-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .q-box { background: var(--card); border-radius: 30px; padding: 40px; border: 2px solid #30363d; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .q-text { font-size: 1.6rem; font-weight: 800; text-align: center; margin-bottom: 30px; line-height: 1.4; letter-spacing: -0.02em; }
        textarea { width: 100%; height: 200px; background: #000; color: #fff; border: 2px solid #30363d; border-radius: 20px; padding: 25px; font-size: 1.2rem; margin-bottom: 25px; resize: none; font-family: inherit; transition: 0.3s; }
        textarea:focus { border-color: var(--chem); outline: none; box-shadow: 0 0 20px rgba(0,217,255,0.2); }
        .btn { width: 100%; padding: 22px; border-radius: 18px; border: none; font-weight: 800; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .mark-btn { background: var(--chem); color: #000; }
        .next-btn { background: #21262d; color: #fff; margin-top: 20px; }
        .feedback { background: #0d1117; padding: 25px; border-radius: 20px; margin-top: 25px; border-left: 8px solid var(--chem); display: none; }
        .badge { display: inline-block; padding: 6px 15px; border-radius: 10px; font-size: 0.8rem; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; }
        #xp-inc { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); color: var(--bio); font-weight: 900; font-size: 2rem; display: none; pointer-events: none; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0; font-size: 1.5rem; letter-spacing: 2px;">HYPER-TITAN ENGINE</h1>
    <div id="rank" style="color:var(--accent); font-size: 0.8rem; font-weight: 800;">STATUS: NEURAL LINK ESTABLISHED</div>
</header>

<div class="stats-bar">
    <div onclick="location.reload()" style="cursor:pointer; color:var(--chem)">RESET</div>
    <div>XP: <span id="xp" style="color:var(--bio)">0</span></div>
    <div>PROGRESS: <span id="p-text">0/1500</span></div>
</div>

<div class="container">
    <div id="menu">
        <div class="subject-card" onclick="start('Bio')" style="border-left: 10px solid var(--bio);">
            <div class="badge" style="background:var(--bio); color:#000;">500+ VARIATIONS</div>
            <h2 style="margin:0;">Biology 🧬</h2>
            <p style="color:var(--accent)">Botany, Disease, Evolution & Genetics</p>
        </div>
        <div class="subject-card" onclick="start('Chem')" style="border-left: 10px solid var(--chem);">
            <div class="badge" style="background:var(--chem); color:#000;">500+ VARIATIONS</div>
            <h2 style="margin:0;">Chemistry 🧪</h2>
            <p style="color:var(--accent)">Reactions, Atoms, Periodic Table & Metals</p>
        </div>
        <div class="subject-card" onclick="start('Phys')" style="border-left: 10px solid var(--phys);">
            <div class="badge" style="background:var(--phys); color:#fff;">500+ VARIATIONS</div>
            <h2 style="margin:0;">Physics ⚛️</h2>
            <p style="color:var(--accent)">Waves, Forces, Space & Calculations</p>
        </div>
    </div>

    <div id="arena" style="display:none;">
        <div class="q-box">
            <div id="sub-tag" class="badge"></div>
            <div id="question" class="q-text"></div>
            <textarea id="user-ans" placeholder="Provide a detailed scientific explanation..."></textarea>
            <button id="submit" class="btn mark-btn" onclick="evaluateAns()">AI MARK ANSWER</button>
            
            <div id="feedback" class="feedback">
                <h2 id="score-val" style="margin-top:0;"></h2>
                <div id="key-info" style="color:var(--bio); font-weight:800; margin-bottom:15px;"></div>
                <div id="model-ans" style="line-height:1.6; opacity:0.9; background:#000; padding:15px; border-radius:12px;"></div>
                <button class="btn next-btn" onclick="newQuestion()">NEXT CHALLENGE</button>
            </div>
        </div>
    </div>
</div>

<div id="xp-inc">+500 XP</div>

<script>
/* THE MASSIVE GENERATIVE DATA CORE */
const DATA = {
    Bio: {
        templates: [
            "Explain the specific adaptations of {cell} for {function}.",
            "Describe how the {pathogen} {action}.",
            "In terms of {concept}, explain how {process} occurs.",
            "Compare the roles of {structure1} and {structure2} in plants.",
            "What are the consequences of a deficiency in {nutrient}?",
            "Detail the steps of {bio_process} in {target}.",
            "How does {defense} protect the body against {threat}?"
        ],
        vars: {
            cell: ["palisade cells", "root hair cells", "xylem vessels", "phloem tubes", "guard cells", "lymphocytes", "phagocytes"],
            function: ["photosynthesis", "water absorption", "mineral transport", "sucrose translocation", "gas exchange", "antibody production"],
            pathogen: ["Salmonella bacteria", "Covid-19 virus", "Ebola virus", "Ringworm fungus", "Malaria protist"],
            action: ["replicates inside host cells", "produces toxins", "spreads via droplets", "causes tissue damage", "triggers fever"],
            concept: ["surface area to volume ratio", "osmosis", "active transport", "natural selection", "genetic inheritance"],
            process: ["water uptake in roots", "nutrient absorption", "the evolution of antibiotic resistance", "transpiration"],
            structure1: ["xylem", "stomata", "anthers", "arteries", "dominant alleles"],
            structure2: ["phloem", "guard cells", "stigmas", "veins", "recessive alleles"],
            nutrient: ["Vitamin C", "Vitamin D", "Iron", "Protein", "Glucose"],
            bio_process: ["natural selection", "fossil formation", "pollination", "fertilisation", "vaccination"],
            target: ["Darwin's finches", "sedimentary rock", "flowering plants", "the human immune system"],
            defense: ["the skin", "stomach acid", "white blood cells", "cilia and mucus"],
            threat: ["airborne pathogens", "ingested bacteria", "viral infections", "fungal spores"]
        },
        // Keyword logic for the AI Marker
        logic: {
            "palisade": ["light", "chloroplasts", "top", "photosynthesis"],
            "root hair": ["surface area", "osmosis", "water", "minerals"],
            "xylem": ["water", "minerals", "lignin", "hollow", "dead"],
            "phloem": ["sucrose", "sugar", "translocation", "living", "sieve"],
            "virus": ["host", "replicate", "genetic", "capsid", "burst"],
            "bacteria": ["toxins", "binary fission", "reproduce", "rapidly"],
            "natural selection": ["variation", "mutation", "survive", "reproduce", "genes", "advantage"],
            "osmosis": ["water", "partially permeable", "concentration", "dilute", "dilute to concentrated"],
            "vaccination": ["dead", "inactive", "antigens", "antibodies", "memory cells"],
            "vitamin c": ["scurvy", "gums", "citrus", "collagen"],
            "transpiration": ["evaporation", "leaves", "stomata", "xylem", "water stream"]
        }
    },
    Chem: {
        templates: [
            "Explain the difference between {change1} and {change2} in terms of {chem_concept}.",
            "Describe the observed reaction when {substance} reacts with {reactant}.",
            "How did {scientist} contribute to our understanding of {topic}?",
            "Explain why {element} is {property} based on its {atomic_structure}.",
            "Describe the process of {chem_process} and why it is {energy_type}.",
            "Explain the trend in {group} reactivity as you go {direction}.",
            "Define {definition} and give a specific industrial example."
        ],
        vars: {
            change1: ["a physical change", "an exothermic reaction", "oxidation", "thermal decomposition"],
            change2: ["a chemical change", "an endothermic reaction", "reduction", "neutralisation"],
            chem_concept: ["bonds", "energy transfer", "rearrangement of atoms", "electron loss/gain"],
            substance: ["Group 1 metals", "magnesium", "copper carbonate", "hydrocarbons", "acids"],
            reactant: ["water", "hydrochloric acid", "oxygen", "alkalis"],
            scientist: ["Mendeleev", "John Dalton", "JJ Thomson"],
            topic: ["the periodic table", "atomic structure", "the arrangement of elements"],
            element: ["Sodium", "Chlorine", "Iron", "Graphite", "Alloys"],
            property: ["highly reactive", "a good conductor", "very hard", "brittle"],
            atomic_structure: ["outer shell electrons", "delocalised electrons", "distorted layers", "shielding"],
            chem_process: ["combustion", "cracking", "thermal decomposition", "neutralisation"],
            energy_type: ["exothermic", "endothermic", "oxidation"],
            group: ["Group 1 (alkali metals)", "Group 7 (halogens)", "Group 0 (noble gases)"],
            direction: ["down the group", "up the group"],
            definition: ["a catalyst", "an isotope", "relative atomic mass", "the law of conservation of mass"]
        },
        logic: {
            "physical": ["reversible", "no new substance", "state change"],
            "chemical": ["new substance", "bonds broken", "irreversible"],
            "exothermic": ["heat", "surroundings", "rises", "transfer"],
            "endothermic": ["absorb", "surroundings", "falls", "take in"],
            "mendeleev": ["gaps", "atomic mass", "properties", "predicted"],
            "group 1": ["reactive", "one outer electron", "lost", "shielding", "distance"],
            "group 7": ["gain", "reactive", "electron", "diatomic"],
            "alloy": ["mixture", "layers", "distorted", "slide", "harder"],
            "isotope": ["protons", "neutrons", "same", "different", "mass"],
            "catalyst": ["speed", "activation energy", "not used up", "alternative pathway"]
        }
    },
    Phys: {
        templates: [
            "Define {wave_term} and explain how it relates to {wave_type} waves.",
            "Describe the process of {light_process} when light enters {medium}.",
            "Explain the relationship between {force_var1} and {force_var2} in {physics_law}.",
            "How does {space_concept} provide evidence for {theory}?",
            "Describe the difference between {phys_comp1} and {phys_comp2}.",
            "Explain the {phenomenon} using the concept of {concept_phys}.",
            "Calculate the {target_calc} if the {input1} and {input2} are known."
        ],
        vars: {
            wave_term: ["amplitude", "frequency", "wavelength", "period"],
            wave_type: ["transverse", "longitudinal", "sound", "ultraviolet"],
            light_process: ["refraction", "total internal reflection", "specular reflection", "dispersion"],
            medium: ["a glass block", "water", "a prism", "a vacuum"],
            force_var1: ["extension", "mass", "force", "distance"],
            force_var2: ["applied force", "acceleration", "pressure", "moment"],
            physics_law: ["Hooke's Law", "Newton's Second Law", "the Principle of Moments"],
            space_concept: ["Red-shift", "cosmic microwave background radiation", "orbital speeds"],
            theory: ["the Big Bang theory", "the expansion of the universe", "the heliocentric model"],
            phys_comp1: ["weight", "scalar quantities", "specular reflection", "balanced forces"],
            phys_comp2: ["mass", "vector quantities", "diffuse reflection", "resultant forces"],
            phenomenon: ["the seasons", "day and night", "the rainbow effect", "upthrust"],
            concept_phys: ["the Earth's tilt", "rotation on an axis", "dispersion of white light", "water displacement"],
            target_calc: ["pressure", "weight", "moment", "wave speed"],
            input1: ["force", "mass", "frequency"],
            input2: ["area", "gravity", "wavelength"]
        },
        logic: {
            "transverse": ["perpendicular", "oscillations", "energy transfer"],
            "longitudinal": ["parallel", "oscillations", "compressions"],
            "refraction": ["speed", "direction", "medium", "density", "normal"],
            "hooke": ["extension", "proportional", "force", "spring constant", "limit"],
            "weight": ["gravity", "mass", "newtons", "w=mg"],
            "red-shift": ["wavelength", "increased", "moving away", "galaxies", "expanding"],
            "pressure": ["force", "area", "pascals", "p=f/a"],
            "prism": ["refract", "dispersion", "violet", "red", "different speeds"],
            "resultant": ["single force", "combined", "sum", "direction"]
        }
    }
};

let currentSubject = "";
let currentQ = {};
let xp = 0;
let questCount = 0;

function start(sub) {
    currentSubject = sub;
    document.getElementById('menu').style.display = 'none';
    document.getElementById('arena').style.display = 'block';
    newQuestion();
}

function newQuestion() {
    const subData = DATA[currentSubject];
    const template = subData.templates[Math.floor(Math.random() * subData.templates.length)];
    
    // Generative Replacement Logic
    let qText = template;
    const regex = /\{(\w+)\}/g;
    let match;
    while ((match = regex.exec(template)) !== null) {
        const key = match[1];
        const val = subData.vars[key][Math.floor(Math.random() * subData.vars[key].length)];
        qText = qText.replace(match[0], val);
    }

    currentQ = { text: qText };
    document.getElementById('question').innerText = qText;
    document.getElementById('user-ans').value = '';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('sub-tag').innerText = currentSubject + " Challenges";
    document.getElementById('sub-tag').style.background = currentSubject === 'Bio' ? 'var(--bio)' : (currentSubject === 'Chem' ? 'var(--chem)' : 'var(--phys)');
}

function evaluateAns() {
    const input = document.getElementById('user-ans').value.toLowerCase();
    const subData = DATA[currentSubject];
    let matchedKeywords = [];
    
    // Check input against all logic keywords
    for (let key in subData.logic) {
        if (input.includes(key) || currentQ.text.toLowerCase().includes(key)) {
            subData.logic[key].forEach(word => {
                if (input.includes(word) && !matchedKeywords.includes(word)) {
                    matchedKeywords.push(word);
                }
            });
        }
    }

    let score = 0;
    if (matchedKeywords.length > 5) score = 3;
    else if (matchedKeywords.length >= 3) score = 2;
    else if (matchedKeywords.length >= 1) score = 1;

    document.getElementById('feedback').style.display = 'block';
    document.getElementById('score-val').innerText = "AI SCORE: " + score + "/3";
    document.getElementById('key-info').innerText = "Keywords Detected: " + (matchedKeywords.join(", ") || "None - Use more technical terms!");
    document.getElementById('model-ans').innerHTML = "<b>Exam Logic:</b> To score highly, you must mention " + (matchedKeywords.length < 3 ? "more specific terms like " + Object.values(subData.logic)[0].slice(0,3).join(", ") : "the core mechanisms detailed in your revision guide.");
    
    xp += score * 150;
    questCount++;
    updateStats();
    showXP();
}

function updateStats() {
    document.getElementById('xp').innerText = xp;
    document.getElementById('p-text').innerText = questCount + "/1500";
    if (xp > 10000) document.getElementById('rank').innerText = "STATUS: TITAN ASCENDED";
}

function showXP() {
    const el = document.getElementById('xp-inc');
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 1000);
}
</script>
</body>
</html>
