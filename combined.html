<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELITE SCIENCE HUB | iPad Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bio: #00ff88; --chem: #00d9ff; --phys: #ff0055; --ai: #ff9f43;
            --bg: #07090d; --card: #131722; --text: #ffffff;
            --correct: #00ff88; --wrong: #ff3b3b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; touch-action: manipulation; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 0; -webkit-user-select: none; }

        header { background: #000; padding: 25px; text-align: center; border-bottom: 3px solid #333; }
        .stats-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 15px 20px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(15px); }

        .container { padding: 20px; max-width: 800px; margin: auto; }
        .subject-card { background: var(--card); border-radius: 20px; padding: 30px; text-align: center; border: 2px solid rgba(255,255,255,0.1); margin-bottom: 15px; cursor: pointer; }
        
        /* QUIZ ELEMENTS */
        .game-card { background: var(--card); border-radius: 24px; padding: 25px; border: 2px solid #444; }
        .question-display { min-height: 120px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 20px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
        
        .btn-tap { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: white; padding: 18px; border-radius: 15px; font-size: 1rem; font-weight: 700; min-height: 80px; transition: 0.3s; }
        
        /* AI WRITTEN MODE */
        textarea { width: 100%; height: 120px; background: #000; border: 2px solid var(--ai); color: white; border-radius: 15px; padding: 15px; font-size: 1.1rem; margin-bottom: 15px; }
        .mark-box { background: rgba(255, 159, 67, 0.1); border: 1px dashed var(--ai); padding: 15px; border-radius: 10px; margin-top: 15px; display: none; }

        .nav-btn { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; }
        .correct-flash { background: var(--correct) !important; color: black !important; border-color: var(--correct) !important; }
        .wrong-flash { background: var(--wrong) !important; border-color: var(--wrong) !important; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0; font-size: 1.8rem;">ELITE SCIENCE HUB</h1>
</header>

<div class="stats-bar">
    <button class="nav-btn" onclick="location.reload()">◀ MENU</button>
    <div>XP: <span id="xp">0</span></div>
    <div>STREAK: <span id="streak">0</span></div>
</div>

<div class="container">
    <div id="menu">
        <div class="subject-card" style="border-color: var(--bio);" onclick="startMode('Biology')"><h2 style="color:var(--bio)">Biology 🧬</h2></div>
        <div class="subject-card" style="border-color: var(--chem);" onclick="startMode('Chemistry')"><h2 style="color:var(--chem)">Chemistry 🧪</h2></div>
        <div class="subject-card" style="border-color: var(--phys);" onclick="startMode('Physics')"><h2 style="color:var(--phys)">Physics ⚛️</h2></div>
        <div class="subject-card" style="border-color: var(--ai);" onclick="startMode('AI')"><h2 style="color:var(--ai)">AI WRITTEN EXAM ✍️</h2></div>
    </div>

    <div id="quiz" style="display:none;">
        <div class="game-card" id="card-frame">
            <div id="q-text" class="question-display">...</div>
            <div id="options" class="options-grid"></div>
        </div>
    </div>

    <div id="ai-mode" style="display:none;">
        <div class="game-card" style="border-color: var(--ai);">
            <h3 style="color: var(--ai); margin-top:0;">EXPLAIN:</h3>
            <p id="ai-q" style="font-size: 1.2rem; font-weight: bold;"></p>
            <textarea id="ai-input" placeholder="Type your explanation here..."></textarea>
            <button class="btn-tap" style="width:100%; background: var(--ai); color: black;" onclick="markWritten()">SUBMIT FOR MARKING</button>
            <div id="ai-feedback" class="mark-box"></div>
            <button id="next-ai" class="nav-btn" style="width:100%; margin-top:10px; display:none;" onclick="loadAI()">NEXT QUESTION</button>
        </div>
    </div>
</div>

<script>
    const DATA = {
        Biology: [
            { q: "What carries water up a plant?", a: "Xylem", o: ["Xylem", "Phloem", "Stomata", "Roots"] },
            { q: "How do bacteria reproduce?", a: "Binary Fission", o: ["Binary Fission", "Mitosis", "Seeds", "Budding"] }
        ],
        Chemistry: [
            { q: "Energy is released in which reaction?", a: "Exothermic", o: ["Exothermic", "Endothermic", "Reduction", "Melting"] },
            { q: "Atomic number is the number of...", a: "Protons", o: ["Protons", "Neutrons", "Electrons", "Nuclei"] }
        ],
        Physics: [
            { q: "What is the unit of Frequency?", a: "Hertz (Hz)", o: ["Hertz (Hz)", "Watts (W)", "Joules (J)", "Newtons (N)"] },
            { q: "Sound is what type of wave?", a: "Longitudinal", o: ["Longitudinal", "Transverse", "Electromagnetic", "Vacuum"] }
        ],
        AI: [
            { q: "Explain how natural selection leads to evolution.", keywords: ["variation", "survive", "reproduce", "genes", "offspring"], model: "Organisms have variation. Those with better traits survive and reproduce, passing on genes." },
            { q: "Explain why Group 1 metals get more reactive as you go down the group.", keywords: ["outer", "electron", "distance", "shielding", "attraction", "lost"], model: "The outer electron is further from the nucleus with more shielding, so the attraction is weaker and it's lost more easily." }
        ]
    };

    let currentXP = 0;
    let currentStreak = 0;
    let currentBank = [];
    let currentAIQuestion = {};

    function startMode(mode) {
        document.getElementById('menu').style.display = 'none';
        if(mode === 'AI') {
            document.getElementById('ai-mode').style.display = 'block';
            loadAI();
        } else {
            document.getElementById('quiz').style.display = 'block';
            currentBank = [...DATA[mode]];
            loadQuiz();
        }
    }

    // MULTIPLE CHOICE LOGIC
    function loadQuiz() {
        if(currentBank.length === 0) { alert("Topic Complete!"); location.reload(); return; }
        const q = currentBank.pop();
        document.getElementById('q-text').innerText = q.q;
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = '';

        q.o.sort(() => Math.random() - 0.5).forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-tap';
            btn.innerText = opt;
            btn.onclick = function() {
                // Correct/Wrong logic
                if(opt === q.a) {
                    btn.classList.add('correct-flash');
                    currentXP += 100; currentStreak++;
                    setTimeout(loadQuiz, 800);
                } else {
                    btn.classList.add('wrong-flash');
                    currentStreak = 0;
                    // SHOW RIGHT ANSWER
                    Array.from(optDiv.children).forEach(b => {
                        if(b.innerText === q.a) b.classList.add('correct-flash');
                    });
                    setTimeout(loadQuiz, 2000);
                }
                updateStats();
            };
            optDiv.appendChild(btn);
        });
    }

    // AI MARKING LOGIC
    function loadAI() {
        currentAIQuestion = DATA.AI[Math.floor(Math.random() * DATA.AI.length)];
        document.getElementById('ai-q').innerText = currentAIQuestion.q;
        document.getElementById('ai-input').value = '';
        document.getElementById('ai-feedback').style.display = 'none';
        document.getElementById('next-ai').style.display = 'none';
    }

    function markWritten() {
        const input = document.getElementById('ai-input').value.toLowerCase();
        let score = 0;
        let found = [];

        currentAIQuestion.keywords.forEach(kw => {
            if(input.includes(kw)) { score++; found.push(kw); }
        });

        let mark = 0;
        if(score >= 4) mark = 3;
        else if(score >= 2) mark = 2;
        else if(score >= 1) mark = 1;

        const fb = document.getElementById('ai-feedback');
        fb.style.display = 'block';
        fb.innerHTML = `<strong>SCORE: ${mark}/3</strong><br>
                        Keywords found: ${found.join(', ') || 'None'}<br><br>
                        <em>Model Answer: ${currentAIQuestion.model}</em>`;
        
        currentXP += (mark * 100);
        updateStats();
        document.getElementById('next-ai').style.display = 'block';
    }

    function updateStats() {
        document.getElementById('xp').innerText = currentXP;
        document.getElementById('streak').innerText = currentStreak;
    }
</script>
</body>
</html>
