<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTIMATE SCIENCE SELECTOR | iPad Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bio: #00ff88;
            --chem: #00d9ff;
            --phys: #ff0055;
            --omni: #b100ff;
            --bg: #07090d;
            --card: #131722;
            --text: #ffffff;
            --correct: #00ff88;
            --wrong: #ff3b3b;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
            touch-action: manipulation; /* Prevents double-tap zoom on iPad */
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-user-select: none;
        }

        header {
            background: linear-gradient(135deg, #111 0%, #000 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid #333;
            transition: border-color 0.3s;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-weight: 900;
            font-size: 1.1rem;
        }

        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        /* MENU SCREEN STYLES */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (min-width: 600px) { .menu-grid { grid-template-columns: 1fr 1fr; } }

        .subject-card {
            background: var(--card);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .subject-card:active {
            transform: scale(0.95);
        }

        .subject-card h2 { margin: 0; font-size: 2rem; text-transform: uppercase; }
        .subject-card p { opacity: 0.7; font-weight: 700; margin-top: 10px; }

        /* QUIZ SCREEN STYLES */
        #quiz-screen { display: none; }

        .game-card {
            background: var(--card);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 30px;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }

        .subject-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 900;
            margin-bottom: 15px;
            color: #000;
            text-transform: uppercase;
        }

        .question-display {
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            background: rgba(255,255,255,0.02);
            border-radius: 18px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

        .btn-tap {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            color: white;
            padding: 20px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .btn-tap:active {
            transform: scale(0.96);
            color: #000;
        }

        .nav-btn {
            background: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .nav-btn:active { background: #555; }

        .feedback-pop {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: 900;
            z-index: 1000;
            pointer-events: none;
            display: none;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

    </style>
</head>
<body>

<header id="main-header">
    <h1 style="margin:0; font-size: 2.2rem; letter-spacing: -1px;">SCIENCE SELECTOR</h1>
    <p id="header-subtitle" style="opacity: 0.7; font-weight: 700;">Choose your revision path</p>
</header>

<div class="stats-bar">
    <button class="nav-btn" onclick="showMenu()" id="back-btn" style="display:none;">◀ MENU</button>
    <div style="flex-grow: 1; text-align: center;">XP: <span id="xp" style="color:#fff;">0</span></div>
    <div>STREAK: <span id="streak" style="color:var(--correct);">0</span></div>
</div>

<div class="container">
    
    <div id="menu-screen">
        <h2 style="text-align:center; margin-top:0;">Select Subject Bank</h2>
        <div class="menu-grid">
            <div class="subject-card" style="border-color: var(--bio);" onclick="startQuiz('Biology')">
                <h2 style="color: var(--bio);">Biology 🧬</h2>
                <p>Botany, Health, Evolution</p>
            </div>
            <div class="subject-card" style="border-color: var(--chem);" onclick="startQuiz('Chemistry')">
                <h2 style="color: var(--chem);">Chemistry 🧪</h2>
                <p>Reactions, Atoms, Metals</p>
            </div>
            <div class="subject-card" style="border-color: var(--phys);" onclick="startQuiz('Physics')">
                <h2 style="color: var(--phys);">Physics ⚛️</h2>
                <p>Waves, Forces, Space</p>
            </div>
            <div class="subject-card" style="border-color: var(--omni);" onclick="startQuiz('Omni')">
                <h2 style="color: var(--omni);">Omni-Test 🌀</h2>
                <p>All Subjects Randomized</p>
            </div>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-card" class="game-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="sub-badge" class="subject-badge">LOADING</span>
                <span id="q-counter" style="font-size: 0.9rem; font-weight: bold; opacity: 0.5;">Q: 1</span>
            </div>
            
            <div id="q-text" class="question-display">Initializing Data Banks...</div>
            <div id="options" class="options-grid"></div>
        </div>
    </div>

    <div id="feedback" class="feedback-pop"></div>

</div>

<script>
    // EXPANDED DATA BANKS
    const DATA_BANKS = {
        Biology: [
            { q: "What is the function of the Xylem?", a: "Transports water and minerals", o: ["Transports water and minerals", "Transports sucrose", "Site of photosynthesis", "Opens stomata"] },
            { q: "Which pathogen causes Salmonella?", a: "Bacteria", o: ["Bacteria", "Virus", "Fungi", "Protist"] },
            { q: "What do Lymphocytes produce?", a: "Antibodies", o: ["Antibodies", "Antigens", "Red Blood Cells", "Stomach Acid"] },
            { q: "What is a random change in DNA called?", a: "Mutation", o: ["Mutation", "Allele", "Extinction", "Zygote"] },
            { q: "Which cell is adapted for maximum light absorption?", a: "Palisade Cell", o: ["Palisade Cell", "Root Hair Cell", "Guard Cell", "Phloem"] },
            { q: "Osmosis is the movement of...", a: "Water only", o: ["Water only", "Gases only", "Dissolved sugars", "Any liquid"] },
            { q: "Which is a viral disease?", a: "Ebola", o: ["Ebola", "Ringworm", "Salmonella", "Cholera"] },
            { q: "What is the equation for Photosynthesis?", a: "CO2 + Water → Glucose + Oxygen", o: ["CO2 + Water → Glucose + Oxygen", "Glucose + O2 → CO2 + Water", "Water + O2 → Glucose", "CO2 + Light → Starch"] }
        ],
        Chemistry: [
            { q: "Is 'Melting Ice' a physical or chemical change?", a: "Physical Change", o: ["Physical Change", "Chemical Change", "Neutralisation", "Oxidation"] },
            { q: "What does an Exothermic reaction do?", a: "Transfers energy to surroundings", o: ["Transfers energy to surroundings", "Takes energy in", "Destroys atoms", "Requires a vacuum"] },
            { q: "Atoms with the same protons but different neutrons are...", a: "Isotopes", o: ["Isotopes", "Ions", "Alloys", "Molecules"] },
            { q: "What forms when a Metal reacts with Acid?", a: "Salt + Hydrogen", o: ["Salt + Hydrogen", "Salt + Water", "Metal Oxide", "Alkali + Hydrogen"] },
            { q: "Reactivity in Group 1...", a: "Increases going down", o: ["Increases going down", "Decreases going down", "Stays exactly the same", "Depends on the temperature"] },
            { q: "What is a Catalyst?", a: "Speeds up reaction without being used up", o: ["Speeds up reaction without being used up", "A type of metal alloy", "A reactant that makes more product", "Slows down an exothermic reaction"] },
            { q: "Which alloy is Iron + Carbon?", a: "Steel", o: ["Steel", "Brass", "Bronze", "Solder"] },
            { q: "Mendeleev's main achievement was...", a: "Leaving gaps for undiscovered elements", o: ["Leaving gaps for undiscovered elements", "Discovering the electron", "Inventing the microscope", "Making the first alloy"] }
        ],
        Physics: [
            { q: "What is the unit for Force?", a: "Newtons (N)", o: ["Newtons (N)", "Joules (J)", "Pascals (Pa)", "Hertz (Hz)"] },
            { q: "Sound waves are an example of...", a: "Longitudinal Waves", o: ["Longitudinal Waves", "Transverse Waves", "Electromagnetic Waves", "Standing Waves"] },
            { q: "What is 'k' in Hooke's Law (F = kx)?", a: "Spring Constant", o: ["Spring Constant", "Kinetic Energy", "Mass", "Extension"] },
            { q: "What phenomenon shows the universe is expanding?", a: "Red-shift", o: ["Red-shift", "Blue-shift", "Refraction", "Diffraction"] },
            { q: "Formula for Pressure?", a: "Force ÷ Area", o: ["Force ÷ Area", "Mass × Gravity", "Force × Distance", "Mass ÷ Volume"] },
            { q: "Light waves are...", a: "Transverse", o: ["Transverse", "Longitudinal", "Mechanical", "Stationary"] },
            { q: "Angle of Incidence always equals...", a: "Angle of Reflection", o: ["Angle of Reflection", "Angle of Refraction", "The Normal", "90 Degrees"] },
            { q: "What is the unit for Frequency?", a: "Hertz (Hz)", o: ["Hertz (Hz)", "Watts (W)", "Amps (A)", "Volts (V)"] }
        ]
    };

    const COLORS = {
        Biology: "var(--bio)",
        Chemistry: "var(--chem)",
        Physics: "var(--phys)",
        Omni: "var(--omni)"
    };

    let xp = 0;
    let streak = 0;
    let currentMode = "";
    let activeQueue = [];
    let questionCount = 0;

    function showFeedback(text, color) {
        const f = document.getElementById('feedback');
        f.innerText = text;
        f.style.color = color;
        f.style.display = 'block';
        setTimeout(() => f.style.display = 'none', 700);
    }

    function showMenu() {
        document.getElementById('menu-screen').style.display = 'block';
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('back-btn').style.display = 'none';
        document.getElementById('header-subtitle').innerText = "Choose your revision path";
        document.getElementById('main-header').style.borderBottomColor = "#333";
    }

    function startQuiz(mode) {
        currentMode = mode;
        questionCount = 0;
        activeQueue = [];

        if(mode === 'Omni') {
            // Combine all subjects and tag them
            Object.keys(DATA_BANKS).forEach(sub => {
                DATA_BANKS[sub].forEach(q => {
                    activeQueue.push({...q, subjectTag: sub});
                });
            });
        } else {
            // Load specific subject
            activeQueue = DATA_BANKS[mode].map(q => ({...q, subjectTag: mode}));
        }

        // Shuffle queue
        activeQueue.sort(() => Math.random() - 0.5);

        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('back-btn').style.display = 'block';
        document.getElementById('header-subtitle').innerText = `${mode} Mode Active`;
        
        loadNextQuestion();
    }

    function loadNextQuestion() {
        if(activeQueue.length === 0) {
            startQuiz(currentMode); // Loop back if they finish the bank
            return;
        }

        questionCount++;
        const q = activeQueue.pop(); // Take the last item
        const themeColor = COLORS[q.subjectTag];

        // UI Updates based on subject
        document.getElementById('q-counter').innerText = `Q: ${questionCount}`;
        document.getElementById('q-text').innerText = q.q;
        
        const badge = document.getElementById('sub-badge');
        badge.innerText = q.subjectTag;
        badge.style.background = themeColor;

        document.getElementById('quiz-card').style.borderColor = themeColor;
        document.getElementById('q-text').style.borderColor = themeColor;
        document.getElementById('main-header').style.borderBottomColor = themeColor;

        const optDiv = document.getElementById('options');
        optDiv.innerHTML = '';
        
        // Render Options
        [...q.o].sort(() => Math.random() - 0.5).forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-tap';
            btn.innerText = opt;
            btn.onclick = () => {
                if(opt === q.a) {
                    xp += 100;
                    streak++;
                    btn.style.background = themeColor;
                    btn.style.borderColor = themeColor;
                    showFeedback("CORRECT!", "var(--correct)");
                } else {
                    streak = 0;
                    btn.style.background = "rgba(255,59,59,0.2)";
                    btn.style.borderColor = "var(--wrong)";
                    showFeedback("WRONG", "var(--wrong)");
                }
                updateStats();
                
                // Disable all buttons to prevent double tapping
                Array.from(optDiv.children).forEach(b => b.disabled = true);
                
                setTimeout(loadNextQuestion, 400); // Short delay to see result
            };
            optDiv.appendChild(btn);
        });
    }

    function updateStats() {
        document.getElementById('xp').innerText = xp;
        document.getElementById('streak').innerText = streak;
        localStorage.setItem('ultimate_science_xp', xp);
    }

    // Initialize
    window.onload = () => {
        xp = parseInt(localStorage.getItem('ultimate_science_xp')) || 0;
        updateStats();
    };
</script>

</body>
</html>
