<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2v2 HUMAN FOOTBALL</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: 'Arial Black', sans-serif; overflow: hidden; }
        canvas { background: #2ecc71; border: 5px solid #fff; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #hud { display: flex; justify-content: space-between; width: 800px; font-size: 40px; margin-bottom: 10px; }
        .red { color: #ff4757; } .blue { color: #1e90ff; }
        .controls { font-size: 13px; opacity: 0.7; margin-top: 10px; line-height: 1.5; }
    </style>
</head>
<body>

<div id="hud">
    <div class="red">RED: <span id="s1">0</span></div>
    <div style="font-size: 16px; align-self: center; letter-spacing: 2px;">PRO SQUAD 2v2</div>
    <div class="blue">BLUE: <span id="s2">0</span></div>
</div>

<canvas id="field"></canvas>

<div class="controls">
    RED TEAM: [WAD] Move/Jump | [S] Swap Player<br>
    BLUE TEAM: [ARROWS] Move/Jump | [DOWN] Swap Player
</div>

<script>
    const canvas = document.getElementById('field');
    const ctx = canvas.getContext('2d');
    canvas.width = 800; canvas.height = 400;

    const gravity = 0.5;
    const friction = 0.98;
    let score1 = 0, score2 = 0;
    const ball = { x: 400, y: 200, vx: 0, vy: 0, r: 10 };

    class Player {
        constructor(x, y, color, team, id) {
            this.x = x; this.y = y; this.vx = 0; this.vy = 0;
            this.color = color; this.team = team; this.id = id;
            this.active = false; this.grounded = false;
            this.animTimer = 0;
            this.w = 20; this.h = 50; // Collision box
        }

        update(isManual, controls) {
            if (isManual) {
                if (keys[controls.left]) { this.vx = -5.5; this.animTimer += 0.2; }
                else if (keys[controls.right]) { this.vx = 5.5; this.animTimer += 0.2; }
                else { this.vx *= 0.8; this.animTimer = 0; }

                if (keys[controls.up] && this.grounded) {
                    this.vy = -12;
                    this.grounded = false;
                }
            } else {
                // Simple AI: Follow ball but stay in zone
                let homeX = this.team === 1 ? 150 : 650;
                let targetX = (ball.x + homeX) / 2;
                let dist = targetX - this.x;
                this.vx = Math.abs(dist) > 10 ? Math.sign(dist) * 3 : 0;
                if (this.vx !== 0) this.animTimer += 0.1;
            }

            this.vy += gravity;
            this.x += this.vx;
            this.y += this.vy;

            if (this.y + this.h > canvas.height) { this.y = canvas.height - this.h; this.vy = 0; this.grounded = true; }
            if (this.x < 0) this.x = 0;
            if (this.x + this.w > canvas.width) this.x = canvas.width - this.w;

            // Ball Physics Collision
            let cx = this.x + this.w/2, cy = this.y + this.h/2;
            let dx = ball.x - cx, dy = ball.y - cy;
            let d = Math.sqrt(dx*dx + dy*dy);
            if (d < 35) {
                let angle = Math.atan2(dy, dx);
                ball.vx = Math.cos(angle) * 9 + this.vx;
                ball.vy = Math.sin(angle) * 9 + this.vy;
                ball.x = cx + Math.cos(angle) * 36;
                ball.y = cy + Math.sin(angle) * 36;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x + this.w/2, this.y);

            // Active Marker (Halo)
            if (this.active) {
                ctx.beginPath();
                ctx.ellipse(0, 55, 15, 5, 0, 0, Math.PI*2);
                ctx.fillStyle = "rgba(255,255,255,0.4)";
                ctx.fill();
            }

            // Legs
            ctx.strokeStyle = "#333"; ctx.lineWidth = 4;
            let legSwing = Math.sin(this.animTimer * 5) * 15;
            // Leg 1
            ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(legSwing, 50); ctx.stroke();
            // Leg 2
            ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(-legSwing, 50); ctx.stroke();

            // Torso (Jersey)
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.active ? 1 : 0.6;
            ctx.fillRect(-10, 5, 20, 30);
            
            // Head
            ctx.fillStyle = "#ffdbac"; // Skin tone
            ctx.beginPath(); ctx.arc(0, -5, 10, 0, Math.PI*2); ctx.fill();

            // Jersey Number
            if (this.active) {
                ctx.fillStyle = "white";
                ctx.font = "bold 10px Arial";
                ctx.fillText(this.id + 1, -3, 25);
            }

            ctx.restore();
            ctx.globalAlpha = 1;
        }
    }

    const team1 = [new Player(200, 300, '#ff4757', 1, 0), new Player(100, 300, '#ff4757', 1, 1)];
    const team2 = [new Player(600, 300, '#1e90ff', 2, 0), new Player(700, 300, '#1e90ff', 2, 1)];
    let activeP1 = 0, activeP2 = 0;
    team1[0].active = true; team2[0].active = true;

    const keys = {};
    window.onkeydown = e => {
        keys[e.code] = true;
        if (e.code === 'KeyS') { team1[activeP1].active = false; activeP1 = (activeP1 + 1) % 2; team1[activeP1].active = true; }
        if (e.code === 'ArrowDown') { team2[activeP2].active = false; activeP2 = (activeP2 + 1) % 2; team2[activeP2].active = true; }
    };
    window.onkeyup = e => keys[e.code] = false;

    function reset() { ball.x = 400; ball.y = 150; ball.vx = 0; ball.vy = 0; }

    function loop() {
        team1.forEach((p, i) => p.update(i === activeP1, {up:'KeyW', left:'KeyA', right:'KeyD'}));
        team2.forEach((p, i) => p.update(i === activeP2, {up:'ArrowUp', left:'ArrowLeft', right:'ArrowRight'}));

        ball.vy += gravity * 0.4; ball.vx *= friction;
        ball.x += ball.vx; ball.y += ball.vy;

        // Bounce
        if (ball.x < 0 || ball.x > canvas.width) ball.vx *= -0.7;
        if (ball.y > canvas.height - ball.r) { ball.y = canvas.height - ball.r; ball.vy *= -0.5; }

        // Goals
        if (ball.y > 200) {
            if (ball.x < 25) { score2++; reset(); }
            if (ball.x > 775) { score1++; reset(); }
        }

        draw();
        requestAnimationFrame(loop);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Field Markings
        ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 2;
        ctx.strokeRect(0,0,800,400);
        ctx.beginPath(); ctx.moveTo(400,0); ctx.lineTo(400,400); ctx.stroke();
        ctx.beginPath(); ctx.arc(400, 200, 50, 0, Math.PI*2); ctx.stroke();

        // Goals
        ctx.fillStyle = "white";
        ctx.fillRect(0, 250, 10, 150);
        ctx.fillRect(790, 250, 10, 150);

        team1.forEach(p => p.draw());
        team2.forEach(p => p.draw());

        // Ball
        ctx.fillStyle = "white";
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "black"; ctx.lineWidth = 1; ctx.stroke();

        document.getElementById('s1').innerText = score1;
        document.getElementById('s2').innerText = score2;
    }

    loop();
</script>
</body>
</html>
