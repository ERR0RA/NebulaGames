<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON SQUAD 2v2: ULTIMATE</title>
    <style>
        :root { --red: #ff0055; --blue: #00d4ff; --gold: #f1c40f; }
        body { margin: 0; background: #0a0a0c; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: 'Orbitron', sans-serif; overflow: hidden; }
        canvas { background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; box-shadow: 0 0 50px rgba(0,0,0,0.8); cursor: none; }
        
        #ui-layer { position: absolute; width: 800px; height: 400px; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        #menu { pointer-events: all; background: rgba(0,0,0,0.9); padding: 30px; border-radius: 20px; border: 2px solid var(--gold); text-align: center; box-shadow: 0 0 30px rgba(241, 196, 15, 0.2); }
        h1 { margin: 0 0 20px 0; font-size: 32px; letter-spacing: 5px; color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        
        .mode-btn { display: block; width: 250px; padding: 12px; margin: 10px auto; background: transparent; border: 1px solid white; color: white; font-family: 'Orbitron', sans-serif; cursor: pointer; transition: 0.3s; border-radius: 5px; }
        .mode-btn:hover { background: white; color: black; box-shadow: 0 0 20px white; }

        #hud { position: absolute; top: -70px; display: flex; justify-content: space-between; width: 100%; font-size: 48px; font-weight: 900; pointer-events: none; }
        .score { text-shadow: 0 0 20px currentColor; }
        
        .controls-hint { position: absolute; bottom: -60px; font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 2px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

<div style="position: relative;">
    <div id="hud">
        <div class="score" style="color: var(--red)" id="s1">0</div>
        <div class="score" style="color: var(--blue)" id="s2">0</div>
    </div>

    <canvas id="field"></canvas>

    <div id="ui-layer">
        <div id="menu">
            <h1>NEON SQUAD</h1>
            <button class="mode-btn" onclick="startGame('P_VS_AI')">PLAYER VS AI</button>
            <button class="mode-btn" onclick="startGame('P_VS_P')">LOCAL 1 VS 1</button>
            <button class="mode-btn" onclick="startGame('PVP_VS_AI')">CO-OP VS AI</button>
            <button class="mode-btn" onclick="startGame('AI_VS_AI')">AI SPECTATE</button>
        </div>
    </div>
    
    <div class="controls-hint" id="hint">RED: WAD + S (Swap) | BLUE: ARROWS + DOWN (Swap)</div>
</div>

<script>
    const canvas = document.getElementById('field');
    const ctx = canvas.getContext('2d');
    canvas.width = 800; canvas.height = 400;

    const gravity = 0.5;
    const friction = 0.99;
    let score1 = 0, score2 = 0;
    let gameMode = '';
    let isRunning = false;
    let shake = 0;

    const ball = { x: 400, y: 200, vx: 0, vy: 0, r: 10, trail: [] };

    class Player {
        constructor(x, y, color, team, id) {
            this.x = x; this.y = y; this.vx = 0; this.vy = 0;
            this.color = color; this.team = team; this.id = id;
            this.active = false; this.grounded = false;
            this.w = 30; this.h = 50;
            this.maxSpeed = 7;
        }

        update(isManual, controls) {
            if (isManual) {
                if (keys[controls.left]) this.vx -= 0.8;
                else if (keys[controls.right]) this.vx += 0.8;
                else this.vx *= 0.8;
                if (keys[controls.up] && this.grounded) { this.vy = -12; this.grounded = false; }
            } else {
                // Tactical AI
                let targetX;
                if (this.id === 0) { // Attacker logic
                    targetX = ball.x + (this.team === 1 ? -20 : 20);
                } else { // Defender logic
                    targetX = (this.team === 1) ? Math.min(ball.x - 150, 150) : Math.max(ball.x + 150, 650);
                }
                
                let dx = targetX - (this.x + this.w/2);
                this.vx += Math.sign(dx) * 0.5;
                if (Math.abs(dx) < 10) this.vx *= 0.7;

                // Jump logic
                if (ball.y < this.y - 50 && Math.abs(ball.x - this.x) < 50 && this.grounded) {
                    this.vy = -11; this.grounded = false;
                }
            }

            this.vx = Math.max(-this.maxSpeed, Math.min(this.maxSpeed, this.vx));
            this.vy += gravity;
            this.x += this.vx; this.y += this.vy;

            if (this.y + this.h > canvas.height - 10) { 
                this.y = canvas.height - this.h - 10; this.vy = 0; this.grounded = true; 
            }
            this.x = Math.max(0, Math.min(canvas.width - this.w, this.x));

            // Collision with Ball
            let cx = this.x + this.w/2;
            let cy = this.y + this.h/2;
            let dbx = ball.x - cx;
            let dby = ball.y - cy;
            let dist = Math.sqrt(dbx*dbx + dby*dby);
            if (dist < 35) {
                let angle = Math.atan2(dby, dbx);
                ball.vx = Math.cos(angle) * 12 + this.vx;
                ball.vy = Math.sin(angle) * 12 + this.vy;
                shake = 5;
            }
        }

        draw() {
            ctx.save();
            ctx.shadowBlur = this.active ? 20 : 5;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.active ? 1.0 : 0.4;
            
            // Draw Body
            ctx.fillRect(this.x, this.y, this.w, this.h);
            
            // Draw "Visor"
            ctx.fillStyle = "white";
            let visorX = (this.team === 1) ? this.x + 18 : this.x + 2;
            ctx.fillRect(visorX, this.y + 10, 10, 5);
            
            if (this.active) {
                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.moveTo(this.x + this.w/2, this.y - 15);
                ctx.lineTo(this.x + this.w/2 - 5, this.y - 25);
                ctx.lineTo(this.x + this.w/2 + 5, this.y - 25);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    let team1 = [new Player(100, 300, '#ff0055', 1, 0), new Player(50, 300, '#ff0055', 1, 1)];
    let team2 = [new Player(700, 300, '#00d4ff', 2, 0), new Player(750, 300, '#00d4ff', 2, 1)];
    let activeP1 = 0, activeP2 = 0;
    const keys = {};

    function startGame(mode) {
        gameMode = mode;
        score1 = 0; score2 = 0;
        resetBall();
        document.getElementById('menu').style.display = 'none';
        isRunning = true;
    }

    function resetBall() {
        ball.x = 400; ball.y = 100; ball.vx = (Math.random() - 0.5) * 10; ball.vy = 0;
        ball.trail = [];
    }

    window.onkeydown = e => { 
        keys[e.code] = true; 
        if (e.code === 'KeyS') { team1[activeP1].active = false; activeP1 = (activeP1 + 1) % 2; team1[activeP1].active = true; }
        if (e.code === 'ArrowDown') { team2[activeP2].active = false; activeP2 = (activeP2 + 1) % 2; team2[activeP2].active = true; }
    };
    window.onkeyup = e => keys[e.code] = false;

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (shake > 0) {
            ctx.translate(Math.random()*shake - shake/2, Math.random()*shake - shake/2);
            shake *= 0.9;
        }

        // Draw Field
        ctx.strokeStyle = "rgba(255,255,255,0.05)";
        ctx.lineWidth = 2;
        for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
        
        // Goals
        ctx.fillStyle = "rgba(255, 0, 85, 0.2)"; ctx.fillRect(0, 200, 10, 200);
        ctx.fillStyle = "rgba(0, 212, 255, 0.2)"; ctx.fillRect(790, 200, 10, 200);

        if (isRunning) {
            // Update Teams based on Mode
            const p1Manual = (gameMode === 'P_VS_AI' || gameMode === 'P_VS_P' || gameMode === 'PVP_VS_AI');
            const p2Manual = (gameMode === 'P_VS_P');

            team1.forEach((p, i) => {
                p.active = (p1Manual && i === activeP1);
                p.update(p.active, {up:'KeyW', left:'KeyA', right:'KeyD'});
                p.draw();
            });

            team2.forEach((p, i) => {
                p.active = (p2Manual && i === activeP2);
                // Special case for PVP Co-op: Blue team is AI
                p.update(p.active, {up:'ArrowUp', left:'ArrowLeft', right:'ArrowRight'});
                p.draw();
            });

            // Ball Logic
            ball.vy += gravity * 0.6;
            ball.vx *= friction;
            ball.x += ball.vx; ball.y += ball.vy;
            
            // Trail
            ball.trail.push({x: ball.x, y: ball.y});
            if (ball.trail.length > 10) ball.trail.shift();
            ball.trail.forEach((t, i) => {
                ctx.beginPath(); ctx.arc(t.x, t.y, ball.r * (i/10), 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,255,255, ${i/20})`; ctx.fill();
            });

            // Wall Bounces
            if (ball.x < ball.r || ball.x > canvas.width - ball.r) {
                if (ball.y > 200) { // Goal area
                    if (ball.x < ball.r) { score2++; resetBall(); shake = 15; }
                    else { score1++; resetBall(); shake = 15; }
                } else {
                    ball.vx *= -0.7;
                    ball.x = ball.x < ball.r ? ball.r : canvas.width - ball.r;
                }
            }
            if (ball.y > canvas.height - ball.r - 10) { ball.vy *= -0.8; ball.y = canvas.height - ball.r - 10; }
            if (ball.y < ball.r) { ball.vy *= -0.8; ball.y = ball.r; }

            // Draw Ball
            ctx.shadowBlur = 15; ctx.shadowColor = "white";
            ctx.fillStyle = "white";
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }

        document.getElementById('s1').innerText = score1;
        document.getElementById('s2').innerText = score2;
        
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
