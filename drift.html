<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>COSMIC DRIFT</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020205;
            overflow: hidden;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            text-shadow: 0 0 10px #00f2ff;
        }

        #score {
            font-size: 32px;
            margin: 0;
            font-weight: bold;
        }

        #highScore {
            font-size: 14px;
            margin: 0;
            color: #6a6a8a;
        }

        #controls-hint {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #4a4a6a;
            font-size: 14px;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(2, 2, 5, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        #game-over-screen h1 {
            font-size: 64px;
            margin: 0;
            color: #ff0055;
            text-shadow: 0 0 20px #ff0055;
        }

        #final-score {
            font-size: 24px;
            color: #00f2ff;
            margin: 20px 0;
        }

        button {
            margin-top: 30px;
            padding: 15px 40px;
            background: transparent;
            border: 2px solid #00f2ff;
            color: #00f2ff;
            font-family: inherit;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            background-color: #00f2ff;
            color: #020205;
            box-shadow: 0 0 20px #00f2ff;
        }
    </style>
</head>
<body>

    <div id="ui">
        <p id="score">0</p>
        <p id="highScore">Best: 0</p>
    </div>

    <div id="controls-hint">TAP LEFT/RIGHT OR USE ARROWS TO DRIFT</div>

    <div id="game-over-screen">
        <h1>CRASHED</h1>
        <p id="final-score">SCORE: 0</p>
        <button onclick="resetGame()">Try Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Setup Canvas ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const hintEl = document.getElementById('controls-hint');

        let width, height;
        let scale = window.devicePixelRatio || 1;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * scale;
            canvas.height = height * scale;
            ctx.scale(scale, scale);
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Game State & Constants ---
        let gameActive = true;
        let score = 0;
        let highScore = localStorage.getItem('cosmicDriftBest') || 0;
        highScoreEl.innerText = `Best: ${highScore}`;
        
        const SHIP_SIZE = 15;
        const THRUST = 0.35;    // realistic force added per frame
        const FRICTION = 0.985;  // space drag (makes turning possible)
        const OBSTACLE_SPEED_BASE = 4;

        // --- Game Objects ---
        let ship = {
            x: width / 2,
            y: height - 100,
            vx: 0, // Velocity X
            w: SHIP_SIZE,
            h: SHIP_SIZE * 1.5,
            thruster: 0 // 0: none, -1: left, 1: right
        };

        let stars = [];
        let debris = []; // Active enemies
        let particles = []; // Visual flair

        // --- Initialization ---
        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2,
                    speed: Math.random() * 0.5 + 0.1
                });
            }
        }

        // --- Controls ---
        const handleInputStart = (isLeft) => {
            if (!gameActive) return;
            hintEl.style.display = 'none';
            ship.thruster = isLeft ? -1 : 1;
            spawnParticles(ship.x + (isLeft ? ship.w : 0), ship.y + ship.h/2, isLeft ? 1 : -1, '#00f2ff');
        };
        const handleInputEnd = () => { ship.thruster = 0; };

        // Mouse/Touch Controls
        window.addEventListener('mousedown', (e) => handleInputStart(e.clientX < width / 2));
        window.addEventListener('mouseup', handleInputEnd);
        window.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents scrolling
            handleInputStart(e.touches[0].clientX < width / 2);
        });
        window.addEventListener('touchend', handleInputEnd);

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') handleInputStart(true);
            if (e.code === 'ArrowRight' || e.code === 'KeyD') handleInputStart(false);
            if (e.code === 'Space' && !gameActive) resetGame();
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'ArrowRight' || e.code === 'KeyD') handleInputEnd();
        });


        // --- Core Functions ---
        function spawnDebris() {
            const size = Math.random() * 40 + 20;
            debris.push({
                x: Math.random() * (width - size),
                y: -size,
                w: size,
                h: size * (Math.random() * 0.5 + 0.7),
                speed: OBSTACLE_SPEED_BASE + (score / 15),
                rot: Math.random() * Math.PI * 2,
                rotSpd: (Math.random() - 0.5) * 0.1
            });
        }

        function spawnParticles(x, y, vxDir, color) {
            for(let i=0; i<5; i++) {
                particles.push({
                    x: x, y: y,
                    vx: vxDir * (Math.random() * 3 + 1),
                    vy: (Math.random() - 0.5) * 2,
                    life: Math.random() * 20 + 10,
                    color: color
                });
            }
        }

        function resetGame() {
            score = 0; scoreEl.innerText = score;
            gameActive = true;
            debris = []; particles = [];
            ship.x = width / 2; ship.vx = 0;
            gameOverScreen.style.display = 'none';
            initStars();
            loop();
        }

        function gameOver() {
            gameActive = false;
            finalScoreEl.innerText = `SCORE: ${score}`;
            gameOverScreen.style.display = 'flex';
            
            // Explosion
            spawnParticles(ship.x, ship.y, 1, '#ff0055');
            spawnParticles(ship.x, ship.y, -1, '#ff0055');

            if (score > highScore) {
                highScore = score;
                highScoreEl.innerText = `Best: ${highScore}`;
                highScoreEl.style.color = '#00f2ff';
                localStorage.setItem('cosmicDriftBest', highScore);
            }
        }

        // --- The Main Game Loop (The Heart) ---
        let frame = 0;
        function loop() {
            if (!gameActive) return;
            frame++;

            // 1. Logic: Ship Physics (REALISTIC INERTIA)
            if (ship.thruster === -1) ship.vx -= THRUST; // Apply Left Force
            if (ship.thruster === 1) ship.vx += THRUST;  // Apply Right Force
            
            ship.vx *= FRICTION; // Constant space 'drag'
            ship.x += ship.vx;   // Move based on velocity

            // Visual thruster particles
            if(ship.thruster !== 0 && frame % 2 === 0) {
                 spawnParticles(ship.x + (ship.thruster===-1 ? ship.w : 0), ship.y + ship.h/2, ship.thruster===-1 ? 1 : -1, '#00f2ff44');
            }

            // Screen edge handling (Drift around the world)
            if (ship.x > width) ship.x = -ship.w;
            if (ship.x < -ship.w) ship.x = width;

            // 2. Logic: Spawn Debris
            if (frame % Math.max(15, 60 - Math.floor(score/5)) === 0) spawnDebris();

            // 3. Drawing: Setup
            ctx.fillStyle = '#020205'; // Deep black space
            ctx.fillRect(0, 0, width, height);

            // 4. Drawing & Logic: Stars (Parallax Background)
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > height) star.y = 0;
                ctx.globalAlpha = star.size / 2; // faint stars
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1;

            // 5. Drawing & Logic: Particles (The Juice)
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life--;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, 2, 2);
                if(p.life <= 0) particles.splice(i, 1);
            });
            ctx.globalAlpha = 1;

            // 6. Drawing: Ship (The Player)
            ctx.save();
            ctx.translate(ship.x + ship.w / 2, ship.y + ship.h / 2);
            // Visual tilt based on velocity
            ctx.rotate(ship.vx * 0.02); 
            
            // Neon Glow effect
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f2ff';
            ctx.fillStyle = '#fff';
            
            // Draw Triangle Ship
            ctx.beginPath();
            ctx.moveTo(0, -ship.h / 2); // Nose
            ctx.lineTo(ship.w / 2, ship.h / 2); // Right back
            ctx.lineTo(-ship.w / 2, ship.h / 2); // Left back
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            ctx.shadowBlur = 0; // Turn off glow for performance

            // 7. Drawing & Logic: Debris (The Enemies)
            debris.forEach((d, i) => {
                d.y += d.speed;
                d.rot += d.rotSpd;

                // Collision Detection (Math-based realism)
                // If ship center is inside the debris box
                if (ship.x + ship.w/2 > d.x && ship.x + ship.w/2 < d.x + d.w &&
                    ship.y + ship.h/2 > d.y && ship.y + ship.h/2 < d.y + d.h) {
                    gameOver();
                }

                // Score & Cleanup
                if (d.y > height) {
                    debris.splice(i, 1);
                    score++;
                    scoreEl.innerText = score;
                    // Satisfying score visual feedback
                    scoreEl.style.textShadow = '0 0 20px #00f2ff, 0 0 10px #fff';
                    setTimeout(()=>scoreEl.style.textShadow = '0 0 10px #00f2ff', 100);
                }

                // Draw rotated debris (more realistic falling rocks)
                ctx.save();
                ctx.translate(d.x + d.w/2, d.y + d.h/2);
                ctx.rotate(d.rot);
                ctx.fillStyle = '#2a2a3a';
                ctx.strokeStyle = '#6a6a8a';
                ctx.lineWidth = 1;
                ctx.fillRect(-d.w/2, -d.h/2, d.w, d.h);
                ctx.strokeRect(-d.w/2, -d.h/2, d.w, d.h);
                ctx.restore();
            });

            requestAnimationFrame(loop);
        }

        // --- Start ---
        initStars();
        loop();

    </script>
</body>
</html>
