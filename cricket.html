<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRICKET PVP ULTIMATE</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#070b14;
  font-family:Arial;
  color:white;
}

canvas{
  display:block;
  background:linear-gradient(to bottom,#87ceeb 0%,#87ceeb 40%,#2ecc71 40%,#1f8f45 100%);
}

#ui{
  position:absolute;
  top:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
  font-size:20px;
  font-weight:bold;
}

.panel{
  background:rgba(0,0,0,0.5);
  padding:10px 15px;
  border-radius:10px;
}

#msg{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:60px;
  opacity:0;
  transition:0.2s;
  color:gold;
  text-shadow:0 0 20px orange;
}

#bar{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  width:300px;
  height:15px;
  background:#222;
  border-radius:999px;
  overflow:hidden;
  border:2px solid white;
}

#zone{
  position:absolute;
  left:40%;
  width:20%;
  height:100%;
  background:#00ff88;
}

#marker{
  position:absolute;
  width:8px;
  height:100%;
  background:white;
}
</style>
</head>

<body>

<div id="ui">
  <div class="panel">P1: <span id="p1">0</span></div>
  <div class="panel">P2: <span id="p2">0</span></div>
  <div class="panel">TARGET: <span id="target">0</span></div>
  <div class="panel">WICKETS: <span id="wickets">3</span></div>
</div>

<div id="msg"></div>

<div id="bar">
  <div id="zone"></div>
  <div id="marker"></div>
</div>

<canvas id="c"></canvas>

<script>

const c = document.getElementById("c");
const ctx = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

let state = "P1";
let p1=0,p2=0,wickets=3,target=0;

let bat = {x:c.width/2,y:c.height-120};
let ball = {x:0,y:0,vx:0,vy:0,active:false,curve:0,fire:false};

let bowler = {aim:0};

let marker = document.getElementById("marker");
let pos=0,dir=1;

let shake=0;

function msg(t){
  let m=document.getElementById("msg");
  m.innerText=t;
  m.style.opacity=1;
  setTimeout(()=>m.style.opacity=0,800);
}

function bowl(){
  if(ball.active) return;

  ball.x=c.width/2;
  ball.y=120;

  ball.vx=bowler.aim;
  ball.vy=7+Math.random()*4;
  ball.curve=(Math.random()-0.5)*2;

  ball.active=true;
  ball.fire=false;
}

function swing(){

  if(!ball.active) return;

  let dist=Math.abs(ball.x-bat.x);

  let timing=pos/300;
  let perfect=timing>0.4 && timing<0.6;

  if(dist<80){

    let runs=1;

    if(perfect){
      runs=6;
      ball.fire=true;
      shake=20;
      msg("SIX!");
    } else {
      runs=Math.random()>0.5?4:1;
      msg(runs+" RUNS");
    }

    if(state==="P1"){
      p1+=runs;
      document.getElementById("p1").innerText=p1;
    } else {
      p2+=runs;
      document.getElementById("p2").innerText=p2;
    }

    ball.active=false;
  }
}

function out(){
  wickets--;
  document.getElementById("wickets").innerText=wickets;
  msg("OUT!");
  ball.active=false;

  if(wickets<=0) next();
}

function next(){

  if(state==="P1"){
    state="P2";
    wickets=3;
    target=p1+1;
    document.getElementById("target").innerText=target;
    msg("P2 CHASE");
  } else {
    alert(p1>p2?"P1 WINS":"P2 WINS");
    location.reload();
  }
}

function updateBall(){

  if(!ball.active) return;

  ball.x+=ball.vx+ball.curve;
  ball.y+=ball.vy;

  ball.vy+=0.25;

  if(ball.y>bat.y && Math.abs(ball.x-bat.x)<30){
    out();
  }

  if(ball.y>c.height){
    ball.active=false;
    setTimeout(bowl,800);
  }
}

function timingBar(){

  pos+=4*dir;
  if(pos>290)dir=-1;
  if(pos<0)dir=1;

  marker.style.left=pos+"px";
}

function draw(){

  if(shake>0){
    shake*=0.9;
    ctx.setTransform(1,0,0,1,(Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  } else ctx.setTransform(1,0,0,1,0,0);

  ctx.clearRect(0,0,c.width,c.height);

  // bat
  ctx.fillStyle="orange";
  ctx.fillRect(bat.x-60,bat.y,120,15);

  // ball
  if(ball.active){
    ctx.fillStyle=ball.fire?"#ff5500":"red";
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,10,0,Math.PI*2);
    ctx.fill();
  }

  updateBall();
  timingBar();

  requestAnimationFrame(draw);
}

window.addEventListener("mousemove",e=>{
  bat.x=e.clientX;
});

window.addEventListener("keydown",e=>{

  if(e.code==="Space") swing();

  if(e.key==="ArrowLeft") bowler.aim=-2;
  if(e.key==="ArrowRight") bowler.aim=2;
  if(e.key==="ArrowUp") bowl();
});

window.addEventListener("keyup",e=>{
  bowler.aim=0;
});

setTimeout(bowl,1000);
draw();

</script>

</body>
</html>
