<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRICKET ULTRA X</title>

<style>

:root{
  --grass:#1f8f45;
  --pitch:#d8c07a;
  --glow:#00ff88;
}

body{
  margin:0;
  overflow:hidden;
  background:#050608;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

canvas{
  display:block;
  margin:auto;
  background:
    linear-gradient(to bottom,
    #08111f 0%,
    #0f2747 35%,
    #1f8f45 35%,
    #176d37 100%);
}

#ui{
  position:absolute;
  top:15px;
  width:100%;
  display:flex;
  justify-content:space-around;
  font-size:2rem;
  font-weight:bold;
  z-index:10;
  text-shadow:0 0 10px black;
}

.panel{
  background:rgba(0,0,0,0.4);
  padding:10px 20px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
}

#msg{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:5rem;
  font-weight:900;
  color:#ffd700;
  opacity:0;
  pointer-events:none;
  text-shadow:
    0 0 20px #ff8800,
    0 0 40px #ff5500;
  transition:0.3s;
  z-index:20;
}

#timingBar{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  width:300px;
  height:18px;
  background:#222;
  border-radius:999px;
  overflow:hidden;
  border:2px solid white;
}

#timingZone{
  position:absolute;
  left:42%;
  width:16%;
  height:100%;
  background:#00ff88;
}

#marker{
  position:absolute;
  width:10px;
  height:100%;
  background:white;
}

#controls{
  position:absolute;
  bottom:60px;
  width:100%;
  text-align:center;
  opacity:0.7;
}

</style>
</head>

<body>

<div id="ui">

  <div class="panel">
    SCORE:
    <span id="score">0</span>
  </div>

  <div class="panel">
    WICKETS:
    <span id="wickets">3</span>
  </div>

  <div class="panel">
    COMBO:
    <span id="combo">0</span>
  </div>

</div>

<div id="msg">SUPER SIX!</div>

<div id="timingBar">
  <div id="timingZone"></div>
  <div id="marker"></div>
</div>

<div id="controls">
  CLICK OR SPACE TO SWING
</div>

<canvas id="game"></canvas>

<script>

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

canvas.width =
  window.innerWidth;

canvas.height =
  window.innerHeight;

const scoreEl =
  document.getElementById("score");

const wicketsEl =
  document.getElementById("wickets");

const comboEl =
  document.getElementById("combo");

const msgEl =
  document.getElementById("msg");

const marker =
  document.getElementById("marker");

let score = 0;
let wickets = 3;
let combo = 0;

let shake = 0;

const particles = [];

const bat = {
  x: canvas.width / 2,
  y: canvas.height - 140,
  w: 120,
  h: 20,
  angle:0,
  swinging:false
};

const stumps = {
  x: canvas.width/2 - 20,
  y: canvas.height - 170,
  w:40,
  h:70
};

const ball = {
  x: canvas.width/2,
  y: 160,
  r:12,
  vx:0,
  vy:0,
  curve:0,
  active:false,
  fire:false,
  trail:[]
};

let timingPos = 0;
let timingDir = 1;

function showMsg(text){

  msgEl.innerText = text;
  msgEl.style.opacity = 1;

  setTimeout(()=>{
    msgEl.style.opacity = 0;
  },900);
}

function createParticles(x,y,color,count){

  for(let i=0;i<count;i++){

    particles.push({
      x,
      y,
      vx:(Math.random()-0.5)*12,
      vy:(Math.random()-0.5)*12,
      size:Math.random()*8+2,
      alpha:1,
      color
    });
  }
}

function bowl(){

  if(ball.active) return;

  ball.x = canvas.width/2;
  ball.y = 140;

  ball.vx =
    (Math.random()-0.5)*4;

  ball.vy =
    8 + Math.random()*4;

  ball.curve =
    (Math.random()-0.5)*1.5;

  ball.active = true;
  ball.fire = false;
  ball.trail = [];
}

function swing(){

  if(bat.swinging) return;

  bat.swinging = true;

  setTimeout(()=>{
    bat.swinging = false;
  },220);

  if(!ball.active) return;

  const dist =
    Math.abs(ball.x - bat.x);

  if(ball.y > bat.y - 60 &&
     ball.y < bat.y + 20 &&
     dist < 90){

    hitBall();
  }
}

function hitBall(){

  const timing =
    timingPos / 300;

  let perfect =
    timing > 0.42 &&
    timing < 0.58;

  ball.vy =
    -(12 + Math.random()*8);

  ball.vx =
    (ball.x - bat.x) * 0.25;

  let points = 1;

  if(perfect){

    points = 6;

    ball.fire = true;

    combo++;

    shake = 16;

    showMsg("SUPER SIX!");

    createParticles(
      ball.x,
      ball.y,
      "#ff6600",
      50
    );

  } else {

    points =
      Math.random() > 0.5
      ? 4
      : 1;

    combo = 0;

    showMsg(points + " RUNS");
  }

  score += points;

  scoreEl.innerText = score;

  comboEl.innerText = combo;
}

function drawCrowd(){

  for(let i=0;i<canvas.width;i+=20){

    ctx.fillStyle =
      i % 40 === 0
      ? "#3498db"
      : "#e74c3c";

    ctx.fillRect(i,180,14,30);
  }
}

function drawPitch(){

  ctx.fillStyle =
    "#d8c07a";

  ctx.beginPath();

  ctx.moveTo(canvas.width/2 - 120, 140);

  ctx.lineTo(canvas.width/2 + 120, 140);

  ctx.lineTo(canvas.width/2 + 260, canvas.height);

  ctx.lineTo(canvas.width/2 - 260, canvas.height);

  ctx.fill();
}

function drawStumps(){

  ctx.shadowBlur = 20;
  ctx.shadowColor = "#00ff88";

  ctx.fillStyle = "white";

  ctx.fillRect(stumps.x, stumps.y, 6, stumps.h);
  ctx.fillRect(stumps.x+16, stumps.y, 6, stumps.h);
  ctx.fillRect(stumps.x+32, stumps.y, 6, stumps.h);

  ctx.shadowBlur = 0;
}

function drawBat(){

  ctx.save();

  ctx.translate(
    bat.x,
    bat.y
  );

  if(bat.swinging){

    bat.angle -= 0.25;

  } else {

    bat.angle *= 0.7;
  }

  ctx.rotate(bat.angle);

  ctx.fillStyle =
    "#d35400";

  ctx.shadowBlur = 20;
  ctx.shadowColor = "#ff8800";

  ctx.fillRect(
    -bat.w/2,
    -bat.h/2,
    bat.w,
    bat.h
  );

  ctx.restore();

  ctx.shadowBlur = 0;
}

function drawBall(){

  if(!ball.active) return;

  ball.trail.push({
    x:ball.x,
    y:ball.y
  });

  if(ball.trail.length > 12){

    ball.trail.shift();
  }

  for(let i=0;i<ball.trail.length;i++){

    const t =
      ball.trail[i];

    ctx.beginPath();

    ctx.fillStyle =
      ball.fire
      ? `rgba(255,120,0,${i/12})`
      : `rgba(255,255,255,${i/20})`;

    ctx.arc(
      t.x,
      t.y,
      ball.r * (i/12),
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.beginPath();

  ctx.fillStyle =
    ball.fire
    ? "#ff5500"
    : "#ff3333";

  ctx.shadowBlur =
    ball.fire
    ? 40
    : 10;

  ctx.shadowColor =
    ball.fire
    ? "#ff8800"
    : "#ff0000";

  ctx.arc(
    ball.x,
    ball.y,
    ball.r,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur = 0;
}

function updateBall(){

  if(!ball.active) return;

  ball.x +=
    ball.vx +
    ball.curve;

  ball.y +=
    ball.vy;

  if(ball.fire){

    ball.vy += 0.15;

  } else {

    ball.vy += 0.25;
  }

  if(ball.y > stumps.y &&
     ball.y < stumps.y + 30 &&
     ball.x > stumps.x &&
     ball.x < stumps.x + stumps.w &&
     ball.vy > 0){

    wickets--;

    wicketsEl.innerText =
      wickets;

    combo = 0;

    comboEl.innerText = combo;

    showMsg("OUT!");

    createParticles(
      ball.x,
      ball.y,
      "#ffffff",
      30
    );

    ball.active = false;

    if(wickets <= 0){

      setTimeout(()=>{

        alert(
          "GAME OVER\n\nFINAL SCORE: " + score
        );

        score = 0;
        wickets = 3;
        combo = 0;

        scoreEl.innerText = 0;
        wicketsEl.innerText = 3;
        comboEl.innerText = 0;

      },300);
    }

    return;
  }

  if(ball.y < -200 ||
     ball.y > canvas.height + 200 ||
     ball.x < -200 ||
     ball.x > canvas.width + 200){

    ball.active = false;

    setTimeout(bowl,1000);
  }
}

function updateParticles(){

  for(let i=particles.length-1;i>=0;i--){

    const p =
      particles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.alpha -= 0.02;

    p.size *= 0.98;

    ctx.globalAlpha =
      p.alpha;

    ctx.fillStyle =
      p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha = 1;

    if(p.alpha <= 0){

      particles.splice(i,1);
    }
  }
}

function updateTiming(){

  timingPos +=
    4 * timingDir;

  if(timingPos >= 290){

    timingDir = -1;
  }

  if(timingPos <= 0){

    timingDir = 1;
  }

  marker.style.left =
    timingPos + "px";
}

function gameLoop(){

  if(shake > 0){

    shake *= 0.9;

    ctx.setTransform(
      1,
      0,
      0,
      1,
      (Math.random()-0.5)*shake,
      (Math.random()-0.5)*shake
    );

  } else {

    ctx.setTransform(
      1,0,0,1,0,0
    );
  }

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawCrowd();
  drawPitch();
  drawStumps();
  drawBat();
  drawBall();

  updateBall();
  updateParticles();
  updateTiming();

  requestAnimationFrame(gameLoop);
}

window.addEventListener("mousemove", e=>{

  bat.x = e.clientX;
});

window.addEventListener("keydown", e=>{

  if(e.code === "Space"){

    swing();
  }
});

window.addEventListener("mousedown", swing);

bowl();

gameLoop();

</script>

</body>
</html>
