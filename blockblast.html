<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEBULA VOXEL ENGINE</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.7); color: #00ff88; padding: 20px;
            border-radius: 10px; pointer-events: none; border: 1px solid #333;
        }
        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
        }
        .slot { width: 40px; height: 40px; border: 2px solid #555; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .active { border-color: #00ff88; box-shadow: 0 0 10px #00ff88; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 15px; height: 15px; border: 2px solid white;
            border-radius: 50%; transform: translate(-50%, -50%); mix-blend-mode: difference;
        }
    </style>
</head>
<body>

<div id="ui">
    <b style="font-size: 1.2rem;">NEBULA 3D</b><br>
    <small>WASD to Move | SPACE to Jump</small><br>
    <small>LEFT CLICK: Mine | SHIFT+CLICK: Build</small><br>
    <small>NUM KEYS 1-5: Change Block</small>
</div>

<div id="hotbar">
    <div id="s1" class="slot active">Dirt</div>
    <div id="s2" class="slot">Stone</div>
    <div id="s3" class="slot">Wood</div>
    <div id="s4" class="slot">Leaf</div>
    <div id="s5" class="slot">Glass</div>
</div>

<div id="crosshair"></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- GAME STATE ---
    const worldData = JSON.parse(localStorage.getItem('nebula_world')) || {};
    const CHUNK_SIZE = 16;
    const RENDER_DIST = 2; // Radius of chunks to load
    let currentBlock = 'dirt';
    const blockTypes = ['dirt', 'stone', 'wood', 'leaf', 'glass'];

    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
    sunLight.position.set(10, 20, 10);
    scene.add(sunLight);

    // --- TEXTURES/MATERIALS ---
    const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
    const mats = {
        dirt: new THREE.MeshLambertMaterial({ color: 0x6b4c35 }),
        stone: new THREE.MeshLambertMaterial({ color: 0x808080 }),
        wood: new THREE.MeshLambertMaterial({ color: 0x4d2600 }),
        leaf: new THREE.MeshLambertMaterial({ color: 0x228b22, transparent: true, opacity: 0.9 }),
        glass: new THREE.MeshLambertMaterial({ color: 0xadd8e6, transparent: true, opacity: 0.4 })
    };

    const blocks = new Map();

    // --- WORLD ENGINE ---
    function getNoiseHeight(x, z) {
        return Math.floor(Math.sin(x * 0.1) * 3 + Math.cos(z * 0.1) * 3 + 8);
    }

    function addBlock(x, y, z, type, save = true) {
        const key = `${x},${y},${z}`;
        if (blocks.has(key)) return;

        const mesh = new THREE.Mesh(cubeGeo, mats[type]);
        mesh.position.set(x, y, z);
        scene.add(mesh);
        blocks.set(key, mesh);
        
        if (save) {
            worldData[key] = type;
            localStorage.setItem('nebula_world', JSON.stringify(worldData));
        }
    }

    function loadChunk(cx, cz) {
        for (let x = cx * CHUNK_SIZE; x < (cx + 1) * CHUNK_SIZE; x++) {
            for (let z = cz * CHUNK_SIZE; z < (cz + 1) * CHUNK_SIZE; z++) {
                const h = getNoiseHeight(x, z);
                for (let y = 0; y <= h; y++) {
                    const key = `${x},${y},${z}`;
                    if (worldData[key] === "null") continue; // Previously mined
                    const type = worldData[key] || (y === h ? 'dirt' : y < h - 3 ? 'stone' : 'dirt');
                    addBlock(x, y, z, type, false);
                }
            }
        }
    }

    // --- CONTROLS ---
    let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
    let vel = new THREE.Vector3(), dir = new THREE.Vector3();

    document.addEventListener('click', () => document.body.requestPointerLock());
    
    document.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW') moveF = true;
        if (e.code === 'KeyS') moveB = true;
        if (e.code === 'KeyA') moveL = true;
        if (e.code === 'KeyD') moveR = true;
        if (e.code === 'Space' && canJump) { vel.y += 5; canJump = false; }
        
        if (e.key >= 1 && e.key <= 5) {
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
            document.getElementById('s' + e.key).classList.add('active');
            currentBlock = blockTypes[e.key - 1];
        }
    });

    document.addEventListener('keyup', (e) => {
        if (e.code === 'KeyW') moveF = false;
        if (e.code === 'KeyS') moveB = false;
        if (e.code === 'KeyA') moveL = false;
        if (e.code === 'KeyD') moveR = false;
    });

    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        }
    });

    const raycaster = new THREE.Raycaster();
    document.addEventListener('mousedown', (e) => {
        if (!document.pointerLockElement) return;
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const intersects = raycaster.intersectObjects(Array.from(blocks.values()));

        if (intersects.length > 0) {
            const intersect = intersects[0];
            const p = intersect.object.position;
            if (e.shiftKey) {
                const buildPos = p.clone().add(intersect.face.normal);
                addBlock(Math.round(buildPos.x), Math.round(buildPos.y), Math.round(buildPos.z), currentBlock);
            } else {
                scene.remove(intersect.object);
                const key = `${Math.round(p.x)},${Math.round(p.y)},${Math.round(p.z)}`;
                blocks.delete(key);
                worldData[key] = "null";
                localStorage.setItem('nebula_world', JSON.stringify(worldData));
            }
        }
    });

    // --- INITIAL SPAWN ---
    camera.position.set(8, 15, 8); // Start above ground
    camera.rotation.order = 'YXZ';

    // --- MAIN LOOP ---
    let prevTime = performance.now();
    function animate() {
        requestAnimationFrame(animate);
        const time = performance.now();
        const delta = (time - prevTime) / 1000;

        // Gravity & Physics
        vel.x -= vel.x * 10.0 * delta;
        vel.z -= vel.z * 10.0 * delta;
        vel.y -= 9.8 * delta; 

        dir.z = Number(moveF) - Number(moveB);
        dir.x = Number(moveR) - Number(moveL);
        dir.normalize();

        if (moveF || moveB) vel.z -= dir.z * 40.0 * delta;
        if (moveL || moveR) vel.x -= dir.x * 40.0 * delta;

        camera.translateX(-vel.x * delta);
        camera.translateZ(vel.z * delta);
        camera.position.y += vel.y * delta;

        // Basic Floor Collision
        const currentH = getNoiseHeight(camera.position.x, camera.position.z) + 2;
        if (camera.position.y < currentH) {
            vel.y = 0;
            camera.position.y = currentH;
            canJump = true;
        }

        // Infinite Generation Check
        const curCX = Math.floor(camera.position.x / CHUNK_SIZE);
        const curCZ = Math.floor(camera.position.z / CHUNK_SIZE);
        for(let x = -RENDER_DIST; x <= RENDER_DIST; x++) {
            for(let z = -RENDER_DIST; z <= RENDER_DIST; z++) {
                loadChunk(curCX + x, curCZ + z);
            }
        }

        renderer.render(scene, camera);
        prevTime = time;
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
