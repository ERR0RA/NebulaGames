<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D BLOCK-WORLD</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        #ui {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.6); color: white; padding: 15px;
            border-radius: 8px; pointer-events: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px; border: 2px solid white;
            border-radius: 50%; transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

<div id="ui">
    <b>3D MINER</b><br>
    WASD: Move | SPACE: Jump<br>
    CLICK: Lock Mouse & Mine | SHIFT+CLICK: Build<br>
    <span id="status">World Auto-Saves to Browser</span>
</div>
<div id="crosshair"></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- CONFIG ---
    const TILE_SIZE = 1;
    const CHUNK_SIZE = 16;
    const worldData = JSON.parse(localStorage.getItem('my3DWorld')) || {};

    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
    scene.add(light);

    // --- TEXTURES (Procedural) ---
    const loader = new THREE.TextureLoader();
    const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
    const materials = {
        grass: new THREE.MeshLambertMaterial({ color: 0x4daa3d }),
        dirt: new THREE.MeshLambertMaterial({ color: 0x6b4c35 }),
        stone: new THREE.MeshLambertMaterial({ color: 0x7a7a7a })
    };

    const blocks = new Map();

    // --- WORLD GENERATION ---
    function getTerrainHeight(x, z) {
        // Simple noise approximation
        return Math.floor(Math.sin(x * 0.2) * 2 + Math.cos(z * 0.2) * 2 + 5);
    }

    function addBlock(x, y, z, type, save = true) {
        const key = `${x},${y},${z}`;
        if (blocks.has(key)) return;

        const mesh = new THREE.Mesh(cubeGeo, materials[type]);
        mesh.position.set(x, y, z);
        scene.add(mesh);
        blocks.set(key, mesh);
        
        if (save) {
            worldData[key] = type;
            localStorage.setItem('my3DWorld', JSON.stringify(worldData));
        }
    }

    // Initialize initial area
    for (let x = -CHUNK_SIZE; x < CHUNK_SIZE; x++) {
        for (let z = -CHUNK_SIZE; z < CHUNK_SIZE; z++) {
            const h = getTerrainHeight(x, z);
            for (let y = 0; y <= h; y++) {
                let type = 'grass';
                if (y < h) type = 'dirt';
                if (y < h - 2) type = 'stone';
                
                // Load from save if exists, otherwise generate
                const key = `${x},${y},${z}`;
                if (worldData[key] === null) continue; // Block was mined
                addBlock(x, y, z, worldData[key] || type, false);
            }
        }
    }

    // --- CONTROLS ---
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();

    document.addEventListener('click', () => document.body.requestPointerLock());
    
    document.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW') moveForward = true;
        if (e.code === 'KeyS') moveBackward = true;
        if (e.code === 'KeyA') moveLeft = true;
        if (e.code === 'KeyD') moveRight = true;
        if (e.code === 'Space' && canJump) { velocity.y += 5; canJump = false; }
    });

    document.addEventListener('keyup', (e) => {
        if (e.code === 'KeyW') moveForward = false;
        if (e.code === 'KeyS') moveBackward = false;
        if (e.code === 'KeyA') moveLeft = false;
        if (e.code === 'KeyD') moveRight = false;
    });

    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        }
    });

    // Mining / Building
    const raycaster = new THREE.Raycaster();
    document.addEventListener('mousedown', (e) => {
        if (!document.pointerLockElement) return;

        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const intersects = raycaster.intersectObjects(Array.from(blocks.values()));

        if (intersects.length > 0) {
            const intersect = intersects[0];
            if (e.shiftKey) {
                // Build
                const pos = intersect.object.position.clone().add(intersect.face.normal);
                addBlock(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z), 'dirt');
            } else {
                // Mine
                const obj = intersect.object;
                const key = `${Math.round(obj.position.x)},${Math.round(obj.position.y)},${Math.round(obj.position.z)}`;
                scene.remove(obj);
                blocks.delete(key);
                worldData[key] = null; // Mark as deleted
                localStorage.setItem('my3DWorld', JSON.stringify(worldData));
            }
        }
    });

    camera.position.y = 10;
    camera.rotation.order = 'YXZ';

    // --- GAME LOOP ---
    let prevTime = performance.now();
    function animate() {
        requestAnimationFrame(animate);

        const time = performance.now();
        const delta = (time - prevTime) / 1000;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;
        velocity.y -= 9.8 * delta; // Gravity

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 400.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 400.0 * delta;

        camera.translateX(-velocity.x * delta);
        camera.translateZ(velocity.z * delta);
        camera.position.y += velocity.y * delta;

        if (camera.position.y < 2) {
            velocity.y = 0;
            camera.position.y = 2;
            canJump = true;
        }

        renderer.render(scene, camera);
        prevTime = time;
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
