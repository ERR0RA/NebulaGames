<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEBULA VOXEL ENGINE | PRO</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Inter', sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.8); color: #00ff88; padding: 15px;
            border-radius: 8px; pointer-events: none; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        #menu {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; color: white; gap: 20px;
        }
        .btn {
            background: #00ff88; color: black; border: none; padding: 12px 24px;
            font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1rem;
        }
        .btn-danger { background: #ff4444; color: white; }
        input { padding: 10px; border-radius: 4px; border: none; width: 250px; }
        #world-list { max-height: 300px; overflow-y: auto; width: 300px; margin: 20px 0; }
        .world-item { 
            display: flex; justify-content: space-between; padding: 10px; 
            background: #222; margin-bottom: 5px; border-radius: 4px;
        }
        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 10px;
        }
        .slot { width: 50px; height: 50px; border: 3px solid #444; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.7rem; text-align: center; }
        .active { border-color: #00ff88; background: rgba(0,255,136,0.2); }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%);
            mix-blend-mode: difference; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="menu">
    <h1>NEBULA VOXEL</h1>
    <div style="display:flex; gap:10px;">
        <input type="text" id="worldName" placeholder="World Name...">
        <button class="btn" onclick="createNewWorld()">CREATE</button>
    </div>
    <div id="world-list"></div>
    <p style="font-size: 0.8rem; opacity: 0.5;">Select a world to start</p>
</div>

<div id="ui">
    <b>NEBULA v2.0 (Optimized)</b><br>
    <span id="stats">Chunks: 0 | Blocks: 0</span><br>
    <small>ESC to Menu | L-Click: Mine | Shift+Click: Build</small>
</div>

<div id="hotbar">
    <div id="s1" class="slot active">DIRT</div>
    <div id="s2" class="slot">STONE</div>
    <div id="s3" class="slot">WOOD</div>
    <div id="s4" class="slot">LEAF</div>
    <div id="s5" class="slot">GLASS</div>
</div>

<div id="crosshair"></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- CONFIG & STATE ---
    const CHUNK_SIZE = 16;
    const RENDER_DIST = 3; 
    const MAX_BLOCKS_PER_CHUNK = CHUNK_SIZE * CHUNK_SIZE * 20; 
    
    let currentWorld = null;
    let worldData = {};
    let activeChunks = new Map();
    let currentBlock = 'dirt';
    const blockTypes = ['dirt', 'stone', 'wood', 'leaf', 'glass'];
    const blockColors = { dirt: 0x6b4c35, stone: 0x808080, wood: 0x4d2600, leaf: 0x228b22, glass: 0xadd8e6 };

    // --- THREE JS SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 80);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: false }); // Antialias off for performance
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    sunLight.position.set(50, 100, 50);
    scene.add(sunLight);

    const cubeGeo = new THREE.BoxGeometry(1, 1, 1);

    // --- WORLD MANAGEMENT ---
    window.createNewWorld = () => {
        const name = document.getElementById('worldName').value.trim();
        if(!name) return;
        const worlds = JSON.parse(localStorage.getItem('nebula_worlds_list') || "[]");
        if(!worlds.includes(name)) {
            worlds.push(name);
            localStorage.setItem('nebula_worlds_list', JSON.stringify(worlds));
            localStorage.setItem(`nebula_world_${name}`, JSON.stringify({}));
        }
        loadWorld(name);
    };

    window.deleteWorld = (name) => {
        const worlds = JSON.parse(localStorage.getItem('nebula_worlds_list') || "[]").filter(w => w !== name);
        localStorage.setItem('nebula_worlds_list', JSON.stringify(worlds));
        localStorage.removeItem(`nebula_world_${name}`);
        refreshWorldList();
    };

    function refreshWorldList() {
        const list = document.getElementById('world-list');
        const worlds = JSON.parse(localStorage.getItem('nebula_worlds_list') || "[]");
        list.innerHTML = worlds.map(w => `
            <div class="world-item">
                <span style="cursor:pointer" onclick="loadWorld('${w}')">🌍 ${w}</span>
                <span style="cursor:pointer; color:#ff4444" onclick="deleteWorld('${w}')">🗑️</span>
            </div>
        `).join('');
    }

    window.loadWorld = (name) => {
        currentWorld = name;
        worldData = JSON.parse(localStorage.getItem(`nebula_world_${name}`) || "{}");
        document.getElementById('menu').style.display = 'none';
        document.body.requestPointerLock();
        // Clear existing
        activeChunks.forEach(c => scene.remove(c.mesh));
        activeChunks.clear();
    };

    // --- ENGINE ---
    function getNoiseHeight(x, z) {
        // More complex "Minecraft" noise
        return Math.floor(
            Math.sin(x * 0.05) * 4 + 
            Math.cos(z * 0.05) * 4 + 
            Math.sin(x * 0.2) * 2 + 10
        );
    }

    function updateWorldStorage() {
        if(currentWorld) {
            localStorage.setItem(`nebula_world_${currentWorld}`, JSON.stringify(worldData));
        }
    }

    function createChunk(cx, cz) {
        const key = `${cx},${cz}`;
        if (activeChunks.has(key)) return;

        // Use InstancedMesh - this is the "No Lag" secret
        const mesh = new THREE.InstancedMesh(cubeGeo, new THREE.MeshLambertMaterial({ vertexColors: false }), MAX_BLOCKS_PER_CHUNK);
        const dummy = new THREE.Object3D();
        let count = 0;

        for (let x = 0; x < CHUNK_SIZE; x++) {
            for (let z = 0; z < CHUNK_SIZE; z++) {
                const wx = cx * CHUNK_SIZE + x;
                const wz = cz * CHUNK_SIZE + z;
                const h = getNoiseHeight(wx, wz);

                for (let y = 0; y <= h; y++) {
                    const blockKey = `${wx},${y},${wz}`;
                    if (worldData[blockKey] === "air") continue;

                    const type = worldData[blockKey] || (y === h ? 'dirt' : y < h - 3 ? 'stone' : 'dirt');
                    
                    dummy.position.set(wx, y, wz);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(count, dummy.matrix);
                    mesh.setColorAt(count, new THREE.Color(blockColors[type]));
                    count++;
                }
            }
        }
        
        mesh.count = count;
        mesh.instanceMatrix.needsUpdate = true;
        if(mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
        
        scene.add(mesh);
        activeChunks.set(key, { mesh, count });
    }

    // --- CONTROLS ---
    let move = { f: false, b: false, l: false, r: false, jump: false };
    let vel = new THREE.Vector3();
    
    document.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW') move.f = true;
        if (e.code === 'KeyS') move.b = true;
        if (e.code === 'KeyA') move.l = true;
        if (e.code === 'KeyD') move.r = true;
        if (e.code === 'Space' && canJump) { vel.y = 5; canJump = false; }
        if (e.code === 'Escape') document.getElementById('menu').style.display = 'flex';
        
        if (e.key >= 1 && e.key <= 5) {
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
            document.getElementById('s' + e.key).classList.add('active');
            currentBlock = blockTypes[e.key - 1];
        }
    });

    document.addEventListener('keyup', (e) => {
        if (e.code === 'KeyW') move.f = false;
        if (e.code === 'KeyS') move.b = false;
        if (e.code === 'KeyA') move.l = false;
        if (e.code === 'KeyD') move.r = false;
    });

    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        }
    });

    // Simple building/mining logic for InstancedMesh
    document.addEventListener('mousedown', (e) => {
        if (!document.pointerLockElement || !currentWorld) return;
        
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const chunkMeshes = Array.from(activeChunks.values()).map(c => c.mesh);
        const intersects = raycaster.intersectObjects(chunkMeshes);

        if (intersects.length > 0) {
            const hit = intersects[0];
            const matrix = new THREE.Matrix4();
            hit.object.getMatrixAt(hit.instanceId, matrix);
            const pos = new THREE.Vector3().setFromMatrixPosition(matrix);

            if (e.shiftKey) { // BUILD
                const b = pos.clone().add(hit.face.normal);
                worldData[`${Math.round(b.x)},${Math.round(b.y)},${Math.round(b.z)}`] = currentBlock;
            } else { // MINE
                worldData[`${Math.round(pos.x)},${Math.round(pos.y)},${Math.round(pos.z)}`] = "air";
            }
            
            updateWorldStorage();
            // Force refresh of the hit chunk
            const cx = Math.floor(pos.x / CHUNK_SIZE);
            const cz = Math.floor(pos.z / CHUNK_SIZE);
            const key = `${cx},${cz}`;
            scene.remove(activeChunks.get(key).mesh);
            activeChunks.delete(key);
        }
    });

    // --- LOOP ---
    let canJump = false;
    camera.position.set(8, 25, 8);
    camera.rotation.order = 'YXZ';

    function animate() {
        requestAnimationFrame(animate);
        if(!currentWorld) return;

        const delta = 0.016; // Fixed step for simplicity

        // Physics
        vel.y -= 15 * delta; // Gravity
        camera.position.y += vel.y * delta;

        const dir = new THREE.Vector3();
        if(move.f) dir.z -= 1;
        if(move.b) dir.z += 1;
        if(move.l) dir.x -= 1;
        if(move.r) dir.x += 1;
        dir.applyQuaternion(camera.quaternion);
        dir.y = 0;
        dir.normalize();
        
        camera.position.addScaledVector(dir, 10 * delta);

        // Simple Collision
        const ground = getNoiseHeight(camera.position.x, camera.position.z) + 2;
        if (camera.position.y < ground) {
            camera.position.y = ground;
            vel.y = 0;
            canJump = true;
        }

        // Chunk Loader
        const curCX = Math.floor(camera.position.x / CHUNK_SIZE);
        const curCZ = Math.floor(camera.position.z / CHUNK_SIZE);
        
        for(let x = -RENDER_DIST; x <= RENDER_DIST; x++) {
            for(let z = -RENDER_DIST; z <= RENDER_DIST; z++) {
                createChunk(curCX + x, curCZ + z);
            }
        }

        // Cleanup distant chunks to save RAM
        activeChunks.forEach((data, key) => {
            const [kx, kz] = key.split(',').map(Number);
            if(Math.abs(kx - curCX) > RENDER_DIST + 1 || Math.abs(kz - curCZ) > RENDER_DIST + 1) {
                scene.remove(data.mesh);
                activeChunks.delete(key);
            }
        });

        renderer.render(scene, camera);
        document.getElementById('stats').innerText = `Chunks: ${activeChunks.size} | Pos: ${Math.floor(camera.position.x)}, ${Math.floor(camera.position.z)}`;
    }

    refreshWorldList();
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
