<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEBULA | PHYSICS FIX</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #game-ui { position: absolute; inset: 0; pointer-events: none; }
        
        #top-bar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #00ff88; padding: 10px 30px;
            border-radius: 50px; border: 1px solid #00ff88; font-weight: bold;
            display: flex; gap: 20px;
        }

        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; pointer-events: auto; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 15px;
        }
        .slot {
            width: 45px; height: 45px; border: 2px solid #555; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 9px; color: white;
        }
        .slot.active { border-color: #00ff88; background: rgba(0,255,136,0.3); transform: scale(1.1); }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); mix-blend-mode: difference; }
    </style>
</head>
<body>

<div id="game-ui">
    <div id="top-bar">
        <span id="biome-name">FIXED PHYSICS</span>
        <span id="coord">X: 0 Y: 0 Z: 0</span>
    </div>

    <div id="hotbar">
        <div id="h0" class="slot active">GRASS</div>
        <div id="h1" class="slot">DIRT</div>
        <div id="h2" class="slot">STONE</div>
        <div id="h3" class="slot">WOOD</div>
        <div id="h4" class="slot">LEAVES</div>
        <div id="h5" class="slot">SAND</div>
        <div id="h6" class="slot">SNOW</div>
        <div id="h7" class="slot">ICE</div>
        <div id="h8" class="slot">MAGMA</div>
    </div>
    <div id="crosshair"></div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- GAME DATA & CONSTANTS ---
    const worldBlocks = JSON.parse(localStorage.getItem('nebula_infinite_world')) || {};
    const CHUNK_SIZE = 16;
    const RENDER_DIST = 2;
    const PLAYER_HEIGHT = 1.8;
    
    const blockTypes = {
        grass: 0x4d904f, dirt: 0x6b4c35, stone: 0x7a7a7a, 
        wood: 0x5d3a1a, leaf: 0x2d5a27, sand: 0xd2b48c,
        snow: 0xffffff, ice: 0xa5f2f3, magma: 0xff4500
    };

    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 80);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1.0);
    light.position.set(10, 20, 10);
    scene.add(new THREE.AmbientLight(0xffffff, 0.7), light);

    // --- PHYSICS HELPERS ---
    function getBlockAt(x, y, z) {
        const key = `${Math.round(x)},${Math.round(y)},${Math.round(z)}`;
        return worldBlocks[key] && worldBlocks[key] !== 'air' ? worldBlocks[key] : null;
    }

    // --- GENERATION (Simplified for example) ---
    function generateChunk(cx, cz) {
        for (let x = 0; x < CHUNK_SIZE; x++) {
            for (let z = 0; z < CHUNK_SIZE; z++) {
                const wx = cx * CHUNK_SIZE + x;
                const wz = cz * CHUNK_SIZE + z;
                const h = Math.floor(Math.sin(wx * 0.1) * 3 + 10);
                for (let y = 0; y <= h; y++) {
                    const bKey = `${wx},${y},${wz}`;
                    if (!worldBlocks[bKey]) worldBlocks[bKey] = (y === h) ? 'grass' : 'dirt';
                }
            }
        }
        renderWorld();
    }

    const instancedMeshes = new Map();
    const cubeGeo = new THREE.BoxGeometry(1, 1, 1);

    function renderWorld() {
        instancedMeshes.forEach(m => scene.remove(m));
        instancedMeshes.clear();
        const groups = {};
        for (const [key, type] of Object.entries(worldBlocks)) {
            if (type === 'air') continue;
            if (!groups[type]) groups[type] = [];
            groups[type].push(key.split(',').map(Number));
        }
        for (const [type, positions] of Object.entries(groups)) {
            const mat = new THREE.MeshLambertMaterial({ color: blockTypes[type] });
            const mesh = new THREE.InstancedMesh(cubeGeo, mat, positions.length);
            const dummy = new THREE.Object3D();
            positions.forEach((p, i) => {
                dummy.position.set(p[0], p[1], p[2]);
                dummy.updateMatrix();
                mesh.setMatrixAt(i, dummy.matrix);
            });
            scene.add(mesh);
            instancedMeshes.set(type, mesh);
        }
    }

    // --- PLAYER PHYSICS & MOVEMENT ---
    let velocity = new THREE.Vector3();
    let canJump = false;
    const keys = {};

    document.addEventListener('keydown', (e) => { keys[e.code] = true; });
    document.addEventListener('keyup', (e) => { keys[e.code] = false; });
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        }
    });

    camera.position.set(0, 20, 0);
    camera.rotation.order = 'YXZ';

    function updatePhysics(delta) {
        // Gravity
        velocity.y -= 25.0 * delta;

        // Input
        const speed = keys['ShiftLeft'] ? 12 : 6;
        const input = new THREE.Vector3();
        if (keys['KeyW']) input.z -= 1;
        if (keys['KeyS']) input.z += 1;
        if (keys['KeyA']) input.x -= 1;
        if (keys['KeyD']) input.x += 1;
        input.applyQuaternion(camera.quaternion);
        input.y = 0;
        input.normalize();

        velocity.x = input.x * speed;
        velocity.z = input.z * speed;

        // Apply Velocity with Collision
        const nextPos = camera.position.clone().add(velocity.clone().multiplyScalar(delta));

        // 1. Vertical Collision (Floor/Ceiling)
        const feetBlock = getBlockAt(nextPos.x, nextPos.y - PLAYER_HEIGHT, nextPos.z);
        if (feetBlock) {
            if (velocity.y < 0) {
                velocity.y = 0;
                canJump = true;
                nextPos.y = Math.round(nextPos.y - PLAYER_HEIGHT) + PLAYER_HEIGHT + 0.51;
            }
        } else {
            canJump = false;
        }

        // 2. Jumping
        if (keys['Space'] && canJump) {
            velocity.y = 10;
            canJump = false;
        }

        // 3. Horizontal Collision (Walls)
        const wallBlock = getBlockAt(nextPos.x, nextPos.y - 0.5, nextPos.z);
        if (!wallBlock) {
            camera.position.x = nextPos.x;
            camera.position.z = nextPos.z;
        }
        
        camera.position.y = nextPos.y;

        // Reset if you fall out of world
        if (camera.position.y < -50) camera.position.set(0, 25, 0);
    }

    // --- LOOP ---
    let lastTime = performance.now();
    function animate() {
        requestAnimationFrame(animate);
        const time = performance.now();
        const delta = (time - lastTime) / 1000;
        
        updatePhysics(delta);

        const cx = Math.floor(camera.position.x / CHUNK_SIZE);
        const cz = Math.floor(camera.position.z / CHUNK_SIZE);
        for(let x=-1; x<=1; x++) for(let z=-1; z<=1; z++) generateChunk(cx+x, cz+z);

        document.getElementById('coord').innerText = `X: ${Math.floor(camera.position.x)} Y: ${Math.floor(camera.position.y)} Z: ${Math.floor(camera.position.z)}`;
        
        renderer.render(scene, camera);
        lastTime = time;
    }

    document.addEventListener('mousedown', () => document.body.requestPointerLock());
    animate();
</script>
</body>
</html>
