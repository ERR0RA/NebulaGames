<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year 8 Advanced Revision Master</title>
    <style>
        :root {
            --primary: #2d3436; --secondary: #0984e3; --success: #00b894;
            --danger: #d63031; --light: #dfe6e9; --hint: #6c5ce7;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #b2bec3; color: var(--primary); margin: 0;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        #game-container {
            background: white; width: 95%; max-width: 800px; padding: 30px;
            border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center;
        }

        .hidden { display: none !important; }

        .menu-section {
            margin: 15px 0; padding: 20px; border: 2px solid #eee;
            border-radius: 10px; text-align: left; background: #fdfdfd;
        }

        .topic-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px; margin-top: 10px;
        }

        .btn {
            padding: 14px 22px; border: none; border-radius: 8px;
            cursor: pointer; font-weight: bold; transition: 0.3s; margin: 5px;
        }

        .btn-start { background: var(--secondary); color: white; width: 100%; font-size: 1.2rem; }
        .btn-submit { background: var(--success); color: white; }
        .btn-hint { background: var(--hint); color: white; }
        .btn-next { background: var(--primary); color: white; }

        #question-box {
            font-size: 1.3rem; margin: 25px 0; padding: 40px;
            background: #f1f2f6; border-radius: 15px; position: relative;
            border-left: 8px solid var(--secondary); line-height: 1.6;
            text-align: left;
        }

        .calc-badge {
            position: absolute; top: 15px; right: 15px; padding: 5px 12px;
            border-radius: 5px; font-size: 0.75rem; font-weight: 900;
        }

        .calc-yes { background: #ffeaa7; color: #d63031; border: 1px solid #fab1a0; }
        .calc-no { background: #dff9fb; color: #00cec9; border: 1px solid #81ecec; }

        #answer-input {
            padding: 15px; font-size: 1.3rem; width: 85%;
            border: 2px solid #ced4da; border-radius: 8px; margin-bottom: 20px;
        }

        .stats-bar {
            display: flex; justify-content: space-between; font-size: 0.95rem;
            color: #636e72; border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="setup-screen">
        <h1 style="margin:0;">Assessment Revision 2026</h1>
        <p>Wordy & Contextual Exam Practice</p>
        
        <div class="menu-section">
            <h3>Focus Topics</h3>
            <div class="topic-grid" id="topic-list"></div>
        </div>

        <div class="menu-section" style="text-align: center;">
            <h3>Difficulty</h3>
            <label><input type="radio" name="diff" value="easy"> Foundation</label> &nbsp;&nbsp;
            <label><input type="radio" name="diff" value="medium" checked> Intermediate</label> &nbsp;&nbsp;
            <label><input type="radio" name="diff" value="hard"> Target Grade 7-9</label>
        </div>

        <button class="btn btn-start" onclick="startGame()">START PRACTICE PAPER</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="stats-bar">
            <span id="stat-topic">---</span>
            <span id="stat-count">Q: 0/0</span>
            <span id="stat-score">Correct: 0</span>
        </div>
        
        <div id="question-box">
            <div id="calc-indicator" class="calc-badge"></div>
            <div id="question-text"></div>
        </div>

        <div id="hint-text" class="hidden" style="color: var(--hint); margin-bottom: 15px; font-style: italic;"></div>
        <input type="text" id="answer-input" placeholder="Type numerical answer or (x,y)" autocomplete="off">
        <div id="feedback" style="margin-bottom: 20px; font-weight: bold; font-size: 1.2rem;"></div>

        <button id="hint-btn" class="btn btn-hint" onclick="showHint()">Need a Hint?</button>
        <button id="submit-btn" class="btn btn-submit" onclick="checkAnswer()">Submit Answer</button>
        <button id="next-btn" class="btn btn-next hidden" onclick="nextQuestion()">Next Question</button>
    </div>

    <div id="end-screen" class="hidden">
        <h2>Assessment Complete</h2>
        <h1 id="final-score" style="font-size: 3rem;">0 / 0</h1>
        <p id="performance-msg"></p>
        <button class="btn btn-start" onclick="location.reload()">Restart Revision</button>
    </div>
</div>

<script>
    const questionBank = {
        "Similar Shapes (Length & Area)": {
            medium: [
                { q: "A small map has an area of 40cm². A larger version is printed with a length scale factor of 2. What is the area of the large map in cm²?", a: "160", h: "Area SF is Length SF squared. Multiply the old area by 2².", c: false },
                { q: "A photo is 10cm wide and 15cm high. It is enlarged so the new width is 30cm. What is the height of the enlarged photo?", a: "45", h: "Find the scale factor first (30 / 10).", c: false }
            ],
            hard: [
                { q: "Two similar garden plots have areas of 20m² and 180m². If the smaller plot has a perimeter of 16m, what is the perimeter of the larger plot?", a: "48", h: "Find Area SF (180/20), square root it to get Length SF, then multiply the perimeter.", c: true }
            ]
        },
        "Circles, Arcs & Sectors": {
            medium: [
                { q: "A windshield wiper of length 30cm sweeps through an angle of 120°. Calculate the area of glass cleaned. (Use π = 3.14)", a: "942", h: "(120/360) * 3.14 * 30²", c: true },
                { q: "A circular running track has a diameter of 100m. How far does an athlete run if they complete exactly 2.5 laps? (Use π = 3.14)", a: "785", h: "Distance = 2.5 * (π * d).", c: true }
            ],
            hard: [
                { q: "The minute hand of a clock is 12cm long. Calculate the distance the tip of the hand travels in 20 minutes. (Use π = 3.14)", a: "25.12", h: "20 mins is 1/3 of a circle. Find 1/3 of the circumference.", c: true }
            ]
        },
        "Functions & Quadratic Graphs": {
            medium: [
                { q: "A ball's height is h = -t² + 6t. Find the height of the ball after 2 seconds.", a: "8", h: "Replace t with 2: -(2²) + 6(2).", c: false },
                { q: "For the graph y = x² - 3, calculate the coordinate when x = -4.", a: "(-4,13)", h: "(-4)² - 3. Write as (x,y).", c: false }
            ],
            hard: [
                { q: "A curve has the equation y = (x - 3)² + 5. What is the coordinate of the lowest point (turning point) on this graph?", a: "(3,5)", h: "In the form (x-a)² + b, the turning point is (a, b).", c: false },
                { q: "Find the y-intercept of the graph y = (x + 2)(x - 5).", a: "-10", h: "The y-intercept occurs when x = 0. Multiply the constants.", c: false }
            ]
        },
        "Solving & Rearranging": {
            medium: [
                { q: "A rectangle has a length of (x+4) and a width of 5. If the total area is 45, solve for x.", a: "5", h: "5(x + 4) = 45. Divide by 5 then subtract 4.", c: false }
            ],
            hard: [
                { q: "The formula for the area of a trapezoid is A = 0.5(a + b)h. Rearrange this formula to make 'h' the subject.", a: "2A/(a+b)", h: "Multiply by 2, then divide by (a+b).", c: false }
            ]
        },
        "Experimental Probability": {
            medium: [
                { q: "A biased dice is rolled 200 times. It lands on '6' forty times. What is the relative frequency of rolling a 6?", a: "0.2", h: "40 divided by 200.", c: false }
            ],
            hard: [
                { q: "The probability that a seed grows is 0.82. If a farmer plants 500 seeds, how many are expected NOT to grow?", a: "90", h: "P(not grow) = 0.18. Multiply 0.18 by 500.", c: true }
            ]
        }
    };

    let currentPool = [];
    let score = 0;
    let currentQuestionIndex = 0;

    const topicListDiv = document.getElementById('topic-list');
    Object.keys(questionBank).forEach(topic => {
        const div = document.createElement('div');
        div.className = 'topic-item';
        div.innerHTML = `<label><input type="checkbox" name="topic" value="${topic}" checked> ${topic}</label>`;
        topicListDiv.appendChild(div);
    });

    function startGame() {
        const selectedTopics = Array.from(document.querySelectorAll('input[name="topic"]:checked')).map(cb => cb.value);
        const diff = document.querySelector('input[name="diff"]:checked').value;
        
        currentPool = [];
        selectedTopics.forEach(t => {
            if (questionBank[t][diff]) {
                questionBank[t][diff].forEach(q => currentPool.push({...q, topic: t}));
            }
        });
        currentPool.sort(() => Math.random() - 0.5);

        if (currentPool.length === 0) return alert("Select at least one topic for this difficulty.");

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const q = currentPool[currentQuestionIndex];
        document.getElementById('stat-topic').innerText = q.topic;
        document.getElementById('stat-count').innerText = `Q: ${currentQuestionIndex + 1}/${currentPool.length}`;
        document.getElementById('question-text').innerText = q.q;
        
        const badge = document.getElementById('calc-indicator');
        badge.innerText = q.c ? "CALCULATOR" : "NON-CALC";
        badge.className = q.c ? "calc-badge calc-yes" : "calc-badge calc-no";

        document.getElementById('hint-text').classList.add('hidden');
        document.getElementById('hint-btn').classList.remove('hidden');
        document.getElementById('answer-input').value = "";
        document.getElementById('answer-input').disabled = false;
        document.getElementById('feedback').innerText = "";
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('answer-input').focus();
    }

    function showHint() {
        const hText = document.getElementById('hint-text');
        hText.innerText = "STRATEGY: " + currentPool[currentQuestionIndex].h;
        hText.classList.remove('hidden');
        document.getElementById('hint-btn').classList.add('hidden');
    }

    function checkAnswer() {
        const user = document.getElementById('answer-input').value.replace(/\s+/g, '').toLowerCase();
        const correct = currentPool[currentQuestionIndex].a.replace(/\s+/g, '').toLowerCase();
        const feedback = document.getElementById('feedback');

        if (user === "") return;

        if (user === correct) {
            score++;
            feedback.innerText = "CORRECT";
            feedback.style.color = "var(--success)";
        } else {
            feedback.innerText = "INCORRECT. Expected: " + currentPool[currentQuestionIndex].a;
            feedback.style.color = "var(--danger)";
        }

        document.getElementById('stat-score').innerText = "Correct: " + score;
        document.getElementById('answer-input').disabled = true;
        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentPool.length) showQuestion();
        else endGame();
    }

    function endGame() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} / ${currentPool.length}`;
        const pct = (score / currentPool.length) * 100;
        document.getElementById('performance-msg').innerText = pct >= 80 ? "Top Set Performance! 🌟" : "Review your hints and try again. 📚";
    }

    document.getElementById('answer-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            if (!document.getElementById('submit-btn').classList.contains('hidden')) checkAnswer();
            else nextQuestion();
        }
    });
</script>
</body>
</html>
