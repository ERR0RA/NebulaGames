<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCSE Foundation/Higher Revision Master</title>
    <style>
        :root {
            --primary: #2c3e50; --secondary: #e67e22; --success: #27ae60;
            --danger: #c0392b; --light: #ecf0f1; --hint: #8e44ad;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #dcdde1; color: #2f3640; margin: 0;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        #game-container {
            background: white; width: 95%; max-width: 850px; padding: 25px;
            border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center;
        }

        .hidden { display: none !important; }

        .menu-section {
            margin: 15px 0; padding: 15px; border: 1px solid #dcdde1;
            border-radius: 8px; text-align: left; background: #f9f9f9;
        }

        .topic-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 8px; margin-top: 10px;
        }

        .topic-item { font-size: 0.85rem; display: flex; align-items: center; cursor: pointer; }
        .topic-item input { margin-right: 8px; }

        .btn {
            padding: 12px 20px; border: none; border-radius: 6px;
            cursor: pointer; font-weight: bold; transition: 0.2s; margin: 5px;
        }

        .btn-start { background: var(--primary); color: white; width: 100%; font-size: 1.1rem; }
        .btn-submit { background: var(--success); color: white; }
        .btn-hint { background: var(--hint); color: white; }
        .btn-next { background: var(--secondary); color: white; }

        #question-box {
            font-size: 1.4rem; margin: 20px 0; padding: 35px;
            background: #fff; border-radius: 10px; position: relative;
            border: 2px solid #eee; box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .calc-badge {
            position: absolute; top: 10px; right: 10px; padding: 4px 10px;
            border-radius: 4px; font-size: 0.7rem; font-weight: 800; letter-spacing: 1px;
        }

        .calc-yes { background: #f1c40f; color: #000; }
        .calc-no { background: #34495e; color: #fff; }

        #hint-text { color: var(--hint); font-style: italic; margin-bottom: 15px; font-weight: 600; }

        #answer-input {
            padding: 14px; font-size: 1.3rem; width: 80%;
            border: 2px solid #bdc3c7; border-radius: 6px; margin-bottom: 15px;
        }

        .stats-bar {
            display: flex; justify-content: space-between; font-size: 0.9rem;
            color: #7f8c8d; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="setup-screen">
        <h1 style="margin-top:0;">2025-2026 Revision Hub</h1>
        <p>Curriculum aligned for Year 9 & 10 Assessments</p>
        
        <div class="menu-section">
            <h3>Select Assessment Topics</h3>
            <div class="topic-grid" id="topic-list"></div>
        </div>

        <div class="menu-section" style="text-align: center;">
            <h3>Difficulty Level</h3>
            <label><input type="radio" name="diff" value="easy"> Foundation</label> &nbsp;&nbsp;
            <label><input type="radio" name="diff" value="medium" checked> Intermediate</label> &nbsp;&nbsp;
            <label><input type="radio" name="diff" value="hard"> Higher/Target 9</label>
        </div>

        <button class="btn btn-start" onclick="startGame()">GENERATE EXAM PAPER</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="stats-bar">
            <span id="stat-topic">---</span>
            <span id="stat-score">Score: 0</span>
            <span id="stat-count">Q: 0/0</span>
        </div>
        
        <div id="question-box">
            <div id="calc-indicator" class="calc-badge"></div>
            <div id="question-text"></div>
        </div>

        <div id="hint-text" class="hidden"></div>
        <input type="text" id="answer-input" placeholder="Value or Coordinate (x,y)" autocomplete="off">
        <div id="feedback" style="margin-bottom: 15px; font-weight: bold;"></div>

        <button id="hint-btn" class="btn btn-hint" onclick="showHint()">Hint</button>
        <button id="submit-btn" class="btn btn-submit" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" class="btn btn-next hidden" onclick="nextQuestion()">Next Question</button>
    </div>

    <div id="end-screen" class="hidden">
        <h2>Assessment Finished</h2>
        <h1 id="final-score">0 / 0</h1>
        <p id="performance-msg"></p>
        <button class="btn btn-start" onclick="location.reload()">New Test Session</button>
    </div>
</div>

<script>
    const questionBank = {
        "Similar Shapes": {
            easy: [{ q: "Square A has side 2cm. Square B has side 4cm. What is the length scale factor?", a: "2", h: "4 divided by 2.", c: false }],
            medium: [{ q: "Triangles A and B are similar. Length SF is 3. If Area A is 5cm², what is Area B?", a: "45", h: "Area scale factor is SF squared (3^2 = 9).", c: false }],
            hard: [{ q: "Shape X and Y are similar. Volume X = 10cm³, Volume Y = 270cm³. What is the Length SF?", a: "3", h: "Volume SF is 27. Length SF is the cube root of 27.", c: true }]
        },
        "Circles, Arcs & Sectors": {
            easy: [{ q: "Find the circumference of a circle with radius 5cm. (Use π=3.14)", a: "31.4", h: "C = 2 * π * r", c: true }],
            medium: [{ q: "Find the area of a semicircle with radius 4cm. (Use π=3.14)", a: "25.12", h: "(π * r²) / 2", c: true }],
            hard: [{ q: "Calculate the arc length of a 60° sector with radius 12cm. (Use π=3.14)", a: "12.56", h: "(60/360) * 2 * π * r", c: true }]
        },
        "Sequences (Linear & Non-Linear)": {
            easy: [{ q: "Find the next term: 4, 7, 10, 13...", a: "16", h: "The difference is +3.", c: false }],
            medium: [{ q: "Find the nth term of: 5, 8, 11, 14...", a: "3n+2", h: "Difference is 3, so 3n. What do you add to 3 to get 5?", c: false }],
            hard: [{ q: "Find the 5th term of the quadratic sequence: n^2 + 2n + 1", a: "36", h: "Substitute n = 5 into the formula.", c: false }]
        },
        "Functions & Quadratic Graphs": {
            easy: [{ q: "For y = x^2 + 5, find y when x = 3.", a: "14", h: "3 squared is 9, then add 5.", c: false }],
            medium: [{ q: "Find the coordinate (x,y) for y = x^2 - 4 when x = -2.", a: "(-2,0)", h: "(-2)^2 is 4. 4 - 4 = 0.", c: false }],
            hard: [{ q: "Find the turning point of y = (x - 4)^2 + 10", a: "(4,10)", h: "Form (x-a)^2 + b has turning point (a, b).", c: false }]
        },
        "Solving & Rearranging": {
            easy: [{ q: "Solve: 4x - 2 = 18", a: "5", h: "Add 2, then divide by 4.", c: false }],
            medium: [{ q: "Solve: 3(x + 4) = 2x + 20", a: "8", h: "Expand the bracket first: 3x + 12 = 2x + 20.", c: false }],
            hard: [{ q: "Rearrange v = u + at to make 't' the subject.", a: "(v-u)/a", h: "Subtract u, then divide by a.", c: false }]
        },
        "Constructions & Loci": {
            easy: [{ q: "A locus of points exactly 5cm from point A is a what?", a: "circle", h: "Think about every point exactly the same distance from a center.", c: false }],
            hard: [{ q: "The locus of points equidistant from two lines is an angle...?", a: "bisector", h: "It cuts the angle in half.", c: false }]
        },
        "Experimental Probability": {
            medium: [{ q: "A coin is flipped 50 times and lands on Heads 30 times. Relative frequency of Heads?", a: "0.6", h: "30 / 50", c: false }],
            hard: [{ q: "P(Win) = 0.3. If played 150 times, how many wins are expected?", a: "45", h: "150 * 0.3", c: true }]
        }
    };

    let currentPool = [];
    let score = 0;
    let currentQuestionIndex = 0;

    const topicListDiv = document.getElementById('topic-list');
    Object.keys(questionBank).forEach(topic => {
        const div = document.createElement('div');
        div.className = 'topic-item';
        div.innerHTML = `<label><input type="checkbox" name="topic" value="${topic}" checked> ${topic}</label>`;
        topicListDiv.appendChild(div);
    });

    function startGame() {
        const selectedTopics = Array.from(document.querySelectorAll('input[name="topic"]:checked')).map(cb => cb.value);
        const diff = document.querySelector('input[name="diff"]:checked').value;
        
        currentPool = [];
        selectedTopics.forEach(t => {
            if (questionBank[t][diff]) {
                questionBank[t][diff].forEach(q => currentPool.push({...q, topic: t}));
            }
        });
        currentPool.sort(() => Math.random() - 0.5);

        if (currentPool.length === 0) return alert("Select at least one topic for your assessment.");

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const q = currentPool[currentQuestionIndex];
        document.getElementById('stat-topic').innerText = q.topic;
        document.getElementById('stat-count').innerText = `Q: ${currentQuestionIndex + 1}/${currentPool.length}`;
        document.getElementById('question-text').innerText = q.q;
        
        const badge = document.getElementById('calc-indicator');
        badge.innerText = q.c ? "CALCULATOR" : "NON-CALC";
        badge.className = q.c ? "calc-badge calc-yes" : "calc-badge calc-no";

        document.getElementById('hint-text').classList.add('hidden');
        document.getElementById('hint-btn').classList.remove('hidden');
        document.getElementById('answer-input').value = "";
        document.getElementById('answer-input').disabled = false;
        document.getElementById('feedback').innerText = "";
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('answer-input').focus();
    }

    function showHint() {
        const hText = document.getElementById('hint-text');
        hText.innerText = "HINT: " + currentPool[currentQuestionIndex].h;
        hText.classList.remove('hidden');
        document.getElementById('hint-btn').classList.add('hidden');
    }

    function checkAnswer() {
        const user = document.getElementById('answer-input').value.replace(/\s+/g, '').toLowerCase();
        const correct = currentPool[currentQuestionIndex].a.replace(/\s+/g, '').toLowerCase();
        const feedback = document.getElementById('feedback');

        if (user === "") return;

        if (user === correct) {
            score++;
            feedback.innerText = "CORRECT";
            feedback.style.color = "var(--success)";
        } else {
            feedback.innerText = "INCORRECT. Answer: " + currentPool[currentQuestionIndex].a;
            feedback.style.color = "var(--danger)";
        }

        document.getElementById('stat-score').innerText = "Score: " + score;
        document.getElementById('answer-input').disabled = true;
        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentPool.length) showQuestion();
        else endGame();
    }

    function endGame() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} / ${currentPool.length}`;
        const pct = (score / currentPool.length) * 100;
        document.getElementById('performance-msg').innerText = pct >= 80 ? "Grade 9 Performance! 🔥" : "Keep working on those topics. 📖";
    }

    document.getElementById('answer-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            if (!document.getElementById('submit-btn').classList.contains('hidden')) checkAnswer();
            else nextQuestion();
        }
    });
</script>
</body>
</html>
