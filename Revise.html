<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year 8-9 Maths Mastery Revision Pro</title>
    <style>
        :root {
            --primary: #4a90e2; --secondary: #f39c12; --success: #2ecc71;
            --danger: #e74c3c; --dark: #2c3e50; --light: #ecf0f1; --hint: #9b59b6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8; color: var(--dark); margin: 0;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        #game-container {
            background: white; width: 95%; max-width: 900px; padding: 30px;
            border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center;
        }

        .hidden { display: none !important; }

        .menu-section {
            margin: 20px 0; padding: 15px; border: 1px solid #ddd;
            border-radius: 8px; text-align: left;
        }

        .topic-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px; margin-top: 10px;
        }

        .topic-item { font-size: 0.85rem; display: flex; align-items: center; }
        .topic-item input { margin-right: 8px; }

        .btn {
            padding: 12px 25px; border: none; border-radius: 5px;
            cursor: pointer; font-weight: bold; transition: transform 0.2s; margin: 5px;
        }

        .btn-start { background: var(--primary); color: white; width: 100%; margin-top: 20px; }
        .btn-submit { background: var(--success); color: white; }
        .btn-hint { background: var(--hint); color: white; }
        .btn-next { background: var(--secondary); color: white; }

        #question-box {
            font-size: 1.5rem; margin: 20px 0; padding: 40px;
            background: #f9f9f9; border-radius: 10px; position: relative;
            border-left: 6px solid var(--primary); min-height: 80px;
            display: flex; align-items: center; justify-content: center;
        }

        .calc-badge {
            position: absolute; top: 10px; right: 10px; padding: 5px 10px;
            border-radius: 4px; font-size: 0.75rem; font-weight: bold;
        }

        .calc-yes { background: #ffeaa7; color: #d63031; border: 1px solid #fab1a0; }
        .calc-no { background: #dff9fb; color: #0984e3; border: 1px solid #81ecec; }

        #hint-text { color: var(--hint); font-style: italic; margin-bottom: 15px; font-weight: 500; font-size: 1.1rem; }

        #answer-input {
            padding: 12px; font-size: 1.3rem; width: 60%;
            border: 2px solid #ddd; border-radius: 5px; margin-bottom: 15px; outline: none;
        }

        #answer-input:focus { border-color: var(--primary); }

        .stats-bar {
            display: flex; justify-content: space-between; font-size: 0.9rem;
            color: #7f8c8d; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="setup-screen">
        <h1>Maths Revision Pro</h1>
        <p>Full Year 8-9 Curriculum Mastery (2026 Edition)</p>
        
        <div class="menu-section">
            <h3>1. Select Topics</h3>
            <div class="topic-grid" id="topic-list"></div>
            <div style="margin-top:15px;">
                <button class="btn" style="background:#eee; font-size:0.8rem;" onclick="selectAll(true)">Select All</button>
                <button class="btn" style="background:#eee; font-size:0.8rem;" onclick="selectAll(false)">Clear All</button>
            </div>
        </div>

        <div class="menu-section">
            <h3>2. Difficulty</h3>
            <div style="display:flex; justify-content:center; gap:25px;">
                <label><input type="radio" name="diff" value="easy" checked> Easy</label>
                <label><input type="radio" name="diff" value="medium"> Medium</label>
                <label><input type="radio" name="diff" value="hard"> Hard</label>
            </div>
        </div>

        <button class="btn btn-start" onclick="startGame()">START REVISION</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="stats-bar">
            <span id="stat-topic">Topic: ---</span>
            <span id="stat-score">Score: 0</span>
            <span id="stat-count">Q: 0/0</span>
        </div>
        
        <div id="question-box">
            <div id="calc-indicator" class="calc-badge"></div>
            <div id="question-text"></div>
        </div>

        <div id="hint-text" class="hidden"></div>
        <input type="text" id="answer-input" placeholder="Your answer..." autocomplete="off">
        <div id="feedback" style="margin-bottom: 15px; font-weight: bold; font-size: 1.2rem;"></div>

        <div id="controls">
            <button id="hint-btn" class="btn btn-hint" onclick="showHint()">Get Hint</button>
            <button id="submit-btn" class="btn btn-submit" onclick="checkAnswer()">Submit</button>
            <button id="next-btn" class="btn btn-next hidden" onclick="nextQuestion()">Next Question</button>
        </div>
    </div>

    <div id="end-screen" class="hidden">
        <h2>Revision Complete!</h2>
        <h1 id="final-score" style="font-size: 3rem; color: var(--primary);">0 / 0</h1>
        <p id="performance-msg" style="font-size: 1.2rem;"></p>
        <button class="btn btn-start" onclick="location.reload()">New Session</button>
    </div>
</div>

<script>
    const questionBank = {
        "Simple & Compound Interest": {
            easy: [
                { q: "Calculate 10% interest on £500 for 1 year.", a: "50", h: "Divide by 10.", c: false },
                { q: "Simple Interest: £200 at 5% for 2 years.", a: "20", h: "Find 5% of 200 (£10) then double it.", c: false }
            ],
            medium: [
                { q: "Compound Interest: £1000 at 10% for 2 years. Total value?", a: "1210", h: "Year 1 = 1100. Then find 10% of 1100 for Year 2.", c: true },
                { q: "Simple Interest: Total value of £800 at 3% for 4 years.", a: "896", h: "Interest = (800 * 3 * 4) / 100. Add to 800.", c: true }
            ],
            hard: [
                { q: "Compound Interest: £5000 at 4% for 3 years. (Total to 2dp)", a: "5624.32", h: "5000 * (1.04)^3", c: true }
            ]
        },
        "Algebra: Solving & Factorising": {
            easy: [
                { q: "Solve: 2x + 5 = 15", a: "5", h: "Subtract 5, then divide by 2.", c: false },
                { q: "Factorise: 3x + 12", a: "3(x+4)", h: "HCF of 3 and 12 is 3.", c: false }
            ],
            medium: [
                { q: "Solve: 5(x - 3) = 20", a: "7", h: "Divide by 5 first, then add 3.", c: false },
                { q: "Factorise: x^2 + 8x", a: "x(x+8)", h: "Pull the common 'x' outside the bracket.", c: false }
            ],
            hard: [
                { q: "Solve: 8x - 4 = 3x + 11", a: "3", h: "Subtract 3x from both sides, then add 4.", c: false },
                { q: "Factorise: x^2 + 7x + 12", a: "(x+3)(x+4)", h: "Find numbers that multiply to 12 and add to 7.", c: false }
            ]
        },
        "Quadratic Graphs": {
            easy: [
                { q: "What is the name of a y = x^2 curve?", a: "parabola", h: "Starts with P.", c: false },
                { q: "For y = x^2, find y when x = 5.", a: "25", h: "5 * 5", c: false }
            ],
            medium: [
                { q: "For y = x^2 + 3, find the coordinate for x = 2.", a: "(2,7)", h: "Square 2, add 3. Write as (x,y).", c: false },
                { q: "Where does y = x^2 - 10 cross the y-axis?", a: "-10", h: "The y-intercept is the number at the end.", c: false }
            ],
            hard: [
                { q: "Calculate y for y = x^2 - 4x when x = -2.", a: "12", h: "(-2)^2 is 4. -4 * -2 is 8. 4 + 8 = ?", c: false },
                { q: "Turning point of y = (x+5)^2 - 2?", a: "(-5,-2)", h: "Opposite of the number inside, keep the number outside.", c: false }
            ]
        },
        "Rounding & Bounds": {
            easy: [
                { q: "Round 12.84 to 1 decimal place.", a: "12.8", h: "Look at the 4, it's less than 5.", c: false }
            ],
            medium: [
                { q: "Lower bound of 50g to nearest 10g.", a: "45", h: "Subtract 5.", c: false }
            ],
            hard: [
                { q: "Distance is 100m (to nearest 10m). Lower bound?", a: "95", h: "Half of 10 is 5. Subtract 5.", c: false }
            ]
        },
        "Powers & Standard Form": {
            easy: [{ q: "Simplify: x^2 * x^3", a: "x^5", h: "Add the powers.", c: false }],
            medium: [{ q: "Write 0.0004 in standard form.", a: "4x10^-4", h: "Count jumps to the right.", c: false }],
            hard: [{ q: "Simplify: (2x^3)^3", a: "8x^9", h: "Cube the 2 AND multiply the power.", c: false }]
        },
        "Ratio & Proportion": {
            easy: [{ q: "Simplify ratio 12:18", a: "2:3", h: "Divide both by 6.", c: false }],
            medium: [{ q: "Divide £60 in ratio 1:2.", a: "20,40", h: "Total parts = 3. 60 / 3 = 20.", c: false }],
            hard: [{ q: "If 3 pens cost £4.50, how much for 5?", a: "7.50", h: "Find cost of 1 pen first.", c: true }]
        },
        "Pythagoras": {
            easy: [{ q: "Square of 13?", a: "169", h: "13 * 13", c: false }],
            medium: [{ q: "Hypotenuse of 6cm and 8cm triangle?", a: "10", h: "6^2 + 8^2 = 100. Square root of 100?", c: false }],
            hard: [{ q: "Side of triangle with Hyp=5, Side=3?", a: "4", h: "5^2 - 3^2 = 16. Square root of 16?", c: false }]
        },
        "Probability": {
            easy: [{ q: "P(Heads) on a coin?", a: "0.5", h: "1 out of 2.", c: false }],
            medium: [{ q: "P(Not Win) if P(Win) is 0.27?", a: "0.73", h: "1 - 0.27", c: false }],
            hard: [{ q: "A dice is rolled 200 times. How many '6's expected?", a: "33", h: "200 divided by 6.", c: true }]
        }
    };

    let currentPool = [];
    let score = 0;
    let currentQuestionIndex = 0;

    const topicListDiv = document.getElementById('topic-list');
    Object.keys(questionBank).forEach(topic => {
        const div = document.createElement('div');
        div.className = 'topic-item';
        div.innerHTML = `<label><input type="checkbox" name="topic" value="${topic}" checked> ${topic}</label>`;
        topicListDiv.appendChild(div);
    });

    function selectAll(val) { document.querySelectorAll('input[name="topic"]').forEach(cb => cb.checked = val); }

    function startGame() {
        const selectedTopics = Array.from(document.querySelectorAll('input[name="topic"]:checked')).map(cb => cb.value);
        const diff = document.querySelector('input[name="diff"]:checked').value;
        
        currentPool = [];
        selectedTopics.forEach(t => {
            if (questionBank[t][diff]) {
                questionBank[t][diff].forEach(q => currentPool.push({...q, topic: t}));
            }
        });
        currentPool.sort(() => Math.random() - 0.5);

        if (currentPool.length === 0) return alert("Select a topic!");

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const q = currentPool[currentQuestionIndex];
        document.getElementById('stat-topic').innerText = `Topic: ${q.topic}`;
        document.getElementById('stat-count').innerText = `Q: ${currentQuestionIndex + 1}/${currentPool.length}`;
        document.getElementById('question-text').innerText = q.q;
        
        const badge = document.getElementById('calc-indicator');
        badge.innerText = q.c ? "CALCULATOR REQUIRED" : "NON-CALC";
        badge.className = q.c ? "calc-badge calc-yes" : "calc-badge calc-no";

        document.getElementById('hint-text').classList.add('hidden');
        document.getElementById('hint-btn').classList.remove('hidden');
        document.getElementById('answer-input').value = "";
        document.getElementById('answer-input').disabled = false;
        document.getElementById('feedback').innerText = "";
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('answer-input').focus();
    }

    function showHint() {
        const hText = document.getElementById('hint-text');
        hText.innerText = "Hint: " + currentPool[currentQuestionIndex].h;
        hText.classList.remove('hidden');
        document.getElementById('hint-btn').classList.add('hidden');
    }

    function checkAnswer() {
        const user = document.getElementById('answer-input').value.replace(/\s+/g, '').toLowerCase();
        const correct = currentPool[currentQuestionIndex].a.replace(/\s+/g, '').toLowerCase();
        const feedback = document.getElementById('feedback');

        if (user === "") return;

        if (user === correct) {
            score++;
            feedback.innerText = "✓ Correct!";
            feedback.style.color = "var(--success)";
        } else {
            feedback.innerText = "✗ Incorrect. Answer: " + currentPool[currentQuestionIndex].a;
            feedback.style.color = "var(--danger)";
        }

        document.getElementById('stat-score').innerText = "Score: " + score;
        document.getElementById('answer-input').disabled = true;
        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentPool.length) showQuestion();
        else endGame();
    }

    function endGame() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} / ${currentPool.length}`;
        const pct = (score / currentPool.length) * 100;
        let msg = pct >= 80 ? "Wizard Status! 🧙‍♂️" : pct >= 50 ? "Solid effort! 👍" : "Needs more revision. 📚";
        document.getElementById('performance-msg').innerText = msg;
    }

    document.getElementById('answer-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            if (!document.getElementById('submit-btn').classList.contains('hidden')) checkAnswer();
            else nextQuestion();
        }
    });
</script>
</body>
</html>
