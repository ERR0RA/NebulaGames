<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOCKY CROSSING</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        canvas { background: #4daa3d; border: 4px solid #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #ui { position: absolute; top: 20px; text-align: center; width: 100%; pointer-events: none; }
        #score { font-size: 48px; font-weight: bold; text-shadow: 2px 2px #000; }
        #msg { position: absolute; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; display: none; text-align: center; z-index: 10; }
    </style>
</head>
<body>

<div id="ui">
    <div id="score">0</div>
    <div>HIGH SCORE: <span id="best">0</span></div>
</div>

<div id="msg" id="deathScreen">
    <h1>WASTED</h1>
    <p>Press SPACE to try again</p>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const msg = document.getElementById('msg');

    const GRID = 40;
    canvas.width = 400;
    canvas.height = 600;

    let score = 0;
    let highVal = 0;
    let alive = true;
    let cameraY = 0;

    const player = {
        x: 5, // Grid units
        y: 12,
        targetY: 12,
        color: '#ffdbac'
    };

    let rows = [];

    function init() {
        score = 0;
        alive = true;
        cameraY = 0;
        player.x = 5;
        player.y = 12;
        player.targetY = 12;
        rows = [];
        msg.style.display = 'none';
        
        // Generate initial safe rows
        for(let i=0; i<20; i++) {
            addRow(i, i > 12);
        }
    }

    function addRow(y, safe) {
        const type = safe ? 'grass' : (Math.random() > 0.7 ? 'grass' : (Math.random() > 0.8 ? 'rail' : 'road'));
        const row = {
            y: y,
            type: type,
            entities: [],
            speed: (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1),
            warning: 0
        };

        if(type === 'road' || type === 'rail') {
            const count = type === 'rail' ? 1 : 2 + Math.random() * 2;
            for(let i=0; i<count; i++) {
                row.entities.push({
                    x: Math.random() * canvas.width,
                    w: type === 'rail' ? 80 : (40 + Math.random() * 40)
                });
            }
        }
        rows.push(row);
    }

    window.addEventListener('keydown', e => {
        if(!alive) {
            if(e.code === 'Space') init();
            return;
        }

        if(e.code === 'ArrowUp' || e.code === 'KeyW') {
            player.y--;
            score = Math.max(score, 12 - player.y);
        }
        if(e.code === 'ArrowDown' || e.code === 'KeyS') player.y++;
        if(e.code === 'ArrowLeft' || e.code === 'KeyA') player.x--;
        if(e.code === 'ArrowRight' || e.code === 'KeyD') player.x++;

        // Bounds
        if(player.x < 0) player.x = 0;
        if(player.x > 9) player.x = 9;
    });

    function update() {
        if(!alive) return;

        // Smooth camera follow
        const targetCam = (player.y - 10) * GRID;
        cameraY += (targetCam - cameraY) * 0.1;

        // Manage rows (infinite generation)
        if(rows[0].y * GRID < cameraY - GRID) {
            const lastY = rows[rows.length-1].y;
            rows.shift();
            addRow(lastY + 1, false);
        }

        rows.forEach(row => {
            if(row.type === 'road' || row.type === 'rail') {
                const speedMult = row.type === 'rail' ? 5 : 1;
                
                // Rail warning logic
                if(row.type === 'rail') {
                    row.warning++;
                    if(row.warning > 200) {
                        row.entities.forEach(en => {
                            en.x += row.speed * speedMult;
                            if(en.x > canvas.width) en.x = -en.w;
                            if(en.x < -en.w) en.x = canvas.width;
                        });
                        if(row.warning > 250) row.warning = 0;
                    }
                } else {
                    row.entities.forEach(en => {
                        en.x += row.speed;
                        if(en.x > canvas.width) en.x = -en.w;
                        if(en.x < -en.w) en.x = canvas.width;
                    });
                }

                // Collision Detection
                row.entities.forEach(en => {
                    const px = player.x * GRID;
                    const py = player.y * GRID;
                    const ry = row.y * GRID;
                    
                    if(py === ry) {
                        if(px < en.x + en.w && px + 30 > en.x) {
                            die();
                        }
                    }
                });
            }
        });

        scoreEl.innerText = score;
    }

    function die() {
        alive = false;
        msg.style.display = 'block';
        if(score > highVal) highVal = score;
        bestEl.innerText = highVal;
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.save();
        ctx.translate(0, -cameraY);

        rows.forEach(row => {
            const yPos = row.y * GRID;
            
            // Draw Ground
            if(row.type === 'grass') ctx.fillStyle = '#4daa3d';
            if(row.type === 'road') ctx.fillStyle = '#444';
            if(row.type === 'rail') {
                ctx.fillStyle = row.warning > 150 ? '#600' : '#333';
            }
            ctx.fillRect(0, yPos, canvas.width, GRID);

            // Draw Entities
            row.entities.forEach(en => {
                ctx.fillStyle = row.type === 'rail' ? '#eee' : '#ff4444';
                if(row.type === 'road') ctx.fillStyle = `hsl(${row.y * 50}, 70%, 50%)`;
                ctx.fillRect(en.x, yPos + 5, en.w, GRID - 10);
            });
        });

        // Draw Player
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x * GRID + 5, player.y * GRID + 5, GRID - 10, GRID - 10);
        ctx.fillStyle = '#333';
        ctx.fillRect(player.x * GRID + 10, player.y * GRID + 10, 5, 5); // Eye
        ctx.fillRect(player.x * GRID + 25, player.y * GRID + 10, 5, 5); // Eye

        ctx.restore();
        
        update();
        requestAnimationFrame(draw);
    }

    init();
    draw();
</script>
</body>
</html>
