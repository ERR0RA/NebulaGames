<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON_HEX // ULTIMATE_GLOW</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #ff00ff;
            --neon-alt: #00ffff;
            --bg: #020205;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: #fff;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        #ui {
            position: absolute; top: 30px; left: 30px; z-index: 10;
            pointer-events: none;
        }

        .stat { margin-bottom: 10px; }
        .label { font-size: 0.6rem; color: var(--neon-alt); letter-spacing: 2px; }
        .value { font-size: 2.2rem; font-weight: 900; text-shadow: 0 0 20px var(--neon-alt); }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }

        h1 { font-size: 5rem; margin: 0; text-shadow: 0 0 30px var(--neon); color: var(--neon); letter-spacing: 10px; }
        .msg { color: var(--neon-alt); margin: 20px 0; letter-spacing: 5px; font-size: 0.9rem; text-shadow: 0 0 10px var(--neon-alt); }
        
        .start-btn {
            padding: 18px 60px; background: transparent; border: 3px solid var(--neon);
            color: var(--neon); font-family: 'Orbitron'; font-weight: 900;
            cursor: pointer; transition: 0.3s; letter-spacing: 5px;
            box-shadow: inset 0 0 15px var(--neon);
        }
        .start-btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 50px var(--neon); }

        canvas { display: block; filter: contrast(1.2) brightness(1.1); }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat">
            <div class="label">SYNC_INDEX</div>
            <div id="score" class="value">0</div>
        </div>
        <div class="stat">
            <div class="label">STABILITY</div>
            <div id="health" class="value" style="color: var(--neon); text-shadow: 0 0 20px var(--neon);">100%</div>
        </div>
    </div>

    <div id="overlay">
        <h1 id="header">NEON_HEX</h1>
        <div class="msg">ORBIT THE CORE // FIND THE GAP</div>
        <button class="start-btn" onclick="startGame()">INIT_CORE</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const healthEl = document.getElementById('health');
    const overlay = document.getElementById('overlay');
    const header = document.getElementById('header');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let gameActive = false;
    let score = 0;
    let health = 100;
    let playerAngle = 0;
    let rotationSpeed = 0.09;
    let walls = [];
    let frame = 0;
    let wallSpeed = 4.5;
    let spawnRate = 70;

    class Wall {
        constructor() {
            this.dist = Math.max(canvas.width, canvas.height);
            this.width = Math.random() * 1.2 + 0.8; 
            this.angle = Math.random() * Math.PI * 2;
            this.color = Math.random() > 0.5 ? '#ff00ff' : '#00ffff';
        }

        draw() {
            ctx.strokeStyle = this.color;
            ctx.shadowBlur = 25;
            ctx.shadowColor = this.color;
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, this.dist, this.angle, this.angle + (Math.PI * 2) - this.width);
            ctx.stroke();
        }

        update() {
            this.dist -= wallSpeed;
        }
    }

    function startGame() {
        score = 0;
        health = 100;
        walls = [];
        frame = 0;
        gameActive = true;
        overlay.style.display = 'none';
        animate();
    }

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function drawGrid() {
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        const spacing = 100;
        const offset = (frame * 2) % spacing;
        
        for(let x = offset; x < canvas.width; x += spacing) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for(let y = offset; y < canvas.height; y += spacing) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
    }

    function animate() {
        // Stop the loop if health is 0, but handle the UI first
        if (health <= 0) {
            gameActive = false;
            header.innerText = "CORE_CRASHED";
            header.style.color = "#ff3333";
            overlay.style.display = 'flex';
            return; 
        }

        frame++;

        // Faint trail effect
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(2, 2, 5, 0.25)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawGrid();

        // High-glow blend mode for elements
        ctx.globalCompositeOperation = 'screen';

        // Player Controls
        if (keys['ArrowLeft'] || keys['KeyA']) playerAngle -= rotationSpeed;
        if (keys['ArrowRight'] || keys['KeyD']) playerAngle += rotationSpeed;

        // Draw Player
        const px = canvas.width/2 + Math.cos(playerAngle) * 70;
        const py = canvas.height/2 + Math.sin(playerAngle) * 70;
        
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#fff';
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(px, py, 10, 0, Math.PI * 2);
        ctx.fill();

        // Spawn Walls
        if (frame % Math.floor(spawnRate) === 0) {
            walls.push(new Wall());
        }

        // Difficulty scaling
        wallSpeed = 4.5 + (score / 1500);
        spawnRate = Math.max(25, 70 - (score / 300));

        // Update/Draw Walls
        walls.forEach((wall, i) => {
            wall.update();
            wall.draw();

            // Collision Detection
            if (wall.dist < 85 && wall.dist > 55) {
                let normPlayer = ((playerAngle % (Math.PI * 2)) + (Math.PI * 2)) % (Math.PI * 2);
                let start = ((wall.angle % (Math.PI * 2)) + (Math.PI * 2)) % (Math.PI * 2);
                let end = (((wall.angle + (Math.PI * 2) - wall.width) % (Math.PI * 2)) + (Math.PI * 2)) % (Math.PI * 2);

                let inGap = false;
                if (start < end) {
                    if (normPlayer > start && normPlayer < end) inGap = true;
                } else {
                    if (normPlayer > start || normPlayer < end) inGap = true;
                }

                if (!inGap) {
                    health -= 25;
                    walls.splice(i, 1);
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.fillRect(0,0,canvas.width, canvas.height); 
                }
            }

            if (wall.dist < 0) {
                walls.splice(i, 1);
                score += 100;
            }
        });

        // UI Update
        scoreEl.innerText = score;
        healthEl.innerText = health + "%";

        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
