<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON_HEX // ORBITAL_SURVIVAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #ff00ff;
            --neon-alt: #00ffff;
            --bg: #050505;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: #fff;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        #ui {
            position: absolute; top: 30px; left: 30px; z-index: 10;
            pointer-events: none;
        }

        .stat { margin-bottom: 10px; }
        .label { font-size: 0.6rem; color: var(--neon-alt); letter-spacing: 2px; }
        .value { font-size: 2rem; font-weight: 900; text-shadow: 0 0 15px var(--neon-alt); }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }

        h1 { font-size: 4rem; margin: 0; text-shadow: 0 0 20px var(--neon); color: var(--neon); }
        .msg { color: var(--neon-alt); margin: 20px 0; letter-spacing: 5px; font-size: 0.8rem; }
        
        .start-btn {
            padding: 15px 50px; background: transparent; border: 2px solid var(--neon);
            color: var(--neon); font-family: 'Orbitron'; font-weight: 900;
            cursor: pointer; transition: 0.3s; letter-spacing: 3px;
        }
        .start-btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 40px var(--neon); }

        canvas { display: block; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat">
            <div class="label">SYNC_INDEX</div>
            <div id="score" class="value">0</div>
        </div>
        <div class="stat">
            <div class="label">STABILITY</div>
            <div id="health" class="value" style="color: var(--neon);">100%</div>
        </div>
    </div>

    <div id="overlay">
        <h1 id="header">NEON_HEX</h1>
        <div class="msg">ORBIT THE CORE // FIND THE GAP</div>
        <button class="start-btn" onclick="startGame()">INIT_CORE</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const healthEl = document.getElementById('health');
    const overlay = document.getElementById('overlay');
    const header = document.getElementById('header');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let gameActive = false;
    let score = 0;
    let health = 100;
    let playerAngle = 0;
    let rotationSpeed = 0.08;
    let walls = [];
    let frame = 0;
    let wallSpeed = 4;
    let spawnRate = 80;

    class Wall {
        constructor() {
            this.dist = Math.max(canvas.width, canvas.height);
            this.width = Math.random() * 1.5 + 1; // Gap size multiplier
            this.angle = Math.random() * Math.PI * 2;
            this.color = Math.random() > 0.5 ? 'var(--neon)' : 'var(--neon-alt)';
        }

        draw() {
            ctx.strokeStyle = this.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            ctx.lineWidth = 8;
            ctx.beginPath();
            // Draw an arc with a gap
            ctx.arc(canvas.width/2, canvas.height/2, this.dist, this.angle, this.angle + (Math.PI * 2) - this.width);
            ctx.stroke();
        }

        update() {
            this.dist -= wallSpeed;
        }
    }

    function startGame() {
        score = 0;
        health = 100;
        walls = [];
        gameActive = true;
        overlay.style.display = 'none';
        animate();
    }

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function animate() {
        if (!gameActive) return;
        frame++;

        // Clear with fade effect
        ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Player Controls
        if (keys['ArrowLeft'] || keys['KeyA']) playerAngle -= rotationSpeed;
        if (keys['ArrowRight'] || keys['KeyD']) playerAngle += rotationSpeed;

        // Draw Player
        const px = canvas.width/2 + Math.cos(playerAngle) * 60;
        const py = canvas.height/2 + Math.sin(playerAngle) * 60;
        
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#fff';
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(px, py, 8, 0, Math.PI * 2);
        ctx.fill();

        // Spawn Walls
        if (frame % Math.floor(spawnRate) === 0) {
            walls.push(new Wall());
        }

        // Difficulty scaling
        wallSpeed = 4 + (score / 1000);
        spawnRate = Math.max(30, 80 - (score / 200));

        // Update/Draw Walls
        walls.forEach((wall, i) => {
            wall.update();
            wall.draw();

            // Collision Detection
            if (wall.dist < 70 && wall.dist > 50) {
                // Normalize angles to 0 - 2PI
                let normPlayer = ((playerAngle % (Math.PI * 2)) + (Math.PI * 2)) % (Math.PI * 2);
                let start = ((wall.angle % (Math.PI * 2)) + (Math.PI * 2)) % (Math.PI * 2);
                let end = (((wall.angle + (Math.PI * 2) - wall.width) % (Math.PI * 2)) + (Math.PI * 2)) % (Math.PI * 2);

                let inGap = false;
                if (start < end) {
                    if (normPlayer > start && normPlayer < end) inGap = true;
                } else {
                    if (normPlayer > start || normPlayer < end) inGap = true;
                }

                if (!inGap) {
                    health -= 20;
                    walls.splice(i, 1);
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0,0,canvas.width, canvas.height); // Flash
                }
            }

            if (wall.dist < 0) {
                walls.splice(i, 1);
                score += 100;
            }
        });

        // UI
        scoreEl.innerText = score;
        healthEl.innerText = health + "%";

        if (health <= 0) {
            gameActive = false;
            header.innerText = "CORE_CRAPSED";
            overlay.style.display = 'flex';
        }

        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
