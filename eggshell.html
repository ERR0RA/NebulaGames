<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHELL SHOCKERS: ULTIMATE STABLE</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #crosshair { 
            position: absolute; top: 50%; left: 50%; width: 15px; height: 15px; 
            border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); 
            pointer-events: none; z-index: 10;
        }
        #hud { 
            position: absolute; bottom: 20px; left: 20px; color: white; 
            text-shadow: 2px 2px #000; pointer-events: none;
        }
        #hp-bg { width: 200px; height: 15px; background: rgba(0,0,0,0.5); border: 2px solid #fff; }
        #hp-bar { width: 100%; height: 100%; background: #ff4444; transition: width 0.1s; }
        #overlay { 
            position: absolute; inset: 0; background: rgba(0,0,0,0.6); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: white; cursor: pointer; z-index: 20;
        }
    </style>
</head>
<body>

<div id="crosshair"></div>
<div id="overlay" onclick="requestLock()">
    <h1>ARENA READY</h1>
    <p>CLICK TO START</p>
    <p style="font-size: 0.8em;">WASD to Move | Mouse to Aim | Click to Shoot</p>
</div>

<div id="hud">
    <div id="hp-bg"><div id="hp-bar"></div></div>
    <h2 id="score-text">EGGS CRACKED: 0</h2>
</div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>

<script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer, clock;
    let player = new THREE.Object3D();
    let pitchObject = new THREE.Object3D(); // Vertical look
    let yawObject = new THREE.Object3D();   // Horizontal look

    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3(), canJump = false;
    let enemies = [], bullets = [], score = 0, health = 100;

    const SENSITIVITY = 0.002;

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 10, 100);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        clock = new THREE.Clock();

        // Setup Rotation Hierarchy (Prevents the "Sky Look" bug)
        pitchObject.add(camera);
        yawObject.add(pitchObject);
        player.add(yawObject);
        player.position.y = 2;
        scene.add(player);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

        // Floor
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ color: 0x55aa55 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Simple Arena Obstacles
        const boxGeo = new THREE.BoxGeometry(4, 4, 4);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
        for(let i=0; i<10; i++) {
            const b = new THREE.Mesh(boxGeo, boxMat);
            b.position.set(Math.random()*60-30, 2, Math.random()*60-30);
            scene.add(b);
        }

        // Listeners
        window.requestLock = () => {
            document.body.requestPointerLock();
            document.getElementById('overlay').style.display = 'none';
        };

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yawObject.rotation.y -= e.movementX * SENSITIVITY;
                pitchObject.rotation.x -= e.movementY * SENSITIVITY;
                // Strict Clamp: 90 degrees up or down max
                pitchObject.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitchObject.rotation.x));
            }
        });

        const onKey = (v) => (e) => {
            if (e.code === 'KeyW') moveForward = v;
            if (e.code === 'KeyS') moveBackward = v;
            if (e.code === 'KeyA') moveLeft = v;
            if (e.code === 'KeyD') moveRight = v;
            if (e.code === 'Space' && v && canJump) { velocity.y = 10; canJump = false; }
        };
        document.addEventListener('keydown', onKey(true));
        document.addEventListener('keyup', onKey(false));
        document.addEventListener('mousedown', () => { if(document.pointerLockElement) shoot(); });

        for(let i=0; i<5; i++) spawnEnemy();
        animate();
    }

    function spawnEnemy() {
        const eggGeo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
        const egg = new THREE.Mesh(eggGeo, new THREE.MeshStandardMaterial({ color: 0xffffff }));
        egg.position.set(Math.random()*80-40, 1, Math.random()*80-40);
        scene.add(egg);
        enemies.push(egg);
    }

    function shoot() {
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({color: 0xffff00}));
        const vector = new THREE.Vector3(0, 0, -1);
        vector.applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
        
        b.position.copy(player.position);
        b.userData = { dir: vector.multiplyScalar(2) };
        scene.add(b);
        bullets.push(b);
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = Math.min(clock.getDelta(), 0.1); // Cap delta to prevent teleporting

        // Movement Logic
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;
        velocity.y -= 30.0 * delta; // Gravity

        const moveDir = new THREE.Vector3();
        if (moveForward) moveDir.z -= 1;
        if (moveBackward) moveDir.z += 1;
        if (moveLeft) moveDir.x -= 1;
        if (moveRight) moveDir.x += 1;
        moveDir.normalize();

        if (moveForward || moveBackward) velocity.z = moveDir.z * 150 * delta;
        if (moveLeft || moveRight) velocity.x = moveDir.x * 150 * delta;

        player.translateX(velocity.x * delta);
        player.translateZ(velocity.z * delta);
        player.position.y += velocity.y * delta;

        if (player.position.y < 2) {
            velocity.y = 0;
            player.position.y = 2;
            canJump = true;
        }

        // Enemy AI
        enemies.forEach((en) => {
            const dist = en.position.distanceTo(player.position);
            if(dist < 30) {
                en.lookAt(player.position.x, 1, player.position.z);
                en.translateZ(4 * delta);
            }
            if(dist < 1.5) {
                health -= 10 * delta;
                document.getElementById('hp-bar').style.width = health + '%';
                if(health <= 0) location.reload();
            }
        });

        // Bullets
        bullets.forEach((b, i) => {
            b.position.add(b.userData.dir);
            enemies.forEach((en, ei) => {
                if(b.position.distanceTo(en.position) < 1) {
                    scene.remove(en); scene.remove(b);
                    enemies.splice(ei, 1); bullets.splice(i, 1);
                    score++;
                    document.getElementById('score-text').innerText = `EGGS CRACKED: ${score}`;
                    spawnEnemy();
                }
            });
            if(b.position.length() > 200) { scene.remove(b); bullets.splice(i, 1); }
        });

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
