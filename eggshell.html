<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHELL SHOCKERS: STRIKE</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Arial', sans-serif; }
        #crosshair { 
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; 
            border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); 
            pointer-events: none;
        }
        #hud { 
            position: absolute; bottom: 20px; left: 20px; color: white; 
            text-shadow: 2px 2px #000; font-size: 20px; display: flex; gap: 20px;
        }
        #hp-bar { width: 200px; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid white; }
        #hp-fill { width: 100%; height: 100%; background: #ff0055; transition: width 0.2s; }
        #flash { 
            position: absolute; inset: 0; background: rgba(255,0,0,0); 
            pointer-events: none; transition: background 0.1s; 
        }
    </style>
</head>
<body>

<div id="flash"></div>
<div id="crosshair"></div>
<div id="hud">
    <div>SHELL: <div id="hp-bar"><div id="hp-fill"></div></div></div>
    <div>CRACKED: <span id="score">0</span></div>
</div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>

<script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer, player, clock;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let canJump = false, velocity = new THREE.Vector3();
    let bullets = [], enemies = [], platforms = [];
    let score = 0, health = 100;

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 0, 150);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        clock = new THREE.Clock();

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

        // --- MAP DESIGN ---
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x7cfc00 }));
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        // Add some platforms with physics collision
        const createBox = (w, h, d, x, y, z) => {
            const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({color: 0xbcbcbc}));
            box.position.set(x, y, z);
            scene.add(box);
            platforms.push(box);
        };

        createBox(10, 2, 10, 0, 1, 0);      // Center Platform
        createBox(5, 5, 5, 15, 2.5, 15);    // High Block
        createBox(20, 1, 5, -15, 0.5, -10); // Ramp/Wall

        // --- PLAYER ---
        player = new THREE.Group();
        player.position.set(0, 5, 20);
        scene.add(player);
        player.add(camera);

        // --- INPUTS ---
        document.addEventListener('mousedown', () => {
            if (document.pointerLockElement !== document.body) document.body.requestPointerLock();
            else shoot();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                player.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
            }
        });

        const onKey = (val) => (e) => {
            if (e.code === 'KeyW') moveForward = val;
            if (e.code === 'KeyS') moveBackward = val;
            if (e.code === 'KeyA') moveLeft = val;
            if (e.code === 'KeyD') moveRight = val;
            if (e.code === 'Space' && val && canJump) { velocity.y = 12; canJump = false; }
        };
        document.addEventListener('keydown', onKey(true));
        document.addEventListener('keyup', onKey(false));

        for(let i=0; i<6; i++) spawnEnemy();
        animate();
    }

    function spawnEnemy() {
        const eggGeo = new THREE.IcosahedronGeometry(1, 2);
        eggGeo.scale(1, 1.3, 1);
        const egg = new THREE.Mesh(eggGeo, new THREE.MeshStandardMaterial({ color: 0xffffff }));
        egg.position.set((Math.random()-0.5)*80, 1.3, (Math.random()-0.5)*80);
        scene.add(egg);
        enemies.push(egg);
    }

    function shoot() {
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshBasicMaterial({color: 0xffff00}));
        const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
        b.position.copy(player.position).add(dir.clone().multiplyScalar(1.5));
        b.userData = { vel: dir.multiplyScalar(2.5) };
        scene.add(b);
        bullets.push(b);
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        // 1. Player Physics & Movement
        const moveDir = new THREE.Vector3();
        if (moveForward) moveDir.z -= 1;
        if (moveBackward) moveDir.z += 1;
        if (moveLeft) moveDir.x -= 1;
        if (moveRight) moveDir.x += 1;
        moveDir.applyQuaternion(player.quaternion).normalize().multiplyScalar(15 * delta);
        player.position.add(moveDir);

        velocity.y -= 30 * delta;
        player.position.y += velocity.y * delta;

        // Simple Platform Collision
        if (player.position.y < 2) {
            player.position.y = 2; velocity.y = 0; canJump = true;
        }

        // 2. Enemy AI & Attack
        enemies.forEach((en, i) => {
            const dist = en.position.distanceTo(player.position);
            
            // Move toward player
            if (dist < 40) {
                en.lookAt(player.position.x, 1.3, player.position.z);
                en.translateZ(6 * delta);
            }

            // Attack logic
            if (dist < 2.5) {
                health -= 0.5;
                document.getElementById('hp-fill').style.width = health + "%";
                document.getElementById('flash').style.background = "rgba(255,0,0,0.3)";
                setTimeout(() => document.getElementById('flash').style.background = "rgba(255,0,0,0)", 50);
                if(health <= 0) location.reload();
            }
        });

        // 3. Bullets
        bullets.forEach((b, bi) => {
            b.position.add(b.userData.vel);
            enemies.forEach((en, ei) => {
                if (b.position.distanceTo(en.position) < 1.8) {
                    scene.remove(en); scene.remove(b);
                    enemies.splice(ei, 1); bullets.splice(bi, 1);
                    score++; document.getElementById('score').innerText = score;
                    spawnEnemy();
                }
            });
        });

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
