<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula | Eggshell Ultra-Graphics</title>
    <style>
        :root { --primary: #00ff88; --glow: rgba(0, 255, 136, 0.5); }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* High-End HUD Overlay */
        #ui-layer {
            position: absolute; inset: 0; pointer-events: none;
            border: 20px solid transparent;
            background: linear-gradient(to bottom, rgba(0,255,136,0.05) 0%, transparent 15%, transparent 85%, rgba(0,255,136,0.05) 100%);
            z-index: 5;
        }

        #crosshair { 
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; 
            border: 1px solid var(--primary); border-radius: 50%; transform: translate(-50%, -50%); 
            box-shadow: 0 0 15px var(--glow); z-index: 10;
        }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 2px; height: 2px; background: white; transform: translate(-50%, -50%); }

        #hud { position: absolute; bottom: 50px; left: 50px; color: white; z-index: 10; }
        .bar-container { width: 300px; height: 4px; background: rgba(255,255,255,0.1); margin-top: 10px; position: relative; }
        #hp-bar { width: 100%; height: 100%; background: var(--primary); box-shadow: 0 0 20px var(--primary); transition: width 0.4s; }

        #overlay { 
            position: absolute; inset: 0; background: #000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: white; cursor: pointer; z-index: 100;
        }
        .start-btn {
            padding: 20px 60px; background: none; border: 1px solid var(--primary);
            color: var(--primary); font-weight: 800; letter-spacing: 5px; cursor: pointer;
            transition: 0.3s;
        }
        .start-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 50px var(--primary); }
    </style>
</head>
<body>

<div id="ui-layer"></div>
<div id="crosshair"></div>

<div id="overlay" onclick="requestLock()">
    <h1 style="font-size: 4rem; margin-bottom: 0;">NEBULA</h1>
    <p style="opacity: 0.4; letter-spacing: 10px; margin-bottom: 40px;">GRAPHICS_ENGINE_V3</p>
    <button class="start-btn">INITIALIZE</button>
</div>

<div id="hud">
    <div style="font-size: 0.7rem; letter-spacing: 3px;">SYSTEM_INTEGRITY</div>
    <div class="bar-container"><div id="hp-bar"></div></div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    let scene, camera, renderer, composer, clock;
    let player = new THREE.Object3D(), pitchObject = new THREE.Object3D(), yawObject = new THREE.Object3D();
    let weapon, muzzleFlash;
    
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3(), canJump = false;
    let enemies = [], bullets = [], particles = [], health = 100;

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010204);
        scene.fog = new THREE.FogExp2(0x010204, 0.05);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        clock = new THREE.Clock();

        pitchObject.add(camera);
        yawObject.add(pitchObject);
        player.add(yawObject);
        player.position.set(0, 2, 0);
        scene.add(player);

        // --- RENDERER & POST-PROCESSING ---
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.5;
        document.body.appendChild(renderer.domElement);

        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- ADVANCED LIGHTING ---
        const mainLight = new THREE.PointLight(0x00ff88, 10, 50);
        mainLight.position.set(0, 10, 0);
        scene.add(mainLight);

        // --- THE FLOOR (Cyber-PBR) ---
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x050505, 
            roughness: 0.1, 
            metalness: 0.9 
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const grid = new THREE.GridHelper(200, 100, 0x00ff88, 0x001100);
        grid.position.y = 0.01;
        scene.add(grid);

        // --- WEAPON & MUZZLE FLASH ---
        const gunGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.7), new THREE.MeshStandardMaterial({color:0x000, metalness:1}));
        muzzleFlash = new THREE.PointLight(0x00ff88, 0, 5);
        muzzleFlash.position.set(0, 0, -0.5);
        gunGroup.add(body, muzzleFlash);
        gunGroup.position.set(0.3, -0.25, -0.5);
        camera.add(gunGroup);
        weapon = gunGroup;

        // Input Setup
        window.requestLock = () => {
            document.body.requestPointerLock();
            document.getElementById('overlay').style.display = 'none';
        };

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement) {
                yawObject.rotation.y -= e.movementX * 0.0015;
                pitchObject.rotation.x -= e.movementY * 0.0015;
                pitchObject.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitchObject.rotation.x));
            }
        });

        const onKey = (v) => (e) => {
            if (e.code === 'KeyW') moveForward = v;
            if (e.code === 'KeyS') moveBackward = v;
            if (e.code === 'KeyA') moveLeft = v;
            if (e.code === 'KeyD') moveRight = v;
            if (e.code === 'Space' && v && canJump) { velocity.y = 12; canJump = false; }
        };
        document.addEventListener('keydown', onKey(true));
        document.addEventListener('keyup', onKey(false));
        document.addEventListener('mousedown', () => { if(document.pointerLockElement) shoot(); });

        for(let i=0; i<12; i++) spawnEnemy();
        animate();
    }

    function spawnEnemy() {
        const mesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.6, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x00ff88, emissiveIntensity: 0.5 })
        );
        mesh.position.set(Math.random()*100-50, 0.6, Math.random()*100-50);
        scene.add(mesh);
        enemies.push(mesh);
    }

    function shoot() {
        muzzleFlash.intensity = 20;
        weapon.position.z += 0.15; // Kickback

        const b = new THREE.Mesh(
            new THREE.CylinderGeometry(0.02, 0.02, 0.8),
            new THREE.MeshBasicMaterial({ color: 0x00ff88 })
        );
        b.rotation.x = Math.PI / 2;
        
        const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
        b.quaternion.copy(camera.getWorldQuaternion(new THREE.Quaternion()));
        b.position.copy(player.position).add(dir.clone().multiplyScalar(1.2));
        b.userData = { dir: dir.multiplyScalar(2.5) };
        scene.add(b);
        bullets.push(b);
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        // Smooth muzzle flash decay
        muzzleFlash.intensity *= 0.1;
        weapon.position.z += (-0.5 - weapon.position.z) * 0.2;

        // Realistic Movement Physics
        velocity.x -= velocity.x * 8.0 * delta;
        velocity.z -= velocity.z * 8.0 * delta;
        velocity.y -= 30.0 * delta;

        const moveDir = new THREE.Vector3();
        if (moveForward) moveDir.z -= 1;
        if (moveBackward) moveDir.z += 1;
        if (moveLeft) moveDir.x -= 1;
        if (moveRight) moveDir.x += 1;
        moveDir.normalize();

        if (moveForward || moveBackward) velocity.z = moveDir.z * 180 * delta;
        if (moveLeft || moveRight) velocity.x = moveDir.x * 180 * delta;

        player.translateX(velocity.x * delta);
        player.translateZ(velocity.z * delta);
        player.position.y += velocity.y * delta;

        if (player.position.y < 2) { velocity.y = 0; player.position.y = 2; canJump = true; }

        // Bullet Logic with "Tracer" effect
        bullets.forEach((b, i) => {
            b.position.add(b.userData.dir);
            enemies.forEach((en, ei) => {
                if(b.position.distanceTo(en.position) < 1) {
                    scene.remove(en); scene.remove(b);
                    enemies.splice(ei, 1); bullets.splice(i, 1);
                    spawnEnemy();
                }
            });
            if(b.position.length() > 200) { scene.remove(b); bullets.splice(i, 1); }
        });

        // Dynamic Enemy Movement
        enemies.forEach(en => {
            en.lookAt(player.position);
            en.translateZ(4 * delta);
        });

        composer.render();
    }
</script>
</body>
</html>
