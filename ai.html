<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS G4 | Search-Enabled AI</title>
    <style>
        :root { --neon: #00ff95; --bg: #08080a; --panel: #111116; --user: #00d2ff; }
        body { margin: 0; background: var(--bg); color: #e0e0e0; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Navigation & Search Bar */
        header { background: var(--panel); padding: 12px 20px; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid #222; }
        #addr-bar { flex: 1; background: #000; border: 1px solid #333; color: var(--neon); padding: 12px; border-radius: 8px; outline: none; font-family: 'JetBrains Mono', monospace; }
        .btn { background: var(--neon); color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 6px; transition: 0.2s; }
        .btn:hover { background: #fff; box-shadow: 0 0 15px var(--neon); }

        main { display: flex; flex: 1; overflow: hidden; }
        #web-view { flex: 2.2; border: none; background: white; }
        
        /* AI Sidebar */
        #ai-sidebar { flex: 1; background: var(--panel); border-left: 1px solid #222; display: flex; flex-direction: column; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        /* Messages */
        .msg { padding: 14px; border-radius: 12px; line-height: 1.5; font-size: 0.9rem; max-width: 85%; animation: slideIn 0.2s ease; position: relative; }
        .ai { background: #1c1c24; border-left: 3px solid var(--neon); align-self: flex-start; }
        .user { background: #252530; align-self: flex-end; color: var(--user); border-right: 3px solid var(--user); }
        .thought { color: #555; font-size: 0.7rem; font-family: monospace; display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; color: var(--neon); font-size: 1.2rem;">NEXUS<span style="color:white">G4</span></div>
    <input type="text" id="addr-bar" placeholder="Search the web or ask Nexus..." autocomplete="off">
    <button class="btn" onclick="execute()">SEARCH / RUN</button>
</header>

<main>
    <iframe id="web-view" name="web-view" src="about:blank"></iframe>
    <aside id="ai-sidebar">
        <div id="chat-window">
            <div class="msg ai">
                <span class="thought">Search Modules Loaded.</span>
                I am now connected to the web. Type a topic to search, or a URL to visit. I can "see" what you're looking for.
            </div>
        </div>
    </aside>
</main>

<script>
    const chat = document.getElementById('chat-window');
    const view = document.getElementById('web-view');
    const input = document.getElementById('addr-bar');

    let memory = { lastSearch: null };

    function addMessage(text, type, thought = null) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = (thought ? `<span class="thought">${thought}</span>` : "") + `<div>${text}</div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function execute() {
        const val = input.value.trim();
        if (!val) return;
        
        addMessage(val, 'user');
        input.value = "";

        // 1. URL CHECK (Direct Navigation)
        if (val.includes('.') && !val.includes(' ')) {
            handleNav(val);
        } 
        // 2. SEARCH COMMAND
        else if (val.toLowerCase().startsWith("search ") || !val.includes(' ')) {
            handleSearch(val.replace("search ", ""));
        }
        // 3. AI QUESTION
        else {
            processAI(val.toLowerCase());
        }
    }

    function handleNav(url) {
        let finalUrl = url.startsWith('http') ? url : 'https://' + url;
        addMessage(`Navigating to site...`, 'ai', "URL REDIRECT");
        view.src = finalUrl;
    }

    function handleSearch(query) {
        // Using DuckDuckGo as a clean, embeddable search proxy
        const searchUrl = `https://duckduckgo.com/?q=${encodeURIComponent(query)}&kp=-1&kl=us-en`;
        memory.lastSearch = query;
        addMessage(`Searching the web for "${query}"...`, 'ai', "WEB CRAWLER ACTIVE");
        view.src = searchUrl;
    }

    function processAI(query) {
        let response = "";
        let thought = "HEURISTIC ANALYSIS";

        if (query.includes("who") || query.includes("what is")) {
            thought = "KNOWLEDGE RETRIEVAL";
            response = "I've pulled up the most relevant search results in the browser window for you. Do you want me to explain any specific part of it?";
            // Auto-search if it looks like a factual question
            handleSearch(query);
        } else {
            response = "I'm standing by. I can search for info, open websites, or help you write code. What's next?";
        }

        setTimeout(() => addMessage(response, 'ai', thought), 400);
    }

    input.addEventListener("keypress", (e) => { if(e.key === "Enter") execute(); });
</script>
</body>
</html>
