<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS GEN-3 | Contextual AI</title>
    <style>
        :root { --neon: #00ff95; --bg: #0a0a0c; --panel: #121217; --user: #00d2ff; }
        body { margin: 0; background: var(--bg); color: #e0e0e0; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; }
        
        /* UI Layout */
        header { background: var(--panel); padding: 10px 20px; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid #222; }
        #addr-bar { flex: 1; background: #000; border: 1px solid #333; color: var(--neon); padding: 12px; border-radius: 8px; outline: none; font-family: monospace; }
        .btn { background: var(--neon); color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 6px; }

        main { display: flex; flex: 1; overflow: hidden; }
        #web-view { flex: 2.5; border: none; background: white; }
        
        /* Chat System */
        #ai-sidebar { flex: 1.2; background: var(--panel); border-left: 1px solid #222; display: flex; flex-direction: column; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        /* Message Bubbles */
        .msg { padding: 14px; border-radius: 12px; line-height: 1.5; font-size: 0.9rem; max-width: 85%; animation: slideIn 0.2s ease; }
        .ai { background: #1c1c24; border-left: 3px solid var(--neon); align-self: flex-start; }
        .user { background: #252530; align-self: flex-end; color: var(--user); border-right: 3px solid var(--user); }
        .thought { color: #555; font-size: 0.75rem; font-family: monospace; display: block; margin-bottom: 5px; }

        /* Scrollbar */
        #chat-window::-webkit-scrollbar { width: 5px; }
        #chat-window::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; color: var(--neon);">NEXUS<span style="color:white">G3</span></div>
    <input type="text" id="addr-bar" placeholder="Enter URL or chat with Nexus..." autocomplete="off">
    <button class="btn" onclick="execute()">RUN</button>
</header>

<main>
    <iframe id="web-view" src="about:blank"></iframe>
    <aside id="ai-sidebar">
        <div id="chat-window">
            <div class="msg ai">
                <span class="thought">System Ready. Context Engine: Online.</span>
                Welcome back. I am now running on the Gen-3 Context Engine. I can remember the subject of our conversation. How can I assist?
            </div>
        </div>
    </aside>
</main>

<script>
    const chat = document.getElementById('chat-window');
    const view = document.getElementById('web-view');
    const input = document.getElementById('addr-bar');

    // --- BRAIN UPGRADE: CONTEXT & MEMORY ---
    let memory = {
        lastSubject: null, // Tracks if we are talking about 'code', 'games', etc.
        userName: null,
        history: []
    };

    function addMessage(text, type, thought = null) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = (thought ? `<span class="thought">[${thought}]</span>` : "") + `<div>${text}</div>`;
        chat.appendChild(div);
        
        // AUTO-SCROLL FIX
        chat.scrollTop = chat.scrollHeight;
        div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function execute() {
        const val = input.value.trim();
        if (!val) return;
        
        addMessage(val, 'user');
        input.value = "";

        if (val.includes('.') && !val.includes(' ')) {
            handleNav(val);
        } else {
            processSmartAI(val.toLowerCase());
        }
    }

    function handleNav(url) {
        let finalUrl = url.startsWith('http') ? url : 'https://' + url;
        addMessage(`Opening ${url}...`, 'ai', "Routing browser request.");
        view.src = finalUrl;
    }

    function processSmartAI(query) {
        let response = "";
        let thought = "";

        // 1. CONTEXT CHECKING (The "Smart" Part)
        // If the user uses pronouns like "it" or "that", use the last subject
        let activeSubject = memory.lastSubject;
        
        if (query.match(/code|script|html|js|css|build/)) {
            activeSubject = "coding";
            memory.lastSubject = "coding";
        } else if (query.match(/game|play|fun|basketball/)) {
            activeSubject = "gaming";
            memory.lastSubject = "gaming";
        } else if (query.match(/who|name|identify/)) {
            activeSubject = "identity";
        }

        // 2. RESPONSE ENGINE
        switch(activeSubject) {
            case "coding":
                thought = "Analyzing syntax requirements.";
                response = query.includes("example") 
                    ? "Here is a boilerplate: &lt;button onclick='alert(\"Hi\")'&gt;Click Me&lt;/button&gt;" 
                    : "Coding mode active. I can help you structure scripts or debug HTML. What are we building?";
                break;
            case "gaming":
                thought = "Calculating physics and game states.";
                response = "I'm ready to upgrade our Basketball game. Should we add a score counter or a jump-height modifier?";
                break;
            case "identity":
                thought = "Accessing local profile.";
                response = "I am Nexus Gen-3, your contextual browser assistant. I live entirely in this HTML file.";
                break;
            default:
                // Handle "it" or "more" based on context
                if (query.includes("more") || query.includes("tell me")) {
                    thought = `Recalling last subject: ${memory.lastSubject}`;
                    response = memory.lastSubject 
                        ? `Tell you more about ${memory.lastSubject}? I'd be happy to. Where should we dive deeper?` 
                        : "I'm not sure what we're talking about yet. Give me a topic!";
                } else {
                    thought = "General heuristic search.";
                    response = "I'm processing that. Want me to search the web for a detailed answer?";
                }
        }

        setTimeout(() => addMessage(response, 'ai', thought), 500);
    }

    input.addEventListener("keypress", (e) => { if(e.key === "Enter") execute(); });
</script>
</body>
</html>
