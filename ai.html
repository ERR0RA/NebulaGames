<!DOCTYPE html>
<html>
<head>
    <title>NEXUS-3D | Pathfinding AI</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        #container { display: flex; width: 100vw; height: 100vh; }
        canvas.view { width: 100%; height: 100%; image-rendering: pixelated; display: none; }
        #minimap { 
            position: absolute; top: 15px; left: 15px; 
            border: 1px solid #0f0; background: rgba(0,0,0,0.9); z-index: 30; 
            display: none;
        }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; z-index: 100; }
        .menu-box { border: 2px solid #0f0; padding: 30px; text-align: center; background: #050505; }
        .btn { background: #0f0; color: #000; border: none; padding: 12px 25px; margin: 8px; cursor: pointer; font-weight: bold; width: 240px; display: block; }
        #hud { position: absolute; bottom: 15px; width: 100%; display: none; justify-content: space-around; pointer-events: none; }
        .hp-bar { background: rgba(0,0,0,0.8); padding: 5px 15px; border: 1px solid #0f0; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="container"><canvas id="p1Cam" class="view"></canvas></div>
    <canvas id="minimap" width="120" height="120"></canvas>

    <div id="main-menu" class="overlay">
        <div class="menu-box">
            <h1>AI_PATHFINDING_v5</h1>
            <button class="btn" onclick="init()">START 3v1 SURVIVAL</button>
            <p style="color:#444; font-size: 0.7rem; margin-top:10px;">MAP: 21x21 | AI: BFS_SHORTEST_PATH</p>
        </div>
    </div>

    <div id="hud">
        <div class="hp-bar">INTEGRITY: <span id="p1hp">100</span>%</div>
    </div>

<script>
    const p1c = document.getElementById('p1Cam'), ctx1 = p1c.getContext('2d');
    const mCtx = document.getElementById('minimap').getContext('2d');

    const SIZE = 21; 
    let world = [], active = false;
    const keys = {};
    const p1 = { x: 1.5, y: 1.5, dir: 0, hp: 100 };
    let bots = [];

    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function generateMaze() {
        world = Array(SIZE).fill().map(() => Array(SIZE).fill(1));
        function walk(x, y) {
            world[y][x] = 0;
            let dirs = [[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-0.5);
            for(let [dx,dy] of dirs) {
                let nx=x+dx, ny=y+dy;
                if(nx>0 && nx<SIZE && ny>0 && ny<SIZE && world[ny][nx]==1) {
                    world[y+dy/2][x+dx/2]=0; walk(nx,ny);
                }
            }
        }
        walk(1,1);
    }

    // BFS Pathfinding for Smarter Bots
    function getNextStep(botX, botY, targetX, targetY) {
        let startX = Math.floor(botX), startY = Math.floor(botY);
        let endX = Math.floor(targetX), endY = Math.floor(targetY);
        if (startX === endX && startY === endY) return {x: targetX, y: targetY};

        let queue = [[startX, startY]];
        let visited = new Set([startX + ',' + startY]);
        let parent = {};

        while (queue.length > 0) {
            let [cx, cy] = queue.shift();
            if (cx === endX && cy === endY) break;

            for (let [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
                let nx = cx + dx, ny = cy + dy;
                let key = nx + ',' + ny;
                if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && world[ny][nx] === 0 && !visited.has(key)) {
                    visited.add(key);
                    parent[key] = [cx, cy];
                    queue.push([nx, ny]);
                }
            }
        }

        let curr = endX + ',' + endY;
        let path = [];
        while (parent[curr]) {
            path.push(curr);
            curr = parent[curr][0] + ',' + parent[curr][1];
        }
        
        if (path.length === 0) return {x: botX, y: botY};
        let next = path.pop().split(',').map(Number);
        return {x: next[0] + 0.5, y: next[1] + 0.5};
    }

    function init() {
        generateMaze();
        active = true;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('minimap').style.display = 'block';
        p1c.style.display = 'block';
        bots = [
            {x: SIZE-2.5, y: 1.5, s: 0.02},
            {x: 1.5, y: SIZE-2.5, s: 0.02},
            {x: SIZE-2.5, y: SIZE-2.5, s: 0.02}
        ];
        p1c.width = p1c.clientWidth/2; p1c.height = p1c.clientHeight/2;
        loop();
    }

    function render() {
        const w = p1c.width, h = p1c.height;
        ctx1.fillStyle="#000"; ctx1.fillRect(0,0,w,h);
        let zBuf = new Array(w).fill(25);

        for(let i=0; i<w; i++) {
            let a = (p1.dir - 0.6) + (i/w)*1.2;
            let d = 0, hit = false, sx = Math.cos(a), sy = Math.sin(a);
            while(!hit && d < 18) {
                d += 0.1;
                let tx = Math.floor(p1.x + sx*d), ty = Math.floor(p1.y + sy*d);
                if(world[ty] && world[ty][tx]==1) hit = true;
            }
            zBuf[i] = d;
            let wallH = h / (d * Math.cos(a - p1.dir));
            ctx1.fillStyle = `rgb(0,${150/d},0)`;
            ctx1.fillRect(i, h/2-wallH/2, 1, wallH);
        }

        bots.forEach(b => {
            let dx = b.x - p1.x, dy = b.y - p1.y, dist = Math.hypot(dx, dy);
            let a = Math.atan2(dy, dx) - p1.dir;
            while(a < -Math.PI) a += Math.PI*2; while(a > Math.PI) a -= Math.PI*2;
            if(Math.abs(a) < 0.6) {
                let sx = (a + 0.6)/1.2 * w, sh = h / dist;
                if(dist < zBuf[Math.floor(sx)]) {
                    ctx1.fillStyle = "#f00";
                    ctx1.fillRect(sx - sh/8, h/2 - sh/2, sh/4, sh);
                }
            }
        });
    }

    function loop() {
        if(!active) return;
        
        if(keys['KeyW']) { let nx=p1.x+Math.cos(p1.dir)*0.04, ny=p1.y+Math.sin(p1.dir)*0.04; if(!world[Math.floor(ny)][Math.floor(nx)]) {p1.x=nx; p1.y=ny;} }
        if(keys['KeyS']) { let nx=p1.x-Math.cos(p1.dir)*0.03, ny=p1.y-Math.sin(p1.dir)*0.03; if(!world[Math.floor(ny)][Math.floor(nx)]) {p1.x=nx; p1.y=ny;} }
        if(keys['KeyA']) p1.dir -= 0.05; if(keys['KeyD']) p1.dir += 0.05;

        bots.forEach(b => {
            if (Math.hypot(p1.x - b.x, p1.y - b.y) < 0.4) { p1.hp -= 0.5; if(p1.hp <= 0) location.reload(); }
            
            // Smarter movement using pathfinding
            let next = getNextStep(b.x, b.y, p1.x, p1.y);
            let dx = next.x - b.x, dy = next.y - b.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 0.01) {
                b.x += (dx/dist) * b.s;
                b.y += (dy/dist) * b.s;
            }
        });

        render();
        document.getElementById('p1hp').innerText = Math.floor(p1.hp);
        
        mCtx.clearRect(0,0,120,120);
        let s = 120/SIZE;
        for(let y=0; y<SIZE; y++) for(let x=0; x<SIZE; x++) if(world[y][x]) { mCtx.fillStyle="#222"; mCtx.fillRect(x*s,y*s,s,s); }
        mCtx.fillStyle="#0f0"; mCtx.fillRect(p1.x*s-1.5, p1.y*s-1.5, 3, 3);
        mCtx.fillStyle="#f00"; bots.forEach(b => mCtx.fillRect(b.x*s-1, b.y*s-1, 2, 2));

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
