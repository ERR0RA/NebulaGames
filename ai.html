<!DOCTYPE html>
<html>
<head>
    <title>NEXUS-3D | Small Maze</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        #container { display: flex; width: 100vw; height: 100vh; }
        canvas { width: 50%; height: 100%; border-right: 1px solid #333; image-rendering: pixelated; }
        
        #minimap { 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            border: 2px solid #0f0; 
            background: rgba(0,0,0,0.9); 
            z-index: 20; 
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; z-index: 100; }
        .menu-box { border: 2px solid #0f0; padding: 30px; text-align: center; }
        .btn { background: #0f0; color: #000; border: none; padding: 12px 25px; margin: 8px; cursor: pointer; font-weight: bold; width: 220px; }
        
        #hud { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; z-index: 10; }
        .stats { background: rgba(0,0,0,0.8); padding: 8px; border: 1px solid #0f0; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="container">
        <canvas id="p1Cam"></canvas>
        <canvas id="p2Cam"></canvas>
    </div>
    
    <canvas id="minimap" width="110" height="110"></canvas>

    <div id="main-menu" class="overlay">
        <div class="menu-box">
            <h1>NEXUS_CQB</h1>
            <button class="btn" onclick="init('3v2')">3 BOTS VS 2 PLAYERS</button><br>
            <button class="btn" onclick="init('bot')">SOLO SURVIVAL</button>
            <p style="color:#555; font-size: 0.7rem;">SMALL_MAP_LOADED | P1: WASD | P2: ARROWS</p>
        </div>
    </div>

    <div id="hud" style="display:none">
        <div class="stats">P1: <span id="p1hp">100</span>%</div>
        <div class="stats">P2: <span id="p2hp">100</span>%</div>
    </div>

<script>
    const p1c = document.getElementById('p1Cam'), ctx1 = p1c.getContext('2d');
    const p2c = document.getElementById('p2Cam'), ctx2 = p2c.getContext('2d');
    const mCtx = document.getElementById('minimap').getContext('2d');

    const SIZE = 15; // Scaled down for tighter gameplay
    let world = [], active = false, mode = '';
    const keys = {};

    const p1 = { x: 1.5, y: 1.5, dir: 0, hp: 100, active: true };
    const p2 = { x: SIZE-1.5, y: SIZE-1.5, dir: Math.PI, hp: 100, active: false };
    let bots = [];

    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function generateMaze() {
        world = Array(SIZE).fill().map(() => Array(SIZE).fill(1));
        function walk(x, y) {
            world[y][x] = 0;
            let dirs = [[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-0.5);
            for(let [dx,dy] of dirs) {
                let nx=x+dx, ny=y+dy;
                if(nx>0 && nx<SIZE && ny>0 && ny<SIZE && world[ny][nx]==1) {
                    world[y+dy/2][x+dx/2]=0; walk(nx,ny);
                }
            }
        }
        walk(1,1);
    }

    function init(m) {
        mode = m;
        generateMaze();
        p1.hp = 100; p2.hp = 100;
        p2.active = (mode === '3v2');
        p2c.style.display = p2.active ? 'block' : 'none';
        p1c.style.width = p2.active ? '50%' : '100%';

        bots = [
            {x: SIZE/2, y: SIZE/2, s: 0.018},
            {x: SIZE-2.5, y: 1.5, s: 0.015},
            {x: 1.5, y: SIZE-2.5, s: 0.015}
        ];

        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        active = true;
        resize(); loop();
    }

    function resize() {
        p1c.width = p1c.clientWidth/2; p1c.height = p1c.clientHeight/2;
        p2c.width = p2c.clientWidth/2; p2c.height = p2c.clientHeight/2;
    }

    function drawView(ctx, p, canvas) {
        const w = canvas.width, h = canvas.height;
        ctx.fillStyle="#000"; ctx.fillRect(0,0,w,h);
        let zBuf = new Array(w).fill(20);

        for(let i=0; i<w; i++) {
            let a = (p.dir - 0.6) + (i/w)*1.2;
            let d = 0, hit = false, sx = Math.cos(a), sy = Math.sin(a);
            while(!hit && d < 12) {
                d += 0.1;
                let tx = Math.floor(p.x + sx*d), ty = Math.floor(p.y + sy*d);
                if(world[ty] && world[ty][tx]==1) hit = true;
            }
            zBuf[i] = d;
            let wallH = h / (d * Math.cos(a - p.dir));
            ctx.fillStyle = `rgb(0,${160/d},80)`;
            ctx.fillRect(i, h/2-wallH/2, 1, wallH);
        }

        // Draw Bots as red pillars
        bots.forEach(b => {
            let dx = b.x - p.x, dy = b.y - p.y;
            let dist = Math.hypot(dx, dy);
            let a = Math.atan2(dy, dx) - p.dir;
            while(a < -Math.PI) a += Math.PI*2; while(a > Math.PI) a -= Math.PI*2;
            if(Math.abs(a) < 0.6) {
                let sx = (a + 0.6)/1.2 * w;
                let sh = h / dist;
                if(dist < zBuf[Math.floor(sx)]) {
                    ctx.fillStyle = "#f00";
                    ctx.fillRect(sx - sh/8, h/2 - sh/2, sh/4, sh);
                }
            }
        });
    }

    function loop() {
        if(!active) return;
        
        const move = (p, up, down, left, right) => {
            if(keys[up]) { let nx=p.x+Math.cos(p.dir)*0.04, ny=p.y+Math.sin(p.dir)*0.04; if(!world[Math.floor(ny)][Math.floor(nx)]) {p.x=nx; p.y=ny;} }
            if(keys[down]) { let nx=p.x-Math.cos(p.dir)*0.03, ny=p.y-Math.sin(p.dir)*0.03; if(!world[Math.floor(ny)][Math.floor(nx)]) {p.x=nx; p.y=ny;} }
            if(keys[left]) p.dir -= 0.04; if(keys[right]) p.dir += 0.04;
        };

        move(p1, 'KeyW', 'KeyS', 'KeyA', 'KeyD');
        if(p2.active) move(p2, 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight');

        bots.forEach(b => {
            let target = p1;
            if(p2.active && Math.hypot(p2.x-b.x, p2.y-b.y) < Math.hypot(p1.x-b.x, p1.y-b.y)) target = p2;
            let dx = target.x - b.x, dy = target.y - b.y, dist = Math.hypot(dx, dy);
            if (dist < 0.5) {
                target.hp -= 0.5;
                if(target.hp <= 0) location.reload();
            } else {
                let mx = (dx/dist)*b.s, my = (dy/dist)*b.s;
                if (!world[Math.floor(b.y + my)][Math.floor(b.x + mx)]) { b.x += mx; b.y += my; }
                else if (!world[Math.floor(b.y)][Math.floor(b.x + mx)]) { b.x += mx; }
                else if (!world[Math.floor(b.y + my)][Math.floor(b.x)]) { b.y += my; }
            }
        });

        drawView(ctx1, p1, p1c);
        if(p2.active) drawView(ctx2, p2, p2c);

        document.getElementById('p1hp').innerText = Math.floor(p1.hp);
        document.getElementById('p2hp').innerText = Math.floor(p2.hp);
        
        mCtx.clearRect(0,0,110,110);
        let s = 110/SIZE;
        for(let y=0; y<SIZE; y++) for(let x=0; x<SIZE; x++) if(world[y][x]) { mCtx.fillStyle="#222"; mCtx.fillRect(x*s,y*s,s,s); }
        mCtx.fillStyle="#0f0"; mCtx.fillRect(p1.x*s-1.5, p1.y*s-1.5, 3, 3);
        if(p2.active) { mCtx.fillStyle="#0af"; mCtx.fillRect(p2.x*s-1.5, p2.y*s-1.5, 3, 3); }
        mCtx.fillStyle="#f00"; bots.forEach(b => mCtx.fillRect(b.x*s-1, b.y*s-1, 2, 2));

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
