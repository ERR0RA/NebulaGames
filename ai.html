<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS CORE | Productivity OS</title>
    <style>
        :root { --neon: #00ff95; --bg: #050508; --panel: #111118; --user: #00d2ff; --border: #222; }
        body { margin: 0; background: var(--bg); color: #eee; font-family: 'Inter', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Dashboard Header */
        header { background: var(--panel); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 100; }
        .logo { font-weight: 800; color: var(--neon); letter-spacing: 1px; }
        #clock { font-family: monospace; color: var(--gray); font-size: 0.9rem; }

        /* Multi-Pane Layout */
        main { display: flex; flex: 1; overflow: hidden; gap: 2px; background: var(--border); }
        
        /* Left: Web/Work Workspace */
        .workspace { flex: 2; background: #fff; display: flex; flex-direction: column; }
        .tab-bar { background: #1a1a24; padding: 5px; display: flex; gap: 5px; }
        #addr-input { flex: 1; background: #000; border: 1px solid #333; color: var(--neon); padding: 5px 15px; border-radius: 4px; outline: none; font-size: 0.8rem; }
        
        /* Right: AI & Tools Sidebar */
        .sidebar { flex: 1; background: var(--panel); display: flex; flex-direction: column; min-width: 380px; }
        
        /* Widget Grid */
        .widget-area { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-bottom: 1px solid var(--border); }
        .widget { background: #000; padding: 10px; border-radius: 6px; border: 1px solid #333; }
        .widget-title { font-size: 0.6rem; color: var(--neon); text-transform: uppercase; margin-bottom: 5px; }
        
        /* Chat/Agent Area */
        #agent-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; font-size: 0.85rem; }
        .msg { padding: 10px; border-radius: 4px; line-height: 1.4; }
        .ai { background: #1a1a25; border-left: 2px solid var(--neon); }
        .user { background: #222; border-right: 2px solid var(--user); align-self: flex-end; }

        /* Task Input */
        .input-box { padding: 15px; background: #000; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 4px; outline: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">NEXUS // CORE</div>
    <div id="clock">00:00:00</div>
</header>

<main>
    <section class="workspace">
        <div class="tab-bar">
            <input type="text" id="addr-input" placeholder="Enter URL to browse...">
            <button onclick="loadURL()" style="background:var(--neon); border:none; border-radius:4px; padding:0 10px; cursor:pointer;">GO</button>
        </div>
        <iframe id="view" src="about:blank" style="flex:1; border:none;"></iframe>
    </section>

    <section class="sidebar">
        <div class="widget-area">
            <div class="widget">
                <div class="widget-title">Active Tasks</div>
                <div id="task-list" style="font-size: 0.75rem; color: #888;">No pending tasks.</div>
            </div>
            <div class="widget">
                <div class="widget-title">System Status</div>
                <div style="font-size: 0.75rem; color: var(--neon);">LATENCY: 14ms<br>NODES: ACTIVE</div>
            </div>
        </div>

        <div id="agent-flow">
            <div class="msg ai"><b>SYSTEM:</b> Core initialized. Use the command line below to add tasks or ask questions.</div>
        </div>

        <div class="input-box">
            <input type="text" id="cmd" placeholder="Type a command (e.g., 'task: Fix code' or 'How are you?')..." onkeypress="if(event.key==='Enter') execute()">
        </div>
    </section>
</main>

<script>
    const agent = document.getElementById('agent-flow');
    const tasks = document.getElementById('task-list');
    const cmdInput = document.getElementById('cmd');

    // Persistence Logic
    let data = JSON.parse(localStorage.getItem('nexus_core')) || { tasks: [] };

    function updateTasks() {
        tasks.innerHTML = data.tasks.length ? data.tasks.map(t => `• ${t}`).join('<br>') : "No pending tasks.";
        localStorage.setItem('nexus_core', JSON.stringify(data));
    }

    function addMsg(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = text;
        agent.appendChild(div);
        agent.scrollTop = agent.scrollHeight;
    }

    function execute() {
        const input = cmdInput.value.trim();
        if(!input) return;
        
        addMsg(input, 'user');
        cmdInput.value = "";

        // Logic Router
        if (input.startsWith("task:")) {
            const task = input.replace("task:", "").trim();
            data.tasks.push(task);
            updateTasks();
            addMsg(`Task recorded: <b>${task}</b>`, 'ai');
        } else if (input.toLowerCase() === "clear tasks") {
            data.tasks = [];
            updateTasks();
            addMsg("Task list purged.", 'ai');
        } else {
            // Smart Response Simulator
            const response = input.includes("?") 
                ? "I'll analyze that. Should I search for documentation or keep this in our logs?" 
                : "Acknowledged. Data point saved to session memory.";
            setTimeout(() => addMsg(response, 'ai'), 400);
        }
    }

    function loadURL() {
        const url = document.getElementById('addr-input').value;
        document.getElementById('view').src = url.startsWith('http') ? url : 'https://' + url;
    }

    // Live Clock
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    updateTasks();
</script>
</body>
</html>
