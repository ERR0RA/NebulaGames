<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS OMEGA | Semantic AI</title>
    <style>
        :root { --neon: #00ff95; --bg: #050508; --panel: #0d0d12; --user: #00d2ff; }
        body { margin: 0; background: var(--bg); color: #eee; font-family: 'JetBrains Mono', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: var(--panel); padding: 15px 25px; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid #222; }
        #addr-bar { flex: 1; background: #000; border: 1px solid #333; color: var(--neon); padding: 12px; border-radius: 4px; outline: none; }
        .btn { background: var(--neon); color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; }

        main { display: flex; flex: 1; overflow: hidden; }
        #web-zone { flex: 2; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }
        
        #ai-sidebar { flex: 1.2; background: var(--panel); border-left: 1px solid #222; display: flex; flex-direction: column; }
        #chat-flow { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        .msg { padding: 15px; border-radius: 6px; line-height: 1.6; font-size: 0.9rem; max-width: 85%; animation: fadeIn 0.3s ease; }
        .ai { background: #14141b; border-left: 3px solid var(--neon); align-self: flex-start; }
        .user { background: #1a1a25; border-right: 3px solid var(--user); align-self: flex-end; color: var(--user); }
        .thought { color: #555; font-size: 0.7rem; display: block; margin-bottom: 8px; text-transform: uppercase; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; color: var(--neon);">NEXUS_OMEGA</div>
    <input type="text" id="addr-bar" placeholder="Ask a question or enter a URL..." autocomplete="off">
    <button class="btn" onclick="nexusRun()">EXECUTE</button>
</header>

<main>
    <div id="web-zone"><iframe id="viewport" src="about:blank"></iframe></div>
    <aside id="ai-sidebar"><div id="chat-flow"></div></aside>
</main>

<script>
    const chat = document.getElementById('chat-flow');
    const view = document.getElementById('viewport');
    const input = document.getElementById('addr-bar');

    // --- SMART BRAIN: KNOWLEDGE & CONVERSATION ---
    const BRAIN = {
        knowledge: [
            { keys: ["sky", "blue"], ans: "The sky appears blue due to Rayleigh scattering; shorter blue wavelengths scatter more in the atmosphere." },
            { keys: ["capital", "france"], ans: "The capital of France is Paris." },
            { keys: ["who", "created", "you"], ans: "I am a Nexus-series AI, built using JavaScript and HTML structure." },
            { keys: ["pi", "math"], ans: "Pi is approximately 3.14159, representing the ratio of a circle's circumference to its diameter." }
        ],
        fillers: [
            "That's a fascinating point. How does that impact your current project?",
            "I see. Tell me more about why you're thinking about that.",
            "Interesting perspective. Should we look up more data on that via the browser?",
            "I'm following you. What's the next step in this line of thought?"
        ]
    };

    function addMsg(text, type, thought = null) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = (thought ? `<span class="thought">${thought}</span>` : "") + `<div>${text}</div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function nexusRun() {
        const val = input.value.trim();
        if (!val) return;
        addMsg(val, 'user');
        input.value = "";

        if (val.includes('.') && !val.includes(' ')) {
            view.src = val.startsWith('http') ? val : 'https://' + val;
            addMsg(`Navigating to ${val}...`, "ai", "NETWORK_BRIDGE");
            return;
        }

        processSmartReply(val.toLowerCase());
    }

    function processSmartReply(query) {
        let bestMatch = null;
        let maxScore = 0;

        // 1. SCORING ENGINE (Semantic matching)
        BRAIN.knowledge.forEach(item => {
            let score = 0;
            item.keys.forEach(k => { if(query.includes(k)) score++; });
            if (score > maxScore) {
                maxScore = score;
                bestMatch = item.ans;
            }
        });

        // 2. DECISION LOGIC
        let response = "";
        let thought = "";

        if (maxScore > 0) {
            thought = "KNOWLEDGE_RETRIEVAL_SUCCESS";
            response = bestMatch;
        } else {
            thought = "CONVERSATION_CONTINUITY_MODE";
            // Picks a random filler to keep the conversation going
            response = BRAIN.fillers[Math.floor(Math.random() * BRAIN.fillers.length)];
        }

        setTimeout(() => addMsg(response, "ai", thought), 500);
    }

    addMsg("Neural links stable. Ask me a factual question or just chat with me.", "ai", "SYSTEM_READY");
    input.addEventListener("keypress", (e) => { if(e.key === "Enter") nexusRun(); });
</script>
</body>
</html>
