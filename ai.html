<!DOCTYPE html>
<html>
<head>
    <title>NEXUS-3D | Tactical HUD</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        #canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
        
        /* Minimap in the top-left corner */
        #minimap { 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            border: 2px solid #0f0; 
            background: rgba(0,0,0,0.8); 
            z-index: 10;
        }

        #ui { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-left: 4px solid #0f0; pointer-events: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,0,0,0.4); display: none; justify-content: center; align-items: center; text-align: center; z-index: 100; }
        .death-box { background: #000; padding: 40px; border: 2px solid #f00; }
        .danger { color: #f00; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <canvas id="minimap" width="140" height="140"></canvas>
    
    <div id="ui">
        <strong>NEXUS_TACTICAL_HUD</strong><br>
        STATUS: <span class="danger">ENEMIES_DETECTED</span><br>
        LIVES: <span id="lives">❤️❤️❤️</span> | HP: <span id="hp">100</span>%
    </div>

    <div id="overlay">
        <div class="death-box">
            <h1 style="color:#f00">SYSTEM BREACH</h1>
            <p id="death-msg" style="color:#fff"></p>
            <button onclick="respawn()" style="background:#0f0; color:#000; border:none; padding:10px 20px; cursor:pointer; font-weight:bold; font-family:monospace;">REINITIALIZE_SYSTEM</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const mCanvas = document.getElementById('minimap');
    const mCtx = mCanvas.getContext('2d');

    // Resolution scaling for retro look
    canvas.width = window.innerWidth / 2;
    canvas.height = window.innerHeight / 2;

    const MAP_SIZE = 20;
    let world = Array(MAP_SIZE).fill().map(() => Array(MAP_SIZE).fill(1));
    
    // Procedural Generation
    function generateMap() {
        let x = 1, y = 1;
        world[y][x] = 0;
        for(let i=0; i<400; i++) {
            let dir = Math.floor(Math.random() * 4);
            if(dir === 0 && x < MAP_SIZE-2) x++;
            else if(dir === 1 && x > 1) x--;
            else if(dir === 2 && y < MAP_SIZE-2) y++;
            else if(dir === 3 && y > 1) y--;
            world[y][x] = 0;
            if(Math.random() > 0.95) world[y][x] = 2; // Cyan Glow Blocks
        }
    }

    const state = { 
        player: { x: 1.5, y: 1.5, dir: 0, hp: 100, lives: 3 },
        enemies: [
            { x: 18, y: 18, speed: 0.012 },
            { x: 1, y: 18, speed: 0.015 },
            { x: 18, y: 1, speed: 0.013 }
        ],
        keys: {}
    };

    window.onkeydown = e => state.keys[e.code] = true;
    window.onkeyup = e => state.keys[e.code] = false;

    function handleDeath() {
        state.player.lives--;
        const msgs = ["Biological signature lost.", "Grid assimilation complete.", "User terminated by Stalker.", "Memory corruption at player_pos."];
        document.getElementById('death-msg').innerText = msgs[Math.floor(Math.random() * msgs.length)];
        document.getElementById('overlay').style.display = 'flex';
        if(state.player.lives <= 0) {
            document.querySelector('button').innerText = "FATAL_ERROR: NO_LIVES_REMAINING";
            document.querySelector('button').disabled = true;
        }
    }

    function respawn() {
        state.player.hp = 100;
        state.player.x = 1.5; state.player.y = 1.5;
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('lives').innerText = "❤️".repeat(state.player.lives);
    }

    function loop() {
        const p = state.player;
        
        // Low Sensitivity Controls
        if(state.keys['KeyW']) {
            let nx = p.x + Math.cos(p.dir) * 0.035;
            let ny = p.y + Math.sin(p.dir) * 0.035;
            if(world[Math.floor(ny)][Math.floor(nx)] === 0) { p.x = nx; p.y = ny; }
        }
        if(state.keys['KeyS']) {
            let nx = p.x - Math.cos(p.dir) * 0.025;
            let ny = p.y - Math.sin(p.dir) * 0.025;
            if(world[Math.floor(ny)][Math.floor(nx)] === 0) { p.x = nx; p.y = ny; }
        }
        if(state.keys['ArrowLeft'] || state.keys['KeyA']) p.dir -= 0.03;
        if(state.keys['ArrowRight'] || state.keys['KeyD']) p.dir += 0.03;

        // 3D Rendering Engine
        const w = canvas.width, h = canvas.height;
        ctx.fillStyle = "#000"; ctx.fillRect(0,0,w,h);
        
        for(let i=0; i<w; i++) {
            let angle = (p.dir - 0.6) + (i/w) * 1.2;
            let dist = 0, hit = false, type = 0;
            let sx = Math.cos(angle), sy = Math.sin(angle);
            while(!hit && dist < 16) {
                dist += 0.1;
                let tx = Math.floor(p.x + sx * dist), ty = Math.floor(p.y + sy * dist);
                if(world[ty] && world[ty][tx] > 0) { hit = true; type = world[ty][tx]; }
            }
            let wallH = h / (dist * Math.cos(angle - p.dir));
            ctx.fillStyle = type === 2 ? "#0ff" : `rgb(0,${180/dist},0)`;
            ctx.fillRect(i, h/2 - wallH/2, 1, wallH);
        }

        // AI Stalkers
        state.enemies.forEach(en => {
            let dx = p.x - en.x, dy = p.y - en.y;
            let d = Math.sqrt(dx*dx + dy*dy);
            if(d < 0.45) {
                p.hp -= 0.8;
                if(p.hp <= 0) handleDeath();
            } else {
                en.x += (dx/d) * en.speed;
                en.y += (dy/d) * en.speed;
            }
        });

        // Minimap Drawing
        mCtx.clearRect(0,0,140,140);
        let s = 140/MAP_SIZE;
        for(let y=0; y<MAP_SIZE; y++) {
            for(let x=0; x<MAP_SIZE; x++) {
                if(world[y][x] > 0) {
                    mCtx.fillStyle = world[y][x] === 2 ? "#0ff" : "#222";
                    mCtx.fillRect(x*s, y*s, s-1, s-1);
                }
            }
        }
        mCtx.fillStyle = "#fff"; mCtx.fillRect(p.x*s-2, p.y*s-2, 4, 4); // Player
        mCtx.fillStyle = "#f00"; state.enemies.forEach(en => mCtx.fillRect(en.x*s-2, en.y*s-2, 4, 4)); // AI

        document.getElementById('hp').innerText = Math.max(0, Math.floor(p.hp));
        if(p.lives > 0) requestAnimationFrame(loop);
    }

    generateMap();
    loop();
</script>
</body>
</html>
