<!DOCTYPE html>
<html>
<head>
    <title>NEXUS-3D | Advanced AI</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        #container { display: flex; width: 100vw; height: 100vh; }
        canvas { width: 50%; height: 100%; border-right: 1px solid #333; image-rendering: pixelated; }
        
        /* Minimap in Top Left Corner */
        #minimap { 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            border: 2px solid #0f0; 
            background: rgba(0,0,0,0.9); 
            z-index: 20; 
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; z-index: 100; }
        .menu-box { border: 2px solid #0f0; padding: 40px; text-align: center; }
        .btn { background: #0f0; color: #000; border: none; padding: 15px 30px; margin: 10px; cursor: pointer; font-weight: bold; width: 250px; }
        
        #hud { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; z-index: 10; }
        .stats { background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #0f0; }
    </style>
</head>
<body>

    <div id="container">
        <canvas id="p1Cam"></canvas>
        <canvas id="p2Cam"></canvas>
    </div>
    
    <canvas id="minimap" width="130" height="130"></canvas>

    <div id="main-menu" class="overlay">
        <div class="menu-box">
            <h1>NEXUS_AI_EVOLUTION</h1>
            <button class="btn" onclick="init('3v2')">3 BOTS VS 2 PLAYERS</button><br>
            <button class="btn" onclick="init('bot')">SOLO SURVIVAL</button>
            <p style="color:#555; font-size: 0.8rem;">MAP POS: TOP_LEFT_CORNER | AI: WALL_COLLISION_ACTIVE</p>
        </div>
    </div>

    <div id="hud" style="display:none">
        <div class="stats">P1: <span id="p1hp">100</span>%</div>
        <div class="stats">P2: <span id="p2hp">100</span>%</div>
    </div>

<script>
    const p1c = document.getElementById('p1Cam'), ctx1 = p1c.getContext('2d');
    const p2c = document.getElementById('p2Cam'), ctx2 = p2c.getContext('2d');
    const mCtx = document.getElementById('minimap').getContext('2d');

    const SIZE = 25; 
    let world = [], active = false, mode = '';
    const keys = {};

    const p1 = { x: 1.5, y: 1.5, dir: 0, hp: 100, active: true };
    const p2 = { x: SIZE-1.5, y: SIZE-1.5, dir: Math.PI, hp: 100, active: false };
    let bots = [];

    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function generateMaze() {
        world = Array(SIZE).fill().map(() => Array(SIZE).fill(1));
        function walk(x, y) {
            world[y][x] = 0;
            let dirs = [[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-0.5);
            for(let [dx,dy] of dirs) {
                let nx=x+dx, ny=y+dy;
                if(nx>0 && nx<SIZE && ny>0 && ny<SIZE && world[ny][nx]==1) {
                    world[y+dy/2][x+dx/2]=0; walk(nx,ny);
                }
            }
        }
        walk(1,1);
    }

    function init(m) {
        mode = m;
        generateMaze();
        p1.hp = 100; p2.hp = 100;
        p2.active = (mode === '3v2');
        p2c.style.display = p2.active ? 'block' : 'none';
        p1c.style.width = p2.active ? '50%' : '100%';

        bots = [
            {x: 12.5, y: 12.5, s: 0.02, vx: 0, vy: 0, lastCheck: 0},
            {x: SIZE-2.5, y: 2.5, s: 0.02, vx: 0, vy: 0, lastCheck: 0},
            {x: 2.5, y: SIZE-2.5, s: 0.02, vx: 0, vy: 0, lastCheck: 0}
        ];

        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        active = true;
        resize(); loop();
    }

    function resize() {
        p1c.width = p1c.clientWidth/2; p1c.height = p1c.clientHeight/2;
        p2c.width = p2c.clientWidth/2; p2c.height = p2c.clientHeight/2;
    }

    function drawView(ctx, p, canvas) {
        const w = canvas.width, h = canvas.height;
        ctx.fillStyle="#000"; ctx.fillRect(0,0,w,h);
        let zBuf = new Array(w).fill(20);

        for(let i=0; i<w; i++) {
            let a = (p.dir - 0.6) + (i/w)*1.2;
            let d = 0, hit = false, sx = Math.cos(a), sy = Math.sin(a);
            while(!hit && d < 14) {
                d += 0.08;
                let tx = Math.floor(p.x + sx*d), ty = Math.floor(p.y + sy*d);
                if(world[ty] && world[ty][tx]==1) hit = true;
            }
            zBuf[i] = d;
            let wallH = h / (d * Math.cos(a - p.dir));
            ctx.fillStyle = `rgb(0,${180/d},50)`;
            ctx.fillRect(i, h/2-wallH/2, 1, wallH);
        }

        bots.forEach(b => {
            let dx = b.x - p.x, dy = b.y - p.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            let a = Math.atan2(dy, dx) - p.dir;
            while(a < -Math.PI) a += Math.PI*2; while(a > Math.PI) a -= Math.PI*2;
            if(Math.abs(a) < 0.6) {
                let sx = (a + 0.6)/1.2 * w;
                let sh = h / dist;
                if(dist < zBuf[Math.floor(sx)]) {
                    ctx.fillStyle = "#f00"; // Bots are visible as red pillars
                    ctx.fillRect(sx - sh/6, h/2 - sh/2, sh/3, sh);
                }
            }
        });
    }

    function loop() {
        if(!active) return;
        
        // Player 1: WASD
        if(keys['KeyW']) { let nx=p1.x+Math.cos(p1.dir)*0.035, ny=p1.y+Math.sin(p1.dir)*0.035; if(!world[Math.floor(ny)][Math.floor(nx)]) {p1.x=nx; p1.y=ny;} }
        if(keys['KeyS']) { let nx=p1.x-Math.cos(p1.dir)*0.025, ny=p1.y-Math.sin(p1.dir)*0.025; if(!world[Math.floor(ny)][Math.floor(nx)]) {p1.x=nx; p1.y=ny;} }
        if(keys['KeyA']) p1.dir -= 0.035; if(keys['KeyD']) p1.dir += 0.035;

        // Player 2: Arrows
        if(p2.active) {
            if(keys['ArrowUp']) { let nx=p2.x+Math.cos(p2.dir)*0.035, ny=p2.y+Math.sin(p2.dir)*0.035; if(!world[Math.floor(ny)][Math.floor(nx)]) {p2.x=nx; p2.y=ny;} }
            if(keys['ArrowDown']) { let nx=p2.x-Math.cos(p2.dir)*0.025, ny=p2.y-Math.sin(p2.dir)*0.025; if(!world[Math.floor(ny)][Math.floor(nx)]) {p2.x=nx; p2.y=ny;} }
            if(keys['ArrowLeft']) p2.dir -= 0.035; if(keys['ArrowRight']) p2.dir += 0.035;
        }

        // HUMAN-LIKE BOT AI: No Wall-Clipping
        bots.forEach(b => {
            let target = p1;
            if(p2.active && Math.hypot(p2.x-b.x, p2.y-b.y) < Math.hypot(p1.x-b.x, p1.y-b.y)) target = p2;
            
            let dx = target.x - b.x, dy = target.y - b.y;
            let dist = Math.hypot(dx, dy);

            // AI Logic: Attempt to move towards player, but stop at walls
            if (dist < 0.45) {
                target.hp -= 0.4;
                if(target.hp <= 0) location.reload();
            } else {
                let moveX = (dx/dist) * b.s;
                let moveY = (dy/dist) * b.s;

                // Human-like hesitation: Occasionally try a different angle if blocked
                if (world[Math.floor(b.y + moveY)][Math.floor(b.x + moveX)]) {
                    // Try sliding along X or Y instead of stopping completely
                    if (!world[Math.floor(b.y)][Math.floor(b.x + moveX)]) { b.x += moveX; }
                    else if (!world[Math.floor(b.y + moveY)][Math.floor(b.x)]) { b.y += moveY; }
                } else {
                    b.x += moveX;
                    b.y += moveY;
                }
            }
        });

        drawView(ctx1, p1, p1c);
        if(p2.active) drawView(ctx2, p2, p2c);

        // UI & Minimap Update
        document.getElementById('p1hp').innerText = Math.floor(p1.hp);
        document.getElementById('p2hp').innerText = Math.floor(p2.hp);
        
        mCtx.clearRect(0,0,130,130);
        let s = 130/SIZE;
        for(let y=0; y<SIZE; y++) for(let x=0; x<SIZE; x++) if(world[y][x]) { mCtx.fillStyle="#222"; mCtx.fillRect(x*s,y*s,s,s); }
        mCtx.fillStyle="#0f0"; mCtx.fillRect(p1.x*s-1, p1.y*s-1, 3, 3);
        if(p2.active) { mCtx.fillStyle="#0af"; mCtx.fillRect(p2.x*s-1, p2.y*s-1, 3, 3); }
        mCtx.fillStyle="#f00"; bots.forEach(b => mCtx.fillRect(b.x*s-1, b.y*s-1, 3, 3));

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
