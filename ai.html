<!DOCTYPE html>
<html>
<head>
    <title>NEXUS-3D | The Escape</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        #container { display: flex; width: 100vw; height: 100vh; }
        canvas.view { width: 100%; height: 100%; image-rendering: pixelated; display: none; }
        #p2Cam { border-left: 2px solid #222; }
        
        #minimap { 
            position: absolute; top: 15px; left: 15px; 
            border: 1px solid #0f0; background: rgba(0,0,0,0.9); z-index: 30; 
            display: none;
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; z-index: 100; }
        .menu-box { border: 2px solid #0f0; padding: 30px; text-align: center; background: #050505; }
        .btn { background: #0f0; color: #000; border: none; padding: 12px 25px; margin: 8px; cursor: pointer; font-weight: bold; width: 240px; display: block; }
        
        #hud { position: absolute; bottom: 15px; width: 100%; display: none; justify-content: space-around; pointer-events: none; }
        .hp-bar { background: rgba(0,0,0,0.8); padding: 5px 15px; border: 1px solid #0f0; font-size: 0.8rem; }
        #alert { position: absolute; top: 100px; width: 100%; text-align: center; color: #f00; font-weight: bold; display: none; z-index: 50; }
    </style>
</head>
<body>

    <div id="alert">WARNING: ADDITIONAL THREAT DETECTED</div>
    <div id="container">
        <canvas id="p1Cam" class="view"></canvas>
        <canvas id="p2Cam" class="view"></canvas>
    </div>
    
    <canvas id="minimap" width="100" height="100"></canvas>

    <div id="main-menu" class="overlay">
        <div class="menu-box">
            <h1>NEXUS_ESCAPE</h1>
            <button class="btn" onclick="init('bot')">3v1 SURVIVAL</button>
            <button class="btn" onclick="init('pvp')">PVP TAG</button>
            <button class="btn" onclick="init('duo')">DUO SURVIVAL</button>
            <p style="color:#444; font-size: 0.7rem; margin-top:10px;">EXIT: BOTTOM RIGHT [CYAN]</p>
        </div>
    </div>

    <div id="hud">
        <div class="hp-bar">P1: <span id="p1hp">100</span>%</div>
        <div id="p2-stats" class="hp-bar" style="display:none">P2: <span id="p2hp">100</span>%</div>
    </div>

<script>
    const p1c = document.getElementById('p1Cam'), ctx1 = p1c.getContext('2d');
    const p2c = document.getElementById('p2Cam'), ctx2 = p2c.getContext('2d');
    const mCtx = document.getElementById('minimap').getContext('2d');

    const SIZE = 17; // Longer Maze
    let world = [];
    let active = false, gameMode = '', fourthBotSpawned = false;
    const keys = {};

    const p1 = { x: 1.5, y: 1.5, dir: 0, hp: 100 };
    const p2 = { x: 1.5, y: 2.5, dir: 0, hp: 100 };
    let bots = [];

    window.onkeydown = e => keys[e.code] = true;
    window.onkeyup = e => keys[e.code] = false;

    function generateMaze() {
        world = Array(SIZE).fill().map(() => Array(SIZE).fill(1));
        function walk(x, y) {
            world[y][x] = 0;
            let dirs = [[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-0.5);
            for(let [dx,dy] of dirs) {
                let nx=x+dx, ny=y+dy;
                if(nx>0 && nx<SIZE && ny>0 && ny<SIZE && world[ny][nx]==1) {
                    world[y+dy/2][x+dx/2]=0; walk(nx,ny);
                }
            }
        }
        walk(1,1);
        world[SIZE-2][SIZE-2] = 2; // Exit Block
    }

    function init(m) {
        gameMode = m;
        generateMaze();
        active = true;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('minimap').style.display = 'block';
        
        p1c.style.display = 'block';
        if(m === 'duo' || m === 'pvp') {
            p2c.style.display = 'block';
            p1c.style.width = '50%';
            document.getElementById('p2-stats').style.display = 'block';
        } else {
            p1c.style.width = '100%';
        }
        
        bots = [
            {x: SIZE-2.5, y: 1.5, s: 0.015},
            {x: 1.5, y: SIZE-2.5, s: 0.018},
            {x: SIZE-2.5, y: SIZE-5.5, s: 0.012}
        ];

        resize(); loop();
    }

    function resize() {
        p1c.width = p1c.clientWidth/2; p1c.height = p1c.clientHeight/2;
        p2c.width = p2c.clientWidth/2; p2c.height = p2c.clientHeight/2;
    }

    function render(ctx, p, canvas) {
        const w = canvas.width, h = canvas.height;
        ctx.fillStyle="#000"; ctx.fillRect(0,0,w,h);
        let zBuf = new Array(w).fill(20);

        for(let i=0; i<w; i++) {
            let a = (p.dir - 0.6) + (i/w)*1.2;
            let d = 0, hit = false, type = 1, sx = Math.cos(a), sy = Math.sin(a);
            while(!hit && d < 15) {
                d += 0.08;
                let tx = Math.floor(p.x + sx*d), ty = Math.floor(p.y + sy*d);
                if(world[ty] && world[ty][tx] > 0) { hit = true; type = world[ty][tx]; }
            }
            zBuf[i] = d;
            let wallH = h / (d * Math.cos(a - p.dir));
            ctx.fillStyle = type === 2 ? "#0ff" : `rgb(0,${150/d},0)`;
            ctx.fillRect(i, h/2-wallH/2, 1, wallH);
        }

        bots.forEach(b => {
            let dx = b.x - p.x, dy = b.y - p.y, dist = Math.hypot(dx, dy);
            let a = Math.atan2(dy, dx) - p.dir;
            while(a < -Math.PI) a += Math.PI*2; while(a > Math.PI) a -= Math.PI*2;
            if(Math.abs(a) < 0.6) {
                let sx = (a + 0.6)/1.2 * w, sh = h / dist;
                if(dist < zBuf[Math.floor(sx)]) {
                    ctx.fillStyle = "#f00";
                    ctx.fillRect(sx - sh/8, h/2 - sh/2, sh/4, sh);
                }
            }
        });
    }

    function loop() {
        if(!active) return;
        
        // P1 Controls
        if(keys['KeyW']) { let nx=p1.x+Math.cos(p1.dir)*0.035, ny=p1.y+Math.sin(p1.dir)*0.035; if(!world[Math.floor(ny)][Math.floor(nx)]) {p1.x=nx; p1.y=ny;} }
        if(keys['KeyS']) { let nx=p1.x-Math.cos(p1.dir)*0.02, ny=p1.y-Math.sin(p1.dir)*0.02; if(!world[Math.floor(ny)][Math.floor(nx)]) {p1.x=nx; p1.y=ny;} }
        if(keys['KeyA']) p1.dir -= 0.04; if(keys['KeyD']) p1.dir += 0.04;

        // Check Exit
        if(world[Math.floor(p1.y)][Math.floor(p1.x)] === 2) { alert("EXIT REACHED!"); location.reload(); }

        // Dynamic 4th Bot Trigger
        if(!fourthBotSpawned && (p1.x + p1.y > SIZE * 1.4)) {
            fourthBotSpawned = true;
            bots.push({x: SIZE-2.5, y: SIZE-2.5, s: 0.025});
            document.getElementById('alert').style.display = 'block';
            setTimeout(() => document.getElementById('alert').style.display = 'none', 3000);
        }

        // AI Logic: No Wall Clipping
        bots.forEach(b => {
            let dx = p1.x - b.x, dy = p1.y - b.y, dist = Math.hypot(dx, dy);
            if(dist < 0.45) { p1.hp -= 0.5; if(p1.hp <= 0) location.reload(); }
            else {
                let mx = (dx/dist)*b.s, my = (dy/dist)*b.s;
                // Human-like collision check
                if(!world[Math.floor(b.y + my)][Math.floor(b.x + mx)]) { b.x += mx; b.y += my; }
                else if(!world[Math.floor(b.y)][Math.floor(b.x + mx)]) { b.x += mx; }
                else if(!world[Math.floor(b.y + my)][Math.floor(b.x)]) { b.y += my; }
            }
        });

        render(ctx1, p1, p1c);
        if(gameMode !== 'bot') render(ctx2, p2, p2c);

        document.getElementById('p1hp').innerText = Math.floor(p1.hp);
        
        // Minimap
        mCtx.clearRect(0,0,100,100);
        let s = 100/SIZE;
        for(let y=0; y<SIZE; y++) for(let x=0; x<SIZE; x++) {
            if(world[y][x]==1) mCtx.fillStyle="#222";
            else if(world[y][x]==2) mCtx.fillStyle="#0ff";
            else continue;
            mCtx.fillRect(x*s,y*s,s,s);
        }
        mCtx.fillStyle="#0f0"; mCtx.fillRect(p1.x*s-1, p1.y*s-1, 3, 3);
        mCtx.fillStyle="#f00"; bots.forEach(b => mCtx.fillRect(b.x*s-1, b.y*s-1, 2, 2));

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
