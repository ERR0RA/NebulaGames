<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Life: Mega Sandbox Pro</title>
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: #0f172a;
            --accent-color: #c084fc; 
            --accent-glow: #a855f7;
            --success-color: #34d399;
            --danger-color: #f87171;
            --warning-color: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .game-container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 15px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(2, 6, 23, 0.7);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 2px;
        }

        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        .input-group input, .input-group select {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
        }

        .log-container {
            background: rgba(2, 6, 23, 0.9);
            border-radius: 16px;
            padding: 18px;
            height: 220px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid rgba(168, 85, 247, 0.15);
        }

        .current-event {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        .actions-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            background: linear-gradient(135deg, #c084fc 0%, #7e22ce 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }

        button:hover {
            filter: brightness(1.15);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
        }

        button.choice-btn {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        button.choice-btn:hover {
            background: #334155;
            box-shadow: none;
        }

        button.danger-btn {
            background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
        }

        .badge {
            background: rgba(192, 132, 252, 0.2);
            color: var(--accent-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            display: inline-block;
            margin-top: 4px;
            border: 1px solid rgba(192, 132, 252, 0.3);
        }

        .save-banner {
            font-size: 0.75rem;
            color: var(--success-color);
            text-align: center;
            margin-bottom: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .neg { color: var(--danger-color); font-weight: bold; }
        .pos { color: var(--success-color); font-weight: bold; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="save-banner" id="save-notif">✓ Quantum State Saved</div>
        <header>
            <h1>QUANTUM LIFE</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">The Extended Reality Sandbox</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Identity Core</div>
                <div class="stat-value" id="stat-identity">Awaiting Setup...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Net Worth</div>
                <div class="stat-value" id="stat-money">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Physical Form</div>
                <div class="stat-value" id="stat-health">100%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Mental Framework</div>
                <div class="stat-value" id="stat-mental">100%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Credit Rating</div>
                <div class="stat-value" id="stat-credit">650</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Crypto Node</div>
                <div class="stat-value" id="stat-crypto">0 BTC</div>
            </div>
            <div class="stat-card" style="grid-column: span 2;">
                <div class="stat-label">Assets, Career, & Network</div>
                <div class="stat-value" id="stat-job" style="font-size: 0.85rem;">Unregistered Reality Slot</div>
                <div id="asset-badges"></div>
            </div>
        </div>

        <div class="log-container">
            <div class="current-event" id="event-text">Construct your consciousness vectors below to begin...</div>
        </div>

        <div class="actions-container" id="action-space"></div>
    </div>

    <script>
        let life = {
            name: "Unknown",
            gender: "Unassigned",
            age: 18,
            money: 1500,
            health: 100,
            mental: 100,
            credit: 650,
            crypto: 0,
            careerTrack: "none",
            status: "High School Graduate",
            experience: 0,
            hasApartment: false,
            hasPenthouse: false,
            hasCar: false,
            hasSupercar: false,
            hasGymMembership: false,
            hasInsurance: false,
            hasHardwareWallet: false,
            isMarried: false,
            childrenNames: [],
            degreeEarned: false,
            initialized: false
        };

        const textDisplay = document.getElementById('event-text');
        const actionsDisplay = document.getElementById('action-space');
        const saveNotif = document.getElementById('save-notif');

        const childFirstNames = ["Zion", "Luna", "Kai", "Nova", "Atlas", "Aria", "Miles", "Maya", "Leo", "Ivy", "Eden", "Jax"];

        const matrixEvents = [
            { text: "Global inflation spikes hyper-market costs across all utilities and regional asset sectors.", money: -1200, health: 0, mental: -8, credit: -5 },
            { text: "Identity Hack! Malicious dark-web actors breach a data center and copy your card records.", money: -400, health: 0, mental: -20, credit: -40 },
            { text: "A coordinate squeeze on popular shorted assets allows you a quick tech swing-trade flip.", money: 4500, health: 0, mental: 15, credit: 0 },
            { text: "Slipped on an oily mechanical bay platform and sustained severe ligament displacement.", money: -2500, health: -30, mental: -15, credit: 0, needsInsuranceShield: true },
            { text: "Tax Optimization! An algorithmic system flags code exceptions allowing a heavy refund writeoff.", money: 1400, health: 0, mental: 10, credit: 20 },
            { text: "Burnout Threshold Breached. System maintenance recommended to clear residual operational lag.", money: 0, health: -8, mental: -30, credit: 0 },
            { text: "Dynamic structural updates flip cryptocurrency valuations upward unexpectedly.", cryptoPump: true },
            { text: "Flash-crash liquidation cascade flattens decentralized tokens across key nodes.", cryptoCrash: true },
            { text: "Exceeded high-velocity traffic regulations via automated radar trap. Automated penal code logged.", money: -350, health: 0, mental: -5, credit: -10 },
            { text: "Sourced high-tier clean micro-nutrients and optimization routines.", money: -500, health: 20, mental: 15, credit: 0 },
            { text: "Dental extraction emergency arises via an impacted root nerve.", money: -1100, health: -10, mental: -10, credit: 0, needsInsuranceShield: true },
            { text: "A variable interest-bearing account pays out historical liquidity yield drops.", money: 1800, health: 0, mental: 5, credit: 15 },
            { text: "Cyberphishing actors replicate your digital security keys. Panic cleanups required.", money: -200, health: 0, mental: -15, credit: -25 },
            { text: "Landlords raise local baseline space metrics by 12% due to corporate zoning changes.", money: -750, health: 0, mental: -10, credit: 0 },
            { text: "Isolated system reboot: Spent a week in an off-grid cyber-detox dome.", money: -400, health: 12, mental: 30, credit: 0 },
            { text: "An ancient cold-wallet archive you found contains forgotten micro-fraction keys.", money: 2000, health: 0, mental: 8, credit: 0 },
            { text: "Heavy rain causes a toxic mold variant to breach your local living cell walls.", money: -900, health: -15, mental: -12, credit: 0 },
            { text: "A massive tech conglomerate purchases a tiny domain name you registered years ago.", money: 6000, health: 0, mental: 20, credit: 0 },
            { text: "Your local energy provider charges an off-peak infrastructure surge adjustment.", money: -350, health: 0, mental: -5, credit: 0 },
            { text: "A deep learning algorithm tool you set up generates automated micropayment royalties.", money: 800, health: 0, mental: 5, credit: 5 }
        ];

        function saveGame() {
            localStorage.setItem('quantum_life_mega_save', JSON.stringify(life));
            saveNotif.style.opacity = '1';
            setTimeout(() => saveNotif.style.opacity = '0', 2000);
        }

        function loadGame() {
            const savedData = localStorage.getItem('quantum_life_mega_save');
            if (savedData) {
                life = JSON.parse(savedData);
                if(life.initialized) {
                    textDisplay.innerText = `Data link stable. Welcome back, ${life.name} (${life.gender}). Current Age: ${life.age}.`;
                    renderStats();
                    buildMainControls();
                    return;
                }
            }
            initIdentityForm();
        }

        function initIdentityForm() {
            textDisplay.innerText = "PROMPT: Enter baseline bio-parameters to materialize your sandbox identity.";
            actionsDisplay.innerHTML = `
                <div class="input-group">
                    <label>Designated Subject Name</label>
                    <input type="text" id="init-name" placeholder="Type name here..." value="Casey">
                </div>
                <div class="input-group">
                    <label>Gender Manifestation Matrix</label>
                    <select id="init-gender">
                        <option value="Male">Male Vector</option>
                        <option value="Female">Female Vector</option>
                        <option value="Non-Binary">Non-Binary Node</option>
                        <option value="Fluid Spectrum">Fluid Spectrum</option>
                        <option value="Bio-AI Hybrid">Bio-AI Hybrid</option>
                    </select>
                </div>
                <button onclick="submitIdentity()">Bind Blueprint & Initialize Sandbox</button>
            `;
        }

        function submitIdentity() {
            const chosenName = document.getElementById('init-name').value.trim();
            const chosenGender = document.getElementById('init-gender').value;
            
            life.name = chosenName ? chosenName : "Subject-Alpha";
            life.gender = chosenGender;
            life.initialized = true;

            initNewLife();
            renderStats();
        }

        function initNewLife() {
            textDisplay.innerText = `Matrix Compiled. Subject: ${life.name}.\nYou stand outside holding a high school diploma. Capital reserves: minimal. Sandbox choices: absolute. Pick your first baseline track:`;
            actionsDisplay.innerHTML = `
                <button onclick="selectPath('tech')">Quantum Computing Engineering (-$8,000/yr)</button>
                <button onclick="selectPath('medical')">Nanotech Bio-Surgery Track (-$12,000/yr)</button>
                <button onclick="selectPath('crypto_grind')">Algorithmic Trade & Freelance Grind</button>
            `;
            saveGame();
        }

        function renderStats() {
            if (!life.initialized) return;
            document.getElementById('stat-identity').innerText = `${life.name}\nAge ${life.age} | ${life.gender}`;
            document.getElementById('stat-money').innerText = `$${life.money.toLocaleString()}`;
            document.getElementById('stat-health').innerText = `${life.health}%`;
            document.getElementById('stat-mental').innerText = `${life.mental}%`;
            document.getElementById('stat-credit').innerText = life.credit;
            document.getElementById('stat-crypto').innerText = `${life.crypto.toFixed(4)} BTC`;
            document.getElementById('stat-job').innerText = life.status;

            let badgesHTML = '';
            if (life.hasApartment) badgesHTML += '<span class="badge">🏠 Studio Zone Lease</span> ';
            if (life.hasPenthouse) badgesHTML += '<span class="badge">🏙️ Sky-Rise Penthouse</span> ';
            if (life.hasCar) badgesHTML += '<span class="badge">🚗 Standard Transit Vehicle</span> ';
            if (life.hasSupercar) badgesHTML += '<span class="badge">🏎️ Electric Supercar</span> ';
            if (life.hasGymMembership) badgesHTML += '<span class="badge">💪 Bio-Optimization Hub Member</span> ';
            if (life.hasInsurance) badgesHTML += '<span class="badge">🛡️ Premium Matrix Coverage</span> ';
            if (life.hasHardwareWallet) badgesHTML += '<span class="badge">🔑 Safe Ledger Vault</span> ';
            if (life.isMarried) badgesHTML += '<span class="badge">💍 Life Partner Synced</span> ';
            
            if (life.childrenNames.length > 0) {
                badgesHTML += `<span class="badge">👶 Progeny Links: ${life.childrenNames.join(', ')}</span>`;
            }
            document.getElementById('asset-badges').innerHTML = badgesHTML;

            if (life.health <= 0 || life.mental <= 0) {
                triggerGameOver("Biological Desynchronization: Core physical or mental parameters flatlined to 0%.");
            } else if (life.money < -40000) {
                triggerGameOver("Complete Liquidation: Total unsecured liability margins surpassed debt safety buffers.");
            }
        }

        function selectPath(track) {
            life.careerTrack = track;
            if (track === 'tech') life.status = "Computational Systems Scholar";
            if (track === 'medical') life.status = "Molecular Bio-Med Student";
            if (track === 'crypto_grind') life.status = "Independent High-Frequency Trader / Hustler";
            
            saveGame();
            renderStats();
            buildMainControls();
        }

        function buildMainControls() {
            actionsDisplay.innerHTML = `
                <button onclick="advanceTimeline('grind')">High-Intensity Sprint / Grind (+1 Year)</button>
                <button class="choice-btn" onclick="advanceTimeline('balance')">System Equilibrium & Rest (+1 Year)</button>
                <button class="choice-btn" onclick="openMarket()">Commercial Asset Marketplace</button>
                <button class="choice-btn" onclick="openSocial()">Interpersonal Networking Matrix</button>
                <button class="danger-btn" style="margin-top:10px; padding:6px; font-size:0.75rem;" onclick="hardReset()">Wipe Timeline Matrix</button>
            `;
        }

        function openMarket() {
            textDisplay.innerText = "MARKET MATRIX: Convert liquidity into core properties, assets, security insurance shields, or crypto arrays.";
            actionsDisplay.innerHTML = `
                <button class="choice-btn" onclick="purchaseAsset('apartment', 6000)">Lease Standard Micro-Unit (-$6,000)</button>
                <button class="choice-btn" onclick="purchaseAsset('penthouse', 50000)">Acquire Sky-Rise Penthouse Core (-$50,000)</button>
                <button class="choice-btn" onclick="purchaseAsset('car', 8000)">Purchase Utility Commuter Car (-$8,000)</button>
                <button class="choice-btn" onclick="purchaseAsset('supercar', 90000)">Deploy High-Velocity Supercar (-$90,000)</button>
                <button class="choice-btn" onclick="purchaseAsset('hardware_wallet', 1500)">Secure Hardware Ledger Shield (-$1,500)</button>
                <button class="choice-btn" onclick="purchaseAsset('gym', 600)">Unlock Wellness Hub Access (-$600)</button>
                <button class="choice-btn" onclick="purchaseAsset('insurance', 2500)">Acquire Health Matrix Protection Plan (-$2,500/yr)</button>
                <button class="choice-btn" onclick="purchaseAsset('crypto', 2000)">Inject $2,000 into Volatile Crypto Blocks</button>
                <button onclick="buildMainControls()">← Return to Main Controls</button>
            `;
        }

        function openSocial() {
            textDisplay.innerText = "SOCIAL MODULE: Manage emotional networks and partnerships. Dynamic activities carry a randomized chance of generating a child entry.";
            actionsDisplay.innerHTML = `
                <button class="choice-btn" onclick="socialAction('date')">Deploy High-End Outing Framework (-$600)</button>
                <button class="choice-btn" onclick="socialAction('marry')">Initialize Marriage Registry Covenant (-$6,000 Ring)</button>
                <button onclick="buildMainControls()">← Return to Main Controls</button>
            `;
        }

        function purchaseAsset(item, cost) {
            if (life.money < cost) {
                textDisplay.innerText = "Transaction Error: Insufficient operational credit liquidity.";
                return;
            }
            
            if (item === 'apartment' && !life.hasApartment) { life.hasApartment = true; life.money -= cost; life.credit += 50; }
            else if (item === 'penthouse' && !life.hasPenthouse) { life.hasPenthouse = true; life.money -= cost; life.credit += 150; life.mental = Math.min(100, life.mental + 20); }
            else if (item === 'car' && !life.hasCar) { life.hasCar = true; life.money -= cost; }
            else if (item === 'supercar' && !life.hasSupercar) { life.hasSupercar = true; life.money -= cost; life.mental = Math.min(100, life.mental + 30); }
            else if (item === 'hardware_wallet' && !life.hasHardwareWallet) { life.hasHardwareWallet = true; life.money -= cost; }
            else if (item === 'gym' && !life.hasGymMembership) { life.hasGymMembership = true; life.money -= cost; life.health = Math.min(100, life.health + 15); }
            else if (item === 'insurance' && !life.hasInsurance) { life.hasInsurance = true; life.money -= cost; }
            else if (item === 'crypto') {
                life.money -= 2000;
                let multiplier = life.hasHardwareWallet ? 1.05 : 1.0; 
                life.crypto += (0.045 + (Math.random() * 0.03)) * multiplier;
                textDisplay.innerText = "Crypto balance ledger blocks refreshed successfully.";
            } else {
                textDisplay.innerText = "Conflict: Target registry parameters already occupied.";
                return;
            }
            renderStats();
            saveGame();
            openMarket();
        }

        function generateRandomChild() {
            let lastName = life.name.split(" ")[1] || "Matrix";
            let randomFirst = childFirstNames[Math.floor(Math.random() * childFirstNames.length)];
            let fullChildName = `${randomFirst} ${lastName}`;
            life.childrenNames.push(fullChildName);
            return fullChildName;
        }

        function socialAction(action) {
            if (action === 'date') {
                if (life.money >= 600) { 
                    life.money -= 600; 
                    life.mental = Math.min(100, life.mental + 25); 
                    
                    let logStr = "Social interactions cross-referenced. Psychological parameters cleared and optimized.";
                    // 18% randomized chance for child birth roll event on open socialization tracks
                    if (Math.random() < 0.18) {
                        let babyName = generateRandomChild();
                        logStr += `\n\n👶 <span class="pos">[PROGENY VENTURE]:</span> Dynamic variables linked! An unexpected child has born into your lineage. Registry assigned: <b>${babyName}</b>. Annual upkeep costs added.`;
                    }
                    textDisplay.innerHTML = logStr;
                } else {
                    textDisplay.innerText = "Insuffient credit parameters for high-tier dates.";
                }
            } else if (action === 'marry') {
                if (life.money >= 6000 && !life.isMarried) { 
                    life.isMarried = true; 
                    life.money -= 6000; 
                    life.mental = Math.min(100, life.mental + 35); 
                    life.credit += 60;
                    textDisplay.innerText = "Covenant established! Shared financial asset pools and tax shielding protocols synchronized."; 
                } else {
                    textDisplay.innerText = "Unable to process. You either lack $6,000 or hold a marriage registry flag already.";
                }
            }
            renderStats();
            saveGame();
        }

        function advanceTimeline(pace) {
            life.age += 1;
            life.experience += 1;

            let upkeepCost = 4500;
            if (life.hasApartment) upkeepCost += 9000;
            if (life.hasPenthouse) upkeepCost += 24000;
            if (life.hasCar) upkeepCost += 3000;
            if (life.hasSupercar) upkeepCost += 7500;
            if (life.hasGymMembership) upkeepCost += 700;
            if (life.childrenNames.length > 0) upkeepCost += (life.childrenNames.length * 5500); 
            life.money -= upkeepCost;

            let logResult = `Calculated lifestyle operational maintenance subtraction: -$${upkeepCost.toLocaleString()}.\n`;

            // Randomized child rolling framework for married states (25% naturally occurs each timeline step)
            if (life.isMarried && Math.random() < 0.25) {
                let babyName = generateRandomChild();
                logResult += `👶 <span class="pos">[FAMILY LOG]:</span> Your life partner finalized an addition to your home unit. Progeny registered: <b>${babyName}</b>.\n`;
            }

            if (pace === 'grind') {
                life.health -= life.hasGymMembership ? 5 : 14; 
                life.mental -= 20;
                life.credit = Math.min(850, life.credit + 25);

                if (life.careerTrack === 'tech') {
                    if (life.experience >= 4 && !life.degreeEarned) {
                        life.degreeEarned = true;
                        life.status = "Lead Quantum Systems Architect";
                        logResult += "Academic core completed! Appointed to a top-tier algorithmic cloud architecture firm.\n";
                    } else if (life.degreeEarned) {
                        life.money += 135000;
                        logResult += "Quantum systems engineering payroll node dropped: +$135,000.\n";
                    } else {
                        life.money -= 8000;
                        logResult += "Disbursed technical university asset payments.\n";
                    }
                }
                else if (life.careerTrack === 'medical') {
                    if (life.experience >= 7 && !life.degreeEarned) {
                        life.degreeEarned = true;
                        life.status = "Chief Robotics Micro-Surgeon";
                        logResult += "Medical residency validation logged! High-yield automated operating room deployment authorized.\n";
                    } else if (life.degreeEarned) {
                        life.money += 240000;
                        logResult += "Medical officer salary tier allocation processed: +$240,000.\n";
                    } else {
                        life.money -= 12000;
                        logResult += "Disbursed neuro-surgery specialty institute tuition metrics.\n";
                    }
                }
                else {
                    let tradingPayout = 32000 + (life.experience * 6000);
                    life.money += tradingPayout;
                    logResult += `Extracted capital out of market asset delta pools and software development bounties: +$${tradingPayout.toLocaleString()}.\n`;
                }
            } else {
                life.health = Math.min(100, life.health + 18);
                life.mental = Math.min(100, life.mental + 30);
                if (life.degreeEarned) {
                    let standardPay = life.careerTrack === 'tech' ? 90000 : 150000;
                    life.money += standardPay;
                    logResult += `Sustained automated background tasks. Salary distribution acquired: +$${standardPay.toLocaleString()}.\n`;
                } else {
                    life.money += 16000;
                    logResult += "Executed low-stakes manual freelance adjustments to offset basic resource costs. Momentum flattening.\n";
                }
            }

            // Core Matrix Event Engine Execution
            if (Math.random() > 0.28) {
                let ev = matrixEvents[Math.floor(Math.random() * matrixEvents.length)];
                
                if (ev.cryptoPump) {
                    if (life.crypto > 0) {
                        let gain = life.crypto * 15000;
                        life.money += gain;
                        logResult += `\n🚀 <span class="pos">[EVENT] CRYPTO MACRO RUN:</span> Extreme network buy pressure scales your wallet metrics: +$${gain.toFixed(2)}`;
                    } else {
                        logResult += `\n📈 [EVENT] Crypto market nodes spiked 60% macro wide, but you lack long crypto entries to realize deltas.`;
                    }
                } else if (ev.cryptoCrash) {
                    if (life.crypto > 0) {
                        if (life.hasHardwareWallet) {
                            life.crypto = life.crypto * 0.5; // Hardware wallet cuts loss severity in half
                            logResult += `\n📉 <span class="neg">[EVENT] CRYPTO LIQUIDATION CASCADES:</span> Decentralized markets dropped 80%. Your secure hardware wallet mitigated exchange default losses; net wallet drop: 50%.`;
                        } else {
                            life.crypto = life.crypto * 0.15; 
                            logResult += `\n💥 <span class="neg">[EVENT] EXCHANGE UNWIND CRASH:</span> Centralized trading venues dropped completely offline. Bare asset valuation decimated by 85%.`;
                        }
                    } else {
                        logResult += `\n📉 [EVENT] Bearish trends hit alt-coin tokens, but your balance sheets maintain zero exposure.`;
                    }
                } else {
                    let calculatedLoss = ev.money;
                    if (ev.needsInsuranceShield && life.hasInsurance) {
                        calculatedLoss = -200; 
                        logResult += `\n\n🛡️ [EVENT] ${ev.text}\n<span class="pos">*Your premium Health Insurance shielding system offset major clinical invoices! Deductible logged.*</span>`;
                    } else {
                        logResult += `\n\n⚠️ [EVENT] ${ev.text}`;
                    }
                    life.money += calculatedLoss;
                    life.health += ev.health;
                    life.mental += ev.mental;
                    life.credit = Math.max(300, Math.min(850, life.credit + ev.credit));
                }
            }

            textDisplay.innerHTML = logResult;
            renderStats();
            saveGame();
            buildMainControls();
        }

        function triggerGameOver(reason) {
            textDisplay.innerHTML = `<b class="neg">TIMELINE TERMINATION DETECTED:</b><br>${reason}<br><br>Profile Identity: ${life.name}<br>Terminal Structural Age: ${life.age}<br>Accumulated Progeny Links: ${life.childrenNames.length}<br>Final Liquidity: $${life.money.toLocaleString()}.`;
            actionsDisplay.innerHTML = `<button class="danger-btn" onclick="hardReset()">Purge Timeline Cache & Force Restart</button>`;
            localStorage.removeItem('quantum_life_mega_save');
        }

        function hardReset() {
            localStorage.removeItem('quantum_life_mega_save');
            life = { name: "Unknown", gender: "Unassigned", age: 18, money: 1500, health: 100, mental: 100, credit: 650, crypto: 0, careerTrack: "none", status: "High School Graduate", experience: 0, hasApartment: false, hasPenthouse: false, hasCar: false, hasSupercar: false, hasGymMembership: false, hasInsurance: false, hasHardwareWallet: false, isMarried: false, childrenNames: [], degreeEarned: false, initialized: false };
            initIdentityForm();
            document.getElementById('stat-identity').innerText = "Rebooting system framework...";
            renderStats();
        }

        loadGame();
    </script>
</body>
</html>
