<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vanguard: Deep Space Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; touch-action: none; }
        #ui { position: absolute; inset: 0; pointer-events: none; color: #00f2ff; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .stats { background: rgba(0,20,40,0.7); padding: 10px; border: 1px solid #00f2ff; width: 180px; font-size: 12px; }
        #joy-bound { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; border: 2px solid #00f2ff; border-radius: 50%; pointer-events: auto; }
        #joy-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #00f2ff; border-radius: 50%; box-shadow: 0 0 15px #00f2ff; }
        #fire-zone { position: absolute; right: 0; top: 0; bottom: 0; width: 50%; pointer-events: auto; }
        .speed-meter { height: 4px; background: #111; margin-top: 5px; width: 100%; }
        #speed-fill { height: 100%; width: 0%; background: #00f2ff; transition: width 0.1s; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stats">
        THRUST: <span id="speed-txt">0</span>%
        <div class="speed-meter"><div id="speed-fill"></div></div>
        HULL: <span id="hp-txt">100</span>%<br>
        HOSTILES: <span id="e-count">0</span>
    </div>
    <div id="joy-bound"><div id="joy-stick"></div></div>
    <div id="fire-zone"></div>
</div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>

<script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer, ship;
    let throttle = 0; // 0 to 1
    let turnSpeed = 0, pitchSpeed = 0;
    let velocity = new THREE.Vector3();
    let hp = 100, enemies = [], lasers = [];

    init();

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 15000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio > 1 ? 2 : 1);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x404040, 2));
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(5, 5, 5);
        scene.add(sun);

        // Planet
        const planet = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 32), new THREE.MeshStandardMaterial({color: 0x112244}));
        planet.position.set(0, -500, -1000);
        scene.add(planet);

        // Starfield
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<3000; i++) starPos.push((Math.random()-0.5)*10000, (Math.random()-0.5)*10000, (Math.random()-0.5)*10000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.5})));

        // Ship
        ship = new THREE.Group();
        const shipMesh = new THREE.Mesh(new THREE.ConeGeometry(0.5, 3, 4), new THREE.MeshStandardMaterial({color: 0x00f2ff}));
        shipMesh.rotation.x = Math.PI/2;
        ship.add(shipMesh);
        scene.add(ship);
        ship.add(camera);
        camera.position.set(0, 1.2, 6);

        // Mobile Controls
        const stick = document.getElementById('joy-stick');
        const bound = document.getElementById('joy-bound');
        bound.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            const r = bound.getBoundingClientRect();
            const dx = t.clientX - (r.left + 60);
            const dy = t.clientY - (r.top + 60);
            const d = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
            const a = Math.atan2(dy, dx);
            
            turnSpeed = -(Math.cos(a) * d) / 50;
            // Up/Down on joystick controls throttle
            const rawThrottle = -(Math.sin(a) * d) / 50; 
            throttle = Math.max(0, Math.min(1, throttle + rawThrottle * 0.05));
            
            stick.style.transform = `translate(${(Math.cos(a)*d)}px, ${(Math.sin(a)*d)}px)`;
        });
        bound.addEventListener('touchend', () => {
            turnSpeed = 0;
            stick.style.transform = `translate(0,0)`;
        });

        document.getElementById('fire-zone').addEventListener('touchstart', fire);

        // Keyboard
        window.onkeydown = (e) => {
            if(e.code === 'KeyW') throttle = Math.min(1, throttle + 0.1);
            if(e.code === 'KeyS') throttle = Math.max(0, throttle - 0.1);
            if(e.code === 'KeyA') turnSpeed = 1;
            if(e.code === 'KeyD') turnSpeed = -1;
            if(e.code === 'Space') fire();
        };
        window.onkeyup = (e) => { if(e.code === 'KeyA' || e.code === 'KeyD') turnSpeed = 0; };

        for(let i=0; i<8; i++) spawnEnemy();
        animate();
    }

    function spawnEnemy() {
        const e = new THREE.Mesh(new THREE.BoxGeometry(3, 1, 3), new THREE.MeshStandardMaterial({color: 0xff0055}));
        e.position.set((Math.random()-0.5)*1000, (Math.random()-0.5)*800, -1000);
        scene.add(e);
        enemies.push({mesh: e, hp: 100});
    }

    function fire() {
        const l = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 4), new THREE.MeshBasicMaterial({color: 0x00f2ff}));
        l.position.copy(ship.position);
        l.rotation.copy(ship.rotation);
        scene.add(l);
        lasers.push(l);
    }

    function animate() {
        requestAnimationFrame(animate);

        // Physics: Acceleration & Steering
        ship.rotation.y += turnSpeed * 0.04;
        const targetSpeed = throttle * -2.5;
        velocity.z = THREE.MathUtils.lerp(velocity.z, targetSpeed, 0.05);
        ship.translateZ(velocity.z);

        // Laser Logic
        lasers.forEach((l, i) => {
            l.translateZ(-6);
            if(l.position.distanceTo(ship.position) > 2000) {
                scene.remove(l); lasers.splice(i, 1);
            }
            enemies.forEach((en, ei) => {
                if(l.position.distanceTo(en.mesh.position) < 15) {
                    en.hp -= 50; scene.remove(l); lasers.splice(i, 1);
                    if(en.hp <= 0) { scene.remove(en.mesh); enemies.splice(ei, 1); }
                }
            });
        });

        // Simple Enemy AI
        enemies.forEach(en => {
            const dist = en.mesh.position.distanceTo(ship.position);
            if(dist < 1000) {
                en.mesh.lookAt(ship.position);
                en.mesh.translateZ(0.5); // Enemies chase you
            }
        });

        // UI
        document.getElementById('speed-fill').style.width = (throttle * 100) + "%";
        document.getElementById('speed-txt').innerText = Math.round(throttle * 100);
        document.getElementById('e-count').innerText = enemies.length;

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
