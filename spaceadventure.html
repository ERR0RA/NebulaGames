<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Space: Planetary Landing</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; color: #00f2ff; }
        #hud { position: absolute; inset: 0; pointer-events: none; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .stat-box { background: rgba(0, 20, 30, 0.7); padding: 10px; border: 1px solid #00f2ff; width: 200px; }
        #msg { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-size: 1.5rem; text-align: center; opacity: 0; transition: 0.5s; }
        #joystick { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; border: 2px solid #00f2ff; border-radius: 50%; pointer-events: auto; }
        #stick { position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: #00f2ff; border-radius: 50%; }
    </style>
</head>
<body>

<div id="hud">
    <div class="stat-box">
        ALTITUDE: <span id="alt">0</span><br>
        SPEED: <span id="spd">0</span><br>
        STATUS: <span id="status">ORBITING</span>
    </div>
    <div id="msg">STABILIZING FOR LANDING...</div>
    <div id="joystick"><div id="stick"></div></div>
</div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>

<script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer, ship, planet;
    let velocity = new THREE.Vector3();
    let isLanding = false;
    let input = { w: false, s: false, a: false, d: false };

    init();

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 10000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // Lights
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(500, 500, 500);
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x111122));

        // Planet
        const planetGeo = new THREE.SphereGeometry(300, 64, 64);
        const planetMat = new THREE.MeshStandardMaterial({ 
            color: 0x2244ff, 
            roughness: 0.8,
            metalness: 0.2,
            emissive: 0x001133
        });
        planet = new THREE.Mesh(planetGeo, planetMat);
        planet.position.set(0, -400, -800);
        scene.add(planet);

        // Atmosphere Glow
        const atmosGeo = new THREE.SphereGeometry(310, 32, 32);
        const atmosMat = new THREE.MeshBasicMaterial({ color: 0x00f2ff, transparent: true, opacity: 0.1, side: THREE.BackSide });
        const atmos = new THREE.Mesh(atmosGeo, atmosMat);
        planet.add(atmos);

        // Stars
        const stars = new THREE.BufferGeometry();
        const pos = [];
        for(let i=0; i<5000; i++) pos.push((Math.random()-0.5)*5000, (Math.random()-0.5)*5000, (Math.random()-0.5)*5000);
        stars.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        scene.add(new THREE.Points(stars, new THREE.PointsMaterial({color: 0xffffff, size: 2})));

        // AI Ships
        for(let i=0; i<5; i++) {
            const bot = new THREE.Mesh(new THREE.ConeGeometry(2, 8, 4), new THREE.MeshStandardMaterial({color: 0x555555}));
            bot.position.set(Math.random()*400-200, Math.random()*400, -200 - Math.random()*400);
            scene.add(bot);
        }

        // Ship
        ship = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 0.5, 3), new THREE.MeshStandardMaterial({color: 0x888888}));
        ship.add(body);
        scene.add(ship);
        camera.position.set(0, 2, 7);
        ship.add(camera);

        window.onkeydown = (e) => input[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => input[e.key.toLowerCase()] = false;

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);

        const distToPlanet = ship.position.distanceTo(planet.position) - 300;
        
        if (!isLanding) {
            if (input.w) velocity.z -= 0.1;
            if (input.s) velocity.z += 0.1;
            if (input.a) ship.rotation.y += 0.03;
            if (input.d) ship.rotation.y -= 0.03;
            
            velocity.multiplyScalar(0.97);
            ship.translateZ(velocity.z);
        }

        // Landing Logic
        if (distToPlanet < 10) {
            document.getElementById('msg').style.opacity = 1;
            if (Math.abs(velocity.z) < 0.5) {
                isLanding = true;
                document.getElementById('status').innerText = "LANDED";
                velocity.set(0,0,0);
            }
        } else {
            document.getElementById('msg').style.opacity = 0;
            document.getElementById('status').innerText = "IN FLIGHT";
        }

        document.getElementById('alt').innerText = Math.round(distToPlanet);
        document.getElementById('spd').innerText = (Math.abs(velocity.z) * 100).toFixed(0);

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
