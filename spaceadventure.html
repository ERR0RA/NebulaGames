<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vanguard Mobile VR</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; touch-action: none; }
        #ui { position: absolute; inset: 0; pointer-events: none; color: #00f2ff; padding: 20px; }
        .bar { width: 150px; height: 10px; border: 1px solid #00f2ff; margin-top: 5px; }
        #hp-fill { width: 100%; height: 100%; background: #ff0055; }
        
        /* Mobile Controls */
        #joy-bound { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; border: 2px solid rgba(0,242,255,0.3); border-radius: 50%; pointer-events: auto; }
        #joy-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #00f2ff; border-radius: 50%; box-shadow: 0 0 15px #00f2ff; }
        #fire-zone { position: absolute; inset: 0 0 0 50%; pointer-events: auto; } /* Tap right half to fire */
        
        #reset-btn { position: absolute; top: 20px; right: 20px; pointer-events: auto; background: none; border: 1px solid #ff0055; color: #ff0055; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="ui">
    <div>HULL INTEGRITY</div>
    <div class="bar"><div id="hp-fill"></div></div>
    <div id="joy-bound"><div id="joy-stick"></div></div>
    <div id="fire-zone"></div>
    <button id="reset-btn" onclick="location.reload()">EMERGENCY RESET</button>
</div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>

<script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer, ship, planet;
    let velocity = new THREE.Vector3(), input = { x: 0, y: 0 }, hp = 100;
    let enemies = [], lasers = [], asteroids = [];

    init();

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 15000);
        
        renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Simple stable lighting
        const ambient = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 3);
        sun.position.set(10, 10, 10);
        scene.add(sun);

        // Big Planet (Visual Anchor)
        planet = new THREE.Mesh(
            new THREE.SphereGeometry(500, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0x112244 })
        );
        planet.position.set(0, -600, -1200);
        scene.add(planet);

        // Asteroids
        const rockGeo = new THREE.DodecahedronGeometry(1, 0);
        for(let i=0; i<80; i++) {
            const rock = new THREE.Mesh(rockGeo, new THREE.MeshStandardMaterial({color: 0x444444}));
            rock.position.set((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
            rock.scale.setScalar(Math.random()*15 + 5);
            scene.add(rock);
            asteroids.push(rock);
        }

        // Ship Group
        ship = new THREE.Group();
        const body = new THREE.Mesh(new THREE.ConeGeometry(0.5, 3, 4), new THREE.MeshStandardMaterial({color: 0x00f2ff}));
        body.rotation.x = Math.PI/2;
        ship.add(body);
        scene.add(ship);
        
        camera.position.set(0, 1.5, 6);
        ship.add(camera);

        // Mobile Joystick Logic
        const stick = document.getElementById('joy-stick');
        const bound = document.getElementById('joy-bound');
        
        bound.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            const rect = bound.getBoundingClientRect();
            const dx = t.clientX - (rect.left + 60);
            const dy = t.clientY - (rect.top + 60);
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 45);
            const ang = Math.atan2(dy, dx);
            
            input.x = (Math.cos(ang) * dist) / 45;
            input.y = (Math.sin(ang) * dist) / 45;
            stick.style.transform = `translate(${input.x*45}px, ${input.y*45}px)`;
        });

        bound.addEventListener('touchend', () => {
            input.x = 0; input.y = 0;
            stick.style.transform = `translate(0,0)`;
        });

        document.getElementById('fire-zone').addEventListener('touchstart', fire);

        // Keyboard support
        window.onkeydown = (e) => {
            if(e.code === 'KeyW') input.y = -1;
            if(e.code === 'KeyS') input.y = 1;
            if(e.code === 'KeyA') input.x = -1;
            if(e.code === 'KeyD') input.x = 1;
            if(e.code === 'Space') fire();
        };
        window.onkeyup = () => { input.x = 0; input.y = 0; };

        spawnEnemies();
        animate();
    }

    function spawnEnemies() {
        for(let i=0; i<6; i++) {
            const e = new THREE.Mesh(new THREE.OctahedronGeometry(2), new THREE.MeshStandardMaterial({color: 0xff0055}));
            e.position.set((Math.random()-0.5)*800, (Math.random()-0.5)*800, -800);
            scene.add(e);
            enemies.push(e);
        }
    }

    function fire() {
        const l = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 2), new THREE.MeshBasicMaterial({color: 0xff0000}));
        l.position.copy(ship.position);
        l.rotation.copy(ship.rotation);
        scene.add(l);
        lasers.push(l);
    }

    function animate() {
        requestAnimationFrame(animate);

        // Movement
        ship.rotation.y -= input.x * 0.05;
        ship.rotation.x -= input.y * 0.03;
        
        velocity.z = -0.5; // Constant forward speed
        ship.translateZ(velocity.z);

        // Laser movement
        lasers.forEach((l, i) => {
            l.translateZ(-5);
            if(l.position.distanceTo(ship.position) > 1000) {
                scene.remove(l); lasers.splice(i, 1);
            }
        });

        // Crash logic (very simple for performance)
        asteroids.forEach(a => {
            if(ship.position.distanceTo(a.position) < a.scale.x + 1) {
                hp -= 1;
                document.getElementById('hp-fill').style.width = hp + "%";
            }
        });

        renderer.render(scene, camera);
    }

    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>
