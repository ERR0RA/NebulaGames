<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vanguard: Fixed Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; touch-action: none; }
        #ui { position: absolute; inset: 0; pointer-events: none; color: #00f2ff; padding: 20px; }
        .panel { background: rgba(0, 30, 50, 0.6); border: 1px solid #00f2ff; padding: 15px; width: 220px; border-radius: 8px; pointer-events: none; }
        .bar { width: 100%; height: 10px; background: #111; border: 1px solid #00f2ff; margin: 5px 0; position: relative; }
        #thr-fill { height: 100%; width: 0%; background: #00f2ff; box-shadow: 0 0 10px #00f2ff; transition: width 0.1s; }
        #joy-bound { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; border: 3px solid rgba(0, 242, 255, 0.3); border-radius: 50%; pointer-events: auto; }
        #knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #00f2ff; border-radius: 50%; box-shadow: 0 0 20px #00f2ff; }
        #fire-btn { position: absolute; bottom: 50px; right: 50px; width: 100px; height: 100px; background: rgba(255, 0, 85, 0.3); border: 3px solid #ff0055; border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center; color: #ff0055; font-weight: 900; }
    </style>
</head>
<body>

<div id="ui">
    <div class="panel">
        ENGINE OUTPUT: <span id="pwr-txt">0</span>%
        <div class="bar"><div id="thr-fill"></div></div>
        TITANS NEARBY: <span id="e-count">0</span>
    </div>
    <div id="joy-bound"><div id="knob"></div></div>
    <div id="fire-btn">FIRE</div>
</div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>

<script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer, ship;
    let throttle = 0; // The actual target speed
    let currentVel = 0; // The moving speed
    let turn = 0, pitch = 0;
    let enemies = [], lasers = [];

    init();

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 10000);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(5, 10, 5);
        scene.add(sun);

        // Grid/Stars for movement reference
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<3000; i++) starPos.push((Math.random()-0.5)*8000, (Math.random()-0.5)*8000, (Math.random()-0.5)*8000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 2})));

        // Player Ship
        ship = new THREE.Group();
        const body = new THREE.Mesh(new THREE.ConeGeometry(0.8, 4, 4), new THREE.MeshStandardMaterial({color: 0x00f2ff}));
        body.rotation.x = Math.PI/2;
        ship.add(body);
        scene.add(ship);
        ship.add(camera);
        camera.position.set(0, 2, 8);

        // JOYSTICK LOGIC
        const knob = document.getElementById('knob');
        const bound = document.getElementById('joy-bound');
        
        bound.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            const r = bound.getBoundingClientRect();
            const dx = t.clientX - (r.left + 60);
            const dy = t.clientY - (r.top + 60);
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
            const angle = Math.atan2(dy, dx);
            
            // Steering (Left/Right)
            turn = -(dx / 50); 
            // Acceleration (Up/Down)
            if (dy < -15) throttle = Math.min(1, throttle + 0.02); // Accelerate
            if (dy > 15) throttle = Math.max(0, throttle - 0.02);  // Decelerate
            
            knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
        });

        bound.addEventListener('touchend', () => {
            turn = 0;
            knob.style.transform = `translate(0,0)`;
        });

        document.getElementById('fire-btn').addEventListener('touchstart', fire);

        spawnEnemies();
        animate();
    }

    function spawnEnemies() {
        for(let i=0; i<4; i++) {
            const e = new THREE.Mesh(new THREE.BoxGeometry(25, 15, 50), new THREE.MeshStandardMaterial({color: 0xff0055}));
            e.position.set((Math.random()-0.5)*1500, (Math.random()-0.5)*500, -1000 - Math.random()*1000);
            scene.add(e);
            enemies.push(e);
        }
    }

    function fire() {
        const l = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 5), new THREE.MeshBasicMaterial({color: 0x00f2ff}));
        l.position.copy(ship.position);
        l.rotation.copy(ship.rotation);
        scene.add(l);
        lasers.push(l);
    }

    function animate() {
        requestAnimationFrame(animate);

        // Smooth physics
        currentVel = THREE.MathUtils.lerp(currentVel, throttle * 5, 0.05);
        ship.rotation.y += turn * 0.04;
        ship.translateZ(-currentVel);

        // Laser movement
        lasers.forEach((l, i) => {
            l.translateZ(-15);
            if(l.position.distanceTo(ship.position) > 2000) {
                scene.remove(l); lasers.splice(i, 1);
            }
        });

        // UI Update
        document.getElementById('thr-fill').style.width = (throttle * 100) + "%";
        document.getElementById('pwr-txt').innerText = Math.round(throttle * 100);
        document.getElementById('e-count').innerText = enemies.length;

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
